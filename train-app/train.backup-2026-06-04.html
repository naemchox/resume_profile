        <div className="rh-status">{raceStatusCopy(avatar.behavior, behind, formatHM(Math.round(gapMin) * 60), avatar.name)}</div>
      </div>
    </div>
  );
}

// 7-day schedule grid: Mon–Sun columns over one time axis, JEK's plan blocks per
// day, the whole week at a glance. Tap a day header or a block to open that day in
// the detailed Day view. Browse weeks with ‹ ›.
function WeekGrid({ avatar, activities, schedule, done, now, tickets, onOpenDay, onToggleDone, onEditBlock, onMoveBlock, onResizeBlock, onUnrest, onMoveAllForActivity, onResizeAllForActivity }) {
  const [weekOffset, setWeekOffset] = React.useState(0);
  const [dateOpen, setDateOpen] = React.useState(false); // themed date-jump calendar (matches Day mode)
  const scrollRef = React.useRef(null);
  // Jump to whichever week contains the picked date.
  const pickWeek = (ts) => {
    const off = Math.round((startOfWeek(ts) - startOfWeek(now)) / (7 * 86400000));
    setWeekOffset(off);
  };
  const SC = 0.85; // px per minute — taller bands so blocks read clearly (empty time is collapsed)
  const todayStart = startOfDay(now);
  const weekStart = addDays(startOfWeek(now), weekOffset * 7);
  const nowMin = nowMinutes(now);
  const restDays = avatar.restDays || [];
  const [drag, setDrag] = React.useState(null); // live preview while moving/resizing a block
  const [selectAll, setSelectAll] = React.useState(false); // "move all days" mode: a drag shifts every day of the grabbed task
  // Pointer-drag the block body to MOVE it in time (preserving duration); a quick
  // tap with no movement opens the editor. The drag preview is scoped to the column
  // being dragged (blockId + dayIdx) so only that day moves on screen, and the commit
  // splits that weekday off into its own block — other days keep the original time.
  // Vertical pointer-drag that AUTO-SCROLLS the timeline when you reach the top or
  // bottom edge, so a block can be dragged to a time that's off-screen. The delta is
  // computed in CONTENT space (scrollTop + pointer), so the auto-scroll is folded in
  // and the block keeps following the pointer as the view scrolls under it.
  const dragVert = (e, { onDelta, onCommit, onTap }) => {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    const cont = scrollRef.current;
    const rect = cont ? cont.getBoundingClientRect() : { top: 0, bottom: 99999 };
    const content0 = (cont ? cont.scrollTop : 0) + (e.clientY - rect.top);
    const m0 = toMin(content0); // start time under the pointer, on the compressed axis
    const st = { moved: false, delta: 0 };
    let clientY = e.clientY, raf = 0;
    const EDGE = 52, MAX = 16; // edge-zone height (px) and max scroll speed (px/frame)
    const recompute = () => {
      const contentY = (cont ? cont.scrollTop : 0) + (clientY - rect.top);
      if (!st.moved && Math.abs(contentY - content0) < 4) return;
      st.moved = true;
      // Delta in MINUTES via the inverse axis map, so a move snaps to real times even
      // across the compressed empty gaps (not raw pixels / SC, which would skew).
      st.delta = Math.round((toMin(contentY) - m0) / 5) * 5;
      onDelta(st.delta);
    };
    const tick = () => {
      if (cont) {
        let dv = 0;
        if (clientY < rect.top + EDGE) dv = -Math.ceil((rect.top + EDGE - clientY) / EDGE * MAX);
        else if (clientY > rect.bottom - EDGE) dv = Math.ceil((clientY - (rect.bottom - EDGE)) / EDGE * MAX);
        if (dv) {
          const before = cont.scrollTop;
          cont.scrollTop = Math.max(0, Math.min(cont.scrollHeight - cont.clientHeight, before + dv));
          if (cont.scrollTop !== before) recompute(); // keep following while it scrolls
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const move = (ev) => { clientY = ev.clientY; recompute(); };
    const end = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      cancelAnimationFrame(raf);
      if (!st.moved) { onTap && onTap(); } else { onCommit && onCommit(st.delta); }
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', end);
  };
  const startMove = (e, b, d) => dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'move', scope: selectAll ? 'activity' : 'day', blockId: b.id, dayIdx: d.idx, activityId: b.activityId, delta }),
    onTap: () => onEditBlock(b),
    onCommit: (delta) => {
      setDrag(null);
      if (selectAll) { onMoveAllForActivity(b.activityId, delta); return; }
      const dur = b.end - b.start;
      const ns = Math.max(0, Math.min(1440 - dur, b.start + delta));
      onMoveBlock(b.id, ns, ns + dur, d.idx, d.ts);
    },
  });
  // Drag the bottom grip to RESIZE the block's end time (whole task in select-all mode).
  const startResize = (e, b, d) => { e.stopPropagation(); dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'resize', scope: selectAll ? 'activity' : 'day', blockId: b.id, dayIdx: d.idx, activityId: b.activityId, delta }),
    onCommit: (delta) => {
      setDrag(null);
      if (selectAll) { onResizeAllForActivity(b.activityId, delta); return; }
      const ne = Math.max(b.start + 5, Math.min(1440, b.end + delta));
      onResizeBlock(b.id, ne, d.idx, d.ts);
    },
  }); };
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = Math.max(0, toY(weekOffset === 0 ? nowMin : 480) - 120);
  }, [weekOffset]);
  // First day you ever checked anything off — days before this aren't graded (you
  // shouldn't be faulted for days before you started using the app), same as History.
  const earliest = earliestTrackedDay(done, now);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const ts = addDays(weekStart, i);
    const dStart = startOfDay(ts);
    const isToday = dStart === todayStart, isPast = dStart < todayStart, isFuture = dStart > todayStart;
    const blocks = blocksForDay(schedule, i);
    const dmap = done[dayKey(ts)] || {};
    // Per-day "kept up" grade for the column header — mirrors weekStats/Day mode so the
    // numbers always agree: rested days & whole-day tickets aren't graded; today counts
    // only up to now; the future & pre-tracking days don't count; hobby + task-excused
    // blocks drop out. pct === null → the header shows a neutral mark, not a red 0%.
    const isRestDay = restDays.indexOf(i) !== -1;
    const dayTicketed = isTicketed(tickets, ts);
    const beforeTracking = isPast && dStart < earliest;
    const gblocks = (isRestDay || dayTicketed) ? [] : gradedBlocks(blocks, tickets, ts, activities);
    const cap = isFuture ? 0 : (isToday ? nowMin : 1440);
    const pct = (isRestDay || dayTicketed || beforeTracking) ? null : dayCredit(gblocks, dmap, cap, activities).pct;
    days.push({ idx: i, ts, isToday, isPast, isFuture, offset: Math.round((dStart - todayStart) / 86400000),
      blocks, dmap, isRestDay, dayTicketed, plannedCount: gblocks.length, pct });
  }
  // ── Continuous time axis (Google-Calendar style) ──────────────────────────────
  // One uninterrupted span from just before the first block to just after the last,
  // so hours read straight through with no collapsed gaps. toY: minutes→px (linear);
  // toMin: its inverse (used by the drag math). SC px/min sets the row height.
  const TOP_PAD = 6;
  let lo = 24 * 60, hi = 0;
  for (const d of days) for (const b of d.blocks) { lo = Math.min(lo, b.start); hi = Math.max(hi, b.end); }
  if (weekOffset === 0) { lo = Math.min(lo, nowMin); hi = Math.max(hi, nowMin); } // keep the now-line in range
  if (lo > hi) { lo = 8 * 60; hi = 18 * 60; }            // empty week → a sensible default span
  lo = Math.max(0, Math.floor((lo - 30) / 60) * 60);     // pad out to whole hours
  hi = Math.min(1440, Math.ceil((hi + 30) / 60) * 60);
  const CANVAS_H = TOP_PAD * 2 + (hi - lo) * SC;
  const toY = (min) => TOP_PAD + (Math.max(lo, Math.min(hi, min)) - lo) * SC;
  const toMin = (yy) => Math.max(lo, Math.min(hi, lo + (yy - TOP_PAD) / SC));
  const hourMarks = [];
  for (let h = Math.ceil(lo / 60) * 60; h <= hi; h += 60) hourMarks.push(h);
  const halfMarks = [];
  for (let h = Math.ceil(lo / 30) * 30; h < hi; h += 30) if (h % 60 !== 0) halfMarks.push(h);
  const wEnd = addDays(weekStart, 6);
  const rangeLabel = new Date(weekStart).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    + ' – ' + new Date(wEnd).toLocaleDateString('en-US', { day: 'numeric' });
  // Week rollup for the "kept" pill — same scoring as the History "This week" card.
  const stats = weekStats(schedule, done, weekStart, now, earliest, restDays, tickets, activities);
  const keptClass = stats.finishedPlanned === 0 ? 'dim'
    : stats.keptCount === stats.finishedPlanned ? 'good'
    : stats.keptCount / stats.finishedPlanned >= 0.5 ? 'mid' : 'bad';
  return (
    <div className="wg-wrap">
      <div className="cal-head wg-nav">
        <button className="cal-nav" onClick={() => setWeekOffset(o => o - 1)} aria-label="Previous week">‹</button>
        <div className="cal-date">
          <button className="cal-date-pick" onClick={() => setDateOpen(o => !o)} aria-label="Pick a week">
            <span className="cal-date-main">{weekOffset === 0 ? 'This week' : rangeLabel}</span>
            <span className="cal-date-caret">▾</span>
          </button>
          {dateOpen && (
            <DatePopover value={weekStart}
              onPick={(ts) => pickWeek(ts)}
              onClose={() => setDateOpen(false)} />
          )}
        </div>
        <button className="cal-nav" onClick={() => setWeekOffset(o => o + 1)} aria-label="Next week">›</button>
        {stats.finishedPlanned > 0
          ? <span className={'wg-kept ' + keptClass} title="Days you kept up with your committed self">{stats.keptCount}/{stats.finishedPlanned} kept</span>
          : <span className="wg-kept dim" title="Nothing graded yet this week">— kept</span>}
      </div>
      <div className="wg-tools">
        <span className="wg-hint">{selectAll ? 'Drag a block — every day shifts together' : 'Drag a block to reschedule · tap to edit'}</span>
        <button className={'wg-allbtn' + (selectAll ? ' on' : '')} onClick={() => setSelectAll(v => !v)} aria-pressed={selectAll}>
          {selectAll ? '✓ ' : ''}Move all days
        </button>
      </div>
      <div className="wg-head">
        <div className="wg-corner" />
        {days.map(d => (
          <button key={d.idx} className={'wg-dh' + (d.isToday ? ' today' : '')} onClick={() => onOpenDay(d.offset)}>
            <span className="wg-dh-dow">{WEEKDAYS[d.idx]}</span>
            <span className="wg-dh-num">{new Date(d.ts).getDate()}</span>
            {/* At-a-glance kept-up grade dot (precise % is one tap away in Day view). */}
            {d.isRestDay
              ? <span className="wg-dh-rest" title="Rest day">🌿</span>
              : d.dayTicketed
                ? <span className="wg-dh-rest" title="Whole day excused"><span className="tix-tilt">🎟️</span></span>
                : d.isFuture
                  ? <span className="wg-dot dim" title="Upcoming" />
                  : (d.plannedCount === 0 || d.pct == null)
                    ? <span className="wg-dh-none" title="Nothing planned">·</span>
                    : <span className={'wg-dot ' + (d.pct >= 100 ? 'good' : d.pct >= 60 ? 'mid' : 'bad')} title={d.pct + '% kept up'} />}
          </button>
        ))}
      </div>
      <div className="wg-scroll" ref={scrollRef}>
        <div className="wg-canvas" style={{ height: CANVAS_H }}>
          {hourMarks.map(h => (
            <React.Fragment key={h}>
              <div className="wg-hline" style={{ top: toY(h) }} />
              <div className="wg-hlabel" style={{ top: toY(h) }}>{fmtHourLabel(h)}</div>
            </React.Fragment>
          ))}
          {halfMarks.map(h => <div key={'hm' + h} className="wg-half" style={{ top: toY(h) }} />)}
          <div className="wg-cols">
            {days.map(d => {
              const isRest = restDays.indexOf(d.idx) !== -1;
              return (
                <div key={d.idx} className={'wg-col' + (d.isToday ? ' today' : '') + (isRest ? ' rest' : '')}>
                  {d.blocks.map(b => {
                    const a = findActivity(activities, b.activityId);
                    const col = a ? a.color : '#64748b';
                    const isDone = blockSegs(d.dmap, b).length > 0;
                    const ended = d.isPast || (d.isToday && nowMin >= b.end);
                    const excused = isTicketed(tickets, d.ts) || blockTicketed(tickets, d.ts, b.id);
                    const missed = ended && !isDone && !excused;
                    const name = a ? a.name : 'Deleted';
                    // Live drag preview: shift/resize this column's block (or every day's, in
                    // "move all" mode) so it follows the pointer before the move commits.
                    const isDragged = drag && (drag.scope === 'activity'
                      ? drag.activityId === b.activityId
                      : drag.blockId === b.id && drag.dayIdx === d.idx);
                    let bStart = b.start, bEnd = b.end;
                    if (isDragged) {
                      const dur = b.end - b.start;
                      if (drag.mode === 'move') { bStart = Math.max(0, Math.min(1440 - dur, b.start + drag.delta)); bEnd = bStart + dur; }
                      else { bEnd = Math.max(b.start + 5, Math.min(1440, b.end + drag.delta)); }
                    }
                    const height = Math.max(16, toY(bEnd) - toY(bStart));
                    // Drag the body to reschedule, the bottom grip to resize, tap to edit.
                    return (
                      <div key={b.id} role="button" tabIndex={0}
                        className={'wg-block' + (isDone ? ' done' : '') + (missed ? ' missed' : '') + (isDragged ? ' dragging' : '')}
                        style={{ top: toY(bStart), height, background: col + (isDone ? '55' : '26'), borderLeftColor: col }}
                        onPointerDown={(e) => startMove(e, b, d)}
                        title={name + ' ' + fmtClock(bStart) + '–' + fmtClock(bEnd)}>
                        <span className="wg-block-top">
                          <span className="wg-block-emoji">
                            {excused
                              ? <ActionEmoji code="1f4a4" size={13} label={name + ' is resting'} fallback="💤" />
                              : <ActionEmoji code={a && a.emoji} size={13} label={name} fallback={taskGlyph(a)} />}
                          </span>
                          <span className="wg-block-time">{fmtRangeShort(bStart, bEnd)}</span>
                        </span>
                        {height >= 30 && <span className="wg-block-name">{name}</span>}
                        {isDone && <span className="wg-block-chk">✓</span>}
                        <div className="wg-block-resize" onPointerDown={(e) => startResize(e, b, d)} aria-label="Resize block" />
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
          {weekOffset === 0 && <div className="wg-now" style={{ top: toY(nowMin) }}><span className="wg-now-dot" /></div>}
        </div>
      </div>
    </div>
  );
}

// Week view: this week's progress for the committed self vs you — total TIME
// (settled so far: past days full, today up to now) plus per-activity WORK amount
// (pages/km/reps — can't be summed across units, so one row each). Navigable by week.
function WeekView({ avatar, activities, schedule, done, now }) {
  const [weekOffset, setWeekOffset] = React.useState(0);
  const weekStart = addDays(startOfWeek(now), weekOffset * 7);
  const todayStart = startOfDay(now);
  const nowMin = nowMinutes(now);
  const restDays = avatar.restDays || [];

  const days = [];
  let planMin = 0, doneMin = 0;
  const amountMap = {};
  const sessionMap = {}; // scheduled sessions this week per activity (drives per-session goal rollup)
  for (let i = 0; i < 7; i++) {
    const ts = addDays(weekStart, i);
    const dStart = startOfDay(ts);
    const isToday = dStart === todayStart;
    const isFuture = dStart > todayStart;
    const idx = dayIndexMon(ts);
    const isRest = restDays.indexOf(idx) !== -1;
    const blocks = blocksForDay(schedule, idx).filter(b => notHobby(b, activities)); // hobbies don't race → excluded from the week's bars
    if (!isRest) for (const b of blocks) sessionMap[b.activityId] = (sessionMap[b.activityId] || 0) + 1;
    const dmap = done[dayKey(ts)] || {};
    const cap = isFuture ? 0 : (isToday ? nowMin : 1440);
    const sc = dayScore(blocks, dmap, cap);   // pure time → the JEK/ME bars
    const gr = dayCredit(blocks, dmap, cap, activities);  // amount-aware grade → kept status
    planMin += sc.planMin; doneMin += sc.doneMin;
    let status;
    if (isRest) status = 'rest';
    else if (blocks.length === 0) status = 'none';
    else if (isFuture) status = 'future';
    else {
      const ok = gr.plan > 0 && gr.done >= gr.plan;
      status = ok ? 'kept' : (isToday ? 'today' : 'behind');
    }
    days.push({ dow: i, status, isToday });
    if (isFuture) continue;
    for (const b of blocks) {
      const e = dmap[b.id];
      if (e && typeof e === 'object' && typeof e.amount === 'number' && e.amount > 0) {
        (amountMap[b.activityId] || (amountMap[b.activityId] = 0));
        amountMap[b.activityId] += e.amount;
      }
    }
  }
  const gapMin = Math.max(0, planMin - doneMin);
  const hasPlan = planMin > 0;
  const timePct = hasPlan ? Math.round(doneMin / planMin * 100) : null;
  // Weekly goals = per-session amount goal × sessions this week, vs amount logged.
  const amountRows = activities
    .map(a => ({ act: a, per: actAmtTarget(a), done: amountMap[a.id] || 0, sess: sessionMap[a.id] || 0 }))
    .filter(r => r.per > 0 || r.done > 0)
    .map(r => ({ act: r.act, target: r.per > 0 ? r.per * r.sess : 0, done: r.done }));
  const wEnd = addDays(weekStart, 6);
  const rangeLabel = new Date(weekStart).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    + ' – ' + new Date(wEnd).toLocaleDateString('en-US', { day: 'numeric' });

  return (
    <div className="wk-wrap">
      <div className="cal-head">
        <button className="cal-nav" onClick={() => setWeekOffset(o => o - 1)} aria-label="Previous week">‹</button>
        <div className="cal-date">
          <span className="cal-date-main">{weekOffset === 0 ? 'This week' : rangeLabel}</span>
        </div>
        <button className="cal-nav" onClick={() => setWeekOffset(o => o + 1)} aria-label="Next week">›</button>
        {timePct !== null
          ? <span className={'cal-pill' + (timePct >= 100 ? ' good' : timePct >= 60 ? ' mid' : ' bad')}>{timePct}% · {formatHM(Math.round(doneMin) * 60)}</span>
          : <span className="cal-pill plan">—</span>}
      </div>

      <div className="wk-scroll">
        {hasPlan
          ? <RaceHeader avatar={avatar} youMin={doneMin} avatarMin={planMin} dayTotal={planMin} gapMin={gapMin} />
          : <div className="rh idle"><span className="rh-face">{renderFace(avatar.emoji, 38)}</span><div className="rh-bars"><div className="rh-status" style={{ textAlign: 'left' }}>No plan this week yet. Add blocks on the Day view.</div></div></div>}

        <div className="wk-strip">
          {days.map((d, i) => (
            <div key={i} className={'wk-day' + (d.isToday ? ' today' : '')}>
              <span className="wk-day-lbl">{WEEKDAYS[i]}</span>
              <span className={'wk-day-glyph ' + d.status}>{WEEK_GLYPH[d.status]}</span>
            </div>
          ))}
        </div>

        {amountRows.length > 0 && (
          <React.Fragment>
            <div className="section-label" style={{ margin: '6px 0 4px' }}>Weekly goals</div>
            <div className="wk-amts">
              {amountRows.map(r => {
                const pct = r.target > 0 ? Math.min(100, Math.round(r.done / r.target * 100)) : 0;
                const unit = r.act.unit || '';
                return (
                  <div key={r.act.id} className="wk-amt-row">
                    <span className="wk-amt-emoji">
                      <ActionEmoji code={r.act.emoji} size={20} fallback={TASK_EMOJI_CHAR[r.act.emoji] || glyphFromCode(r.act.emoji) || '•'} label={r.act.name} />
                    </span>
                    <div className="wk-amt-body">
                      <div className="wk-amt-top">
                        <span className="wk-amt-name">{r.act.name}</span>
                        <span className="wk-amt-val">{r.target > 0 ? r.done + '/' + r.target + (unit ? ' ' + unit : '') + ' · ' + pct + '%' : r.done + (unit ? ' ' + unit : '') + ' logged'}</span>
                      </div>
                      {r.target > 0 && <div className="wk-amt-track"><div className="wk-amt-fill" style={{ width: pct + '%', background: r.act.color }} /></div>}
                    </div>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// Minimal line-style speech-bubble (matches the flat ⤲ / × glyphs; inherits color).
function CommentIcon({ size = 12 }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor"
      strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{ display: 'block' }}>
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
  );
}

// A popover anchored below its block (top:100%) overflows when the block sits near
// the bottom of the timeline. This flips it ABOVE the block (adds an `.up` class)
// whenever opening it below would spill past the visible bottom of the scroll area.
// `key` is the open indicator (a block id or boolean); re-measures whenever it changes.
function useFlipUp(key) {
  const ref = React.useRef(null);
  const [flip, setFlip] = React.useState(false);
  React.useLayoutEffect(() => {
    if (!key) { setFlip(false); return; }
    const el = ref.current;
    if (!el) return;
    const scroller = el.closest('.tl-scroll');
    const limit = scroller ? scroller.getBoundingClientRect().bottom : window.innerHeight;
    const r = el.getBoundingClientRect();
    setFlip(r.bottom > limit - 6); // spills past the visible bottom → open upward instead
  }, [key]);
  return [ref, flip];
}

// One of YOUR actual sessions in the ME lane. Pointer-drag the body to move it in
// time, drag the bottom grip to resize, ⤲ to split into two, × to remove.
function MeSeg({ seg, name, y, scale, free, onChange, onSplit, onRemove, note, onNote, selected, onSelect, col, cols, emoji, emojiFallback }) {
  const [preview, setPreview] = React.useState(null);
  const [noteOpen, setNoteOpen] = React.useState(false);
  const [draft, setDraft] = React.useState(note || '');
  const [notePopRef, notePopUp] = useFlipUp(noteOpen);
  React.useEffect(() => { setDraft(note || ''); }, [note]);
  const saveNote = () => { if (onNote) onNote(draft); setNoteOpen(false); };
  // Clicking anywhere outside the note popup closes it (discarding unsaved edits).
  // The popup stops pointer propagation, so this window listener only sees outside taps.
  React.useEffect(() => {
    if (!noteOpen) return;
    const closeOnOutside = () => { setDraft(note || ''); setNoteOpen(false); };
    window.addEventListener('pointerdown', closeOnOutside);
    return () => window.removeEventListener('pointerdown', closeOnOutside);
  }, [noteOpen, note]);
  const cur = preview || seg;
  const top = y(cur.start);
  // Selected session expands so its controls fit; unselected ones are compact pills.
  // BUT while actively dragging the resize grip, let the pill shrink to its true height
  // (small floor) so you can SEE it go below 15 min down to the 5-min minimum — the
  // normal min-height otherwise pins short sessions and makes the resize feel stuck.
  const minH = preview ? 12 : (selected ? 46 : 30);
  const height = Math.max(minH, (cur.end - cur.start) * scale);
  // When sessions overlap, unselected ones share the ME lane in side-by-side columns.
  // The selected (or dragging) one takes the FULL lane so its controls have room.
  const n = cols || 1, c = col || 0;
  const colStyle = (n > 1 && !preview && !selected)
    ? { left: 'calc(46px + (49% - 46px) * ' + c + ' / ' + n + ')', width: 'calc((49% - 46px) / ' + n + ' - 2px)', right: 'auto' }
    : null;
  const startDrag = (mode, e) => {
    e.preventDefault(); e.stopPropagation();
    const y0 = e.clientY, start0 = seg.start, end0 = seg.end;
    let latest = { start: start0, end: end0 };
    let moved = false;
    const move = (ev) => {
      if (Math.abs(ev.clientY - y0) > 4) moved = true; // real drag vs a tap
      const dm = Math.round(((ev.clientY - y0) / scale) / 5) * 5; // snap 5 min
      let s = start0, en = end0;
      if (mode === 'move') { s += dm; en += dm; if (s < 0) { en -= s; s = 0; } if (en > 1440) { s -= (en - 1440); en = 1440; } }
      else { en = Math.max(start0 + 5, Math.min(1440, end0 + dm)); }
      latest = { start: s, end: en };
      setPreview(latest);
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      setPreview(null);
      // A plain tap selects/deselects (revealing controls); a real drag commits.
      if (!moved) { if (mode === 'move' && onSelect) onSelect(); return; }
      onChange(latest);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className={'tl2 me' + (preview ? ' dragging' : '') + (free ? ' free' : '') + (selected ? ' sel' : '') + (noteOpen ? ' noting' : '')} style={{ top, height, ...colStyle }}>
      <div className="meseg-grab" onPointerDown={(e) => startDrag('move', e)}>
        {emoji
          ? <ActionEmoji code={emoji} size={18} label={name} className="meseg-emoji" fallback={emojiFallback} />
          : <span className="tl2-check on">✓</span>}
        <span className="meseg-info">
          <span className="tl2-name">{name}{note ? <span className="meseg-note-flag" title={note}><CommentIcon size={9} /></span> : null}</span>
          <span className="meseg-time">{fmtClock(cur.start)}–{fmtClock(cur.end)} · {fmtDur(cur.end - cur.start)}</span>
        </span>
      </div>
      {selected && onNote && <button className={'meseg-btn note' + (note ? ' has' : '')} onPointerDown={(e) => e.stopPropagation()} onClick={() => setNoteOpen(v => !v)} aria-label="Comment on session"><CommentIcon size={12} /></button>}
      {selected && <button className="meseg-btn split" onPointerDown={(e) => e.stopPropagation()} onClick={onSplit} aria-label="Split session">⤲</button>}
      {selected && <button className="meseg-btn del" onPointerDown={(e) => e.stopPropagation()} onClick={onRemove} aria-label="Remove session">×</button>}
      {noteOpen && onNote && (
        <div className={'meseg-note-pop' + (notePopUp ? ' up' : '')} ref={notePopRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
          <textarea className="meseg-note-area" autoFocus rows={3} maxLength={500} placeholder={'How did ' + name + ' go?'}
            value={draft} onChange={(e) => setDraft(e.target.value)} />
          <div className="meseg-note-actions">
            <button className="meseg-note-cancel" onClick={() => { setDraft(note || ''); setNoteOpen(false); }}>Cancel</button>
            <button className="meseg-note-save" onClick={saveNote}>Save</button>
          </div>
        </div>
      )}
      {/* Resize grip is always available (even on small overlapping pills); split/× need selecting. */}
      <div className="meseg-resize" onPointerDown={(e) => startDrag('resize', e)} aria-label="Resize" />
    </div>
  );
}

// When several sessions of the SAME activity overlap, they collapse into ONE pill
// spanning their union (instead of shattering into unreadable columns). Read-only
// summary: emoji + name + ×N + the combined time range; selecting it reveals a single
// × that un-logs the whole cluster (granular un-checking still lives on the plan side).
function MeMergedSeg({ start, end, name, emoji, emojiFallback, y, scale, col, cols, count, selected, onSelect, onRemoveAll }) {
  const top = y(start);
  const height = Math.max(selected ? 46 : 30, (end - start) * scale);
  const n = cols || 1, c = col || 0;
  // Share the lane in columns only while unselected; selecting takes the full width.
  const colStyle = (n > 1 && !selected)
    ? { left: 'calc(46px + (49% - 46px) * ' + c + ' / ' + n + ')', width: 'calc((49% - 46px) / ' + n + ' - 2px)', right: 'auto' }
    : null;
  return (
    <div className={'tl2 me merged' + (selected ? ' sel' : '')} style={{ top, height, ...colStyle }}>
      <button type="button" className="meseg-grab" onClick={onSelect} aria-label={'Merged ' + name + ' sessions'}>
        {emoji
          ? <ActionEmoji code={emoji} size={18} label={name} className="meseg-emoji" fallback={emojiFallback} />
          : <span className="tl2-check on">✓</span>}
        <span className="meseg-info">
          <span className="tl2-name">{name}<span className="meseg-count">×{count}</span></span>
          <span className="meseg-time">{fmtClock(start)}–{fmtClock(end)} · {fmtDur(end - start)}</span>
        </span>
      </button>
      {selected && <button className="meseg-btn del" onPointerDown={(e) => e.stopPropagation()} onClick={onRemoveAll} aria-label={'Remove all ' + count + ' ' + name + ' sessions'}>×</button>}
    </div>
  );
}

function TwoLaneTimeline({ blocks, activities, nowMin, isToday, daySeed, weekday, avatarEmoji, avatarName, behavior, lively, getSegs, onToggle, getSub, onSetSegs, onEdit, getAmount, onSetAmount, getWeekAmount, getNote, onSetNote, freeSessions, onAddFree, onSetFree, onSplitFree, onRemoveFree, onDragCreate, onResizeBlock, onMoveBlock, isExcused, isBlockExcused, onUnrest, onDeleteBlock, onSplitBlock }) {
  const scrollRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const [dragSel, setDragSel] = React.useState(null); // { lane, a, b } while dragging
  const [movePreview, setMovePreview] = React.useState(null); // { id, start, end } while dragging a plan block
  const [selSeg, setSelSeg] = React.useState(null); // key of the ME session showing its controls
  const [selHobby, setSelHobby] = React.useState(null); // id of the for-me block showing its controls (tap to highlight, like a ME session)
  const [logBlk, setLogBlk] = React.useState(null); // id of the avatar block whose amount/percent logger popover is open
  const [logDraft, setLogDraft] = React.useState(0); // unsaved amount in the open logger — committed only on Save (mirrors the note box)
  const [logCheck, setLogCheck] = React.useState(false); // true when the logger was opened by tapping the ✓ rail (so Save also marks the block done, not just logs a number)
  const [goalPopRef, goalPopUp] = useFlipUp(logBlk);
  const [noteBlk, setNoteBlk] = React.useState(null); // for-me block whose note editor is open
  const [noteDraft, setNoteDraft] = React.useState('');
  const [noteFlipRef, noteFlipUp] = useFlipUp(noteBlk); // flip the amount/percent logger above its block when it'd spill off the bottom
  // Poking the avatar on a LIVE job block: a wiggle + a personality reaction bubble.
  // Keyed by block id so only the poked block reacts; auto-clears after a beat.
  const [workPoke, setWorkPoke] = React.useState(null); // { id, msg, emoji, n }
  const workPokeRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(workPokeRef.current), []);
  const pokeWork = (blockId, resting) => {
    // While a habit is rested (ticket), the avatar reacts to the BREAK in its voice;
    // otherwise it reacts to being interrupted mid-work.
    const set = resting ? REST_POKE_LINES : WORK_POKE_LINES;
    const lines = set[behavior] || set.coach;
    const pick = lines[Math.floor(Math.random() * lines.length)];
    setWorkPoke(p => ({ id: blockId, msg: pick.msg, emoji: pick.emoji, n: (p ? p.n : 0) + 1 }));
    clearTimeout(workPokeRef.current);
    workPokeRef.current = setTimeout(() => setWorkPoke(null), 2600);
  };
  const SCALE = 1.4, PAD = 18;
  const free = freeSessions || [];
  const starts = blocks.map(b => b.start);
  const ends = blocks.map(b => b.end);
  let anchors = starts.concat(ends);
  for (const f of free) { anchors.push(f.start, f.end); }
  if (isToday) anchors = anchors.concat(nowMin);
  // Empty day: show a generous window so the page still reads as a calendar
  // (a few hours before "now"/9 AM through the rest of the working day).
  if (!blocks.length && !free.length) {
    const base = isToday ? nowMin : 540;
    anchors.push(Math.max(0, base - 120), Math.min(1440, base + 300));
  }
  // Render the full 24-hour day (12 AM–12 AM) so every time is reachable; the
  // view auto-scrolls to "now" (or the first block) on open so you land in place.
  const lo = 0;
  const hi = 1440;
  const y = (m) => (m - lo) * SCALE + PAD;
  const H = (hi - lo) * SCALE + PAD * 2;
  const hours = [];
  for (let h = lo; h < hi; h += 60) hours.push(h); // 12 AM … 11 PM (skip the 1440 edge)

  React.useEffect(() => {
    if (!scrollRef.current) return;
    const focus = isToday ? nowMin : (starts.length ? Math.min.apply(null, starts) : lo);
    scrollRef.current.scrollTop = Math.max(0, y(focus) - 150);
  }, []);

  // Google-Calendar-style drag-to-create: drag on an empty lane to draw a box.
  // Left lane → a ME session, right lane → a JEK plan block (opens the sheet
  // prefilled with the dragged time range). Snaps to 5 min.
  const minFromY = (py) => Math.max(lo, Math.min(hi, Math.round((lo + (py - PAD) / SCALE) / 5) * 5));
  // Drag the bottom grip of a JEK (plan) block to change its end time (live).
  const startBlockResize = (e, b) => {
    if (!onResizeBlock) return;
    e.preventDefault(); e.stopPropagation();
    const canvas = e.currentTarget.closest('.tl-canvas');
    const move = (ev) => {
      if (!canvas) return;
      const r = canvas.getBoundingClientRect();
      const end = Math.max(b.start + 5, Math.min(1440, minFromY(ev.clientY - r.top)));
      onResizeBlock(b.id, end);
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
  };
  // Pointer-drag the body of a JEK (plan) block to MOVE it in time (preserves
  // duration, snaps 5 min, live preview) — same feel as a ME session box. A plain
  // tap (no drag) opens the editor instead.
  const startBlockMove = (e, b, hobby) => {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const canvas = e.currentTarget.closest('.tl-canvas');
    const scroller = scrollRef.current;
    const dur = b.end - b.start;
    // Pointer position in MINUTES over the canvas — re-reads the canvas rect each
    // call, so it stays correct even as the timeline auto-scrolls under the finger.
    const pmFromY = (clientY) => lo + (((clientY - canvas.getBoundingClientRect().top) - PAD) / SCALE);
    const grab = b.start - pmFromY(e.clientY); // keep the spot on the box you grabbed
    const y0 = e.clientY;
    let latest = { start: b.start, end: b.end }, moved = false, lastY = e.clientY, raf = 0;
    const compute = () => {
      let st = Math.round((pmFromY(lastY) + grab) / 5) * 5; // snap 5 min
      if (st < 0) st = 0; if (st + dur > 1440) st = 1440 - dur;
      latest = { start: st, end: st + dur };
      setMovePreview({ id: b.id, start: latest.start, end: latest.end });
    };
    // Auto-scroll the timeline when the drag nears the top/bottom edge, so a box can
    // be carried to a time that's currently off-screen. Speed ramps up toward the edge.
    const EDGE = 52, MAXV = 16;
    const loop = () => {
      if (scroller) {
        const r = scroller.getBoundingClientRect();
        let dv = 0;
        if (lastY < r.top + EDGE) dv = -Math.ceil(((r.top + EDGE - lastY) / EDGE) * MAXV);
        else if (lastY > r.bottom - EDGE) dv = Math.ceil(((lastY - (r.bottom - EDGE)) / EDGE) * MAXV);
        if (dv) {
          const max = scroller.scrollHeight - scroller.clientHeight;
          scroller.scrollTop = Math.max(0, Math.min(max, scroller.scrollTop + dv));
        }
      }
      compute();
      raf = window.requestAnimationFrame(loop);
    };
    const move = (ev) => {
      if (Math.abs(ev.clientY - y0) > 4) moved = true;
      lastY = ev.clientY;
      compute();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      if (raf) window.cancelAnimationFrame(raf);
      setMovePreview(null);
      // For-me blocks: a plain tap toggles selection (highlight + reveal the
      // comment/split/× buttons), mirroring a ME session. Task blocks open the editor.
      if (!moved) { if (hobby) { setSelHobby(prev => prev === b.id ? null : b.id); } else { onEdit(b); } return; }
      if (onMoveBlock) onMoveBlock(b.id, latest.start, latest.end);
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    raf = window.requestAnimationFrame(loop); // run continuously so edge-scroll works even if the finger holds still
  };
  const onCanvasDown = (e) => {
    if (e.target.closest('.tl2, button, input, .tl-dragsel')) return; // not on an existing item
    setSelSeg(null); // tapping empty canvas deselects any open session
    setSelHobby(null); setNoteBlk(null); // ...deselects any for-me block + closes its comment
    setLogBlk(null); // ...and closes any open goal-logger popover
    if (!onDragCreate) return;
    if (e.button != null && e.button !== 0) return;
    const canvas = e.currentTarget;
    const r = canvas.getBoundingClientRect();
    if (e.clientX - r.left < 46) return; // hour gutter
    const lane = (e.clientX - r.left) < r.width / 2 ? 'me' : 'av';
    const startMin = minFromY(e.clientY - r.top);
    dragRef.current = { lane, startMin, cur: startMin, active: false, canvas };
    const move = (ev) => {
      const d = dragRef.current; if (!d) return;
      const cm = minFromY(ev.clientY - d.canvas.getBoundingClientRect().top);
      if (!d.active && Math.abs((cm - d.startMin) * SCALE) < 6) { d.cur = cm; return; }
      d.active = true; d.cur = cm; ev.preventDefault();
      setDragSel({ lane: d.lane, a: d.startMin, b: cm });
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      const d = dragRef.current; dragRef.current = null; setDragSel(null);
      if (d && d.active) {
        const a = Math.min(d.startMin, d.cur), b = Math.max(d.startMin, d.cur);
        if (b - a >= 10) onDragCreate(d.lane, a, b);
      }
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
  };

  // ---- ME lane assembly ----
  // Flatten every logged session — block "done" segments + free sessions — into one
  // list, then MERGE same-activity sessions that overlap into a single group. Two
  // overlapping "Exercise" blocks both ticked done used to shatter into cramped
  // side-by-side columns; now they collapse to one continuous pill over their union.
  const taskFallback = (a) => a ? (TASK_EMOJI_CHAR[a.emoji] || glyphFromCode(a.emoji) || '💪') : '✓';
  const meItems = [];
  for (const b of blocks) {
    const a = findActivity(activities, b.activityId);
    if (a && a.type === 'hobby') continue; // hobby shows in its own block, not the ME lane
    const nm = a ? a.name : 'Deleted';
    getSegs(b).forEach((seg, i) => {
      meItems.push({
        key: b.id + ':' + i, block: b, idx: i, free: false, actId: b.activityId,
        name: nm, emoji: a && a.emoji, emojiFallback: taskFallback(a),
        seg, start: seg.start, end: seg.end,
        onChange: (ns) => { const arr = getSegs(b).map(s => ({ ...s })); arr[i] = ns; onSetSegs(b.id, arr); },
        onSplit: () => { const segs = getSegs(b); const s = segs[i]; const mid = Math.round((s.start + s.end) / 2); if (mid - s.start < 5 || s.end - mid < 5) return; const arr = segs.map(x => ({ ...x })); arr.splice(i, 1, { start: s.start, end: mid }, { start: mid, end: s.end }); onSetSegs(b.id, arr); },
        onRemove: () => onSetSegs(b.id, getSegs(b).filter((_, j) => j !== i)),
        note: (onSetNote && i === 0) ? (getNote ? getNote(b) : '') : null,
        onNote: (onSetNote && i === 0) ? ((txt) => onSetNote(b, txt)) : null,
      });
    });
  }
  for (const f of free) {
    const a = findActivity(activities, f.activityId);
    meItems.push({
      key: 'f:' + f.id, free: true, fid: f.id, actId: f.activityId,
      name: a ? a.name : 'Session', emoji: a && a.emoji, emojiFallback: taskFallback(a),
      seg: f, start: f.start, end: f.end,
      onChange: (ns) => onSetFree(f.id, ns), onSplit: () => onSplitFree(f.id), onRemove: () => onRemoveFree(f.id),
      note: null, onNote: null,
    });
  }
  // No merging: every session is its OWN group, so overlapping same-activity
  // sessions render as separate side-by-side boxes (meCols lays them out in
  // columns) rather than collapsing into one merged pill — the user prefers the
  // separate look. (MeMergedSeg is kept defined but no longer reached.)
  const meGroups = [];
  for (const it of meItems.slice().sort((x, z) => x.start - z.start || x.end - z.end)) {
    meGroups.push({ actId: it.actId, start: it.start, end: it.end, members: [it] });
  }
  // Column-pack the GROUPS (a merged group is one item), so any overlap that remains —
  // DIFFERENT activities at the same time — still lays out in side-by-side columns.
  // Packs by RENDERED pixel span (top → top + max(26, dur)) so even short boxes that
  // visually collide get their own column. Keyed by group index.
  const meCols = (() => {
    const items = meGroups.map((g, gi) => { const top = y(g.start); return { gi, top, bot: top + Math.max(26, (g.end - g.start) * SCALE) }; });
    items.sort((a, b) => a.top - b.top || a.bot - b.bot);
    const out = {}; let cluster = [], ends = [];
    const flush = () => { for (const it of cluster) out[it.gi] = { col: it.col, cols: ends.length }; cluster = []; ends = []; };
    for (const it of items) {
      if (ends.length && it.top >= Math.max.apply(null, ends)) flush(); // pixel gap → new cluster
      let col = ends.findIndex(e => e <= it.top);
      if (col === -1) { col = ends.length; ends.push(it.bot); } else ends[col] = it.bot;
      it.col = col; cluster.push(it);
    }
    flush();
    return out;
  })();

  // "Lively" free-time fillers: the avatar's little hobbies between scheduled blocks.
  // Each potential window (≈ every 2.5h, 8 AM → ~10 PM) is computed independently from
  // (daySeed, window index) so the day stays STABLE — resizing a real block only drops
  // the windows it now covers, never re-rolls the rest. But inside each window the START
  // is jittered off the hour, the LENGTH comes from the hobby's own realistic range, and
  // ~1 in 4 windows is just downtime — so the pacing reads like a real person's day, not
  // a clockwork 50-min-every-2h lattice. Decorative only: never raced/scored/draggable.
  const fillers = (() => {
    if (!lively) return [];
    // Persona built-ins only — a user's "Just for me" activity is theirs alone and
    // must never surface on the avatar's side (not even as a free-time filler).
    const pool = (LIVELY_BY_BEHAVIOR[behavior] || LIVELY_BY_BEHAVIOR.coach);
    if (!pool.length) return [];
    const WAKE = 480, SLEEP = 1350, WINDOW = 150; // ~8:00 → 22:30, one possible hobby per ~2.5h
    // Only the avatar's OWN scheduled blocks suppress its free-time hobbies — your
    // logged ME sessions don't, so your hobby and the avatar's can coexist in their
    // separate lanes at the same time (they live on opposite sides anyway).
    const busy = (s, e) => blocks.some(b => s < b.end + 5 && b.start - 5 < e);
    // Deterministic per (day, window, k) pseudo-random in [0,1) — stable across renders.
    const rnd = (i, k) => { const x = Math.sin(daySeed * 12.9898 + i * 78.233 + k * 37.719) * 43758.5453; return x - Math.floor(x); };
    const snap5 = (m) => Math.round(m / 5) * 5;
    const out = [];
    let idx = 0;
    for (let base = WAKE; base + 20 <= SLEEP; base += WINDOW, idx++) {
      if (rnd(idx, 1) < 0.28) continue; // some windows are just downtime
      const item = pool[Math.abs(daySeed * 7 + idx * 13) % pool.length];
      const dr = item.dur || [20, 40];
      const dur = Math.max(5, snap5(dr[0] + rnd(idx, 2) * (dr[1] - dr[0])));
      // Jitter the start within the window (off the hour), leaving ≥15 min before the
      // next window so neighbouring fillers never touch.
      const room = Math.max(0, WINDOW - dur - 15);
      const start = snap5(base + 5 + rnd(idx, 3) * room);
      const end = start + dur;
      if (end > SLEEP || busy(start, end)) continue;
      out.push({ id: 'lv' + idx, start, end, ...item });
    }
    return out;
  })();

  return (
    <div className="tl-scroll" ref={scrollRef}>
      <div className="tl2-caps">
        <span className="tl2-cap me">ME <button className="tl2-cap-add" onClick={onAddFree} aria-label="Log a session">＋</button></span>
        <span className="tl2-cap av">{avatarName}</span>
      </div>
      <div className="tl-canvas" style={{ height: H }} onPointerDown={onCanvasDown}>
        {hours.map(h => (
          <React.Fragment key={h}>
            <div className="tl-hline" style={{ top: y(h) }} />
            {h + 30 < hi && <div className="tl-hline half" style={{ top: y(h + 30) }} />}
            <div className="tl-hlabel" style={{ top: y(h) }}>{fmtHourLabel(h)}</div>
          </React.Fragment>
        ))}
        <div className="tl2-divider" />
        {fillers.map(f => {
          const top = y(f.start);
          const fh = Math.max(30, (f.end - f.start) * SCALE);
          const liveF = isToday && nowMin >= f.start && nowMin < f.end;
          const pastF = isToday && nowMin >= f.end;
          return (
            <div key={f.id} className={'tl2 av lively' + (liveF ? ' live' : '') + (pastF ? ' past' : '')} style={{ top, height: fh }}>
              <div className="tl2-body">
                <div className="tl2-main lively-main">
                  <span className="tl2-fill-dot" />
                  <span className="tl2-face">
                    <ActionEmoji code={f.code} size={20} label={f.name} className="tl2-action" fallback={f.glyph} />
                  </span>
                  <span className="tl2-info">
                    <span className="tl2-name">{f.name}</span>
                    <span className="tl2-time">{fmtClock(f.start)}–{fmtClock(f.end)} · free time</span>
                  </span>
                </div>
              </div>
            </div>
          );
        })}
        {blocks.map(b => {
          const a = findActivity(activities, b.activityId);
          const isHobby = !!(a && a.type === 'hobby'); // yours, but never raced/scored
          const mv = (movePreview && movePreview.id === b.id) ? movePreview : null;
          const bStart = mv ? mv.start : b.start;
          const bEnd = mv ? mv.end : b.end;
          const top = y(bStart);
          const dur = Math.max(0, bEnd - bStart);
          // Work amount is a per-SESSION goal: you log what you did this block and
          // the meta shows this session's progress toward the goal.
          // Percent-mode tasks are scored 0–100% per session — reuse the amount
          // logger with a fixed goal of 100 and a '%' unit.
          const isPct = !!(a && a.goalMode === 'percent');
          const sessGoal = isPct ? 100 : actAmtTarget(a);
          const unit = isPct ? '%' : (a && a.unit ? a.unit : '');
          // Per-date label (Day view) wins; otherwise the per-weekday sub-task name.
          const sub = (getSub ? getSub(b) : '')
            || (a && a.dayLabels && a.dayLabels[weekday]) || '';
          const h = Math.max(34 + (sub ? 13 : 0), dur * SCALE);
          const started = nowMin >= b.start;
          const ended = nowMin >= b.end;
          const logged = getAmount ? getAmount(b) : 0;
          const sessPct = sessGoal ? Math.min(100, Math.round((logged / sessGoal) * 100)) : 0;
          const step = sessGoal <= 20 ? 1 : sessGoal <= 100 ? 5 : 10;
          const segs = getSegs(b);
          const done = segs.length > 0;
          // Rest ticket spent on this habit (or the whole day): the avatar takes the
          // break too — it stops "running" this block, so no race/log, just resting.
          const excused = isExcused ? isExcused(b.id) : false;
          // A ticket spent on THIS task specifically (not a whole-day rest) can be
          // cancelled by tapping its 🎟️ box; a whole-day rest stays locked here.
          const blockExcused = isBlockExcused ? isBlockExcused(b.id) : false;
          const canUnrest = blockExcused && !!onUnrest;
          const live = isToday && started && !ended && !excused;
          // A rested block isn't "racing", but it's still happening NOW — give it the
          // same time-is-now outline glow (in its rest green) as a live block.
          const restLive = isToday && started && !ended && excused;
          // The avatar is pokeable while it's mid-job (live) OR while it's resting this
          // habit on a ticket — tapping it gets a fresh personality reaction either way.
          const canPoke = (live || excused) && !mv;
          const wpoke = (workPoke && workPoke.id === b.id) ? workPoke : null;
          // Deterministic per-personality "resting with you" line for the rested note
          // (stable per block so it doesn't reshuffle every render; poking gives random ones).
          const restSet = REST_POKE_LINES[behavior] || REST_POKE_LINES.coach;
          const restLine = restSet[Math.abs((b.id || '').split('').reduce((s, c) => s + c.charCodeAt(0), 0)) % restSet.length];
          const name = a ? a.name : 'Deleted';
          // Your committed self runs the plan perfectly: once a block has ENDED (today,
          // or any past day where effMin=1440), JEK has finished it. If YOU haven't checked
          // it off, the box shows a muted "JEK done — you didn't" marker, distinct from the
          // solid-lime "I did it" rail. (Excused/rested blocks are off the race entirely.)
          const jekDone = ended && !done && !excused;
          return (
            <React.Fragment key={b.id}>
              {/* ME sessions (left lane) are rendered together in one merged pass AFTER
                  the blocks loop (see meGroups below), so same-activity sessions that
                  overlap across different blocks collapse into a single pill. */}
              {/* AVATAR lane (right): the plan it runs */}
              <div className={'tl2 av' + (started ? ' active' : ' upcoming') + (live ? ' live' : '') + (restLive ? ' rest-now' : '') + (done ? ' done' : '') + (mv ? ' dragging' : '') + (excused ? ' rested' : '') + (wpoke ? ' poking' : '') + (logBlk === b.id ? ' logopen' : '') + (noteBlk === b.id ? ' noting' : '') + (isHobby ? ' hobby' : '') + (isHobby && selHobby === b.id ? ' sel' : '')}
                data-block-id={b.id} data-restable={(!excused && !isHobby) ? '1' : undefined}
                style={{ top, height: h }}>
                {!excused && sessGoal > 0 && (
                  <button className={'tl2-goal-btn' + (sessPct >= 100 ? ' hit' : '')}
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={(e) => { e.stopPropagation(); if (logBlk === b.id) { setLogBlk(null); } else { setLogDraft(logged); setLogCheck(false); setLogBlk(b.id); } }}
                    aria-label={'Log ' + name + ' progress'}>{isPct ? sessPct + '%' : logged + '/' + sessGoal + (unit ? ' ' + unit : '')}</button>
                )}
                {/* Done-toggle — a full-height check RAIL on the left of a TASK block.
                    Empty rail when unchecked; fills solid lime with a ✓ when done (or shows
                    🎟️ when rested). "Just for me" hobby blocks keep the small decorative dot
                    inside the body instead (rendered below). */}
                {!isHobby && (
                  <button className={'tl2-box' + (canUnrest ? ' unrestable' : '') + (jekDone ? ' jekdone' : '')}
                    disabled={!excused && !started}
                    aria-label={canUnrest ? 'Cancel rest ticket for ' + name : excused ? name + ' is on a rest ticket' : done ? 'Uncheck ' + name : jekDone ? (avatarName || 'JEK') + ' finished ' + name + ' — tap if you did it too' : 'Mark done ' + name}
                    title={jekDone ? (avatarName || 'JEK') + ' finished this — you haven’t marked it' : undefined}
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={(e) => {
                      e.stopPropagation();
                      if (canUnrest) { onUnrest(b); return; }
                      if (!started || excused) return;
                      // Checking OFF a done block, or a block with no amount/percent goal,
                      // just toggles. Checking ON a goal block opens the logger so you
                      // enter the number first, then Save marks it done (logCheck).
                      if (!done && sessGoal > 0) { setLogDraft(logged); setLogCheck(true); setLogBlk(b.id); }
                      else { onToggle(b); }
                    }}>
                    {excused
                      ? <span className="tix-tilt">🎟️</span>
                      : done
                        ? '✓'
                        : <span className="tl2-box-mark" />}
                  </button>
                )}
                <div className="tl2-body">
                  <button className="tl2-main" onPointerDown={(e) => startBlockMove(e, b, isHobby)} aria-label={isHobby ? 'Select or move ' + name : 'Move or edit ' + name}>
                    {/* Hobby "just for me" block: small decorative leading dot (not a toggle). */}
                    {isHobby && (
                      <span className={'tl2-dot' + (done ? ' done' : '') + (excused ? ' rested' : '')}>
                        {excused ? <span className="tix-tilt">🎟️</span> : null}
                      </span>
                    )}
                    <span className={'tl2-face' + (canPoke ? ' pokeable' : '') + (wpoke ? ' poking' : '')}
                      role={canPoke ? 'button' : undefined} tabIndex={canPoke ? 0 : undefined}
                      aria-label={canPoke ? 'Poke ' + (avatarName || 'JEK') : undefined}
                      onPointerDown={canPoke ? (e) => e.stopPropagation() : undefined}
                      onClick={canPoke ? (e) => { e.stopPropagation(); pokeWork(b.id, excused); } : undefined}>
                      {excused
                        // Rested task: the avatar is napping it off — swap the task's
                        // animation for an animated 💤 (zzz) instead of stacking a badge.
                        ? <ActionEmoji code="1f4a4" size={20} label={name + ' is resting'} className="tl2-action" fallback="💤" />
                        : a && a.emoji
                          ? <ActionEmoji code={a.emoji} size={20} label={name} className="tl2-action" fallback={TASK_EMOJI_CHAR[a.emoji] || glyphFromCode(a.emoji) || '💪'} />
                          : renderFace(avatarEmoji, 18)}
                    </span>
                    {wpoke && (
                      <span className="tl2-poke-bubble" key={wpoke.n}>
                        <ActionEmoji code={wpoke.emoji} size={18} label="reaction" className="tl2-poke-emoji" fallback={glyphFromCode(wpoke.emoji)} />
                        <span className="tl2-poke-msg">{wpoke.msg}</span>
                      </span>
                    )}
                    <span className="tl2-info">
                      <span className="tl2-name">{name}{sub ? <span className="tl2-sub"> · {sub}</span> : null}</span>
                      {excused
                        ? <React.Fragment>
                            <span className="tl2-time">{fmtClock(bStart)}–{fmtClock(bEnd)} · {fmtDur(dur)}</span>
                            <span className="tl2-time tl2-rest-note">{restLine.msg}</span>
                          </React.Fragment>
                        : <span className="tl2-time">{fmtClock(bStart)}–{fmtClock(bEnd)} · {fmtDur(dur)}{sessGoal ? ' · 🎯 ' + (isPct ? '100%' : sessGoal + (unit ? ' ' + unit : '')) : ''}</span>}
                    </span>
                  </button>
                </div>
                {!excused && sessGoal > 0 && logBlk === b.id && (() => {
                  // Draft pct mirrors the live one but reads from the unsaved draft, so
                  // the meta updates as you tweak — yet nothing commits until you Save.
                  const draftPct = sessGoal ? Math.min(100, Math.round((logDraft / sessGoal) * 100)) : 0;
                  return (
                  <div className={'tl2-goal-pop' + (goalPopUp ? ' up' : '')} ref={goalPopRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
                    <div className="tl2-goal-pop-head">{isPct ? 'How done is this session?' : '🎯 ' + sessGoal + (unit ? ' ' + unit : '') + ' this session'}</div>
                    <div className="tl2-amount">
                      <button className="tl2-amt-btn" disabled={!started || logDraft <= 0}
                        onClick={() => setLogDraft(Math.max(0, logDraft - step))} aria-label="Less">−</button>
                      <input className="tl2-amt-input" type="number" inputMode="numeric" min="0" max={isPct ? 100 : undefined} disabled={!started}
                        value={logDraft} onChange={(e) => { let n = parseInt(e.target.value, 10) || 0; if (isPct) n = Math.min(100, n); setLogDraft(Math.max(0, n)); }} />
                      <button className="tl2-amt-btn" disabled={!started || (isPct && logDraft >= 100)}
                        onClick={() => setLogDraft(isPct ? Math.min(100, logDraft + step) : logDraft + step)} aria-label="More">＋</button>
                      <span className={'tl2-amt-meta' + (draftPct >= 100 ? ' hit' : '')}>
                        {isPct ? logDraft + '%' : logDraft + '/' + sessGoal + (unit ? ' ' + unit : '')}
                        {draftPct >= 100 ? ' ✓' : ''}
                      </span>
                    </div>
                    <div className="tl2-goal-actions">
                      <button className="tl2-goal-cancel" onClick={() => { setLogBlk(null); setLogCheck(false); }}>Cancel</button>
                      <button className="tl2-goal-save" disabled={!started} onClick={() => { onSetAmount(b, logDraft); if ((logCheck || draftPct >= 100) && !done && !excused) onToggle(b); setLogBlk(null); setLogCheck(false); }}>{logCheck ? 'Save & done' : 'Save'}</button>
                    </div>
                  </div>
                  );
                })()}
                {isHobby && selHobby === b.id && (
                  <div className="tl2-hbtns">
                    <button className={'tl2-hbtn' + (getNote && getNote(b) ? ' has' : '')} title="Comment" aria-label="Comment on this" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); if (noteBlk === b.id) { setNoteBlk(null); } else { setNoteDraft(getNote ? getNote(b) : ''); setNoteBlk(b.id); } }}><CommentIcon size={11} /></button>
                    <button className="tl2-hbtn" title="Split" aria-label="Split block" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); if (onSplitBlock) onSplitBlock(b); }}>⤲</button>
                    <button className="tl2-hbtn" title="Remove" aria-label="Remove block" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); if (onDeleteBlock) onDeleteBlock(b); }}>×</button>
                  </div>
                )}
                {isHobby && noteBlk === b.id && (
                  <div className={'meseg-note-pop' + (noteFlipUp ? ' up' : '')} ref={noteFlipRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
                    <textarea className="meseg-note-area" autoFocus rows={3} maxLength={500} placeholder={'Note for ' + name + '…'} value={noteDraft} onChange={(e) => setNoteDraft(e.target.value)} />
                    <div className="meseg-note-actions">
                      <button className="meseg-note-cancel" onClick={() => setNoteBlk(null)}>Cancel</button>
                      <button className="meseg-note-save" onClick={() => { if (onSetNote) onSetNote(b, noteDraft); setNoteBlk(null); }}>Save</button>
                    </div>
                  </div>
                )}
                <div className="tl2-resize" onPointerDown={(e) => startBlockResize(e, b)} aria-label="Resize block" />
              </div>
            </React.Fragment>
          );
        })}
        {/* ME lane (left): every logged session — block "done" segments AND free
            sessions — rendered from the merged groups. A lone session is a normal
            editable MeSeg; a cluster of overlapping same-activity sessions collapses
            into one MeMergedSeg spanning their union. */}
        {meGroups.map((g, gi) => {
          const c = meCols[gi] || { col: 0, cols: 1 };
          if (g.members.length === 1) {
            const it = g.members[0];
            return (
              <MeSeg key={it.key} seg={it.seg} name={it.name} y={y} scale={SCALE} free={it.free} col={c.col} cols={c.cols}
                emoji={it.emoji} emojiFallback={it.emojiFallback}
                onChange={it.onChange} onSplit={it.onSplit} onRemove={it.onRemove}
                note={it.note} onNote={it.onNote}
                selected={selSeg === it.key} onSelect={() => setSelSeg(selSeg === it.key ? null : it.key)} />
            );
          }
          const gkey = 'm:' + g.members[0].key;
          const removeAll = () => {
            const byBlock = new Map(); const freeIds = [];
            for (const m of g.members) {
              if (m.free) freeIds.push(m.fid);
              else { if (!byBlock.has(m.block)) byBlock.set(m.block, new Set()); byBlock.get(m.block).add(m.idx); }
            }
            byBlock.forEach((idxs, b) => onSetSegs(b.id, getSegs(b).filter((_, j) => !idxs.has(j))));
            freeIds.forEach((id) => onRemoveFree(id));
            setSelSeg(null);
          };
          return (
            <MeMergedSeg key={gkey} start={g.start} end={g.end} name={g.members[0].name}
              emoji={g.members[0].emoji} emojiFallback={g.members[0].emojiFallback}
              y={y} scale={SCALE} col={c.col} cols={c.cols} count={g.members.length}
              selected={selSeg === gkey} onSelect={() => setSelSeg(selSeg === gkey ? null : gkey)}
              onRemoveAll={removeAll} />
          );
        })}
        {isToday && (
          <React.Fragment>
            <div className="tl-now-time" style={{ top: y(nowMin) }}>{fmtClock(nowMin)}</div>
            <div className="tl2-now" style={{ top: y(nowMin) }}><span className="tl2-now-dot" /></div>
          </React.Fragment>
        )}
        {dragSel && (
          <div className={'tl-dragsel ' + dragSel.lane}
            style={{ top: y(Math.min(dragSel.a, dragSel.b)), height: Math.max(3, Math.abs(dragSel.b - dragSel.a) * SCALE) }}>
            <span className="tl-dragsel-time">{fmtClock(Math.min(dragSel.a, dragSel.b))}–{fmtClock(Math.max(dragSel.a, dragSel.b))}</span>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // Auto-update: when a freshly installed SW takes control, reload once so the
  // newest UI shows immediately — no manual cache-clearing. (Guarded so a
  // first-ever install, which has no prior controller, does not reload.)
  let _swReloading = false;
  const _hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!_hadController || _swReloading) return;
    _swReloading = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.update();
      setInterval(() => reg.update(), 60 * 60 * 1000); // re-check hourly while open
    }).catch(() => {});
  });
}
</script>
</body>
</html>
