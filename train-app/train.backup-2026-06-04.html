  const onEndInput = (v) => { if (!v) { setEnd(v); return; } setEnd(minToInput(Math.max(0, Math.min(1440, inputToMin(v))))); };
  const toggleDay = (i) => setDays(prev => {
    if (prev.indexOf(i) === -1) {
      // Seed the newly-added day's per-day time with the current shared time so it
      // starts from something sensible the moment "different time per day" is on.
      setDayTimes(dt => dt[i] ? dt : { ...dt, [i]: { start, end } });
      return [...prev, i].sort((a, b) => a - b);
    }
    return prev.filter(d => d !== i);
  });
  const scheduled = days.length > 0;
  // Per-day mode is valid when every selected day's end is after its start.
  const dayOk = (i) => { const t = dayTimeOf(i); return inputToMin(t.end) > inputToMin(t.start); };
  const allTimesOk = perDay ? days.every(dayOk) : timeOk;
  // Overlap warning only applies to the single shared time (per-day overlaps are fine).
  const conflict = (scheduled && !perDay && timeOk) ? findScheduleConflict(schedule || [], days, sMin, eMin, initialBlock ? initialBlock.id : null) : null;

  const valid = !!name.trim() && (!scheduled || allTimesOk);  // overlaps allowed — warn only
  const save = () => {
    if (!valid) return;
    // Snap to the 5-minute grid so blocks read 6:25–7:25, never 7:23.
    let when = null;
    if (scheduled) {
      if (perDay) {
        const dt = {};
        for (const i of days) {
          const t = dayTimeOf(i);
          const s = snap5(inputToMin(t.start)), e = Math.max(s + 5, snap5(inputToMin(t.end)));
          dt[i] = { start: s, end: e };
        }
        when = { perDay: true, dayTimes: dt };
      } else {
        const bStart = snap5(sMin), bEnd = Math.max(bStart + 5, snap5(eMin));
        when = { perDay: false, days: days.slice().sort((a, b) => a - b), start: bStart, end: bEnd };
      }
    }
    const wa = weeklyAmount.trim() ? Math.max(0, parseInt(weeklyAmount, 10) || 0) : 0;
    // Keep only per-day names for days the task actually runs (drop stale ones).
    const dl = {};
    for (const i of days) { const t = (dayLabels[i] || '').trim(); if (t) dl[i] = t; }
    const gt = goalMode === 'percent' ? 100 : (goalTarget.trim() ? Math.max(0, parseInt(goalTarget, 10) || 0) : 0);
    onSave(name.trim(), color, emoji, unit.trim(), when, wa, dl, goalMode, gt, type);
  };
  return (
    <React.Fragment>
      <div className="sheet-backdrop" onClick={onCancel} />
      <div className="sheet" role="dialog" aria-modal="true">
        <div className="sheet-grabber" />
        <div className="sheet-header">
          <button className="btn-ghost" onClick={onCancel}>Cancel</button>
          <div className="sheet-title">{editing ? 'Edit activity' : 'New activity'}</div>
          <button className="btn-primary" onClick={save} disabled={!valid} style={{ opacity: valid ? 1 : 0.4 }}>{editing ? 'Save' : 'Add'}</button>
        </div>
        <div className="sheet-body act-form">
          <div className="act-name-row">
            <button type="button" className="act-color-dot" style={{ background: color }}
              onClick={() => setColorOpen(o => !o)} aria-label="Task color" title="Task color" />
            <input ref={nameRef} className="input-underline input-large" placeholder="e.g. Deep work, Gym, Reading"
              value={name} onChange={e => setName(e.target.value)} />
          </div>
          {colorOpen && (
            <div className="act-color-pop">
              {ACTIVITY_COLORS.map(c => (
                <button key={c} className={'act-color-swatch' + (color === c ? ' on' : '')} style={{ background: c }}
                  onClick={() => { setColor(c); setColorOpen(false); }} aria-label={'color ' + c} />
              ))}
            </div>
          )}

          <div className="act-section">
            <div className="race-setup-label">Who does this?</div>
            <div className="goalmode-row">
              <button type="button" className={'goalmode-opt' + (type === 'task' ? ' on' : '')}
                onClick={() => setType('task')}>🏁 Race it</button>
              <button type="button" className={'goalmode-opt' + (type === 'hobby' ? ' on' : '')}
                onClick={() => setType('hobby')}>🙂 Just for me</button>
            </div>
            <p className="race-setup-explain" style={{ marginTop: 8 }}>
              {type === 'hobby'
                ? 'Yours alone — the avatar won’t run it, and it’s not raced or scored.'
                : 'The avatar runs this too; it counts toward keeping up.'}
            </p>
          </div>

          <div className="act-section">
            <div className="race-setup-label">How do you score this? <span className="lbl-opt">each session</span></div>
            <div className="goalmode-row">
              {[['time', '⏱', 'Time'], ['amount', '🔢', 'Amount'], ['percent', '％', 'Percent']].map(([m, ic, lbl]) => (
                <button key={m} type="button" className={'goalmode-opt' + (goalMode === m ? ' on' : '')}
                  onClick={() => setGoalMode(m)}>{ic} {lbl}</button>
              ))}
            </div>
            {goalMode === 'time' && (
              <p className="race-setup-explain" style={{ marginTop: 8 }}>Success = doing the scheduled time. (Default.)</p>
            )}
            {goalMode === 'amount' && (
              <React.Fragment>
                <div className="goal-amount-row">
                  <div className="amt-stepper">
                    <button type="button" className="amt-step" aria-label="Less"
                      onClick={() => { const n = parseInt(goalTarget, 10) || 0; const s = n <= 20 ? 1 : n < 100 ? 5 : 10; setGoalTarget(String(Math.max(0, n - s))); }}>−</button>
                    <input className="amt-num" type="number" inputMode="numeric" min="0" placeholder="0"
                      value={goalTarget} onChange={e => setGoalTarget(e.target.value)} />
                    <button type="button" className="amt-step" aria-label="More"
                      onClick={() => { const n = parseInt(goalTarget, 10) || 0; const s = n < 20 ? 1 : n < 100 ? 5 : 10; setGoalTarget(String(n + s)); }}>＋</button>
                  </div>
                  <input className="amt-unit" placeholder="unit — km, pages, reps"
                    value={unit} onChange={e => setUnit(e.target.value)} />
                </div>
                <p className="race-setup-explain" style={{ marginTop: 6 }}>
                  Success = {goalTarget.trim() ? goalTarget : 'N'}{unit.trim() ? ' ' + unit.trim() : ''} each time you do it.
                </p>
              </React.Fragment>
            )}
            {goalMode === 'percent' && (
              <p className="race-setup-explain" style={{ marginTop: 8 }}>Each session you rate how done it is, 0–100%. 100% = success.</p>
            )}
          </div>

          <div className="act-section">
            <div className="race-setup-label">Working emoji <span className="lbl-opt">shown live on Main</span></div>
            <div className="emoji-pick-row">
              {TASK_EMOJIS.map(e => (
                <button key={e.code} className={'emoji-opt' + (emoji === e.code ? ' on' : '')}
                  onClick={() => setEmoji(e.code)} aria-label={'emoji ' + e.char}>
                  <ActionEmoji code={e.code} size={26} fallback={e.char} label={e.char} />
                </button>
              ))}
              {customEmoji && (
                <button className="emoji-opt on" aria-label="your emoji">
                  <ActionEmoji code={emoji} size={26} fallback={glyphFromCode(emoji)} label="custom" />
                </button>
              )}
              <button type="button" className="emoji-opt emoji-more"
                onClick={() => setGifOpen(true)} aria-label="Browse all emojis">＋</button>
            </div>
          </div>
          {gifOpen && (
            <EmojiGifPicker value={emoji}
              onPick={(code) => { setEmoji(code); setGifOpen(false); }}
              onClose={() => setGifOpen(false)} />
          )}

          <div className="act-section">
            <div className="race-setup-label">Days <span className="lbl-opt">all off = off schedule</span></div>
            <div className="weekday-grid">
              {WEEKDAYS.map((lbl, i) => {
                const on = days.indexOf(i) !== -1;
                return (
                  <div className="weekday-col" key={i}>
                    <button className={'weekday-chip' + (on ? ' on' : '')}
                      onClick={() => toggleDay(i)} aria-label={'day ' + i}>{lbl}</button>
                    <input className={'day-mini-input' + (on && (dayLabels[i] || '').trim() ? ' filled' : '')} maxLength={40} disabled={!on}
                      placeholder={on ? '＋' : ''}
                      value={on ? (dayLabels[i] || '') : ''}
                      onChange={e => setDayLabel(i, e.target.value)} aria-label={DAY_FULL[i] + ' sub-task name'} />
                  </div>
                );
              })}
            </div>
            {scheduled && (
              <div className="race-setup-explain" style={{ marginTop: 8 }}>
                Type a sub-task name under any day. Blank uses “{name.trim() || 'the name above'}”.
              </div>
            )}

            {scheduled && (
              <React.Fragment>
                <div className="race-setup-label">Time of day</div>
                {/* Toggle: one shared time (default) vs a per-day time for each weekday.
                    Per-day saves as one block per distinct time and repeats weekly. */}
                <label className="perday-toggle">
                  <input type="checkbox" checked={perDay} onChange={e => setPerDay(e.target.checked)} />
                  <span className="perday-switch"><span className="perday-knob" /></span>
                  <span className="perday-toggle-lbl">Different time per day</span>
                </label>
                {perDay ? (
                  <div className="perday-list">
                    {days.map(i => {
                      const t = dayTimeOf(i);
                      const ok = inputToMin(t.end) > inputToMin(t.start);
                      return (
                        <div className={'perday-row' + (ok ? '' : ' bad')} key={i}>
                          <span className="perday-day">{['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i]}</span>
                          <div className="perday-times">
                            <TimePicker value={t.start} onChange={(v) => setDayStart(i, v)} ariaLabel={DAY_FULL[i] + ' start time'} />
                            <span className="perday-dash">–</span>
                            <TimePicker value={t.end} onChange={(v) => setDayEnd(i, v)} ariaLabel={DAY_FULL[i] + ' end time'} />
                          </div>
                        </div>
                      );
                    })}
                    <div className="act-time-summary" style={{ color: days.every(dayOk) ? 'var(--accent)' : '#fbbf24' }}>
                      {days.every(dayOk)
                        ? '→ custom time on ' + days.length + ' day' + (days.length === 1 ? '' : 's') + ' · repeats every week'
                        : 'Each day’s end must be after its start.'}
                    </div>
                  </div>
                ) : (
                  <React.Fragment>
                    <div className="act-time-range">
                      <div className="act-time-field">
                        <span className="act-time-lbl">From</span>
                        <div className="time-row">
                          <button type="button" className="cal-nav" onClick={() => moveStartTo(sMin - 15)} aria-label="Start 15 minutes earlier">−</button>
                          <TimePicker value={start} onChange={onStartInput} ariaLabel="Start time" />
                          <button type="button" className="cal-nav" onClick={() => moveStartTo(sMin + 15)} aria-label="Start 15 minutes later">＋</button>
                        </div>
                      </div>
                      <div className="act-time-field">
                        <span className="act-time-lbl">To</span>
                        <div className="time-row">
                          <button type="button" className="cal-nav" onClick={() => extendEnd(-15)} aria-label="End 15 minutes earlier">−</button>
                          <TimePicker value={end} onChange={onEndInput} ariaLabel="End time" />
                          <button type="button" className="cal-nav" onClick={() => extendEnd(15)} aria-label="End 15 minutes later">＋</button>
                        </div>
                      </div>
                    </div>
                    <div className="act-chip-row act-dur-quick">
                      <span className="act-dur-lbl">Length</span>
                      {DURATIONS.map(d => (
                        <button key={d.m} type="button" className={'act-chip' + (dur === d.m ? ' on' : '')} onClick={() => setDuration(d.m)}>{d.l}</button>
                      ))}
                    </div>
                    <div className="act-time-summary" style={{ color: timeOk ? 'var(--accent)' : '#fbbf24' }}>
                      {timeOk ? '→ ' + fmt12(sMin) + ' – ' + fmt12(eMin) + ' · ' + fmtDur(dur) + ' · ' + days.length + ' day' + (days.length === 1 ? '' : 's') + '/week' : 'End must be after start.'}
                    </div>
                    {conflict && (
                      <div className="act-time-summary" style={{ color: '#fbbf24' }}>
                        ⓘ Overlaps another task ({fmtClock(conflict.start)}–{fmtClock(conflict.end)}) on a shared day — that's fine, both will run at once.
                      </div>
                    )}
                  </React.Fragment>
                )}
              </React.Fragment>
            )}
            {!scheduled && initialBlock && (
              <div className="act-time-summary" style={{ color: '#fbbf24' }}>
                No days selected — saving will remove this task from the schedule.
              </div>
            )}
          </div>

          {editing && onDelete && (
            <button className="btn-ghost btn-block act-delete" style={{ color: 'var(--danger)' }} onClick={onDelete}>
              Delete activity{usage > 0 ? ' + ' + usage + ' schedule block' + (usage === 1 ? '' : 's') : ''}
            </button>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

// Custom dark dropdown for spending a rest ticket on one task — replaces the native
// <select> so the open list matches the app instead of the OS popup.
function RestTaskMenu({ blocks, activities, onPick }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('pointerdown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDoc); document.removeEventListener('keydown', onKey); };
  }, [open]);
  return (
    <div className={'rest-menu' + (open ? ' open' : '')} ref={ref}>
      <button type="button" className="rest-menu-trigger" onClick={() => setOpen(o => !o)} aria-haspopup="listbox" aria-expanded={open}>
        <span>Rest a task</span>
        <span className="rest-menu-caret">▾</span>
      </button>
      {open && (
        <div className="rest-menu-pop" role="listbox">
          <div className="rest-menu-head">Excuse one task today</div>
          {blocks.map(b => {
            const a = findActivity(activities, b.activityId);
            return (
              <button key={b.id} type="button" className="rest-menu-item" role="option"
                onClick={() => { setOpen(false); onPick(b.id); }}>
                <span className="rest-menu-dot" style={{ background: (a && a.color) || '#64748b' }} />
                <span className="rest-menu-emoji"><ActionEmoji code={a && a.emoji} size={16} fallback={taskGlyph(a)} label="" /></span>
                <span className="rest-menu-name">{(a && a.name) || 'Task'}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Themed month-calendar popover — replaces the browser's native date picker so the
// "jump to a date" control matches the app (dark, Mon-first, accent-selected). Anchors
// under the header date; tap a day to jump. Days before `min` are disabled.
function DatePopover({ value, min, onPick, onClose }) {
  const [viewMonth, setViewMonth] = React.useState(() => {
    const d = new Date(value); return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  });
  const sel = startOfDay(value);
  const today = startOfDay(Date.now());
  const minDay = (min != null) ? startOfDay(min) : null;
  const m = new Date(viewMonth);
  const year = m.getFullYear(), month = m.getMonth();
  const monthLabel = m.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // 0 = Monday (app is Mon-first)
  const daysIn = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysIn; d++) cells.push(new Date(year, month, d).getTime());
  while (cells.length % 7 !== 0) cells.push(null);
  return (
    <React.Fragment>
      <div className="dp-backdrop" onClick={onClose} />
      <div className="dp" role="dialog" aria-modal="true">
        <div className="dp-head">
          <span className="dp-month">{monthLabel}</span>
          <span className="dp-nav">
            <button className="dp-arrow" onClick={() => setViewMonth(new Date(year, month - 1, 1).getTime())} aria-label="Previous month">‹</button>
            <button className="dp-arrow" onClick={() => setViewMonth(new Date(year, month + 1, 1).getTime())} aria-label="Next month">›</button>
          </span>
        </div>
        <div className="dp-grid dp-dow">
          {['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(w => <span key={w} className="dp-wd">{w}</span>)}
        </div>
        <div className="dp-grid">
          {cells.map((ts, i) => {
            if (ts == null) return <span key={i} className="dp-cell empty" />;
            const disabled = minDay != null && ts < minDay;
            return (
              <button key={i} disabled={disabled}
                className={'dp-cell' + (ts === sel ? ' sel' : '') + (ts === today ? ' today' : '')}
                onClick={() => { onPick(ts); onClose(); }}>{new Date(ts).getDate()}</button>
            );
          })}
        </div>
        <div className="dp-foot">
          <button className="dp-foot-btn" onClick={() => { onPick(today); onClose(); }}>Today</button>
          <button className="dp-foot-btn ghost" onClick={onClose}>Close</button>
        </div>
      </div>
    </React.Fragment>
  );
}

function ScheduleScreen({ avatar, activities, setActivities, schedule, setSchedule, done, setDone, subnames, setSubnames, tickets, setTickets }) {
  const [now, setNow] = React.useState(Date.now());
  const [editing, setEditing] = React.useState(false);
  const [view, setView] = React.useState(() => {
    // URL ?view= wins (deep-link), then the remembered choice, else Day.
    const p = new URLSearchParams(location.search).get('view');
    if (p === 'week' || p === 'day') return p;
    try { const s = localStorage.getItem(K.scheduleView); if (s === 'week' || s === 'day') return s; } catch {}
    return 'day';
  }); // 'day' | 'week'
  React.useEffect(() => { try { localStorage.setItem(K.scheduleView, view); } catch {} }, [view]);
  const [dayOffset, setDayOffset] = React.useState(0);
  const [sheet, setSheet] = React.useState(null); // { block } edit | { isNew: true }
  const [showList, setShowList] = React.useState(false); // agenda list of the day's tasks
  const [dateOpen, setDateOpen] = React.useState(false); // themed date-jump calendar popover
  const [dayRest, setDayRest] = React.useState(null); // { k, line } — tapped whole-day rest reaction
  // Collapse the race header to give the schedule more vertical room (remembered).
  const [raceHidden, setRaceHidden] = React.useState(() => {
    try { return localStorage.getItem(K.raceHidden) === '1'; } catch { return false; }
  });
  React.useEffect(() => { try { localStorage.setItem(K.raceHidden, raceHidden ? '1' : '0'); } catch {} }, [raceHidden]);
  React.useEffect(() => { const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, []);
  const emoji = avatar.emoji;
  // Don't let the day view wander into days before you started using the app — the
  // recurring plan there is meaningless. Floor = your earliest tracked day.
  const minDayOffset = Math.min(0, Math.round((earliestTrackedDay(done, now) - startOfDay(now)) / 86400000));
  React.useEffect(() => { if (dayOffset < minDayOffset) setDayOffset(minDayOffset); }, [minDayOffset, dayOffset]);

  if (editing) {
    return <ScheduleEditor activities={activities} setActivities={setActivities}
      schedule={schedule} setSchedule={setSchedule} onBack={() => setEditing(false)} />;
  }

  const todayStart = startOfDay(now);
  const viewTs = addDays(todayStart, dayOffset);
  const isToday = dayOffset === 0, isPast = dayOffset < 0, isFuture = dayOffset > 0;
  const viewIdx = dayIndexMon(viewTs);
  const viewK = dayKey(viewTs);
  const viewBlocks = blocksForDay(schedule, viewIdx);
  const doneForDay = done[viewK] || {};
  // Normalize logged segments to the 5-min grid on read, so any off-grid leftovers
  // (e.g. an old 7:23 end) show + edit on clean 5-min boundaries.
  const getSegs = (b) => blockSegs(doneForDay, b).map(snapSeg);
  const getAmount = (b) => { const e = doneForDay[b.id]; return (e && typeof e === 'object' && typeof e.amount === 'number') ? e.amount : 0; };
  // Logged-so-far toward an activity's weekly goal, for the week being viewed.
  const viewWeekStart = startOfWeek(viewTs);
  const getWeekAmount = (activityId) => weekAmountLogged(activityId, schedule, done, viewWeekStart);
  // Per-day sub-label for a block (e.g. "Workout" → "Leg day" this Monday). Keyed
  // by the VIEWED date so the same recurring block can read differently each day.
  const daySubs = (subnames && subnames[viewK]) || {};
  const getSub = (b) => daySubs[b.id] || '';
  const setSub = (blockId, text) => {
    const t = (text || '').trim().slice(0, 40);
    setSubnames(prev => {
      const day = { ...((prev && prev[viewK]) || {}) };
      if (t) day[blockId] = t; else delete day[blockId];
      const next = { ...(prev || {}) };
      if (Object.keys(day).length) next[viewK] = day; else delete next[viewK];
      return next;
    });
  };
  // Time and amount are tracked independently; keep one while editing the other.
  const amountOf = (day, id) => { const e = day[id]; return (e && typeof e === 'object' && typeof e.amount === 'number') ? e.amount : 0; };
  const writeEntry = (day, id, segs, amount) => {
    // Preserve any free-text comment already on this block/day — time and amount
    // edits rebuild the entry, so carry the note through.
    const prevNote = (day[id] && typeof day[id] === 'object') ? day[id].note : undefined;
    const entry = {};
    if (segs && segs.length) entry.segs = segs;
    if (amount > 0) entry.amount = amount;
    if (prevNote) entry.note = prevNote;
    if (Object.keys(entry).length) day[id] = entry; else delete day[id];
  };
  // Per-block-per-day comment (lives on the done entry → backed up + synced for free).
  const getNote = (b) => { const e = doneForDay[b.id]; return (e && typeof e === 'object' && typeof e.note === 'string') ? e.note : ''; };
  const setNote = (b, text) => setDone(prev => {
    const day = Object.assign({}, prev[viewK] || {});
    const e = day[b.id];
    const base = (e && typeof e === 'object') ? { ...e } : {};
    const t = (text || '').trim().slice(0, 500);
    if (t) base.note = t; else delete base.note;
    if (Object.keys(base).length) day[b.id] = base; else delete day[b.id];
    return Object.assign({}, prev, { [viewK]: day });
  });
  // Right-lane checkbox: seed a plan-length session, or clear all your sessions.
  const toggleDone = (b) => setDone(prev => {
    const day = Object.assign({}, prev[viewK] || {});
    const segs = blockSegs(day, b).length ? [] : [{ start: b.start, end: b.end }];
    writeEntry(day, b.id, segs, amountOf(day, b.id));
    return Object.assign({}, prev, { [viewK]: day });
  });
  // Same check-off, but for any day (used by the Week grid where each column is a
  // different date keyed by its own timestamp).
  const toggleDoneOn = (ts, b) => setDone(prev => {
    const k = dayKey(ts);
    const day = Object.assign({}, prev[k] || {});
    const segs = blockSegs(day, b).length ? [] : [{ start: b.start, end: b.end }];
    writeEntry(day, b.id, segs, amountOf(day, b.id));
    return Object.assign({}, prev, { [k]: day });
  });
  // Left-lane drag/resize/split commit: replace a block's sessions (clear if none).
  const setSegs = (blockId, segs) => setDone(prev => {
    const day = Object.assign({}, prev[viewK] || {});
    const clean = (segs || []).filter(s => s && s.end - s.start >= 1).map(s => ({ start: Math.round(s.start), end: Math.round(s.end) }));
    writeEntry(day, blockId, clean, amountOf(day, blockId));
    return Object.assign({}, prev, { [viewK]: day });
  });
  // Amount logger: keep existing time sessions, update just the amount done.
  const setAmount = (b, n) => setDone(prev => {
    const day = Object.assign({}, prev[viewK] || {});
    writeEntry(day, b.id, blockSegs(day, b), Math.max(0, Math.round(n || 0)));
    return Object.assign({}, prev, { [viewK]: day });
  });
  // Free ME sessions you log yourself (no avatar block): `done[dk]._free=[{id,activityId,start,end}]`.
  const freeSessions = ((doneForDay._free) || []).map(snapSeg).sort((a, b) => a.start - b.start);
  const setFreeList = (updater) => setDone(prev => {
    const day = Object.assign({}, prev[viewK] || {});
    const list = updater((day._free || []).slice())
      .filter(f => f && f.end - f.start >= 1)
      .map(f => ({ id: f.id, activityId: f.activityId, start: Math.round(f.start), end: Math.round(f.end) }));
    if (list.length) day._free = list; else delete day._free;
    return Object.assign({}, prev, { [viewK]: day });
  });
  const addFree = (s) => { setFreeList(list => [...list, { id: uid(), activityId: s.activityId, start: s.start, end: s.end }]); setSheet(null); };
  const setFreeSeg = (id, ns) => setFreeList(list => list.map(f => f.id === id ? { ...f, start: ns.start, end: ns.end } : f));
  const splitFree = (id) => setFreeList(list => {
    const i = list.findIndex(f => f.id === id); if (i < 0) return list;
    const f = list[i], mid = Math.round((f.start + f.end) / 2);
    if (mid - f.start < 5 || f.end - mid < 5) return list;
    const a = list.slice(); a.splice(i, 1, { ...f, id: uid(), end: mid }, { ...f, id: uid(), start: mid }); return a;
  });
  const removeFree = (id) => setFreeList(list => list.filter(f => f.id !== id));
  const addBlock = (b) => { setSchedule(prev => [...prev, b]); setSheet(null); };
  const updateBlock = (b) => { setSchedule(prev => prev.map(x => x.id === b.id ? b : x)); setSheet(null); };
  const removeBlock = (id) => { setSchedule(prev => prev.filter(x => x.id !== id)); setSheet(null); };
  const splitBlock = (b) => setSchedule(prev => {
    const mid = Math.round((b.start + b.end) / 2);
    if (mid - b.start < 5 || b.end - mid < 5) return prev; // too short to split
    return prev.flatMap(x => x.id === b.id ? [{ ...x, end: mid }, { ...x, id: uid(), start: mid }] : [x]);
  });
  const resizeBlock = (id, end) => setSchedule(prev => prev.map(x => x.id === id ? { ...x, end } : x));
  const moveBlock = (id, start, end) => setSchedule(prev => prev.map(x => x.id === id ? { ...x, start, end } : x));
  // Week-grid edit: changing one day's block splits THAT weekday off into its own
  // single-day block, leaving the other days on the original. (If the block only
  // runs on that day, edit it in place — nothing to split.) The dragged date's
  // done entry follows the new block id so a checked block stays checked.
  const editBlockOnDay = (id, dayIdx, ts, patch) => {
    const cur = schedule.find(x => x.id === id);
    if (!cur) return;
    const ns = patch.start != null ? patch.start : cur.start;
    const ne = patch.end != null ? patch.end : cur.end;
    const willSplit = (cur.days || []).length > 1;
    const newId = willSplit ? uid() : id;
    setSchedule(prev => {
      const next = prev.map(x => x.id !== id ? x
        : willSplit ? { ...x, days: x.days.filter(d => d !== dayIdx) } : { ...x, start: ns, end: ne });
      return willSplit ? next.concat([{ ...cur, id: newId, days: [dayIdx], start: ns, end: ne }]) : next;
    });
    if (willSplit) setDone(prev => {
      const k = dayKey(ts); const day = prev[k];
      if (!day || !(id in day)) return prev;
      const nd = Object.assign({}, day); nd[newId] = nd[id]; delete nd[id];
      return Object.assign({}, prev, { [k]: nd });
    });
  };
  const moveBlockOnDay = (id, start, end, dayIdx, ts) => editBlockOnDay(id, dayIdx, ts, { start, end });
  const resizeBlockOnDay = (id, end, dayIdx, ts) => editBlockOnDay(id, dayIdx, ts, { end });
  // "Move all days" mode (Week grid): shift / resize EVERY block of one activity
  // together, without splitting — a task that runs every day moves as one unit.
  const moveAllForActivity = (activityId, delta) => setSchedule(prev => prev.map(b => {
    if (b.activityId !== activityId) return b;
    const dur = b.end - b.start;
    const ns = Math.max(0, Math.min(1440 - dur, b.start + delta));
    return { ...b, start: ns, end: ns + dur };
  }));
  const resizeAllForActivity = (activityId, delta) => setSchedule(prev => prev.map(b =>
    b.activityId === activityId ? { ...b, end: Math.max(b.start + 5, Math.min(1440, b.end + delta)) } : b));

  const nowMin = nowMinutes(now);
  const effMin = isToday ? nowMin : (isPast ? 1440 : 0); // live today, settled past, none future
  // On a rest day the avatar takes the day off — no race, no pressure, no grading.
  const isRestDay = (avatar.restDays || []).indexOf(viewIdx) !== -1;
  // A rest TICKET excuses this date — it isn't graded and won't break the streak.
  // The avatar takes the break TOO: a rested habit drops out of the race & the
  // grade (whole-day ticket rests every habit; a task ticket rests just that one).
  // A task rest costs 1 ticket, a whole-day rest costs 5; quota is 5 per week.
  const isTicketDay = isTicketed(tickets, viewTs);            // whole-day excuse
  const gradeBlocks = isTicketDay ? [] : gradedBlocks(viewBlocks, tickets, viewTs, activities);
  const cr = dayCredit(gradeBlocks, doneForDay, effMin, activities); // amount-aware; rested habits excluded
  const avatarMin = cr.plan, youMin = cr.done, gapMin = Math.max(0, cr.plan - cr.done);
  let dayTotal = 0;
  for (const b of gradeBlocks) dayTotal += Math.max(0, b.end - b.start);
  // Every task-level excuse on this date (you can rest more than one task a day).
  const excusedIds = (() => {
    const k = dayKey(viewTs); const out = [];
    for (const e of ticketArr(tickets)) { const n = normTicket(e); if (n && n.d === k && n.b) out.push(n.b); }
    return out;
  })();
  const excusedTasks = excusedIds.map(id => {
    const b = viewBlocks.find(x => x.id === id);
    return { id, name: (b ? (findActivity(activities, b.activityId) || {}).name : null) || 'Task' };
  });
  // Blocks still on the table to excuse (not already rested) — the "rest a task" menu.
  const restableBlocks = viewBlocks.filter(b => excusedIds.indexOf(b.id) === -1);
  const hasTicketHere = isTicketDay || excusedIds.length > 0;
  // Weekly quota is per-avatar (Avatar tab); whole-day rest spends it all.
  const ticketQuota = avatar.restTickets != null ? avatar.restTickets : REST_TICKETS_PER_WEEK;
  const wholeDayCost = wholeDayCostFor(ticketQuota);
  const ticketsLeft = ticketsLeftInWeek(tickets || [], viewTs, ticketQuota);
  const useTicket = (blockId) => setTickets(prev => {
    const arr = ticketArr(prev);
    const cost = blockId ? 1 : wholeDayCost; // a task costs 1, a whole day spends the week's allowance
    if (ticketsLeftInWeek(arr, viewTs, ticketQuota) < cost) return arr; // not enough tickets left this week
    return arr.concat([blockId ? { d: dayKey(viewTs), b: blockId } : { d: dayKey(viewTs) }]);
  });
  // No arg → clear the whole day (the day-level ticket). A blockId → unrest just that task.
  const cancelTicket = (blockId) => setTickets(prev =>
    ticketArr(prev).filter(e => {
      const n = normTicket(e);
      if (!n || n.d !== dayKey(viewTs)) return true;
      return blockId == null ? false : n.b !== blockId;
    }));
  // ── Drag a 🎟️ onto a JEK task to rest just that one (cost: 1 ticket) ──────────
  // Pointer-drag (not HTML5) so it works on touch and never fights the timeline's own
  // wheel/scroll. A floating ghost follows the finger; restable JEK blocks hint as
  // targets and the one under the pointer lights up; releasing over it spends a ticket.
  const tixGhostRef = React.useRef(null);
  const tixHotRef = React.useRef(null);
  const startTicketDrag = (e) => {
    if (e.button != null && e.button !== 0) return;
    if (ticketsLeft <= 0) return;
    e.preventDefault();
    const ghost = tixGhostRef.current;
    const place = (x, y) => { if (ghost) { ghost.style.left = x + 'px'; ghost.style.top = y + 'px'; } };
    if (ghost) ghost.style.display = 'block';
    place(e.clientX, e.clientY);
    document.body.classList.add('tix-dragging');
    const clearHot = () => { if (tixHotRef.current) { tixHotRef.current.classList.remove('tix-drop-hot'); tixHotRef.current = null; } };
    const move = (ev) => {
      ev.preventDefault();
      place(ev.clientX, ev.clientY);
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const blk = (el && el.closest) ? el.closest('.tl2.av[data-restable="1"]') : null;
      if (blk !== tixHotRef.current) { clearHot(); if (blk) { blk.classList.add('tix-drop-hot'); tixHotRef.current = blk; } }
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      if (ghost) ghost.style.display = 'none';
      document.body.classList.remove('tix-dragging');
      const target = tixHotRef.current; clearHot();
      const id = target && target.getAttribute('data-block-id');
      if (id) useTicket(id);
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
  };
  // Pill = the "kept up" GRADE — already excludes rested habits (cr uses gradeBlocks).
  const gradePct = cr.pct;
  const pillPct = !isRestDay && !isTicketDay && (isToday || isPast) && gradePct !== null ? gradePct : null;

  // Whole-day rest reaction: when you spend a ticket on the whole day, the avatar
  // responds in its personality voice (same lines as a per-habit rest). Deterministic
  // per day; tapping the resting avatar cycles a fresh line.
  const restPersona = REST_POKE_LINES[avatar.behavior] || REST_POKE_LINES.coach;
  const dayRestDefault = restPersona[Math.abs(Math.round(viewTs / 86400000)) % restPersona.length];
  const dayRestLine = (dayRest && dayRest.k === viewK) ? dayRest.line : dayRestDefault;
  const pokeDayRest = () => setDayRest({ k: viewK, line: restPersona[Math.floor(Math.random() * restPersona.length)] });

  // Status line for the days with no race bars (rest/ticket/empty/future).
  const planCount = gradeBlocks.length;
  let statusLine;
  if (isRestDay) statusLine = '💤 Rest day — ' + avatar.name + ' is resting. Enjoy the day off.';
  else if (isTicketDay) statusLine = dayRestLine.msg;
  else if (viewBlocks.length === 0) statusLine = (isFuture ? 'Nothing planned. ' : isPast ? 'Nothing was planned. ' : 'Nothing planned today. ') + 'Tap ＋ to add a block.';
  else statusLine = formatHM(dayTotal * 60) + ' planned · ' + avatar.name + ' will run ' + planCount + ' block' + (planCount === 1 ? '' : 's') + '.';

  const dateLabel = new Date(viewTs).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const showBars = viewBlocks.length > 0 && dayTotal > 0 && !isFuture && !isRestDay;

  return (
    <div className="sched-screen">
      <div className="view-toggle">
        <button className={'view-toggle-btn' + (view === 'day' ? ' on' : '')} onClick={() => setView('day')}>Day</button>
        <button className={'view-toggle-btn' + (view === 'week' ? ' on' : '')} onClick={() => setView('week')}>Week</button>
      </div>

      {view === 'week' ? (
        <WeekGrid avatar={avatar} activities={activities} schedule={schedule} done={done} now={now} tickets={tickets}
          onOpenDay={(off) => { setDayOffset(off); setView('day'); }}
          onToggleDone={toggleDoneOn} onEditBlock={(b) => setSheet({ block: b })}
          onMoveBlock={moveBlockOnDay} onResizeBlock={resizeBlockOnDay}
          onUnrest={(ts, b) => setTickets(prev => ticketArr(prev).filter(e => { const n = normTicket(e); return !(n && n.d === dayKey(ts) && n.b === b.id); }))}
          onMoveAllForActivity={moveAllForActivity} onResizeAllForActivity={resizeAllForActivity} />
      ) : (
      <React.Fragment>
      {raceHidden
        ? <button type="button" className="race-reveal" onClick={() => setRaceHidden(false)} aria-label="Show race">
            <span className="race-reveal-face">{renderFace(avatar.emoji, 18)}</span>
            <span>Show race</span>
            {showBars && gapMin >= 1 && <span className="race-reveal-gap">{avatar.name} {formatHM(Math.round(gapMin) * 60)} ahead</span>}
            <span className="race-reveal-caret">▾</span>
          </button>
        : <div className="race-wrap">
            <button type="button" className="race-hide" onClick={() => setRaceHidden(true)} aria-label="Hide race">▲</button>
            {showBars
              ? <RaceHeader avatar={avatar} youMin={youMin} avatarMin={avatarMin} dayTotal={dayTotal} gapMin={gapMin} />
              : <div className="rh idle">
                  {isTicketDay
                    ? <button type="button" className="rh-face rh-face-poke" onClick={pokeDayRest} aria-label={'Poke ' + avatar.name}>{renderFace(avatar.emoji, 38)}</button>
                    : <span className="rh-face">{renderFace(avatar.emoji, 38)}</span>}
                  <div className="rh-bars"><div className="rh-status" style={{ textAlign: 'left' }}>
                    {isTicketDay
                      ? <React.Fragment><ActionEmoji code={dayRestLine.emoji} size={15} className="rh-rest-emo" fallback={glyphFromCode(dayRestLine.emoji)} label="" /> {statusLine}</React.Fragment>
                      : statusLine}
                  </div></div>
                </div>}
          </div>}

      <div className="cal-head">
        <button className="cal-nav" disabled={dayOffset <= minDayOffset} onClick={() => setDayOffset(d => Math.max(minDayOffset, d - 1))} aria-label="Previous day">‹</button>
        <div className="cal-date">
          <button className="cal-date-pick" onClick={() => setDateOpen(o => !o)} aria-label="Pick a date">
            <span className="cal-date-main">{isToday ? 'Today' : dateLabel}</span>
            <span className="cal-date-caret">▾</span>
          </button>
          {dateOpen && (
            <DatePopover value={viewTs} min={addDays(todayStart, minDayOffset)}
              onPick={(ts) => { const off = Math.round((startOfDay(ts) - todayStart) / 86400000); setDayOffset(Math.max(minDayOffset, off)); }}
              onClose={() => setDateOpen(false)} />
          )}
        </div>
        <button className="cal-nav" onClick={() => setDayOffset(d => d + 1)} aria-label="Next day">›</button>
        {pillPct !== null
          ? <span className={'cal-pill' + (pillPct >= 100 ? ' good' : pillPct >= 60 ? ' mid' : ' bad')}>{pillPct}% · {formatHM(Math.round(youMin) * 60)}</span>
          : <span className="cal-pill plan">{dayTotal > 0 ? formatHM(dayTotal * 60) : '—'}</span>}
        <button className="cal-list" onClick={() => setShowList(true)} aria-label="List of tasks">
          <svg width="17" height="17" viewBox="0 0 17 17" aria-hidden="true">
            <g stroke="currentColor" strokeWidth="1.7" strokeLinecap="round">
              <line x1="2.5" y1="4.5" x2="14.5" y2="4.5" />
              <line x1="2.5" y1="8.5" x2="14.5" y2="8.5" />
              <line x1="2.5" y1="12.5" x2="14.5" y2="12.5" />
            </g>
          </svg>
        </button>
        <button className="cal-add" onClick={() => setSheet({ isNew: true })} aria-label="Add block">＋</button>
      </div>

      <div className={'sched-ticket' + (hasTicketHere ? ' on' : '')}>
        {isTicketDay ? (
          <React.Fragment>
            <span className="sched-ticket-msg"><span className="sched-ticket-emo">🎟️</span><span className="sched-ticket-txt">Whole day excused — not graded.</span></span>
            <button className="sched-ticket-btn cancel" onClick={() => cancelTicket()}>Cancel</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <span className="sched-ticket-msg">
              {/* The 🎟️ itself is the drag handle — grab it and drop it on a task to
                  rest just that one (the "Rest a task" menu stays as the tap fallback). */}
              {ticketsLeft > 0 && restableBlocks.length > 0
                ? <span className="sched-ticket-emo grab" role="button" tabIndex={0}
                    onPointerDown={startTicketDrag} title="Drag onto a task to rest just that one"
                    aria-label="Drag onto a task to rest it">🎟️</span>
                : <span className="sched-ticket-emo">🎟️</span>}
              <span className="sched-ticket-txt">{excusedTasks.length > 0
                ? excusedTasks.length + ' task' + (excusedTasks.length === 1 ? '' : 's') + ' excused · ' + ticketsLeft + ' ticket' + (ticketsLeft === 1 ? '' : 's') + ' left'
                : ticketsLeft > 0
                  ? 'x' + ticketsLeft + ' rest ticket left'
                  : 'No rest tickets left this week'}</span>
            </span>
            {/* Actions hug the right as one tidy group, so the bar reads label-left /
                controls-right instead of floating with a big empty gap. */}
            <div className="sched-ticket-actions">
              {/* Each already-excused task — tap × to put it back into the grade. */}
              {excusedTasks.map(t => (
                <span key={t.id} className="ticket-chip">
                  <span className="ticket-chip-name">{t.name}</span>
                  <button className="ticket-chip-x" onClick={() => cancelTicket(t.id)} aria-label={'Stop resting ' + t.name}>×</button>
                </span>
              ))}
              {/* Excuse another task — only the ones not already rested, while tickets remain. */}
              {ticketsLeft > 0 && restableBlocks.length > 0 && (
                <RestTaskMenu blocks={restableBlocks} activities={activities} onPick={useTicket} />
              )}
              {/* Whole-day rest is only offered before any single task is excused. */}
              {excusedTasks.length === 0 && ticketsLeft > 0 && (
                <button className="sched-ticket-btn" onClick={() => useTicket(null)}
                  disabled={ticketsLeft < wholeDayCost}
                  title={ticketsLeft < wholeDayCost ? 'Needs ' + wholeDayCost + ' tickets' : ''}>
                  Rest this day · {wholeDayCost}🎟️
                </button>
              )}
            </div>
          </React.Fragment>
        )}
      </div>

      {/* Floating ticket that rides the finger while dragging a 🎟️ onto a task. */}
      <div className="tix-ghost" ref={tixGhostRef} aria-hidden="true"><span className="tix-tilt">🎟️</span></div>

      <div className="sched-cal-wrap">
        <TwoLaneTimeline blocks={viewBlocks} activities={activities} nowMin={effMin} isToday={isToday}
          daySeed={Math.round(viewTs / 86400000)} weekday={viewIdx}
          avatarEmoji={emoji} avatarName={avatar.name} behavior={avatar.behavior} lively={avatar.lively} getSegs={getSegs} onToggle={toggleDone} getSub={getSub}
          onSetSegs={setSegs} onEdit={(b) => setSheet({ block: b })}
          getAmount={getAmount} onSetAmount={setAmount} getWeekAmount={getWeekAmount}
          getNote={getNote} onSetNote={setNote}
          freeSessions={freeSessions} onAddFree={() => setSheet({ session: true })}
          onSetFree={setFreeSeg} onSplitFree={splitFree} onRemoveFree={removeFree}
          onDragCreate={(lane, a, b) => setSheet(lane === 'me' ? { session: true, start: a, end: b } : { isNew: true, start: a, end: b })}
          onResizeBlock={resizeBlock} onMoveBlock={moveBlock}
          onDeleteBlock={(b) => removeBlock(b.id)} onSplitBlock={splitBlock}
          isExcused={(blockId) => isTicketDay || blockTicketed(tickets, viewTs, blockId)}
          isBlockExcused={(blockId) => blockTicketed(tickets, viewTs, blockId)}
          onUnrest={(b) => cancelTicket(b.id)} />
      </div>
      </React.Fragment>
      )}

      {sheet && (
        <BlockSheet activities={activities} setActivities={setActivities} schedule={schedule}
          initial={sheet.block || null} defaultDay={viewIdx} session={!!sheet.session}
          defaultStart={sheet.start} defaultEnd={sheet.end}
          dayLabel={isToday ? 'today' : dateLabel}
          defaultSubName={sheet.block ? (() => { const a = findActivity(activities, sheet.block.activityId) || {}; return (a.dayLabels && a.dayLabels[viewIdx]) || ''; })() : ''}
          daySubName={(view === 'day' && sheet.block) ? getSub(sheet.block) : ''}
          onSetDaySubName={(view === 'day' && sheet.block) ? (text) => setSub(sheet.block.id, text) : null}
          onCancel={() => setSheet(null)}
          onSave={(b) => { if (sheet.session) addFree(b); else if (sheet.block) updateBlock(b); else addBlock(b); }}
          onDelete={sheet.block ? () => removeBlock(sheet.block.id) : null} />
      )}

      {showList && (
        <React.Fragment>
          <div className="sheet-backdrop" onClick={() => setShowList(false)} />
          <div className="sheet" role="dialog" aria-modal="true">
            <div className="sheet-grabber" />
            <div className="sheet-header">
              <button className="btn-ghost" onClick={() => setShowList(false)}>Close</button>
              <div className="sheet-title">{isToday ? "Today's tasks" : dateLabel}</div>
              <span style={{ width: 52 }} />
            </div>
            <div className="sheet-body">
              {(() => {
                // Simple single-column agenda: the day's planned tasks (the committed
                // self's plan — tap to edit) plus any extra sessions you logged yourself.
                const rows = [];
                for (const b of viewBlocks) {
                  const a = findActivity(activities, b.activityId);
                  const isHob = !!(a && a.type === 'hobby');
                  rows.push({ start: b.start, end: b.end, block: b,
                    name: a ? a.name : 'Deleted', color: a ? a.color : null, who: isHob ? 'hobby' : 'jek' });
                }
                for (const f of freeSessions) {
                  const a = findActivity(activities, f.activityId);
                  rows.push({ start: f.start, end: f.end,
                    name: a ? a.name : 'Session', color: a ? a.color : null, who: 'me' });
                }
                rows.sort((x, y) => x.start - y.start || x.end - y.end);
                if (!rows.length) return <p className="hist-note" style={{ textAlign: 'center', marginTop: 24 }}>No tasks on this day.</p>;
                return rows.map((r, i) => {
                  // Hobby = yours, but not raced by the avatar → tag it 🌿, not "✓ JEK".
                  const whoLabel = r.who === 'me' ? 'you' : r.who === 'hobby' ? 'for me' : '✓ ' + avatar.name;
                  const cls = 'agenda-row ' + (r.who === 'me' ? 'me' : r.who === 'hobby' ? 'hobby' : 'jek');
                  const inner = (
                    <React.Fragment>
                      <span className="agenda-time">{fmtClock(r.start)}–{fmtClock(r.end)}</span>
                      {r.color && <span className="agenda-dot" style={{ background: r.color }} />}
                      <span className="agenda-name">{r.name}</span>
                      <span className="agenda-who">{whoLabel}</span>
                    </React.Fragment>
                  );
                  return r.block
                    ? <button key={i} className={cls} onClick={() => { setSheet({ block: r.block }); setShowList(false); }}>{inner}</button>
                    : <div key={i} className={cls} style={{ cursor: 'default' }}>{inner}</div>;
                });
              })()}
            </div>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function ScheduleEditor({ activities, setActivities, schedule, setSchedule, onBack }) {
  const [day, setDay] = React.useState(dayIndexMon(Date.now()));
  const [sheet, setSheet] = React.useState(null); // { block } edit | { isNew: true }
  const dayBlocks = blocksForDay(schedule, day);
  const addBlock = (b) => setSchedule(prev => [...prev, b]);
  const updateBlock = (b) => setSchedule(prev => prev.map(x => x.id === b.id ? b : x));
  const removeBlock = (id) => setSchedule(prev => prev.filter(x => x.id !== id));

  return (
    <div className="editor-screen">
      <div className="editor-head">
        <button className="btn-ghost" onClick={onBack}>‹ Done</button>
        <div className="editor-title">Edit schedule</div>
        <span style={{ width: 52 }} />
      </div>
      <div className="day-tabs">
        {WEEKDAYS.map((lbl, i) => (
          <button key={i} className={'day-tab' + (day === i ? ' on' : '')} onClick={() => setDay(i)}>{lbl}</button>
        ))}
      </div>
      <div className="editor-dayname">{DAY_FULL[day]}</div>
      {dayBlocks.length === 0 ? (
        <p className="empty-sub editor-empty">No blocks on {DAY_FULL[day]} yet.</p>
      ) : (
        <div className="blockrow-list">
          {dayBlocks.map(b => {
            const a = findActivity(activities, b.activityId);
            const col = a ? a.color : '#64748b';
            return (
              <button key={b.id} className="blockrow" onClick={() => setSheet({ block: b })}>
                <span className="blockrow-time">{fmtClock(b.start)}<br />{fmtClock(b.end)}</span>
                <span className="blockrow-bar" style={{ background: col }} />
                <span className="blockrow-name">{a ? a.name : 'Deleted'}</span>
                {b.days.length > 1 && <span className="blockrow-days">×{b.days.length}d</span>}
              </button>
            );
          })}
        </div>
      )}
      <button className="btn-ghost btn-block" onClick={() => setSheet({ isNew: true })}>+ Add block</button>

      {sheet && (
        <BlockSheet
          activities={activities}
          setActivities={setActivities}
          schedule={schedule}
          initial={sheet.block || null}
          defaultDay={day}
          onCancel={() => setSheet(null)}
          onSave={(b) => { if (sheet.block) updateBlock(b); else addBlock(b); setSheet(null); }}
          onDelete={sheet.block ? () => { removeBlock(sheet.block.id); setSheet(null); } : null}
        />
      )}
    </div>
  );
}

function BlockSheet({ activities, setActivities, schedule, initial, defaultDay, defaultStart, defaultEnd, session, dayLabel, daySubName, defaultSubName, onSetDaySubName, onCancel, onSave, onDelete }) {
  const editing = !!initial;
  const [activityId, setActivityId] = React.useState(initial ? initial.activityId : (activities[0] ? activities[0].id : null));
  // Per-day sub-label (only offered when editing an existing block on a day view).
  const [subName, setSubName] = React.useState(daySubName || '');
  const [days, setDays] = React.useState(() => initial ? initial.days.slice() : ALL_DAYS.slice());
  // New blocks default to a dragged-out range if given, else the current time
  // (rounded to 5 min) → +1 hour.
  const nowStart = (() => { const d = new Date(); return Math.min(1380, Math.round((d.getHours() * 60 + d.getMinutes()) / 5) * 5); })();
  const baseStart = initial ? initial.start : (Number.isFinite(defaultStart) ? defaultStart : nowStart);
  const baseEnd = initial ? initial.end : (Number.isFinite(defaultEnd) ? defaultEnd : Math.min(1440, baseStart + 60));
  const [start, setStart] = React.useState(minToInput(baseStart));
  const [end, setEnd] = React.useState(minToInput(baseEnd));
  const [creating, setCreating] = React.useState(activities.length === 0);
  const [newName, setNewName] = React.useState('');
  const usedColors = activities.map(a => a.color);
  const [newColor, setNewColor] = React.useState(pickFreeColor(usedColors));

  const toggleDay = (i) => setDays(prev => prev.indexOf(i) === -1 ? [...prev, i].sort((a, b) => a - b) : prev.filter(d => d !== i));
  const createActivity = () => {
    const n = newName.trim(); if (!n) return;
    const a = { id: uid(), name: n, color: newColor, emoji: DEFAULT_TASK_EMOJI, createdAt: Date.now() };
    setActivities(prev => [...prev, a]);
    setActivityId(a.id); setCreating(false); setNewName('');
  };
  const sMin = inputToMin(start), eMin = inputToMin(end);
  const timeOk = eMin > sMin;
  const dur = eMin - sMin;
  // 12-hour clock label, e.g. 390 -> "6:30 AM" (1440 wraps to 12:00 AM = midnight).
  const fmt12 = (min) => { const m = ((Math.round(min) % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; const ap = h < 12 ? 'AM' : 'PM'; let hr = h % 12; if (hr === 0) hr = 12; return hr + ':' + String(mm).padStart(2, '0') + ' ' + ap; };
  const DURATIONS = [{ m: 30, l: '30m' }, { m: 45, l: '45m' }, { m: 60, l: '1h' }, { m: 90, l: '1.5h' }, { m: 120, l: '2h' }, { m: 180, l: '3h' }];
  // Times snap to 5-minute increments (no fiddly 7:23 ends).
  const snap5 = (m) => Math.round(m / 5) * 5;
  // Move the whole block, preserving its length (used by the start steppers and by
  // typing in the start field), clamped to stay within the day.
  const moveStartTo = (ns) => {
    ns = Math.max(0, Math.min(1425, snap5(ns)));
    let ne = snap5(ns + (dur > 0 ? dur : 60));
    if (ne > 1440) ne = 1440;
    if (ne <= ns) ne = Math.min(1440, ns + 15);
    setStart(minToInput(ns)); setEnd(minToInput(ne));
  };
  const onStartInput = (v) => { if (!v) { setStart(v); return; } moveStartTo(inputToMin(v)); };
  const setDuration = (d) => setEnd(minToInput(Math.min(1440, snap5(sMin) + d)));
  const extendEnd = (delta) => setEnd(minToInput(Math.max(snap5(sMin) + 5, Math.min(1440, snap5(eMin + delta)))));
  // Typing/picking an end time directly — snap to 5 min, clamp to stay after start.
  const onEndInput = (v) => { if (!v) { setEnd(v); return; } setEnd(minToInput(Math.max(snap5(sMin) + 5, Math.min(1440, snap5(inputToMin(v)))))); };
  const selAct = activities.find(a => a.id === activityId) || null;
  const unit = selAct && selAct.unit ? selAct.unit : '';
  // Recurring blocks may not overlap another block on a shared day (sessions are
  // your own real tracking, so they're allowed to overlap and skip this check).
  const conflict = (!session && timeOk && days.length > 0)
    ? findScheduleConflict(schedule || [], days, sMin, eMin, initial ? initial.id : null)
    : null;
  const conflictAct = conflict ? findActivity(activities, conflict.activityId) : null;
  // A name typed in "+ New" but not yet added — Save will create it (and it shows on Main).
  const pendingNew = creating && newName.trim().length > 0;
  const valid = (!!activityId || pendingNew) && (session || days.length > 0) && timeOk;  // overlaps allowed — warn only
  const save = () => {
    if (!valid) return;
    let useId = activityId;
    if (pendingNew) {
      const a = { id: uid(), name: newName.trim(), color: newColor, emoji: DEFAULT_TASK_EMOJI, createdAt: Date.now() };
      setActivities(prev => [...prev, a]); // adds to the shared list → appears on the Main page
      useId = a.id;
    }
    if (onSetDaySubName) onSetDaySubName(subName); // per-day sub-label (edit-on-day only)
    const s = snap5(sMin), e = Math.max(s + 5, snap5(eMin)); // persist on the 5-minute grid
    if (session) onSave({ id: initial ? initial.id : uid(), activityId: useId, start: s, end: e });
    else onSave({ id: initial ? initial.id : uid(), activityId: useId, days: days.slice().sort((a, b) => a - b), start: s, end: e });
  };

  return (
    <React.Fragment>
      <div className="sheet-backdrop" onClick={onCancel} />
      <div className="sheet" role="dialog" aria-modal="true">
        <div className="sheet-grabber" />
        <div className="sheet-header">
          <button className="btn-ghost" onClick={onCancel}>Cancel</button>
          <div className="sheet-title">{session ? (editing ? 'Edit session' : 'Log a session') : (editing ? 'Edit block' : 'New block')}</div>
          <button className="btn-primary" onClick={save} disabled={!valid} style={{ opacity: valid ? 1 : 0.4 }}>{editing ? 'Save' : 'Add'}</button>
        </div>
        <div className="sheet-body">
          <div className="race-setup-label">Activity</div>
          <div className="act-chip-row">
            {activities.filter(a => a.type !== 'hobby').map(a => (
              <button key={a.id} className={'act-chip' + (activityId === a.id ? ' on' : '')} onClick={() => { setActivityId(a.id); setCreating(false); }}>
                <span className="act-chip-dot" style={{ background: a.color }} />{a.name}
              </button>
            ))}
            <button className={'act-chip add' + (creating ? ' on' : '')} onClick={() => setCreating(c => !c)}>＋ New</button>
          </div>
          {activities.some(a => a.type === 'hobby') && (
            <React.Fragment>
              <div className="race-setup-label" style={{ marginTop: 14 }}>For me</div>
              <div className="act-chip-row">
                {activities.filter(a => a.type === 'hobby').map(a => (
                  <button key={a.id} className={'act-chip' + (activityId === a.id ? ' on' : '')} onClick={() => { setActivityId(a.id); setCreating(false); }}>
                    <span className="act-chip-dot" style={{ background: a.color }} />{a.name}
                  </button>
                ))}
              </div>
            </React.Fragment>
          )}
          {creating && (
            <div className="act-create">
              <input className="input-underline" placeholder="e.g. Deep work" value={newName} onChange={e => setNewName(e.target.value)} autoFocus />
              <div className="act-color-row">
                {ACTIVITY_COLORS.map(c => (
                  <button key={c} className={'act-color-swatch' + (newColor === c ? ' on' : '')} style={{ background: c }} onClick={() => setNewColor(c)} aria-label={'color ' + c} />
                ))}
              </div>
              <button className="btn-ghost btn-block" onClick={createActivity}>Add this activity</button>
            </div>
          )}

          {onSetDaySubName && (
            <React.Fragment>
              <div className="race-setup-label">Label for {dayLabel || 'this day'}</div>
              <input className="input-underline" maxLength={40} value={subName}
                placeholder={defaultSubName || 'e.g. Leg day, Chapter 3, Sprint review…'}
                onChange={e => setSubName(e.target.value)} />
              <div className="race-setup-explain" style={{ marginTop: 4 }}>
                {defaultSubName
                  ? 'Overrides the default “' + defaultSubName + '” for ' + (dayLabel || 'this day') + ' only.'
                  : 'Optional — shows on this task’s box for ' + (dayLabel || 'this day') + ' only.'}
              </div>
            </React.Fragment>
          )}

          <div className="race-setup-label">Starts</div>
          <div className="time-row">
            <button type="button" className="cal-nav" onClick={() => moveStartTo(sMin - 15)} aria-label="15 minutes earlier">−</button>
            <input className="time-input" type="time" step={300} value={start} onChange={e => onStartInput(e.target.value)} />
            <button type="button" className="cal-nav" onClick={() => moveStartTo(sMin + 15)} aria-label="15 minutes later">＋</button>
          </div>
          <div className="race-setup-label">Ends</div>
          <div className="time-row">
            <button type="button" className="cal-nav" onClick={() => extendEnd(-15)} aria-label="15 minutes earlier">−</button>
            <input className="time-input" type="time" step={300} value={end} onChange={e => onEndInput(e.target.value)} />
            <button type="button" className="cal-nav" onClick={() => extendEnd(15)} aria-label="15 minutes later">＋</button>
          </div>
          <div className="race-setup-label">For how long?</div>
          <div className="act-chip-row">
            {DURATIONS.map(d => (
              <button key={d.m} type="button" className={'act-chip' + (dur === d.m ? ' on' : '')} onClick={() => setDuration(d.m)}>{d.l}</button>
            ))}
            <button type="button" className="act-chip add" onClick={() => extendEnd(15)} aria-label="Add 15 minutes">+15m</button>
          </div>
          <div className="race-setup-explain" style={{ marginTop: 8, color: timeOk ? 'var(--accent)' : '#fbbf24' }}>
            {timeOk ? '→ Ends ' + fmt12(eMin) + ' · ' + fmtDur(dur) : 'End time must be after start.'}
          </div>

          {session ? (
            <div className="race-setup-explain">Logs a session on your (ME) side for this day — no need for a matching avatar task.</div>
          ) : (
            <React.Fragment>
              <div className="race-setup-label">Repeat on days</div>
              <div className="weekday-row">
                {WEEKDAYS.map((lbl, i) => (
                  <button key={i} className={'weekday-chip' + (days.indexOf(i) !== -1 ? ' on' : '')} onClick={() => toggleDay(i)} aria-label={'day ' + i}>{lbl}</button>
                ))}
              </div>
              <div className="race-setup-explain">
                {days.length === 0 ? 'Pick at least one day.' : 'Repeats on ' + days.length + ' day' + (days.length === 1 ? '' : 's') + ' every week.'}
              </div>
              {conflict && (
                <div className="race-setup-explain" style={{ color: '#fbbf24' }}>
                  ⓘ Overlaps “{conflictAct ? conflictAct.name : 'another block'}” ({fmtClock(conflict.start)}–{fmtClock(conflict.end)}) — that's allowed, both will run at the same time.
                </div>
              )}
            </React.Fragment>
          )}

          {editing && onDelete && (
            <button className="btn-ghost btn-block" style={{ color: 'var(--danger)', marginTop: 18 }} onClick={onDelete}>Delete</button>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

// Week rollup at the top of History: how many planned days you kept up with your
// committed self this week, the time lost to skips, and a Mon-Sun status strip.
const WEEK_GLYPH = { kept: '⭐', behind: '✕', today: '•', future: '·', none: '–', rest: '💤' };
function WeekCard({ week, streak }) {
  const { days, keptCount, finishedPlanned, totalGap, overallPct } = week;
  const barCls = overallPct == null ? '' : overallPct >= 100 ? ' good' : overallPct >= 60 ? ' mid' : ' bad';
  const headline = finishedPlanned === 0
    ? 'Your week starts here'
    : keptCount + ' / ' + finishedPlanned + ' day' + (finishedPlanned === 1 ? '' : 's') + ' kept up';
  const sub = week.totalPlan <= 0
    ? 'Check off blocks to grade this week.'
    : totalGap >= 1
      ? formatHM(Math.round(totalGap) * 60) + ' lost to skips so far'
      : 'In step — nothing lost yet';
  return (
    <div className="week-card">
      <div className="week-card-top">
        <span className="week-card-label">This week</span>
        {streak > 0 && <span className="week-streak">🔥 {streak}-day streak</span>}
      </div>
      <div>
        <div className="week-headline">{headline}</div>
        <div className="week-sub">{sub}</div>
      </div>
      {overallPct != null && (
        <div className={'week-bar' + barCls}><div className="week-fill" style={{ width: Math.min(100, overallPct) + '%' }} /></div>
      )}
      <div className="week-strip">
        {days.map(d => (
          <div key={d.dow} className={'week-day ' + d.status + (d.isToday ? ' today' : '')}>
            <span className="week-day-lbl">{WEEKDAYS[d.dow]}</span>
            <span className="week-day-glyph">{WEEK_GLYPH[d.status]}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// Multi-week trend below the week card: a kept% bar per week (oldest → newest, the
// current week last) plus a Mon-Sun heatmap so a slip shows up as a pattern, not a
// one-off. Both read straight off weeklyTrend → same scoring as "This week".
function mdLabel(ts) { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate(); }
function TrendCard({ trend }) {
  return (
    <div className="trend-card">
      <div className="trend-card-top">
        <span className="week-card-label">Last {trend.length} weeks</span>
      </div>
      <div className="trend-bars">
        {trend.map((wk, i) => {
          const pct = wk.overallPct;
          const cls = pct == null ? 'empty' : pct >= 100 ? 'good' : pct >= 60 ? 'mid' : 'bad';
          const isCur = i === trend.length - 1;
          return (
            <div key={wk.weekStart} className={'trend-col' + (isCur ? ' cur' : '')}>
              <span className="trend-col-pct">{pct == null ? '–' : pct + '%'}</span>
              <div className="trend-track">
                <div className={'trend-fill ' + cls} style={{ height: (pct == null ? 0 : Math.max(4, Math.min(100, pct))) + '%' }} />
              </div>
              <span className="trend-col-lbl">{isCur ? 'now' : mdLabel(wk.weekStart)}</span>
            </div>
          );
        })}
      </div>
      <div className="trend-heat">
        <div className="trend-heat-row trend-heat-head">
          <span className="trend-heat-wk" />
          {WEEKDAYS.map((w, i) => <span key={i} className="trend-heat-dow">{w}</span>)}
        </div>
        {trend.map(wk => (
          <div key={wk.weekStart} className="trend-heat-row">
            <span className="trend-heat-wk">{mdLabel(wk.weekStart)}</span>
            {wk.days.map(d => (
              <span key={d.dow}
                className={'trend-cell ' + d.status + (d.isToday ? ' today' : '')}
                title={WEEKDAYS[d.dow] + (d.pct != null ? ' · ' + d.pct + '% kept' : '')} />
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// History = your accountability record: each planned day, how you did vs the
// committed self. Reconstructed from `done` + the current recurring schedule.
// Per-activity totals for the CURRENT week: full weekly plan vs done-so-far
// minutes (rest days excluded; free sessions credited to their activity). Drives
// the Progress page's "this week by task" bars.
// Total WORK amount you've logged for one activity across the Mon-week containing
// weekStartTs — summed over every block of that activity, every day. The weekly
// goal (Activity.weeklyAmount) is what this counts toward.
function weekAmountLogged(activityId, schedule, done, weekStartTs) {
  let sum = 0;
  for (let i = 0; i < 7; i++) {
    const dmap = done[dayKey(addDays(weekStartTs, i))] || {};
    for (const b of blocksForDay(schedule, dayIndexMon(addDays(weekStartTs, i)))) {
      if (b.activityId !== activityId) continue;
      const e = dmap[b.id];
      if (e && typeof e === 'object' && typeof e.amount === 'number') sum += e.amount;
    }
  }
  return sum;
}

function weekByActivity(activities, schedule, done, now, restDays, tickets) {
  const rest = restDays || [];
  const ws = startOfWeek(now);
  const todayStart = startOfDay(now);
  const nowMin = nowMinutes(now);
  const acc = {};
  const bump = (id) => (acc[id] || (acc[id] = { planMin: 0, doneMin: 0, amount: 0, avatarMin: 0, sessions: 0 }));
  for (let i = 0; i < 7; i++) {
    if (rest.indexOf(i) !== -1) continue;
    const ts = addDays(ws, i);
    if (isTicketed(tickets, ts)) continue; // whole-day excuse — leave it out of the weekly task totals
    const dStart = startOfDay(ts);
    const doneCap = dStart > todayStart ? 0 : (dStart === todayStart ? nowMin : 1440);
    const dmap = done[dayKey(ts)] || {};
    for (const b of gradedBlocks(blocksForDay(schedule, dayIndexMon(ts)), tickets, ts, activities)) { // task-excused + hobby blocks drop out
      const a = bump(b.activityId);
      a.sessions += 1; // each scheduled block = one session (drives the per-session amount goal)
      const fullDur = Math.max(0, b.end - b.start);
      a.planMin += fullDur; // the whole week's plan for this task
      a.avatarMin += Math.max(0, Math.min(doneCap, b.end) - b.start); // committed self banks settled-so-far
      let s = 0;
      for (const g of blockSegs(dmap, b)) s += Math.max(0, Math.min(doneCap, g.end) - g.start);
      a.doneMin += Math.min(fullDur, s);
      const e = dmap[b.id]; // logged work amount toward the weekly goal
      if (e && typeof e === 'object' && typeof e.amount === 'number') a.amount += e.amount;
    }
    for (const f of (dmap._free || [])) bump(f.activityId).doneMin += Math.max(0, Math.min(doneCap, f.end) - f.start);
  }
  return activities
    .map(act => {
      const t = acc[act.id] || { planMin: 0, doneMin: 0, amount: 0, avatarMin: 0, sessions: 0 };
      const pct = t.planMin > 0 ? Math.round((t.doneMin / t.planMin) * 100) : (t.doneMin > 0 ? 100 : 0);
      // Per-session goal rolled up: week target = goal-per-session × sessions this week.
      const perSession = actAmtTarget(act);
      const weeklyAmount = perSession > 0 ? perSession * t.sessions : 0;
      const amountPct = weeklyAmount > 0 ? Math.round((t.amount / weeklyAmount) * 100) : null;
      return { activity: act, planMin: t.planMin, doneMin: t.doneMin, avatarMin: t.avatarMin, pct, weeklyAmount, perSession, amountDone: t.amount, amountPct };
    })
    .filter(r => r.planMin > 0 || r.doneMin > 0 || r.weeklyAmount > 0 || r.amountDone > 0)
    .sort((a, b) => b.planMin - a.planMin || b.doneMin - a.doneMin);
}

// Progress page (formerly History): this week's overview + each task's progress.
// Single-day accountability detail for the Progress tab's Day mode: that day's
// % kept + each scheduled block's status (Done / In progress / Upcoming / Missed),
// navigable to any day. Mirrors the Schedule tab's Day/Week split.
function DayProgress({ activities, schedule, done, rest, tickets, now, dayOffset, setDayOffset, avatar }) {
  const todayStart = startOfDay(now);
  const minDayOffset = Math.min(0, Math.round((earliestTrackedDay(done, now) - todayStart) / 86400000));
  React.useEffect(() => { if (dayOffset < minDayOffset) setDayOffset(minDayOffset); }, [minDayOffset, dayOffset]);
  const ts = addDays(todayStart, dayOffset);
  const idx = dayIndexMon(ts);
  const isToday = dayOffset === 0, isFuture = dayOffset > 0;
  const dmap = done[dayKey(ts)] || {};
  const blocks = blocksForDay(schedule, idx);
  // A weekday rest OR a rest-ticket on this date excuses it from grading.
  const isTicketDay = isTicketed(tickets, ts);
  const isRest = rest.indexOf(idx) !== -1 || isTicketDay;
  const nowMin = nowMinutes(now);
  const cap = isFuture ? 0 : (isToday ? nowMin : 1440);
  const gradeB = gradedBlocks(blocks, tickets, ts, activities); // task-excused + hobby blocks don't count toward the day's grade
  const sc = dayScore(gradeB, dmap, cap);
  const cr = dayCredit(gradeB, dmap, cap, activities);
  const dateLabel = new Date(ts).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const pillPct = (!isRest && !isFuture && cr.pct != null) ? cr.pct : null;

  return (
    <React.Fragment>
      <div className="cal-head">
        <button className="cal-nav" disabled={dayOffset <= minDayOffset} onClick={() => setDayOffset(d => Math.max(minDayOffset, d - 1))} aria-label="Previous day">‹</button>
        <div className="cal-date">
          <span className="cal-date-main">{isToday ? 'Today' : dateLabel}</span>
        </div>
        <button className="cal-nav" onClick={() => setDayOffset(d => d + 1)} aria-label="Next day">›</button>
        {pillPct !== null
          ? <span className={'cal-pill' + (pillPct >= 100 ? ' good' : pillPct >= 60 ? ' mid' : ' bad')}>{pillPct}% · {formatHM(Math.round(sc.doneMin) * 60)}</span>
          : <span className="cal-pill plan">{sc.planMin > 0 ? formatHM(Math.round(sc.planMin) * 60) : '—'}</span>}
      </div>

      <div className="section-label">{isToday ? 'Today by task' : 'By task'}</div>
      {isTicketDay ? (
        <p className="hist-note" style={{ textAlign: 'left' }}><span className="tix-tilt">🎟️</span> Rest ticket — this day is excused, not graded.</p>
      ) : isRest ? (
        <p className="hist-note" style={{ textAlign: 'left' }}>💤 Rest day — no plan to keep up with.</p>
      ) : blocks.length === 0 ? (
        <p className="hist-note" style={{ textAlign: 'left' }}>{isFuture ? 'Nothing planned for this day.' : 'No blocks scheduled. Add some on the Schedule tab.'}</p>
      ) : (
        <div className="dayp-list">
          {blocks.map(b => {
            const a = findActivity(activities, b.activityId);
            const segs = blockSegs(dmap, b);
            const doneMin = segs.reduce((s, x) => s + Math.max(0, x.end - x.start), 0);
            const planMin = Math.max(0, b.end - b.start);
            const p = planMin > 0 ? Math.min(100, Math.round(doneMin / planMin * 100)) : 0;
            const started = !isFuture && (!isToday || nowMin >= b.start);
            const ended = !isFuture && (!isToday || nowMin >= b.end);
            const excused = blockTicketed(tickets, ts, b.id); // rest-ticket spent on just this task
            let vcls, verdict;
            if (excused) { vcls = 'muted'; verdict = <React.Fragment><span className="tix-tilt">🎟️</span> Excused</React.Fragment>; }
            else if (segs.length) { vcls = 'good'; verdict = 'Done'; }
            else if (!started) { vcls = 'muted'; verdict = 'Upcoming'; }
            else if (ended) { vcls = 'bad'; verdict = 'Missed'; }
            else { vcls = 'mid'; verdict = 'In progress'; }
            const name = a ? a.name : 'Deleted';
            const col = a ? a.color : '#64748b';
            return (
              <div key={b.id} className={'dayp-row' + (excused ? ' excused' : '')} style={{ borderLeft: '3px solid ' + col }}>
                <span className="dayp-glyph">
                  <ActionEmoji code={a && a.emoji} size={18} fallback={taskGlyph(a)} label={name} />
                </span>
                <div className="dayp-main">
                  <div className="dayp-top">
                    <span className="dayp-date">{name}</span>
                    <span className={'dayp-verdict ' + vcls}>{verdict}{segs.length ? ' · ' + p + '%' : ''}</span>
                  </div>
                  {started ? (
                    <div className="dayp-race">
                      <div className="dayp-race-row">
                        <span className="dayp-race-face">{renderFace(avatar.emoji, 16)}</span>
                        <div className="dayp-race-track"><div className="dayp-race-fill av" style={{ width: '100%' }} /></div>
                        <span className="dayp-race-val">{formatHM(Math.round(planMin) * 60)}</span>
                      </div>
                      <div className="dayp-race-row">
                        <span className="dayp-race-tag">YOU</span>
                        <div className="dayp-race-track"><div className="dayp-race-fill me" style={{ width: p + '%' }} /></div>
                        <span className="dayp-race-val">{formatHM(Math.round(doneMin) * 60)}</span>
                      </div>
                      <div className="dayp-race-note">{fmtClock(b.start)}–{fmtClock(b.end)} · {planMin - doneMin >= 1 ? formatHM(Math.round(planMin - doneMin) * 60) + ' behind ' + avatar.name : 'In step with ' + avatar.name}</div>
                    </div>
                  ) : (
                    <div className="dayp-sub">{fmtClock(b.start)}–{fmtClock(b.end)} · {fmtDur(planMin)} planned · {avatar.name} will run it</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
      <p className="hist-note">Use ‹ › to review any day.</p>
    </React.Fragment>
  );
}

function HistoryScreen({ activities, schedule, done, avatar, tickets, plan, onOpenBilling }) {
  const rest = (avatar && avatar.restDays) || [];
  const now = Date.now();
  const earliest = earliestTrackedDay(done, now);
  const week = weekSummary(schedule, done, now, earliest, rest, tickets, activities);
  const streak = keptStreak(schedule, done, now, earliest, rest, tickets, activities);
  const byTask = weekByActivity(activities, schedule, done, now, rest, tickets);
  const trend = weeklyTrend(schedule, done, now, earliest, rest, 6, tickets, activities);
  const [view, setView] = React.useState(() => {
    try { const s = localStorage.getItem(K.progressView); if (s === 'week' || s === 'day') return s; } catch {}

  });   // 'day' | 'week'

  return (
    <div className="hist-screen">

      <React.Fragment>
      <WeekCard week={week} streak={streak} />
      {trend.length >= 2 && (planAllows(plan, 'trends')
        ? <TrendCard trend={trend} />
        : <ProLock tier="pro" title="Multi-week trend & heatmap"
