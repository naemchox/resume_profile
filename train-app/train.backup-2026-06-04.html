      <div className="section-label">This week by day</div>
      <div className="dayp-list">
        {week.days.map(d => {
          const dt = new Date(d.ts);
          const dateStr = dt.toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + dt.getDate();
          let verdict, cls;
          if (d.status === 'kept') { verdict = 'Kept up'; cls = 'good'; }
          else if (d.status === 'behind') { verdict = 'Slipped'; cls = 'bad'; }
          else if (d.status === 'today') { verdict = 'In progress'; cls = 'mid'; }
          else if (d.status === 'rest') { verdict = 'Rest day'; cls = 'muted'; }
          else if (d.status === 'future') { verdict = 'Upcoming'; cls = 'muted'; }
          else { verdict = d.hasPlan ? 'No record' : 'No plan'; cls = 'muted'; }
          const showTime = d.hasPlan && !d.isFuture && d.status !== 'rest' && d.planMin > 0;
          return (
            <div key={d.dow} className={'dayp-row' + (d.isToday ? ' today' : '')}>
              <span className="dayp-glyph">{WEEK_GLYPH[d.status]}</span>
              <div className="dayp-main">
                <div className="dayp-top">
                  <span className="dayp-date">{dateStr}</span>
                  <span className={'dayp-verdict ' + cls}>{verdict}{showTime && d.pct != null ? ' · ' + d.pct + '%' : ''}</span>
                </div>
                {showTime && (
                  <div className="dayp-race">
                    <div className="dayp-race-row">
                      <span className="dayp-race-face">{renderFace(avatar.emoji, 16)}</span>
                      <div className="dayp-race-track"><div className="dayp-race-fill av" style={{ width: '100%' }} /></div>
                      <span className="dayp-race-val">{formatHM(Math.round(d.planMin) * 60)}</span>
                    </div>
                    <div className="dayp-race-row">
                      <span className="dayp-race-tag">YOU</span>
                      <div className="dayp-race-track"><div className="dayp-race-fill me" style={{ width: Math.min(100, d.pct || 0) + '%' }} /></div>
                      <span className="dayp-race-val">{formatHM(Math.round(d.doneMin) * 60)}</span>
                    </div>
                    <div className="dayp-race-note">{d.gapMin >= 1 ? formatHM(Math.round(d.gapMin) * 60) + ' behind ' + avatar.name : 'In step with ' + avatar.name}</div>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <div className="section-label">This week by task</div>
      {byTask.length === 0 ? (
        <p className="hist-note" style={{ textAlign: 'left' }}>No tasks scheduled this week yet. Add blocks on the Schedule tab and your progress per task shows up here.</p>
      ) : (
        <div className="task-prog-list">
          {byTask.map(r => {
            const a = r.activity;
            // When a task has a weekly work goal, that goal is the headline metric
            // (% + bar); time is shown underneath. Otherwise time leads as before.
            const hasGoal = r.weeklyAmount > 0;
            const pct = hasGoal ? (r.amountPct || 0) : r.pct;
            const cls = pct >= 100 ? 'good' : pct >= 60 ? 'mid' : 'bad';
            const glyph = TASK_EMOJI_CHAR[a.emoji] || glyphFromCode(a.emoji) || '💪';
            const unit = a.unit || '';
            const avPct = r.planMin > 0 ? Math.min(100, Math.round(r.avatarMin / r.planMin * 100)) : 0;
            const mePct = r.planMin > 0 ? Math.min(100, Math.round(r.doneMin / r.planMin * 100)) : 0;
            return (
              <div key={a.id} className="task-prog">
                <div className="task-prog-top">
                  <span className="task-prog-name">
                    <span className="task-prog-emoji" style={{ borderColor: a.color }}>
                      <ActionEmoji code={a.emoji} size={16} fallback={glyph} label={a.name} />
                    </span>
                    {a.name}
                  </span>
                  <span className={'task-prog-pct ' + cls}>{pct}%</span>
                </div>
                {hasGoal && (
                  <React.Fragment>
                    <div className="task-prog-bar"><div className="task-prog-fill" style={{ width: Math.min(100, pct) + '%', background: a.color }} /></div>
                    <div className="task-prog-sub">{r.amountDone} / {r.weeklyAmount}{unit ? ' ' + unit : ''} this week</div>
                  </React.Fragment>
                )}
                <div className="tp-race">
                  <div className="tp-row">
                    <span className="tp-tag jek" title={avatar.name}>{avatar.name}</span>
                    <span className="tp-track"><span className="tp-fill jek" style={{ width: avPct + '%' }} /></span>
                    <span className="tp-val">{formatHM(Math.round(r.avatarMin) * 60)}</span>
                  </div>
                  <div className="tp-row">
                    <span className="tp-tag me">ME</span>
                    <span className="tp-track"><span className="tp-fill me" style={{ width: mePct + '%', background: a.color }} /></span>
                    <span className="tp-val">{formatHM(Math.round(r.doneMin) * 60)}</span>
                  </div>
                </div>
                <div className="task-prog-sub" style={{ opacity: 0.7, marginTop: 5 }}>of {formatHM(Math.round(r.planMin) * 60)} planned this week</div>
              </div>
            );
          })}
        </div>
      )}
      <p className="hist-note">Plan = this week's full schedule; rest days are excluded.</p>
      </React.Fragment>
      )}
    </div>
  );
}

// Dashboard "what's happening now" card: the live block, the next block, or a
// rest/empty/done state. Taps through to the Schedule tab.
function DashUpNext({ liveBlock, liveAct, nextBlock, nextAct, todayBlocks, isRest, onOpen }) {
  let glyph, label, time, tone;
  if (isRest) { glyph = '🌿'; label = 'Rest day'; time = 'Enjoy the break — no plan today.'; tone = 'idle'; }
  else if (todayBlocks.length === 0) { glyph = '＋'; label = 'Nothing planned today'; time = 'Tap to build your schedule.'; tone = 'idle'; }
  else if (liveBlock) { glyph = taskGlyph(liveAct); label = 'Now · ' + (liveAct ? liveAct.name : 'Session'); time = 'until ' + fmtClock(liveBlock.end); tone = 'live'; }
  else if (nextBlock) { glyph = taskGlyph(nextAct); label = 'Next · ' + (nextAct ? nextAct.name : 'Session'); time = 'at ' + fmtClock(nextBlock.start); tone = 'next'; }
  else { glyph = '✓'; label = 'All done for today'; time = "Plan complete — you kept up."; tone = 'done'; }
  return (
    <button className={'dash-next tone-' + tone} onClick={onOpen}>
      <span className="dash-next-glyph">{glyph}</span>
      <span className="dash-next-body">
        <span className="dash-next-label">{label}</span>
        <span className="dash-next-time">{time}</span>
      </span>
      <span className="dash-next-arrow">›</span>
    </button>

}

function MainScreen({ avatar, setAvatar, activities, setActivities, schedule, setSchedule, done, tickets, onCustomize, onOpenTab, plan, onOpenBilling }) {
  // Tick slowly so the hero reflects blocks going live / ending in real time.
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => { const i = setInterval(() => setNow(Date.now()), 20000); return () => clearInterval(i); }, []);
  const [renaming, setRenaming] = React.useState(false);
  // Tap the avatar to "poke" it: a quick bounce + a random line in its voice.
  const [poke, setPoke] = React.useState(null); // { msg, emoji, n } while a poke is showing
  const pokeRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(pokeRef.current), []);
  const doPoke = () => {
    let msg, emoji;
    // If the avatar is mid-task right now, react to THAT specific habit (names it +
    // shows the habit's own emoji); otherwise fall back to a generic personality line.
    if (liveBlock && liveAct) {
      const set = HABIT_POKE_LINES[avatar.behavior] || HABIT_POKE_LINES.coach;
      const pick = set[Math.floor(Math.random() * set.length)];
      msg = pick.msg.replace('{act}', liveAct.name);
      emoji = pick.emoji; // each line has its own reaction emoji, distinct from the habit's
    } else {
      const lines = POKE_LINES[avatar.behavior] || POKE_LINES.coach;
      const pick = lines[Math.floor(Math.random() * lines.length)];
      msg = pick.msg; emoji = pick.emoji;
    }
    setPoke(p => ({ msg, emoji, n: (p ? p.n : 0) + 1 }));
    clearTimeout(pokeRef.current);
    pokeRef.current = setTimeout(() => setPoke(null), 2600);
  };
  const nowMin = nowMinutes(now);
  // A whole-day rest ticket excuses today entirely — the avatar rests too (no race,
  // no "behind"), exactly like a planned rest day. Computed up here so the race bars,
  // mini stats and headline all agree.
  const dayExcused = isTicketed(tickets, now);
  // Hobbies never race the avatar, so they're left out of the avatar's day entirely
  // (race bars, live/next block, pokes). They still live on the Schedule timeline.
  // gradedBlocks ALSO drops any TASK-level rest ticket so the avatar rests that one
  // block too — without this the dashboard kept racing excused tasks.
  const todayBlocks = gradedBlocks(blocksForDay(schedule, dayIndexMon(now)), tickets, now, activities);
  const sc = dayScore(todayBlocks, done[dayKey(now)] || {}, nowMin);
  const cr = dayCredit(todayBlocks, done[dayKey(now)] || {}, nowMin, activities); // amount-aware (JEK/ME bars + %)
  const pct = cr.pct;
  let dayTotal = 0; for (const b of todayBlocks) dayTotal += Math.max(0, b.end - b.start);
  const liveBlock = todayBlocks.find(b => nowMin >= b.start && nowMin < b.end) || null;
  const liveAct = liveBlock ? findActivity(activities, liveBlock.activityId) : null;
  const nextBlock = todayBlocks.find(b => b.start > nowMin) || null;
  const nextAct = nextBlock ? findActivity(activities, nextBlock.activityId) : null;
  const allPast = todayBlocks.length > 0 && todayBlocks.every(b => nowMin >= b.end);

  // This-week rollup + streak, shared with the Progress tab so they never disagree.
  const earliest = earliestTrackedDay(done, now);
  const week = weekSummary(schedule, done, now, earliest, avatar.restDays, tickets, activities);
  const streak = keptStreak(schedule, done, now, earliest, avatar.restDays, tickets, activities);

  // The headline says what the avatar is FEELING (emotion) or DOING (the live
  // activity) right now; the sub-line carries the supporting detail.
  // First pick the STATE + visuals (tone/anim/reaction emoji); the WORDS then
  // come from the avatar's personality (behaviorCopy) so they read in JEK's voice.
  const isRest = (avatar.restDays || []).indexOf(dayIndexMon(now)) !== -1;
  const restLike = isRest || dayExcused; // planned rest day OR a whole-day rest ticket
  // A per-task rest ticket whose slot is happening RIGHT NOW: that block was filtered
  // out of the race (todayBlocks), so the avatar is resting THAT task — surface a rest
  // emotion for it instead of a stale "kept up". (A real live block still wins.)
  const restingBlock = (!restLike)
    ? (blocksForDay(schedule, dayIndexMon(now)).find(b => nowMin >= b.start && nowMin < b.end && blockTicketed(tickets, now, b.id)) || null)
    : null;
  const restingAct = restingBlock ? findActivity(activities, restingBlock.activityId) : null;
  let state, tone, anim;
  if (restLike) {
    state = 'rest'; tone = 'idle'; anim = 'idle';
  } else if (liveBlock) {
    // A live block wins over the "behind" emotion: while the avatar is DOING an
    // activity, show that activity's emoji. Emotions only show when nothing's live.
    state = 'working'; tone = sc.gapMin >= 1 ? 'behind' : 'go'; anim = 'run';
  } else if (restingBlock) {
    // The avatar is taking the rest ticket on this task — resting it with you.
    state = 'resttask'; tone = 'idle'; anim = 'idle';
  } else if (todayBlocks.length === 0) {
    state = 'ready'; tone = 'idle'; anim = 'idle';
  } else if (sc.gapMin >= 1) {
    state = 'behind'; tone = 'behind'; anim = 'dash';
  } else if (allPast) {
    state = 'done'; tone = 'go'; anim = 'idle';
  } else {
    state = 'ontrack'; tone = 'go'; anim = 'run';
  }
  // Reaction emoji = the personality's emotion for this state, EXCEPT a live block
  // shows the activity's own emoji (the avatar is doing that task right now).
  const action = (state === 'working' && liveAct && liveAct.emoji)
    ? { code: liveAct.emoji, label: liveAct.name, fallback: glyphFromCode(liveAct.emoji) }
    : actionFor(avatar.behavior, state);
  const { head, sub } = behaviorCopy(avatar.behavior, state, {
    name: avatar.name,
    activity: liveAct ? liveAct.name : (restingAct ? restingAct.name : null),
    gap: formatHM(Math.round(sc.gapMin) * 60),
    pct,
  });
  const hour = new Date(now).getHours();
  const greet = hour < 5 ? 'Late night' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const dateStr = new Date(now).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

  // Condensed Today / Up-next / This-week stats for the compact 3-cell strip inside
  // the hero card — the user wants these summarized in here, NOT as big stacked cards.
  // When there's a plan today, render Today as a progress BAR (kept % of the day so
  // far) like the race header; rest / no-plan days stay as a short text value.
  const miniToday = restLike
    ? { val: dayExcused ? 'Excused' : 'Rest', sub: dayExcused ? 'rest ticket' : 'day off' }
    : todayBlocks.length === 0
      ? { val: '—', sub: 'no plan' }
      : { race: true,
          jek: dayTotal > 0 ? Math.min(100, cr.plan / dayTotal * 100) : 0,
          me: dayTotal > 0 ? Math.min(100, cr.done / dayTotal * 100) : 0,
          jekVal: formatHM(Math.round(cr.plan) * 60),
          meVal: formatHM(Math.round(cr.done) * 60),
          sub: sc.gapMin >= 1 ? formatHM(Math.round(sc.gapMin) * 60) + ' behind' : 'in step' };
  // Right corner = what's coming up next (live block, then the next one, else done).
  const miniNext = restLike
    ? (dayExcused ? { val: <span className="tix-tilt">🎟️</span>, sub: 'excused' } : { val: '🌿', sub: 'rest day' })
    : liveBlock
      ? { val: 'Now', sub: liveAct ? liveAct.name : 'In progress' }
      : restingBlock
        ? { val: <span className="tix-tilt">🎟️</span>, sub: restingAct ? 'resting ' + restingAct.name : 'resting' }
      : nextBlock
        ? { val: fmtClock(nextBlock.start), sub: nextAct ? nextAct.name : 'Next block' }
        : todayBlocks.length === 0
          ? { val: '—', sub: 'no plan' }
          : { val: 'Done', sub: 'kept up' };
  return (
    <div className="main-screen">
      <div className="dash-top">
        <div className="dash-top-l">
          <div className="dash-greet">{greet}</div>
          <div className="dash-date">{dateStr}</div>

          <span className="dash-name-txt">{avatar.name}</span>
          <span className="dash-name-edit">✎</span>
        </button>
      </div>

      {/* One unified hero card: avatar + today's race + up-next + this-week, all in
          here (the user asked for those three data blocks to live inside the hero,
          not as separate stacked cards). Each inner block keeps its own component;
          their standalone card chrome is stripped via `.hero-card .…` overrides so
          they read as sections of one card divided by hairlines. */}
      <div className={'hero-card tone-' + (tone || 'idle')}>
        <button className="hero-stat hero-stat-l" onClick={() => onOpenTab('schedule')}>
          <span className="hero-stat-label">Today</span>
          {miniToday.race
            ? <span className="hero-race-mini">
                <span className="hrm-row"><span className="hrm-tag jek">{avatar.name}</span><span className="hrm-track"><span className="hrm-fill jek" style={{ width: miniToday.jek + '%' }} /></span><span className="hrm-val">{miniToday.jekVal}</span></span>
                <span className="hrm-row"><span className="hrm-tag me">ME</span><span className="hrm-track"><span className="hrm-fill me" style={{ width: miniToday.me + '%' }} /></span><span className="hrm-val">{miniToday.meVal}</span></span>
              </span>
            : <span className="hero-stat-val">{miniToday.val}</span>}
          <span className="hero-stat-sub">{miniToday.sub}</span>
        </button>
        <button className="hero-stat hero-stat-r" onClick={() => onOpenTab('schedule')}>
          <span className="hero-stat-label">Up next</span>
          <span className="hero-stat-val">{miniNext.val}</span>
          <span className="hero-stat-sub">{miniNext.sub}</span>
        </button>
        <button className="hero-tap" onClick={doPoke} aria-label={'Poke ' + avatar.name}>
          <span className="hero-name">{avatar.name}</span>
          <span className="hero-stage">
            <span key={poke ? poke.n : 'idle'} className={'hero-face' + (poke ? ' poking' : '')}>{renderFace(avatar.emoji, 64)}</span>
            {poke ? (
              <ActionEmoji key={'poke' + poke.n} code={poke.emoji} size={64}
                label="reaction" fallback={glyphFromCode(poke.emoji)} className="hero-action poking" />
            ) : action ? (
              <CrossfadeEmoji code={action.code} size={64} label={action.label} fallback={action.fallback} className="hero-action" />
            ) : null}
          </span>
          <span className="hero-head">{'“' + (poke ? poke.msg : head).replace(/[.,]+$/, '') + '”'}</span>
          <span className="hero-sub">{poke ? 'tap again!' : sub}</span>
          <span className="hero-edit">tap me ›</span>
        </button>
      </div>

      {/* "Up next" now lives in the hero's top-right corner (see hero-stat-r). */}

      {/* Full this-week rollup (same WeekCard as the Progress tab) — the condensed
          corner stat was too thin, so the rich card lives on the dashboard and taps
          through to Progress. */}
      <button className="dash-week-btn" onClick={() => onOpenTab('history')}>
        <WeekCard week={week} streak={streak} />
        <span className="dash-week-cta">See full progress ›</span>
      </button>

      <ActivityListScreen activities={activities} setActivities={setActivities} schedule={schedule} setSchedule={setSchedule} plan={plan} onOpenBilling={onOpenBilling} />

      {renaming && (
        <AvatarSetupModal avatar={avatar} title="Rename your committed self" cta="Save"
          onSave={(next) => { setAvatar(next); setRenaming(false); }} onClose={() => setRenaming(false)} />
      )}
    </div>
  );
}

// Pan + zoom a picked photo into a round avatar, then bake the chosen crop into a
// small (160px) data URL. Preview <img> and the output canvas use the SAME math
// (cover-fit at zoom 1, centered, then offset/zoom), so what you frame is what you get.
function PhotoCropper({ file, onCancel, onDone }) {
  const V = 260, S = 160; // preview viewport / output size (px)
  const [src, setSrc] = React.useState(null);
  const [nat, setNat] = React.useState(null); // natural {w,h}
  const [zoom, setZoom] = React.useState(1);
  const [off, setOff] = React.useState({ x: 0, y: 0 });
  const imgRef = React.useRef(null);

  React.useEffect(() => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { imgRef.current = im; setNat({ w: im.naturalWidth, h: im.naturalHeight }); setSrc(url); };
    im.onerror = () => onCancel();
    im.src = url;
    return () => URL.revokeObjectURL(url);
  }, []);

  const base = nat ? V / Math.min(nat.w, nat.h) : 1; // cover-fit at zoom 1
  const dw = nat ? nat.w * base * zoom : V;
  const dh = nat ? nat.h * base * zoom : V;
  const clamp = (o) => {
    const mx = Math.max(0, (dw - V) / 2), my = Math.max(0, (dh - V) / 2);
    return { x: Math.max(-mx, Math.min(mx, o.x)), y: Math.max(-my, Math.min(my, o.y)) };
  };
  React.useEffect(() => { setOff(o => clamp(o)); }, [zoom, nat]); // keep the circle covered

  const left = V / 2 - dw / 2 + off.x;
  const top = V / 2 - dh / 2 + off.y;

  const startPan = (e) => {
    e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY, o0 = { x: off.x, y: off.y };
    const move = (ev) => setOff(clamp({ x: o0.x + (ev.clientX - x0), y: o0.y + (ev.clientY - y0) }));
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };

  const use = () => {
    const im = imgRef.current; if (!im) { onCancel(); return; }
    const k = S / V;
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    const ctx = c.getContext('2d');
    ctx.drawImage(im, left * k, top * k, dw * k, dh * k);
    let url = c.toDataURL('image/webp', 0.85);
    if (url.slice(0, 15) !== 'data:image/webp') url = c.toDataURL('image/jpeg', 0.85);
    onDone(url);
  };

  return (
    <React.Fragment>
      <div className="sheet-backdrop l2" onClick={onCancel} />
      <div className="sheet l2" role="dialog" aria-modal="true">
        <div className="sheet-grabber" />
        <div className="sheet-header">
          <button className="btn-ghost" onClick={onCancel}>Cancel</button>
          <div className="sheet-title">Position your photo</div>
          <button className="btn-primary" onClick={use} disabled={!src} style={{ opacity: src ? 1 : 0.4 }}>Use</button>
        </div>
        <div className="sheet-body" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div className="cropper" style={{ width: V, height: V }}>
            {src && <img className="cropper-img" src={src} draggable={false}
              style={{ width: dw, height: dh, left, top }} onPointerDown={startPan} />}
            <div className="cropper-ring" />
          </div>
          <div className="cropper-zoom">
            <span>－</span>
            <input type="range" min="1" max="4" step="0.01" value={zoom} onChange={e => setZoom(parseFloat(e.target.value))} aria-label="Zoom" />
            <span>＋</span>
          </div>
          <div className="race-setup-explain" style={{ textAlign: 'center' }}>Drag the photo to move it · slide to zoom</div>
        </div>
      </div>
    </React.Fragment>
  );
}

                <div className="plan-tagline">{p.tagline}</div>
                <ul className="plan-feats">

                {offerTrial && (

                  </div>

        )}

            </div>
            <div className="modal-intro">
              {trialing
                ? 'เริ่มทดลองใช้ ' + PLAN_BY_ID[pending].name + ' ฟรี ' + TRIAL_DAYS + ' วัน — ยังไม่มีการเก็บเงิน ยกเลิกได้ทุกเมื่อ (ตัวอย่างต้นแบบ)'

// ===== Settings tab (minimal) =====
// The data keys a backup carries (everything except the schema stamp, which is
// tracked separately so an import can restore the right version).
const BACKUP_KEYS = [K.activities, K.avatar, K.schedule, K.players, K.restTickets, K.done, K.subnames];
function SettingsScreen({ activities, schedule, done, avatar, plan, auth, onOpenBilling, onReplayTutorial, onSignOut }) {
  const fileRef = React.useRef(null);
  const [msg, setMsg] = React.useState(null); // { kind: 'ok' | 'err', text }
  const [resetMode, setResetMode] = React.useState(false);
  const [resetText, setResetText] = React.useState('');
  const daysTracked = Object.keys(done || {}).length;

  const exportData = () => {
    const data = {};
    for (const k of BACKUP_KEYS) {
      const raw = localStorage.getItem(k);
      if (raw != null) { try { data[k] = JSON.parse(raw); } catch {} }
    }
    const sv = parseInt(localStorage.getItem(K.schemaVersion) || '', 10);
    const payload = {
      app: 'train-with-myself', version: 1, exportedAt: Date.now(),
      schemaVersion: Number.isFinite(sv) ? sv : SCHEMA_VERSION, data,
    };
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'train-with-myself-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setMsg({ kind: 'ok', text: 'Backup downloaded.' });
  };

  const onPickFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // let the same file be re-picked later
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => setMsg({ kind: 'err', text: 'Couldn’t read that file.' });
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch { setMsg({ kind: 'err', text: 'That file isn’t valid JSON.' }); return; }
      const d = parsed && parsed.data;
      if (!parsed || parsed.app !== 'train-with-myself' || !d || typeof d !== 'object') {
        setMsg({ kind: 'err', text: 'Not a Train With Myself backup.' }); return;
      }
      const acts = Array.isArray(d[K.activities]) ? d[K.activities].length : 0;
      const blks = Array.isArray(d[K.schedule]) ? d[K.schedule].length : 0;
      if (!confirm('Replace everything on this device with this backup?\n\n' + acts + ' activities · ' + blks + ' blocks.\n\nThis cannot be undone.')) return;
      for (const k of BACKUP_KEYS) {
        try { if (k in d) localStorage.setItem(k, JSON.stringify(d[k])); else localStorage.removeItem(k); } catch {}
      }
      const sv = parseInt(parsed.schemaVersion, 10);
      try { localStorage.setItem(K.schemaVersion, String(Number.isFinite(sv) ? sv : SCHEMA_VERSION)); } catch {}
      location.reload();
    };
    reader.readAsText(file);
  };

  const resetConfirmed = resetText.trim().toUpperCase() === 'RESET';
  const reset = () => {
    if (!resetConfirmed) return;
    [K.activities, K.avatar, K.schedule, K.done, K.subnames, K.schemaVersion].forEach(k => { try { localStorage.removeItem(k); } catch {} });
    location.reload();
  };
  const cancelReset = () => { setResetMode(false); setResetText(''); };

  const planMeta = PLAN_BY_ID[plan] || PLAN_BY_ID.free;
  const canBackup = planAllows(plan, 'backup');
  const signOut = () => {
    if (!confirm('Sign out? Your activities, schedule and progress stay safe on this device.')) return;
    if (onSignOut) onSignOut();
  };
  return (
    <div className="set-screen">
      <div className="section-label">Account</div>
      <div className="set-card">
        <div className="set-row"><span>Signed in as</span><span className="set-v">{auth ? (auth.name || auth.email || 'You') : '—'}</span></div>
        {auth && auth.email ? <div className="set-row"><span>Email</span><span className="set-v">{auth.email}</span></div> : null}
        {auth && auth.provider && auth.provider !== 'email' ? <div className="set-row"><span>Via</span><span className="set-v" style={{ textTransform: 'capitalize' }}>{auth.provider}</span></div> : null}
      </div>
      <button className="btn-ghost btn-block" onClick={signOut}>Sign out</button>

      <div className="section-label">Plan</div>
      <button className={'set-plan-row rank-' + plan} onClick={onOpenBilling}>
        <span className="set-plan-l">
          <span className="set-plan-name">{planMeta.name}{plan === 'proplus' && ' ✦'}</span>
          <span className="set-plan-sub">{plan === 'free' ? 'Free plan · tap to see Pro features' : 'Tap to manage your plan'}</span>
        </span>
        <span className="set-plan-cta">{plan === 'free' ? 'Upgrade ›' : 'Manage ›'}</span>
      </button>

      <div className="section-label">Settings</div>
      <div className="set-card">
        <div className="set-row"><span>App</span><span className="set-v">Ijek — Train With Myself</span></div>
        <div className="set-row"><span>Plan</span><span className="set-v">{planMeta.name}</span></div>
        <div className="set-row"><span>Committed self</span><span className="set-v">{renderFace(avatar.emoji, 18)} {avatar.name}</span></div>
        <div className="set-row"><span>Activities</span><span className="set-v">{activities.length}</span></div>
        <div className="set-row"><span>Scheduled blocks</span><span className="set-v">{schedule.length}</span></div>
        <div className="set-row"><span>Days tracked</span><span className="set-v">{daysTracked}</span></div>
        <div className="set-row"><span>Storage</span><span className="set-v">this device only</span></div>
      </div>

      <div className="section-label">Backup</div>
      {canBackup ? (
        <React.Fragment>
          <button className="btn-ghost btn-block" onClick={exportData}>⬇ Export backup (.json)</button>
          <button className="btn-ghost btn-block" onClick={() => fileRef.current && fileRef.current.click()}>⬆ Import backup</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={onPickFile} />
          {msg && <p className={'set-msg ' + msg.kind}>{msg.text}</p>}
          <p className="hist-note" style={{ textAlign: 'left', marginTop: 6 }}>
            Your data lives only in this browser. Export a backup before clearing your browser or switching devices, then import it to restore.
          </p>
        </React.Fragment>
      ) : (
        <ProLock tier="pro" title="Backup export / import"
          desc="Save a copy of your data and restore it on another device." onOpenBilling={onOpenBilling} />
      )}

      <div className="section-label">Help</div>
      <button className="btn-ghost btn-block" onClick={onReplayTutorial}>▶ Replay the intro tutorial</button>

      <div className="section-label">Danger zone</div>
      {!resetMode ? (
        <button className="btn-ghost btn-block" style={{ color: 'var(--danger)' }} onClick={() => setResetMode(true)}>Reset all data</button>
      ) : (
        <div className="reset-confirm">
          <div className="reset-confirm-title">⚠ Erase everything?</div>
          <p className="reset-confirm-sub">This permanently deletes your activities, schedule, avatar and all tracking on this device. It can't be undone — export a backup first if unsure. Type <b>RESET</b> to confirm.</p>
          <input className="input-underline" value={resetText} onChange={e => setResetText(e.target.value)}
            placeholder="Type RESET" autoFocus autoCapitalize="characters" />
          <div className="reset-confirm-actions">
            <button className="btn-ghost" onClick={cancelReset}>Cancel</button>
            <button className="btn-primary" style={{ background: 'var(--danger)', color: '#fff', opacity: resetConfirmed ? 1 : 0.4 }}
              disabled={!resetConfirmed} onClick={reset}>Erase everything</button>
          </div>
        </div>
      )}
      <p className="hist-note" style={{ textAlign: 'left', marginTop: 10 }}>Animations follow your system "reduce motion" setting.</p>
    </div>
  );
}

// ===== Two-lane race timeline: left = you, right = the avatar's plan =====
// Short race-header status line in the avatar's personality voice (mirrors
// behaviorCopy, but tuned to the very short "behind / in step" race line).
function raceStatusCopy(behavior, behind, gap, name) {
  const b = BEHAVIOR_IDS.indexOf(behavior) !== -1 ? behavior : 'coach';
  if (behind) return {
    coach: '⚠ ' + gap + ' behind — you can catch ' + name + '!',
    drill: '⚠ ' + gap + ' behind. Move.',
    chill: gap + ' behind ' + name + ' — no rush.',
    rival: '⚠ ' + name + ' is ' + gap + ' ahead 😏',
  }[b];
  return {
    coach: '✓ In step with ' + name,
    drill: '✓ In step. Hold it.',
    chill: '✓ Cruising with ' + name,
    rival: '✓ Right on ' + name + '’s heels',
  }[b];
}

function RaceHeader({ avatar, youMin, avatarMin, dayTotal, gapMin }) {
  const mePct = dayTotal > 0 ? Math.min(100, youMin / dayTotal * 100) : 0;
  const avPct = dayTotal > 0 ? Math.min(100, avatarMin / dayTotal * 100) : 0;
  const behind = gapMin >= 1;
  return (
    <div className={'rh' + (behind ? ' behind' : '')}>
      <span className="rh-face">{renderFace(avatar.emoji, 38)}</span>
      <div className="rh-bars">
        <div className="rh-row">
          <span className="rh-tag av">{avatar.name}</span>
          <div className="rh-track"><div className="rh-fill av" style={{ width: avPct + '%' }} /></div>
          <span className="rh-val">{formatHM(Math.round(avatarMin) * 60)}</span>
        </div>
        <div className="rh-row">
          <span className="rh-tag me">ME</span>
          <div className="rh-track"><div className="rh-fill me" style={{ width: mePct + '%' }} /></div>
          <span className="rh-val">{formatHM(Math.round(youMin) * 60)}</span>
