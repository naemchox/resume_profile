// ===== Intro tutorial (guided spotlight tour) =====
// Shown once after a brand-new user signs in (before avatar setup), and re-openable
// from Settings. Instead of a passive slideshow, it WALKS the real app: each step
// switches to a crucial tab and spotlights the live UI it's describing.
//   tab    — which tab to switch to before this step shows.
//   anchor — `data-tour` value of the element to highlight (null = centered card,
//            no spotlight, for the welcome / finish steps).
//   glyph  — decorative emoji on the callout.
// Strings come from tour.s{N}.title / .body so both languages stay in sync.
const TOUR_STEPS = [
  { tab: 'main',     anchor: null,           glyph: '🦊' }, // welcome (centered)
  { tab: 'main',     anchor: 'hero-avatar',  glyph: '👋' }, // meet & poke the avatar
  { tab: 'main',     anchor: 'main-race',    glyph: '🏁' }, // the You-vs-ME race
  { tab: 'main',     anchor: 'add-activity', glyph: '📝' }, // create activities
  { tab: 'schedule', anchor: 'sched-view',   glyph: '🗓️' }, // Schedule tab + Day/Week toggle
  { tab: 'schedule', anchor: 'sched-add',    glyph: '➕' }, // add blocks to the timeline
  { tab: 'schedule', anchor: 'sched-pill',   glyph: '✅' }, // tap ✓ Done, today's %
  { tab: 'schedule', anchor: 'rest-ticket',  glyph: '🎟️' }, // rest tickets (excused, streak-safe)
  { tab: 'history',  anchor: 'nav-history',  glyph: '🔥' }, // streak / progress
  { tab: 'avatar',   anchor: 'nav-avatar',   glyph: '🎨' }, // customize the committed self
  { tab: 'settings', anchor: 'set-reminders', glyph: '🔔' }, // Reminders (free) — notify at block start
  { tab: 'main',     anchor: 'hero-insights', glyph: '🧐' }, // weekly Insights — points at the dashboard toggle/pill (falls back to centred if a brand-new account has no activities yet, so it isn't rendered)
  { tab: 'main',     anchor: null,           glyph: '🎉' }, // finish (centered)
];
// The tour drives the parent's active tab (onOpenTab) so each step shows the real
// page behind a dimmed spotlight. A transparent catcher keeps the app read-only
// while the tour runs; the highlighted element is measured live so the hole tracks
// it across tab switches, resize and scroll.
function TutorialCarousel({ onDone, onOpenTab }) {
  const [i, setI] = React.useState(0);
  const [rect, setRect] = React.useState(null);
  const last = TOUR_STEPS.length - 1;
  const step = TOUR_STEPS[i] || TOUR_STEPS[last];
  const PAD = 8;

  const finish = () => { if (onOpenTab) onOpenTab('main'); onDone(); };
  const next = () => { if (i < last) setI(i + 1); else finish(); };
  const prev = () => { if (i > 0) setI(i - 1); };

  // Switch to this step's tab so the highlighted page is actually visible.
  React.useEffect(() => { if (step.tab && onOpenTab) onOpenTab(step.tab); }, [i]);

  // Measure the anchor element once the new tab has painted, and keep tracking it.
  React.useEffect(() => {
    if (!step.anchor) { setRect(null); return; }
    let raf1, raf2, timer;
    const measure = () => {
      const el = document.querySelector('[data-tour="' + step.anchor + '"]');
      if (el) {
        const r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) { setRect({ top: r.top, left: r.left, width: r.width, height: r.height }); return; }
      }
      setRect(null);
    };
    // Initial pass also scrolls the anchor into view: some spotlights (the dashboard
    // "Add activity" button, deeper schedule controls) can sit below the fold, where a
    // hole drawn at their off-screen rect would float past the edge. Done ONLY on the
    // first measure — the scroll/resize listeners below re-measure WITHOUT re-scrolling,
    // so a settle-scroll can't feed back into itself. (The tour-catch blocks the user
    // from scrolling, so this is the only thing that moves the page.)
    const measureInto = () => {
      const el = document.querySelector('[data-tour="' + step.anchor + '"]');
      if (el) { try { el.scrollIntoView({ block: 'center', behavior: 'auto' }); } catch {} }
      measure();
    };
    // Give the tab swap a couple of frames (plus a fallback tick) before measuring.
    raf1 = requestAnimationFrame(() => { raf2 = requestAnimationFrame(measureInto); });
    timer = setTimeout(measureInto, 260);
    window.addEventListener('resize', measure);
    window.addEventListener('scroll', measure, true);
    return () => {
      cancelAnimationFrame(raf1); cancelAnimationFrame(raf2); clearTimeout(timer);
      window.removeEventListener('resize', measure);
      window.removeEventListener('scroll', measure, true);
    };
  }, [i]);

  // Re-bind every render so the handlers see the current step index.
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') { e.preventDefault(); next(); } // Space/Enter also advance
      else if (e.key === 'ArrowLeft') prev();
      else if (e.key === 'Escape') finish();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  // `centered` (the big welcome/finish cards) vs spotlight callout is fixed by the step, not
  // by `rect`. Position is expressed as top% + a translate so the SAME card element can glide
  // between ANY two steps — including welcome → first spotlight — via the .tour-card transition,
  // instead of hard-cutting. While an anchored step is still being measured the card stays
  // centred, then slides out to its anchor the moment `rect` lands (the move is the animation).
  const wantsAnchor = !!step.anchor;
  const vh = window.innerHeight || 800;
  let cardStyle = { top: '50%', transform: 'translateY(-50%)' }; // centred (welcome/finish + pre-measure)
  if (rect) {
    // Below a top-half anchor, above a bottom-half one (nav callouts float above the bar).
    const below = (rect.top + rect.height / 2) < vh * 0.45;
    if (below) cardStyle = { top: ((rect.top + rect.height + PAD + 14) / vh * 100) + '%', transform: 'translateY(0)' };
    else       cardStyle = { top: ((rect.top - PAD - 14) / vh * 100) + '%', transform: 'translateY(-100%)' };
  }

  return (
    <div className="tour" role="dialog" aria-modal="true">
      <div className="tour-catch" onClick={next} />
      {/* ONE persistent dim/spotlight that GLIDES between steps (incl. welcome card → first
          spotlight): with no anchor it collapses to a 0×0 hole at screen-centre — which reads
          as a plain full dim — then grows and moves to each anchor via the .tour-hole transition,
          so the backdrop never hard-swaps and the cutout never pops into existence. */}
      <div className={'tour-hole' + (rect ? '' : ' full')}
        style={rect
          ? { top: rect.top - PAD, left: rect.left - PAD, width: rect.width + PAD * 2, height: rect.height + PAD * 2 }
          : { top: window.innerHeight / 2, left: window.innerWidth / 2, width: 0, height: 0 }} />
      <button type="button" className="tour-skip" onClick={finish}><span>{tr('tut.skip')}</span><span className="tour-skip-chev" aria-hidden="true">→</span></button>
      <div className={'tour-card' + (wantsAnchor ? '' : ' centered')} style={cardStyle}>
        <div className="tour-content" key={i}>
          {/* Animate the tour emoji with the same Noto engine as the dashboard avatar
            (animated WebP, or a gentle sway when no animated asset exists). Bigger on
            the centered welcome/finish cards, smaller on the spotlight callouts. */}
        <div className="tour-glyph">{renderFace(step.glyph, wantsAnchor ? 40 : 78, false, false, true)}</div>
          <h2 className="tour-title">{tr('tour.s' + (i + 1) + '.title')}</h2>
          <p className="tour-body">{tr('tour.s' + (i + 1) + '.body')}</p>
        </div>
        <div className="tour-foot">
          <div className="tour-dots">
            {TOUR_STEPS.map((_, n) => (
              <button type="button" key={n} className={'tut-dot' + (n === i ? ' on' : '')}
                onClick={() => setI(n)} aria-label={tr('tut.gotoSlide', { n: n + 1 })} />
            ))}
          </div>
          <div className="tour-foot-btns">
            {i > 0 && <button type="button" className="tour-back" onClick={prev}>{tr('common.back')}</button>}
            <button type="button" className="btn-primary tour-next" onClick={next}>{i === last ? tr('tut.getStarted') : tr('common.next')}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

  const goNext = () => setPage(p => Math.min(last, p + 1));
  const goBack = () => setPage(p => Math.max(0, p - 1));
  const pick = (key, val) => setAnswers(a => ({ ...a, [key]: val }));
  // Multi-select: toggle a value in an array-valued answer.
  const toggle = (key, val) => setAnswers(a => {
    const cur = Array.isArray(a[key]) ? a[key] : [];
    return { ...a, [key]: cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val] };
  });
  const finish = () => onComplete(answers, { ...avatar, name: (name.trim() || 'JEK').slice(0, 24), emoji });
  // Choice pages require a pick before Continue; intro/hype/avatar pages are always free to advance.
  const canContinue = page === 1 ? !!answers.source : page === 2 ? (answers.goal && answers.goal.length > 0) : page === 3 ? !!answers.dailyMin : true;

  // A reusable choice list (emoji + label, optional right-hint, ✓ when selected). Pass
  // `multi` to allow several selections (sel is then an array of ids, taps toggle).
  // `key` drives the i18n label lookup (ob.<key>.<id>); `storeKey` is where the answer is
  // saved (defaults to key). They differ for the time page: labels live under `ob.time.*`
  // but the value must land in `answers.dailyMin` — without this split, taps wrote to the
  // wrong field, so the row never highlighted and Continue stayed disabled.
  // `sub` (optional) → a muted second line under the label, used to give a card meaning
  // when there's no right-hand hint (e.g. the pace page describes the *feel* of each tempo).
  const choices = (key, list, sel, hint, multi, storeKey = key, sub) => (
    <div className="ob-options">
      {list.map(o => {
        const on = multi ? (Array.isArray(sel) && sel.includes(o.id)) : sel === o.id;
        return (
          <button key={o.id} type="button" className={'ob-opt' + (on ? ' on' : '')}
            onClick={() => (multi ? toggle(storeKey, o.id) : pick(storeKey, o.id))}>
            <span className="ob-opt-emoji">{renderFace(o.emoji, 24, false, false, true, undefined, undefined, null)}</span>
            <span className="ob-opt-main">
              <span className="ob-opt-label">{tr('ob.' + key + '.' + o.id)}</span>
              {sub && <span className="ob-opt-desc">{sub(o)}</span>}
            </span>
            {hint && <span className="ob-opt-hint">{hint(o)}</span>}
            <span className="ob-opt-check">✓</span>
          </button>
        );
      })}
    </div>
  );

  let head = null, body = null;
  if (page === 0) {
    head = <div className="ob-head"><span className="ob-glyph">{renderFace('🌍', 60, false, false, true)}</span><div className="ob-title">{tr('ob.lang.title')}</div><div className="ob-sub">{tr('ob.lang.sub')}</div></div>;
    body = (
      <div className="ob-options">
        {[['en', '🇬🇧'], ['th', '🇹🇭']].map(([code, flag]) => (
          <button key={code} type="button" className={'ob-opt' + (lang === code ? ' on' : '')} onClick={() => onSetLang(code)}>
            <span className="ob-opt-emoji ob-flag">{flag}</span>
            <span className="ob-opt-main">{tr('ob.lang.' + code)}</span>
            <span className="ob-opt-check">✓</span>
          </button>
        ))}
      </div>
    );
  } else if (page === 1) {
    head = <div className="ob-head"><span className="ob-glyph">{renderFace('📡', 60, false, false, true)}</span><div className="ob-title">{tr('ob.source.title')}</div><div className="ob-sub">{tr('ob.source.sub')}</div></div>;
    body = choices('source', OB_SOURCES, answers.source);
  } else if (page === 2) {
    head = <div className="ob-head"><span className="ob-glyph">{renderFace('🎯', 60, false, false, true)}</span><div className="ob-title">{tr('ob.goal.title')}</div><div className="ob-sub">{tr('ob.goal.subMulti')}</div></div>;
    body = choices('goal', OB_GOALS, answers.goal, null, true);
  } else if (page === 3) {
    head = <div className="ob-head"><span className="ob-glyph">{renderFace('🎯', 60, false, false, true)}</span><div className="ob-title">{tr('ob.time.title')}</div><div className="ob-sub">{tr('ob.time.sub')}</div></div>;
    body = choices('time', OB_TIMES, answers.dailyMin, undefined, false, 'dailyMin', (o) => tr('ob.time.' + o.id + 'd'));
  } else if (page === 4) {
    head = <div className="ob-head"><div className="ob-title">{tr('ob.hype.title')}</div><div className="ob-sub">{tr('ob.hype.sub')}</div></div>;
    body = (
      <div className="ob-streak">
        <div className="ob-flame">🔥</div>
        <div className="ob-days">{[0, 1, 2, 3, 4, 5, 6].map(d => <div key={d} className={'ob-day' + (d === 0 ? ' on' : '')}>{d === 0 ? '1' : ''}</div>)}</div>
      </div>
    );
  } else {
    head = <div className="ob-head"><span className="ob-glyph">{renderFace(emoji, 60)}</span><div className="ob-title">{tr('onboard.title')}</div><div className="ob-sub">{tr('onboard.intro')}</div></div>;
    body = (
      <div>
        <input className="login-input ob-name" value={name} maxLength={24} placeholder={tr('av.namePlaceholder')}
          onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') finish(); }} />
        <div className="ob-faces">
          {AVATAR_EMOJIS.map(f => (
            <button key={f} type="button" className={'ob-face-opt' + (emoji === f ? ' on' : '')} onClick={() => setEmoji(f)}>{renderFace(f, 24, false, false, false, undefined, undefined, null)}</button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="ob" role="dialog" aria-modal="true">
      <div className="ob-inner">
        <div className="ob-top">
          <button type="button" className={'ob-back' + (page === 0 ? ' hidden' : '')} onClick={goBack} aria-label={tr('common.back')}>‹</button>
          <div className="ob-progress"><div className="ob-progress-fill" style={{ width: ((page + 1) / OB_PAGES * 100) + '%' }} /></div>
        </div>
        <div className="ob-body">
          <div className="ob-content" key={page}>{head}{body}</div>
        </div>
        <div className="ob-foot">
          {page === last
            ? <button type="button" className="btn-primary ob-next" onClick={finish}>{tr('onboard.cta')}</button>
            : <React.Fragment>
                {/* Pages 1–3 are optional analytics (source/goal/time) — let users skip straight in.
                    finish() defaults any missing answers safely (maybeSeedStarter). */}
                {page >= 1 && page <= 3 && <button type="button" className="ob-skip" onClick={finish}>{tr('ob.skip')}</button>}
                <button type="button" className="btn-primary ob-next" disabled={!canContinue} onClick={goNext}>{tr('common.next')}</button>
              </React.Fragment>}
        </div>
      </div>
    </div>
  );
}

function renderBadges(list, sizeCls, faceSize) {
  if (!list || !list.length) return null;
  // The secondary emoji (rank badge + placed stickers) keeps a FIXED RATIO to the face it sits
  // on — 30/64 ≈ 0.469, matched to the Avatar PAGE preview (the surface where the user actually
  // sizes/places the sticker: 30px badge on a 64px face, see previewDeco). Pass the renderFace
  // size as `faceSize` and every surface shows the accessory at the same *relative* size as the
  // Avatar page, even though absolute px differ. (sizeCls stays the positioning/anim hook + fallback.)
  const px = faceSize ? Math.max(8, Math.round(faceSize * (30 / 64)))

// Localized poke-line picker: the message comes from the dictionary (so it follows the

// passed → deterministic (wrapped into range). HABIT lines keep their {act} placeholder

  const b = table[behavior] ? behavior : 'coach';
  const arr = table[b];
  if (i == null) i = Math.floor(Math.random() * arr.length);
  i = ((Math.round(i) % arr.length) + arr.length) % arr.length;
  return { msg: tr(prefix + '.' + b + '.' + i), emoji: arr[i].emoji };
}

  let totalPlan = 0, totalGap = 0, gradePlan = 0, gradeDone = 0, keptCount = 0, finishedPlanned = 0, goalsHit = 0, goalsTotal = 0;
  let weekPlanFull = 0; // full week's committed minutes (every scheduled day, incl. future) — the race denominator
  for (let i = 0; i < 7; i++) {
    const ts = addDays(ws, i);
    const dStart = startOfDay(ts);
    const isToday = dStart === todayStart;
    const isFuture = dStart > todayStart;
    const blocks = gradedBlocks(blocksForDate(schedule, done, ts), tickets, ts, activities); // task-excused + hobby blocks drop out
    const dmap = done[dayKey(ts)] || {};
    const cap = isFuture ? 0 : (isToday ? nowMin : 1440);
    const sc = dayScore(blocks, dmap, cap, activities);     // amount-aware → "lost to skips"
    const gr = dayCredit(blocks, dmap, cap, activities); // time-based grade → kept/pct
    const su = daySuccess(blocks, dmap, cap, activities); // goal-based achievement lens
    const pct = gr.pct;
    // Full committed minutes for this day (uncapped, so future days count too) → feeds the
    // week race bar's denominator. Rest/empty days contribute nothing.
    const isRestDay = rest.indexOf(i) !== -1 || isTicketed(tickets, ts);
    if (!isRestDay && blocks.length > 0) weekPlanFull += dayCredit(blocks, dmap, 1440, activities).plan;
    let status; // rest | none | future | kept | behind | today
    if (rest.indexOf(i) !== -1 || isTicketed(tickets, ts)) status = 'rest'; // day off or rest-ticket — never graded
    else if (blocks.length === 0) status = 'none';
    else if (isFuture) status = 'future';
    else if (dStart < earliest) status = 'none'; // before tracking began
    else {
      totalPlan += sc.planMin; totalGap += sc.gapMin;
      gradePlan += gr.plan; gradeDone += gr.done; goalsTotal += su.total; goalsHit += su.hit;
      if (gr.plan <= 0) status = 'none';
      else if (isToday) {
        // Today is still in progress — stay neutral (•) until it settles, only flipping
        // to ⭐ early if you've already hit 100%, so a finished day still reads right.
        const kept = gr.pct >= 100;
        status = kept ? 'kept' : 'today';
        if (kept) { keptCount++; finishedPlanned++; }
      } else {
        finishedPlanned++;
        status = dayTier(gr.pct); // ⭐ / ◕ / ◑ / ◔ / ○ — rewards any progress, no ✕
        if (status === 'kept') keptCount++;
      }
    }
    // Per-day bars/note use the GRADE (credit) numbers, not raw time, so they can never
    // contradict the verdict: a block with an amount goal you logged 0 toward earns 0
    // credit even if you sat the full session — the row then reads "behind", matching its
    // "Slipped · 0%". For time-only blocks credit == time, so nothing changes.
    days.push({ ts, dow: i, status, pct, isToday, isFuture, goalHit: su.hit, goalTotal: su.total, goalPct: su.pct,
      away: awayReasonOn(tickets, ts), // sick/trip/rest reason on a whole-day Away (null otherwise)
      doneMin: gr.done, planMin: gr.plan, gapMin: Math.max(0, gr.plan - gr.done), hasPlan: blocks.length > 0 });

  const overallPct = gradePlan > 0 ? Math.round((gradeDone / gradePlan) * 100) : null;
  const awayCounts = {}; for (const d of days) if (d.away) awayCounts[d.away] = (awayCounts[d.away] || 0) + 1; // weekly Away tally
  return { weekStart: ws, days, keptCount, finishedPlanned, totalGap, overallPct, totalPlan, gradePlan, gradeDone, weekPlanFull, goalsHit, goalsTotal, goalPct: goalsTotal > 0 ? Math.round(goalsHit / goalsTotal * 100) : null, awayCounts };
}
function weekSummary(schedule, done, now, earliest, restDays, tickets, activities) {
  return weekStats(schedule, done, startOfWeek(now), now, earliest, restDays, tickets, activities);
}

// Last `count` weeks (oldest → newest) as weekStats rollups for the Progress trend.
// Each reuses the same scoring as the "This week" card, so the chart and the card
// can never disagree. Leading weeks from before tracking began (nothing planned or
// graded) are trimmed so the trend starts where the user's real history does — but
// the current week is always kept so a brand-new user still sees one column.
function weeklyTrend(schedule, done, now, earliest, restDays, count, tickets, activities) {
  const ws0 = startOfWeek(now);
  const out = [];
  for (let w = count - 1; w >= 0; w--) out.push(weekStats(schedule, done, addDays(ws0, -7 * w), now, earliest, restDays, tickets, activities));
  let start = 0;
  while (start < out.length - 1 && out[start].finishedPlanned === 0 && out[start].totalPlan === 0) start++;
  return out.slice(start);
}

// Consecutive days (walking back from today) you kept up with your committed
// self. No-plan days are skipped (neither count nor break); today in progress is
// not yet counted but doesn't break; a settled planned day you missed ends it.
function keptStreak(schedule, done, now, earliest, restDays, tickets, activities) {
  const rest = restDays || [];
  const todayStart = startOfDay(now);
  const nowMin = nowMinutes(now);
  let streak = 0;
  for (let i = 0; i < 366; i++) {
    const cur = addDays(todayStart, -i);
    if (cur < earliest) break;
    const isToday = i === 0;
    // A weekday rest OR a whole-day ticket (sick/Away) is fully NEUTRAL — skip it: it never counts
    // toward the streak (the sprout/milestones must be EARNED on real, fully-kept normal days) and it
    // never breaks it either. The race bar still shows the work done that day, but streak ignores it.
    if (rest.indexOf(dayIndexMon(cur)) !== -1 || isTicketed(tickets, cur)) continue; // rest day or whole-day ticket — skip, don't break
    const blocks = gradedBlocks(blocksForDate(schedule, done, cur), tickets, cur, activities); // task-excused + hobby blocks drop out
    if (blocks.length === 0) continue;
    const gr = dayCredit(blocks, done[dayKey(cur)] || {}, isToday ? nowMin : 1440, activities);
    if (gr.plan <= 0) continue;
    // Use the SAME rounded pct the This-week strip shows (gr.pct >= 100), so a day rendered
    // as ⭐ there (e.g. 199.5/200 → 100%) also counts toward the streak. Comparing the raw
    // done/plan ratio here let the week card read 7/7 while the streak read 5.
    const kept = gr.pct >= 100;
    if (kept) { streak++; continue; }
    if (isToday) continue; // in progress — not counted, not broken
    break;
  }
  return streak;
}

// (STREAK_MILESTONES moved up next to ACCESSORIES — it's now the shared source for both the
// Achievements ladder and the wearable accessory badges.)
// One forward pass over tracked history → { current, best, totalKept }. Mirrors
// keptStreak's per-day rules EXACTLY (rest/whole-day-ticket and plan-less days are
// neutral — they neither count nor break), so `current` matches the WeekCard streak.
// `best` = longest run ever; `totalKept` = lifetime days you kept up.
function streakStats(schedule, done, now, earliest, restDays, tickets, activities) {
  const rest = restDays || [];
  const todayStart = startOfDay(now);
  const nowMin = nowMinutes(now);
  const spanDays = Math.min(366, Math.max(0, Math.round((todayStart - startOfDay(earliest)) / 86400000)) + 1);
  let run = 0, best = 0, total = 0;
  for (let i = spanDays - 1; i >= 0; i--) { // oldest → today
    const cur = addDays(todayStart, -i);
    if (cur < earliest) continue;
    const isToday = i === 0;
    if (rest.indexOf(dayIndexMon(cur)) !== -1 || isTicketed(tickets, cur)) continue; // neutral — rest/ticket never counts toward the streak nor breaks it
    const blocks = gradedBlocks(blocksForDate(schedule, done, cur), tickets, cur, activities);
    if (blocks.length === 0) continue; // no plan → neutral
    const gr = dayCredit(blocks, done[dayKey(cur)] || {}, isToday ? nowMin : 1440, activities);
    if (gr.plan <= 0) continue; // neutral
    const kept = gr.pct >= 100; // match the visible ⭐ (rounded pct), not the raw ratio — see keptStreak
    if (kept) { run++; total++; if (run > best) best = run; }
    else if (isToday) { /* in progress — don't count, don't break */ }
    else { run = 0; }
  }
  return { current: run, best, totalKept: total };
}

// ── Slice 4: the weekly LETTER from JEK ───────────────────────────────────────
// A short, in-character note composed from the SAME weekly data the recap already
// shows (weekSummary + streak + coachInsights) — NO new computation, NO AI. Spoken
// in the avatar's voice: tries letter.{behavior}.{part}, falls back to the neutral
// letter.{part}. Only the 4 BASE voices have overrides (same as checkInLine /
// coachVoiceQuote); every other persona reads in the warm neutral (coach) voice.
// FREE — this is relationship, not analysis (the Pro CTA lives lower in the recap).
const LETTER_BEHAVIORS = { coach: 1, drill: 1, chill: 1, rival: 1, bestie: 1, zen: 1, hype: 1, snarky: 1 };
function weeklyLetter(avatar, week, streak, review) {
  const b0 = resolveBehavior(avatar, 'letter');
  const b = LETTER_BEHAVIORS[b0] ? b0 : 'coach';
  const name = (avatar && avatar.name) || 'JEK';
  const L = (part, vars) => tr('letter.' + b + '.' + part, vars, tr('letter.' + part, vars));
  const { overallPct, keptCount, finishedPlanned } = week;
  const hasData = finishedPlanned > 0 && overallPct != null;
  let recap;
  if (!hasData) recap = L('firstWeek');
  else if (overallPct >= 100) recap = L('great', { pct: overallPct });
  else if (overallPct >= 60)  recap = L('solid', { pct: overallPct, kept: keptCount, total: finishedPlanned });
  else recap = L('tough', { pct: overallPct, kept: keptCount, total: finishedPlanned });
  let highlight = null;
  const star = review && review.ok && review.insights &&
    review.insights.find(i => (i.key === 'consistent' || i.key === 'earlyStar') && i.params && i.params.name);
  if (star) highlight = L('highlight', { name: star.params.name });
  else if (streak >= 3) highlight = L('highlightStreak', { streak });

}

// ── The Coach (Pro) ──────────────────────────────────────────────────────────
// Your committed self, reading your real history and telling you what to fix. NO
// AI / no backend — every insight is computed deterministically from `done` +
// `schedule` over the last ~4 settled weeks, so it works offline and never lies.
// Returns { ok, insights:[{key,params}], suggestion:{key,params}|null } where the
// component renders each via tr('coach.'+key, params). `ok:false` → not enough
// tracked days yet (show the "keep logging" state).
const COACH_WINDOW_DAYS = 28;
function coachInsights(schedule, done, now, earliest, restDays, tickets, activities) {
  const rest = restDays || [];
  const todayStart = startOfDay(now);
  const hour = { morning: [0, 0], afternoon: [0, 0], evening: [0, 0] }; // [kept, total]
  const dows = Array.from({ length: 7 }, () => [0, 0]);
  const act = {}; // activityId -> [kept, total]
  let sampleDays = 0;
  for (let i = 1; i <= COACH_WINDOW_DAYS; i++) { // skip today (i=0): not settled yet
    const cur = addDays(todayStart, -i);
    if (cur < earliest) break;
    if (rest.indexOf(dayIndexMon(cur)) !== -1 || isTicketed(tickets, cur)) continue; // rest/excused → neutral
    const blocks = gradedBlocks(blocksForDate(schedule, done, cur), tickets, cur, activities);
    if (!blocks.length) continue;
    const dm = done[dayKey(cur)] || {};
    const wd = dayIndexMon(cur);
    let counted = false;
    for (const b of blocks) {
      const dur = Math.max(0, b.end - b.start);
      if (dur <= 0) continue;
      const kept = blockEarnedMin(b, dm, 1440, activities) >= dur * 0.9 ? 1 : 0;
      const bucket = b.start < 720 ? 'morning' : b.start < 1020 ? 'afternoon' : 'evening';
      hour[bucket][0] += kept; hour[bucket][1]++;
      dows[wd][0] += kept; dows[wd][1]++;
      if (!act[b.activityId]) act[b.activityId] = [0, 0];
      act[b.activityId][0] += kept; act[b.activityId][1]++;
      counted = true;
    }
    if (counted) sampleDays++;
  }
  if (sampleDays < 3) {
    // Early-data LITE insights: too little history for real pattern analysis, but JEK
    // still says something useful from day one — so the Insights toggle appears and the
    // habit of reading it starts early. Lower bars than the main rules; reuses existing
    // suggestion keys (dropOrMove/keepGoing) so no extra action wiring is needed.
    const insightsE = [];
    let eSkip = null, eStar = null;
    for (const id of Object.keys(act)) {
      if (act[id][1] < 1) continue;
      if (act[id][0] < act[id][1]) { // missed at least once → candidate early skip
        if (!eSkip || act[id][0] / act[id][1] < act[eSkip][0] / act[eSkip][1]) eSkip = id;
      } else if (!eStar || act[id][1] > act[eStar][1]) { // kept every try → candidate star
        eStar = id;
      }
    }
    let suggestionE = null;
    if (eSkip) {
      const a = findActivity(activities, eSkip);
      insightsE.push({ key: 'earlySkip', params: { name: (a && a.name) || '?', missed: act[eSkip][1] - act[eSkip][0], total: act[eSkip][1] } });
      suggestionE = { key: 'dropOrMove', params: { name: (a && a.name) || '?', actId: eSkip } };
    }
    if (eStar && eStar !== eSkip) {
      const a = findActivity(activities, eStar);
      insightsE.push({ key: 'earlyStar', params: { name: (a && a.name) || '?' } });
    }
    if (!insightsE.length) {
      if (sampleDays >= 1) insightsE.push({ key: 'earlyGoing', params: { days: sampleDays } });
      else {
        const todayN = gradedBlocks(blocksForDate(schedule, done, now), tickets, now, activities).length;
        insightsE.push(todayN > 0 ? { key: 'earlyStart', params: { count: todayN } } : { key: 'earlyNew', params: {} });
      }
    }
    return { ok: true, insights: insightsE.slice(0, 2), suggestion: suggestionE };
  }

  const pct = (a) => Math.round((a[0] / a[1]) * 100);
  const insights = [];

  // 1) Time-of-day gap — your strongest vs weakest part of the day (needs ≥4 samples each).
  const buckets = Object.keys(hour).filter(k => hour[k][1] >= 4);
  let worstBucket = null, bestBucket = null;
  if (buckets.length >= 2) {
    const sorted = buckets.slice().sort((a, b) => pct(hour[a]) - pct(hour[b]));
    worstBucket = sorted[0]; bestBucket = sorted[sorted.length - 1];
    if (pct(hour[bestBucket]) - pct(hour[worstBucket]) >= 25) {
      insights.push({ key: 'timeGap', params: { bestPct: pct(hour[bestBucket]), best: bestBucket, worstPct: pct(hour[worstBucket]), worst: worstBucket } });
    } else { worstBucket = null; } // no meaningful gap → don't suggest a move
  }

  // 2) Most-skipped activity (≥3 tries, kept under half).
  let skip = null;
  for (const id of Object.keys(act)) {
    if (act[id][1] < 3) continue;
    if (act[id][0] / act[id][1] >= 0.5) continue;
    if (!skip || act[id][0] / act[id][1] < act[skip][0] / act[skip][1]) skip = id;
  }
  if (skip) {
    const a = findActivity(activities, skip);
    insights.push({ key: 'skip', params: { name: (a && a.name) || '?', missed: act[skip][1] - act[skip][0], total: act[skip][1] } });
  }

  // 3) Most-consistent activity (≥3 tries, ≥80%) — praise so it's not all stick.
  let star = null;
  for (const id of Object.keys(act)) {
    if (act[id][1] < 3 || act[id][0] / act[id][1] < 0.8) continue;
    if (!star || act[id][0] / act[id][1] > act[star][0] / act[star][1]) star = id;
  }
  if (star && star !== skip) {
    const a = findActivity(activities, star);
    insights.push({ key: 'consistent', params: { name: (a && a.name) || '?', pct: pct(act[star]) } });
  }

  // One concrete suggestion: move the skipped activity to your best time, else drop/move it.
  let suggestion = null;
  if (skip) {
    const a = findActivity(activities, skip);
    suggestion = (bestBucket && worstBucket)
      ? { key: 'moveToBest', params: { name: (a && a.name) || '?', bucket: bestBucket, actId: skip } }
      : { key: 'dropOrMove', params: { name: (a && a.name) || '?', actId: skip } };
  } else {
    suggestion = { key: 'keepGoing', params: {} };
  }
  return { ok: true, insights: insights.slice(0, 3), suggestion };
}
// Bucket-default start minute (8am / 1pm / 7pm) for a coach "move to {bucket}" action.
const COACH_BUCKET_START = { morning: 480, afternoon: 780, evening: 1140 };
// Carry out a coach 'moveToBest' suggestion: reschedule the skipped activity's primary
// block into its best time-of-day, at the first conflict-free slot that fits the day.
// Returns true if it actually moved a block; false (and falls back to the Schedule tab)
// when there's no block or no room. Shared by the dashboard + Progress coach cards.
// Returns an UNDO function (restores the pre-move schedule) on success, or null when it
// couldn't act (then it navigates to the Schedule tab). The undo lets the card offer a
// one-tap revert in addition to the global Ctrl/Cmd+Z.
function coachMove(sug, schedule, setSchedule, onOpenTab) {
  if (!sug || sug.key !== 'moveToBest') { if (onOpenTab) onOpenTab('schedule'); return null; }
  const blk = schedule.find(b => b.activityId === sug.params.actId);
  if (!blk) { if (onOpenTab) onOpenTab('schedule'); return null; }
  const dur = Math.max(15, blk.end - blk.start);
  let s = COACH_BUCKET_START[sug.params.bucket] || 540;
  while (s + dur <= 1440 && findScheduleConflict(schedule, blk.days, s, s + dur, blk.id)) s += 15;
  if (s + dur > 1440) { if (onOpenTab) onOpenTab('schedule'); return null; }
  setSchedule(schedule.map(b => b.id === blk.id ? { ...b, start: s, end: s + dur } : b));
  return () => setSchedule(schedule); // undo → restore the pre-move schedule
}

// (no block, no room, or it's already sitting in the best slot).
function previewReschedule(sug, schedule) {
  if (!sug || sug.key !== 'moveToBest') return null;

  if (s + dur > 1440 || s === blk.start) return null;
  return { blockId: blk.id, oldStart: blk.start, oldEnd: blk.end, newStart: s, newEnd: s + dur, bucket: sug.params.bucket };

              {speechSupported && (
                <button className={'plan-mic' + (listening ? ' on' : '')} onClick={toggleMic}
                  aria-label={tr('chat.mic')} title={tr('chat.mic')}>{listening ? '⏹' : '🎤'}</button>
              )}
            </div>
            <div className="plan-chips">
              <span className="plan-chips-label">{tr('plan.try')}</span>
              {['plan.ex1', 'plan.ex2', 'plan.ex3'].map(k => (
                <button key={k} className="plan-chip" onClick={() => { setText(tr(k)); if (taRef.current) taRef.current.focus(); }}>{tr(k)}</button>
              ))}
            </div>
            {err && <div className="plan-err">{err}</div>}
            {!canAI && <p className="plan-lock">🔒 {tr('plan.proNote')}</p>}
            <div className="plan-actions">
              <button className="btn-ghost" onClick={onClose}>{tr('common.close')}</button>
              <button className="btn-primary" disabled={busy || !text.trim()} onClick={go}>{busy ? tr('plan.thinking') : tr('plan.go')}</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="plan-title">✨ {tr('plan.title')}</div>
            <p className="plan-sub">{tr('plan.previewSub')}</p>
            <div className="plan-preview">
              <span className="plan-prev-emoji">{spec.emoji}</span>
              <div className="plan-prev-info">
                <div className="plan-prev-name">{spec.name}</div>
                <div className="plan-prev-meta">{daysLabel} · {timeLabel} · {goalLabel}</div>
              </div>
            </div>
            <div className="plan-actions">
              <button className="btn-ghost" onClick={() => setSpec(null)}>{tr('plan.redo')}</button>
              <button className="btn-primary" onClick={() => onCreate(spec)}>{tr('plan.create')}</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// "JEK plans your week" (Pro): pick a wake/sleep window + an optional fixed-commitment note, and the
// AI lays the user's EXISTING activities across the week (using each one's weekly-frequency target).
// Previews the proposed blocks before committing; accept adds them ALL (the user can then drag/delete
// any single one with the normal grips). Free users route to billing on submit, like PlanWithJekModal.
function JekPlanWeekSheet({ plan, activities, defaultWake, defaultSleep, onCommit, onClose, onOpenBilling }) {
  useEscClose(onClose);
  const canAI = planAllows(plan, 'aiPlan');
  const left = aiQuotaLeft(plan);
  const [wake, setWake] = React.useState(minToInput(defaultWake || 420));
  const [sleep, setSleep] = React.useState(minToInput(defaultSleep || 1380));
  const [note, setNote] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [blocks, setBlocks] = React.useState(null); // proposed blocks once JEK answers
  const [err, setErr] = React.useState('');
  const usable = (activities || []).filter(a => a && a.id && a.name);
  const actMap = {}; usable.forEach(a => { actMap[a.id] = a; });
  const go = async () => {
    if (busy) return;
    if (!canAI) { onOpenBilling(); return; }
    if (!usable.length) { setErr(tr('planweek.noActs')); return; }
    setBusy(true); setErr('');
    const r = await aiPlanWeek(plan, { wakeMin: inputToMin(wake), sleepMin: inputToMin(sleep), note: note.trim(), activities: usable }, getLang());
    setBusy(false);
    if (r && r.error === 'pro') { onOpenBilling(); return; }
    if (!r || r.error) { setErr(tr(r && r.error === 'quota' ? 'planweek.quota' : r && r.error === 'none' ? 'planweek.noActs' : 'planweek.failed')); return; }
    setBlocks(r.blocks);
  };
  return (
    <div className="sheet-backdrop" onClick={onClose}>
      <div className="sheet plan-sheet" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
        <div className="sheet-grabber" />
        {!blocks ? (
          <React.Fragment>
            <div className="plan-head">
              <div className={'plan-orb' + (busy ? ' thinking' : '')}>🪄</div>
              <div className="plan-head-text">
                <div className="plan-title">{tr('planweek.title')}</div>
                <p className="plan-sub">{tr('planweek.sub')}</p>
              </div>
            </div>
            <div className="planweek-times">
              <label className="planweek-time"><span>{tr('planweek.wake')}</span>
                <input type="time" value={wake} onChange={e => setWake(e.target.value)} /></label>
              <label className="planweek-time"><span>{tr('planweek.sleep')}</span>
                <input type="time" value={sleep} onChange={e => setSleep(e.target.value)} /></label>
            </div>
            <div className="plan-field">
              <textarea className="plan-input" rows={2} maxLength={300} value={note}
                placeholder={tr('planweek.notePh')} onChange={e => setNote(e.target.value)} />
            </div>
            <div className="planweek-acts">
              <span className="plan-chips-label">{tr('planweek.using')}</span>
              {usable.length ? usable.map(a => (
                <span key={a.id} className="planweek-actchip">{a.emoji} {a.name}{a.weeklyAmount > 0 ? ' · ' + a.weeklyAmount + (a.goalMode === 'amount' && a.unit ? ' ' + a.unit : 'x') + '/' + tr('planweek.wk') : ''}</span>
              )) : <span className="planweek-noacts">{tr('planweek.noActs')}</span>}
            </div>
            {err && <div className="plan-err">{err}</div>}
            {!canAI && <p className="plan-lock">🔒 {tr('planweek.proNote')}</p>}
            <div className="plan-actions">
              <button className="btn-ghost" onClick={onClose}>{tr('common.close')}</button>
              <button className="btn-primary" disabled={busy} onClick={go}>{busy ? tr('planweek.thinking') : (canAI ? tr('planweek.go') : tr('planweek.unlock'))}</button>
            </div>
            {canAI && <p className="planweek-quota">{tr('planweek.quotaLeft', { n: left })}</p>}
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="plan-title">🪄 {tr('planweek.previewTitle', { n: blocks.length })}</div>
            <p className="plan-sub">{tr('planweek.previewSub')}</p>
            <div className="planweek-preview">
              {blocks.map((b, i) => { const a = actMap[b.activityId]; if (!a) return null;
                return (
                  <div key={i} className="planweek-prev-row">
                    <span className="planweek-prev-emoji">{a.emoji}</span>
                    <div className="planweek-prev-info">
                      <div className="planweek-prev-name">{a.name}</div>
                      <div className="planweek-prev-meta">{b.days.map(d => wd(d)).join(' · ')} · {fmtClock(b.start)}–{fmtClock(b.end)}</div>
                    </div>
                  </div>
                );
              })}
            </div>
            {err && <div className="plan-err">{err}</div>}
            <div className="plan-actions">
              <button className="btn-ghost" disabled={busy} onClick={() => { setBlocks(null); setErr(''); }}>{tr('planweek.back')}</button>
              <button className="btn-ghost" disabled={busy} onClick={go}>{busy ? tr('planweek.thinking') : tr('planweek.regen')}</button>
              <button className="btn-primary" disabled={busy} onClick={() => onCommit(blocks)}>{tr('planweek.accept')}</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// Tab 1: the library of activities (name + color). These are placed onto the
// Schedule tab with real times; deleting one also removes its schedule blocks.
function ActivityListScreen({ activities, setActivities, schedule, setSchedule, done, setDone, plan, onOpenBilling }) {
  const [sheet, setSheet] = React.useState(null); // { activity } edit | { isNew: true }
  const [quick, setQuick] = React.useState(false); // QuickAddSheet (the simple create front door)
  const [editMode, setEditMode] = React.useState(false); // Main-page manage mode: per-card delete + grab-to-reorder
  const [pendingEdit, setPendingEdit] = React.useState(null); // activityId to open in the full editor once it exists
  const [planOpen, setPlanOpen] = React.useState(false); // "Plan with JEK" modal
  const usageCount = (id) => schedule.filter(b => b.activityId === id).length;
  const primaryBlock = (id) => schedule.find(b => b.activityId === id) || null;
  // Save the activity AND rebuild its schedule blocks from the editor's "When" section.
  // `when` = { specs: [{days,start,end}] } (one block per slot), or null to unschedule.
  const commit = (existingId, name, color, emoji, unit, when, weeklyAmount, dayLabels, goalMode, goalTarget, type, dayAmounts, emoji2, emojiCrop) => {
    const id = existingId || uid();
    const wa = weeklyAmount > 0 ? weeklyAmount : 0;
    const gm = (goalMode === 'amount' || goalMode === 'percent') ? goalMode : 'time';
    const gt = gm === 'percent' ? 100 : (goalTarget > 0 ? goalTarget : 0);
    const dl = (dayLabels && Object.keys(dayLabels).length) ? dayLabels : {};
    const damt = (gm === 'amount' && dayAmounts && Object.keys(dayAmounts).length) ? dayAmounts : {};
    const ty = type === 'hobby' ? 'hobby' : 'task';
    setActivities(prev => existingId
      ? prev.map(a => a.id === id ? { ...a, name, color, emoji, emoji2: emoji2 || '', emojiCrop: emojiCrop || null, unit, weeklyAmount: wa, goalMode: gm, goalTarget: gt, dayAmounts: damt, dayLabels: dl, type: ty } : a)
      : [...prev, { id, name, color, emoji, emoji2: emoji2 || '', emojiCrop: emojiCrop || null, unit, weeklyAmount: wa, goalMode: gm, goalTarget: gt, dayAmounts: damt, dayLabels: dl, type: ty, createdAt: Date.now() }]);
    setSchedule(prev => scheduleFromWhen(prev, id, when));
    setSheet(null);
  };
  // "Plan with JEK" result → create the activity + its schedule block via the same commit path.
  const createFromPlan = (spec) => {
    commit(null, spec.name, pickFreeColor(activities.map(a => a.color)), spec.emoji, spec.unit || '',
      { specs: [{ days: spec.days, start: spec.start, end: spec.end }] },
      0, {}, spec.goalMode, spec.target || 0, 'task', {}, '', null);
    setPlanOpen(false);
  };
  // Quick Add → "More settings": create the activity + block NOW (so the placement isn't lost),
  // then queue it to open in the full ActivitySheet. We don't open the editor inline here because
  // `activities`/`schedule` haven't re-rendered yet — the effect below opens it once both are live
  // (so the full sheet's When/scoring sections seed from the real, just-saved block).
  const quickAdvanced = (spec) => {
    const id = uid();
    setActivities(prev => [...prev, { id, name: spec.name, color: spec.color, emoji: spec.emoji, emoji2: '', emojiCrop: null, unit: '', weeklyAmount: 0, goalMode: 'time', goalTarget: 0, dayAmounts: {}, dayLabels: {}, type: 'task', createdAt: Date.now() }]);
    setSchedule(prev => scheduleFromWhen(prev, id, spec.when));
    setQuick(false);
    setPendingEdit(id);
  };
  React.useEffect(() => {
    if (!pendingEdit) return;
    const a = activities.find(x => x.id === pendingEdit);
    if (a) { setSheet({ activity: a }); setPendingEdit(null); }
  }, [pendingEdit, activities]);
  const deleteActivity = (id) => {
    // Capture this activity's block ids BEFORE pruning the schedule, so we can also
    // sweep `done` of their logged entries and of any free sessions tagged with this
    // activity — otherwise orphaned `_free` sessions keep inflating your minutes forever.
    const deadBlockIds = new Set(schedule.filter(b => b.activityId === id).map(b => b.id));
    setActivities(prev => prev.filter(a => a.id !== id));
    setSchedule(prev => prev.filter(b => b.activityId !== id));
    if (setDone) setDone(prev => {
      let changed = false;
      const next = {};
      for (const dk of Object.keys(prev || {})) {
        const day = prev[dk]; const nd = {};
        for (const key of Object.keys(day)) {
          if (key === '_free') continue;
          if (deadBlockIds.has(key)) { changed = true; continue; } // drop orphan block entry
          nd[key] = day[key];
        }
        if (day._free) {
          const kept = day._free.filter(f => f.activityId !== id);
          if (kept.length !== day._free.length) changed = true;
          if (kept.length) nd._free = kept;
        }
        if (Object.keys(nd).length) next[dk] = nd; // drop the day entirely if now empty
        else changed = true;
      }
      return changed ? next : prev;
    });
    setSheet(null);
  };

  // --- Hold-then-drag to reorder the list (pointer-based; tap still opens edit) ---
  const listRef = React.useRef(null);
  const dm = React.useRef(null);             // live drag meta (mutated, no re-render)
  const clickSuppress = React.useRef(false); // swallow the click that follows a drag
  const [drag, setDrag] = React.useState(null); // { id, fromIndex, overIndex, dy, cardH, moving }
  const onCardDown = (e, a, index) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const touch = e.pointerType === 'touch';
    // The whole tab scrolls in .app-main — grab it so a drag near the top/bottom edge
    // can carry a card to a slot that's currently off-screen (same feel as the timeline).
    const scroller = listRef.current ? listRef.current.closest('.app-main') : null;
    const m = { id: a.id, index, startY: e.clientY, startScroll: scroller ? scroller.scrollTop : 0,
                lastY: e.clientY, armed: false, moving: false, over: index, cardH: 0, holdT: null, raf: 0 };
    // Measure the cards and switch this card into drag mode. On mouse we call this on
    // the first real movement (grab-and-go, no hold); on touch it fires after a short
    // hold so a swipe can still scroll the list.
    const arm = () => {
      if (dm.current !== m || !listRef.current) return;
      const rects = Array.from(listRef.current.querySelectorAll('.act-card')).map(k => k.getBoundingClientRect());
      m.cardH = rects.length > 1 ? (rects[1].top - rects[0].top) : ((rects[0] ? rects[0].height : 66) + 10);
      // Real scroll limit, captured BEFORE the dragged card gets a translateY (which would
      // otherwise inflate scrollHeight and let the edge auto-scroll run off into empty space).
      // The list's flow height is constant during a reorder, so this stays valid for the drag.
      m.maxScroll = scroller ? Math.max(0, scroller.scrollHeight - scroller.clientHeight) : 0;
      // The dragged card's flow position + the content height (both clean, pre-transform).
      // apply() clamps the card's translate to these so it can never extend past the list
      // into empty space — which is what was inflating scrollHeight and the scrollbar.
      const sr = scroller ? scroller.getBoundingClientRect() : null;
      m.contentH = scroller ? scroller.scrollHeight : 0;
      m.cardTop = (sr && rects[m.index]) ? (rects[m.index].top - sr.top) + scroller.scrollTop : 0;
      m.armed = true;
      setDrag({ id: m.id, fromIndex: m.index, overIndex: m.index, dy: 0, cardH: m.cardH, moving: false });
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
      m.raf = requestAnimationFrame(loop); // run continuously so edge-scroll works even if the pointer holds still
    };
    // Re-measure live each frame: the dragged card's offset folds in how far the list
    // has auto-scrolled since grab (so it keeps tracking the pointer), and the drop slot
    // is read from the cards' current on-screen positions.
    const apply = () => {
      if (!listRef.current) return;
      const scroll = scroller ? scroller.scrollTop : 0;
      let dy = (m.lastY - m.startY) + (scroll - m.startScroll);
      // Keep the card inside the list's content (no overshoot into empty space).
      if (m.contentH) dy = Math.max(-m.cardTop, Math.min(m.contentH - m.cardH - m.cardTop, dy));
      const centers = Array.from(listRef.current.querySelectorAll('.act-card'))
        .map(k => { const r = k.getBoundingClientRect(); return (r.top + r.bottom) / 2; });
      let over = centers.length;
      for (let k = 0; k < centers.length; k++) { if (m.lastY < centers[k]) { over = k; break; } }
      m.over = over;
      setDrag({ id: m.id, fromIndex: m.index, overIndex: over, dy, cardH: m.cardH, moving: true });
    };
    const EDGE = 56, MAXV = 16; // edge-zone height (px) and max scroll speed (px/frame)
    const loop = () => {
      if (scroller) {
        const r = scroller.getBoundingClientRect();
        let dv = 0;
        if (m.lastY < r.top + EDGE) dv = -Math.ceil((r.top + EDGE - m.lastY) / EDGE * MAXV);
        else if (m.lastY > r.bottom - EDGE) dv = Math.ceil((m.lastY - (r.bottom - EDGE)) / EDGE * MAXV);
        if (dv) {
          const max = m.maxScroll; // fixed real limit — not the live (transform-inflated) scrollHeight
          const before = scroller.scrollTop;
          scroller.scrollTop = Math.max(0, Math.min(max, before + dv));
          if (scroller.scrollTop !== before && m.moving) apply(); // keep following while it scrolls
        }
      }
      m.raf = requestAnimationFrame(loop);
    };
    const move = (ev) => {
      if (dm.current !== m) return;
      const dy0 = ev.clientY - m.startY;
      if (!m.armed) {
        // Touch: stay un-armed until the hold timer fires; a vertical swipe before that
        // means the user is scrolling, so abort. Mouse: no hold — start dragging the
        // moment the pointer moves past a small threshold.
        if (touch) { if (Math.abs(dy0) > 8) { clearTimeout(m.holdT); up(); } return; }
        if (Math.abs(dy0) > 4) arm(); else return;
      }
      ev.preventDefault();
      m.moving = true;
      m.lastY = ev.clientY;
      apply();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      clearTimeout(m.holdT);
      if (m.raf) cancelAnimationFrame(m.raf);
      if (m.moving) {
        clickSuppress.current = true;
        setTimeout(() => { clickSuppress.current = false; }, 350); // self-clear if no click follows
        const from = m.index, over = m.over;
        setActivities(prev => {
          const arr = prev.slice();
          if (from < 0 || from >= arr.length) return prev;
          const [moved] = arr.splice(from, 1);
          let target = over > from ? over - 1 : over;
          target = Math.max(0, Math.min(arr.length, target));
          arr.splice(target, 0, moved);
          return arr;
        });
      }
      if (dm.current === m) dm.current = null;
      setDrag(null);
    };
    // Touch only: arm after a short hold so a quick tap still opens the editor (and a
    // finger-swipe can still scroll the list). Mouse arms on movement in move().
    if (touch) m.holdT = setTimeout(arm, 200);
    dm.current = m;
    window.addEventListener('pointermove', move, { passive: false }); // move() calls preventDefault to block the page scroll while dragging
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };

  return (
    <div className="activity-screen">
      <div className="act-list-head">
        <div className="section-label" style={{ margin: 0 }}>{tr('act.section')}</div>
        {activities.length > 0 && (
          <button type="button" className={'act-edit-toggle' + (editMode ? ' on' : '')} onClick={() => setEditMode(m => !m)}>
            {editMode ? tr('act.editDone') : tr('act.editMode')}
          </button>
        )}
      </div>
      {activities.length === 0 ? (
        <div className="empty" style={{ marginTop: '6vh' }}>
          <div className="empty-mark">🌱</div>
          <h2 className="empty-title">{tr('act.emptyTitle')}</h2>
          <p className="empty-sub">{tr('act.emptySub')}</p>
          <button className="btn-primary" data-tour="add-activity" onClick={() => setQuick(true)}>{tr('act.addFirst')}</button>
          {/* "Plan with JEK" parked for now — un-comment to revive (modal + aiPlan tier still intact). */}
          {/* <button className="btn-ai-plan" onClick={() => setPlanOpen(true)}>{tr('act.planBtn')}</button> */}
        </div>
      ) : (
        <React.Fragment>
          <div className="act-list" ref={listRef}>
            {activities.map((a, i) => {
              const n = usageCount(a.id);
              // Live drag transforms: the held card follows the pointer; the rest slide
              // to open a gap at the drop slot.
              let ty = 0, isDragged = false;
              if (drag && drag.moving) {
                if (drag.id === a.id) { ty = drag.dy; isDragged = true; }
                else if (i > drag.fromIndex && i < drag.overIndex) ty = -drag.cardH;
                else if (i >= drag.overIndex && i < drag.fromIndex) ty = drag.cardH;
              }
              const armed = drag && drag.id === a.id && !drag.moving;
              const cls = 'act-card' + (editMode ? ' editing' : '') + (isDragged ? ' dragging' : (armed ? ' armed' : (drag && drag.moving ? ' shift' : '')));
              return (
                <button key={a.id} className={cls}
                  style={ty ? { transform: 'translateY(' + ty + 'px)' } : undefined}
                  onPointerDown={(e) => onCardDown(e, a, i)}
                  onClick={() => { if (clickSuppress.current) { clickSuppress.current = false; return; } setSheet({ activity: a }); }}>
                  <span className="act-card-emoji" style={{ borderColor: a.color, cursor: isMediaFace(a.emoji) ? 'zoom-in' : undefined }}
                    onClick={isMediaFace(a.emoji) ? (e) => { e.stopPropagation(); openFacePreview(a.emoji, a.name, e.currentTarget); } : undefined}>
                    {/* `quiet`: play the real animated webp continuously (🔥/💪 etc. stay alive in
                        the list) but suppress the FAKE sway on emoji that have no animation, so
                        the static ones sit calm instead of wiggling cheaply. */}
                    <TaskEmoji act={a} size={26} quiet label={a.name} />
                  </span>
                  <div className="act-card-info">
                    <div className="act-card-name">
                      <span className="act-card-name-text">{a.name}</span>
                      {a.type === 'hobby' && <span className="act-hobby-pill">{tr('act.forMe')}</span>}
                    </div>
                    <div className="act-card-sub">
                      <span>{n === 0 ? tr('act.notScheduled') : tr('act.blocksInSchedule', { n })}</span>
                    </div>
                  </div>
                  {editMode
                    ? <span className="act-card-del" role="button" tabIndex={0}
                        onClick={(e) => { e.stopPropagation(); if (confirm(tr('act.confirmDelete', { name: a.name }))) deleteActivity(a.id); }}
                        aria-label={tr('common.delete')}>✕</span>
                    : <span className="act-card-edit">{tr('act.cardEdit')}</span>}
                </button>
              );
            })}
          </div>
          <button className="btn-ghost btn-block" data-tour="add-activity" onClick={() => setQuick(true)}>{tr('act.add')}</button>
          {/* "Plan with JEK" parked for now — un-comment to revive (modal + aiPlan tier still intact). */}
          {/* <button className="btn-ai-plan btn-block" onClick={() => setPlanOpen(true)}>{tr('act.planBtn')}</button> */}
        </React.Fragment>
      )}

      {sheet && (
        <ActivitySheet
          initial={sheet.activity || null}
          initialBlock={sheet.activity ? primaryBlock(sheet.activity.id) : null}
          schedule={schedule}
          usedColors={activities.filter(a => !sheet.activity || a.id !== sheet.activity.id).map(a => a.color)}
          usage={sheet.activity ? usageCount(sheet.activity.id) : 0}
          plan={plan} onOpenBilling={onOpenBilling}
          onCancel={() => setSheet(null)}
          onSave={(name, color, emoji, unit, when, weeklyAmount, dayLabels, goalMode, goalTarget, type, dayAmounts, emoji2, emojiCrop) => commit(sheet.activity ? sheet.activity.id : null, name, color, emoji, unit, when, weeklyAmount, dayLabels, goalMode, goalTarget, type, dayAmounts, emoji2, emojiCrop)}
          onDelete={sheet.activity ? () => deleteActivity(sheet.activity.id) : null}
        />
      )}
      {quick && (
        <QuickAddSheet
          activities={activities}
          onSave={(name, color, emoji, when) => { commit(null, name, color, emoji, '', when, 0, {}, 'time', 0, 'task', {}, '', null); setQuick(false); }}
          onAdvanced={quickAdvanced}
          onCancel={() => setQuick(false)} />
      )}
      {planOpen && <PlanWithJekModal plan={plan} onCreate={createFromPlan} onClose={() => setPlanOpen(false)} onOpenBilling={onOpenBilling} />}
    </div>
  );
}

// Full-screen browser of every emoji as the Noto 3D art, rendered as the STATIC
// 512.png (`still`) — same look as the animated set but no animation, so 600 of
// them don't peg the CPU. The picked emoji still animates beside the avatar.
// Search keywords per emoji (glyph → space-separated terms). Covers the common,
