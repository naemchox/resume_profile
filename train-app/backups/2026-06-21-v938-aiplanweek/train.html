                                aria-label={canUnrest ? 'Cancel rest ticket for ' + name : isDone ? 'Uncheck ' + name : jekDone ? (avatar.name || 'JEK') + ' finished ' + name + ' — tap if you did it too' : 'Mark done ' + name}>
                                {excused ? <span className="tix-tilt">🎟️</span>
                                  : isDone ? '✓'
                                    : jekDone ? <span className="wg-box-jek">{renderFace(avatar.emoji, 11)}</span>
                                      : <span className="wg-box-mark" />}
                              </button>
                            );
                          })()}
                          <span className="wg-row clean">
                            <TaskEmoji act={a} size={15} label={name} />
                            <span className="wg-name">{name}</span>
                          </span>
                          {/* On a tall block show EITHER the goal progress (3/8 · 50%) for a
                              goal task — OR the start time. The badge is now READ-ONLY (a plain
                              span, not a button): it just surfaces partial progress so it can't be
                              confused with the check box beside it (the check box marks done in
                              place; tap the day header to open the day and log a partial amount). */}
                          {tall && (goalTarget > 0 && !excused
                            ? <span className={'wg-goal' + (loggedAmt >= goalTarget ? ' hit' : '')}
                                title={'🎯 ' + (isPctGoal ? loggedAmt + '%' : loggedAmt + '/' + goalTarget + (goalUnit ? ' ' + goalUnit : '')) + ' · ' + fmtClock(bStart)}>
                                🎯 {isPctGoal ? loggedAmt + '%' : loggedAmt + '/' + goalTarget}
                              </span>
                            : <span className="wg-time">{fmtClock(bStart)}</span>)}
                        </div>
                        <div className="wg-block-resize" onPointerDown={(e) => startResize(e, b, d)} aria-label={tr('a11y.resize')} />
                      </div>
                    );
                  })}
                  {/* (Separate "you did it" session boxes removed — completion now shows directly
                      on the full-width plan block as a filled tint + ✓. The exact logged time
                      lives in Day view.) */}
                  {/* Free ME sessions (logged via ＋, not tied to a block): dashed boxes on the
                      LEFT (you) half — amber for a normal activity, blue for a for-me one. Tap
                      opens the day to edit. */}
                  {d.frees.map(f => {
                    const fa = findActivity(activities, f.activityId);
                    const fname = fa ? fa.name : tr('fallback.session');
                    const fHobby = fa && fa.type === 'hobby';
                    const ffH = Math.max(16, toY(f.end) - toY(f.start));
                    return (
                      <div key={'free' + f.id} role="button" tabIndex={0} className="wg-block mefree"
                        style={{ top: toY(f.start), height: ffH, left: '2px', right: '2px' }}
                        onClick={() => onOpenDay(d.offset)}
                        title={fname + ' · logged session · ' + fmtClock(f.start) + '–' + fmtClock(f.end)}>
                        <div className={'wg-lane mefree clean' + (fHobby ? ' hob' : '') + (ffH >= 26 ? ' tall' : '')}>
                          <span className="wg-me-chk">✓</span>
                          <span className="wg-row clean">
                            <TaskEmoji act={fa} size={15} label={fname} />
                            <span className="wg-name">{fname}</span>
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
          {weekOffset === 0 && <div className="wg-now" style={{ top: toY(nowMin) }}><span className="wg-now-dot" /></div>}
        </div>
      </div>
        </div>
      </div>
    </div>
  );
}

// Week view: this week's progress for the committed self vs you — total TIME
// (settled so far: past days full, today up to now) plus per-activity WORK amount
// (pages/km/reps — can't be summed across units, so one row each). Navigable by week.
function WeekView({ avatar, activities, schedule, done, now }) {
  const [weekOffset, setWeekOffset] = React.useState(0);
  const weekStart = addDays(startOfWeek(now), weekOffset * 7);
  const todayStart = startOfDay(now);
  const nowMin = nowMinutes(now);
  const restDays = avatar.restDays || [];

  const days = [];
  let planMin = 0, doneMin = 0;
  const amountMap = {};
  const sessionMap = {}; // scheduled sessions this week per activity (drives per-session goal rollup)
  const targetMap = {};  // summed per-session amount goal (per-day aware) for the week
  for (let i = 0; i < 7; i++) {
    const ts = addDays(weekStart, i);
    const dStart = startOfDay(ts);
    const isToday = dStart === todayStart;
    const isFuture = dStart > todayStart;
    const idx = dayIndexMon(ts);
    const isRest = restDays.indexOf(idx) !== -1;
    const blocks = blocksForDate(schedule, done, ts).filter(b => notHobby(b, activities)); // hobbies don't race → excluded from the week's bars
    if (!isRest) for (const b of blocks) { sessionMap[b.activityId] = (sessionMap[b.activityId] || 0) + 1; targetMap[b.activityId] = (targetMap[b.activityId] || 0) + actAmtTarget(findActivity(activities, b.activityId), idx); }
    const dmap = done[dayKey(ts)] || {};
    const cap = isFuture ? 0 : (isToday ? nowMin : 1440);
    const sc = dayScore(blocks, dmap, cap, activities);   // amount-aware → the JEK/ME bars
    const gr = dayCredit(blocks, dmap, cap, activities);  // amount-aware grade → kept status
    planMin += sc.planMin; doneMin += sc.doneMin;
    let status;
    if (isRest) status = 'rest';
    else if (blocks.length === 0) status = 'none';
    else if (isFuture) status = 'future';
    else {
      const ok = gr.plan > 0 && gr.done >= gr.plan;
      status = ok ? 'kept' : (isToday ? 'today' : 'behind');
    }
    days.push({ dow: i, status, isToday });
    if (isFuture) continue;
    for (const b of blocks) {
      const e = dmap[b.id];
      if (e && typeof e === 'object' && typeof e.amount === 'number' && e.amount > 0) {
        (amountMap[b.activityId] || (amountMap[b.activityId] = 0));
        amountMap[b.activityId] += e.amount;
      }
    }
  }
  const gapMin = Math.max(0, planMin - doneMin);
  const hasPlan = planMin > 0;
  const timePct = hasPlan ? Math.round(doneMin / planMin * 100) : null;
  // Weekly goals = per-session amount goal × sessions this week, vs amount logged.
  const amountRows = activities
    .map(a => ({ act: a, per: actAmtTarget(a), tgt: targetMap[a.id] || 0, done: amountMap[a.id] || 0 }))
    .filter(r => r.per > 0 || r.done > 0)
    .map(r => ({ act: r.act, target: r.tgt > 0 ? r.tgt : 0, done: r.done }));
  const wEnd = addDays(weekStart, 6);
  const rangeLabel = new Date(weekStart).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    + ' – ' + new Date(wEnd).toLocaleDateString('en-US', { day: 'numeric' });

  return (
    <div className="wk-wrap">
      <div className="cal-head">
        <button className="cal-nav" onClick={() => setWeekOffset(o => o - 1)} aria-label={tr('a11y.prevWeek')}>‹</button>
        <div className="cal-date">
          <span className="cal-date-main">{weekOffset === 0 ? 'This week' : rangeLabel}</span>
        </div>
        <button className="cal-nav" onClick={() => setWeekOffset(o => o + 1)} aria-label={tr('a11y.nextWeek')}>›</button>
        {timePct !== null
          ? <span className={'cal-pill' + (timePct >= 100 ? ' good' : timePct >= 60 ? ' mid' : ' bad')}>{timePct}% · {formatHM(Math.round(doneMin) * 60)}</span>
          : <span className="cal-pill plan">—</span>}
      </div>

      <div className="wk-scroll">
        {hasPlan
          ? <RaceHeader avatar={avatar} youMin={doneMin} avatarMin={planMin} dayTotal={planMin} gapMin={gapMin} period="This week" />
          : <div className="rh idle"><span className={'hero-face rh-hero-face' + auraClass(avatar.aura)}>{renderFace(avatar.emoji, 38, false, false, false, avatar.aura, avatar.faceCrop || null, avatar.faceAdjust)}{renderBadges(_selfBadges, 'av-acc-sm', 38)}</span><div className="rh-bars"><div className="rh-status" style={{ textAlign: 'left' }}>{tr('race.noPlan')}</div></div></div>}

        <div className="wk-strip">
          {days.map((d, i) => (
            <div key={i} className={'wk-day' + (d.isToday ? ' today' : '')}>
              <span className="wk-day-lbl">{wd(i)}</span>
              <span className={'wk-day-glyph ' + d.status}>{WEEK_GLYPH[d.status]}</span>
            </div>
          ))}
        </div>

        {amountRows.length > 0 && (
          <React.Fragment>
            <div className="section-label" style={{ margin: '6px 0 4px' }}>Weekly goals</div>
            <div className="wk-amts">
              {amountRows.map(r => {
                const pct = r.target > 0 ? Math.min(100, Math.round(r.done / r.target * 100)) : 0;
                const unit = r.act.unit || '';
                return (
                  <div key={r.act.id} className="wk-amt-row">
                    <span className="wk-amt-emoji">
                      <TaskEmoji act={r.act} size={20} label={r.act.name} />
                    </span>
                    <div className="wk-amt-body">
                      <div className="wk-amt-top">
                        <span className="wk-amt-name">{r.act.name}</span>
                        <span className="wk-amt-val">{r.target > 0 ? r.done + '/' + r.target + (unit ? ' ' + unit : '') + ' · ' + pct + '%' : r.done + (unit ? ' ' + unit : '') + ' logged'}</span>
                      </div>
                      {r.target > 0 && <div className="wk-amt-track"><div className="wk-amt-fill" style={{ width: pct + '%', background: r.act.color }} /></div>}
                    </div>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// Minimal line-style speech-bubble (matches the flat ⤲ / × glyphs; inherits color).
function CommentIcon({ size = 12 }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor"
      strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{ display: 'block' }}>
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
  );
}

// A popover anchored below its block (top:100%) overflows when the block sits near
// the bottom of the timeline. This flips it ABOVE the block (adds an `.up` class)
// whenever opening it below would spill past the visible bottom of the scroll area.
// `key` is the open indicator (a block id or boolean); re-measures whenever it changes.
function useFlipUp(key) {
  const ref = React.useRef(null);
  const [flip, setFlip] = React.useState(false);
  React.useLayoutEffect(() => {
    if (!key) { setFlip(false); return; }
    const el = ref.current;
    if (!el) return;
    const scroller = el.closest('.tl-scroll');
    const limit = scroller ? scroller.getBoundingClientRect().bottom : window.innerHeight;
    const r = el.getBoundingClientRect();
    setFlip(r.bottom > limit - 6); // spills past the visible bottom → open upward instead
  }, [key]);
  return [ref, flip];
}

// One of YOUR actual sessions in the ME lane. Pointer-drag the body to move it in
// time, drag the bottom grip to resize, ⤲ to split into two, × to remove.
function MeSeg({ seg, name, y, scale, free, hobby, onChange, onSplit, onRemove, onEdit, note, onNote, selected, onSelect, col, cols, emoji, emoji2, emojiFallback }) {
  const [preview, setPreview] = React.useState(null);
  const [noteOpen, setNoteOpen] = React.useState(false);
  const [noteRead, setNoteRead] = React.useState(false); // read-only bubble shown by tapping the 💬 flag
  const [draft, setDraft] = React.useState(note || '');
  const [notePopRef, notePopUp] = useFlipUp(noteOpen);
  const [noteReadRef, noteReadUp] = useFlipUp(noteRead);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [menuRef, menuUp] = useFlipUp(menuOpen);
  React.useEffect(() => { if (!selected) setMenuOpen(false); }, [selected]); // deselecting closes the action menu
  React.useEffect(() => { setDraft(note || ''); }, [note]);
  const saveNote = () => { if (onNote) onNote(draft); setNoteOpen(false); };
  // Clicking anywhere outside the note popup closes it (discarding unsaved edits).
  // The popup stops pointer propagation, so this window listener only sees outside taps.
  React.useEffect(() => {
    if (!noteOpen && !noteRead) return;
    const closeOnOutside = () => { setDraft(note || ''); setNoteOpen(false); setNoteRead(false); };
    window.addEventListener('pointerdown', closeOnOutside);
    return () => window.removeEventListener('pointerdown', closeOnOutside);
  }, [noteOpen, noteRead, note]);
  const cur = preview || seg;
  const top = y(cur.start);
  // Selected session expands so its controls fit; unselected ones are compact pills.
  // BUT while actively dragging the resize grip, let the pill shrink to its true height
  // (small floor) so you can SEE it go below 15 min down to the 5-min minimum — the
  // normal min-height otherwise pins short sessions and makes the resize feel stuck.
  const minH = preview ? 12 : (selected ? 46 : 30);
  const height = Math.max(minH, (cur.end - cur.start) * scale);
  // When sessions overlap, unselected ones share the ME lane in side-by-side columns.
  // The selected (or dragging) one takes the FULL lane so its controls have room.
  const n = cols || 1, c = col || 0;
  const colStyle = (n > 1 && !preview && !selected)
    ? { left: 'calc(46px + (49% - 46px) * ' + c + ' / ' + n + ')', width: 'calc((49% - 46px) / ' + n + ' - 2px)', right: 'auto' }
    : null;
  const startDrag = (mode, e) => {
    if (e.button != null && e.button !== 0) return; // ignore right/middle-click so the context menu still works
    e.preventDefault(); e.stopPropagation();
    const y0 = e.clientY, start0 = seg.start, end0 = seg.end, dur = end0 - start0;
    // Drag-parity with the avatar PLAN block (startBlockMove): MOVE positions ABSOLUTELY
    // from the pointer-over-canvas (re-reading the rect each frame) + a grab offset, and
    // auto-scrolls near the edges. That's what made ME feel "stiff" vs the avatar — the
    // old delta-only math couldn't follow an auto-scroll, so there was no auto-scroll.
    // y(m) = m*scale + y(0), so minutes-from-clientY inverts to (py - y(0)) / scale.
    const canvas = e.currentTarget.closest('.tl-canvas');
    const scroller = e.currentTarget.closest('.tl-scroll');
    const baseY = y(0);
    const pmFromY = (clientY) => canvas ? (clientY - canvas.getBoundingClientRect().top - baseY) / scale : null;
    const p0 = pmFromY(y0);
    const grab = (p0 == null) ? 0 : start0 - p0; // keep the spot you grabbed under the finger
    let latest = { start: start0, end: end0 };
    let moved = false, lastY = e.clientY, raf = 0;
    const compute = () => {
      if (mode === 'resize') {
        const dm = Math.round(((lastY - y0) / scale) / 5) * 5; // snap 5 min — resize stays delta-based
        latest = { start: start0, end: Math.max(start0 + 5, Math.min(1440, end0 + dm)) };
      } else {
        const pm = pmFromY(lastY);
        if (pm == null) { // no canvas found → fall back to pure delta
          const dm = Math.round(((lastY - y0) / scale) / 5) * 5;
          let s = start0 + dm, en = end0 + dm;
          if (s < 0) { en -= s; s = 0; } if (en > 1440) { s -= (en - 1440); en = 1440; }
          latest = { start: s, end: en };
        } else {
          let s = Math.round((pm + grab) / 5) * 5; // snap 5 min
          if (s < 0) s = 0; if (s + dur > 1440) s = 1440 - dur;
          latest = { start: s, end: s + dur };
        }
      }
      if (moved) setPreview(latest);
    };
    // Auto-scroll the timeline when the MOVE drag nears the top/bottom edge, so a session
    // can be carried to a time that's currently off-screen (mirrors startBlockMove).
    const EDGE = 52, MAXV = 16;
    const loop = () => {
      if (moved && scroller) { // don't creep-scroll on a stationary press — only once it's a real drag
        const r = scroller.getBoundingClientRect();
        let dv = 0;
        if (lastY < r.top + EDGE) dv = -Math.ceil(((r.top + EDGE - lastY) / EDGE) * MAXV);
        else if (lastY > r.bottom - EDGE) dv = Math.ceil(((lastY - (r.bottom - EDGE)) / EDGE) * MAXV);
        if (dv) {
          const max = scroller.scrollHeight - scroller.clientHeight;
          scroller.scrollTop = Math.max(0, Math.min(max, scroller.scrollTop + dv));
          compute(); // ONLY recompute when auto-scroll actually moved the canvas (pointermove handles
                     // normal movement). Calling compute() every frame setState-stormed the timeline → iPad jank.
        }
      }
      raf = window.requestAnimationFrame(loop);
    };
    const move = (ev) => {
      if (Math.abs(ev.clientY - y0) > 4) moved = true; // real drag vs a tap
      lastY = ev.clientY;
      compute();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (raf) window.cancelAnimationFrame(raf);
      setPreview(null);
      // A plain tap selects/deselects (revealing controls); a real drag commits.
      if (!moved) { if (mode === 'move' && onSelect) onSelect(); return; }
      onChange(latest);
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up); // touch: browser may cancel the gesture instead of firing pointerup
    if (mode === 'move') raf = window.requestAnimationFrame(loop); // only the move drag needs auto-scroll
  };
  return (
    <div className={'tl2 me' + (preview ? ' dragging' : '') + (free ? ' free' : '') + (hobby ? ' hobby' : '') + (selected ? ' sel' : '') + (noteOpen ? ' noting' : '')} style={{ top, height, ...colStyle }}>
      <div className="meseg-grab" onPointerDown={(e) => startDrag('move', e)}>
        {emoji
          ? <TaskEmoji act={{ emoji: emoji, emoji2: emoji2 }} size={18} label={name} className="meseg-emoji" />
          : <span className="tl2-check on">✓</span>}
        <span className="meseg-info">
          <span className="tl2-name">{name}{note ? <button type="button" className="meseg-note-flag" title={note} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setNoteOpen(false); setNoteRead(v => !v); }} aria-label={tr('a11y.comment')}><CommentIcon size={9} /></button> : null}</span>
          <span className="meseg-time">{fmtClock(cur.start)}–{fmtClock(cur.end)} · {fmtDur(cur.end - cur.start)}</span>
        </span>
      </div>
      {/* Quick comment button (left of ⋯) → opens the note editor directly, no menu dive. */}
      {selected && onNote && <button type="button" className={'blk-quick-note' + (note ? ' has' : '')} onPointerDown={(e) => e.stopPropagation()} onClick={() => { setMenuOpen(false); setNoteRead(false); setDraft(note || ''); setNoteOpen(true); }} aria-label={tr('a11y.comment')}><CommentIcon size={12} /></button>}
      {/* One "⋯" trigger → roomy action menu, instead of four 18px buttons crammed in the corner. */}
      {selected && <button className="blk-more" onPointerDown={(e) => e.stopPropagation()} onClick={() => setMenuOpen(v => !v)} aria-label={tr('a11y.more')}>⋯</button>}
      {selected && menuOpen && (
        <div className={'blk-menu' + (menuUp ? ' up' : '')} ref={menuRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
          {onEdit && <button className="blk-menu-item" onClick={() => { setMenuOpen(false); onEdit(); }}><span className="blk-menu-ico">✎</span>{tr('a11y.edit')}</button>}
          {onNote && <button className="blk-menu-item" onClick={() => { setMenuOpen(false); setNoteOpen(true); }}><span className="blk-menu-ico"><CommentIcon size={13} /></span>{tr('a11y.comment')}</button>}
          <button className="blk-menu-item" onClick={() => { setMenuOpen(false); onSplit(); }}><span className="blk-menu-ico">⤲</span>{tr('a11y.split')}</button>
          <button className="blk-menu-item danger" onClick={() => { setMenuOpen(false); onRemove(); }}><span className="blk-menu-ico">×</span>{tr('a11y.remove')}</button>
        </div>
      )}
      {noteOpen && onNote && (
        <div className={'meseg-note-pop' + (notePopUp ? ' up' : '')} ref={notePopRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
          <textarea className="meseg-note-area" autoFocus rows={3} maxLength={500} placeholder={tr('note.howDid', { name })}
            value={draft} onChange={(e) => setDraft(e.target.value)} />
          <div className="meseg-note-actions">
            <button className="meseg-note-cancel" onClick={() => { setDraft(note || ''); setNoteOpen(false); }}>{tr('common.cancel')}</button>
            <button className="meseg-note-save" onClick={saveNote}>{tr('common.save')}</button>
          </div>
        </div>
      )}
      {noteRead && note && !noteOpen && (
        <div className={'meseg-note-pop read' + (noteReadUp ? ' up' : '')} ref={noteReadRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
          <div className="meseg-note-text">{note}</div>
          <button type="button" className="meseg-note-edit" onClick={() => { setNoteRead(false); setDraft(note || ''); setNoteOpen(true); }} aria-label={tr('a11y.edit')}>✎</button>
        </div>
      )}
      {/* Resize grip is always available (even on small overlapping pills); split/× need selecting. */}
      <div className="meseg-resize" onPointerDown={(e) => startDrag('resize', e)} aria-label={tr('a11y.resize')} />
    </div>
  );
}

// When several sessions of the SAME activity overlap, they collapse into ONE pill
// spanning their union (instead of shattering into unreadable columns). Read-only
// summary: emoji + name + ×N + the combined time range; selecting it reveals a single
// × that un-logs the whole cluster (granular un-checking still lives on the plan side).
function MeMergedSeg({ start, end, name, emoji, emoji2, emojiFallback, y, scale, col, cols, count, selected, onSelect, onRemoveAll }) {
  const top = y(start);
  const height = Math.max(selected ? 46 : 30, (end - start) * scale);
  const n = cols || 1, c = col || 0;
  // Share the lane in columns only while unselected; selecting takes the full width.
  const colStyle = (n > 1 && !selected)
    ? { left: 'calc(46px + (49% - 46px) * ' + c + ' / ' + n + ')', width: 'calc((49% - 46px) / ' + n + ' - 2px)', right: 'auto' }
    : null;
  return (
    <div className={'tl2 me merged' + (selected ? ' sel' : '')} style={{ top, height, ...colStyle }}>
      <button type="button" className="meseg-grab" onClick={onSelect} aria-label={tr('a11y.mergedSessions', { name })}>
        {emoji
          ? <TaskEmoji act={{ emoji: emoji, emoji2: emoji2 }} size={18} label={name} className="meseg-emoji" />
          : <span className="tl2-check on">✓</span>}
        <span className="meseg-info">
          <span className="tl2-name">{name}<span className="meseg-count">×{count}</span></span>
          <span className="meseg-time">{fmtClock(start)}–{fmtClock(end)} · {fmtDur(end - start)}</span>
        </span>
      </button>
      {selected && <button className="meseg-btn del" onPointerDown={(e) => e.stopPropagation()} onClick={onRemoveAll} aria-label={tr('a11y.removeAllSessions', { count, name })}>×</button>}
    </div>
  );
}

// "Lively" free-time fillers: the avatar's little hobbies between its scheduled blocks.
// Each potential window (≈ every 2.5h, 8 AM → ~10 PM) is computed independently from
// (daySeed, window index) so the day stays STABLE — resizing a real block only drops the
// windows it now covers, never re-rolls the rest. Inside each window the START is jittered
// off the hour, the LENGTH comes from the hobby's own realistic range, and ~1 in 4 windows
// is just downtime — so the pacing reads like a real person's day. Decorative only: never
// raced/scored/draggable. Shared by the Day timeline and the Week grid.
function livelyFillers(behavior, blocks, activities, daySeed) {
  // Lively free-time hobbies removed — the avatar no longer fills its gaps with ☕/etc.
  return [];
  // Persona built-ins only — a user's "Just for me" activity is theirs alone and must
  // never surface on the avatar's side (not even as a free-time filler).
  const pool = (LIVELY_BY_BEHAVIOR[behavior] || LIVELY_BY_BEHAVIOR.coach);
  if (!pool.length) return [];
  const WAKE = 480, SLEEP = 1350, WINDOW = 150; // ~8:00 → 22:30, one possible hobby per ~2.5h
  // Only the avatar's OWN scheduled TASK blocks suppress its free-time hobbies — a "just
  // for me" hobby block is yours and must coexist with the avatar's free-time hobby.
  // Suppress by the block's RENDERED footprint, not its raw time span: a short block is
  // drawn at a min-height floor (34px on Day, more on Week), so it visually spills past its
  // real end-time. Checking time alone (±5min) let a filler in the next small gap slide under
  // a stack of short blocks and overlap them. Pad both spans to a generous min-footprint (in
  // minutes, covering both view scales) so a filler only appears where there's real visible room.
  const BLOCK_FOOT = 40, FILL_FOOT = 35;
  const busy = (s, e) => blocks.some(b => {
    const ba = findActivity(activities, b.activityId);
    if (ba && ba.type === 'hobby') return false;
    const bEnd = b.start + Math.max(b.end - b.start, BLOCK_FOOT); // block's drawn bottom
    const fEnd = s + Math.max(e - s, FILL_FOOT);                  // filler's drawn bottom
    return s < bEnd + 4 && b.start < fEnd + 4;                    // padded footprints overlap → skip
  });
  const rnd = (i, k) => { const x = Math.sin(daySeed * 12.9898 + i * 78.233 + k * 37.719) * 43758.5453; return x - Math.floor(x); };
  const snap5 = (m) => Math.round(m / 5) * 5;
  const out = [];
  let idx = 0;
  for (let base = WAKE; base + 20 <= SLEEP; base += WINDOW, idx++) {
    if (rnd(idx, 1) < 0.28) continue; // some windows are just downtime
    const pi = Math.abs(daySeed * 7 + idx * 13) % pool.length;
    const item = pool[pi];
    const dr = item.dur || [20, 40];
    const dur = Math.max(5, snap5(dr[0] + rnd(idx, 2) * (dr[1] - dr[0])));
    const room = Math.max(0, WINDOW - dur - 15);
    const start = snap5(base + 5 + rnd(idx, 3) * room);
    const end = start + dur;
    if (end > SLEEP || busy(start, end)) continue;
    out.push({ id: 'lv' + idx, start, end, ...item, name: tr('lively.' + behavior + '.' + pi, null, item.name) });
  }
  return out;
}

function TwoLaneTimeline({ blocks, activities, nowMin, isToday, full, delMode, bands, daySeed, weekday, avatarEmoji, avatarName, behavior, lively, onToggleLively, getSegs, onToggle, getSub, onSetSegs, onEdit, getAmount, onSetAmount, getWeekAmount, getNote, onSetNote, onExpand, freeSessions, onAddFree, onSetFree, onSplitFree, onRemoveFree, onSetFreeNote, onEditActivity, onDragCreate, onResizeBlock, onMoveBlock, isExcused, isBlockExcused, softAwayDay, awayReason, onUnrest, onDeleteBlock, onSplitBlock }) {
  // On a whole-day Away (sick/trip/rest) the rested-block marker shows the REASON the user
  // picked, not a generic 🎟️ — the day reads as "sick", not "spent a ticket".
  const awayM = awayReason ? awayReasonMeta(awayReason) : null;
  const restGlyph = awayM
    ? <ActionEmoji code={awayM.code} size={18} label="" className="tl2-action" fallback={awayM.glyph} />
    : <span className="tix-tilt">🎟️</span>;
  const scrollRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const [dragSel, setDragSel] = React.useState(null); // { lane, a, b } while dragging
  const [movePreview, setMovePreview] = React.useState(null); // { id, start, end } while dragging a plan block
  const [resizingId, setResizingId] = React.useState(null); // id of the block whose bottom grip is being dragged — shrinks its min-height so it can resize down to the 5-min floor (mirrors the ME-session fix)
  const [selSeg, setSelSeg] = React.useState(null); // key of the ME session showing its controls
  const [selHobby, setSelHobby] = React.useState(null); // id of the for-me block showing its controls (tap to highlight, like a ME session)
  const [logBlk, setLogBlk] = React.useState(null); // id of the avatar block whose amount/percent logger popover is open
  const [logDraft, setLogDraft] = React.useState(0); // unsaved amount in the open logger — committed only on Save (mirrors the note box)
  const [logCheck, setLogCheck] = React.useState(false); // true when the logger was opened by tapping the ✓ rail (so Save also marks the block done, not just logs a number)
  const [goalPopRef, goalPopUp] = useFlipUp(logBlk);
  const [noteBlk, setNoteBlk] = React.useState(null); // for-me block whose note editor is open
  const [menuBlk, setMenuBlk] = React.useState(null); // for-me block whose ⋯ action menu is open
  const [noteDraft, setNoteDraft] = React.useState('');
  const [noteReadBlk, setNoteReadBlk] = React.useState(null); // for-me block whose read-only note bubble is open
  const [noteFlipRef, noteFlipUp] = useFlipUp(noteBlk); // flip the amount/percent logger above its block when it'd spill off the bottom
  const [noteReadFlipRef, noteReadFlipUp] = useFlipUp(noteReadBlk);
  // Close the goal logger / for-me note when you tap anywhere else (another block's
  // chrome doesn't reach onCanvasDown because it stops propagation). Both popovers and
  // their open-buttons stopPropagation on pointerdown, so this only sees outside taps.
  React.useEffect(() => {
    if (logBlk == null && noteBlk == null && noteReadBlk == null) return;
    const close = () => { setLogBlk(null); setLogCheck(false); setNoteBlk(null); setNoteReadBlk(null); };
    window.addEventListener('pointerdown', close);
    return () => window.removeEventListener('pointerdown', close);
  }, [logBlk, noteBlk, noteReadBlk]);
  // Poking the avatar on a LIVE job block: a wiggle + a personality reaction bubble.
  // Keyed by block id so only the poked block reacts; auto-clears after a beat.
  const [workPoke, setWorkPoke] = React.useState(null); // { id, msg, emoji, n }
  const workPokeRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(workPokeRef.current), []);
  const pokeWork = (blockId, resting) => {
    // While a habit is rested (ticket), the avatar reacts to the BREAK in its voice;
    // otherwise it reacts to being interrupted mid-work.
    const set = resting ? REST_POKE_LINES : WORK_POKE_LINES;
    const pick = pokeLine(set, resting ? 'restpoke' : 'workpoke', behavior);
    setWorkPoke(p => ({ id: blockId, msg: pick.msg, emoji: pick.emoji, n: (p ? p.n : 0) + 1 }));
    clearTimeout(workPokeRef.current);
    workPokeRef.current = setTimeout(() => setWorkPoke(null), 2600);
  };
  const SCALE = 1.4, PAD = 18;
  const free = freeSessions || [];
  const starts = blocks.map(b => b.start);
  const ends = blocks.map(b => b.end);
  let anchors = starts.concat(ends);
  for (const f of free) { anchors.push(f.start, f.end); }
  if (isToday) anchors = anchors.concat(nowMin);
  // Empty day: show a generous window so the page still reads as a calendar
  // (a few hours before "now"/9 AM through the rest of the working day).
  if (!blocks.length && !free.length) {
    const base = isToday ? nowMin : 540;
    anchors.push(Math.max(0, base - 120), Math.min(1440, base + 300));
  }
  // Render the full 24-hour day (12 AM–12 AM) so every time is reachable; the
  // view auto-scrolls to "now" (or the first block) on open so you land in place.
  const lo = 0;
  const hi = 1440;
  const y = (m) => (m - lo) * SCALE + PAD;
  const H = (hi - lo) * SCALE + PAD * 2;
  const hours = [];
  for (let h = lo; h < hi; h += 60) hours.push(h); // 12 AM … 11 PM (skip the 1440 edge)

  React.useEffect(() => {
    if (!scrollRef.current) return;
    const focus = isToday ? nowMin : (starts.length ? Math.min.apply(null, starts) : lo);
    scrollRef.current.scrollTop = Math.max(0, y(focus) - 150);
  }, []);
  // Re-center on "now" (or first block) each time the timeline expands to full screen —
  // the overlay reuses the same scroll container, so without this it keeps the half-height
  // scroll position. Deps are [full] only, so the 10s nowMin tick never yanks the scroll.
  React.useEffect(() => {
    if (!full) return;
    const focus = isToday ? nowMin : (starts.length ? Math.min.apply(null, starts) : lo);
    const apply = () => { if (scrollRef.current) scrollRef.current.scrollTop = Math.max(0, y(focus) - 150); };
    apply();
    // The full-screen overlay applies its FIXED height one render later (the parent
    // measures `fullRect` in a passive effect), so on this tick the container isn't
    // height-constrained yet → setting scrollTop clamps to 0 and we'd stay stuck at
    // 12 AM. Re-apply after that layout commits (rAF) with a timeout safety net so we
    // actually land on "now".
    const r = requestAnimationFrame(apply);
    const t = setTimeout(apply, 120);
    return () => { cancelAnimationFrame(r); clearTimeout(t); };
  }, [full]);

  // Google-Calendar-style drag-to-create: drag on an empty lane to draw a box.
  // Left lane → a ME session, right lane → a JEK plan block (opens the sheet
  // prefilled with the dragged time range). Snaps to 5 min.
  const minFromY = (py) => Math.max(lo, Math.min(hi, Math.round((lo + (py - PAD) / SCALE) / 5) * 5));
  // Drag the bottom grip of a JEK (plan) block to change its end time. Like the body
  // MOVE, this previews live but commits only on release: committing every frame made
  // `avCols` recompute mid-drag, so the instant the block grew to overlap a neighbour
  // they'd reflow into side-by-side columns — looking like the two blocks "swapped".
  // The preview keeps the schedule untouched until pointer-up, so nothing reflows
  // under your finger; the one-time repack on commit then matches a move-drag.
  const startBlockResize = (e, b) => {
    if (!onResizeBlock) return;
    e.preventDefault(); e.stopPropagation();
    setResizingId(b.id); // shrink this block's min-height so it can be dragged down to 5 min
    const canvas = e.currentTarget.closest('.tl-canvas');
    const scroller = scrollRef.current;
    let latestEnd = b.end, lastY = e.clientY, raf = 0;
    // Re-reads the canvas rect each call, so it stays correct as the timeline auto-scrolls.
    const compute = () => {
      if (!canvas) return;
      const r = canvas.getBoundingClientRect();
      latestEnd = Math.max(b.start + 5, Math.min(1440, minFromY(lastY - r.top)));
      setMovePreview({ id: b.id, start: b.start, end: latestEnd }); // live grow, no commit yet
    };
    // Auto-scroll when the grip nears the top/bottom edge, so a block can be stretched to an
    // off-screen end time in one drag (mirrors startBlockMove's edge-scroll).
    const EDGE = 52, MAXV = 16;
    const loop = () => {
      if (scroller) {
        const r = scroller.getBoundingClientRect();
        let dv = 0;
        if (lastY < r.top + EDGE) dv = -Math.ceil(((r.top + EDGE - lastY) / EDGE) * MAXV);
        else if (lastY > r.bottom - EDGE) dv = Math.ceil(((lastY - (r.bottom - EDGE)) / EDGE) * MAXV);
        if (dv) {
          const max = scroller.scrollHeight - scroller.clientHeight;
          scroller.scrollTop = Math.max(0, Math.min(max, scroller.scrollTop + dv));
          compute(); // recompute ONLY when auto-scroll moved the canvas; pointermove handles the rest
        }
      }
      raf = window.requestAnimationFrame(loop);
    };
    const move = (ev) => { lastY = ev.clientY; compute(); };
    const up = () => {
      setResizingId(null); setMovePreview(null);
      if (raf) window.cancelAnimationFrame(raf);
      if (latestEnd !== b.end) onResizeBlock(b.id, latestEnd);
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up); // touch: clean up if the browser cancels the gesture
    raf = window.requestAnimationFrame(loop); // run continuously so edge-scroll works even if the finger holds still
  };
  // Pointer-drag the body of a JEK (plan) block to MOVE it in time (preserves
  // duration, snaps 5 min, live preview) — same feel as a ME session box. A plain
  // tap (no drag) opens the editor instead.
  const startBlockMove = (e, b, hobby) => {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const canvas = e.currentTarget.closest('.tl-canvas');
    const scroller = scrollRef.current;
    const dur = b.end - b.start;
    // Pointer position in MINUTES over the canvas — re-reads the canvas rect each
    // call, so it stays correct even as the timeline auto-scrolls under the finger.
    const pmFromY = (clientY) => lo + (((clientY - canvas.getBoundingClientRect().top) - PAD) / SCALE);
    const grab = b.start - pmFromY(e.clientY); // keep the spot on the box you grabbed
    const y0 = e.clientY;
    let latest = { start: b.start, end: b.end }, moved = false, lastY = e.clientY, raf = 0;
    const compute = () => {
      let st = Math.round((pmFromY(lastY) + grab) / 5) * 5; // snap 5 min
      if (st < 0) st = 0; if (st + dur > 1440) st = 1440 - dur;
      latest = { start: st, end: st + dur };
      if (!moved) return; // a plain tap shouldn't flash the .dragging preview for a frame
      setMovePreview({ id: b.id, start: latest.start, end: latest.end });
    };
    // Auto-scroll the timeline when the drag nears the top/bottom edge, so a box can
    // be carried to a time that's currently off-screen. Speed ramps up toward the edge.
    const EDGE = 52, MAXV = 16;
    const loop = () => {
      if (scroller) {
        const r = scroller.getBoundingClientRect();
        let dv = 0;
        if (lastY < r.top + EDGE) dv = -Math.ceil(((r.top + EDGE - lastY) / EDGE) * MAXV);
        else if (lastY > r.bottom - EDGE) dv = Math.ceil(((lastY - (r.bottom - EDGE)) / EDGE) * MAXV);
        if (dv) {
          const max = scroller.scrollHeight - scroller.clientHeight;
          scroller.scrollTop = Math.max(0, Math.min(max, scroller.scrollTop + dv));
          compute(); // recompute ONLY when auto-scroll moved the canvas; pointermove handles the rest
                     // (calling compute() every frame setState-stormed the timeline → iPad jank).
        }
      }
      raf = window.requestAnimationFrame(loop);
    };
    const move = (ev) => {
      if (Math.abs(ev.clientY - y0) > 4) moved = true;
      lastY = ev.clientY;
      compute();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (raf) window.cancelAnimationFrame(raf);
      setMovePreview(null);
      // For-me blocks: a plain tap toggles selection (highlight + reveal the
      // comment/split/× buttons), mirroring a ME session. Task blocks open the editor.
      if (!moved) { if (hobby) { setSelHobby(prev => prev === b.id ? null : b.id); } else { onEdit(b); } return; }
      if (onMoveBlock) onMoveBlock(b.id, latest.start, latest.end);
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up); // touch: stop the rAF loop + clear preview if the gesture is cancelled
    raf = window.requestAnimationFrame(loop); // run continuously so edge-scroll works even if the finger holds still
  };
  const onCanvasDown = (e) => {
    if (e.target.closest('.tl2, button, input, .tl-dragsel')) return; // not on an existing item
    // A tap that merely DISMISSES an open selection/popover must not also quick-create a block.
    const wasOpen = !!(selSeg || selHobby || noteBlk || menuBlk || logBlk);
    setSelSeg(null); // tapping empty canvas deselects any open session
    setSelHobby(null); setNoteBlk(null); setMenuBlk(null); // ...deselects any for-me block + closes its comment/menu
    setLogBlk(null); // ...and closes any open goal-logger popover
    if (!onDragCreate) return;
    if (e.button != null && e.button !== 0) return;
    const canvas = e.currentTarget;
    const r = canvas.getBoundingClientRect();
    if (e.clientX - r.left < 46) return; // hour gutter
    const lane = (e.clientX - r.left) < r.width / 2 ? 'me' : 'av';
    const startMin = minFromY(e.clientY - r.top);
    const touch = e.pointerType === 'touch';
    // Touch: the canvas sits inside a vertical scroller, so we can't blanket touch-action:none.
    // Instead require a short hold before drag-create arms — a finger-swipe before the hold
    // fires is a scroll, not a draw. Mouse/pen arm immediately on the 6px threshold (below).
    const d0 = { lane, startMin, cur: startMin, active: false, armed: !touch, canvas, holdT: null, wasOpen, scrolled: false };
    dragRef.current = d0;
    const move = (ev) => {
      const d = dragRef.current; if (!d) return;
      const cm = minFromY(ev.clientY - d.canvas.getBoundingClientRect().top);
      if (!d.armed) {
        // Held finger hasn't armed yet: a vertical move means the user is scrolling — bail
        // and let the native scroll run. (clear our listeners so we don't fight it.)
        if (Math.abs((cm - d.startMin) * SCALE) > 8) { d.scrolled = true; clearTimeout(d.holdT); up(); }
        d.cur = cm; return;
      }
      if (!d.active && Math.abs((cm - d.startMin) * SCALE) < 6) { d.cur = cm; return; }
      d.active = true; d.cur = cm; ev.preventDefault();
      setDragSel({ lane: d.lane, a: d.startMin, b: cm });
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      const d = dragRef.current; if (d) clearTimeout(d.holdT);
      dragRef.current = null; setDragSel(null);
      if (d && d.active) {
        const a = Math.min(d.startMin, d.cur), b = Math.max(d.startMin, d.cur);
        if (b - a >= 10) onDragCreate(d.lane, a, b);
      } else if (d && !d.wasOpen && !d.scrolled) {
        // Plain tap on empty canvas → quick-create a PLAN at that hour (either lane → plan; a
        // diary session still uses the ME-lane ＋). BlockSheet opens prefilled with this time.
        const s = Math.max(0, Math.min(1380, Math.round(d.startMin / 5) * 5));
        onDragCreate('av', s, Math.min(1440, s + 60));
      }
    };
    if (touch) d0.holdT = setTimeout(() => { if (dragRef.current === d0) { d0.armed = true; if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} } } }, 220);
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up); // touch: browser may cancel (e.g. scroll hand-off) instead of pointerup
  };

  // ---- ME lane assembly ----
  // Flatten every logged session — block "done" segments + free sessions — into one
  // list, then MERGE same-activity sessions that overlap into a single group. Two
  // overlapping "Exercise" blocks both ticked done used to shatter into cramped
  // side-by-side columns; now they collapse to one continuous pill over their union.
  const taskFallback = (a) => a ? (TASK_EMOJI_CHAR[a.emoji] || glyphFromCode(a.emoji) || '💪') : '✓';
  const meItems = [];
  for (const b of blocks) {
    const a = findActivity(activities, b.activityId);
    if (a && a.type === 'hobby') continue; // hobby shows in its own block, not the ME lane
    const nm = a ? a.name : tr('fallback.deleted');
    getSegs(b).forEach((seg, i) => {
      meItems.push({
        key: b.id + ':' + i, block: b, idx: i, free: false, actId: b.activityId,
        name: nm, emoji: a && a.emoji, emoji2: a && a.emoji2, emojiFallback: taskFallback(a),
        seg, start: seg.start, end: seg.end,
        onChange: (ns) => { const arr = getSegs(b).map(s => ({ ...s })); arr[i] = ns; onSetSegs(b.id, arr); },
        onSplit: () => { const segs = getSegs(b); const s = segs[i]; const mid = Math.round((s.start + s.end) / 2); if (mid - s.start < 5 || s.end - mid < 5) return; const arr = segs.map(x => ({ ...x })); arr.splice(i, 1, { start: s.start, end: mid }, { start: mid, end: s.end }); onSetSegs(b.id, arr); },
        onRemove: () => onSetSegs(b.id, getSegs(b).filter((_, j) => j !== i)),
        onEdit: (a && onEditActivity) ? () => onEditActivity(b.activityId) : null, // ✎ opens the activity editor (mirrors free sessions)
        note: (onSetNote && i === 0) ? (getNote ? getNote(b) : '') : null,
        onNote: (onSetNote && i === 0) ? ((txt) => onSetNote(b, txt)) : null,
      });
    });
  }
  for (const f of free) {
    const a = findActivity(activities, f.activityId);
    meItems.push({
      key: 'f:' + f.id, free: true, fid: f.id, actId: f.activityId,
      hobby: !!(a && a.type === 'hobby'), // a logged session of a "for me" activity → blue, not amber
      name: a ? a.name : tr('fallback.session'), emoji: a && a.emoji, emoji2: a && a.emoji2, emojiFallback: taskFallback(a),
      seg: f, start: f.start, end: f.end,
      onChange: (ns) => onSetFree(f.id, ns), onSplit: () => onSplitFree(f.id), onRemove: () => onRemoveFree(f.id),
      onEdit: (a && onEditActivity) ? () => onEditActivity(f.activityId) : null, // ✎ opens the activity editor
      note: f.note || '', onNote: (txt) => onSetFreeNote(f.id, txt),
    });
  }
  // No merging: every session is its OWN group, so overlapping same-activity
  // sessions render as separate side-by-side boxes (meCols lays them out in
  // columns) rather than collapsing into one merged pill — the user prefers the
  // separate look. (MeMergedSeg is kept defined but no longer reached.)
  const meGroups = [];
  for (const it of meItems.slice().sort((x, z) => x.start - z.start || x.end - z.end)) {
    meGroups.push({ actId: it.actId, start: it.start, end: it.end, members: [it] });
  }
  // Column-pack the left lane: ME session GROUPS *and* "just for me" hobby blocks both
  // live here, so an overlap between them (or among them) lays out in side-by-side
  // columns instead of one box hiding behind the other (dragging a for-me box over your
  // logged sessions used to make it vanish). Packs by RENDERED pixel span (top → top +
  // max(26, dur)). Returns { me: {[groupIndex]}, hobby: {[blockId]} }.
  const hobbyBlocks = blocks.filter(b => { const a = findActivity(activities, b.activityId); return a && a.type === 'hobby'; });
  const meCols = (() => {
    const span = (s, e) => { const top = y(s); return { top, bot: top + Math.max(26, (e - s) * SCALE) }; };
    const items = meGroups.map((g, gi) => ({ kind: 'me', gi, ...span(g.start, g.end) }))
      .concat(hobbyBlocks.map(b => ({ kind: 'hobby', id: b.id, ...span(b.start, b.end) })));
    items.sort((a, b) => a.top - b.top || a.bot - b.bot);
    const me = {}, hobby = {}; let cluster = [], ends = [];
    const flush = () => { for (const it of cluster) { const rec = { col: it.col, cols: ends.length }; if (it.kind === 'me') me[it.gi] = rec; else hobby[it.id] = rec; } cluster = []; ends = []; };
    for (const it of items) {
      if (ends.length && it.top >= Math.max.apply(null, ends)) flush(); // pixel gap → new cluster
      let col = ends.findIndex(e => e <= it.top);
      if (col === -1) { col = ends.length; ends.push(it.bot); } else ends[col] = it.bot;
      it.col = col; cluster.push(it);
    }
    flush();
    return { me, hobby };
  })();

  // Same column-packing for the AVATAR lane (right): overlapping plan/task blocks lay
  // out side-by-side instead of stacking on top of each other (Exercise + Reading at the
  // same time used to bury one behind the other). Keyed by block id. Hobby blocks live in
  // the LEFT lane and are packed by meCols above, so they're excluded here.
  const avBlocks = blocks.filter(b => { const a = findActivity(activities, b.activityId); return !(a && a.type === 'hobby'); });
  const avCols = (() => {
    const span = (s, e) => { const top = y(s); return { top, bot: top + Math.max(34, (e - s) * SCALE) }; };
    const items = avBlocks.map(b => ({ id: b.id, ...span(b.start, b.end) }));
    items.sort((a, b) => a.top - b.top || a.bot - b.bot);
    const out = {}; let cluster = [], ends = [];
    const flush = () => { for (const it of cluster) out[it.id] = { col: it.col, cols: ends.length }; cluster = []; ends = []; };
    for (const it of items) {
      if (ends.length && it.top >= Math.max.apply(null, ends)) flush(); // pixel gap → new cluster
      let col = ends.findIndex(e => e <= it.top);
      if (col === -1) { col = ends.length; ends.push(it.bot); } else ends[col] = it.bot;
      it.col = col; cluster.push(it);
    }
    flush();
    return out;
  })();

  // "Lively" free-time fillers: the avatar's little hobbies between scheduled blocks.
  // Each potential window (≈ every 2.5h, 8 AM → ~10 PM) is computed independently from
  // (daySeed, window index) so the day stays STABLE — resizing a real block only drops
  // the windows it now covers, never re-rolls the rest. But inside each window the START
  // is jittered off the hour, the LENGTH comes from the hobby's own realistic range, and
  // ~1 in 4 windows is just downtime — so the pacing reads like a real person's day, not
  // a clockwork 50-min-every-2h lattice. Decorative only: never raced/scored/draggable.
  const fillers = lively ? livelyFillers(behavior, blocks, activities, daySeed) : [];

  return (
    <div className="tl-scroll" ref={scrollRef}>
      <div className="tl2-caps">
        <span className="tl2-cap me">{tr('race.me')} <button className="tl2-cap-add" onClick={onAddFree} aria-label={tr('tl.logSession')}>＋</button></span>
        <span className="tl2-cap av">{avatarName}</span>
        {/* Single ⤢ toggle on the caps row: expands to full page, and (when already full)
            collapses back — the expanded view has no other chrome, so this is the only exit. */}
        {onExpand && (
          <button className="tl2-cap-expand" onClick={onExpand} aria-label={full ? tr('common.close') : tr('sched.fullPage')} title={full ? tr('common.close') : tr('sched.fullPage')}>
            {full ? (
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <polyline points="4 14 10 14 10 20" />
                <polyline points="20 10 14 10 14 4" />
                <line x1="14" y1="10" x2="21" y2="3" />
                <line x1="3" y1="21" x2="10" y2="14" />
              </svg>
            ) : (
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <polyline points="15 3 21 3 21 9" />
                <polyline points="9 21 3 21 3 15" />
                <line x1="21" y1="3" x2="14" y2="10" />
                <line x1="3" y1="21" x2="10" y2="14" />
              </svg>
            )}
          </button>
        )}
      </div>
      <div className="tl2-legend">
        <span className="tl2-legend-item"><span className="tl2-legend-block solid" />{tr('tl.legend.plan')}</span>
        <span className="tl2-legend-item"><span className="tl2-legend-block dashed" />{tr('tl.legend.logged')}</span>
      </div>
      <div className="tl-canvas" style={{ height: H }} onPointerDown={onCanvasDown}>
        {/* Time-of-day bands: soft tinted zones behind everything (pointer-events:none so
            tap-to-create still reaches the canvas). A small tag at each band's top names it. */}
        {sortedBands(bands).map(bd => {
          const bTop = Math.max(lo, bd.start), bBot = Math.min(hi, bd.end);
          const bh = (bBot - bTop) * SCALE;
          if (bh <= 0) return null;
          return (
            <div key={bd.id} className="tl-band" style={{ top: y(bTop), height: bh, '--band': bd.color, '--band-rgb': hexToRgb(bd.color) }}>
              <span className="tl-band-emoji" title={bandLabel(bd)} aria-label={bandLabel(bd)}><ActionEmoji code={bandEmojiCode(bd.emoji)} size={16} fallback={bd.emoji} label={bandLabel(bd)} /></span>
              <span className="tl-band-name">{bandLabel(bd)}</span>
            </div>
          );
        })}
        {hours.map(h => (
          <React.Fragment key={h}>
            <div className="tl-hline" style={{ top: y(h) }} />
            {h + 30 < hi && <div className="tl-hline half" style={{ top: y(h + 30) }} />}
            <div className="tl-hlabel" style={{ top: y(h) }}>{fmtHourLabel(h)}</div>
          </React.Fragment>
        ))}
        <div className="tl2-divider" />
        {/* Empty day → teach the (otherwise invisible) tap-to-create gesture. pointer-events:none
            so the tap still reaches the canvas and creates a block. */}
        {blocks.length === 0 && (!freeSessions || freeSessions.length === 0) && (
          <div className="tl-empty-hint">{tr('sched.tapToAdd')}</div>
        )}
        {fillers.map(f => {
          const top = y(f.start);
          const fh = Math.max(30, (f.end - f.start) * SCALE);
          const liveF = isToday && nowMin >= f.start && nowMin < f.end;
          const pastF = isToday && nowMin >= f.end;
          // Fade a filler that hasn't started yet, exactly like an upcoming task/for-me
          // block — it isn't the avatar's time for that hobby yet. (Mirrors `started` above.)
          const startedF = nowMin >= f.start;
          return (
            <div key={f.id} className={'tl2 av lively' + (liveF ? ' live' : '') + (pastF ? ' past' : '') + (startedF ? '' : ' upcoming')} style={{ top, height: fh }}>
              <div className="tl2-body">
                <div className="tl2-main lively-main">
                  <span className="tl2-fill-dot" />
                  <span className="tl2-face">
                    <ActionEmoji code={f.code} size={20} label={f.name} className="tl2-action" fallback={f.glyph} />
                  </span>
                  <span className="tl2-info">
                    <span className="tl2-name">{f.name}</span>
                    <span className="tl2-time">{fmtClock(f.start)}–{fmtClock(f.end)} · {tr('tl.freeTime')}</span>
                  </span>
                </div>
              </div>
            </div>
          );
        })}
        {blocks.map(b => {
          const a = findActivity(activities, b.activityId);
          const isHobby = !!(a && a.type === 'hobby'); // yours, but never raced/scored
          const mv = (movePreview && movePreview.id === b.id) ? movePreview : null;
          // Share the left lane in side-by-side columns when this for-me block overlaps
          // ME sessions / other hobby blocks, so it can't hide behind them. Full width
          // while selected (room for its buttons) or being dragged (it floats on top).
          const hc = isHobby ? (meCols.hobby[b.id] || { col: 0, cols: 1 }) : null;
          const hobbyColStyle = (hc && hc.cols > 1 && !mv && selHobby !== b.id)
            ? { left: 'calc(46px + (49% - 46px) * ' + hc.col + ' / ' + hc.cols + ')', width: 'calc((49% - 46px) / ' + hc.cols + ' - 2px)', right: 'auto' }
            : null;
          // Avatar TASK blocks share the RIGHT lane (50% → right:6px) in side-by-side
          // columns when they overlap, so two plan blocks at the same time sit next to
          // each other instead of one hiding behind the other. Full width while dragged.
          const ac = !isHobby ? (avCols[b.id] || { col: 0, cols: 1 }) : null;
          const avColStyle = (ac && ac.cols > 1 && !mv)
            ? { left: 'calc(50% + (50% - 6px) * ' + ac.col + ' / ' + ac.cols + ')', width: 'calc((50% - 6px) / ' + ac.cols + ' - 2px)', right: 'auto' }
            : null;
          const bStart = mv ? mv.start : b.start;
          const bEnd = mv ? mv.end : b.end;
          const top = y(bStart);
          const dur = Math.max(0, bEnd - bStart);
          // Work amount is a per-SESSION goal: you log what you did this block and
          // the meta shows this session's progress toward the goal.
          // Percent-mode tasks are scored 0–100% per session — reuse the amount
          // logger with a fixed goal of 100 and a '%' unit.
          const isPct = !!(a && a.goalMode === 'percent');
          const sessGoal = isPct ? 100 : actAmtTarget(a, weekday);
          const unit = isPct ? '%' : (a && a.unit ? a.unit : '');
          // Per-date label (Day view) wins; otherwise the per-weekday sub-task name.
          const sub = (getSub ? getSub(b) : '')
            || (b.labels && b.labels[weekday])
            || (a && a.dayLabels && (a.dayLabels[b.start + '_' + weekday] || a.dayLabels[weekday])) || '';
          // While its grip is being dragged, drop the min-height to a small floor so the
          // block visibly shrinks all the way down to the 5-min minimum (otherwise the
          // 34px floor pins short blocks and the resize feels stuck) — mirrors MeSeg.
          const h = (resizingId === b.id) ? Math.max(12, dur * SCALE) : Math.max(34 + (sub ? 13 : 0), dur * SCALE);
          const started = nowMin >= b.start;
          const ended = nowMin >= b.end;
          const logged = getAmount ? getAmount(b) : 0;
          const sessPct = sessGoal ? Math.min(100, Math.round((logged / sessGoal) * 100)) : 0;
          const step = sessGoal <= 20 ? 1 : sessGoal <= 100 ? 5 : 10;
          const segs = getSegs(b);
          const done = segs.length > 0;
          // Rest ticket spent on this habit (or the whole day): the avatar takes the
          // break too — it stops "running" this block, so no race/log, just resting.
          const excused = isExcused ? isExcused(b.id) : false;
          // SOFT AWAY: on a whole-day rest the block is NOT hard-locked — you can still tick it
          // (it then counts as bonus progress). The avatar rests, so it's off the race (no
          // "JEK done you didn't"), but the box stays tappable.
          const softAway = !!softAwayDay && !excused;
          // A ticket spent on THIS task specifically (not a whole-day rest) can be
          // cancelled by tapping its 🎟️ box; a whole-day rest stays locked here.
          const blockExcused = isBlockExcused ? isBlockExcused(b.id) : false;
          const canUnrest = blockExcused && !!onUnrest;
          const live = isToday && started && !ended && !excused;
          // A rested block isn't "racing", but it's still happening NOW — give it the
          // same time-is-now outline glow (in its rest green) as a live block.
          const restLive = isToday && started && !ended && excused;
          // The avatar is pokeable while it's mid-job (live) OR while it's resting this
          // habit on a ticket — tapping it gets a fresh personality reaction either way.
          const canPoke = (live || excused) && !mv;
          const wpoke = (workPoke && workPoke.id === b.id) ? workPoke : null;
          // Deterministic per-personality "resting with you" line for the rested note
          // (stable per block so it doesn't reshuffle every render; poking gives random ones).
          const restLine = pokeLine(REST_POKE_LINES, 'restpoke', behavior, Math.abs((b.id || '').split('').reduce((s, c) => s + c.charCodeAt(0), 0)));
          const name = a ? a.name : tr('fallback.deleted');
          // Your committed self runs the plan perfectly: once a block has ENDED (today,
          // or any past day where effMin=1440), JEK has finished it. If YOU haven't checked
          // it off, the box shows a muted "JEK done — you didn't" marker, distinct from the
          // solid-lime "I did it" rail. (Excused/rested blocks are off the race entirely.)
          const jekDone = ended && !done && !excused && !softAway; // avatar rests on a soft-away day — never "JEK done"
          return (
            <React.Fragment key={b.id}>
              {/* ME sessions (left lane) are rendered together in one merged pass AFTER
                  the blocks loop (see meGroups below), so same-activity sessions that
                  overlap across different blocks collapse into a single pill. */}
              {/* AVATAR lane (right): the plan it runs */}
              <div className={'tl2 av' + (started ? ' active' : ' upcoming') + (live ? ' live' : '') + (restLive ? ' rest-now' : '') + (done ? ' done' : '') + (mv ? ' dragging' : '') + (excused ? ' rested' : '') + (softAway ? ' soft-away' : '') + (wpoke ? ' poking' : '') + (logBlk === b.id ? ' logopen' : '') + (noteBlk === b.id ? ' noting' : '') + (isHobby ? ' hobby' : '') + (isHobby && selHobby === b.id && !delMode ? ' sel' : '') + (isHobby && hc && hc.cols > 1 && selHobby !== b.id ? ' narrow' : '') + (delMode ? ' delmode' : '')}
                data-block-id={b.id} data-restable={(!excused && !isHobby) ? '1' : undefined}
                style={{ top, height: h, ...hobbyColStyle, ...avColStyle }}>
                {/* Edit (delete) mode: a ✕ on every task removes it from THIS day (per-date), with a confirm. */}
                {delMode && onDeleteBlock && (
                  <button className="tl2-del act-card-del" aria-label={tr('a11y.remove')}
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={(e) => { e.stopPropagation(); if (confirm(tr('sched.confirmDeleteDay', { name }))) onDeleteBlock(b); }}>✕</button>
                )}
                {!excused && sessGoal > 0 && (
                  <button className={'tl2-goal-btn' + (sessPct >= 100 ? ' hit' : '')}
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={(e) => { e.stopPropagation(); if (logBlk === b.id) { setLogBlk(null); } else { setLogDraft(logged); setLogCheck(false); setLogBlk(b.id); } }}
                    aria-label={tr('a11y.logProgress', { name })}>{isPct ? sessPct + '%' : logged + '/' + sessGoal + (unit ? ' ' + unit : '')}</button>
                )}
                {/* Done-toggle — a full-height check RAIL on the left of a TASK block.
                    Empty rail when unchecked; fills solid lime with a ✓ when done (or shows
                    🎟️ when rested). "Just for me" hobby blocks keep the small decorative dot
                    inside the body instead (rendered below). */}
                {!isHobby && (
                  <button className={'tl2-box' + (canUnrest ? ' unrestable' : '') + (jekDone ? ' jekdone' : '')}
                    disabled={!excused && !started}
                    aria-label={canUnrest ? 'Cancel rest ticket for ' + name : excused ? name + ' is on a rest ticket' : done ? 'Uncheck ' + name : jekDone ? (avatarName || 'JEK') + ' finished ' + name + ' — tap if you did it too' : 'Mark done ' + name}
                    title={jekDone ? (avatarName || 'JEK') + ' finished this — you haven’t marked it' : undefined}
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={(e) => {
                      e.stopPropagation();
                      if (canUnrest) { onUnrest(b); return; }
                      if (!started || excused) return;
                      // Goal block: checking ✓ marks it done AND fills the amount/percent
                      // to MAX (0/8 → 8/8, or 100%) in one tap — no need to type the number
                      // first. Unchecking clears it back to 0. (The badge still opens the
                      // logger for logging a partial number.)
                      if (sessGoal > 0) onSetAmount(b, done ? 0 : sessGoal);
                      onToggle(b);
                    }}>
                    {excused
                      ? restGlyph
                      : done
                        ? '✓'
                        : softAway
                          ? restGlyph
                          : <span className="tl2-box-mark" />}
                  </button>
                )}
                <div className="tl2-body">
                  <button className="tl2-main" onPointerDown={(e) => startBlockMove(e, b, isHobby)} aria-label={isHobby ? 'Select or move ' + name : 'Move or edit ' + name}>
                    {/* Hobby "just for me" block: only show a leading marker when rested
                        (the 🎟️ ticket). No plain decorative dot otherwise. */}
                    {isHobby && excused && (
                      <span className="tl2-dot rested">{restGlyph}</span>
                    )}
                    <span className={'tl2-face' + (canPoke ? ' pokeable' : '') + (wpoke ? ' poking' : '')}
                      role={canPoke ? 'button' : undefined} tabIndex={canPoke ? 0 : undefined}
                      aria-label={canPoke ? 'Poke ' + (avatarName || 'JEK') : undefined}
                      onPointerDown={canPoke ? (e) => e.stopPropagation() : undefined}
                      onClick={canPoke ? (e) => { e.stopPropagation(); pokeWork(b.id, excused); } : undefined}>
                      {excused
                        // Rested task: the avatar is napping it off — swap the task's
                        // animation for an animated 💤 (zzz) instead of stacking a badge.
                        ? <ActionEmoji code="1f4a4" size={20} label={name + ' is resting'} className="tl2-action" fallback="💤" />
                        : a && a.emoji
                          ? <TaskEmoji act={a} size={20} label={name} className="tl2-action" />
                          : renderFace(avatarEmoji, 18)}
                    </span>
                    {wpoke && (
                      <span className="tl2-poke-bubble" key={wpoke.n}>
                        <ActionEmoji code={wpoke.emoji} size={18} label="reaction" className="tl2-poke-emoji" fallback={glyphFromCode(wpoke.emoji)} />
                        <span className="tl2-poke-msg">{wpoke.msg}</span>
                      </span>
                    )}
                    <span className="tl2-info">
                      <span className="tl2-name">{name}{getNote && getNote(b) ? <span className="meseg-note-flag" title={getNote(b)} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setNoteBlk(null); setNoteReadBlk(rb => rb === b.id ? null : b.id); }}><CommentIcon size={9} /></span> : null}{sub ? <span className="tl2-sub"> · {sub}</span> : null}</span>
                      {excused
                        ? <React.Fragment>
                            <span className="tl2-time">{fmtClock(bStart)}–{fmtClock(bEnd)} · {fmtDur(dur)}</span>
                            <span className="tl2-time tl2-rest-note">{restLine.msg}</span>
                          </React.Fragment>
                        : <span className="tl2-time">{fmtClock(bStart)}–{fmtClock(bEnd)} · {fmtDur(dur)}{sessGoal ? ' · 🎯 ' + (isPct ? '100%' : sessGoal + (unit ? ' ' + unit : '')) : ''}</span>}
                    </span>
                  </button>
                </div>
                {!excused && sessGoal > 0 && logBlk === b.id && (() => {
                  // Draft pct mirrors the live one but reads from the unsaved draft, so
                  // the meta updates as you tweak — yet nothing commits until you Save.
                  const draftPct = sessGoal ? Math.min(100, Math.round((logDraft / sessGoal) * 100)) : 0;
                  return (
                  <div className={'tl2-goal-pop' + (goalPopUp ? ' up' : '')} ref={goalPopRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
                    <div className="tl2-goal-pop-head">{isPct ? tr('tl.howDone') : tr('tl.thisSession', { goal: sessGoal + (unit ? ' ' + unit : '') })}</div>
                    <div className="tl2-amount">
                      <button className="tl2-amt-btn" disabled={!started || logDraft <= 0}
                        onClick={() => setLogDraft(Math.max(0, logDraft - step))} aria-label={tr('as.less')}>−</button>
                      <input className="tl2-amt-input" type="number" inputMode="numeric" min="0" max={isPct ? 100 : undefined} disabled={!started}
                        value={logDraft} onChange={(e) => { let n = parseInt(e.target.value, 10) || 0; if (isPct) n = Math.min(100, n); setLogDraft(Math.max(0, n)); }}
                        onKeyDown={(e) => { if (e.key === 'Enter' && started && !(logCheck && logDraft <= 0)) { e.preventDefault(); onSetAmount(b, logDraft); if (((logCheck && logDraft > 0) || draftPct >= 100) && !done && !excused) onToggle(b); setLogBlk(null); setLogCheck(false); } }} />
                      <button className="tl2-amt-btn" disabled={!started || (isPct && logDraft >= 100)}
                        onClick={() => setLogDraft(isPct ? Math.min(100, logDraft + step) : logDraft + step)} aria-label={tr('as.more')}>＋</button>
                      <span className={'tl2-amt-meta' + (draftPct >= 100 ? ' hit' : '')}>
                        {isPct ? logDraft + '%' : logDraft + '/' + sessGoal + (unit ? ' ' + unit : '')}
                        {draftPct >= 100 ? ' ✓' : ''}
                      </span>
                    </div>
                    <div className="tl2-goal-actions">
                      <button className="tl2-goal-cancel" onClick={() => { setLogBlk(null); setLogCheck(false); }}>{tr('common.cancel')}</button>
                      <button className="tl2-goal-save" disabled={!started || (logCheck && logDraft <= 0)} onClick={() => { onSetAmount(b, logDraft); if (((logCheck && logDraft > 0) || draftPct >= 100) && !done && !excused) onToggle(b); setLogBlk(null); setLogCheck(false); }}>{logCheck ? tr('tl.saveDone') : tr('common.save')}</button>
                    </div>
                  </div>
                  );
                })()}
                {isHobby && selHobby === b.id && !delMode && onSetNote && (
                  <button type="button" className={'blk-quick-note' + (getNote && getNote(b) ? ' has' : '')} aria-label={tr('a11y.comment')} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setMenuBlk(null); setNoteReadBlk(null); setNoteDraft(getNote ? getNote(b) : ''); setNoteBlk(b.id); }}><CommentIcon size={12} /></button>
                )}
                {isHobby && selHobby === b.id && !delMode && (
                  <button className="blk-more" aria-label={tr('a11y.more')} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); setMenuBlk(menuBlk === b.id ? null : b.id); }}>⋯</button>
                )}
                {isHobby && selHobby === b.id && !delMode && menuBlk === b.id && (
                  <div className="blk-menu" onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
                    <button className="blk-menu-item" onClick={() => { setMenuBlk(null); onEdit(b); }}><span className="blk-menu-ico">✎</span>{tr('a11y.edit')}</button>
                    <button className="blk-menu-item" onClick={() => { setMenuBlk(null); if (noteBlk === b.id) { setNoteBlk(null); } else { setNoteDraft(getNote ? getNote(b) : ''); setNoteBlk(b.id); } }}><span className="blk-menu-ico"><CommentIcon size={13} /></span>{tr('a11y.comment')}</button>
                    <button className="blk-menu-item" onClick={() => { setMenuBlk(null); if (onSplitBlock) onSplitBlock(b); }}><span className="blk-menu-ico">⤲</span>{tr('a11y.split')}</button>
                    <button className="blk-menu-item danger" onClick={() => { setMenuBlk(null); if (onDeleteBlock) onDeleteBlock(b); }}><span className="blk-menu-ico">×</span>{tr('a11y.remove')}</button>
                  </div>
                )}
                {isHobby && noteBlk === b.id && (
                  <div className={'meseg-note-pop' + (noteFlipUp ? ' up' : '')} ref={noteFlipRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
                    <textarea className="meseg-note-area" autoFocus rows={3} maxLength={500} placeholder={tr('note.forName', { name })} value={noteDraft} onChange={(e) => setNoteDraft(e.target.value)} />
                    <div className="meseg-note-actions">
                      <button className="meseg-note-cancel" onClick={() => setNoteBlk(null)}>{tr('common.cancel')}</button>
                      <button className="meseg-note-save" onClick={() => { if (onSetNote) onSetNote(b, noteDraft); setNoteBlk(null); }}>{tr('common.save')}</button>
                    </div>
                  </div>
                )}
                {isHobby && noteReadBlk === b.id && noteBlk !== b.id && getNote && getNote(b) && (
                  <div className={'meseg-note-pop read' + (noteReadFlipUp ? ' up' : '')} ref={noteReadFlipRef} onPointerDown={(e) => e.stopPropagation()} onClick={(e) => e.stopPropagation()}>
                    <div className="meseg-note-text">{getNote(b)}</div>
                    <button type="button" className="meseg-note-edit" onClick={() => { setNoteReadBlk(null); setNoteDraft(getNote(b)); setNoteBlk(b.id); }} aria-label={tr('a11y.edit')}>✎</button>
                  </div>
                )}
                <div className="tl2-resize" onPointerDown={(e) => startBlockResize(e, b)} aria-label={tr('a11y.resize')} />
              </div>
            </React.Fragment>
          );
        })}
        {/* ME lane (left): every logged session — block "done" segments AND free
            sessions — rendered from the merged groups. A lone session is a normal
            editable MeSeg; a cluster of overlapping same-activity sessions collapses
            into one MeMergedSeg spanning their union. */}
        {meGroups.map((g, gi) => {
          const c = meCols.me[gi] || { col: 0, cols: 1 };
          if (g.members.length === 1) {
            const it = g.members[0];
            return (
              <MeSeg key={it.key} seg={it.seg} name={it.name} y={y} scale={SCALE} free={it.free} hobby={it.hobby} col={c.col} cols={c.cols}
                emoji={it.emoji} emoji2={it.emoji2} emojiFallback={it.emojiFallback}
                onChange={it.onChange} onSplit={it.onSplit} onRemove={it.onRemove} onEdit={it.onEdit}
                note={it.note} onNote={it.onNote}
                selected={selSeg === it.key} onSelect={() => setSelSeg(selSeg === it.key ? null : it.key)} />
            );
          }
          const gkey = 'm:' + g.members[0].key;
          const removeAll = () => {
            const byBlock = new Map(); const freeIds = [];
            for (const m of g.members) {
              if (m.free) freeIds.push(m.fid);
              else { if (!byBlock.has(m.block)) byBlock.set(m.block, new Set()); byBlock.get(m.block).add(m.idx); }
            }
            byBlock.forEach((idxs, b) => onSetSegs(b.id, getSegs(b).filter((_, j) => !idxs.has(j))));
            freeIds.forEach((id) => onRemoveFree(id));
            setSelSeg(null);
          };
          return (
            <MeMergedSeg key={gkey} start={g.start} end={g.end} name={g.members[0].name}
              emoji={g.members[0].emoji} emoji2={g.members[0].emoji2} emojiFallback={g.members[0].emojiFallback}
              y={y} scale={SCALE} col={c.col} cols={c.cols} count={g.members.length}
              selected={selSeg === gkey} onSelect={() => setSelSeg(selSeg === gkey ? null : gkey)}
              onRemoveAll={removeAll} />
          );
        })}
        {isToday && (
          <React.Fragment>
            <div className="tl-now-time" style={{ top: y(nowMin) }}>{fmtClock(nowMin)}</div>
            <div className="tl2-now" style={{ top: y(nowMin) }}><span className="tl2-now-dot" /></div>
          </React.Fragment>
        )}
        {dragSel && (
          <div className={'tl-dragsel ' + dragSel.lane}
            style={{ top: y(Math.min(dragSel.a, dragSel.b)), height: Math.max(3, Math.abs(dragSel.b - dragSel.a) * SCALE) }}>
            <span className="tl-dragsel-time">{fmtClock(Math.min(dragSel.a, dragSel.b))}–{fmtClock(Math.max(dragSel.a, dragSel.b))}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ===== Crash safety net =====
// A render error anywhere in the tree used to white-screen the whole app with no trace.
// This boundary catches it, logs it (track('app_crash')), and shows a recovery screen with
// a "Save my data" escape hatch — the user's localStorage is intact, so they never lose
// data even mid-crash. Class component: error boundaries can't be hooks.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) {
    try { console.error('Train crash:', err, info); } catch (_) {}
    try { track('app_crash', { message: String(err && err.message || err).slice(0, 300),
      stack: String((info && info.componentStack) || '').slice(0, 600) }); } catch (_) {}
  }
  saveData() {
    try {
      const data = {};
      for (const k of BACKUP_KEYS) { const v = localStorage.getItem(k); if (v != null) data[k] = v; }
      const blob = new Blob([JSON.stringify({ _ijek_recovery: true, data }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'ijek-recovery.json'; a.click();
    } catch (_) {}
  }
  render() {
    if (!this.state.err) return this.props.children;
    const th = (typeof getLang === 'function' && getLang() === 'th');
    const wrap = { minHeight: '100dvh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16, padding: 24, textAlign: 'center', background: '#0f1115', color: '#e7e9ee', fontFamily: 'system-ui, sans-serif' };
    const btn = { padding: '12px 20px', borderRadius: 12, border: '1px solid #2a2f3a', background: '#1a1d24', color: '#e7e9ee', fontWeight: 700, fontSize: 15, cursor: 'pointer' };
    return (
      <div style={wrap}>
        <div style={{ fontSize: 44 }}>🦊💤</div>
        <div style={{ fontSize: 19, fontWeight: 800 }}>{th ? 'อุ๊ปส์ มีอะไรพลาดไป' : 'Oops — something broke'}</div>
        <div style={{ fontSize: 14, color: '#9aa0ad', maxWidth: 320, lineHeight: 1.5 }}>
          {th ? 'ข้อมูลของคุณยังอยู่ครบในเครื่อง เซฟไว้ก่อนได้ แล้วลองโหลดใหม่' : 'Your data is safe on this device. Save a copy, then reload.'}
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
          <button style={btn} onClick={() => this.saveData()}>{th ? '⬇ เซฟข้อมูลของฉัน' : '⬇ Save my data'}</button>
          <button style={{ ...btn, background: '#a3e635', color: '#0f1115', borderColor: '#a3e635' }} onClick={() => location.reload()}>{th ? '↻ โหลดใหม่' : '↻ Reload'}</button>
        </div>
      </div>
    );
  }
}

// Hydrate the IndexedDB image store (history + content-addressed task-emoji blobs) BEFORE the first
// render, so the synchronous loadActivities()/loadAvatar() at boot can resolve idbimg: tokens from the
// cache (task emojis must paint correctly on the main screen — they aren't async-tolerant like the
// avatar's photo history). Raced against a 1.5s timeout so a hung/blocked IDB can never brick boot —
// on timeout we render with _idbActive false (localStorage fallback) and onImgStoreReady still fires.
(async () => {
  try { await Promise.race([hydrateImgStore(), new Promise((r) => setTimeout(r, 1500))]); } catch (_) {}
