            <button className={mode === 'percent' ? 'on' : ''} onClick={() => setMode('percent')}>{tr('todo.goal.percent')}</button>
          </div>
          {mode === 'count' && (
            <label className="todo-cfg-target">
              <span><span>🔢</span>{tr(recurring ? 'todo.cfg.target' : 'todo.cfg.targetOnce')}</span>
              <input type="number" min="1" max="99" value={todo.target || 1}
                onChange={(e) => onUpdate(todo.id, { target: Math.max(1, Math.min(99, parseInt(e.target.value, 10) || 1)) })} />
            </label>
          )}
          {!recurring && (
            <label className="todo-cfg-target">
              <span><span>📅</span>{tr('todo.cfg.due')}</span>
              <input type="date" value={todo.due || ''} onChange={(e) => onUpdate(todo.id, { due: e.target.value || null })} />
            </label>
          )}
          <label className="todo-cfg-target">
            <span><span>🔔</span>{tr('todo.cfg.remind')}</span>
            <input type="time" value={todo.remind || ''} onChange={(e) => setRemind(e.target.value)} />
          </label>
          <button className="todo-cfg-close" onClick={() => setCfg(false)}>{tr('todo.cfg.done')}</button>
        </div>
      )}
    </React.Fragment>
  );
}

// Floating quick-access button. Pinned to the app frame's bottom-right, above the nav,
// on every tab. The badge shows how many to-dos are still open.

      <svg viewBox="0 0 24 24" aria-hidden="true">

// The To-Do list itself, shown as a bottom sheet over whatever tab you're on.
// `avatar` lets the committed self react to your one-off work, same as on the race.
function TodoSheet({ todos, setTodos, avatar, onClose }) {
  useEscClose(onClose);
  const trapRef = React.useRef(null);
  useFocusTrap(trapRef);
  const [text, setText] = React.useState('');
  const [confirmClear, setConfirmClear] = React.useState(false);
  const [dragId, setDragId] = React.useState(null);
  const inputRef = React.useRef(null);
  const listRef = React.useRef(null);
  const dragRef = React.useRef({ id: null });
  const now = Date.now();
  const dk = dayKey(now);
  const dow = dayIndexMon(now);

  // Drag-to-reorder the ACTIVE rows (pointer-based, per the app's no-HTML5-drag rule). Listeners
  // live for the sheet's lifetime and no-op unless a drag is in progress. Reordering rebuilds the
  // todos array in place: only the active items' slots are reshuffled; completed/off-day keep spot.
  const onDragStart = (e, id) => { e.preventDefault(); dragRef.current.id = id; setDragId(id); };
  React.useEffect(() => {
    const move = (e) => {
      const id = dragRef.current.id;
      if (!id || !listRef.current) return;
      const rows = listRef.current.querySelectorAll('[data-todo-active]');
      let beforeId = null;
      for (const r of rows) {
        const rc = r.getBoundingClientRect();
        if (e.clientY < rc.top + rc.height / 2) { beforeId = r.getAttribute('data-todo-active'); break; }
      }
      if (beforeId === id) return;
      const n = Date.now(), ndk = dayKey(n), ndw = dayIndexMon(n);
      const isAct = (t) => todoScheduledOn(t, ndw) && !todoDoneOn(t, ndk);
      setTodos(prev => {
        const acts = prev.filter(isAct);
        const ids = acts.map(t => t.id);
        const from = ids.indexOf(id);
        if (from === -1) return prev;
        const newIds = ids.slice(); newIds.splice(from, 1);
        let to = beforeId ? newIds.indexOf(beforeId) : newIds.length;
        if (to === -1) to = newIds.length;
        newIds.splice(to, 0, id);
        let same = true; for (let i = 0; i < ids.length; i++) { if (ids[i] !== newIds[i]) { same = false; break; } }
        if (same) return prev;
        const byId = {}; acts.forEach(t => { byId[t.id] = t; });
        let k = 0;
        return prev.map(t => isAct(t) ? byId[newIds[k++]] : t);
      });
    };
    const up = () => { if (dragRef.current.id) { dragRef.current.id = null; setDragId(null); } };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  }, [setTodos]);

  const add = () => {
    const t = text.trim();
    if (!t) return;
    setTodos(prev => [{ id: uid(), text: t, createdAt: Date.now(), repeat: null, goalMode: 'check' }, ...prev]);
    setText('');
    if (inputRef.current) inputRef.current.focus();
  };
  // Set today's progress value. Recurring → write prog[dk] (auto-resets next day); one-off →
  // top-level cur/done. Completing a one-off drops it to the BOTTOM, un-completing lifts it to
  // the TOP, so a toggled item never gets lost mid-list (fix #4). Recurring items keep position.
  const setCur = (id, val) => setTodos(prev => {
    const t = prev.find(x => x.id === id);
    if (!t) return prev;
    const v = Math.max(0, val);
    if (todoRecurring(t)) {
      const prog = prunedProg({ ...(t.prog || {}) }, now);
      if (v <= 0) delete prog[dk]; else prog[dk] = v;
      return prev.map(x => x.id === id ? { ...x, prog } : x);
    }
    const tgt = todoTarget(t);
    const wasDone = todoDoneOn(t, dk);
    const isDone = v >= tgt;
    const upd = { ...t, cur: v, done: isDone, doneAt: isDone ? Date.now() : null };
    // Only reorder on a done↔active TRANSITION (complete → bottom, un-complete → top). A mid-way
    // rep increment (2/3 → 3/8 etc.) keeps its place so the row doesn't jump out from under you.
    if (isDone === wasDone) return prev.map(x => x.id === id ? upd : x);
    const rest = prev.filter(x => x.id !== id);
    return isDone ? [...rest, upd] : [upd, ...rest];
  });
  const remove = (id) => setTodos(prev => prev.filter(td => td.id !== id));
  const update = (id, patch) => setTodos(prev => prev.map(td => td.id === id ? { ...td, ...patch } : td));
  // Clearing only removes finished ONE-OFF items — recurring ones must survive (they reset daily).
  const clearDone = () => { setTodos(prev => prev.filter(td => todoRecurring(td) || !todoDoneOn(td, dk))); setConfirmClear(false); };

  // Today's list = one-off items + recurring items scheduled for today's weekday.
  const todayItems = todos.filter(td => todoScheduledOn(td, dow));
  const offday = todos.filter(td => todoRecurring(td) && !todoScheduledOn(td, dow));
  const active = todayItems.filter(td => !todoDoneOn(td, dk));
  const completed = todayItems.filter(td => todoDoneOn(td, dk)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const total = todayItems.length;
  const pct = total ? Math.round(completed.length / total * 100) : 0;
  const allClear = active.length === 0 && completed.length > 0;
  // What the committed self says about today's load — celebratory when clear, a nudge otherwise.
  const say = allClear ? tr('todo.allclear') : tr('todo.cheer').replace('{n}', String(active.length));
  const oneOffDone = completed.some(td => !todoRecurring(td)); // only one-off items are clearable
  const rowProps = { dk, dow, now, onSetCur: setCur, onRemove: remove, onUpdate: update };

  return (
    <div className="modal-backdrop todo-backdrop" onClick={onClose}>
      <div className="todo-sheet" onClick={e => e.stopPropagation()} ref={trapRef}>
        <div className="todo-sheet-head">
          <div className="todo-head">
            <h2 className="todo-title">{tr('todo.title')}</h2>
            <p className="todo-sub">{tr('todo.sub')}</p>
          </div>
          <button className="todo-sheet-close" onClick={onClose} aria-label={tr('common.close')}>✕</button>
        </div>

        {/* Avatar reacts to today's load, with a you-amber progress bar (fits the race feel). */}
        {total > 0 && (
          <div className={'todo-hero' + (allClear ? ' is-clear' : '')}>
            <span className="todo-hero-face">{renderFace((avatar && avatar.emoji) || '🦊', 38, true)}</span>
            <div className="todo-hero-info">
              <div className="todo-hero-say">{say}</div>
              <div className="todo-hero-bar"><span style={{ width: pct + '%' }} /></div>
            </div>
            <div className="todo-hero-count">{completed.length}<span>/{total}</span></div>
          </div>
        )}

        <form className="todo-addbar" onSubmit={(e) => { e.preventDefault(); add(); }}>
          <input ref={inputRef} className="todo-input" value={text} onChange={(e) => setText(e.target.value)}
            placeholder={tr('todo.placeholder')} maxLength={200} enterKeyHint="done" />
          <button type="submit" className="todo-add-btn" disabled={!text.trim()} aria-label={tr('todo.add')}>+</button>
        </form>

        <div className="todo-sheet-body">
          {todos.length === 0 ? (
            <div className="todo-empty">
              <div className="todo-empty-emoji">📝</div>
              <div className="todo-empty-title">{tr('todo.empty.title')}</div>
              <div className="todo-empty-sub">{tr('todo.empty.sub')}</div>
            </div>
          ) : (
            <div className="todo-list" ref={listRef}>
              {active.map(td => <TodoRow key={td.id} todo={td} scheduled dragId={dragId} onDragStart={onDragStart} {...rowProps} />)}
              {active.length === 0 && total > 0 && (
                <div className="todo-allclear">{tr('todo.allclear')}</div>
              )}
              {completed.length > 0 && (
                <div className="todo-done-head">
                  <span>{tr('todo.done.header')} · {completed.length}</span>
                  {oneOffDone && (
                    <button className={'todo-clear' + (confirmClear ? ' danger' : '')}
                      onClick={() => confirmClear ? clearDone() : setConfirmClear(true)}>
                      {confirmClear ? tr('todo.clear.confirm') : tr('todo.clear')}
                    </button>
                  )}
                </div>
              )}
              {completed.map(td => <TodoRow key={td.id} todo={td} scheduled {...rowProps} />)}
              {offday.length > 0 && (
                <div className="todo-done-head"><span>{tr('todo.offday')} · {offday.length}</span></div>
              )}
              {offday.map(td => <TodoRow key={td.id} todo={td} scheduled={false} {...rowProps} />)}
            </div>
          )}
        </div>
        {active.length > 0 && (
          <div className="todo-count">{tr('todo.remaining').replace('{n}', String(active.length))}</div>
        )}
      </div>
    </div>
  );
}

function HistoryScreen({ activities, schedule, setSchedule, done, avatar, setAvatar, tickets, plan, onOpenTab, onOpenBilling, session }) {
  // The Progress tab has two modes: your own progress ('mine'), or the Friends
  // leaderboard. A friend-invite link (?add=CODE) opens straight into Friends mode.
  const [mode, setMode] = React.useState(() => { if (_openFriendsMode) { _openFriendsMode = false; return 'friends'; } try { return new URLSearchParams(location.search).get('add') ? 'friends' : 'mine'; } catch { return 'mine'; } });
  const rest = (avatar && avatar.restDays) || [];
  const applySuggestion = (sug) => coachMove(sug, schedule, setSchedule, onOpenTab);
  const dropSuggestion = (actId) => coachDrop(actId, schedule, setSchedule);
  // Tick so the day/streak/this-week stay live if the History tab is left open across
  // midnight (mirrors MainScreen). Without this, `now` froze at mount and the new day
  // never appeared. 30s is plenty for day/clock accuracy.
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => { const i = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(i); }, []);
  const earliest = earliestTrackedDay(done, now);
  const week = weekSummary(schedule, done, now, earliest, rest, tickets, activities);
  const streak = keptStreak(schedule, done, now, earliest, rest, tickets, activities);
  const achStats = streakStats(schedule, done, now, earliest, rest, tickets, activities);
  const byTask = weekByActivity(activities, schedule, done, now, rest, tickets);
  // ── Committed-self ("ตัวที่สัญญาไว้") as a permanent Friends competitor ──────────────
  // The avatar runs the plan perfectly, so synthesize its score and hand it to the Friends
  // board — even with zero friends you always have a benchmark to race, and the board never
  // looks empty/confusing. Pure client-side; never written to daily_scores.
  const selfStats = (() => {
    const nm = nowMinutes(now);
    const todayBlocks = blocksForDate(schedule, done, now);
    const graded = gradedBlocks(todayBlocks, tickets, now, activities);
    const planDue = dayCredit(graded, {}, nm, activities).plan; // minutes the committed self must have done by now
    // streak = consecutive planned (non-rest) days back from today — the committed self kept them all
    let cs = 0;
    for (let i = 0; i < 400; i++) {
      const ts = addDays(startOfDay(now), -i);
      if (rest.indexOf(dayIndexMon(ts)) !== -1 || isTicketed(tickets, ts)) continue;
      if (blocksForDate(schedule, done, ts).length > 0) cs++;
      else if (i > 0) break;
    }
    const days = week.days.filter(d => !d.isFuture && d.hasPlan && d.status !== 'rest').length;
    // Committed-self WEEKLY contract score = 100 per qualifying day (it keeps 100% of every real
    // plan). We also track its banked minutes (full plan) for the effort tiebreaker. Past days
    // count the whole day; today counts the plan due so far — matching how daily_scores accrue.
    let leagueMin = 0, leaguePts = 0;
    const ws = startOfWeek(now), todayIdx = dayIndexMon(now);
    for (let i = 0; i <= todayIdx; i++) {
      const ts = addDays(ws, i);
      if (rest.indexOf(dayIndexMon(ts)) !== -1 || isTicketed(tickets, ts)) continue;
      const db = gradedBlocks(blocksForDate(schedule, done, ts), tickets, ts, activities);
      const planM = dayCredit(db, {}, (i === todayIdx) ? nm : 24 * 60, activities).plan;
      leagueMin += planM;                            // banked minutes → effort tiebreaker
      if (planM >= LEAGUE_MIN_PLAN) leaguePts += 100; // committed self keeps 100% of every real day
    }
    // The committed self keeps its whole contract → daily % = 100 on every qualifying day, banked
    // minutes = the full plan. Beating it = keeping 100% of your own real (non-trivial) plan.
    return { todayPct: planDue > 0 ? 100 : 0, todayDoneMin: Math.round(planDue), streak: cs, leaguePts: Math.round(leaguePts), leagueEff: Math.round(leagueMin), leagueDays: days };
  })();
  // Week-long race totals (you-done vs committed-self-banked, both vs the full week plan).
  let wkYou = 0, wkPlan = 0;
  for (const id in byTask) { const a = byTask[id]; wkYou += a.doneMin; wkPlan += a.planMin; }
  const trend = weeklyTrend(schedule, done, now, earliest, rest, 6, tickets, activities);
  const coachReview = coachInsights(schedule, done, now, earliest, rest, tickets, activities);
  // Always open on Week after a refresh/reload — the toggle still switches to Day within
  // the session, but a reload resets to Week (no longer restores the last-picked view).
  const [view, setView] = React.useState('week');   // 'day' | 'week'
  const [dayOffset, setDayOffset] = React.useState(0);

  return (
    <div className="hist-screen">
      <div className="mode-toggle">
        <button className={mode === 'mine' ? 'on' : ''} onClick={() => setMode('mine')}>{tr('hist.mineMode')}</button>
        <button className={mode === 'friends' ? 'on' : ''} onClick={() => setMode('friends')}>{tr('nav.friends')}</button>
      </div>
      {mode === 'friends' ? <FriendsScreen avatar={avatar} rankEmoji={(chosenTrophy(avatar, achStats.totalKept) || {}).emoji || ''} session={session} plan={plan} onOpenBilling={onOpenBilling} selfStats={selfStats} /> : (
      <React.Fragment>
      <div className="view-toggle">
        <button className={'view-toggle-btn' + (view === 'day' ? ' on' : '')} onClick={() => setView('day')}>{tr('view.day')}</button>
        <button className={'view-toggle-btn' + (view === 'week' ? ' on' : '')} onClick={() => setView('week')}>{tr('view.week')}</button>
      </div>

      {view === 'day' ? (
        <DayProgress activities={activities} schedule={schedule} done={done} rest={rest} tickets={tickets} now={now} dayOffset={dayOffset} setDayOffset={setDayOffset} avatar={avatar} />
      ) : (
      <React.Fragment>
      {/* Two parts, JEK's review FIRST then the Weekly Recap below it. Free sees teasers
          that tap through to billing. */}
      {planAllows(plan, 'coach')
        ? <CoachCard review={coachReview} avatar={avatar} onApply={applySuggestion} onDrop={dropSuggestion} />
        : (coachReview.ok && coachReview.insights[0]
            /* Soft gate: enough data → give a taste (first insight visible, rest + the fix
               walled). Not enough data yet → the plain ProLock (nothing to tease with). */
            ? <CoachCard review={coachReview} avatar={avatar} tease onOpenBilling={onOpenBilling} />
            : <ProLock tier="pro" title={tr('prolock.coachTitle')}
                desc={tr('prolock.coachDesc')} onOpenBilling={onOpenBilling} />)}
      {planAllows(plan, 'weeklyRecap')
        ? <WeeklyRecapCard week={week} lastWeek={trend.length >= 2 ? trend[trend.length - 2] : null} streak={streak} avatar={avatar} youMin={wkYou} planMin={wkPlan} />
        : (
          /* Free: recap is walled; keep the free WeekCard (day strip + streak) underneath the lock. */
          <React.Fragment>
            <ProLock tier="pro"
              title={getLang() === 'th' ? '📊 สรุปสัปดาห์' : '📊 Weekly Recap'}
              desc={getLang() === 'th' ? 'ดูภาพรวมสัปดาห์ของคุณ — วันที่ตามทัน เวลาที่ลงไป วันที่ดีสุด และสิ่งที่ควรแก้' : 'Your week in review — days kept, time invested, your best day, and what to fix next.'}
              onOpenBilling={onOpenBilling} />
            <WeekCard week={week} streak={streak} avatar={avatar} />
          </React.Fragment>
        )}
      <div id="streak-section" style={{ scrollMarginTop: 12 }}><AchievementsCard stats={achStats} /></div>

          const dt = new Date(d.ts);

          if (d.status === 'kept') { verdict = tr('verdict.keptUp'); cls = 'good'; }

          else if (d.status === 'half') { verdict = tr('verdict.halfway'); cls = 'mid'; }
          else if (d.status === 'start') { verdict = tr('verdict.madeStart'); cls = 'mid'; }
          else if (d.status === 'miss' || d.status === 'behind') { verdict = tr('verdict.missed'); cls = 'muted'; }
          else if (d.status === 'today') { verdict = tr('verdict.inProgress'); cls = 'mid'; }
          else if (d.status === 'rest') {
            // An Away (sick/trip/rest) reads as its own story — gap because life happened, not a miss.

                      <span className="dayp-race-val">{formatHM(Math.round(d.planMin) * 60)}</span>

                    <div className="dayp-race-row">
                      <span className="dayp-race-tag">{tr('race.you')}</span>
                      <div className="dayp-race-track"><div className="dayp-race-fill me" style={{ width: Math.min(100, d.pct || 0) + '%' }} /></div>
                      <span className="dayp-race-val">{formatHM(Math.round(d.doneMin) * 60)}</span>
                    </div>
                    <div className="dayp-race-note">{d.gapMin >= 1 ? tr('race.behindName', { t: formatHM(Math.round(d.gapMin) * 60), name: avatar.name }) : tr('race.inStepName', { name: avatar.name })}</div>
                  </div>

      <div className="section-label">{tr('hist.thisWeekByTask')}</div>
      {byTask.length === 0 ? (
        <p className="hist-note" style={{ textAlign: 'left' }}>{tr('hist.noTasksYet')}</p>
      ) : (
        <div className="task-prog-list">
          {byTask.map(r => {
            const a = r.activity;
            // When a task has a weekly work goal, that goal is the headline metric
            // (% + bar); time is shown underneath. Otherwise time leads as before.
            const hasGoal = r.weeklyAmount > 0;
            const pct = hasGoal ? (r.amountPct || 0) : r.pct;
            const cls = pct >= 100 ? 'good' : pct >= 60 ? 'mid' : 'bad';
            const glyph = TASK_EMOJI_CHAR[a.emoji] || glyphFromCode(a.emoji) || '💪';

            return (

                <div className="task-prog-top">
                  <span className="task-prog-name">
                    <span className="task-prog-emoji" style={{ borderColor: a.color }}>
                      <TaskEmoji act={a} size={16} label={a.name} />
                    </span>
                    {a.name}

                  <span className={'task-prog-pct ' + cls}>{pct}%</span>
                </div>
                {hasGoal && (
                  <React.Fragment>
                    <div className="task-prog-bar"><div className="task-prog-fill" style={{ width: Math.min(100, pct) + '%', background: a.color }} /></div>
                    <div className="task-prog-sub">{r.isPct
                      ? tr('task.avgCompletion', { n: r.sessions })
                      : tr('task.amountThisWeek', { done: r.amountDone, total: r.weeklyAmount, unit: unit ? ' ' + unit : '' })}</div>
                  </React.Fragment>

                    <span className="tp-val">{formatHM(Math.round(r.doneMin) * 60)}</span>

// Static glyph for an activity (its picked emoji), with a sensible fallback.
function taskGlyph(a) { return a ? (TASK_EMOJI_CHAR[a.emoji] || glyphFromCode(a.emoji) || '💪') : '•'; }
// Render ONE task emoji that may be a Noto codepoint OR a Pro PHOTO (data: URL). Mirrors
// renderFace's clamp: a photo only shows for Pro; on Free it falls back to the task glyph
// (the data URL stays saved). opts: { label, className, quiet }.
function renderTaskFace(emoji, size, opts) {
  opts = opts || {};
  if (typeof emoji === 'string' && emoji.slice(0, 5) === 'data:') {
    if (photoUnlocked()) {
      // Animated (GIF) task emoji with a stored zoom/pan crop — same framing engine as renderFace.
      const cr = _faceCrops[emoji] || null;
      if (cr) {
        const min = Math.min(cr.w, cr.h);
        const sw = cr.w / min * size * cr.zoom, sh = cr.h / min * size * cr.zoom;
        const l = size / 2 - sw / 2 + (cr.fx || 0) * size, t = size / 2 - sh / 2 + (cr.fy || 0) * size;
        return <span className={'face-crop' + (opts.className ? ' ' + opts.className : '')} style={{ width: size, height: size }}>
          <img src={emoji} alt={opts.label || ''} draggable={false} style={{ width: sw, height: sh, left: l, top: t }} loading="lazy" />
        </span>;
      }
      return <img className={'face-img' + (opts.className ? ' ' + opts.className : '')} src={emoji} width={size} height={size} alt={opts.label || ''} loading="lazy" />;
    }
    emoji = DEFAULT_TASK_EMOJI;
  }
  return <ActionEmoji code={emoji} size={size} label={opts.label || ''} fallback={TASK_EMOJI_CHAR[emoji] || glyphFromCode(emoji) || '💪'} className={opts.className} quiet={opts.quiet} />;
}
// A task's emoji + its optional "double habit" SECOND emoji as a small corner badge — the
// habit-stacking cue (e.g. 📖 Reading with a ☕ coffee badge). With no emoji2 it returns the
// bare main face (no wrapper), so non-stacked tasks render exactly as before.
function TaskEmoji({ act, size, className, label, quiet }) {
  const main = renderTaskFace(act && act.emoji, size, { label: label, className: className, quiet: quiet });
  const e2 = act && act.emoji2;
  if (!e2) return main;
  const bs = Math.max(12, Math.round(size * 0.52));
  return (
    <span className="te-wrap">
      {main}
      <span className="te-badge" style={{ width: bs, height: bs }}>{renderTaskFace(e2, bs, {})}</span>
    </span>
  );
}

// Only photo / GIF / video faces (data: URLs) — a plain emoji glyph is already clear at list
// size, and enlarging it would just show its raw code. Used to gate both the tap behaviour
// and the zoom cursor so non-media taps fall through to the row's normal action.
function isMediaFace(emoji) { return typeof emoji === 'string' && emoji.slice(0, 5) === 'data:'; }
// Tap a photo / GIF / video face to pop a moderately-bigger view right over it — just enough
// to see a tiny one clearly, no full-screen window. Pass the tapped element so the popover can
// anchor to it. Event-driven so any render site can trigger it props-free.
function openFacePreview(emoji, name, anchor) {
  if (!isMediaFace(emoji)) return;
  let rect = null;
  try { if (anchor && anchor.getBoundingClientRect) { const r = anchor.getBoundingClientRect(); rect = { left: r.left, top: r.top, width: r.width, height: r.height }; } } catch (_) {}
  window.dispatchEvent(new CustomEvent('tm-face-preview', { detail: { emoji: emoji, rect: rect } }));
}
function FacePreviewHost() {
  const [p, setP] = React.useState(null);
  const close = () => setP(null);
  React.useEffect(() => {
    const on = (e) => setP((e && e.detail) || null);
    window.addEventListener('tm-face-preview', on);
    return () => window.removeEventListener('tm-face-preview', on);
  }, []);
  React.useEffect(() => {
    if (!p) return;
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    // Any scroll dismisses — the anchor would otherwise drift away from the popover.
    window.addEventListener('keydown', onKey);
    window.addEventListener('scroll', close, true);
    return () => { window.removeEventListener('keydown', onKey); window.removeEventListener('scroll', close, true); };
  }, [p]);
  if (!p) return null;
  // Moderate size; clamp into the viewport and prefer popping ABOVE the tapped item, flipping
  // below only when there's no room up top. renderFace covers glyphs AND data: faces.
  const FACE = 120, PAD = 8, BOX = FACE + PAD * 2, GAP = 10, M = 8;
  const vw = window.innerWidth, vh = window.innerHeight;
  // Clamp WITHIN the phone-shaped .app shell, not the whole window — on desktop the app is a
  // narrow centred card, and a viewport-clamped popover would spill out beside it ("off the
  // phone frame"). On a real phone .app === viewport, so this behaves exactly as before.
  const appEl = (typeof document !== 'undefined') ? document.querySelector('.app') : null;
  const ar = appEl ? appEl.getBoundingClientRect() : { left: 0, top: 0, right: vw, bottom: vh };
  const minX = ar.left + M, maxX = Math.max(ar.left + M, ar.right - BOX - M);
  const minY = ar.top + M, maxY = Math.max(ar.top + M, ar.bottom - BOX - M);
  const r = p.rect || { left: (ar.left + ar.right) / 2 - 12, top: (ar.top + ar.bottom) / 2 - 12, width: 24, height: 24 };
  let left = r.left + r.width / 2 - BOX / 2;
  left = Math.max(minX, Math.min(left, maxX));
  let top = r.top - GAP - BOX;
  if (top < minY) top = Math.min(r.top + r.height + GAP, maxY); // flip below
  return (
    <div className="face-preview-layer" onClick={close}>
      <div className="face-preview-pop" style={{ left: left, top: top }} onClick={(e) => e.stopPropagation()}>
        {renderFace(p.emoji, FACE)}
      </div>
    </div>
  );
}

// Tiny live countdown TEXT (no chrome) — ticks each second on its own so it can sit
// inline, e.g. replacing the avatar's name in the hero while a block is live.
function CountdownText({ endMin }) {
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => { const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, []);
  const d = new Date(now);
  const secOfDay = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const rem = Math.max(0, endMin * 60 - secOfDay);
  const pad = (n) => (n < 10 ? '0' + n : '' + n);
  const mm = Math.floor(rem / 60), ss = rem % 60, hh = Math.floor(mm / 60);
  return <React.Fragment>{hh > 0 ? hh + ':' + pad(mm % 60) + ':' + pad(ss) : pad(mm) + ':' + pad(ss)}</React.Fragment>;
}

// Dashboard quick-access to the Friends/Multiplayer board. Does its OWN lightweight read of
// today's friend scores (just id+name+emoji+pct) so the card can preview who's leading without
// mounting the full FriendsScreen. Tapping deep-links into the Progress tab's Friends mode.
// Hidden entirely if Supabase isn't configured on this build (no multiplayer at all).
function DashFriendsCard({ session, onOpen }) {
  const L = (en, th) => (_lang === 'th' ? th : en);
  const [rows, setRows] = React.useState(null); // friend list (excl. me), sorted by today's % | [] none | null loading
  React.useEffect(() => {
    if (!sb || !session) { setRows(null); return; }
    let alive = true;
    (async () => {
      const myId = session.user.id;
      const fr = await sb.from('friendships').select('friend_id').eq('user_id', myId).eq('status', 'accepted');
      const ids = (fr.data || []).map(r => r.friend_id);
      if (!ids.length) { if (alive) setRows([]); return; }
      const [profs, scores] = await Promise.all([
        sb.from('profiles').select('id,display_name,avatar_emoji').in('id', ids),
        sb.from('daily_scores').select('user_id,pct').eq('day', isoDate(Date.now())).in('user_id', ids),
      ]);
      const byU = {}; (scores.data || []).forEach(s => { byU[s.user_id] = s; });
      const list = (profs.data || []).map(p => ({ id: p.id, name: p.display_name || '🦊', emoji: p.avatar_emoji || '🦊', pct: (byU[p.id] || {}).pct || 0 }));
      list.sort((a, b) => b.pct - a.pct);
      if (alive) setRows(list);
    })().catch(() => { if (alive) setRows([]); });
    return () => { alive = false; };
  }, [session]);
  if (!sb) return null; // multiplayer not configured on this build
  const signedIn = !!session;
  const has = rows && rows.length > 0;
  const leader = has ? rows[0] : null;
  const sub = !signedIn ? L('Sign in & race your friends', 'เข้าสู่ระบบ มาแข่งกับเพื่อน')
    : rows === null ? L('Loading…', 'กำลังโหลด…')
    : !has ? L('Add a friend to race', 'เพิ่มเพื่อนมาแข่งกัน')
    : leader.pct > 0 ? L(leader.name + ' leads · ' + leader.pct + '%', leader.name + ' นำอยู่ · ' + leader.pct + '%')
    : L(rows.length + (rows.length === 1 ? ' friend' : ' friends') + ' today', 'เพื่อน ' + rows.length + ' คนวันนี้');
  return (
    <button className="dash-friends" onClick={onOpen}>
      <span className="dash-friends-ico">🏆</span>
      <span className="dash-friends-body">
        <span className="dash-friends-title">{L('Friends', 'เพื่อน')}</span>
        <span className="dash-friends-sub">{sub}</span>
      </span>
      {has && (
        <span className="dash-friends-avs">
          {rows.slice(0, 3).map(f => <span key={f.id} className="dash-friends-av">{renderFace(f.emoji, 24)}</span>)}
          {rows.length > 3 && <span className="dash-friends-more">+{rows.length - 3}</span>}
        </span>
      )}
      <span className="dash-friends-arrow">›</span>
    </button>
  );
}

function MainScreen({ avatar, setAvatar, activities, setActivities, schedule, setSchedule, done, setDone, tickets, onCustomize, onOpenTab, plan, planReady, onOpenBilling, session }) {
  // Tick slowly so the hero reflects blocks going live / ending in real time.
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => { const i = setInterval(() => setNow(Date.now()), 20000); return () => clearInterval(i); }, []);
  // While the page is actively scrolling, freeze the hero's animated-webp emoji to a
  // static PNG — decoding webp frames mid-scroll is what tears/jitters the dashboard
  // (see useScrolling). Animation resumes the moment scrolling stops.
  const scrolling = useScrolling();
  const [renaming, setRenaming] = React.useState(false);
  const [reschedOff, setReschedOff] = React.useState(() => { try { return localStorage.getItem(K.reschedDismiss) || ''; } catch (_) { return ''; } });
  // JEK's proactive daily check-in (Pro): a once-a-day greeting that persists until
  // you dismiss it (✕ stores today's dayKey so it won't reappear until tomorrow).
  const todayKey = dayKey(now);
  const [checkinSeen, setCheckinSeen] = React.useState(() => { try { return localStorage.getItem(K.checkin) || ''; } catch { return ''; } });
  const dismissCheckin = () => { setCheckinSeen(todayKey); try { localStorage.setItem(K.checkin, todayKey); } catch {} };
  // Free ALSO sees the daily check-in, but LOCKED (one real greeting + an upgrade CTA) —
  // the conversion taste, so Free users feel what Pro's "JEK that talks to you" is.
  const checkinLocked = !planAllows(plan, 'checkin');
  // Device-local opt-out (Settings → JEK greeting). Read directly so a Settings change
  // applies the next time the dashboard mounts (no Root threading needed).
  const greetEnabled = (() => { try { return localStorage.getItem(K.greetOff) !== '1'; } catch { return true; } })();
  const checkin = (checkinSeen !== todayKey && greetEnabled)
    ? checkInLine(avatar, schedule, done, tickets, activities, now, PREV_SEEN) : null;
  // Slice 6: AI JEK (Pro) — fetch an LLM-written version of the check-in line in the
  // background and swap it in when it arrives. The deterministic checkin.msg renders FIRST;
  // this only ever REPLACES it, never blocks. No-ops (and never calls the edge fn) for Free.
  // The callback reads week/streak/pct/todayBlocks (declared below) via closure at run-time —
  // they're NOT in the deps array (which would TDZ-crash since they're declared later).
  const [aiCheckText, setAiCheckText] = React.useState(null);
  React.useEffect(() => {
    let alive = true;
    setAiCheckText(null);                       // reset whenever the situation changes
    if (!checkin || checkinLocked || checkin.ask) return; // Pro + greeting showing; never rewrite the "what happened?" question

  }, [checkin && checkin.moment, checkinLocked, plan, getLang(), avatar.behavior, avatar.name, todayKey]);
  // Tap the avatar to "poke" it: a quick bounce + a random line in its voice.

    setChatLog(cur => { const n = [...cur, { role: 'jek', text: reply, ts: Date.now() }].slice(-CHAT_MAX); saveJSON(K.chat, n); return n; });

        {/* TODAY race + UP NEXT corners — always shown so the hero keeps its full structure
            even with 0 activities (the values just fall back to "—" / "no plan"). */}

            ? <span className="hero-race-mini">
                <span className="hrm-row"><span className="hrm-tag jek">{avatar.name}</span><span className="hrm-track"><span className="hrm-fill jek" style={{ width: miniToday.jek + '%' }} /></span><span className="hrm-val">{miniToday.jekVal}</span></span>

              </span>

          <span className="hero-stat-label">{tr('dash.upNextLabel')}</span>

        <button className="hero-tap" data-tour="hero-avatar" onClick={onAvatarTap} aria-label={tr('dash.poke', { name: avatar.name })}>

          <span className="hero-stage">
            <span key={poke ? poke.n : 'idle'} className={'hero-face' + (poke ? ' poking' : '') + auraClass(avatar.aura)}>{renderFace(avatar.emoji, 64, scrolling, false, true, avatar.aura)}{renderBadges(_selfBadges, null, 64)}</span>
            {poke ? (
              <ActionEmoji key={'poke' + poke.n} code={poke.emoji} size={64}
                label="reaction" fallback={glyphFromCode(poke.emoji)} className="hero-action poking" eager />
            ) : greetActive ? (
              <ActionEmoji key="greet" code={checkin.emoji} size={64}
                label="greeting" fallback={glyphFromCode(checkin.emoji)} className="hero-action" eager />
            ) : (coachQuote || action) ? (
              /* Route emotion AND the insights monocle through one CrossfadeEmoji so flipping
                 the INSIGHTS switch cross-fades 🙂 ↔ 🧐 instead of hard-cutting. */
              <CrossfadeEmoji code={coachQuote ? '1f9d0' : action.code} size={64}
                label={coachQuote ? 'insights' : action.label} fallback={coachQuote ? '🧐' : action.fallback}
                className="hero-action" still={scrolling} eager />

          </span>
          <span key={'h' + (poke ? 'p' : greetActive ? 'g' : coachQuote ? 'c' : 'e')} className={'hero-head hero-swap' + (!poke && coachQuote ? ' coachy' : '')}>{(!poke && !greetActive && coachQuote)
            /* The insight already carries its OWN “name” quotes + sentence punctuation — wrapping it

               the short poke/greet/status lines get the spoken-quote wrap. */
            ? coachQuote

          <span key={'s' + (poke ? 'p' : greetActive ? 'g' : coachQuote ? 'c' : 'e')} className="hero-sub hero-swap">{poke ? (poke.chat ? tr('chat.replySub') : tr('dash.tapAgain')) : greetActive ? tr('dash.greetSub') : (coachQuote ? (coachNoData ? tr('coach.noDataSub') : tr('coach.sub')) : sub)}</span>
        </button>

        {/* Bottom slot — a fixed-min-height footer so the hero card never collapses. WITH an

        <div className="hero-foot">
          {chatMode
            ? <button className="hero-tapme" onClick={() => setHistOpen(true)}>{tr('chat.history')} ›</button>
            : coachActive && coachOn && coachReview.suggestion

                : (coachActive && coachLocked)
                    ? <button className="hero-coach-lock" onClick={onOpenBilling}>🔒 {tr('coach.teaseHero')} ›</button>
                    : <button className="hero-tapme" onClick={onAvatarTap} aria-label={tr('dash.poke', { name: avatar.name })}>{tr('dash.tapMe')}</button>}
        </div>
        {/* Always rendered — the plan gate happens on click (toggleChat → onOpenBilling),
            so it must NOT wait on planReady's Supabase getSession() round-trip, or the button
            visibly pops in a beat after the rest of the app on every refresh. */}
        <button className={'hero-chat' + (chatMode ? ' on' : '')} onClick={toggleChat} aria-label={tr('chat.title', { name: avatar.name })} title={tr('chat.title', { name: avatar.name })}>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 21l1.9-5.6A8.5 8.5 0 1 1 21 11.5z" />
          </svg>
        </button>
      </div>
      {/* Chat dock: a SEPARATE bar BELOW the hero card (June-10 composition) — card stays clean;
          the reply still lands on the hero emoji above. "อ่านประวัติ" opens the read-only thread. */}
      {chatMode && (
        <div className="chat-dock">
          <div className="chat-dock-row">
            {speechSupported && <button className={'hero-chatbar-mic' + (listening ? ' on' : '')} onClick={toggleMic} aria-label={tr('chat.mic')} title={tr('chat.mic')}>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" />
                <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
                <line x1="12" y1="19" x2="12" y2="22" />

            </button>}
            <input ref={chatInRef} className="hero-chatbar-in" value={chatText} placeholder={tr('chat.placeholder')}
              autoFocus disabled={chatBusy}
              onChange={e => setChatText(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); sendChat(); } }} />
            <button className="hero-chatbar-send" onClick={sendChat} disabled={chatBusy || !chatText.trim()} aria-label={tr('chat.send')}>{chatBusy ? '…' : '➤'}</button>
          </div>
        </div>
      )}
      {histOpen && (
        <React.Fragment>
          <div className="sheet-backdrop" onClick={() => setHistOpen(false)} />
          <div className="sheet chat-sheet" role="dialog" aria-modal="true">
            <div className="sheet-grabber" />
            <div className="sheet-header">
              <button className="btn-ghost" onClick={() => setHistOpen(false)}>{tr('common.close')}</button>
              <div className="sheet-title">{tr('chat.title', { name: avatar.name })}</div>
              <span style={{ width: 52 }} />
            </div>
            {/* Read-only history: you chat inline on the hero (the reply lands on the emoji); this
                just lets you re-read the whole thread. No input here — closing returns you to JEK. */}
            <div className="chat-thread" ref={chatThreadRef}>
              {chatLog.length === 0
                ? <div className="chat-empty">{tr('chat.empty', { name: avatar.name })}</div>
                : chatLog.map((m, i) => {
                  const prev = i > 0 ? chatLog[i - 1] : null;
                  const showDay = m.ts && (!prev || !prev.ts || startOfDay(prev.ts) !== startOfDay(m.ts));
                  return (
                    <React.Fragment key={i}>
                      {showDay && <div className="chat-day"><span>{chatDayLabel(m.ts)}</span></div>}
                      <div className={'chat-row ' + (m.role === 'user' ? 'me' : 'jek')}>
                        {m.role === 'jek' && <span className="chat-ava">{renderFace(avatar.emoji, 26, false, false, true, avatar.aura, avatar.faceCrop || null, avatar.faceAdjust)}</span>}
                        <span className="chat-bubble">{m.text}</span>
                        {m.ts && <span className="chat-time">{chatClock(m.ts)}</span>}
                      </div>
                    </React.Fragment>
                  );
                })}
            </div>
          </div>
        </React.Fragment>
      )}

      {showResched && (
        <RescheduleNudge avatar={avatar} suggestion={reschedSug} preview={reschedPreview}
          canApply={coachEntitled} onApply={doResched} onDismiss={dismissResched} onOpenBilling={onOpenBilling} />
      )}

      {/* "Up next" now lives in the hero's top-right corner (see hero-stat-r).
          The live block's countdown now shows in the hero's name slot (CountdownText). */}

      {/* Full this-week rollup (same WeekCard as the Progress tab) — the condensed
          corner stat was too thin, so the rich card lives on the dashboard and taps
          through to Progress. Hidden on a brand-new (no-activity) account: with no
          plan the card is empty filler that pushes the "Add your first activity" CTA
          below the fold, so first-run users had to scroll to find the one button that
          matters. It returns the moment they add their first activity. */}
      {/* Quick-access to Multiplayer right on the home screen — previews who's leading among
          your friends today and deep-links into the Progress tab's Friends mode. */}
      <DashFriendsCard session={session} onOpen={() => { _openFriendsMode = true; onOpenTab('history'); }} />

      {activities.length > 0 && (
        <button className="dash-week-btn" onClick={() => onOpenTab('history')}>
          <WeekCard week={week} streak={streak} avatar={avatar} noRace />
          <span className="dash-week-cta">{tr('dash.seeProgress')}</span>
        </button>
      )}

      {/* Activities list — ALWAYS below the hero so the avatar stays on top like a normal
          day (user pref 2026-06-13). With 0 activities this renders the "create your first
          habit" empty state; the hero above shows the friendly first-run greeting. */}
      <ActivityListScreen activities={activities} setActivities={setActivities} schedule={schedule} setSchedule={setSchedule} done={done} setDone={setDone} plan={plan} onOpenBilling={onOpenBilling} />

      {renaming && (
        <AvatarSetupModal avatar={avatar} title={tr('dash.renameTitle')} cta={tr('common.save')}
          onSave={(next) => { setAvatar(next); setRenaming(false); }} onClose={() => setRenaming(false)} />
      )}
    </div>
  );
}

// Pan + zoom a picked photo into a round avatar, then bake the chosen crop into a
// small (160px) data URL. Preview <img> and the output canvas use the SAME math
// (cover-fit at zoom 1, centered, then offset/zoom), so what you frame is what you get.
// Lazily pull the in-browser background remover (a few-MB WASM/ONNX model, fetched
// from the CDN on first use and then cached by the browser). Loaded via a string
// import() so Babel-standalone never tries to transform the module syntax.
let _bgRemovePromise = null;
function loadBgRemover() {
  if (!_bgRemovePromise) {
    _bgRemovePromise = (new Function('u', 'return import(u)'))('https://esm.sh/@imgly/background-removal@1.6.0')
      .catch(e => { _bgRemovePromise = null; throw e; });
  }
  return _bgRemovePromise;
}

// Lazily pull gif.js (a tiny GIF encoder) so an oversized GIF can be RE-ENCODED smaller and stay
// animated instead of falling back to a still. Its worker is fetched as text → blob URL so a
// cross-origin worker (CDN) isn't blocked. Resolves to { GIF, workerUrl }; rejects if the CDN
// is unreachable (caller then falls back to a static frame).
let _gifEncPromise = null;
function loadGifEncoder() {
  if (!_gifEncPromise) {
    const BASE = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/';
    _gifEncPromise = (async () => {
      if (!window.GIF) {
        await new Promise((res, rej) => {
          const s = document.createElement('script'); s.src = BASE + 'gif.js';
          s.onload = res; s.onerror = () => rej(new Error('gif.js load failed')); document.head.appendChild(s);
        });
      }
      const txt = await fetch(BASE + 'gif.worker.js').then(r => { if (!r.ok) throw new Error('worker fetch failed'); return r.text(); });
      const workerUrl = URL.createObjectURL(new Blob([txt], { type: 'application/javascript' }));
      return { GIF: window.GIF, workerUrl };
    })().catch(e => { _gifEncPromise = null; throw e; });
  }
  return _gifEncPromise;
}

// gifuct-js — decodes a GIF into its real RGBA frames (parseGIF + decompressFrames). Needed
// because drawing an animating <img> to a canvas only yields the first frame in most browsers.
let _gifDecPromise = null;
function loadGifDecoder() {
  if (!_gifDecPromise) {
    _gifDecPromise = (new Function('u', 'return import(u)'))('https://esm.sh/gifuct-js@2.1.2')
      .catch(e => { _gifDecPromise = null; throw e; });
  }
  return _gifDecPromise;
}

function PhotoCropper({ file, onCancel, onDone, animCrop }) {
  const V = 260, S = 160; // preview viewport / output size (px)
  // Animated faces (GIF) can't go through the canvas bake below — it freezes them to one
  // frame — so they're stored RAW. Background-removal still can't apply (it's a per-frame
  // ML pass). But when `animCrop` is set (avatar), we capture zoom/pan as metadata and
  // re-apply it at display time (renderFace), so the user CAN frame an animated face.
  const isAnim = /^image\/gif$/i.test(file.type);
  // Keep animated GIFs RAW whenever feasible so they ACTUALLY animate — the re-encode path below
  // depends on a CDN dynamic import (gif.js/gifuct-js) that can fail (offline/localhost/CORS) and
  // then silently bakes a still frame, which is the #1 reason a "GIF" face shows up frozen. The old
  // tiny 256KB cap existed because raw GIFs (base64, ~1.37×) lived inline in the ~5MB localStorage;
  // they now live in IndexedDB instead (recent emoji in the `hist` store, avatar/task faces offloaded
  // to the `idbimg:` content store), so a couple-MB GIF no longer threatens the localStorage budget.
  // 2MB comfortably covers most Giphy/Tenor GIFs → stored raw → reliably animated. Only genuinely huge
  // GIFs fall through to the (lossy, best-effort) re-encode, then a still frame if even that fails.
  const RAW_GIF_MAX = 2 * 1024 * 1024;
  const gifTooBig = isAnim && file.size > RAW_GIF_MAX;
  const [busy, setBusy] = React.useState(false); // re-encoding a big GIF (shows on the Use button)
  const [src, setSrc] = React.useState(null);
  const [nat, setNat] = React.useState(null); // natural {w,h}
  const [zoom, setZoom] = React.useState(1);
  const [off, setOff] = React.useState({ x: 0, y: 0 });
  const [cut, setCut] = React.useState(false);     // background removed?
  const [cutting, setCutting] = React.useState(false);
  const [cutErr, setCutErr] = React.useState(false);
  const imgRef = React.useRef(null);    // image currently drawn (orig or cut)
  const previewRef = React.useRef(null); // the ON-SCREEN <img> — a detached Image won't ANIMATE a
                                         // GIF, so frame-capture must read this live DOM element
  const origRef = React.useRef(null);   // original Image + its object URL
  const origUrlRef = React.useRef(null);
  const cutRef = React.useRef(null);    // cached transparent-PNG Image + URL (computed once)
  const cutUrlRef = React.useRef(null);

  React.useEffect(() => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { imgRef.current = im; origRef.current = im; origUrlRef.current = url; setNat({ w: im.naturalWidth, h: im.naturalHeight }); setSrc(url); };
    im.onerror = () => onCancel();
    im.src = url;
    return () => { URL.revokeObjectURL(url); if (cutUrlRef.current) URL.revokeObjectURL(cutUrlRef.current); };
  }, []);

  // Toggle background removal. The transparent PNG keeps the original dimensions,
  // so all the pan/zoom geometry below stays valid — we only swap which image is shown/drawn.
  const toggleCut = async () => {
    if (cutting) return;
    setCutErr(false);
    if (cut) { imgRef.current = origRef.current; setSrc(origUrlRef.current); setCut(false); return; }
    if (cutUrlRef.current) { imgRef.current = cutRef.current; setSrc(cutUrlRef.current); setCut(true); return; }
    setCutting(true);
    try {
      const mod = await loadBgRemover();
      const blob = await mod.removeBackground(file);
      const u = URL.createObjectURL(blob);
      const im = new Image();
      await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = u; });
      cutUrlRef.current = u; cutRef.current = im;
      imgRef.current = im; setSrc(u); setCut(true);
    } catch (e) { setCutErr(true); }
    setCutting(false);
  };

  const base = nat ? V / Math.min(nat.w, nat.h) : 1; // cover-fit at zoom 1
  const dw = nat ? nat.w * base * zoom : V;
  const dh = nat ? nat.h * base * zoom : V;
  const clamp = (o) => {
    const mx = Math.max(0, (dw - V) / 2), my = Math.max(0, (dh - V) / 2);
    return { x: Math.max(-mx, Math.min(mx, o.x)), y: Math.max(-my, Math.min(my, o.y)) };
  };
  React.useEffect(() => { setOff(o => clamp(o)); }, [zoom, nat]); // keep the circle covered

  const left = V / 2 - dw / 2 + off.x;
  const top = V / 2 - dh / 2 + off.y;

  const startPan = (e) => {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY, o0 = { x: off.x, y: off.y };
    const move = (ev) => setOff(clamp({ x: o0.x + (ev.clientX - x0), y: o0.y + (ev.clientY - y0) }));
    // On iOS a pan Safari cancels (2nd finger, system gesture) never fires pointerup —
    // listen for pointercancel too or the move listener leaks and stacks on the next grab.
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
    window.addEventListener('pointermove', move, { passive: false }); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  };

  // Bake the CURRENT frame to a small static webp/jpeg — the fallback for an oversized GIF and
  // the normal path for a still image.
  const bakeStill = () => {
    const im = imgRef.current; if (!im) { onCancel(); return; }
    const k = S / V;
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    const ctx = c.getContext('2d');
    ctx.drawImage(im, left * k, top * k, dw * k, dh * k);
    let url;
    if (cut) {
      url = c.toDataURL('image/webp', 0.9); // webp keeps the cut-out transparency
      if (url.slice(0, 15) !== 'data:image/webp') url = c.toDataURL('image/png');
    } else {
      url = c.toDataURL('image/webp', 0.85);
      if (url.slice(0, 15) !== 'data:image/webp') url = c.toDataURL('image/jpeg', 0.85);
    }
    onDone(url);
  };

  // Re-encode an oversized GIF SMALL while keeping its motion. Drawing an animating <img> to a
  // canvas only yields its FIRST frame in most browsers, so we DECODE the real frames with
  // gifuct-js, composite each (honoring disposal), downscale+crop into a 150px canvas, and
  // re-encode with gif.js using each frame's own delay. Returns { url, frames, kb } or throws.
  const compressGif = async () => {
    const [{ GIF, workerUrl }, gifuct] = await Promise.all([loadGifEncoder(), loadGifDecoder()]);
    const buf = await file.arrayBuffer();
    const parsed = gifuct.parseGIF(buf);
    const decoded = gifuct.decompressFrames(parsed, true);
    if (!decoded.length) throw new Error('no frames');
    const W = nat.w, H = nat.h, OUT = 150, k = OUT / V;
    const full = document.createElement('canvas'); full.width = W; full.height = H;
    const fctx = full.getContext('2d');
    const patch = document.createElement('canvas');
    const out = document.createElement('canvas'); out.width = OUT; out.height = OUT;
    const octx = out.getContext('2d');
    const gif = new GIF({ workers: 2, quality: 10, width: OUT, height: OUT, workerScript: workerUrl, repeat: 0 });
    // Every frame must be COMPOSITED (disposal correctness), but only ~32 are written to the
    // output — a long GIF (e.g. 95 frames) makes a huge data URL. We sample evenly and roll the
    // skipped frames' delays into the kept one so the motion plays at the right speed.
    const MAX_OUT = 32, step = Math.max(1, Math.ceil(decoded.length / MAX_OUT));
    let acc = 0, added = 0;
    for (let idx = 0; idx < decoded.length; idx++) {
      const fr = decoded[idx], d = fr.dims;
      patch.width = d.width; patch.height = d.height;
      patch.getContext('2d').putImageData(new ImageData(fr.patch, d.width, d.height), 0, 0);
      fctx.drawImage(patch, d.left, d.top);                 // composite this frame onto the full canvas
      acc += fr.delay || 100;
      if (idx % step === 0 || idx === decoded.length - 1) {
        octx.clearRect(0, 0, OUT, OUT);
        octx.drawImage(full, left * k, top * k, dw * k, dh * k); // crop/zoom exactly like the preview
        gif.addFrame(octx.getImageData(0, 0, OUT, OUT), { delay: acc });
        acc = 0; added++;
      }
      if (fr.disposalType === 2) fctx.clearRect(d.left, d.top, d.width, d.height); // restore-to-bg
    }
    const blob = await new Promise((res, rej) => { gif.on('finished', (b) => b && b.size ? res(b) : rej(new Error('empty'))); gif.on('abort', () => rej(new Error('abort'))); gif.render(); });
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
    return { url, frames: added, kb: Math.round(url.length / 1024) };
  };

  const use = async () => {
    if (busy) return;
    // Small animated GIF → store RAW so the animation survives (canvas would flatten it). Capture
    // zoom/pan as metadata when this is the avatar cropper (animCrop).
    if (isAnim && !gifTooBig) {
      const r = new FileReader();
      const crop = (animCrop && nat) ? { zoom, fx: off.x / V, fy: off.y / V, w: nat.w, h: nat.h } : null;
      r.onload = () => onDone(r.result, crop);
      r.onerror = () => onCancel();
      r.readAsDataURL(file);
      return;
    }
    // Oversized GIF → try to re-encode it small so it KEEPS moving; if that fails (CDN down,
    // browser unsupported, or the result is still too big), fall back to a static frame.
    if (isAnim && gifTooBig) {
      setBusy(true);
      try {
        const res = await compressGif();
        if (res.url && res.url.slice(0, 14) === 'data:image/gif' && res.url.length < 4.5 * 1024 * 1024) { onDone(res.url); return; }
      } catch (e) { /* fall through to still */ }
      setBusy(false);
    }
    bakeStill();
  };

  return (
    <React.Fragment>
      <div className="sheet-backdrop l2" onClick={onCancel} />
      <div className="sheet l2" role="dialog" aria-modal="true">
        <div className="sheet-grabber" />
        <div className="sheet-header">
          <button className="btn-ghost" onClick={onCancel}>{tr('common.cancel')}</button>
          <div className="sheet-title">{tr('crop.title')}</div>
          <button className="btn-primary" onClick={use} disabled={!src || busy} style={{ opacity: (src && !busy) ? 1 : 0.4 }}>{busy ? tr('crop.compressing') : tr('crop.use')}</button>
        </div>
        <div className="sheet-body" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <div className={'cropper' + (cut ? ' is-cut' : '')} style={{ width: V, height: V }}>
            {src && <img ref={previewRef} className="cropper-img" src={src} draggable={false}
              style={{ width: dw, height: dh, left, top }} onPointerDown={startPan} />}
            <div className="cropper-ring" />
          </div>
          {(!isAnim || animCrop) && <div className="cropper-zoom">
            <span>－</span>
            <input type="range" min="1" max="4" step="0.01" value={zoom} onChange={e => setZoom(parseFloat(e.target.value))} aria-label={tr('crop.zoom')} />
            <span>＋</span>
          </div>}
          {!isAnim && <button className={'crop-cut-btn' + (cut ? ' on' : '')} onClick={toggleCut} disabled={!src || cutting}>
            {cutting ? <span className="spin" /> : <span>{cut ? '✓' : '✂️'}</span>}
            <span>{cutting ? tr('crop.cutting') : cut ? tr('crop.cutOn') : tr('crop.cut')}</span>
          </button>}
          {!isAnim && cutErr && <div className="crop-cut-err">{tr('crop.cutErr')}</div>}
          {gifTooBig && <div className="crop-cut-err">{tr('crop.gifStatic')}</div>}
          <div className="race-setup-explain" style={{ textAlign: 'center' }}>{isAnim ? tr(animCrop ? 'crop.animHintZoom' : 'crop.animHint') : tr('crop.hint')}</div>
        </div>
      </div>
    </React.Fragment>
  );
}

// ===== Avatar customize tab =====
function AvatarScreen({ avatar, setAvatar, plan, schedule, done, tickets, activities, onOpenBilling }) {
  const fileRef = React.useRef(null);
  // While the screen is actively scrolling, freeze every animated-webp face to a static PNG —
  // decoding all the preview/picker/sticker webps mid-scroll is what jitters this page (same
  // fix as the dashboard hero, see useScrolling). Animation resumes the moment scrolling stops.
  const scrolling = useScrolling();
  const [avTab, setAvTab] = React.useState('face'); // which section group is shown: face | deco | persona
  const [cropFile, setCropFile] = React.useState(null); // picked image awaiting pan/zoom
  const [gifOpen, setGifOpen] = React.useState(false); // full "Pick an emoji" picker
  const [adultAsk, setAdultAsk] = React.useState(null); // a pending 18+ persona id awaiting age confirm
  const [adultDone, setAdultDone] = React.useState(() => { try { return localStorage.getItem(K.adult) === '1'; } catch { return false; } });
  const isPhoto = typeof avatar.emoji === 'string' && avatar.emoji.slice(0, 5) === 'data:';
  // A face the user picked from the full emoji picker (not a preset, not a photo) —
  // shown as its own selected cell so they can see / re-pick it.
  const isCustomFace = !isPhoto && avatar.emoji !== 'jek' && AVATAR_EMOJIS.indexOf(avatar.emoji) === -1;
  const canPhoto = planAllows(plan, 'photoAvatar');
  const canPersona = planAllows(plan, 'personalities');
  const canAura = planAllows(plan, 'aura');
  // Total kept days → drives the auto RANK badge (separate from the free stickers). Heavy, memoize.
  const keptDays = React.useMemo(() => {
    try { const t = new Date(); return streakStats(schedule || [], done || {}, t, earliestTrackedDay(done || {}, t), (avatar.restDays) || [], tickets, activities || []).totalKept; }
    catch { return 0; }
  }, [schedule, done, tickets, activities, avatar.restDays]);
  const myRank = rankMilestone(keptDays);
  // Trophy the avatar wears (chosen earned milestone, or highest earned by default). Picking is
  // limited to milestones already unlocked — see the trophy picker below.
  const myTrophy = chosenTrophy(avatar, keptDays);
  const setTrophy = (emoji) => setAvatar({ ...avatar, trophy: emoji });
  // Free sticker (one) — pick any emoji, drag/size independently.
  const stickers = _validStickers(avatar.stickers);
  const [stickerPick, setStickerPick] = React.useState(false); // emoji picker open for a new sticker
  const setStickers = (list) => setAvatar({ ...avatar, stickers: list });
  const addSticker = (emoji) => { if (stickers.length >= STICKER_MAX) return; setStickers([...stickers, _validSticker({ emoji, x: stickers.length ? 0.2 : 0.82, y: 0.12 })]); };
  const setSticker = (i, patch) => setStickers(stickers.map((s, j) => j === i ? { ...s, ...patch } : s));
  const removeSticker = (i) => setStickers(stickers.filter((_, j) => j !== i));
  // Swap the two stickers' order. Render order = stacking order (the LAST one paints on top / in front),
  // so reversing the array flips both the slot list AND which sticker sits in front of the other.
  const swapStickers = () => setStickers([...stickers].reverse());
  // Reset one sticker's size + position back to its slot default (matches addSticker's starting spot).
  const resetSticker = (i) => setSticker(i, { x: i ? 0.2 : 0.82, y: 0.12, scale: 1 });
  // Saved "looks" — full avatar snapshots (face + aura + stickers + behavior) the user can store
  // and re-apply. Persisted under K.avatarLooks (also backed up / cloud-synced via BACKUP_KEYS).
  const LOOKS_MAX = 5;
  const [looks, setLooks] = React.useState(() => { const v = unpackLooks(loadRawJSON(K.avatarLooks)); return Array.isArray(v) ? v : []; });
  // Pack before persisting so duplicate photo faces are stored once (avoids the quota blow-out).
  const persistLooks = (list) => { setLooks(list); saveJSON(K.avatarLooks, packLooks(list)); };
  const saveLook = () => persistLooks([normalizeAvatar(avatar), ...looks].slice(0, LOOKS_MAX));
  // Applying a look brings its face (+ that face's crop). Mirror the crop into photoCrops too,
  // keyed by the photo URL, so a later switch-away-and-back (usedPhoto reads photoCrops[url])
  // restores the framing instead of resetting it to centered.
  const applyLook = (look) => {
    const norm = normalizeAvatar(look);
    const next = { ...avatar, ...norm };
    if (norm.faceCrop && typeof norm.emoji === 'string' && norm.emoji.slice(0, 5) === 'data:') {
      next.photoCrops = { ...(avatar.photoCrops || {}), [norm.emoji]: norm.faceCrop };
    }
    setAvatar(next);
  };
  const deleteLook = (i) => persistLooks(looks.filter((_, j) => j !== i));
  // Effective aura for the live preview (a stored Pro choice shows inert on Free).
  const effAura = canAura ? avatar.aura : 'none';
  // What's ACTUALLY active right now given the plan (post-downgrade a Pro persona/photo
  // is stored but inert) — so the picker highlights the effective choice, not the locked
  // one. The stored value is left untouched; re-upgrading re-selects it.
  const effBehavior = (canPersona || FREE_BEHAVIOR_IDS.indexOf(avatar.behavior) !== -1) ? avatar.behavior : 'coach';
  const showPhoto = isPhoto && canPhoto;
  // Recently-used photos kept so switching to an emoji and back doesn't lose the upload.
  // The currently-selected photo always appears (even pre-migration when `photos` is empty).
  const savedPhotos = (() => {
    const list = Array.isArray(avatar.photos) ? avatar.photos.filter(p => typeof p === 'string' && p.slice(0, 5) === 'data:').slice(0, SAVED_PHOTOS_MAX) : [];
    if (isPhoto && list.indexOf(avatar.emoji) === -1) return [avatar.emoji, ...list].slice(0, SAVED_PHOTOS_MAX);
    return list;
  })();
  // The disambiguating "#dN" fragment (see addUploadedPhoto) is ignored by the browser when
  // loading a data: URL, so it identifies a saved COPY without changing the pixels.
  const photoBase = (u) => (typeof u === 'string' ? u.split('#')[0] : u);
  // Tap a SAVED thumbnail → make it the active face, restoring the crop it was saved with
  // (each copy keeps its own framing in avatar.photoCrops).
  const usedPhoto = (url) => {
    const prev = savedPhotos.filter(p => p !== url);
    const cr = (avatar.photoCrops && avatar.photoCrops[url]) || null;
    setAvatar({ ...avatar, emoji: url, photos: [url, ...prev].slice(0, SAVED_PHOTOS_MAX), faceCrop: cr });
  };
  // Finished cropping a freshly-picked image → save it as a NEW entry. If the same image is
  // already saved, give this copy a unique data-URL "#dN" fragment so it lives as a SEPARATE
  // photo with its own crop — the user can keep one image framed several ways instead of a
  // second upload overwriting the first.
  const addUploadedPhoto = (url, crop) => {
    let finalUrl = url;
    const base = photoBase(url);
    if (savedPhotos.some(p => photoBase(p) === base)) {
      let n = 2;
      while (savedPhotos.indexOf(base + '#d' + n) !== -1) n++;
      finalUrl = base + '#d' + n;
    }
    const photoCrops = { ...(avatar.photoCrops || {}) };
    if (crop) photoCrops[finalUrl] = crop; else delete photoCrops[finalUrl];
    setAvatar({ ...avatar, emoji: finalUrl, photos: [finalUrl, ...savedPhotos].slice(0, SAVED_PHOTOS_MAX), faceCrop: crop || null, photoCrops });
  };
  const dropPhoto = (url) => {
    const photos = savedPhotos.filter(p => p !== url);
    // If we removed the active face, fall back to the next saved photo or the default emoji.
    const next = avatar.emoji === url ? (photos[0] || AVATAR_EMOJIS[0]) : avatar.emoji;
    const photoCrops = { ...(avatar.photoCrops || {}) };
    delete photoCrops[url];
    const nextIsPhoto = typeof next === 'string' && next.slice(0, 5) === 'data:';
    setAvatar({ ...avatar, emoji: next, photos, photoCrops, faceCrop: nextIsPhoto ? (photoCrops[next] || null) : null });
  };
  // Emoji-sway on/off (device-local, body-class driven — see applySway()).
  const [noSway, setNoSway] = React.useState(swayOff);
  const toggleSway = () => {
    const v = !noSway; setNoSway(v);
    try { localStorage.setItem(K.noSway, v ? '1' : '0'); } catch {}
    applySway();
  };
  // Weekly rest-ticket quota (0–5). Whole-day rest spends it all; a task costs 1.
  const ticketQuota = avatar.restTickets != null ? avatar.restTickets : REST_TICKETS_PER_WEEK;
  const setQuota = (n) => setAvatar({ ...avatar, restTickets: Math.max(0, Math.min(REST_TICKETS_PER_WEEK, n)) });
  const onPickImage = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = ''; // allow re-picking the same file
    if (f) setCropFile(f); // open the pan/zoom cropper before saving
  };
  // Drag a STICKER around the preview face. Store its CENTRE as a fraction of the face box,
  // keeping the grab-offset so it doesn't snap to the cursor. `accDrag.i` = which sticker.
  const accDrag = React.useRef(null);
  const onAccDown = (i) => (e) => {
    e.stopPropagation(); // don't trigger the face's openFacePreview
    const faceEl = e.currentTarget.parentElement; // the .hero-face wrapper
    const badge = e.currentTarget.getBoundingClientRect();
    accDrag.current = {
      i, box: faceEl.getBoundingClientRect(),
      dx: e.clientX - (badge.left + badge.width / 2),
      dy: e.clientY - (badge.top + badge.height / 2),
    };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
  };
  const onAccMove = (e) => {
    const d = accDrag.current; if (!d) return;
    const cx = e.clientX - d.dx, cy = e.clientY - d.dy; // badge centre in px
    const x = Math.max(-0.4, Math.min(1.4, (cx - d.box.left) / d.box.width));
    const y = Math.max(-0.4, Math.min(1.4, (cy - d.box.top) / d.box.height));
    setSticker(d.i, { x, y });
  };
  const onAccUp = () => { accDrag.current = null; };
  // Drag the MAIN emoji face itself to reposition it (photos use the cropper instead). Mirrors the
  // sticker drag: store x/y as a fraction of the face box; the size slider sets `scale`.
  const curFaceAdj = _validAdjust(avatar.faceAdjust) || { scale: 1, x: 0, y: 0 };
  const setFaceAdj = (patch) => setAvatar({ ...avatar, faceAdjust: _validAdjust({ ...curFaceAdj, ...patch }) });
  const faceDrag = React.useRef(null);
  const faceMoved = React.useRef(false); // a real drag happened → swallow the click so a photo's tap-preview doesn't also fire
  // When the main face is "frozen" its drag is disabled, so the user can position the stickers
  // (which sit on top of it) without accidentally nudging the big face underneath. Edit-only aid.
  // Default ON: with stickers stacked over the face, locking it is the more forgiving starting point.
  const [faceFrozen, setFaceFrozen] = React.useState(true);
  const onFaceDown = (e) => {
    if (faceFrozen) return; // locked → let stickers (with their own handlers) take the drag
    e.stopPropagation();
    faceMoved.current = false;
    faceDrag.current = { box: e.currentTarget.getBoundingClientRect(), sx: e.clientX, sy: e.clientY, x0: curFaceAdj.x, y0: curFaceAdj.y };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
  };
  const onFaceMove = (e) => {
    const d = faceDrag.current; if (!d) return;
    if (Math.abs(e.clientX - d.sx) > 3 || Math.abs(e.clientY - d.sy) > 3) faceMoved.current = true;
    const x = Math.max(-0.9, Math.min(0.9, d.x0 + (e.clientX - d.sx) / d.box.width));
    const y = Math.max(-0.9, Math.min(0.9, d.y0 + (e.clientY - d.sy) / d.box.height));
    setFaceAdj({ x, y });
  };
  const onFaceUp = () => { faceDrag.current = null; };
  // Preview decorations: the earned TROPHY (fixed bottom-right corner, not draggable) + the free
  // sticker as a draggable, live-positioned badge.
  const previewDeco = (
    <React.Fragment>
      {myTrophy && <span className="av-acc av-acc-lg rank"><ActionEmoji code={codeFromGlyph(myTrophy.emoji)} size={30} fallback={myTrophy.emoji} label="" still={scrolling} /></span>}
      {stickers.map((s, i) => (
        <span key={i} className="av-acc av-acc-lg av-acc-drag placed"
          style={{ left: s.x * 100 + '%', top: s.y * 100 + '%', right: 'auto', transform: 'translate(-50%,-50%) scale(' + (s.scale || 1) + ')' }}
          onPointerDown={onAccDown(i)} onPointerMove={onAccMove} onPointerUp={onAccUp} onPointerCancel={onAccUp}
          onClick={(e) => e.stopPropagation()}>
          <ActionEmoji code={codeFromGlyph(s.emoji)} size={30} fallback={s.emoji} label="" still={scrolling} />
        </span>
      ))}
    </React.Fragment>
  );
  return (
    <div className="av-screen">
      <div className="section-label">{tr('av.committedSelf')}</div>
      {/* Same preview box on every tab (Face / Decorate / Personality) — identical size and the full
          set of info (face + name + tag + persona chip). The Decorate tab used to trim this to a
          smaller "compact" card, which made the box change size between tabs and hid info; the user
          asked for one consistent box so it's easy to understand while adjusting (2026-06-11). */}
      <div className="av-preview">
        <span className={'hero-face' + auraClass(avatar.aura)}
          onClick={isMediaFace(avatar.emoji) ? (e) => openFacePreview(avatar.emoji, avatar.name, e.currentTarget) : undefined}>{renderFace(avatar.emoji, 64, scrolling, false, false, avatar.aura, avatar.faceCrop || null, null)}{previewDeco}</span>
        <div className="av-preview-meta">
          <span className="hero-name">{avatar.name}</span>
          <span className="av-preview-tag">{tr('av.previewTag')}</span>
        </div>
        <div className="av-preview-chips">
          <span className="av-chip">{(BEHAVIORS[effBehavior] || BEHAVIORS.coach).emoji} {tr('behavior.' + (BEHAVIORS[effBehavior] ? effBehavior : 'coach') + '.label')}</span>
        </div>
      </div>
      <div className="av-tabs" role="tablist">
        {[['face', 'av.tabFace'], ['deco', 'av.tabDecorate'], ['persona', 'av.tabPersona']].map(([id, key]) => (
          <button key={id} type="button" role="tab" aria-selected={avTab === id}
            className={'av-tab' + (avTab === id ? ' on' : '')} onClick={() => setAvTab(id)}>{tr(key)}</button>
        ))}
      </div>
      <div className="av-tab-panel">
      {avTab === 'face' && <React.Fragment>
      {/* Saved looks: snapshot the whole avatar (face + aura + stickers + positions) and re-apply. */}
      <div className="looks-card">
        <div className="looks-head">
          <span className="looks-head-ic">🎭</span>
          <div className="looks-head-txt">
            <span className="looks-head-title">{tr('av.looksLabel')}</span>
            <span className="looks-head-sub">{looks.length}/{LOOKS_MAX}</span>
          </div>
          <button type="button" className="looks-save" onClick={saveLook} disabled={looks.length >= LOOKS_MAX}>＋ {tr('av.saveLook')}</button>
        </div>
        <div className="looks-grid">
          {looks.map((lk, i) => (
            <div key={i} className="look-chip">
              <button type="button" className={'look-face' + auraClass(lk.aura)} onClick={() => applyLook(lk)} title={tr('av.applyLook')}>
                {/* Wrap face + stickers in a box that's EXACTLY the glyph size, so the stickers'

                <span className="look-face-glyph">
                  {renderFace(lk.emoji || '🦊', 30, scrolling, false, false, lk.aura)}
                  {/* Show the saved look's stickers too (not rank — that's a live achievement, not part of a look). */}
                  {renderBadges(_validStickers(lk.stickers), 'av-acc-xs', 30)}
                </span>
              </button>
              <button type="button" className="look-del" onClick={() => deleteLook(i)} aria-label={tr('av.deleteLook')}>✕</button>
            </div>

        </div>
        {looks.length === 0 && <div className="looks-empty">{tr('av.looksHint')}</div>}
      </div>
      <div className="race-setup-label">{tr('av.name')}</div>
      <input className="input-underline input-large" value={avatar.name}
        placeholder={tr('av.namePlaceholder')}
        onChange={e => setAvatar({ ...avatar, name: e.target.value })} />
      <div className="race-setup-label">{tr('av.face')}</div>
      <div className="self-avatar-pickrow">
        {AVATAR_EMOJIS.map(e => (
          // Every face in the picker plays its animation (user prefers the lively grid).
          <button key={e} className={'self-avatar-opt' + (e === avatar.emoji ? ' on' : '')}

        {isCustomFace && (
          <button className="self-avatar-opt on" aria-label={tr('av.pickedEmoji')}>{renderFace(avatar.emoji, 28, scrolling, false, false, undefined, undefined, null)}</button>

      {/* Main-emoji resize/drag moved to the "Decorate" tab (sits beside the sticker sliders). */}

      {showPhoto && <div className="race-setup-explain" style={{ marginTop: 0 }}>{tr('av.photoExplain')}</div>}

        <span className="sway-pill-txt">
          <span className="sway-pill-title">{tr('av.swayTitle')}</span>
          <span className="sway-pill-sub">{tr('av.swaySub')}</span>
        </span>
        <span className="lively-switch"><span className="lively-knob" /></span>
      </button>
      </React.Fragment>}

      {avTab === 'deco' && <React.Fragment>

      <div className="race-setup-label">{tr('av.auraLabel')} {!canAura && <span className="label-pro">PRO</span>}</div>

      {/* Main-face resize/move REMOVED 2026-06-16 (bled across faces + overflowed the card).

        <div key={i} className="sticker-slot">
