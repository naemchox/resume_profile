      else if (e.key === K.todos) setTodos(loadJSON(K.todos, []));
      else if (e.key === K.avatar) setAvatarState(loadAvatar());
      else if (e.key === K.plan) { const p = loadPlan(); setPlanGate(p); setPlanState(p); }
      else if (e.key === K.theme) setThemeState(loadTheme());
      else if (e.key === K.reminders) setRemindersOn(loadReminders());
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);

  // ── Live block reminders (foreground only) ──────────────────────────────────
  // While the app is open, fire a Web Notification the moment a scheduled block
  // starts — your committed self is beginning it now, so keep up. This is the
  // FOREGROUND half: a closed-app / background reminder needs a push server
  // (deferred). Gated to Pro + the device-local toggle. Never nudges a block that
  // is done, rested (whole-day or per-block), or a hobby, and dedupes so each
  // block notifies at most once per day. `remFiredRef` survives re-subscribes
  // (schedule/done edits) so the dedupe set isn't lost when deps change.
  const remFiredRef = React.useRef({ day: '', ids: null });
  React.useEffect(() => {
    if (!remindersOn || !planAllows(plan, 'reminders')) return;
    if (typeof Notification === 'undefined') return;
    let alive = true;
    const tick = () => {
      if (!alive || Notification.permission !== 'granted') return;
      const now = Date.now();
      const k = dayKey(now);
      if (remFiredRef.current.day !== k) remFiredRef.current = { day: k, ids: new Set() };
      const fired = remFiredRef.current.ids;
      if (isTicketed(tickets, now)) return; // whole day excused → no nudges
      const nm = nowMinutes(now);
      const doneMap = done[k] || {};
      const blocks = blocksForDate(schedule, done, now);
      for (const b of blocks) {
        if (fired.has(b.id)) continue;
        if (nm < b.start || nm >= b.start + 2) continue; // only the ~2-min window at start
        if (doneMap[b.id]) continue;                     // already checked off
        if (!notHobby(b, activities)) continue;          // hobbies never nudge
        if (blockTicketed(tickets, now, b.id)) continue; // this block rested today
        fired.add(b.id);                                 // dedupe BEFORE firing
        fireBlockReminder(findActivity(activities, b.activityId), avatar);
      }
    };
    tick(); // catch a block starting the instant reminders turn on / the app opens
    const i = setInterval(tick, 20000);
    return () => { alive = false; clearInterval(i); };
  }, [remindersOn, plan, schedule, done, tickets, activities, avatar]);

  // ── Live To-Do reminders (foreground) ───────────────────────────────────────
  // A to-do can carry an optional remind time; fire a Web Notification in its ~2-min window if it's
  // due today and still unmet. FREE (To-Do is free) and independent of the Pro block-reminder
  // toggle — gated only on the OS notification grant the user accepted when setting the time.
  const todoRemFiredRef = React.useRef({ day: '', ids: null });
  React.useEffect(() => {
    if (typeof Notification === 'undefined') return;
    let alive = true;
    const tick = () => {
      if (!alive || Notification.permission !== 'granted') return;
      const now = Date.now();
      const k = dayKey(now);
      if (todoRemFiredRef.current.day !== k) todoRemFiredRef.current = { day: k, ids: new Set() };
      const fired = todoRemFiredRef.current.ids;
      const dw = dayIndexMon(now);
      const nm = nowMinutes(now);
      for (const t of todos) {
        if (!t.remind || fired.has(t.id)) continue;
        const p = t.remind.split(':');
        const rmin = (+p[0]) * 60 + (+p[1]);
        if (nm < rmin || nm >= rmin + 2) continue;          // only the ~2-min window at the time
        if (!todoScheduledOn(t, dw) || todoDoneOn(t, k)) continue;
        fired.add(t.id);                                    // dedupe BEFORE firing
        fireBlockReminder({ id: t.id, name: t.text }, avatar);
      }
    };
    tick();
    const i = setInterval(tick, 20000);
    return () => { alive = false; clearInterval(i); };
  }, [todos, avatar]);

  // ── Streak-milestone celebration ────────────────────────────────────────────
  // When your TOTAL kept days cross a new milestone (you check off the block that
  // makes today "kept"), throw a one-time party — and that badge is now also a
  // wearable accessory. `tm_ach_seen` stores the highest milestone already celebrated
  // so it never repeats. First run on existing history BASELINES silently (writes seen
  // = current highest) so we don't pop a party for days earned before this feature.
  const [celebrate, setCelebrate] = React.useState(null); // milestone object | null
  const achSeenRef = React.useRef(undefined);
  React.useEffect(() => {
    const t = Date.now();
    const kept = streakStats(schedule, done, t, earliestTrackedDay(done, t), (avatar && avatar.restDays) || [], tickets, activities).totalKept;
    let reached = 0, reachedM = null;
    for (const m of STREAK_MILESTONES) { if (kept >= m.days) { reached = m.days; reachedM = m; } }
    if (achSeenRef.current === undefined) {
      const raw = loadJSON(K.achSeen, null);
      achSeenRef.current = (typeof raw === 'number') ? raw : null;
    }
    const seen = achSeenRef.current;
    if (seen == null) { achSeenRef.current = reached; saveJSON(K.achSeen, reached); return; } // silent baseline
    if (reached > seen && reachedM) {
      achSeenRef.current = reached; saveJSON(K.achSeen, reached);
      setCelebrate(reachedM);
    }
  }, [done, schedule, tickets, activities, avatar]);

  // ── Monday recap: once per week, on the first open of a new week, summarise LAST week.
  // Runs ONCE on mount (state is hydrated from localStorage synchronously). `tm_recap_week`
  // stores the week we last recapped; a fresh install BASELINES to this week silently so we
  // never recap a week the user wasn't here for. Skipped when last week had nothing tracked.
  const [recap, setRecap] = React.useState(null); // { week, streak, review } | null
  React.useEffect(() => {
    const t = Date.now();
    const thisWeek = startOfWeek(t);
    const lastWeek = addDays(thisWeek, -7);
    const raw = loadJSON(K.recapWeek, null);
    const seen = (typeof raw === 'number') ? raw : null;
    if (seen == null) { saveJSON(K.recapWeek, thisWeek); return; } // silent baseline on first run
    if (seen >= thisWeek) return; // already recapped this week
    const earliest = earliestTrackedDay(done, t);
    if (earliest >= thisWeek) return; // no history before this week — nothing to recap
    const rest = (avatar && avatar.restDays) || [];
    const wk = weekStats(schedule, done, lastWeek, t, earliest, rest, tickets, activities);
    if (wk.finishedPlanned === 0 && !wk.days.some(d => d.hasPlan)) { saveJSON(K.recapWeek, thisWeek); return; } // empty week → mark seen, skip
    saveJSON(K.recapWeek, thisWeek);
    const streak = keptStreak(schedule, done, t, earliest, rest, tickets, activities);
    const review = coachInsights(schedule, done, t, earliest, rest, tickets, activities);
    setRecap({ week: wk, streak, review });
  }, []);
  // Manual "view last week's recap" (Settings → Help) — same build, no once-per-week gate.
  const showRecapNow = () => {
    const t = Date.now();
    const lastWeek = addDays(startOfWeek(t), -7);
    const earliest = earliestTrackedDay(done, t);
    const rest = (avatar && avatar.restDays) || [];
    setRecap({
      week: weekStats(schedule, done, lastWeek, t, earliest, rest, tickets, activities),
      streak: keptStreak(schedule, done, t, earliest, rest, tickets, activities),
      review: coachInsights(schedule, done, t, earliest, rest, tickets, activities),
    });
  };

  // ── Multiplayer: Supabase session + daily-score push ────────────────────────
  // Root owns the Supabase auth session (single source) and pushes TODAY's score to
  // `daily_scores` whenever your progress changes — so friends' leaderboards stay live
  // even when the Friends tab isn't open. Debounced so a burst of check-offs = one write.
  const [sbSession, setSbSession] = React.useState(null);
  const [sessionChecked, setSessionChecked] = React.useState(false); // has the first getSession() resolved?
  const [recovering, setRecovering] = React.useState(false); // arrived via a password-reset email link
  // Has the local plan been reconciled with the server entitlement yet? Until it has, a Pro
  // user whose LOCAL flag is still 'free' (paid on another device, or local was reset) would
  // briefly render the Free "Insights" tease/lock CTA before fetchEntitlement() upgrades them —
  // a visible flash. Gate the Free-only coach UI on this so it never flashes. No backend = the
  // local plan is already authoritative → ready immediately.
  const [planReady, setPlanReady] = React.useState(!sb);
  React.useEffect(() => {
    if (!sb) return;
    const adopt = (s) => {
      setSbSession(s || null);
      if (!s) return;
      try { identifyUser(s.user.id); } catch (_) {}
      // Reverse bridge: a Supabase session with no local account yet (e.g. a Google OAuth
      // sign-in from the LoginScreen) → adopt it as the local login so the app unlocks
      // with no second step. Name/email come from the Google profile.
      if (!loadJSON(K.auth, null)) {
        const u = s.user || {}, m = u.user_metadata || {};
        login({ name: m.full_name || m.name || (u.email || '').split('@')[0] || 'You',
                email: u.email || '', provider: (u.app_metadata && u.app_metadata.provider) || 'oauth', ts: Date.now() });
      }
    };
    sb.auth.getSession().then(({ data }) => { adopt(data.session || null); setSessionChecked(true); })
      .catch(() => setSessionChecked(true)); // a rare getSession reject must still release the loader → LoginScreen / entitlement reconcile
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => {
      if (_e === 'PASSWORD_RECOVERY') setRecovering(true); // reset-email link → show "set new password"
      adopt(s || null); setSessionChecked(true);
    });
    return () => { try { sub.subscription.unsubscribe(); } catch (_) {} };
  }, []);
  // Account-switch guard: the device's tm_* data belongs to exactly ONE account, tracked in
  // K_SYNC_OWNER. Logging in as a DIFFERENT user must NOT inherit (or, via reconcile, push up)
  // the previous account's avatar/looks/schedule — so wipe local data, stamp the new owner, and
  // reload to rebuild every store empty. After reload, reconcile pulls THIS account's cloud.
  // First login on a device (no owner yet) just claims ownership and keeps the existing local
  // work; a normal reload as the SAME account matches and does nothing. Runs for every plan
  // (not sync-gated) — the wipe is local-only and fast, so the reload beats reconcile's
  // network-pull-then-debounced push.
  React.useEffect(() => {
    if (!sbSession) return;
    const me = sbSession.user.id;
    let owner = null;
    try { owner = localStorage.getItem(K_SYNC_OWNER); } catch (_) {}
    if (owner === me) return;
    if (!owner) { try { localStorage.setItem(K_SYNC_OWNER, me); } catch (_) {} return; }
    (async () => {
      await wipeLocalAccountData();
      try { localStorage.setItem(K_SYNC_OWNER, me); } catch (_) {}
      location.reload();
    })();
  }, [sbSession]);
  // Server is the source of truth for a PAID pass: reconcile the local plan to it.
  //  • 'pro'  → a real PromptPay purchase (here or on another device) → unlock.
  //  • 'free' → CONFIRMED no active pass (expired or never paid) → revoke a stale local
  //             Pro flag, so a prepaid pass actually ENDS and recurring revenue doesn't
  //             leak (and a DevTools-faked tm_plan can't keep Pro forever).
  //  • null   → offline / error / no session → leave the local plan untouched (never
  //             downgrade a genuinely-paid user just because the network blipped).
  // DEV_UNLOCK keeps the local test-unlock path working (so devs can preview gated UI).
  React.useEffect(() => {
    if (!sbSession) {
      // A missing local session is NOT proof of no pass: on load Supabase can momentarily
      // report no session while the stored token is still being restored (it lands a beat
      // later via onAuthStateChange). Revoking here would flash a genuinely-paid user back to
      // Free — green theme + default-fox avatar — AND poison tm_plan='free', so the flash
      // recurs every reload. So confirm authoritatively with the server (getUser) before
      // revoking: downgrade ONLY on an explicit 'free' entitlement; a null (truly no user /
      // offline) leaves the paid plan untouched, matching the with-session branch below.
      if (sessionChecked) {
        if (sb && (PLAN_RANK[plan] || 0) >= PLAN_RANK.pro && !DEV_UNLOCK) {
          let alive = true;
          fetchEntitlement().then((ent) => { if (!alive) return; if (ent === 'free') setPlan('free'); setPlanReady(true); });
          return () => { alive = false; };
        }
        setPlanReady(true); // free local plan, or dev-unlock → already authoritative
      }
      return;
    }
    let alive = true;
    fetchEntitlement().then((ent) => {
      if (!alive) return;
      if (ent != null) {
        const localRank = PLAN_RANK[plan] || 0, entRank = PLAN_RANK[ent] || 0;
        if (ent !== 'free' && entRank > localRank) setPlan(ent); // upgrade to whatever paid tier the server confirms (pro / proplus)
        else if (ent === 'free' && localRank >= PLAN_RANK.pro && !DEV_UNLOCK) setPlan('free');
      }
      setPlanReady(true); // reconciled (or offline/ent==null → leave local as-is, still settled)
    });
    return () => { alive = false; };
  }, [sbSession, sessionChecked]);
  // After a Lemon Squeezy checkout we leave the app and come back; re-check the server
  // entitlement on focus so Pro flips on without a manual reload. tm_ls_pending is stamped
  // right before redirect; we poll a few times because the webhook may land a beat after return.
  React.useEffect(() => {
    if (!sb || !sbSession) return;
    const recheck = () => {
      let pend = 0; try { pend = +(localStorage.getItem('tm_ls_pending') || 0); } catch (_) {}
      if (!pend || Date.now() - pend > 30 * 60 * 1000) return; // only soon after a checkout
      let tries = 0;
      const tick = () => {
        fetchEntitlement().then((ent) => {
          if (ent && ent !== 'free' && (PLAN_RANK[ent] || 0) > 0) {
            setPlan(ent); try { localStorage.removeItem('tm_ls_pending'); } catch (_) {}
          } else if (++tries < 6) { setTimeout(tick, 3000); }
        });
      };
      tick();
    };
    const onVis = () => { if (document.visibilityState === 'visible') recheck(); };
    window.addEventListener('focus', recheck);
    document.addEventListener('visibilitychange', onVis);
    recheck();
    return () => { window.removeEventListener('focus', recheck); document.removeEventListener('visibilitychange', onVis); };
  }, [sbSession]);
  // Privacy: share your daily score with friends? Default IN — your data is only ever
  // visible to mutual friends (RLS), and nobody can see it until you add them. Opting OUT
  // stops the push AND deletes your existing rows so you vanish from friends' boards.
  const [shareScores, setShareScoresState] = React.useState(() => { try { return localStorage.getItem(K.friendsShare) !== '0'; } catch { return true; } });
  const setShareScores = (on) => {
    setShareScoresState(on);
    try { localStorage.setItem(K.friendsShare, on ? '1' : '0'); } catch {}
    if (!on && sb && sbSession) { try { sb.from('daily_scores').delete().eq('user_id', sbSession.user.id).then(() => {}, () => {}); } catch (_) {} }
  };
  const pushRef = React.useRef(0);
  React.useEffect(() => {
    if (!sb || !sbSession || !shareScores) return;
    clearTimeout(pushRef.current);
    pushRef.current = setTimeout(() => {
      const now = Date.now();
      const dk = dayKey(now);
      const rest = (avatar && avatar.restDays) || [];
      const blocks = gradedBlocks(blocksForDate(schedule, done, now), tickets, now, activities);
      const cr = dayCredit(blocks, done[dk] || {}, nowMinutes(now), activities);
      const cur = streakStats(schedule, done, now, earliestTrackedDay(done, now), rest, tickets, activities).current;
      // Privacy: friends only ever see your %/streak — NOT your block-by-block schedule. We
      // deliberately do NOT push the day's plan (no `blocks`), so the cloud never stores who
      // does what at which time. Keeps the leaderboard competitive without the surveillance feel.
      sb.from('daily_scores').upsert({
        user_id: sbSession.user.id, day: isoDate(now),
        pct: Math.max(0, Math.min(100, cr.pct || 0)), // DB CHECK is 0..100; banked-ahead days exceed 100 and the whole upsert is rejected if not clamped here
        streak: cur, done_min: Math.round(cr.done), plan_min: Math.round(cr.plan),
        updated_at: new Date().toISOString(),
      }).then(() => {}, () => {});
    }, 1500);
    return () => clearTimeout(pushRef.current);
  }, [sbSession, shareScores, done, schedule, tickets, activities, avatar]);

  // ── Cloud sync (FREE, signed-in): whole app state ↔ Supabase `user_state` ───
  // One row per account: { user_id, data jsonb, rev int }. On login we PULL first and
  // only adopt the cloud when its rev is HIGHER than the rev this device last synced —
  // so a fresh device can't clobber a populated cloud, and a populated device seeds an
  // empty one. After reconcile, local edits push (debounced, rev++). Adopting the cloud
  // reuses the backup-import path (write keys + reload). Helpers: buildSyncState /
  // applySyncState / localSyncRev / localHasData (defined up top).
  const canSync = planAllows(plan, 'cloudSync');
  const [syncStatus, setSyncStatus] = React.useState('off'); // off|idle|syncing|synced|error
  const syncReadyRef = React.useRef(false); // true after first reconcile → gates pushes
  const dirtyRef = React.useRef(false);     // a local edit landed BEFORE reconcile finished → flush once ready
  const syncRevRef = React.useRef(localSyncRev());
  const syncPushRef = React.useRef(0);

  const pushCloud = React.useCallback(() => {
    if (!sb || !sbSession || !canSync) return;
    const uid = sbSession.user.id;
    // Optimistic concurrency: send the rev we last saw. The server writes ONLY if no newer
    // rev landed meanwhile (another device), bumps rev atomically, and returns the row. This
    // replaces the old blind upsert that let two devices silently clobber each other.
    const base = syncRevRef.current;
    setSyncStatus('syncing');
    const blob = buildSyncState();
    // Push image bytes to Storage FIRST (skips ones already uploaded), then write the row — which
    // now carries only idbimg: tokens, not the bytes. Keeps the DB row tiny so it scales.
    uploadImgsToStorage(uid, collectImgBlobs(blob)).then(() => {
      sb.rpc('push_user_state', { p_data: blob, p_base_rev: base }).then(({ data, error }) => {
        if (error) { setSyncStatus('error'); try { track('sync_error', { where: 'push', msg: String(error.message || '').slice(0, 120) }); } catch (_) {} return; }
        const row = Array.isArray(data) ? data[0] : data;
        if (!row) { setSyncStatus('error'); return; }
        if (row.applied === false) {
          // A newer state exists (another device wrote while we were editing) → ADOPT it
          // (write keys + reload), don't overwrite. Same safe path as reconcile. No data loss.
          applySyncState(row.data, row.rev, uid);
          return; // page reloads
        }
        syncRevRef.current = row.rev;
        try { localStorage.setItem(K_SYNC_REV, String(row.rev)); localStorage.setItem(K_SYNC_AT, String(Date.now())); } catch (_) {}
        setSyncStatus('synced');
      }, () => { setSyncStatus('error'); try { track('sync_error', { where: 'push_net' }); } catch (_) {} });
    });
  }, [sbSession, canSync]);

  // Reconcile once per session when we have a Supabase user + Pro.
  // EGRESS GUARD: pull only the tiny `rev` int first — NOT the whole image-laden `data` blob.
  // The heavy column is fetched lazily (adoptCloud) ONLY when the cloud is genuinely ahead and
  // we're about to adopt it. A normal reload where nothing changed elsewhere now downloads an
  // int instead of megabytes; downloading the full state on every reload was what blew the
  // free Egress quota (5 GB) with only a handful of users.
  React.useEffect(() => {
    syncReadyRef.current = false;
    if (!sb || !sbSession || !canSync) { setSyncStatus(canSync ? 'idle' : 'off'); return; }
    let cancelled = false;
    setSyncStatus('syncing');
    const myId = sbSession.user.id;
    const adoptCloud = (cloudRev) => {
      sb.from('user_state').select('data').eq('user_id', myId).maybeSingle()
        .then(({ data, error }) => {
          if (cancelled) return;
          if (error || !data) { setSyncStatus('error'); return; }
          applySyncState(data.data, cloudRev, myId); // take cloud → adopt (writes + reloads)
        }, () => { if (!cancelled) setSyncStatus('error'); });
    };
    sb.from('user_state').select('rev').eq('user_id', myId).maybeSingle()
      .then(({ data: head, error }) => {
        if (cancelled) return;
        if (error) { setSyncStatus('error'); return; }
        const cloudRev = head ? (head.rev || 0) : 0;
        const localRev = localSyncRev();
        if (head && cloudRev > localRev) {
          // Cloud is AHEAD (a newer edit from another device) → adopt it SILENTLY, like the big
          // multi-device apps: newest-wins, no "keep which version?" prompt. (We push on every
          // change while online so devices rarely diverge; the only loss case is unsynced offline
          // edits on this device while another device moved ahead — acceptable for a personal app.)
          adoptCloud(cloudRev); // fetch the heavy blob ONLY now, then writes + reloads
          return; // page reloads; nothing more to do
        }
        // Local is current/ahead, or cloud is empty → seed/refresh the cloud (no ping-pong
        // when revs are EQUAL — only push when we genuinely hold newer or unseen data).
        syncRevRef.current = Math.max(localRev, cloudRev);
        syncReadyRef.current = true;
        const wasDirty = dirtyRef.current; dirtyRef.current = false;
        if ((!head && localHasData()) || localRev > cloudRev) pushCloud(); // current state already includes any in-window edit
        else if (wasDirty) { clearTimeout(syncPushRef.current); syncPushRef.current = setTimeout(pushCloud, 1800); } // edit during reconcile → flush it now
        else setSyncStatus('synced');
      }, () => { if (!cancelled) setSyncStatus('error'); });
    return () => { cancelled = true; };
  }, [sbSession, canSync, pushCloud]);

  // Push local edits (debounced) once reconcile has run for this session.
  React.useEffect(() => {
    if (!sb || !sbSession || !canSync) return;
    if (!syncReadyRef.current) { dirtyRef.current = true; return; } // edited before reconcile finished → reconcile will flush it
    clearTimeout(syncPushRef.current);
    syncPushRef.current = setTimeout(pushCloud, 1800);
    return () => clearTimeout(syncPushRef.current);
  }, [activities, schedule, done, subnames, avatar, tickets, sbSession, canSync, pushCloud]);

  // --- Global Undo / Redo (Ctrl/Cmd+Z, Ctrl+Y or Ctrl+Shift+Z) ---
  // Snapshots all the data stores. Rapid changes within ~350ms (e.g. a drag) coalesce
  // into one undo step; a restore sets `applying` so it isn't logged as fresh history.
  const snapRef = React.useRef(null);
  const histRef = React.useRef({ past: [], future: [] });
  const applyingRef = React.useRef(false);
  const lastPushRef = React.useRef(0);
  // History lives in refs (no re-render on push); this tick forces the header ↶/↷ buttons to
  // recompute their enabled/disabled state whenever the past/future stacks change.
  const [, setHistTick] = React.useState(0);
  React.useEffect(() => {
    const snap = { activities, schedule, done, subnames, avatar, tickets };
    if (applyingRef.current) { applyingRef.current = false; snapRef.current = snap; return; }
    if (snapRef.current) {
      const t = (typeof performance !== 'undefined' && performance.now) ? performance.now() : lastPushRef.current + 1000;
      if (t - lastPushRef.current > 350) {
        histRef.current.past.push(snapRef.current);
        if (histRef.current.past.length > 120) histRef.current.past.shift();
        histRef.current.future = [];
        lastPushRef.current = t;
        setHistTick(n => n + 1); // enable the Undo button now that there's history
      }
    }
    snapRef.current = snap;
  }, [activities, schedule, done, subnames, avatar, tickets]);

  const applySnap = (s) => {
    applyingRef.current = true;
    setActivities(s.activities); setSchedule(s.schedule); setDone(s.done);
    setSubnames(s.subnames); setAvatar(s.avatar);
    if (s.tickets !== undefined) setTickets(s.tickets);
  };
  const undo = () => {
    const h = histRef.current;
    if (!h.past.length || !snapRef.current) return;
    h.future.push(snapRef.current);
    applySnap(h.past.pop());
    setHistTick(n => n + 1);
  };
  const redo = () => {
    const h = histRef.current;
    if (!h.future.length || !snapRef.current) return;
    h.past.push(snapRef.current);
    applySnap(h.future.pop());
    setHistTick(n => n + 1);
  };
  const canUndo = histRef.current.past.length > 0, canRedo = histRef.current.future.length > 0;
  React.useEffect(() => {
    const onKey = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const el = e.target;
      // Let the browser's native undo run while typing in a field.
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
      const k = (e.key || '').toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Every tab renders into ONE shared .app-main scroller, and switching tabs doesn't
  // remount it — so a tab left scrolled down (e.g. the Streak pill deep-links into
  // Progress and scrolls to the achievements section) would leave the NEXT tab scrolled
  // down too. Reset the scroller to the top on every tab change. The Streak deep-link
  // runs its scrollIntoView ~350ms later, so it still lands where it should.
  const mainRef = React.useRef(null);
  React.useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; }, [tab]);

  // All hooks are declared above this point so the login gate can early-return
  // without breaking the rules of hooks.
  // Arrived via a password-reset email link → set a new password first (the link establishes a
  // recovery session, so this must intercept BEFORE the app renders as "logged in").
  if (recovering && sb) return <RecoverScreen onDone={() => setRecovering(false)} />;
  if (!auth) {
    // Don't FLASH the LoginScreen while the Supabase session check is still in flight — a
    // returning Google/email user is about to be adopted into a local session (reverse
    // bridge). Show a brief loader; only fall through to LoginScreen once we've CONFIRMED
    // there's no session (sessionChecked).
    if (sb && !sessionChecked) return (
      <div className="app" style={{ display: 'grid', placeItems: 'center' }}>
        <span className="pp-spin" style={{ width: 28, height: 28 }} />
      </div>
    );
    return <LoginScreen onLogin={login} />;
  }

  let tabBody;
  if (tab === 'schedule') {
    tabBody = (
      <ScheduleScreen
        avatar={avatar} setAvatar={setAvatar} activities={activities} setActivities={setActivities}
        schedule={schedule} setSchedule={setSchedule} done={done} setDone={setDone}
        routines={routines} setRoutines={setRoutines} weekSlots={weekSlots} setWeekSlots={setWeekSlots}
        weekRoutines={weekRoutines} setWeekRoutines={setWeekRoutines}
        subnames={subnames} setSubnames={setSubnames}
        bands={bands} setBands={setBands}
        tickets={tickets} setTickets={setTickets}
        plan={plan} onOpenBilling={() => setBillingOpen(true)}
        session={sbSession}
      />
    );
  } else if (tab === 'history') {
    tabBody = <HistoryScreen activities={activities} schedule={schedule} setSchedule={setSchedule} done={done} avatar={avatar} setAvatar={setAvatar} tickets={tickets} plan={plan} onOpenTab={setTab} onOpenBilling={() => setBillingOpen(true)} session={sbSession} />;
  } else if (tab === 'avatar') {
    tabBody = <AvatarScreen avatar={avatar} setAvatar={setAvatar} plan={plan} schedule={schedule} done={done} tickets={tickets} activities={activities} onOpenBilling={() => setBillingOpen(true)} />;
  } else if (tab === 'settings') {
    tabBody = <SettingsScreen activities={activities} schedule={schedule} done={done} avatar={avatar} plan={plan} auth={auth} lang={lang} theme={theme} setTheme={setTheme} remindersOn={remindersOn} setReminders={setReminders} onSetLang={changeLang} clock24={clock24State} onSetClock24={changeClock24} bands={bands} setBands={setBands} onOpenBilling={() => setBillingOpen(true)} onReplayTutorial={() => setShowTutorial(true)} onReplayIntro={replayIntro} onShowRecap={showRecapNow} shareScores={shareScores} setShareScores={setShareScores} onSignOut={signOut} onRenameAccount={renameAccount} syncStatus={syncStatus} onSyncNow={pushCloud} />;
  } else {
    tabBody = (
      <MainScreen
        avatar={avatar} setAvatar={setAvatar} activities={activities} setActivities={setActivities}
        schedule={schedule} setSchedule={setSchedule} done={done} setDone={setDone} tickets={tickets}
        onCustomize={() => setTab('avatar')} onOpenTab={setTab}
        plan={plan} planReady={planReady} onOpenBilling={() => setBillingOpen(true)}
        session={sbSession}
      />
    );
  }

  return (
    <div className="app">
      <header className="app-header">
        <div className="brand">
          <svg className="brand-mark" viewBox="92 158 368 252" aria-hidden="true">
            <path d="M200 202 L300 402 H100 Z" fill="#4f6e29" />
            <path d="M322 166 L452 402 H192 Z" fill="#a3e635" />
          </svg>
          <span className="brand-text">Ijek — Train With Myself</span>
        </div>
        <div className="brand-sub">keep up with your committed self.</div>
        {/* Undo / redo for plan edits — top-right, available on every tab. */}
        <div className="hist-ctrl">
          <button className="hist-btn" onClick={undo} disabled={!canUndo} aria-label={tr('ui.undo')} title={tr('ui.undo')}>↶</button>
          <button className="hist-btn" onClick={redo} disabled={!canRedo} aria-label={tr('ui.redo')} title={tr('ui.redo')}>↷</button>
        </div>
      </header>
      <main ref={mainRef} className={'app-main' + (tab === 'schedule' ? ' is-schedule' : '')}>{tabBody}</main>
      <BottomNav active={tab} onChange={setTab} />
      {/* Floating To-Do — shown ONLY on the Schedule tab, above the nav. Opens the list as a sheet. */}
      {tab === 'schedule' && <TodoFab count={(() => { const n = Date.now(), tdk = dayKey(n), tdw = dayIndexMon(n); return todos.filter(td => todoScheduledOn(td, tdw) && !todoDoneOn(td, tdk)).length; })()} onClick={() => setTodoOpen(true)} />}
      {todoOpen && <TodoSheet todos={todos} setTodos={setTodos} avatar={avatar} onClose={() => setTodoOpen(false)} />}
      {!introDone ? (
        <OnboardingWizard avatar={avatar} lang={lang} onSetLang={changeLang} onComplete={finishIntro} />
      ) : (showTutorial || !tutorialDone) ? (
        <TutorialCarousel onDone={finishTutorial} onOpenTab={setTab} />
      ) : !onboarded && (
        <AvatarSetupModal avatar={avatar} fresh
          title={tr('onboard.title')}
          intro={tr('onboard.intro')}
          cta={tr('onboard.cta')} onSave={finishOnboard} onClose={null} />
      )}
      {billingOpen && <PlanBillingScreen plan={plan} setPlan={setPlan} onClose={() => setBillingOpen(false)} />}
      <FacePreviewHost />
      {celebrate && <MilestoneCelebration milestone={celebrate} name={(avatar && avatar.name) || 'JEK'} onClose={() => setCelebrate(null)} />}
      {recap && introDone && tutorialDone && onboarded && !billingOpen && !celebrate && (
        <WeeklyRecapModal recap={recap} avatar={avatar} plan={plan}
          onPlan={(t) => { setRecap(null); setTab(t); }}
          onUpgrade={() => { setRecap(null); setBillingOpen(true); }}
          onClose={() => setRecap(null)} />
      )}
    </div>
  );
}

// ===== Friends / Multiplayer (Supabase) — slice 1: sign-in + profile + friend code =====
// Read-only calendar of a friend's day — same vertical hour-axis look as the Schedule
// day view, but it draws the blocks the friend synced to `daily_scores.blocks`
// (compact shape: { s:startMin, e:endMin, n:name, em:glyph, d:done }). No interaction:
// you can see WHAT they planned and which they kept, not edit it.
function FriendDay({ blocks, name }) {
  const L = (en, th) => (_lang === 'th' ? th : en);
  const bl = (Array.isArray(blocks) ? blocks : [])
    .filter(b => b && typeof b.s === 'number' && typeof b.e === 'number' && b.e > b.s)
    .sort((a, b) => a.s - b.s);
  if (!bl.length) return (
    <p className="hist-note" style={{ textAlign: 'left' }}>
      {L((name || 'They') + " hasn't shared a plan for today.", (name || 'เพื่อน') + ' ยังไม่ได้แชร์แผนของวันนี้')}
    </p>
  );
  const SCALE = 1.2, PAD = 14; // px per minute / top+bottom padding — tighter than the editable view
  let lo = Math.max(0, Math.floor((Math.min.apply(null, bl.map(b => b.s)) - 30) / 60) * 60);
  let hi = Math.min(1440, Math.ceil((Math.max.apply(null, bl.map(b => b.e)) + 30) / 60) * 60);
  const y = (m) => (m - lo) * SCALE + PAD;
  const H = (hi - lo) * SCALE + PAD * 2;
  const hours = [];
  for (let h = lo; h <= hi; h += 60) hours.push(h);
  return (
    <div className="frd-cal">
      <div className="frd-scroll">
        <div className="frd-canvas" style={{ height: H }}>
          {hours.map(h => (
            <div key={h} className="frd-hour" style={{ top: y(h) }}>
              <span className="frd-hour-lbl">{fmtClock(h)}</span>
            </div>
          ))}
          {bl.map((b, i) => (
            <div key={i} className={'frd-block' + (b.d ? ' done' : '')}
              style={{ top: y(b.s), height: Math.max(16, (b.e - b.s) * SCALE) }}>
              <span className="frd-block-em">{b.em || '•'}</span>
              <span className="frd-block-nm">{b.n || L('Activity', 'กิจกรรม')}</span>
              <span className="frd-block-tm">{fmtClock(b.s)}</span>
              {b.d ? <span className="frd-check">✓</span> : null}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Networked: real accounts on Supabase, separate from the local mock auth. Magic-link
// sign-in → a `profiles` row (auto-created by the DB trigger) with a sharable friend code.
// Leaderboard + score push + "you vs friend" race come in the next slices.
const SELF_ID = '__committed__'; // synthetic user_id for the committed-self competitor row
const LEAGUE_MIN_PLAN = 15; // a day must commit ≥ this many planned minutes to score — kills tiny-plan gaming
// Contract score = how faithfully you kept the contract you made with YOURSELF — the day's % of
// committed minutes done (0..100). This is burden-fair on purpose: the app's whole thesis is
// "keep your promise to yourself", and everyone is measured against their OWN plan, so a person
// who can only commit 30 min and keeps it ranks alongside someone who committed 3 hours and kept
// it. We do NOT weight by raw minutes (that punished smaller, real lives and rewarded ambitious
// no-shows). The one guard: a day whose plan is below LEAGUE_MIN_PLAN doesn't count, so you can't
// farm a perfect 100% off a 5-minute plan. Effort (banked minutes) is kept only as a tiebreaker.
function contractDayPts(planMin, pct) {
  if ((planMin || 0) < LEAGUE_MIN_PLAN) return 0;
  return Math.max(0, Math.min(100, Math.round(pct || 0)));
}
function FriendsScreen({ avatar, rankEmoji, session, plan, onOpenBilling, selfStats }) {
  // Tiny inline bilingual helper so this slice doesn't touch the shared STRINGS table.
  // `session` is owned by Root (single Supabase auth source) and passed down.
  const L = (en, th) => (_lang === 'th' ? th : en);
  const [profile, setProfile] = React.useState(null);
  const [email, setEmail] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [code, setCode] = React.useState('');
  const [board, setBoard] = React.useState(null); // today's leaderboard rows | null = loading
  const [versus, setVersus] = React.useState(null); // friend user_id for the head-to-head race view
  const [lbMode, setLbMode] = React.useState('today'); // 'today' | 'week' (Friend League)
  const [league, setLeague] = React.useState(null); // weekly standings rows | null = loading
  const [lastWin, setLastWin] = React.useState(null); // last week's champion {name,emoji,pts,isMe} | null
  const [requests, setRequests] = React.useState([]); // incoming pending friend requests awaiting my accept
  const [showFormula, setShowFormula] = React.useState(false); // collapsible "how points work" explainer
  const modeRef = React.useRef('today'); // so the realtime handler knows which board to refresh
  React.useEffect(() => { modeRef.current = lbMode; }, [lbMode]);

  React.useEffect(() => {
    if (!sb || !session) { setProfile(null); return; }
    let alive = true;
    sb.from('profiles').select('display_name,avatar_emoji,avatar_aura,avatar_accessory,avatar_acc_pos,friend_code').eq('id', session.user.id).single()
      .then(({ data }) => { if (alive) setProfile(data || null); });
    return () => { alive = false; };
  }, [session]);

  // Sync the LOCAL avatar (name + emoji) up to the Supabase profile so the leaderboard
  // shows who you really are — not the email-prefix default. Skip photo (data:) avatars
  // (a data-URL doesn't belong in the DB / won't render as text); fall back to 🦊.
  React.useEffect(() => {
    if (!sb || !session || !profile || !avatar) return;
    const name = ((avatar.name || '').trim().slice(0, 24)) || profile.display_name;
    const em = (typeof avatar.emoji === 'string' && avatar.emoji.slice(0, 5) !== 'data:') ? avatar.emoji : '🦊';
    // Publish the aura ONLY while Pro — so friends never render a glow a downgraded user no
    // longer pays for. The owner gates here; viewers render whatever the server holds (no
    // per-viewer gate — that's the flex: Free users SEE Pro users glow).
    const aura = (planAllows(plan, 'aura') && avatar.aura && AURA_IDS.has(avatar.aura)) ? avatar.aura : 'none';
    // Avatar decorations published for friends to render: avatar_accessory = the worn TROPHY emoji
    // (or '' if none yet), avatar_acc_pos = the free STICKER array [{emoji,x,y,scale}].
    const rankEm = rankEmoji || '';
    const stickers = _validStickers(avatar.stickers);
    const sameSt = JSON.stringify(stickers) === JSON.stringify(_validStickers(profile.avatar_acc_pos));
    if (sameSt && name === profile.display_name && em === profile.avatar_emoji && aura === (profile.avatar_aura || 'none') && rankEm === (profile.avatar_accessory || '')) return; // already in sync
    sb.from('profiles').update({ display_name: name, avatar_emoji: em, avatar_aura: aura, avatar_accessory: rankEm, avatar_acc_pos: stickers }).eq('id', session.user.id)
      .then(() => setProfile(p => p ? { ...p, display_name: name, avatar_emoji: em, avatar_aura: aura, avatar_accessory: rankEm, avatar_acc_pos: stickers } : p), () => {});
  }, [session, avatar, profile, plan, rankEmoji]);

  // Today's leaderboard = ME + ALL my friends (friends with no score yet show at 0%, so
  // the board never looks empty and you can see who hasn't started). Refresh on sign-in/
  // profile load AND live via a realtime channel on daily_scores. RLS limits visibility
  // to me + my friends, so the `.in(ids)` is just a narrowing, not a trust boundary.
  const loadBoard = React.useCallback(async () => {
    if (!sb || !session) return;
    const myId = session.user.id;
    const fr = await sb.from('friendships').select('friend_id').eq('user_id', myId).eq('status', 'accepted');
    const ids = [myId, ...((fr.data || []).map(r => r.friend_id))];
    const [profs, scores] = await Promise.all([
      sb.from('profiles').select('id,display_name,avatar_emoji,avatar_aura,avatar_accessory,avatar_acc_pos').in('id', ids),
      sb.from('daily_scores').select('user_id,pct,streak,done_min,plan_min').eq('day', isoDate(Date.now())).in('user_id', ids),
    ]);
    const byU = {}; (scores.data || []).forEach(s => { byU[s.user_id] = s; });
    const rows = (profs.data || []).map(p => {
      const s = byU[p.id] || { pct: 0, streak: 0, done_min: 0, plan_min: 0 };
      return { user_id: p.id, pct: s.pct, streak: s.streak, done_min: s.done_min, plan_min: s.plan_min,
               profiles: { display_name: p.display_name, avatar_emoji: p.avatar_emoji, avatar_aura: p.avatar_aura, avatar_accessory: p.avatar_accessory, avatar_acc_pos: p.avatar_acc_pos } };
    });
    rows.sort((a, b) => (b.pct - a.pct) || (b.streak - a.streak));
    setBoard(rows);
  }, [session]);
  React.useEffect(() => { loadBoard(); }, [loadBoard, profile]);
  React.useEffect(() => {
    if (!sb || !session) return;
    const ch = sb.channel('scores-' + session.user.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_scores' }, () => { loadBoard(); if (modeRef.current === 'week') loadLeague(); })
      .subscribe();
    return () => { try { sb.removeChannel(ch); } catch (_) {} };
  }, [session, loadBoard]); // loadLeague intentionally omitted: it's declared below (deps-array TDZ); the body calls it lazily on realtime events, by which point it's initialized

  // Friend League = this week's standings (Mon→today) for ME + friends, aggregated CLIENT-
  // side from the same `daily_scores` rows — no extra table. Each day earns up to 100 "pts"
  // (capped so one huge day can't run away with the week); ties break on days kept (pct≥60).
  const loadLeague = React.useCallback(async () => {
    if (!sb || !session) return;
    const myId = session.user.id;
    const fr = await sb.from('friendships').select('friend_id').eq('user_id', myId).eq('status', 'accepted');
    const ids = [myId, ...((fr.data || []).map(r => r.friend_id))];
    const monday = isoDate(startOfWeek(Date.now()));
    const today = isoDate(Date.now());
    const [profs, scores] = await Promise.all([
      sb.from('profiles').select('id,display_name,avatar_emoji,avatar_aura,avatar_accessory,avatar_acc_pos').in('id', ids),
      sb.from('daily_scores').select('user_id,pct,done_min,plan_min,day').gte('day', monday).lte('day', today).in('user_id', ids),
    ]);
    const agg = {};
    (scores.data || []).forEach(s => {
      const a = agg[s.user_id] || (agg[s.user_id] = { pts: 0, days: 0, eff: 0 });
      a.pts += contractDayPts(s.plan_min, s.pct); // weekly total = Σ daily contract % (each capped 100)
      a.eff += Math.max(0, s.done_min || 0);      // banked minutes — tiebreaker only, never the score
      if ((s.pct || 0) >= 60) a.days += 1;
    });
    const rows = (profs.data || []).map(p => {
      const a = agg[p.id] || { pts: 0, days: 0, eff: 0 };
      return { user_id: p.id, pts: Math.round(a.pts), days: a.days, eff: Math.round(a.eff),
               profiles: { display_name: p.display_name, avatar_emoji: p.avatar_emoji, avatar_aura: p.avatar_aura, avatar_accessory: p.avatar_accessory, avatar_acc_pos: p.avatar_acc_pos } };
    });
    rows.sort((x, y) => (y.pts - x.pts) || (y.eff - x.eff) || (y.days - x.days));
    setLeague(rows);
  }, [session]);

  // Last week's champion (the crown banner). Static past data — no realtime needed; just
  // re-runs when you open the League tab. Winner = most pts over the previous Mon→Sun.
  const loadLastWin = React.useCallback(async () => {
    if (!sb || !session) { setLastWin(null); return; }
    const myId = session.user.id;
    const fr = await sb.from('friendships').select('friend_id').eq('user_id', myId).eq('status', 'accepted');
    const ids = [myId, ...((fr.data || []).map(r => r.friend_id))];
    const mon = startOfWeek(Date.now());
    const lastMon = isoDate(addDays(mon, -7)), lastSun = isoDate(addDays(mon, -1));
    const [profs, scores] = await Promise.all([
      sb.from('profiles').select('id,display_name,avatar_emoji,avatar_aura,avatar_accessory,avatar_acc_pos').in('id', ids),
      sb.from('daily_scores').select('user_id,pct,plan_min').gte('day', lastMon).lte('day', lastSun).in('user_id', ids),
    ]);
    const agg = {};
    (scores.data || []).forEach(s => { agg[s.user_id] = (agg[s.user_id] || 0) + contractDayPts(s.plan_min, s.pct); });
    let winId = null, winPts = 0;
    Object.keys(agg).forEach(u => { if (agg[u] > winPts) { winPts = agg[u]; winId = u; } });
    if (!winId || winPts <= 0) { setLastWin(null); return; }
    const wp = (profs.data || []).find(p => p.id === winId) || {};
    setLastWin({ name: wp.display_name || '—', emoji: wp.avatar_emoji || '🦊', aura: wp.avatar_aura || 'none', deco: friendDecorations(wp), pts: Math.round(winPts), isMe: winId === myId });
  }, [session]);
  React.useEffect(() => { if (lbMode === 'week') { loadLeague(); loadLastWin(); } }, [lbMode, loadLeague, loadLastWin, profile]);

  const addFriend = async () => {
    const c = code.trim();
    if (!c || busy) return;
    // Free plan races up to FREE_FRIEND_CAP friends; Pro is unlimited. Core social stays
    // free (the invite loop must work for everyone) — only the cap is gated.
    const friendCount = board ? board.filter(r => r.user_id !== session.user.id).length : 0;
    if (!planAllows(plan, 'friendsUnlimited') && friendCount >= FREE_FRIEND_CAP) {
      setMsg(L('Free races up to ' + FREE_FRIEND_CAP + ' friends — go Pro for unlimited.',
               'แพ็กฟรีแข่งได้สูงสุด ' + FREE_FRIEND_CAP + ' คน — อัปเป็น Pro เพื่อไม่จำกัด'));
      if (onOpenBilling) onOpenBilling();
      return;
    }
    setBusy(true); setMsg('');
    const { data, error } = await sb.rpc('add_friend', { code: c });
    setBusy(false);
    if (error) { setMsg('❌ ' + error.message); return; }
    if (data && data.ok) {
      setCode('');
      // 'pending' = a one-way request the other person must accept; 'accepted' = we're now
      // mutual (either we were already friends, or they'd already requested me).
      if (data.status === 'pending') { setMsg(L('✅ Request sent — they need to accept before you can race.', '✅ ส่งคำขอแล้ว — รอเพื่อนตอบรับก่อนถึงจะแข่งกันได้')); try { track('friend_requested'); } catch (_) {} }
      else { setMsg(L('✅ Friend added!', '✅ เพิ่มเพื่อนแล้ว!')); loadBoard(); try { track('friend_added'); } catch (_) {} }
    }
    else setMsg(data && data.error === 'self' ? L("That's your own code.", 'นี่รหัสของคุณเอง') : L('Code not found.', 'ไม่พบรหัสนี้'));
  };

  // Incoming friend requests waiting for MY approval. Loaded via a security-definer RPC so I
  // can see the requester's name/emoji even though they aren't an accepted friend yet.
  const loadRequests = React.useCallback(async () => {
    if (!sb || !session) { setRequests([]); return; }
    const { data } = await sb.rpc('incoming_requests');
    setRequests(Array.isArray(data) ? data : []);
  }, [session]);
  React.useEffect(() => { loadRequests(); }, [loadRequests, profile]);
  const acceptRequest = async (rid) => {
    if (busy) return;
    setBusy(true);
    const { data, error } = await sb.rpc('accept_friend', { rid });
    setBusy(false);
    if (!error && data && data.ok) { setRequests(rs => rs.filter(r => r.user_id !== rid)); loadBoard(); try { track('friend_accepted'); } catch (_) {} }
    else setMsg('❌ ' + ((error && error.message) || (data && data.error) || 'failed'));
  };
  const declineRequest = async (rid) => {
    if (busy) return;
    setBusy(true);
    await sb.rpc('decline_friend', { rid });
    setBusy(false);
    setRequests(rs => rs.filter(r => r.user_id !== rid));
  };

  // Viral loop: an invite link carrying your code (?add=CODE). Recipients who open it
  // land with the add-friend field pre-filled, so adding is one tap.
  React.useEffect(() => {
    try { const a = new URLSearchParams(location.search).get('add'); if (a) setCode(a.toUpperCase()); } catch (_) {}
  }, []);
  const invite = async () => {
    if (!profile) return;
    try { track('invite_shared'); } catch (_) {}
    const url = location.origin + location.pathname + '?add=' + profile.friend_code;
    const text = L('Race me on Ijek — keep up with your committed self! My friend code: ' + profile.friend_code,
                   'มาแข่งกันบน Ijek — ตามให้ทันตัวที่สัญญาไว้! รหัสเพื่อนของฉัน: ' + profile.friend_code);
    try { if (navigator.share) { await navigator.share({ title: 'Ijek', text, url }); return; } } catch (_) { return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); setMsg(L('Invite copied — paste it to a friend!', 'คัดลอกคำเชิญแล้ว — ส่งให้เพื่อนได้เลย!')); } catch (_) {}
  };
  // Viral brag: share your current league standing, carrying your friend code so anyone who
  // opens the link lands ready to add you (same ?add= loop as invite()).
  const shareLeague = async () => {
    if (!profile || !league || !session) return;
    const idx = league.findIndex(r => r.user_id === session.user.id);
    if (idx < 0) return;
    const rank = idx + 1, total = league.length, pts = league[idx].pts;
    const lead = (rank === 1 && pts > 0);
    try { track('league_shared', { rank, total }); } catch (_) {}
    const url = location.origin + location.pathname + '?add=' + profile.friend_code;
    const text = lead
      ? L('🏆 I’m #1 in my Ijek league this week with ' + pts + ' pts! Think you can keep up? My code: ' + profile.friend_code,
          '🏆 สัปดาห์นี้ฉันอันดับ 1 ในลีก Ijek ด้วย ' + pts + ' แต้ม! คิดว่าตามทันไหม? รหัสของฉัน: ' + profile.friend_code)
      : L('I’m #' + rank + '/' + total + ' in my Ijek league this week (' + pts + ' pts) 🏆 Race me — keep up with your committed self! My code: ' + profile.friend_code,
          'สัปดาห์นี้ฉันอันดับ ' + rank + '/' + total + ' ในลีก Ijek (' + pts + ' แต้ม) 🏆 มาแข่งกัน — ตามให้ทันตัวที่สัญญาไว้! รหัสของฉัน: ' + profile.friend_code);
    try { if (navigator.share) { await navigator.share({ title: 'Ijek', text, url }); return; } } catch (_) { return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); setMsg(L('Standing copied — paste it to a friend!', 'คัดลอกอันดับแล้ว — ส่งให้เพื่อนได้เลย!')); } catch (_) {}
  };

  if (!sb) return (
    <div className="friends-screen">
      <div className="section-label">{L('Friends', 'เพื่อน')}</div>
      <p className="hist-note" style={{ textAlign: 'left' }}>{L('Multiplayer is not configured on this build.', 'โหมดเพื่อนยังไม่ได้ตั้งค่าในบิลด์นี้')}</p>
    </div>
  );

  const sendLink = async () => {
    // strip whitespace + invisible chars (zero-width/BOM) that autofill/paste can inject — GoTrue rejects them as "invalid format"
    const e = email.replace(/[\s\u200B-\u200D\uFEFF\u00A0]/g, '').toLowerCase();
    if (!e || busy) return;
    setBusy(true); setMsg('');
    const { error } = await sb.auth.signInWithOtp({ email: e, options: { emailRedirectTo: authRedirect() } });
    setBusy(false);
    setMsg(error ? ('❌ ' + error.message) : L('✉️ Magic link sent — open the email and tap the link to sign in.', '✉️ ส่งลิงก์เข้าสู่ระบบไปที่อีเมลแล้ว เปิดเมลแล้วแตะลิงก์เพื่อเข้าสู่ระบบ'));
  };
  const copyCode = () => { if (profile) { try { navigator.clipboard.writeText(profile.friend_code); setMsg(L('Copied!', 'คัดลอกแล้ว!')); } catch (_) {} } };
  const signOut = async () => { await sb.auth.signOut(); setProfile(null); setMsg(''); };

  if (session === undefined) return <div className="friends-screen"><p className="hist-note">…</p></div>;

  if (!session) return (
    <div className="friends-screen">
      <div className="section-label">{L('Race your friends', 'แข่งกับเพื่อน')}</div>
      <p className="hist-note" style={{ textAlign: 'left', marginBottom: 14 }}>
        {L('Sign in to add friends and see who keeps up with their committed self best. Your local data stays as-is.',
           'เข้าสู่ระบบเพื่อแอดเพื่อนและดูว่าใครตามทันตัวที่สัญญาไว้ได้ดีกว่า ข้อมูลในเครื่องของคุณยังอยู่เหมือนเดิม')}
      </p>
      {/* Gmail-only sign-in: one tap, no magic-link email round-trip. */}
      <button className="login-social google" style={{ marginTop: 14 }}
        onClick={() => { if (sb) sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: authRedirect() } }); }}>
        <GoogleMark /> {tr('login.google')}
      </button>
      {msg && <p className="hist-note" style={{ textAlign: 'left', marginTop: 10 }}>{msg}</p>}
    </div>
  );

  // Merge the committed-self competitor into the live board/league (client-side only), then
  // re-sort so it ranks by the same rules as real friends. selfStats comes from HistoryScreen.
  const _selfProfile = { display_name: (avatar && avatar.name) || 'JEK', avatar_emoji: (avatar && avatar.emoji) || '🦊', avatar_aura: 'none', avatar_accessory: '', avatar_acc_pos: [] };
  const _selfBoardRow = selfStats ? { user_id: SELF_ID, pct: selfStats.todayPct, streak: selfStats.streak, done_min: selfStats.todayDoneMin || 0, plan_min: selfStats.todayDoneMin || 0, profiles: _selfProfile, _self: true } : null;
  const _selfLeagueRow = selfStats ? { user_id: SELF_ID, pts: selfStats.leaguePts, days: selfStats.leagueDays, eff: selfStats.leagueEff || 0, profiles: _selfProfile, _self: true } : null;
  // Today board ranks by today's contract % (burden-fair), banked minutes break ties, then streak.
  const boardAll = board ? (_selfBoardRow ? [...board, _selfBoardRow] : board.slice()).sort((a, b) => ((b.pct || 0) - (a.pct || 0)) || ((b.done_min || 0) - (a.done_min || 0)) || (b.streak - a.streak)) : board;
  const leagueAll = league ? (_selfLeagueRow ? [...league, _selfLeagueRow] : league.slice()).sort((a, b) => (b.pts - a.pts) || ((b.eff || 0) - (a.eff || 0)) || (b.days - a.days)) : league;
  // My OWN live numbers for the profile hero (real me, not the committed-self competitor):
  // read straight off the server board/league rows so today's %/streak/pts match the board.
  const _meBoard = (boardAll && session) ? boardAll.find(r => r.user_id === session.user.id) : null;

  return (
    <div className="friends-screen">
      <div className="section-label">{L('Your profile', 'โปรไฟล์ของคุณ')}</div>
      <div className="me-hero">
        <span className={'me-hero-face' + auraClass(avatar && avatar.aura)}>
          {renderFace((avatar && avatar.emoji) || '🦊', 46, false, false, false, avatar && avatar.aura, (avatar && avatar.faceCrop) || null, avatar && avatar.faceAdjust)}
          {renderBadges(_selfBadges, 'av-acc-sm', 46)}
        </span>
        <div className="me-hero-info">
          <div className="me-hero-name">{(avatar && avatar.name) || (profile && profile.display_name) || '…'}</div>
          <div className="me-hero-stats">
            <span className="me-stat you"><b>{_meBoard ? _meBoard.pct : 0}%</b>{L('today', 'วันนี้')}</span>
            <span className="me-stat"><b>🔥 {_meBoard ? _meBoard.streak : 0}</b>{L('streak', 'สตรีค')}</span>
          </div>
          <button className="me-code" onClick={copyCode}>{profile ? profile.friend_code : '…'} ⧉</button>
        </div>
      </div>
      <button className="btn-primary btn-block" style={{ marginTop: 10 }} onClick={invite} disabled={!profile}>
        {L('📨 Invite a friend', '📨 เชิญเพื่อน')}
      </button>

      <div className="section-label" style={{ marginTop: 8 }}>{L('Add a friend', 'เพิ่มเพื่อน')}</div>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        <input className="input-underline" style={{ flex: 1 }} placeholder={L('friend code e.g. IJEK-AB12', 'รหัสเพื่อน เช่น IJEK-AB12')}
          value={code} onChange={e => setCode(e.target.value.toUpperCase())} onKeyDown={e => { if (e.key === 'Enter') addFriend(); }} />
        <button className="btn-primary" disabled={busy} onClick={addFriend}>{L('Add', 'เพิ่ม')}</button>
      </div>
      {msg && <p className="hist-note" style={{ textAlign: 'left', marginTop: 6 }}>{msg}</p>}

      {requests.length > 0 && (
        <div style={{ marginTop: 14 }}>
          <div className="section-label">{L('Friend requests', 'คำขอเป็นเพื่อน')} ({requests.length})</div>
          <div className="set-card">
            {requests.map(r => (
              <div key={r.user_id} className="set-row" style={{ alignItems: 'center', gap: 8 }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
                  <span style={{ fontSize: 20 }}>{renderFace(r.avatar_emoji || '🦊', 20)}</span>
                  <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.display_name || '—'}</span>
                </span>
                <span style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                  <button className="btn-primary" style={{ padding: '4px 12px' }} disabled={busy} onClick={() => acceptRequest(r.user_id)}>{L('Accept', 'ตอบรับ')}</button>
                  <button className="btn-ghost" style={{ padding: '4px 12px' }} disabled={busy} onClick={() => declineRequest(r.user_id)}>{L('Decline', 'ปฏิเสธ')}</button>
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {versus ? (() => {
        // Head-to-head: read straight off `board` so realtime updates the bars live.
        const meRow = (boardAll && session) ? boardAll.find(r => r.user_id === session.user.id) : null;
        const frRow = boardAll ? boardAll.find(r => r.user_id === versus) : null;
        const fp = (frRow && frRow.profiles) || {}, mp = (meRow && meRow.profiles) || {};
        const mePct = meRow ? meRow.pct : 0, frPct = frRow ? frRow.pct : 0;
        const meDone = meRow ? meRow.done_min : 0, frDone = frRow ? frRow.done_min : 0;
        const mePlan = meRow ? meRow.plan_min : 0, frPlan = frRow ? frRow.plan_min : 0; // the avatar's committed workload — shown so the duo's contract size is visible
        // Head-to-head races today's contract % (how faithfully each duo kept its own promise),
        // not raw minutes — so different life-burdens compete fairly. Both used their OWN plan.
        const diff = mePct - frPct;
        const verdict = diff > 0 ? L('You lead by ' + diff + '%', 'คุณนำอยู่ ' + diff + '%')
          : diff < 0 ? L('You trail by ' + (-diff) + '%', 'คุณตามหลัง ' + (-diff) + '%')
          : L('Neck and neck — keep going!', 'สูสีมาก — ไปต่อ!');
        const meLead = diff > 0, frLead = diff < 0;
        const tot = mePct + frPct;
        // Tug-of-war: the boundary sits at each player's SHARE of the combined %, so the rope is
        // pulled toward whoever's behind. Both at 0 → dead centre (50/50).
        const meShare = tot ? Math.round(mePct / tot * 100) : 50;
        return (
          <div className="vs-arena">
            <button className="fr-back" onClick={() => setVersus(null)}>← {L('Back to leaderboard', 'กลับไปอันดับ')}</button>
            <div className="vs-teamttl">{L('Your duo', 'ทีมคุณ')} <i>vs</i> {(frRow && frRow._self) ? L('your committed self', 'ตัวที่สัญญาไว้') : (fp.display_name || '—')}</div>
            <div className="vs-stage">
              <div className={'vs-side me' + (meLead ? ' lead' : '')}>
                {meLead && <span className="vs-crown">👑</span>}
                <span className={'vs-face' + auraClass(avatar && avatar.aura)}><span className="vs-face-in">{renderFace((avatar && avatar.emoji) || mp.avatar_emoji || '🦊', 50, false, false, false, avatar && avatar.aura, (avatar && avatar.faceCrop) || null, avatar && avatar.faceAdjust)}{renderBadges(_selfBadges, 'av-acc-sm', 50)}</span></span>
                <span className="vs-name">{L('You', 'คุณ')}</span>
                <span className="vs-team">{L('you + avatar', 'คุณ + อวตาร')}</span>
                <span className="vs-pct">{mePct}<i>%</i></span>
                <span className="vs-sub">{Math.round(meDone)}/{Math.round(mePlan)}{L('m', 'น')} {L('kept', 'ทำแล้ว')}</span>
                <span className="vs-streak">🔥 {meRow ? meRow.streak : 0}</span>
              </div>
              <div className="vs-badge">VS</div>
              <div className={'vs-side them' + (frLead ? ' lead' : '')}>
                {frLead && <span className="vs-crown">👑</span>}
                <span className={'vs-face' + auraClass(fp.avatar_aura, true)}><span className="vs-face-in">{renderFace(fp.avatar_emoji || '🦊', 50, false, false, false, fp.avatar_aura)}{renderBadges(friendDecorations(fp), 'av-acc-sm', 50)}</span></span>
                <span className="vs-name">{fp.display_name || '—'}</span>
                <span className="vs-team">{L('them + avatar', 'เขา + อวตาร')}</span>
                <span className="vs-pct">{frPct}<i>%</i></span>
                <span className="vs-sub">{Math.round(frDone)}/{Math.round(frPlan)}{L('m', 'น')} {L('kept', 'ทำแล้ว')}</span>
                <span className="vs-streak">🔥 {frRow ? frRow.streak : 0}</span>
              </div>
            </div>
            <div className="vs-tug" role="img" aria-label={mePct + '% vs ' + frPct + '%'}>
              <span className="vs-tug-me" style={{ width: meShare + '%' }} />
              <span className="vs-tug-them" style={{ width: (100 - meShare) + '%' }} />
              <span className="vs-knot" style={{ left: meShare + '%' }} />
            </div>
            <div className={'fr-verdict' + (diff >= 0 ? ' good' : '')}>{verdict}</div>
            {/* Privacy: we show the head-to-head %/streak only — never a friend's block-by-block day. */}
            {!(frRow && frRow._self) && (
            <button className="fr-back" style={{ color: 'var(--danger)', alignSelf: 'center' }}
              onClick={async () => { const { error } = await sb.rpc('remove_friend', { fid: versus }); if (error) { setMsg('❌ ' + error.message); return; } setVersus(null); loadBoard(); }}>
              {L('Remove friend', 'ลบเพื่อน')}
            </button>
            )}
          </div>
        );
      })() : (<React.Fragment>
      <div className="lb-tabs" style={{ marginTop: 10 }}>
        <button className={'lb-tab' + (lbMode === 'today' ? ' on' : '')} onClick={() => setLbMode('today')}>{L('Today', 'วันนี้')}</button>
        <button className={'lb-tab' + (lbMode === 'week' ? ' on' : '')} onClick={() => setLbMode('week')}>{L('🏆 League', '🏆 ลีก')}</button>
      </div>
      <button className="fmla-chip" onClick={() => setShowFormula(v => !v)}>{L('How points work', 'แต้มคิดยังไง?')} <span className="fmla-i">ⓘ</span></button>
      {showFormula && (
        <p className="fmla-note">{L('Score = how faithfully you kept your own contract — the % of your committed minutes you actually did. Everyone races their OWN plan, so a packed day and a light day compete fairly. The league adds up each day’s %. (A trivially tiny plan doesn’t count, and banked minutes only break ties.)', 'คะแนน = ความซื่อสัตย์ต่อสัญญาที่ให้กับตัวเอง — % ของนาทีที่ตั้งไว้แล้วทำได้จริง ทุกคนวัดกับแผนของตัวเอง วันงานแน่นกับวันเบาจึงแข่งกันแฟร์ ลีกรวม % รายวันทั้งสัปดาห์ (แผนจิ๋วเกินไปไม่นับ และนาทีที่ทำได้ใช้แค่ตัดสินเสมอ)')}</p>
      )}
      {lbMode === 'today' ? (<React.Fragment>
      {!boardAll ? <p className="hist-note">…</p>
       : boardAll.length === 0 ? <p className="hist-note" style={{ textAlign: 'left' }}>{L('No scores yet today — add friends and check off your blocks!', 'ยังไม่มีคะแนนวันนี้ — แอดเพื่อนแล้วเริ่มเช็กบล็อกได้เลย!')}</p>
       : (
        (() => {
          // Rank by today's contract % (how faithfully each duo kept its own promise). Bars map
          // straight to the % so the gap reads at a glance; banked minutes show as the sub-number.
          return (
        <div className="lb-list">
          {boardAll.map((r, i) => {
            const me = session && r.user_id === session.user.id;
            const isSelf = r._self;
            const p = r.profiles || {};
            const pct = r.pct || 0;
            return (
              <div key={r.user_id} className={'lb-row' + (me ? ' me' : ' tap')}
                onClick={me ? undefined : () => setVersus(r.user_id)}>
                <div className="lb-main">
                  <span className="lb-rank">{(pct > 0 && i < 3) ? ['🥇', '🥈', '🥉'][i] : (i + 1)}</span>
                  <span className={'lb-emoji' + auraClass(p.avatar_aura, true)}>{renderFace((me ? avatar.emoji : p.avatar_emoji) || '🦊', 20)}{renderBadges(me ? _selfBadges : friendDecorations(p), 'av-acc-xs', 20)}</span>
                  <span className="lb-name">{p.display_name || '—'}{me ? L(' (you)', ' (คุณ)') : ''}{isSelf ? <span className="lb-self-tag">{L('committed self', 'ตัวที่สัญญาไว้')}</span> : ''}</span>
                  <span className="lb-streak">🔥 {r.streak}</span>
                  <span className="lb-pct"><b>{pct}%</b><small>{Math.round(r.done_min || 0)}{L('m', 'น')}</small></span>
                </div>
                <span className="lb-bar"><span className={'lb-fill' + (me ? ' me' : '')} style={{ width: Math.min(100, pct) + '%' }} /></span>
              </div>
            );
          })}
        </div>
          );
        })()
      )}
      {boardAll && boardAll.length > 1 && <p className="hist-note" style={{ textAlign: 'left' }}>{L('Tap anyone to race your duo head-to-head.', 'แตะใครก็ได้เพื่อแข่งทีมต่อทีม')}</p>}
      </React.Fragment>) : (() => {
        // Friend League — this week's running total. Bars are relative to the week's leader.
        const now = Date.now();
        const daysLeft = 7 - dayIndexMon(now); // counts today as still in play (Sun → 1)
        const top = (leagueAll && leagueAll.length) ? Math.max(1, leagueAll[0].pts) : 1;
        return (<React.Fragment>
          {lastWin && (
            <div className={'lg-champ' + (lastWin.isMe ? ' me' : '')}>
              <span className={'lg-champ-em' + auraClass(lastWin.aura, true)}>{renderFace(lastWin.emoji || '🦊', 26)}{renderBadges(lastWin.deco, 'av-acc-xs', 26)}</span>
              <span className="lg-champ-txt">
                <span className="lg-champ-ttl">{lastWin.isMe ? L('🏆 You won last week!', '🏆 คุณชนะเมื่อสัปดาห์ที่แล้ว!') : L('🏆 Last week’s champion', '🏆 แชมป์สัปดาห์ที่แล้ว')}</span>
                <span className="lg-champ-sub">{(lastWin.isMe ? '' : lastWin.name + ' · ') + lastWin.pts + L(' pts', ' แต้ม')}</span>
              </span>
            </div>
          )}
          <div className="lg-head">
            <span className="lg-week">{L('Week of ', 'สัปดาห์ของ ') + isoDate(startOfWeek(now)).slice(5)}</span>
            <span className="lg-left">{daysLeft <= 1 ? L('Final day!', 'วันสุดท้าย!') : L(daysLeft + ' days left', 'เหลือ ' + daysLeft + ' วัน')}</span>
          </div>
          {!leagueAll ? <p className="hist-note">…</p>
           : leagueAll.length === 0
             ? <p className="hist-note" style={{ textAlign: 'left' }}>{L('No points yet this week — keep your blocks to climb the league!', 'สัปดาห์นี้ยังไม่มีแต้ม — รักษาบล็อกให้ได้เพื่อไต่อันดับลีก!')}</p>
           : (
            <div className="lb-list">
              {leagueAll.map((r, i) => {
                const me = session && r.user_id === session.user.id;
                const isSelf = r._self;
                const p = r.profiles || {};
                return (
                  <div key={r.user_id} className={'lb-row' + (me ? ' me' : ' tap')}
                    onClick={me ? undefined : () => setVersus(r.user_id)}>
                    <div className="lb-main">
                      <span className="lb-rank">{(r.pts > 0 && i === 0) ? '👑' : (r.pts > 0 && i < 3) ? ['🥇', '🥈', '🥉'][i] : (i + 1)}</span>
                      <span className={'lb-emoji' + auraClass(p.avatar_aura, true)}>{renderFace((me ? avatar.emoji : p.avatar_emoji) || '🦊', 20)}{renderBadges(me ? _selfBadges : friendDecorations(p), 'av-acc-xs', 20)}</span>
                      <span className="lb-name">{p.display_name || '—'}{me ? L(' (you)', ' (คุณ)') : ''}{isSelf ? <span className="lb-self-tag">{L('committed self', 'ตัวที่สัญญาไว้')}</span> : ''}</span>
                      <span className="lb-streak">{r.days}{L('d', 'ว')}</span>
                      <span className="lb-pct"><b>{r.pts}</b><small>{L('pts', 'แต้ม')}</small></span>
                    </div>
                    <span className="lb-bar"><span className={'lb-fill' + (me ? ' me' : '')} style={{ width: Math.min(100, Math.round(r.pts / top * 100)) + '%' }} /></span>
                  </div>
                );
              })}
            </div>
          )}
          {league && league.some(r => r.pts > 0) && session && league.some(r => r.user_id === session.user.id) && (
            <button className="btn-ghost btn-block" style={{ marginTop: 10 }} onClick={shareLeague}>{L('📣 Share my standing', '📣 แชร์อันดับของฉัน')}</button>
          )}
          <p className="hist-note" style={{ textAlign: 'left' }}>{L('Each day’s duo Contract Points add up all week. Top of the league on Sunday wins. 👑 = current leader.', 'แต้มทีม (Contract Points) ของแต่ละวันสะสมรวมทั้งสัปดาห์ ใครนำเมื่อวันอาทิตย์ชนะสัปดาห์นั้น 👑 = ผู้นำตอนนี้')}</p>
        </React.Fragment>);
      })()}
      </React.Fragment>)}

      <button className="btn-ghost btn-block" style={{ marginTop: 16 }} onClick={signOut}>{L('Sign out', 'ออกจากระบบ')}</button>
    </div>
  );
}

function BottomNav({ active, onChange }) {
  return (
    <nav className="bottom-nav">
      {TABS.map(tab => (
        <button

// Real login flow, no backend yet: accounts live in localStorage (K.users, keyed by
// lowercased email). Sign-up creates an account; sign-in validates email+password.
// Everything the UI needs goes through `authApi` — when a server lands, swap the
// bodies of signUp/signIn/social for fetch() calls and the screen is unchanged.
function loadUsers() { return loadJSON(K.users, {}); }
// Tiny non-cryptographic scramble so the raw password isn't sitting in plain sight
// in localStorage. This is NOT real security — a backend hashes server-side. The
// point is just a believable local gate while there's no server.
function hashPass(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36);
}
const authApi = {
  // → { ok:true, profile } | { ok:false, error }
  signUp({ name, email, password }) {
    const key = email.trim().toLowerCase();
    const users = loadUsers();
    if (users[key]) return { ok: false, error: tr('login.err.exists') };
    const profile = { name: (name.trim() || email.split('@')[0] || 'Athlete').slice(0, 24), email: email.trim(), provider: 'email', ts: Date.now() };
    users[key] = { ...profile, pass: hashPass(password) };
    saveJSON(K.users, users);
    return { ok: true, profile };
  },
  signIn({ email, password }) {
    const key = email.trim().toLowerCase();
    const rec = loadUsers()[key];
    if (!rec) return { ok: false, error: tr('login.err.noAccount') };
    if (rec.pass !== hashPass(password)) return { ok: false, error: tr('login.err.wrongPass') };
    const { pass, ...profile } = rec;
    return { ok: true, profile };
  },
  // Mock SSO: no password; remembers the profile so the same button restores it.
  social({ provider, name, email }) {
    const key = (email.trim() || provider + '@local').toLowerCase();
    const users = loadUsers();
    let profile;
    if (users[key]) { const { pass, ...p } = users[key]; profile = p; }
    else {
      profile = { name: (name.trim() || 'Athlete').slice(0, 24), email: email.trim(), provider, ts: Date.now() };
      users[key] = { ...profile };
      saveJSON(K.users, users);
    }
    return { ok: true, profile };
  },
};

// Shown when the user returns via a password-reset email link (PASSWORD_RECOVERY). They set a new

function RecoverScreen({ onDone }) {

      if (error) { setErr(error.message || L('Could not update password', 'อัปเดตรหัสผ่านไม่สำเร็จ')); setBusy(false); return; }

        </div>

        <button type="button" className="btn-primary login-go" onClick={save} disabled={busy}>{busy ? L('Please wait…', 'รอสักครู่…') : L('Save password', 'บันทึกรหัสผ่าน')}</button>

function LoginScreen({ onLogin }) {
  // Default to sign-in if this device already has an account, else sign-up.
  const [mode, setMode] = React.useState(() => Object.keys(loadUsers()).length ? 'signin' : 'signup');
  const [name, setName] = React.useState('');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [show, setShow] = React.useState(false);
  const [err, setErr] = React.useState('');
  const [note, setNote] = React.useState(''); // neutral notice (e.g. social sign-in not ready)
  const [busy, setBusy] = React.useState(false);
  const L = (en, th) => (getLang() === 'th' ? th : en);
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  const submit = async () => {
    setNote('');
    if (mode === 'signup' && !name.trim()) { setErr(tr('login.err.noName')); return; }
    if (!emailOk) { setErr(tr('login.err.badEmail')); return; }
    if (password.length < 6) { setErr(tr('login.err.shortPass')); return; }
    setErr('');
    // Supabase is the SOURCE OF TRUTH when a backend is configured: go straight to it and only
    // unlock on a REAL session. The old flow checked a LOCAL mock store first, so a 2nd device
    // (empty local store) hit "no account found" even when the account existed on Supabase — and a
    // failed cloud login was masked by the local unlock, leaving sync + account-isolation broken.
    if (sb) {
      setBusy(true);
      const creds = { email: email.trim().toLowerCase(), password };
      try {
        if (mode === 'signup') {
          const { data, error } = await sb.auth.signUp(creds);
          if (error) { setErr(/registered|exists|already/i.test(error.message || '') ? tr('login.err.exists') : (error.message || L('Could not sign up', 'สมัครไม่สำเร็จ'))); setBusy(false); return; }
          if (!data.session) { setNote(L('Check your email to confirm, then sign in.', 'เช็กอีเมลเพื่อยืนยันก่อน แล้วเข้าสู่ระบบอีกครั้ง')); setBusy(false); return; }
        } else {
          const { data, error } = await sb.auth.signInWithPassword(creds);
          if (error) {
            const m = error.message || '';
            setErr(/confirm/i.test(m) ? L('Email not confirmed yet — check your inbox.', 'อีเมลยังไม่ยืนยัน — เช็กกล่องเมล')
              : /invalid|credential/i.test(m) ? tr('login.err.wrongPass')
              : (m || L('Could not sign in', 'เข้าสู่ระบบไม่สำเร็จ')));
            setBusy(false); return;
          }
        }
        // A real session landed → the reverse bridge in Root adopts it and unlocks. Mirror the
        // profile locally so an offline reload still recognizes the account on THIS device.
        const prof = { name: (name.trim() || email.split('@')[0] || 'You').slice(0, 24), email: creds.email, provider: 'email', ts: Date.now() };
        try { authApi.signUp({ name: prof.name, email: creds.email, password }); } catch (_) {}
        onLogin(prof);
      } catch (_) { setErr(L('Something went wrong', 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง')); }
      setBusy(false);
      return;
    }
    // No backend configured → original local-only behaviour (offline / mock).
    const res = mode === 'signup' ? authApi.signUp({ name, email, password }) : authApi.signIn({ email, password });
    if (!res.ok) { setErr(res.error); return; }
    onLogin(res.profile);
  };
  // Social sign-in has no real OAuth backend yet, so don't fabricate a local account
  // (that looked like a real login but wasn't). Show an honest "coming soon" notice;
  // email/password is the working path. `authApi.social` stays as the seam for later.
  const social = (provider) => {
    setErr(''); setNote('');
    // Google is wired to real Supabase OAuth. After the round-trip a session lands and the
    // reverse bridge in Root adopts it → app unlocks. (Needs Google enabled in Supabase →
    // Auth → Providers.) Apple has no OAuth backend yet, so it stays an honest "soon".
    if (provider === 'google' && sb) { sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: authRedirect() } }); return; }
    setNote(tr('login.soon'));
  };
  const switchMode = () => { setMode(mode === 'signup' ? 'signin' : 'signup'); setErr(''); setNote(''); setPassword(''); };
  // Send a Supabase password-reset link to the typed email (it returns to the app, where the
  // PASSWORD_RECOVERY handler shows RecoverScreen). Needs a real inbox + email sending enabled.
  const forgot = async () => {
    setErr(''); setNote('');
    if (!emailOk) { setErr(tr('login.err.badEmail')); return; }
    if (!sb) { setNote(L('Password reset needs the online account.', 'รีเซ็ตรหัสต้องใช้บัญชีออนไลน์')); return; }
    setBusy(true);
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: authRedirect() });
      if (error) setErr(error.message || L('Could not send reset email', 'ส่งอีเมลรีเซ็ตไม่สำเร็จ'));
      else setNote(L('Reset link sent — check your email.', 'ส่งลิงก์รีเซ็ตไปที่อีเมลแล้ว เช็กกล่องเมล'));
    } catch (_) { setErr(L('Something went wrong', 'เกิดข้อผิดพลาด')); }
    setBusy(false);
  };
  return (
    <div className="login">
      <div className="login-inner">
        {/* Duolingo-style structure: mascot + name + tagline centred up top, a big primary CTA
            and a quieter "already have an account" link pinned low. Both buttons start the same
            Google OAuth — it resolves new AND returning users, so the two paths are honest. */}
        <div className="login-stage">
          <span className="login-hero-face">🦊</span>
          <span className="login-brand-word">Ijek</span>
          <span className="login-brand-sub">{tr('login.brand')}</span>
          <p className="login-tag">{tr('login.tag')}</p>
        </div>
        <div className="login-cta">
          {note && <div className="login-note">{note}</div>}
          {err && <div className="login-err">{err}</div>}
          <button type="button" className="btn-primary login-start" onClick={() => social('google')}>
            <GoogleMark /> {L('Continue with Google', 'เข้าสู่ระบบด้วย Google')}
          </button>
          <p className="login-fine">{tr('login.fine')}</p>
        </div>
      </div>
    </div>
  );
