// ===== Plan & billing (full-screen overlay) =====
// Two-tier comparison (Free + Pro) + mock "unlock" (flips the local plan flag —
// no real charge yet). Pro+ stays DEFINED in PLANS (so PLAN_BY_ID/feature math and
// any existing mock-Pro+ user keep working) but is filtered out of the cards until
// its headline feature — cloud sync — actually ships. Reusable .modal-* confirm.
// PromptPay checkout: ask the Edge Function for a charge, render its QR, then poll
// until Opn confirms payment (server grants Pro). onPaid fires on success. The whole
// flow degrades gracefully to an "unavailable" state when the functions aren't deployed.
function PromptPayModal({ plan, period, amount, mode = 'pay', onClose, onPaid }) {
  const [state, setState] = React.useState('loading'); // loading | qr | paid | error | unavailable | signin | trialused
  const [qr, setQr] = React.useState(null);
  const [email, setEmail] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState('');
  const [m, setM] = React.useState(mode); // live mode ('trial'|'pay'): trialused can switch to 'pay'
  const chargeRef = React.useRef(null);
  const pollRef = React.useRef(null);   // start-effect cleanup only
  const statusRef = React.useRef(null); // status-poll interval (separate ref so the start
                                        // effect's cleanup can't clear the live payment poll)
  const start = React.useCallback(() => {
    setState('loading'); setQr(null); setMsg('');
    // TRIAL mode: no charge — ask the server to grant the once-per-account 7-day Pro trial.
    if (m === 'trial') {
      ppStartTrial().then((r) => {
        if (r && r.error === 'auth') { setState('signin'); return; } // sign in, then retry
        if (r && (r.ok || r.error === 'already_pro')) { setState('paid'); setTimeout(onPaid, 1300); return; }
        if (r && r.error === 'trial_used') { setState('trialused'); return; }
        setState('error');
      });
      return;
    }
    ppCreateCharge(plan, period).then((r) => {
      // Not signed into Supabase → prompt sign-in RIGHT HERE (don't make the buyer hunt
      // for the Friends tab). Pro is bound to the server account, so a session is required.
      if (r && r.error === 'auth') { setState('signin'); return; }
      if (!r || r.error || !r.qr) { setState('unavailable'); return; }
      chargeRef.current = r.chargeId; setQr(r.qr); setState('qr');
    });
  }, [plan, period, m]);
  const sendLink = async () => {
    const e = email.replace(/[\s\u200B-\u200D\uFEFF\u00A0]/g, '').toLowerCase();
    if (!e || busy || !sb) return;
    setBusy(true); setMsg('');
    const { error } = await sb.auth.signInWithOtp({ email: e, options: { emailRedirectTo: authRedirect() } });
    setBusy(false);
    setMsg(error ? ('❌ ' + error.message) : tr('pp.linkSent'));
  };
  React.useEffect(() => { start(); return () => clearInterval(pollRef.current); }, [start]);
  // Once the QR is up, poll status every 3s. charge-status grants Pro server-side the
  // moment Opn reports success, so a successful poll IS the unlock.
  React.useEffect(() => {
    if (state !== 'qr' || !chargeRef.current) return;
    statusRef.current = setInterval(() => {
      ppChargeStatus(chargeRef.current).then((s) => {
        if (!s) return;
        if (s.status === 'successful' && s.pro) { clearInterval(statusRef.current); setState('paid'); setTimeout(onPaid, 1300); }
        else if (s.status === 'failed') { clearInterval(statusRef.current); setState('error'); }
      });
    }, 3000);
    return () => clearInterval(statusRef.current);
  }, [state]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <div className="modal-title">{state === 'signin' ? tr('pp.signinTitle') : m === 'trial' ? tr('pp.trialTitle', { days: TRIAL_DAYS }) : tr('pp.title')}</div>
        <div className="modal-intro">{state === 'signin' ? tr('pp.signinSub') : m === 'trial' ? tr('pp.trialSub', { days: TRIAL_DAYS }) : tr('pp.sub')}</div>
        {state === 'signin' && (
          <React.Fragment>
            {/* Gmail-only sign-in. After the OAuth round-trip the reverse bridge signs the
               user in; they reopen this to continue the purchase. */}
            <button className="login-social google" style={{ marginTop: 16 }}
              onClick={() => { if (sb) sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: authRedirect() } }); }}>
              <GoogleMark /> {tr('login.google')}
            </button>
            <button className="btn-ghost btn-block" style={{ marginTop: 12 }} onClick={start}>{tr('pp.signedInContinue')}</button>
          </React.Fragment>
        )}
        {state === 'qr' && (
          <React.Fragment>
            <div className="pp-qr-wrap"><img src={qr} alt="PromptPay QR" /></div>
            <div className="pp-amt">{fmtPrice(Math.round((amount || 0) / 100))}</div>
            <div className="pp-status"><span className="pp-spin" />{tr('pp.waiting')}</div>
          </React.Fragment>
        )}
        {state === 'loading' && <div className="pp-status" style={{ marginTop: 28 }}><span className="pp-spin" />{tr('pp.loading')}</div>}
        {state === 'paid' && <div className="pp-status paid" style={{ marginTop: 28, fontSize: 15 }}>{m === 'trial' ? tr('pp.trialGranted', { days: TRIAL_DAYS }) : tr('pp.paid')}</div>}
        {state === 'error' && <div className="pp-status err" style={{ marginTop: 28 }}>{tr('pp.error')}</div>}
        {state === 'unavailable' && <div className="pp-status" style={{ marginTop: 28 }}>{tr('pp.unavailable')}</div>}
        {state === 'trialused' && (
          <React.Fragment>
            <div className="pp-status err" style={{ marginTop: 28 }}>{tr('pp.trialUsed')}</div>
            <button className="btn-primary btn-block" style={{ marginTop: 14 }} onClick={() => setM('pay')}>{tr('pp.cta')}</button>
          </React.Fragment>
        )}
        <div className="modal-actions">
          {state === 'error'
            ? <button className="btn-primary" onClick={start}>{tr('pp.retry')}</button>
            : <button className="btn-ghost" onClick={onClose}>{state === 'paid' ? tr('pp.close') : tr('common.cancel')}</button>}
        </div>
      </div>
    </div>
  );
}

function PlanBillingScreen({ plan, setPlan, onClose }) {
  useEscClose(onClose);
  const trapRef = React.useRef(null);
  useFocusTrap(trapRef);
  const [period, setPeriod] = React.useState('mo'); // 'mo' (default, low sticker) | 'yr'
  const [pending, setPending] = React.useState(null); // plan id awaiting confirm
  const cur = PLAN_BY_ID[plan] || PLAN_BY_ID.free;
  const curRank = PLAN_RANK[plan] || 0;
  const choose = (id) => { if (id !== plan) setPending(id); };
  const confirm = () => { if (pending) { setPlan(pending); setPending(null); } };
  const upgrading = pending && (PLAN_RANK[pending] || 0) > curRank;
  // Going Free → a paid plan starts as a free trial.
  const trialing = pending && plan === 'free' && PLAN_BY_ID[pending].price[period] > 0;
  // Real-money checkout. Only paid UPGRADES go through PromptPay; downgrades/Free stay
  // on the instant local path. `payOpen` holds { plan, period, amount } for the QR modal.
  const [payOpen, setPayOpen] = React.useState(null);
  const payAmount = pending ? (PLAN_BY_ID[pending].price[period] || 0) * 100 : 0; // baht → satang
  const startPay = () => { if (pending) { setPayOpen({ plan: pending, period, amount: payAmount }); setPending(null); } };
  // Real 7-day trial: no charge. Pass the real price too, so if the trial was already used
  // and the modal offers "pay instead", the QR shows the correct amount.
  const startTrial = () => { if (pending) { setPayOpen({ plan: pending, period, amount: payAmount, mode: 'trial' }); setPending(null); } };
  const onPaid = () => { const tgt = payOpen && payOpen.plan; setPayOpen(null); if (tgt) setPlan(tgt); };
  // Manual-PromptPay redeem code: buyer pays your personal PromptPay, you give a code,
  // they enter it here → server grants Pro. No business / payment processor needed.
  const [code, setCode] = React.useState('');
  const [rdMsg, setRdMsg] = React.useState('');   // '' | 'ok' | error reason
  const [rdBusy, setRdBusy] = React.useState(false);
  const doRedeem = async () => {
    const c = code.trim();
    if (!c || rdBusy) return;
    setRdBusy(true); setRdMsg('');
    const r = await ppRedeem(c);
    setRdBusy(false);
    if (r.ok) { setRdMsg('ok'); setCode(''); setPlan('pro'); }
    else { setRdMsg(r.error || 'invalid'); }
  };
  // Paid upgrade → Lemon Squeezy hosted checkout (card auto-renew subscription). The user must
  // be signed in so the webhook can credit the right account; if not, start Google sign-in.
  const [ckBusy, setCkBusy] = React.useState(false);
  const doCheckout = async () => {
    if (ckBusy) return;
    setCkBusy(true);
    let uid = '', email = '';
    try { const { data } = await sb.auth.getUser(); uid = data?.user?.id || ''; email = data?.user?.email || ''; } catch (_) {}
    if (!uid) {
      if (sb) sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: authRedirect() } });
      setCkBusy(false);
      return;
    }
    try { localStorage.setItem('tm_ls_pending', String(Date.now())); } catch (_) {}
    window.location.href = lsCheckoutUrl(period, uid, email);
  };
  return (
    <div className="billing" ref={trapRef}>
      <div className="billing-head">
        <button className="btn-ghost" onClick={onClose}>{tr('billing.back')}</button>
        <div className="billing-title">{tr('billing.title')}</div>
        <span className="billing-head-sp" />
      </div>
      <div className="billing-body">
        {plan === 'free' && (
          <div className="founders-banner">
            <div className="founders-title">{tr('billing.foundersTitle', { n: FOUNDING_SPOTS })}</div>
            <div className="founders-sub">{tr('billing.foundersSub', { n: FOUNDING_SPOTS })}</div>
          </div>
        )}
        <div className={'billing-current rank-' + plan}>
          <span className="billing-current-lbl">{tr('billing.yourPlan')}</span>
          <span className="billing-current-name">{cur.name}{plan === 'proplus' && ' ✦'}</span>
          <span className="billing-current-sub">
            {plan === 'free' ? tr('billing.freeSub') : tr('billing.thanksSub')}
          </span>
        </div>

        <div className="billing-toggle">
          <button className={period === 'mo' ? 'on' : ''} onClick={() => setPeriod('mo')}>{tr('billing.monthly')}</button>
          <button className={period === 'yr' ? 'on' : ''} onClick={() => setPeriod('yr')}>
            {tr('billing.yearly')} <span className="billing-save">{tr('billing.save')}</span>
          </button>
        </div>

        <div className="plan-cards">
          {/* Pro+ is not sold this launch (Free + Pro only) — its grant path + flagship aren't
              ready, and selling it would charge real money for nothing. Kept in PLANS so the
              tier/i18n/AI-cap plumbing stays intact; just not offered as a purchasable card.
              promptpay-charge also hard-rejects 'proplus' as a server-side backstop. */}

            const cta = isCur ? tr('billing.currentPlan')

            return (

                {offerTrial && (
                  <div className="plan-trial-note">
                    {tr('billing.trialNote', { days: TRIAL_DAYS, price: fmtPrice(price), per: period === 'yr' ? tr('billing.perYear') : tr('billing.perMonth') })}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <p className="billing-note">
          {tr('billing.proto')}
        </p>
        {plan !== 'free' && (
          <button className="btn-ghost btn-block" onClick={() => choose('free')}>{tr('billing.cancelFree')}</button>
        )}

        <div className="redeem-box">
          <div className="redeem-title">{tr('billing.redeemTitle', null, 'Have a code?')}</div>
          <div className="redeem-row">
            <input className="redeem-input" type="text" value={code} autoCapitalize="characters" spellCheck={false}
              placeholder={tr('billing.redeemPlaceholder', null, 'IJEK-XXXX-XXXX')}
              onChange={e => { setCode(e.target.value); if (rdMsg) setRdMsg(''); }}
              onKeyDown={e => { if (e.key === 'Enter') doRedeem(); }} />
            <button className="btn-primary redeem-btn" disabled={rdBusy || !code.trim()} onClick={doRedeem}>
              {rdBusy ? '…' : tr('billing.redeemBtn', null, 'Redeem')}
            </button>
          </div>
          {rdMsg === 'ok'
            ? <div className="redeem-msg ok">{tr('billing.redeemOk', null, '✓ Pro unlocked — enjoy!')}</div>
            : rdMsg
            ? <div className="redeem-msg err">{tr('billing.redeem_' + rdMsg, null, tr('billing.redeemInvalid', null, 'Invalid or expired code'))}</div>
            : null}
        </div>
      </div>

      {pending && (
        <div className="modal-backdrop" onClick={() => setPending(null)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-title">
              {trialing ? tr('billing.modalTrial', { name: PLAN_BY_ID[pending].name, days: TRIAL_DAYS }) : (upgrading ? tr('billing.modalUnlock', { name: PLAN_BY_ID[pending].name }) : tr('billing.modalSwitch', { name: PLAN_BY_ID[pending].name }))}
            </div>
            <div className="modal-intro">
              {trialing
                ? tr('billing.introTrial', { name: PLAN_BY_ID[pending].name, days: TRIAL_DAYS })
                : upgrading
                ? tr('billing.introUnlock', { name: PLAN_BY_ID[pending].name })
                : tr('billing.introDowngrade', { cur: cur.name, name: PLAN_BY_ID[pending].name })}
            </div>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={() => setPending(null)}>{tr('common.cancel')}</button>
              {trialing
                ? <React.Fragment>
                    <button className="btn-ghost" onClick={startTrial}>{tr('billing.confirmTrial')}</button>
                    <button className="btn-primary" disabled={ckBusy} onClick={doCheckout}>{ckBusy ? '…' : tr('billing.subscribe', null, 'Subscribe')}</button>
                  </React.Fragment>
                : upgrading && PLAN_BY_ID[pending].price[period] > 0
                ? <button className="btn-primary" disabled={ckBusy} onClick={doCheckout}>{ckBusy ? '…' : tr('billing.subscribe', null, 'Subscribe')}</button>
                : <button className="btn-primary" onClick={confirm}>{upgrading ? tr('billing.unlock') : tr('common.confirm')}</button>}
            </div>
            {/* Dev-only escape hatch: unlock locally with no charge. Gated behind a dev
               flag (?dev in the URL or localStorage.tm_dev='1') so it NEVER renders for
               real/paying users — without the gate this was a one-tap "free Pro" leak. */}
            {DEV_UNLOCK && upgrading && PLAN_BY_ID[pending].price[period] > 0 && (
              <button className="pp-dev" onClick={confirm}>{tr('pp.devUnlock')}</button>
            )}
          </div>
        </div>
      )}
      {payOpen && (
        <PromptPayModal plan={payOpen.plan} period={payOpen.period} amount={payOpen.amount} mode={payOpen.mode || 'pay'}
          onClose={() => setPayOpen(null)} onPaid={onPaid} />
      )}
    </div>
  );
}

// ===== Settings tab (minimal) =====
// The data keys a backup carries (everything except the schema stamp, which is
// tracked separately so an import can restore the right version).
const BACKUP_KEYS = [K.activities, K.avatar, K.schedule, K.routines, K.weekSlots, K.weekRoutines, K.players, K.restTickets, K.done, K.subnames, K.todos, K.theme, K.achSeen, K.recapWeek, K.onboarding, K.avatarLooks, K.chat];
function SettingsScreen({ activities, schedule, done, avatar, plan, auth, lang, theme, setTheme, remindersOn, setReminders, shareScores, setShareScores, onSetLang, clock24, onSetClock24, bands, setBands, onOpenBilling, onReplayTutorial, onReplayIntro, onShowRecap, onSignOut, onRenameAccount, syncStatus, onSyncNow }) {
  // Inline editor for the signed-in account name (Account section).
  const [editingName, setEditingName] = React.useState(false);
  const [nameDraft, setNameDraft] = React.useState('');
  const saveName = () => { const v = nameDraft.trim(); if (v && onRenameAccount) onRenameAccount(v); setEditingName(false); };
  const fileRef = React.useRef(null);
  const [msg, setMsg] = React.useState(null); // { kind: 'ok' | 'err', text }
  const [resetMode, setResetMode] = React.useState(false);
  const [resetText, setResetText] = React.useState('');
  // JEK's daily hero greeting on/off (device-local pref; MainScreen reads K.greetOff).
  const [greetOff, setGreetOff] = React.useState(() => { try { return localStorage.getItem(K.greetOff) === '1'; } catch { return false; } });
  const toggleGreet = () => { const next = !greetOff; setGreetOff(next); try { localStorage.setItem(K.greetOff, next ? '1' : '0'); } catch {} };
  // The Danger zone sits at the very bottom of a long settings list, so opening the
  // inline confirm used to leave it below the fold — you had to scroll to find the
  // RESET field. Pull it into view (and onto the type-to-confirm input) when it opens.
  const resetRef = React.useRef(null);
  React.useEffect(() => {
    if (resetMode && resetRef.current) {
      try { resetRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch {}
    }
  }, [resetMode]);
  const [clickOn, setClickOn] = React.useState(() => {
    try { return localStorage.getItem(K.clickSound) !== '0'; } catch { return true; }
  });
  const toggleClick = () => setClickOn(prev => {
    const next = !prev;
    try { localStorage.setItem(K.clickSound, next ? '1' : '0'); } catch {}
    if (next) playClickSound(); // little preview when turning it on
    return next;
  });
  const daysTracked = Object.keys(done || {}).length;

  // Live block reminders (Pro). Turning ON requests Notification permission first;
  // if the user blocks it, we leave the toggle off and explain why.
  const canRemind = planAllows(plan, 'reminders');
  const [remMsg, setRemMsg] = React.useState('');
  const toggleReminders = async () => {
    const next = !remindersOn;
    if (next && typeof Notification !== 'undefined' && Notification.permission !== 'granted') {
      let perm = Notification.permission;
      try { perm = await Notification.requestPermission(); } catch (_) {}
      if (perm !== 'granted') { setRemMsg(tr('set.remindersDenied')); setReminders(false); return; }
    }
    setRemMsg('');
    setReminders(next);
    // Fire a one-off confirmation the moment it's turned on, so the chime + banner
    // are verified right here (on PC and mobile) instead of waiting for a block.
    if (next) { try { fireBlockReminder(null, avatar); } catch (_) {} }
  };

  const exportData = () => {
    const data = {};
    for (const k of BACKUP_KEYS) {
      const raw = localStorage.getItem(k);
      if (raw != null) { try { data[k] = JSON.parse(raw); } catch {} }
    }
    const sv = parseInt(localStorage.getItem(K.schemaVersion) || '', 10);
    const payload = {
      app: 'train-with-myself', version: 1, exportedAt: Date.now(),
      schemaVersion: Number.isFinite(sv) ? sv : SCHEMA_VERSION, data,
      // Ship the heavy task-emoji photo bytes (offloaded to IDB) so the backup is self-contained
      // and restores those faces on another device — not just dangling idbimg: tokens.
      images: collectImgBlobs(data),
    };
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'train-with-myself-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setMsg({ kind: 'ok', text: tr('set.backupDone') });
  };

  const onPickFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // let the same file be re-picked later
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => setMsg({ kind: 'err', text: tr('set.backupReadErr') });
    reader.onload = async () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch { setMsg({ kind: 'err', text: tr('set.backupBadJson') }); return; }
      const d = parsed && parsed.data;
      if (!parsed || parsed.app !== 'train-with-myself' || !d || typeof d !== 'object') {
        setMsg({ kind: 'err', text: tr('set.backupNotOurs') }); return;
      }
      const acts = unpackActivities(d[K.activities]).length; // packed {_img,items} or legacy array
      const blks = Array.isArray(d[K.schedule]) ? d[K.schedule].length : 0;
      if (!confirm(tr('set.backupReplaceConfirm', { acts, blks }))) return;
      // Restore the task-emoji photo bytes into the IDB content store FIRST (await), so after the
      // reload the idbimg: tokens in K.activities resolve to real faces instead of the fallback glyph.
      try { await restoreImgBlobs(parsed.images); } catch (_) {}
      for (const k of BACKUP_KEYS) {
        try { if (k in d) localStorage.setItem(k, JSON.stringify(d[k])); else localStorage.removeItem(k); } catch {}
      }
      const sv = parseInt(parsed.schemaVersion, 10);
      try { localStorage.setItem(K.schemaVersion, String(Number.isFinite(sv) ? sv : SCHEMA_VERSION)); } catch {}
      location.reload();
    };
    reader.readAsText(file);
  };

  const resetConfirmed = resetText.trim().toUpperCase() === 'RESET';
  const reset = async () => {
    if (!resetConfirmed) return;
    // Pro/sync: delete THIS account's cloud row too. Without this, reset only clears local —
    // then reconcile on the reload pulls the old state straight back from the cloud (rev > 0 >
    // the just-cleared local rev), making reset a no-op for synced accounts. Await so the row
    // is gone before the reload re-runs reconcile. NOTE: this also clears the account's synced
    // copy on its other devices — which is what "reset all data" should mean.
    if (sb) {
      try {
        const { data } = await sb.auth.getSession();
        const uid = data && data.session && data.session.user && data.session.user.id;
        if (uid) await sb.from('user_state').delete().eq('user_id', uid);
      } catch (_) {}
    }
    // Clear EVERY app key so nothing — players, rest tickets, reminders, plan,
    // onboarding, the notified set, and stray view prefs not tracked in K (e.g.
    // tm_wk_forme / tm_wk_avhobby) — survives to silently repopulate on reload.
    // Sweep by the tm_ prefix instead of the hand-maintained K list so a key added
    // later can't quietly leak through a reset. Keep the sign-in (auth/users) so a
    // data reset doesn't sign you out. Snapshot keys first (removeItem mutates them).
    try {
      Object.keys(localStorage)
        .filter(k => k.indexOf('tm_') === 0 && k !== K.auth && k !== K.users)
        .forEach(k => { try { localStorage.removeItem(k); } catch {} });
    } catch {}
    // Also clear the device-local IndexedDB stores (avatar photos / recent emoji /
    // task-emoji image bytes); await so the wipe is verified before we reload.
    try { await _idbWipe(); } catch {}
    location.reload();
  };
  const cancelReset = () => { setResetMode(false); setResetText(''); };

  const planMeta = PLAN_BY_ID[plan] || PLAN_BY_ID.free;
  const canBackup = planAllows(plan, 'backup');
  const signOut = () => {
    if (!confirm(tr('set.signOutConfirm'))) return;
    if (onSignOut) onSignOut();
  };
  return (
    <div className="set-screen">
      <div className="section-label">{tr('set.account')}</div>
      <div className="set-card">
        <div className="set-row">
          <span>{tr('set.signedInAs')}</span>
          {editingName ? (
            <span className="set-name-edit">
              <input className="set-name-input" value={nameDraft} autoFocus maxLength={24}
                onChange={e => setNameDraft(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') saveName(); else if (e.key === 'Escape') setEditingName(false); }} />
              <button className="set-name-ok" onClick={saveName} aria-label={tr('common.save')}>✓</button>
              <button className="set-name-cancel" onClick={() => setEditingName(false)} aria-label={tr('common.cancel')}>✕</button>
            </span>
          ) : auth ? (
            <button className="set-name-btn" onClick={() => { setNameDraft(auth.name || ''); setEditingName(true); }} title={tr('dash.renameTitle')}>
              {auth.name || auth.email || 'You'} <span className="set-name-pencil">✎</span>
            </button>
          ) : <span className="set-v">—</span>}
        </div>
        {auth && auth.email ? <div className="set-row"><span>{tr('set.email')}</span><span className="set-v">{auth.email}</span></div> : null}
        {auth && auth.provider && auth.provider !== 'email' ? <div className="set-row"><span>{tr('set.via')}</span><span className="set-v" style={{ textTransform: 'capitalize' }}>{auth.provider}</span></div> : null}
      </div>
      <button className="btn-ghost btn-block" style={{ color: 'var(--danger)' }} onClick={signOut}>{tr('set.signOut')}</button>

      <div className="section-label">{tr('set.language')}</div>
      <div className="set-card">
        <div className="set-lang-row">
          {[['en', 'English'], ['th', 'ไทย']].map(([code, label]) => (
            <button key={code} type="button" className={'set-lang-btn' + (lang === code ? ' on' : '')}
              onClick={() => onSetLang(code)} aria-pressed={lang === code}>{label}</button>
          ))}
        </div>
      </div>

      <div className="section-label">{tr('set.clockFormat')}</div>
      <div className="set-card">
        <div className="set-lang-row">
          {[[false, tr('set.clock12')], [true, tr('set.clock24')]].map(([is24, label]) => (
            <button key={String(is24)} type="button" className={'set-lang-btn' + (!!clock24 === is24 ? ' on' : '')}
              onClick={() => onSetClock24(is24)} aria-pressed={!!clock24 === is24}>{label}</button>
          ))}
        </div>
      </div>

      <div className="section-label">{tr('band.title')}</div>
      <div className="set-card"><BandEditor bands={bands} setBands={setBands} /></div>

      <div className="section-label">{tr('set.theme')} {!planAllows(plan, 'themes') && <span className="label-pro">PRO</span>}</div>
      <div className="set-card">
        <div className="theme-row">
          {THEMES.map(t => {
            const locked = !planAllows(plan, 'themes') && t.id !== 'lime';
            const on = (planAllows(plan, 'themes') ? theme : 'lime') === t.id;
            return (
              <button key={t.id} type="button" className={'theme-opt' + (on ? ' on' : '') + (locked ? ' locked' : '')}
                onClick={() => locked ? onOpenBilling() : setTheme(t.id)}
                aria-label={tr('theme.' + t.id)} title={tr('theme.' + t.id)}>
                <span className="theme-dot" style={{ background: 'linear-gradient(135deg, ' + t.accent + ' 0 50%, ' + t.you + ' 50% 100%)' }}>{locked ? '🔒' : (on ? '✓' : '')}</span>
              </button>
            );
          })}
        </div>
        {!planAllows(plan, 'themes') && <p className="hist-note" style={{ textAlign: 'left', margin: '8px 2px 0' }}>{tr('set.themeProNote')}</p>}
      </div>

      <div className="section-label">{tr('set.plan')}</div>
      <button className={'set-plan-row rank-' + plan} onClick={onOpenBilling}>
        <span className="set-plan-l">
          <span className="set-plan-name">{planMeta.name}{plan === 'proplus' && ' ✦'}</span>
          <span className="set-plan-sub">{plan === 'free' ? tr('set.freePlanSub') : tr('set.managePlanSub')}</span>
        </span>
        <span className="set-plan-cta">{plan === 'free' ? tr('set.upgrade') : tr('set.manage')}</span>
      </button>
      {/* One positive, consolidated "here's everything Pro adds" pitch for Free users — so the
          value lands in ONE place instead of only as scattered locks deeper in the screen. */}
      {plan === 'free' && (
        <button type="button" className="set-pro-pitch" onClick={onOpenBilling}>
          <span className="set-pro-pitch-head">{tr('set.proPitchHead')}</span>
          <span className="set-pro-pitch-body">{tr('set.proPitchBody')}</span>
          <span className="set-pro-pitch-cta">{tr('set.upgrade')} →</span>
        </button>
      )}

      <div className="section-label">{tr('set.settings')}</div>
      <div className="set-card">
        <div className="set-row"><span>{tr('set.app')}</span><span className="set-v">Ijek — Train With Myself</span></div>
        <div className="set-row"><span>{tr('set.plan')}</span><span className="set-v">{planMeta.name}</span></div>
        <div className="set-row"><span>{tr('set.committedSelf')}</span><span className="set-v">{renderFace(avatar.emoji, 18)} {avatar.name}</span></div>
        <div className="set-row"><span>{tr('set.activities')}</span><span className="set-v">{activities.length}</span></div>
        <div className="set-row"><span>{tr('set.scheduledBlocks')}</span><span className="set-v">{schedule.length}</span></div>
        <div className="set-row"><span>{tr('set.daysTracked')}</span><span className="set-v">{daysTracked}</span></div>
        <div className="set-row"><span>{tr('set.storage')}</span><span className="set-v">{tr('set.storageVal')}</span></div>
      </div>

      <div className="section-label">{tr('set.sound')}</div>
      <div className="set-card">
        <label className="perday-toggle" style={{ margin: 0, justifyContent: 'space-between', width: '100%' }}>
          <span className="perday-toggle-lbl">{tr('set.clickSound')}</span>
          <span style={{ display: 'flex', alignItems: 'center' }}>
            <input type="checkbox" checked={clickOn} onChange={toggleClick} />
            <span className="perday-switch"><span className="perday-knob"></span></span>
          </span>
        </label>
        <p className="hist-note" style={{ textAlign: 'left', margin: '6px 2px 0' }}>
          {tr('set.clickSoundNote')}
        </p>
      </div>

      <div className="section-label">{tr('set.reminders')}</div>
      {canRemind ? (
        <div className="set-card" data-tour="set-reminders">
          <label className="perday-toggle" style={{ margin: 0, justifyContent: 'space-between', width: '100%' }}>
            <span className="perday-toggle-lbl">{tr('set.remindersToggle')}</span>
            <span style={{ display: 'flex', alignItems: 'center' }}>
              <input type="checkbox" checked={remindersOn} onChange={toggleReminders} />
              <span className="perday-switch"><span className="perday-knob"></span></span>
            </span>
          </label>
          <p className="hist-note" style={{ textAlign: 'left', margin: '6px 2px 0' }}>
            {tr('set.remindersNote')}
          </p>
          {remMsg && <p className="hist-note" style={{ textAlign: 'left', margin: '4px 2px 0', color: 'var(--danger)' }}>{remMsg}</p>}
        </div>
      ) : (
        <ProLock tier="pro" title={tr('prolock.remTitle')}
          desc={tr('prolock.remDesc')} onOpenBilling={onOpenBilling} />
      )}

      {/* JEK's daily greeting toggle — Pro only (the check-in feature). */}
      {planAllows(plan, 'checkin') && (
        <React.Fragment>
          <div className="section-label">{tr('set.greetSection')}</div>
          <div className="set-card">
            <label className="perday-toggle" style={{ margin: 0, justifyContent: 'space-between', width: '100%' }}>
              <span className="perday-toggle-lbl">{tr('set.greetToggle')}</span>
              <span style={{ display: 'flex', alignItems: 'center' }}>
                <input type="checkbox" checked={!greetOff} onChange={toggleGreet} />
                <span className="perday-switch"><span className="perday-knob"></span></span>
              </span>
            </label>
            <p className="hist-note" style={{ textAlign: 'left', margin: '6px 2px 0' }}>
              {tr('set.greetNote')}
            </p>
          </div>
        </React.Fragment>
      )}

      {sb && (
        <React.Fragment>
          <div className="section-label">{tr('set.friends')}</div>
          <div className="set-card">
            <label className="perday-toggle" style={{ margin: 0, justifyContent: 'space-between', width: '100%' }}>
              <span className="perday-toggle-lbl">{tr('set.shareScores')}</span>
              <span style={{ display: 'flex', alignItems: 'center' }}>
                <input type="checkbox" checked={shareScores} onChange={e => setShareScores(e.target.checked)} />
                <span className="perday-switch"><span className="perday-knob"></span></span>
              </span>
            </label>
            <p className="hist-note" style={{ textAlign: 'left', margin: '6px 2px 0' }}>
              {tr('set.shareScoresNote')}
            </p>
          </div>
        </React.Fragment>
      )}

      <div className="section-label">{tr('set.cloudSync')}</div>
      {planAllows(plan, 'cloudSync') ? (
        <div className="set-card">
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
            <span className="perday-toggle-lbl" style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18 }}>
                {syncStatus === 'synced' ? '☁️' : syncStatus === 'syncing' ? '🔄' : syncStatus === 'error' ? '⚠️' : '☁'}
              </span>
              {tr('set.sync.' + (syncStatus || 'idle'))}
            </span>
            <button className="btn-ghost" style={{ padding: '6px 14px' }}
              disabled={syncStatus === 'syncing'} onClick={onSyncNow}>{tr('set.syncNow')}</button>
          </div>
          {(() => {
            let ts = 0; try { ts = parseInt(localStorage.getItem(K_SYNC_AT) || '0', 10) || 0; } catch (_) {}
            return ts > 0 ? <p className="hist-note" style={{ textAlign: 'left', margin: '6px 2px 0', color: 'var(--accent)' }}>{tr('set.sync.lastAt', { t: relTimeAgo(ts) })}</p> : null;
          })()}
          <p className="hist-note" style={{ textAlign: 'left', margin: '8px 2px 0' }}>
            {tr('set.syncNote')}
          </p>
        </div>
      ) : (
        <ProLock tier="pro" title={tr('set.cloudSync')}
          desc={tr('set.syncNote')} onOpenBilling={onOpenBilling} />
      )}

      <div className="section-label">{tr('set.backup')}</div>
      {canBackup ? (
        <React.Fragment>
          <button className="btn-ghost btn-block" onClick={exportData}>{tr('set.exportBackup')}</button>
          <button className="btn-ghost btn-block" onClick={() => fileRef.current && fileRef.current.click()}>{tr('set.importBackup')}</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={onPickFile} />
          {msg && <p className={'set-msg ' + msg.kind}>{msg.text}</p>}
          <p className="hist-note" style={{ textAlign: 'left', marginTop: 6 }}>
            {tr('set.backupNote')}
          </p>
        </React.Fragment>
      ) : (
        <ProLock tier="pro" title={tr('prolock.backupTitle')}
          desc={tr('prolock.backupDesc')} onOpenBilling={onOpenBilling} />
      )}

      <div className="section-label">{tr('set.help')}</div>
      <div className="set-card">
        <button className="set-action" onClick={onReplayTutorial}>
          <span className="set-action-ico">▶</span>
          <span className="set-action-txt">

      ) : (

// ===== Two-lane race timeline: left = you, right = the avatar's plan =====
// Short race-header status line in the avatar's personality voice (mirrors
// behaviorCopy, but tuned to the very short "behind / in step" race line).
function raceStatusCopy(behavior, behind, gap, name) {
  const b = ALL_BEHAVIOR_IDS.indexOf(behavior) !== -1 ? behavior : 'coach';
  return tr('race.' + (behind ? 'behind' : 'step') + '.' + b, { gap, name });
}

function RaceHeader({ avatar, youMin, avatarMin, dayTotal, gapMin, period, pillPct }) {
  // The avatar's bar fills against ITS OWN plan — so once the committed self has finished
  // the plan it reads FULL (it did exactly what it set out to do). You then race on top:
  // your bar is scaled to whatever's biggest so that any surplus past the avatar isn't
  // clamped at 100%, and the part beyond the avatar shows as a gold "overcharge" tip.
  const planFull = Math.max(dayTotal, avatarMin) || 1;        // the avatar's whole plan
  const scaleMax = Math.max(planFull, youMin) || 1;           // the ME bar's scale (fits the surplus)
  const avPct = Math.min(100, avatarMin / planFull * 100);    // FULL when the plan is done
  const mePct = Math.min(100, youMin / scaleMax * 100);
  const behind = gapMin >= 1;
  const aheadMin = Math.max(0, youMin - avatarMin);   // how far you've banked past the avatar
  const ahead = aheadMin >= 1;
  const meSplit = Math.min(mePct, avatarMin / scaleMax * 100); // orange→gold boundary on the ME bar
  const overPct = Math.max(0, mePct - meSplit);               // the gold overcharge tip
  const status = ahead
    ? '⚡ ' + formatHM(Math.round(aheadMin) * 60) + ' ahead of ' + avatar.name
    : raceStatusCopy(resolveBehavior(avatar, null), behind, formatHM(Math.round(gapMin) * 60), avatar.name);
  return (
    <div className={'rh' + (behind ? ' behind' : ahead ? ' ahead' : '')}>
      {/* Use the hero face's class (soft 0 4px 10px drop-shadow) instead of .rh-face's tight
          0 2px 4px — the tight shadow on an animated webp traced a hard square box at small size.
          Sized down to the race header's 38px with the small badge. */}
      <span className={'hero-face rh-hero-face' + auraClass(avatar.aura)}>{renderFace(avatar.emoji, 38, false, false, false, avatar.aura, avatar.faceCrop || null, avatar.faceAdjust)}{renderBadges(_selfBadges, 'av-acc-sm', 38)}</span>
      <div className="rh-bars">
        {period && <div className="rh-period"><span>{period}</span>{pillPct != null && <span data-tour="sched-pill" className={'rh-pill' + (pillPct >= 100 ? ' good' : pillPct >= 60 ? ' mid' : ' bad')}>{pillPct}% · {formatHM(Math.round(youMin) * 60)}</span>}</div>}
        <div className="rh-row">
          <span className="rh-tag av">{avatar.name}</span>
          <div className="rh-track"><div className="rh-fill av" style={{ width: avPct + '%' }} /></div>
          <span className="rh-val">{formatHM(Math.round(avatarMin) * 60)}</span>
        </div>
        <div className="rh-row">
          <span className="rh-tag me">ME</span>
          <div className="rh-track">
            <div className="rh-fill me" style={{ width: mePct + '%' }} />
            {overPct > 0.5 && <div className="rh-over" style={{ right: (100 - mePct) + '%', width: overPct + '%' }} />}
          </div>
          <span className="rh-val">{formatHM(Math.round(youMin) * 60)}</span>
        </div>
        <div className="rh-status">{status}</div>
      </div>
    </div>
  );
}

// Google-Calendar-style side-by-side layout for time-overlapping blocks within ONE day.
// Full-width blocks would stack and occlude (the lower one becomes untappable), so blocks
// whose times overlap are split into columns. Returns { [blockId]: {col, cols} } — col =
// 0-based column index, cols = how many columns that block's overlap-cluster needs.
// Greedy interval colouring over start-sorted blocks, clustered by transitive overlap.
function weekBlockLayout(blocks) {
  const out = {};
  const items = (blocks || []).map(b => ({ id: b.id, s: b.start, e: b.end })).sort((a, c) => a.s - c.s || a.e - c.e);
  let i = 0;
  while (i < items.length) {
    const cluster = [items[i]];
    let clusterEnd = items[i].e, j = i + 1;
    while (j < items.length && items[j].s < clusterEnd) { cluster.push(items[j]); if (items[j].e > clusterEnd) clusterEnd = items[j].e; j++; }
    const colEnds = []; // running end-time of the last block placed in each column
    for (const it of cluster) {
      let col = colEnds.findIndex(end => it.s >= end);
      if (col === -1) { col = colEnds.length; colEnds.push(it.e); } else { colEnds[col] = it.e; }
      it.col = col;
    }
    for (const it of cluster) out[it.id] = { col: it.col, cols: colEnds.length };
    i = j;
  }
  return out;
}

// 7-day schedule grid: Mon–Sun columns over one time axis, JEK's plan blocks per
// day, the whole week at a glance. Tap a day header or a block to open that day in
// the detailed Day view. Browse weeks with ‹ ›.
function WeekGrid({ avatar, activities, schedule, done, now, tickets, bands, restBar, onOpenDay, onDragCreate, onAddBlock, onMakeAllLikeToday, onOpenRoutines, onToggleDone, onSetAmount, onSetSegs, onEditBlock, onMoveBlock, onResizeBlock, onUnrest, onMoveAllForActivity, onResizeAllForActivity }) {
  const [weekOffset, setWeekOffset] = React.useState(0);
  const [dateOpen, setDateOpen] = React.useState(false); // themed date-jump calendar (matches Day mode)
  const scrollRef = React.useRef(null);
  // The scroll area's vertical scrollbar eats a few px of column width. Reserve EXACTLY
  // that much on the day-header row so the headers line up with the columns below.
  // We measure (offsetWidth - clientWidth) instead of assuming 10px, because
  // `scrollbar-width: thin` makes Chromium render its own width that the
  // ::-webkit-scrollbar { width:10px } rule no longer actually controls — that mismatch
  // is what made the grid look skewed.
  const [sbw, setSbw] = React.useState(0);
  React.useLayoutEffect(() => {
    const measure = () => { const el = scrollRef.current; if (el) setSbw(el.offsetWidth - el.clientWidth); };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);
  // Jump to whichever week contains the picked date.
  const pickWeek = (ts) => {
    const off = Math.round((startOfWeek(ts) - startOfWeek(now)) / (7 * 86400000));
    setWeekOffset(off);
  };
  const SC = 0.85; // px per minute — taller bands so blocks read clearly (empty time is collapsed)
  const todayStart = startOfDay(now);
  const weekStart = addDays(startOfWeek(now), weekOffset * 7);
  const nowMin = nowMinutes(now);
  const restDays = avatar.restDays || [];
  const [drag, setDrag] = React.useState(null); // live preview while moving/resizing a block
  const [createSel, setCreateSel] = React.useState(null); // { dayIdx, a, b } live drag-to-create selection
  const [selectAll, setSelectAll] = React.useState(false); // "move all days" mode: a drag shifts every day of the grabbed task
  // Two separate switches for the week grid's hobby layers: YOUR "for me" blue boxes (left)
  // and the avatar's free-time hobbies (right). Each persisted, default on.
  const usePref = (key) => {
    const [v, setV] = React.useState(() => {
      try { return localStorage.getItem(key) !== '0'; } catch { return true; }
    });
    const toggle = () => setV(p => { const nv = !p; try { localStorage.setItem(key, nv ? '1' : '0'); } catch {} return nv; });
    return [v, toggle];
  };
  const [showAvHobby, toggleAvHobby] = usePref('tm_wk_avhobby'); // avatar free-time hobbies (☕ toggle); ME hobbies always show
  // Pointer-drag the block body to MOVE it in time (preserving duration); a quick
  // tap with no movement opens the editor. The drag preview is scoped to the column
  // being dragged (blockId + dayIdx) so only that day moves on screen, and the commit
  // splits that weekday off into its own block — other days keep the original time.
  // Vertical pointer-drag that AUTO-SCROLLS the timeline when you reach the top or
  // bottom edge, so a block can be dragged to a time that's off-screen. The delta is
  // computed in CONTENT space (scrollTop + pointer), so the auto-scroll is folded in
  // and the block keeps following the pointer as the view scrolls under it.
  const dragVert = (e, { onDelta, onCommit, onTap, onHold }) => {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    const cont = scrollRef.current;
    const rect = cont ? cont.getBoundingClientRect() : { top: 0, bottom: 99999 };
    const content0 = (cont ? cont.scrollTop : 0) + (e.clientY - rect.top);
    const m0 = toMin(content0); // start time under the pointer, on the compressed axis
    const st = { moved: false, delta: 0, held: false };
    let clientY = e.clientY, raf = 0;
    // Long-press with no movement → onHold (used to open the editor on a Week block); a quick
    // tap still fires onTap, and the timer is cancelled the instant a drag (move) begins.
    let holdT = onHold ? setTimeout(() => { if (!st.moved) { st.held = true; if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} } onHold(); } }, 500) : null;
    const EDGE = 52, MAX = 16; // edge-zone height (px) and max scroll speed (px/frame)
    const recompute = () => {
      const contentY = (cont ? cont.scrollTop : 0) + (clientY - rect.top);
      if (!st.moved && Math.abs(contentY - content0) < 4) return;
      st.moved = true;
      if (holdT) { clearTimeout(holdT); holdT = null; } // a real drag started → cancel the long-press
      // Delta in MINUTES via the inverse axis map, so a move snaps to real times even
      // across the compressed empty gaps (not raw pixels / SC, which would skew).
      st.delta = Math.round((toMin(contentY) - m0) / 5) * 5;
      onDelta(st.delta);
    };
    const tick = () => {
      if (cont) {
        let dv = 0;
        if (clientY < rect.top + EDGE) dv = -Math.ceil((rect.top + EDGE - clientY) / EDGE * MAX);
        else if (clientY > rect.bottom - EDGE) dv = Math.ceil((clientY - (rect.bottom - EDGE)) / EDGE * MAX);
        if (dv) {
          const before = cont.scrollTop;
          cont.scrollTop = Math.max(0, Math.min(cont.scrollHeight - cont.clientHeight, before + dv));
          if (cont.scrollTop !== before) recompute(); // keep following while it scrolls
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const move = (ev) => { clientY = ev.clientY; recompute(); };
    const end = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      window.removeEventListener('pointercancel', end);
      cancelAnimationFrame(raf);
      if (holdT) { clearTimeout(holdT); holdT = null; }
      if (st.held) return;                                 // long-press already opened the editor
      if (!st.moved) { onTap && onTap(); } else { onCommit && onCommit(st.delta); }
    };
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end); // touch: commit/cleanup if the browser cancels the gesture
  };
  const startMove = (e, b, d) => dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'move', scope: selectAll ? 'activity' : 'day', blockId: b.id, dayIdx: d.idx, activityId: b.activityId, delta }),
    // Tap the block body (no drag) → open the editor, exactly like the Day view (body opens
    // edit, the check RAIL handles done). Marking done now lives on the per-block check box
    // (.wg-box), so a body tap no longer toggles completion — that overloaded tap was the
    // main reason Week "felt different" from Day.
    onTap: () => onEditBlock && onEditBlock(b),
    // Long-press → also opens the block editor (rename / time / delete) — redundant affordance.
    onHold: () => onEditBlock && onEditBlock(b),
    onCommit: (delta) => {
      setDrag(null);
      if (selectAll) { onMoveAllForActivity(b.activityId, delta); return; }
      const dur = b.end - b.start;
      const ns = Math.max(0, Math.min(1440 - dur, b.start + delta));
      onMoveBlock(b.id, ns, ns + dur, d.idx, d.ts);
    },
  });
  // Drag the bottom grip to RESIZE the block's end time (whole task in select-all mode).
  const startResize = (e, b, d) => { e.stopPropagation(); dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'resize', scope: selectAll ? 'activity' : 'day', blockId: b.id, dayIdx: d.idx, activityId: b.activityId, delta }),
    onCommit: (delta) => {
      setDrag(null);
      if (selectAll) { onResizeAllForActivity(b.activityId, delta); return; }
      const ne = Math.max(b.start + 5, Math.min(1440, b.end + delta));
      onResizeBlock(b.id, ne, d.idx, d.ts);
    },
  }); };
  // Drag YOUR ME (yellow) session to a different time, like the Day view's MeSeg. A tap
  // (no movement) just undoes the session; a drag shifts its start/end and commits.
  const startMeMove = (e, b, d, seg, si) => dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'me', blockId: b.id, dayIdx: d.idx, segIdx: si, delta }),
    onTap: () => onToggleDone(d.ts, b),
    onCommit: (delta) => {
      setDrag(null);
      const segs = blockSegs(d.dmap, b).slice();
      const cur = segs[si]; if (!cur) return;
      const dur = cur.end - cur.start;
      const ns = Math.max(0, Math.min(1440 - dur, cur.start + delta));
      segs[si] = { start: ns, end: ns + dur };
      onSetSegs(d.ts, b.id, segs);
    },
  });
  // Drag the bottom grip of a ME (yellow) session to RESIZE how long you logged it —
  // the same affordance the plan block has, but it edits this segment's end time.
  const startMeResize = (e, b, d, seg, si) => { e.stopPropagation(); dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'meresize', blockId: b.id, dayIdx: d.idx, segIdx: si, delta }),
    onCommit: (delta) => {
      setDrag(null);
      const segs = blockSegs(d.dmap, b).slice();
      const cur = segs[si]; if (!cur) return;
      const ne = Math.max(cur.start + 5, Math.min(1440, cur.end + delta));
      segs[si] = { start: cur.start, end: ne };
      onSetSegs(d.ts, b.id, segs);
    },
  }); };
  // YOUR "just for me" hobby blocks are real scheduled blocks, so they move/resize exactly
  // like task blocks — single day, via the same onMoveBlock/onResizeBlock. A plain tap does
  // NOTHING; long-press opens the editor (rename / time / delete), like task blocks.
  const startHobMove = (e, b, d) => dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'hobmove', blockId: b.id, dayIdx: d.idx, delta }),
    onTap: () => onEditBlock && onEditBlock(b),
    onHold: () => onEditBlock && onEditBlock(b),
    onCommit: (delta) => {
      setDrag(null);
      const dur = b.end - b.start;
      const ns = Math.max(0, Math.min(1440 - dur, b.start + delta));
      onMoveBlock(b.id, ns, ns + dur, d.idx, d.ts);
    },
  });
  const startHobResize = (e, b, d) => { e.stopPropagation(); dragVert(e, {
    onDelta: (delta) => setDrag({ mode: 'hobresize', blockId: b.id, dayIdx: d.idx, delta }),
    onCommit: (delta) => {
      setDrag(null);
      const ne = Math.max(b.start + 5, Math.min(1440, b.end + delta));
      onResizeBlock(b.id, ne, d.idx, d.ts);
    },
  }); };
  // DRAG-to-create on empty column space — the Day-view gesture, per weekday: press-drag a
  // vertical range to draw a new block, release to open BlockSheet prefilled with that day +
  // start/end. Touch needs a short HOLD to arm (so a finger-swipe still scrolls the week); a
  // plain tap does nothing (the user prefers Week mode without tap-to-create). Mouse arms on
  // the 6px threshold. Coordinates are read in CONTENT space (scrollTop + pointer) via toMin.
  const onColCreateDown = (e, d) => {
    if (!onDragCreate || (e.button != null && e.button !== 0)) return;
    const cont = scrollRef.current;
    const contRect = cont ? cont.getBoundingClientRect() : { top: 0 };
    const yToMin = (cy) => toMin((cont ? cont.scrollTop : 0) + (cy - contRect.top));
    const y0 = e.clientY;
    const st = { startMin: yToMin(y0), cur: yToMin(y0), active: false, armed: e.pointerType !== 'touch', scrolled: false, holdT: null };
    const move = (ev) => {
      const dyPx = Math.abs(ev.clientY - y0);
      if (!st.armed) { if (dyPx > 8) { st.scrolled = true; clearTimeout(st.holdT); up(); } return; } // un-armed move = a scroll
      if (!st.active && dyPx < 6) return;
      st.active = true; st.cur = yToMin(ev.clientY); ev.preventDefault();
      setCreateSel({ dayIdx: d.idx, a: st.startMin, b: st.cur });
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      clearTimeout(st.holdT);
      setCreateSel(null);
      if (st.active) {
        const a = Math.max(0, Math.round(Math.min(st.startMin, st.cur) / 5) * 5);
        const b = Math.min(1440, Math.round(Math.max(st.startMin, st.cur) / 5) * 5);
        if (b - a >= 10) onDragCreate(d.idx, a, b); // a real range → create; tiny drags/taps are ignored
      }
    };
    if (e.pointerType === 'touch') st.holdT = setTimeout(() => { st.armed = true; if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} } }, 220);
    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = Math.max(0, toY(weekOffset === 0 ? nowMin : 480) - 120);
  }, [weekOffset]);
  // First day you ever checked anything off — days before this aren't graded (you
  // shouldn't be faulted for days before you started using the app), same as History.
  const earliest = earliestTrackedDay(done, now);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const ts = addDays(weekStart, i);
    const dStart = startOfDay(ts);
    const isToday = dStart === todayStart, isPast = dStart < todayStart, isFuture = dStart > todayStart;
    // Hobbies ("just for me") never race the committed self, so they're kept OUT of the
    // YOU-vs-avatar task lanes — but they DO show in the grid now as their own blue boxes.
    const allBlocks = blocksForDate(schedule, done, ts);
    const blocks = allBlocks.filter(b => notHobby(b, activities));
    const hobbyBlocks = allBlocks.filter(b => !notHobby(b, activities));
    const dmap = done[dayKey(ts)] || {};
    // Per-day "kept up" grade for the column header — mirrors weekStats/Day mode so the
    // numbers always agree: rested days & whole-day tickets aren't graded; today counts
    // only up to now; the future & pre-tracking days don't count; hobby + task-excused
    // blocks drop out. pct === null → the header shows a neutral mark, not a red 0%.
    const isRestDay = restDays.indexOf(i) !== -1;
    const dayTicketed = isTicketed(tickets, ts);
    const beforeTracking = isPast && dStart < earliest;
    const gblocks = (isRestDay || dayTicketed) ? [] : gradedBlocks(blocks, tickets, ts, activities);
    const cap = isFuture ? 0 : (isToday ? nowMin : 1440);
    const pct = (isRestDay || dayTicketed || beforeTracking) ? null : dayCredit(gblocks, dmap, cap, activities).pct;
    // Diary: a PAST day shows only what you actually did (blocks with a logged session),
    // not the recurring plan projected onto a day you never touched. Today & future keep
    // the full plan. (Grade above uses the FULL plan, so History/streak are unaffected.)
    // The avatar's PLAN (green boxes) always shows — the committed self runs its plan every
    // day, so a past day still shows what JEK did (unlogged ones read "JEK did it, you
    // didn't"). Only YOUR yellow ME sessions are diary-filtered to what you actually logged.
    const renderBlocks = isPast ? blocks.filter(b => blockSegs(dmap, b).length > 0) : blocks;
    const renderHobbies = isPast ? hobbyBlocks.filter(b => blockSegs(dmap, b).length > 0) : hobbyBlocks;
    // The avatar's free-time hobbies (decorative) — shown on EVERY day (past included),
    // like the green plan: the committed self fills its free time every day. Deterministic
    // per day (daySeed), so past days stay stable. Suppressed only on rest days / whole-day
    // tickets (the avatar is off). Same generator as the Day timeline.
    const avHobbies = (showAvHobby && !isRestDay && !dayTicketed)
      ? livelyFillers(resolveBehavior(avatar, null), blocks, activities, Math.round(dStart / 86400000)) : [];
    // Free ME sessions you logged yourself via "＋" (not tied to a block): dashed boxes,
    // stored on done[dk]._free. They're real tracked time, so they show on every day.
    const frees = (dmap._free || []).map(snapSeg);
    days.push({ idx: i, ts, isToday, isPast, isFuture, offset: Math.round((dStart - todayStart) / 86400000),
      blocks: renderBlocks, planBlocks: blocks, hobbies: renderHobbies, avHobbies, frees, dmap, isRestDay, dayTicketed, plannedCount: gblocks.length, pct });
  }
  // ── Full-day time axis (Google-Calendar style) ────────────────────────────────
  // Always span the whole day, 12 AM → 12 AM, so EVERY hour is reachable by scrolling
  // no matter where the blocks sit (early-morning or late-night times are never cut
  // off). The view auto-scrolls to the now-line / first block on open (effect above),
  // so you still land on the action instead of staring at empty pre-dawn hours.
  // toY: minutes→px (linear); toMin: its inverse (used by the drag math).
  const TOP_PAD = 6;
  const lo = 0, hi = 1440;
  const CANVAS_H = TOP_PAD * 2 + (hi - lo) * SC;
  const toY = (min) => TOP_PAD + (Math.max(lo, Math.min(hi, min)) - lo) * SC;
  const toMin = (yy) => Math.max(lo, Math.min(hi, lo + (yy - TOP_PAD) / SC));
  const hourMarks = [];
  for (let h = Math.ceil(lo / 60) * 60; h <= hi; h += 60) hourMarks.push(h);
  const halfMarks = [];
  for (let h = Math.ceil(lo / 30) * 30; h < hi; h += 30) if (h % 60 !== 0) halfMarks.push(h);
  const wEnd = addDays(weekStart, 6);
  const rangeLabel = new Date(weekStart).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    + ' – ' + new Date(wEnd).toLocaleDateString('en-US', { day: 'numeric' });
  // Week rollup for the "kept" pill — same scoring as the History "This week" card.
  const stats = weekStats(schedule, done, weekStart, now, earliest, restDays, tickets, activities);
  const keptClass = stats.finishedPlanned === 0 ? 'dim'
    : stats.keptCount === stats.finishedPlanned ? 'good'
    : stats.keptCount / stats.finishedPlanned >= 0.5 ? 'mid' : 'bad';
  // Speak the Day view's metric language: ONE "NN% · time" pill (gradeDone vs gradePlan,
  // the same scoring as the Day pill) instead of a separate "k/n kept" count — so a user
  // reads the same number in both modes. The day-kept count moves to the pill's tooltip.
  const weekPct = stats.gradePlan > 0 ? Math.round(stats.gradeDone / stats.gradePlan * 100) : null;
  const pillClass = weekPct == null ? 'dim' : weekPct >= 100 ? 'good' : weekPct >= 60 ? 'mid' : 'bad';
  // Compact WEEK race for the week-nav row — JEK = the committed self's minutes due BY NOW
  // across this week, ME = what you've logged this week, both against the full week's
  // planned minutes. (Same JEK/ME bars as the dashboard, scaled from a day to the week.)
  const raceTotal = stats.weekPlanFull;
  const raceJek = stats.gradePlan, raceMe = stats.gradeDone;
  // Show the JEK/ME race on the CURRENT week (progress so far) AND on PAST weeks (the settled
  // you-vs-committed-self summary — raceJek = the full week's plan that was due). Hidden for
  // future weeks and pre-tracking weeks (raceJek === 0), so it never shows misleading empty bars.
  const showRace = raceTotal > 0 && (weekOffset === 0 || raceJek > 0);
  const raceJekPct = raceTotal > 0 ? Math.min(100, raceJek / raceTotal * 100) : 0;
  const raceMePct = raceTotal > 0 ? Math.min(100, raceMe / raceTotal * 100) : 0;
  const raceGap = Math.max(0, raceJek - raceMe);
  return (
    <div className="wg-wrap">
      {/* Rest/Away bar — only on the CURRENT week (it targets today; showing it while paging
          to another week would float today's rest controls over the wrong week). Mirrors the
          this-week-only gating of the race bars, now-line and "All week" button. */}
      {weekOffset === 0 && restBar}
      <div className="cal-head wg-nav">
        <button className="cal-nav" onClick={() => setWeekOffset(o => o - 1)} aria-label={tr('wk.prevWeek')}>‹</button>
        <div className="cal-date">
          <button className="cal-date-pick" onClick={() => setDateOpen(o => !o)} aria-label={tr('wk.pickWeek')}>
            <span className="cal-date-main">{weekOffset === 0 ? tr('wk.thisWeek') : rangeLabel}</span>
            <span className="cal-date-caret">▾</span>
          </button>
          {dateOpen && (
            <DatePopover value={weekStart}
              onPick={(ts) => pickWeek(ts)}
              onClose={() => setDateOpen(false)} />
          )}
        </div>
        <button className="cal-nav" onClick={() => setWeekOffset(o => o + 1)} aria-label={tr('wk.nextWeek')}>›</button>
        {showRace && (
          <span className="wg-race" title={raceGap >= 1 ? tr('wk.raceBehind', { t: formatHM(Math.round(raceGap) * 60), name: avatar.name }) : tr('wk.raceInStep', { name: avatar.name })}>
            <span className="hrm-row"><span className="hrm-tag jek">{avatar.name}</span><span className="hrm-track"><span className="hrm-fill jek" style={{ width: raceJekPct + '%' }} /></span><span className="hrm-val">{formatHM(Math.round(raceJek) * 60)}</span></span>
            <span className="hrm-row"><span className="hrm-tag me">ME</span><span className="hrm-track"><span className="hrm-fill me" style={{ width: raceMePct + '%' }} /></span><span className="hrm-val">{formatHM(Math.round(raceMe) * 60)}</span></span>
          </span>
        )}
        {weekPct != null
          ? <span className={'wg-kept ' + pillClass} title={tr('wk.kept', { k: stats.keptCount, n: stats.finishedPlanned })}>{weekPct}% · {formatHM(Math.round(stats.gradeDone) * 60)}</span>
          : <span className="wg-kept dim" title={tr('wk.nothingGraded')}>{tr('wk.keptNone')}</span>}
      </div>
      <div className="wg-tools">
        {/* Legend for the per-day grade glyphs in the column headers (⭐ / ◑ / ○). They're
            net-new symbols not used in Day mode, and tooltips are useless on touch — so spell
            out the ends of the ladder once here. */}
        <span className="wg-legend" aria-hidden="true">
          <span><span className="wg-lg-g kept">{WEEK_GLYPH.kept}</span>{tr('wk.lgDone')}</span>
          <span><span className="wg-lg-g half">{WEEK_GLYPH.half}</span>{tr('wk.lgHalf')}</span>
          <span><span className="wg-lg-g miss">{WEEK_GLYPH.miss}</span>{tr('wk.lgMissed')}</span>
        </span>
        <span className="wg-toolgroup">
          {/* Copy TODAY's plan forward across the rest of the week — the week-level
              "apply to every day" (forward-only; confirms before writing). */}
          {onMakeAllLikeToday && weekOffset === 0 && (
            <button className="wg-allbtn" onClick={onMakeAllLikeToday} aria-label={tr('sched.allLikeToday')} title={tr('sched.allLikeToday')}>
              {/* ↻ repeat (not a clipboard): PROPAGATES today's plan across the week's days,
                  matching the block editor's "↻ Use this time on all its days" affordance. */}
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="m17 2 4 4-4 4" /><path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                <path d="m7 22-4-4 4-4" /><path d="M21 13v1a4 4 0 0 1-4 4H3" />
              </svg>
              <span className="wg-btn-lbl">{tr('wk.lblRepeat')}</span>
            </button>
          )}
          {/* Routines: save day-templates, quick-copy today, or slot a routine onto each weekday.
              Same sheet as the Day view's toolbar — one cohesive line-icon, no raw emoji. */}
          {onOpenRoutines && (
            <button className="wg-allbtn routines" onClick={onOpenRoutines} aria-label={tr('rt.title')} title={tr('rt.title')}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
              </svg>
              <span className="wg-btn-lbl">{tr('wk.lblRoutines')}</span>
            </button>
          )}
          {/* ＋ Add a task — the same primary action the Day toolbar has. Week previously had
              NO obvious way to add (you had to drag empty time or open a day), the #1 reason it
              felt harder than Day. Defaults the new block to today's weekday. */}
          {onAddBlock && (
            <button className="wg-allbtn wg-add" onClick={onAddBlock} aria-label={tr('sched.addBlock')} title={tr('sched.addBlock')}>
              <span className="wg-add-plus">＋</span>
              <span className="wg-btn-lbl">{tr('wk.lblAdd')}</span>
            </button>
          )}
        </span>
      </div>
      <div className="wg-xscroll">
        <div className="wg-xinner">
      <div className="wg-head" style={{ paddingRight: sbw }}>
        <div className="wg-corner" />
        {days.map(d => {
          // Same achievement-ladder glyph as the Progress "This week" strip (⭐/◕/◑/◔/○)
          // instead of a plain dot, so the two views read the same. Today stays neutral
          // (•) until it hits 100%; rest/ticket keep their own marks.
          const tier = d.isToday ? (d.pct >= 100 ? 'kept' : 'today') : dayTier(d.pct);
          return (
          <button key={d.idx} className={'wg-dh' + (d.isToday ? ' today' : '')} onClick={() => onOpenDay(d.offset)}>
            <span className="wg-dh-dow">{wd(d.idx)}</span>
            <span className="wg-dh-num">{new Date(d.ts).getDate()}</span>
            {/* At-a-glance kept-up grade (precise % is one tap away in Day view). */}
            {d.isRestDay
              ? <span className="wg-dh-rest" title={tr('day.restDay')}>🌿</span>
              : d.dayTicketed
                ? (() => { const am = awayReasonMeta(awayReasonOn(tickets, d.ts)); return <span className="wg-dh-rest" title={tr('day.wholeExcused')}>{am ? <ActionEmoji code={am.code} size={14} label="" fallback={am.glyph} /> : <span className="tix-tilt">🎟️</span>}</span>; })()
                : d.isFuture
                  ? <span className="wg-dh-glyph future" title={tr('day.upcoming')}>{WEEK_GLYPH.future}</span>
                  : (d.plannedCount === 0 || d.pct == null)
                    ? <span className="wg-dh-glyph none" title={tr('day.nothingPlanned')}>{WEEK_GLYPH.none}</span>
                    : <span className={'wg-dh-glyph ' + tier} title={tr('day.pctKept', { pct: d.pct })}>{WEEK_GLYPH[tier]}</span>}
          </button>
          );
        })}
      </div>
      <div className="wg-scroll" ref={scrollRef}>
        <div className="wg-canvas" style={{ height: CANVAS_H }}>
          {/* Time-of-day band tints behind the day columns (no labels here — too tight). */}
          {sortedBands(bands).map(bd => {
            const bTop = Math.max(lo, bd.start), bBot = Math.min(hi, bd.end);
            const bh = (bBot - bTop) * SC;
            if (bh <= 0) return null;
            return <div key={bd.id} className="wg-band" style={{ top: toY(bTop), height: bh, '--band-rgb': hexToRgb(bd.color) }} />;
          })}
          {hourMarks.map(h => (
            <React.Fragment key={h}>
              <div className="wg-hline" style={{ top: toY(h) }} />
              <div className="wg-hlabel" style={{ top: toY(h) }}>{fmtHourLabel(h)}</div>
            </React.Fragment>
          ))}
          {halfMarks.map(h => <div key={'hm' + h} className="wg-half" style={{ top: toY(h) }} />)}
          <div className="wg-cols">
            {days.map(d => {
              const isRest = restDays.indexOf(d.idx) !== -1;
              // GCal side-by-side columns for time-overlapping plan blocks (so an overlapped
              // block stays visible + tappable instead of being painted over).
              const planLayout = weekBlockLayout(d.planBlocks);
              return (
                <div key={d.idx} className={'wg-col' + (d.isToday ? ' today' : '') + (isRest ? ' rest' : '')}>
                  {/* Drag-to-create surface (under the blocks, z:1): press-drag empty time to draw
                      a new block, like the Day view. Blocks sit above (z:2) so their own drags win. */}
                  {onDragCreate && <div className="wg-create-layer" onPointerDown={(e) => onColCreateDown(e, d)} aria-label={tr('sched.addBlock')} />}
                  {/* Live selection rectangle while dragging out a new block on THIS day. */}
                  {createSel && createSel.dayIdx === d.idx && (
                    <div className="wg-create-sel" style={{ top: toY(Math.min(createSel.a, createSel.b)), height: Math.max(3, toY(Math.max(createSel.a, createSel.b)) - toY(Math.min(createSel.a, createSel.b))) }} />
                  )}
                  {/* YOUR "just for me" hobby blocks — blue, on the LEFT (you) half, never
                      raced. Drag the body to move, the bottom grip to resize, tap to edit —
                      exactly like a task block (single day; no done/"move all" semantics). */}
                  {d.hobbies.map(b => {
                    const a = findActivity(activities, b.activityId);
                    const name = a ? a.name : tr('fallback.deleted');
                    // Live drag preview: 'hobmove' shifts the whole block, 'hobresize'
                    // stretches its end — follow the pointer before the change commits.
                    let hStart = b.start, hEnd = b.end;
                    const hobActive = drag && drag.blockId === b.id && drag.dayIdx === d.idx;
                    if (hobActive && drag.mode === 'hobmove') {
                      const dur = b.end - b.start;
                      hStart = Math.max(0, Math.min(1440 - dur, b.start + drag.delta)); hEnd = hStart + dur;
                    } else if (hobActive && drag.mode === 'hobresize') {
                      hEnd = Math.max(b.start + 5, Math.min(1440, b.end + drag.delta));
                    }
                    const hobDragged = hobActive && (drag.mode === 'hobmove' || drag.mode === 'hobresize');
                    const hobLive = d.isToday && nowMin >= b.start && nowMin < b.end;
                    const hHeight = Math.max(16, toY(hEnd) - toY(hStart));
                    return (
                      <div key={'hob' + b.id} role="button" tabIndex={0} className={'wg-block hobby' + (hobDragged ? ' dragging' : '')}
                        style={{ top: toY(hStart), height: hHeight, left: '2px', right: '2px' }}
                        onPointerDown={(e) => startHobMove(e, b, d)}
                        title={name + ' · just for me · ' + fmtClock(hStart) + '–' + fmtClock(hEnd) + ' — drag to move, grip to resize'}>
                        <div className={'wg-lane hobby clean' + (hHeight >= 26 ? ' tall' : '') + (hobLive ? ' live' : '')}>
                          <span className="wg-row clean">
                            <TaskEmoji act={a} size={15} label={name} />
                            <span className="wg-name">{name}</span>
                          </span>
                          {hHeight >= 26 && <span className="wg-time">{fmtClock(hStart)}</span>}
                        </div>
                        <div className="wg-block-resize" onPointerDown={(e) => startHobResize(e, b, d)} aria-label={tr('a11y.resize')} />
                      </div>
                    );
                  })}
                  {/* (avatar free-time decorative hobbies removed from the Week view — the
                      clean planning calendar shows only YOUR plan + sessions.) */}
                  {d.planBlocks.map(b => {
                    const a = findActivity(activities, b.activityId);
                    const col = a ? a.color : '#64748b';
                    // Box states mirror the Day view exactly: done = you logged a session,
                    // jekDone = the block has ended and the committed self finished it but
                    // you didn't, excused = a rest ticket. (Binary, segment-based — same as
                    // the Day view's check rail.)
                    const isDone = blockSegs(d.dmap, b).length > 0;
                    const started = d.isPast || (d.isToday && nowMin >= b.start);
                    const ended = d.isPast || (d.isToday && nowMin >= b.end);
                    const live = d.isToday && nowMin >= b.start && nowMin < b.end; // its time NOW → glow, like Day mode
                    const dayExcused = isTicketed(tickets, d.ts);              // whole-day rest (locked)
                    const blockExcused = blockTicketed(tickets, d.ts, b.id);   // per-task ticket (tap to cancel)
                    const excused = dayExcused || blockExcused;
                    const jekDone = ended && !isDone && !excused; // avatar did it, you didn't (gentle, like Day view)
                    const name = a ? a.name : tr('fallback.deleted');
                    // Goal/amount visibility — parity with the Day view's goal badge. If this
                    // activity has a per-session target, surface how much you've logged (3/8 or
                    // 50%) so PARTIAL progress isn't invisible in Week (the old grid showed a
                    // blank box even when you'd logged 3/8 in Day). Tap → open the Day, where the
                    // full amount logger lives. (amountOf is a parent closure, so read inline.)
                    const goalTarget = a ? (a.goalMode === 'percent' ? 100 : actAmtTarget(a, dayIndexMon(d.ts))) : 0;
                    const _ge = d.dmap[b.id];
                    const loggedAmt = (_ge && typeof _ge === 'object' && typeof _ge.amount === 'number') ? _ge.amount : 0;
                    const isPctGoal = !!(a && a.goalMode === 'percent');
                    const goalUnit = (a && a.unit) ? a.unit : '';
                    // Live drag preview: shift/resize this column's block (or every day's, in
                    // "move all" mode) so it follows the pointer before the move commits.
                    // A 'me'/'meresize' drag affects only the YOUR-session segment (rendered
                    // separately below); it must NOT touch this plan block, or the green box
                    // moves/resizes while you drag the yellow one.
                    const isDragged = drag && drag.mode !== 'me' && drag.mode !== 'meresize' && (drag.scope === 'activity'
                      ? drag.activityId === b.activityId
                      : drag.blockId === b.id && drag.dayIdx === d.idx);
                    let bStart = b.start, bEnd = b.end;
                    if (isDragged) {
                      const dur = b.end - b.start;
                      // For an activity-scope drag the preview must use the SAME single
                      // group-clamped delta the commit uses, or blocks visibly snap on release.
                      const grp = drag.scope === 'activity' ? schedule.filter(x => x.activityId === b.activityId) : null;
                      if (drag.mode === 'move') {
                        if (grp) {
                          const minStart = Math.min.apply(null, grp.map(x => x.start));
                          const maxEnd = Math.max.apply(null, grp.map(x => x.end));
                          const eff = Math.max(-minStart, Math.min(1440 - maxEnd, drag.delta));
                          bStart = b.start + eff; bEnd = b.end + eff;
                        } else { bStart = Math.max(0, Math.min(1440 - dur, b.start + drag.delta)); bEnd = bStart + dur; }
                      } else {
                        if (grp) {
                          const maxEnd = Math.max.apply(null, grp.map(x => x.end));
                          const minSlack = Math.min.apply(null, grp.map(x => (x.end - x.start) - 5));
                          const eff = Math.max(-minSlack, Math.min(1440 - maxEnd, drag.delta));
                          bEnd = b.end + eff;
                        } else { bEnd = Math.max(b.start + 5, Math.min(1440, b.end + drag.delta)); }
                      }
                    }
                    const height = Math.max(16, toY(bEnd) - toY(bStart));
                    const tall = height >= 26;
                    // Single-tone plan box — NO more left/right "half you / half JEK" split (it
                    // read as a mysterious half-filled box). Completion is shown the Day way: a
                    // green plan block + a check box that fills ✓. The you-vs-JEK story lives in
                    // the race bars up top, not inside every block. (.wg-lane.plan[.done/.jekdone/
                    // .excused] already carries the tint via CSS classes.)
                    // Side-by-side column placement so overlapping blocks don't occlude each other.
                    const lay = planLayout[b.id] || { col: 0, cols: 1 };
                    const wPct = 100 / lay.cols;
                    // Drag the body to reschedule, the bottom grip to resize. Tap a started block to
                    // mark done; tap a future one to edit (long-press always opens the editor).
                    return (
                      <div key={'av' + b.id} role="button" tabIndex={0}
                        className={'wg-block av' + (isDone ? ' done' : '') + (jekDone ? ' jekdone' : '') + (dayExcused && !blockExcused ? ' soft-away' : '') + (isDragged ? ' dragging' : '')}
                        style={{ top: toY(bStart), height, left: 'calc(' + (lay.col * wPct) + '% + 1px)', width: 'calc(' + wPct + '% - 2px)' }}
                        onPointerDown={(e) => startMove(e, b, d)}
                        title={name + ' ' + fmtClock(bStart) + '–' + fmtClock(bEnd) + (isDone ? ' · you did this — tap ✓ to undo' : blockExcused ? ' · excused — tap 🎟️ to cancel' : jekDone ? ' · ' + (avatar.name || 'JEK') + ' did it — tap ✓ if you did too' : started ? ' · tap ✓ to mark done · body to edit' : ' · tap to edit')}>
                        <div className={'wg-lane plan clean' + (tall ? ' tall' : '') + (isDone ? ' done' : '') + (jekDone ? ' jekdone' : '') + (live ? ' live' : '') + (excused ? ' excused' : '')}>
                          {/* Done check box — the compact mirror of the Day view's check rail:
                              empty ◯ → ✓ lime when you've done it, a faint JEK face when JEK
                              finished it but you didn't, 🎟️ when rested. Its own pointer/click
                              stops the body drag so a tap on it marks done (never starts a move). */}
                          {(() => {
                            const canUnrest = blockExcused;
                            const boxActive = canUnrest || (started && !excused);
                            return (
                              <button className={'wg-box' + (isDone ? ' done' : '') + (jekDone ? ' jekdone' : '') + (excused ? ' rested' : '') + (canUnrest ? ' unrestable' : '')}
                                disabled={!boxActive}
                                onPointerDown={(e) => e.stopPropagation()}
                                onClick={(e) => { e.stopPropagation(); if (canUnrest) { onUnrest(d.ts, b); } else if (started && !excused) { onToggleDone(d.ts, b); } }}
