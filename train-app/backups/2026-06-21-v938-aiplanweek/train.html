                        <span className="agenda-band-emoji"><ActionEmoji code={bandEmojiCode(g.band.emoji)} size={17} fallback={g.band.emoji} label="" /></span>
                        <span className="agenda-band-name">{bandLabel(g.band)}</span>
                        <span className="agenda-band-time">{fmtClock(g.band.start)}–{fmtClock(g.band.end)}</span>
                        <span className="agenda-band-edit" aria-hidden="true">✎</span>
                      </button>
                    ) : (
                      <div className="agenda-band-head">
                        <span className="agenda-band-emoji">🕓</span>
                        <span className="agenda-band-name">{tr('band.other')}</span>
                      </div>
                    )}
                    {g.rows.map((r, i) => renderRow(r, gi + '-' + i))}
                  </React.Fragment>
                ));
              })()}
              {/* Full-screen way to schedule a task without fighting the half-height timeline:
                  opens BlockSheet (activity + wheel start/end), defaulting to THIS day. */}
              {!listEdit && (
                <button className="btn-primary btn-block" style={{ marginTop: 16 }} onClick={() => { setListEdit(false); setSheet({ isNew: true, day: viewIdx, fromList: true }); }}>{tr('sched.addTask')}</button>
              )}
              {/* One-tap: make every weekday match this day (its tasks repeat all week at the same
                  times; other days keep their own extras). */}
              {viewBlocks.length > 0 && (
                <button className="btn-ghost btn-block" style={{ marginTop: 10 }} onClick={() => broadcastDayToAll(viewTs)}>{tr('sched.copyToAll')}</button>
              )}
            </div>
          </div>
        </React.Fragment>
      )}

      {bandEditOpen && (
        <React.Fragment>
          <div className="sheet-backdrop l2" onClick={() => setBandEditOpen(false)} />
          <div className="sheet l2" role="dialog" aria-modal="true">
            <div className="sheet-grabber" />
            <div className="sheet-header">
              <button className="btn-ghost" onClick={() => setBandEditOpen(false)}>{tr('common.back')}</button>
              <div className="sheet-title">{tr('band.title')}</div>
              <span style={{ width: 52 }} />
            </div>
            <div className="sheet-body"><BandEditor bands={bands} setBands={setBands} highlightId={typeof bandEditOpen === 'string' ? bandEditOpen : null} /></div>
          </div>
        </React.Fragment>
      )}

      {routinesOpen && (
        <RoutinesSheet
          routines={routines} setRoutines={setRoutines}
          weekSlots={weekSlots} setWeekSlots={setWeekSlots}
          weekRoutines={weekRoutines} setWeekRoutines={setWeekRoutines}
          schedule={schedule} setSchedule={setSchedule}
          activities={activities} viewBlocks={viewBlocks}
          plan={plan} onOpenBilling={onOpenBilling}
          onQuickCopy={() => broadcastDayToAll(viewTs)} canQuickCopy={viewBlocks.length > 0}
          onClose={() => setRoutinesOpen(false)} />
      )}

      {awayOpen && (
        <AwaySheet viewTs={viewTs} setTickets={setTickets} onClose={() => setAwayOpen(false)} />
      )}

    </div>
  );
}

function ScheduleEditor({ activities, setActivities, schedule, setSchedule, onBack }) {
  const [day, setDay] = React.useState(dayIndexMon(Date.now()));
  const [sheet, setSheet] = React.useState(null); // { block } edit | { isNew: true }
  const dayBlocks = blocksForDay(schedule, day);
  const addBlock = (b) => setSchedule(prev => [...prev, b]);
  const updateBlock = (b) => setSchedule(prev => prev.map(x => x.id === b.id ? b : x));
  const removeBlock = (id) => setSchedule(prev => prev.filter(x => x.id !== id));

  return (
    <div className="editor-screen">
      <div className="editor-head">
        <button className="btn-ghost" onClick={onBack}>{tr('editor.done')}</button>
        <div className="editor-title">{tr('editor.title')}</div>
        <span style={{ width: 52 }} />
      </div>
      <div className="day-tabs">
        {wdArr().map((lbl, i) => (
          <button key={i} className={'day-tab' + (day === i ? ' on' : '')} onClick={() => setDay(i)}>{lbl}</button>
        ))}
      </div>
      <div className="editor-dayname">{wdf(day)}</div>
      {dayBlocks.length === 0 ? (
        <p className="empty-sub editor-empty">{tr('editor.noBlocksDay', { day: wdf(day) })}</p>
      ) : (
        <div className="blockrow-list">
          {dayBlocks.map(b => {
            const a = findActivity(activities, b.activityId);
            const col = a ? a.color : '#64748b';
            return (
              <button key={b.id} className="blockrow" onClick={() => setSheet({ block: b })}>
                <span className="blockrow-time">{fmtClock(b.start)}<br />{fmtClock(b.end)}</span>
                <span className="blockrow-bar" style={{ background: col }} />
                <span className="blockrow-name">{a ? a.name : tr('fallback.deleted')}</span>
                {b.days.length > 1 && <span className="blockrow-days">×{b.days.length}d</span>}
              </button>
            );
          })}
        </div>
      )}
      <button className="btn-ghost btn-block" onClick={() => setSheet({ isNew: true })}>{tr('editor.addBlock')}</button>

      {sheet && (
        <BlockSheet
          activities={activities}
          setActivities={setActivities}
          schedule={schedule}
          initial={sheet.block || null}
          defaultDay={day}
          onCancel={() => setSheet(null)}
          onSave={(b) => { if (sheet.block) updateBlock(b); else addBlock(b); setSheet(null); }}
          onDelete={sheet.block ? () => { removeBlock(sheet.block.id); setSheet(null); } : null}
        />
      )}
    </div>
  );
}

// Quick Add — the SIMPLE front door for creating an activity straight from the Main page.
// One screen, no scrolling: name + emoji, which days, and a TIME chosen by preset chips
// (Morning / Midday / Evening / Night) with a tap-to-fine-tune picker — so nobody has to hunt
// for "where do I type the time". Always creates a NEW activity + its schedule block in one go
// (calls the host's `commit`). Deeper attributes (scoring mode, weekly goal, race-vs-avatar)
// live behind the "More settings" link, which creates the activity now and hands off to the
// full ActivitySheet — progressive disclosure, nothing lost.
function QuickAddSheet({ activities, initialDays, initialStart, onSave, onAdvanced, onCancel }) {
  useEscClose(onCancel);
  const trapRef = React.useRef(null);
  useFocusTrap(trapRef);
  const [name, setName] = React.useState('');
  const [emoji, setEmoji] = React.useState(DEFAULT_TASK_EMOJI);
  const [gifOpen, setGifOpen] = React.useState(false);
  const [color] = React.useState(() => pickFreeColor(activities.map(a => a.color)));
  // When opened from a tapped Week/Day slot we seed the day + start time; from the Main
  // "+ Add" button there's no slot context → a daily habit at 7am.
  const [days, setDays] = React.useState(() => (Array.isArray(initialDays) && initialDays.length) ? initialDays.slice() : ALL_DAYS.slice());
  const [start, setStart] = React.useState(Number.isFinite(initialStart) ? Math.max(0, Math.min(1380, Math.round(initialStart / 5) * 5)) : 420);
  const [dur, setDur] = React.useState(60);
  const snap5 = (m) => Math.round(m / 5) * 5;
  const end = Math.min(1440, start + dur);
  const PRESETS = [{ k: 'qa.morning', m: 420 }, { k: 'qa.midday', m: 720 }, { k: 'qa.evening', m: 1080 }, { k: 'qa.night', m: 1260 }];
  const toggleDay = (i) => setDays(p => p.indexOf(i) === -1 ? [...p, i].sort((a, b) => a - b) : p.filter(d => d !== i));
  const allOn = days.length === 7;
  const setStartMin = (ns) => setStart(Math.max(0, Math.min(1380, snap5(ns))));
  const onStartPick = (v) => setStartMin(inputToMin(v));
  // End picker keeps the block's length sane: never before start, never past midnight.
  const onEndPick = (v) => { const e = Math.min(1440, snap5(inputToMin(v))); setDur(Math.max(5, e - start)); };
  const fmt12 = (min) => { const m = ((Math.round(min) % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; if (getLang() === 'th' || clock24()) return h + ':' + String(mm).padStart(2, '0'); const ap = h < 12 ? 'AM' : 'PM'; let hr = h % 12; if (hr === 0) hr = 12; return hr + ':' + String(mm).padStart(2, '0') + ' ' + ap; };
  const valid = name.trim().length > 0 && days.length > 0 && end > start;
  const buildWhen = () => ({ specs: [{ days: days.slice().sort((a, b) => a - b), start: snap5(start), end: Math.max(snap5(start) + 5, snap5(end)) }] });
  const save = () => { if (valid) onSave(name.trim(), color, emoji, buildWhen()); };
  const advanced = () => { if (valid && onAdvanced) onAdvanced({ name: name.trim(), color, emoji, when: buildWhen() }); };

  return (
    <React.Fragment>
      <div className="sheet-backdrop" onClick={onCancel} />
      <div className="sheet qa-sheet" role="dialog" aria-modal="true" ref={trapRef}>
        <div className="sheet-grabber" />
        <div className="sheet-header">
          <button className="btn-ghost" onClick={onCancel}>{tr('common.cancel')}</button>
          <div className="sheet-title">{tr('qa.title')}</div>
          <button className="btn-primary" onClick={save} disabled={!valid} style={{ opacity: valid ? 1 : 0.4 }}>{tr('common.add')}</button>
        </div>
        <div className="sheet-body">
          <div className="qa-name-row">
            <button type="button" className="qa-emoji" style={{ borderColor: color }} onClick={() => setGifOpen(true)} aria-label={tr('as.chooseEmoji')}>
              {renderTaskFace(emoji, 28, { label: 'new' })}
            </button>
            <input className="input-underline qa-name" placeholder={tr('qa.namePh')} value={name}
              onChange={e => setName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') save(); }} autoFocus />
          </div>

          <div className="race-setup-label">{tr('qa.when')}</div>
          <div className="weekday-row">
            {wdArr().map((lbl, i) => (
              <button key={i} className={'weekday-chip' + (days.indexOf(i) !== -1 ? ' on' : '')} onClick={() => toggleDay(i)} aria-label={tr('as.dayAria', { i })}>{lbl}</button>
            ))}
          </div>
          <button type="button" className={'qa-everyday' + (allOn ? ' on' : '')} onClick={() => setDays(allOn ? [] : ALL_DAYS.slice())}>{tr('qa.everyday')}</button>

          <div className="race-setup-label">{tr('qa.time')}</div>
          <div className="qa-preset-row">
            {PRESETS.map(p => (
              <button key={p.k} type="button" className={'qa-preset' + (start === p.m ? ' on' : '')} onClick={() => setStartMin(p.m)}>{tr(p.k)}</button>
            ))}
          </div>
          <div className="qa-time-row">
            <TimePicker value={minToInput(start)} onChange={onStartPick} ariaLabel={tr('bs.starts')} />
            <span className="qa-time-dash">–</span>
            <TimePicker value={minToInput(end)} onChange={onEndPick} ariaLabel={tr('bs.ends')} />
          </div>
          <div className="race-setup-explain" style={{ marginTop: 6 }}>{tr('qa.dur', { dur: fmtDur(dur), to: fmt12(end) })}</div>

          <button type="button" className="bs-details-link" onClick={advanced} disabled={!valid} style={{ opacity: valid ? 1 : 0.5 }}>{tr('qa.advanced')}</button>
        </div>
      </div>
      {gifOpen && (
        <EmojiGifPicker value={emoji} canPhoto={false}
          onPick={(code) => { setEmoji(code); pushRecentEmoji(code); setGifOpen(false); }}
          onClose={() => setGifOpen(false)} />
      )}
    </React.Fragment>
  );
}

function BlockSheet({ activities, setActivities, schedule, backMode, initial, defaultDay, defaultStart, defaultEnd, draft, session, dayLabel, daySubName, defaultSubName, onSetDaySubName, onOpenActivity, onCancel, onSave, onApplyAllDays, onDelete }) {
  useEscClose(onCancel);
  const trapRef = React.useRef(null);
  useFocusTrap(trapRef);
  const editing = !!initial;
  const [activityId, setActivityId] = React.useState(initial ? initial.activityId : (draft ? draft.activityId : (activities[0] ? activities[0].id : null)));
  // Per-day sub-label (only offered when editing an existing block on a day view).
  const [subName, setSubName] = React.useState(daySubName || '');
  // New blocks default to the day you tapped ＋ on (Day view / editor pass defaultDay),
  // not every day — tapping Wed's ＋ should add to Wed, then you widen to recurring by
  // tapping more weekday chips. Falls back to all-days only when no day context is given.
  const [days, setDays] = React.useState(() => initial ? initial.days.slice() : (draft ? draft.days.slice() : (Number.isInteger(defaultDay) ? [defaultDay] : ALL_DAYS.slice())));
  // New blocks default to a dragged-out range if given, else the current time
  // (rounded to 5 min) → +1 hour.
  const nowStart = (() => { const d = new Date(); return Math.min(1380, Math.round((d.getHours() * 60 + d.getMinutes()) / 5) * 5); })();
  const baseStart = initial ? initial.start : (draft ? draft.start : (Number.isFinite(defaultStart) ? defaultStart : nowStart));
  const baseEnd = initial ? initial.end : (draft ? draft.end : (Number.isFinite(defaultEnd) ? defaultEnd : Math.min(1440, baseStart + 60)));
  const [start, setStart] = React.useState(minToInput(baseStart));
  const [end, setEnd] = React.useState(minToInput(baseEnd));
  const [creating, setCreating] = React.useState(activities.length === 0);
  const [newName, setNewName] = React.useState('');
  const usedColors = activities.map(a => a.color);
  const [newColor, setNewColor] = React.useState(pickFreeColor(usedColors));
  // Which kind the inline "+ New" creates: 'task' (Activity section) or 'hobby' (For me section).
  const [newType, setNewType] = React.useState('task');
  const [newEmoji, setNewEmoji] = React.useState(DEFAULT_TASK_EMOJI); // emoji for the inline "+ New" activity
  const [newGifOpen, setNewGifOpen] = React.useState(false);

  const toggleDay = (i) => setDays(prev => prev.indexOf(i) === -1 ? [...prev, i].sort((a, b) => a - b) : prev.filter(d => d !== i));
  const createActivity = () => {
    const n = newName.trim(); if (!n) return;
    const a = { id: uid(), name: n, color: newColor, emoji: newEmoji, createdAt: Date.now(), ...(newType === 'hobby' ? { type: 'hobby' } : {}) };
    setActivities(prev => { try { track('activity_added', { total: prev.length + 1, type: newType }); } catch (_) {} return [...prev, a]; });
    setActivityId(a.id); setCreating(false); setNewName('');
  };
  const sMin = inputToMin(start), eMin = inputToMin(end);
  const timeOk = eMin > sMin;
  const dur = eMin - sMin;
  // 12-hour clock label, e.g. 390 -> "6:30 AM" (1440 wraps to 12:00 AM = midnight).
  const fmt12 = (min) => { const m = ((Math.round(min) % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; if (getLang() === 'th' || clock24()) return h + ':' + String(mm).padStart(2, '0'); const ap = h < 12 ? 'AM' : 'PM'; let hr = h % 12; if (hr === 0) hr = 12; return hr + ':' + String(mm).padStart(2, '0') + ' ' + ap; };
  const DURATIONS = [{ m: 30, l: '30m' }, { m: 45, l: '45m' }, { m: 60, l: '1h' }, { m: 90, l: '1.5h' }, { m: 120, l: '2h' }, { m: 180, l: '3h' }];
  // Times snap to 5-minute increments (no fiddly 7:23 ends).
  const snap5 = (m) => Math.round(m / 5) * 5;
  // Move the whole block, preserving its length (used by the start steppers and by
  // typing in the start field), clamped to stay within the day.
  const moveStartTo = (ns) => {
    ns = Math.max(0, Math.min(1425, snap5(ns)));
    let ne = snap5(ns + (dur > 0 ? dur : 60));
    if (ne > 1440) ne = 1440;
    if (ne <= ns) ne = Math.min(1440, ns + 15);
    setStart(minToInput(ns)); setEnd(minToInput(ne));
  };
  const onStartInput = (v) => { if (!v) { setStart(v); return; } moveStartTo(inputToMin(v)); };
  const setDuration = (d) => setEnd(minToInput(Math.min(1440, snap5(sMin) + d)));
  const extendEnd = (delta) => setEnd(minToInput(Math.max(snap5(sMin) + 5, Math.min(1440, snap5(eMin + delta)))));
  // Typing/picking an end time directly — snap to 5 min, clamp to stay after start.
  const onEndInput = (v) => { if (!v) { setEnd(v); return; } setEnd(minToInput(Math.max(snap5(sMin) + 5, Math.min(1440, snap5(inputToMin(v)))))); };
  const selAct = activities.find(a => a.id === activityId) || null;
  const unit = selAct && selAct.unit ? selAct.unit : '';
  // Recurring blocks may not overlap another block on a shared day (sessions are
  // your own real tracking, so they're allowed to overlap and skip this check).
  const conflict = (!session && timeOk && days.length > 0)
    ? findScheduleConflict(schedule || [], days, sMin, eMin, initial ? initial.id : null)
    : null;
  const conflictAct = conflict ? findActivity(activities, conflict.activityId) : null;
  // A name typed in "+ New" but not yet added — Save will create it (and it shows on Main).
  const pendingNew = creating && newName.trim().length > 0;
  const valid = (!!activityId || pendingNew) && (session || days.length > 0) && timeOk;  // overlaps allowed — warn only
  // Build the block from the form and hand it to `handler` (the normal save, or "apply to all days").
  const commitBlock = (handler) => {
    if (!valid) return;
    let useId = activityId;
    if (pendingNew) {
      const a = { id: uid(), name: newName.trim(), color: newColor, emoji: newEmoji, createdAt: Date.now(), ...(newType === 'hobby' ? { type: 'hobby' } : {}) };
      setActivities(prev => [...prev, a]); // adds to the shared list → appears on the Main page
      useId = a.id;
    }
    if (onSetDaySubName) onSetDaySubName(subName); // per-day sub-label (edit-on-day only)
    const s = snap5(sMin), e = Math.max(s + 5, snap5(eMin)); // persist on the 5-minute grid
    if (session) handler({ id: initial ? initial.id : uid(), activityId: useId, start: s, end: e });
    else handler({ id: initial ? initial.id : uid(), activityId: useId, days: days.slice().sort((a, b) => a - b), start: s, end: e, labels: (initial && initial.labels) ? initial.labels : {} });
  };
  const save = () => commitBlock(onSave);
  const applyAll = () => { if (editing && !session && onApplyAllDays) commitBlock(onApplyAllDays); };

  return (
    <React.Fragment>
      <div className={'sheet-backdrop' + (backMode ? ' l2' : '')} onClick={onCancel} />
      <div className={'sheet' + (backMode ? ' l2' : '')} role="dialog" aria-modal="true" ref={trapRef}>
        <div className="sheet-grabber" />
        <div className="sheet-header">
          <button className="btn-ghost" onClick={onCancel}>{backMode ? tr('common.back') : tr('common.cancel')}</button>
          <div className="sheet-title">{session ? (editing ? tr('bs.editSession') : tr('bs.logSession')) : (editing ? tr('bs.editBlock') : tr('bs.newBlock'))}</div>
          <button className="btn-primary" onClick={save} disabled={!valid} style={{ opacity: valid ? 1 : 0.4 }}>{editing ? tr('common.save') : tr('common.add')}</button>
        </div>
        <div className="sheet-body act-form blk-form">
          {/* Group dividers + cards mirror the Edit-activity sheet so the two read the same. */}
          <div className="act-group-label">{tr('bs.whatGroup')}</div>
          <div className="act-section">
            <div className="bs-pick-sub">{tr('bs.activity')}</div>
            <div className="act-chip-row">
              {activities.filter(a => a.type !== 'hobby').map(a => (
                <button key={a.id} className={'act-chip' + (activityId === a.id ? ' on' : '')} onClick={() => { setActivityId(a.id); setCreating(false); }}>
                  <span className="act-chip-dot" style={{ background: a.color }} />{a.name}
                </button>
              ))}
              <button className={'act-chip add' + (creating && newType === 'task' ? ' on' : '')} onClick={() => { if (creating && newType === 'task') { setCreating(false); } else { setNewType('task'); setNewColor(pickFreeColor(usedColors)); setCreating(true); } }}>{tr('common.new')}</button>
            </div>
            <div className="bs-pick-sub">{tr('bs.forMe')}</div>
            <div className="act-chip-row">
              {activities.filter(a => a.type === 'hobby').map(a => (
                <button key={a.id} className={'act-chip' + (activityId === a.id ? ' on' : '')} onClick={() => { setActivityId(a.id); setCreating(false); }}>
                  <span className="act-chip-dot" style={{ background: a.color }} />{a.name}
                </button>
              ))}
              <button className={'act-chip add' + (creating && newType === 'hobby' ? ' on' : '')} onClick={() => { if (creating && newType === 'hobby') { setCreating(false); } else { setNewType('hobby'); setNewColor(pickFreeColor(usedColors)); setCreating(true); } }}>{tr('common.new')}</button>
            </div>
            {/* Jump to the full activity editor (scoring, goal, emoji, multi-slot). For a NEW block we
                hand over the in-progress draft so it's restored (not lost) when you come back. */}
            {!session && activityId && onOpenActivity && (
              <button type="button" className="bs-details-link" onClick={() => onOpenActivity(activityId, editing ? null : { activityId, days: days.slice(), start: inputToMin(start), end: inputToMin(end) })}>{tr('bs.moreDetails')}</button>
            )}
          </div>
          {creating && (
            <div className="act-create act-section">
              <input className="input-underline" placeholder={newType === 'hobby' ? tr('bs.phReading') : tr('bs.phDeepWork')} value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') createActivity(); }} autoFocus />
              {/* Same inline emoji grid + label as the full activity form (consistent look): tap an
                  example to pick it, or ＋ to open the full picker. */}
              <div className="race-setup-label" style={{ marginTop: 12 }}>{tr('as.workingEmoji')}</div>
              <div className="emoji-pick-row" style={{ marginTop: 4 }}>
                {TASK_EMOJIS.map(e => (
                  <button key={e.code} type="button" className={'emoji-opt' + (newEmoji === e.code ? ' on' : '')}
                    onClick={() => setNewEmoji(e.code)} aria-label={tr('as.emojiAria', { char: e.char })}>
                    <ActionEmoji code={e.code} size={26} fallback={e.char} label={e.char} />
                  </button>
                ))}
                {newEmoji && !TASK_EMOJIS.some(e => e.code === newEmoji) && (
                  <button type="button" className="emoji-opt on" aria-label={tr('as.yourEmoji')}>{renderTaskFace(newEmoji, 26, { label: 'new' })}</button>
                )}
                <button type="button" className="emoji-opt emoji-more" onClick={() => setNewGifOpen(true)} aria-label={tr('as.browseEmojis')}>＋</button>
              </div>
              <div className="act-color-row">
                {ACTIVITY_COLORS.map(c => (
                  <button key={c} className={'act-color-swatch' + (newColor === c ? ' on' : '')} style={{ background: c }} onClick={() => setNewColor(c)} aria-label={tr('as.colorSwatch', { c })} />
                ))}
              </div>
              <button className="btn-ghost btn-block" onClick={createActivity}>{newType === 'hobby' ? tr('bs.addForMe') : tr('bs.addActivity')}</button>
            </div>
          )}
          {newGifOpen && (
            <EmojiGifPicker value={newEmoji} canPhoto={false}
              onPick={(code) => { setNewEmoji(code); pushRecentEmoji(code); setNewGifOpen(false); }}
              onClose={() => setNewGifOpen(false)} />
          )}

          {onSetDaySubName && (
            <React.Fragment>
              <div className="act-group-label">{tr('bs.labelFor', { day: dayLabel || tr('common.thisDay') })}</div>
              <div className="act-section">
                <input className="input-underline" maxLength={40} value={subName}
                  placeholder={defaultSubName || tr('bs.subPh')}
                  onChange={e => setSubName(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') save(); }} />
                <div className="race-setup-explain" style={{ marginTop: 4 }}>
                  {defaultSubName
                    ? tr('bs.overrides', { def: defaultSubName, day: dayLabel || tr('common.thisDay') })
                    : tr('bs.optional', { day: dayLabel || tr('common.thisDay') })}
                </div>
              </div>
            </React.Fragment>
          )}

          {/* ── WHEN ── days + start/end/length in one card (mirrors the activity TIMES card). */}
          <div className="act-group-label">{tr('bs.whenGroup')}</div>
          <div className="act-section">
            <div className="act-slot">
            {!session && (
              <React.Fragment>
                <div className="weekday-row">
                  {wdArr().map((lbl, i) => (
                    <button key={i} className={'weekday-chip' + (days.indexOf(i) !== -1 ? ' on' : '')} onClick={() => toggleDay(i)} aria-label={tr('as.dayAria', { i })}>{lbl}</button>
                  ))}
                </div>
                <button type="button" className={'qa-everyday' + (days.length >= ALL_DAYS.length ? ' on' : '')} onClick={() => setDays(days.length >= ALL_DAYS.length ? [] : ALL_DAYS.slice())}>{tr('qa.everyday')}</button>
              </React.Fragment>
            )}
            <div className="act-time-field blk-trow">
              <span className="act-time-lbl">{tr('bs.starts')}</span>
              <div className="time-row">
                <button type="button" className="cal-nav" onClick={() => moveStartTo(sMin - 15)} aria-label={tr('bs.15earlier')}>−</button>
                <TimePicker value={start} onChange={onStartInput} ariaLabel={tr('bs.starts')} />
                <button type="button" className="cal-nav" onClick={() => moveStartTo(sMin + 15)} aria-label={tr('bs.15later')}>＋</button>
              </div>
            </div>
            <div className="act-time-field blk-trow">
              <span className="act-time-lbl">{tr('bs.ends')}</span>
              <div className="time-row">
                <button type="button" className="cal-nav" onClick={() => extendEnd(-15)} aria-label={tr('bs.15earlier')}>−</button>
                <TimePicker value={end} onChange={onEndInput} ariaLabel={tr('bs.ends')} />
                <button type="button" className="cal-nav" onClick={() => extendEnd(15)} aria-label={tr('bs.15later')}>＋</button>
              </div>
            </div>
            <div className="act-dur-quick">
              <span className="act-dur-lbl">{tr('bs.howLong')}</span>
              {DURATIONS.map(d => (
                <button key={d.m} type="button" className={'act-chip' + (dur === d.m ? ' on' : '')} onClick={() => setDuration(d.m)}>{d.l}</button>
              ))}
              <button type="button" className="act-chip add" onClick={() => extendEnd(15)} aria-label={tr('bs.add15')}>+15m</button>
            </div>
            <div className="race-setup-explain" style={{ marginTop: 7, color: timeOk ? 'var(--accent)' : 'var(--you)' }}>
              {timeOk ? tr('bs.endsSummary', { to: fmt12(eMin), dur: fmtDur(dur) }) : tr('bs.endBad')}
            </div>
            {session ? (
              <div className="race-setup-explain">{tr('bs.sessionExplain')}</div>
            ) : (
              <React.Fragment>
                <div className="race-setup-explain">
                  {days.length === 0 ? tr('bs.pickDay') : tr('bs.repeatsOn', { n: days.length })}
                </div>
                {editing && onApplyAllDays && (
                  <button type="button" className="btn-ghost btn-block" style={{ marginTop: 10 }} onClick={applyAll} disabled={!valid}>{tr('bs.applyAll')}</button>
                )}
                {conflict && (
                  <div className="race-setup-explain" style={{ color: 'var(--you)' }}>
                    {tr('bs.overlaps', { name: conflictAct ? conflictAct.name : tr('bs.anotherBlock'), start: fmtClock(conflict.start), end: fmtClock(conflict.end) })}
                  </div>
                )}
              </React.Fragment>
            )}
            </div>
          </div>

          {editing && onDelete && (
            <button className="btn-ghost btn-block" style={{ color: 'var(--danger)', marginTop: 18 }} onClick={onDelete}>{tr('common.delete')}</button>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

// Week rollup at the top of History: how many planned days you kept up with your
// committed self this week, the time lost to skips, and a Mon-Sun status strip.
const WEEK_GLYPH = { kept: '⭐', almost: '◕', half: '◑', start: '◔', miss: '○', behind: '○', today: '•', future: '·', none: '–', rest: '💤' };
function WeekCard({ week, streak, label, avatar, noRace }) {
  const { days, keptCount, finishedPlanned, totalGap, overallPct, goalsHit, goalsTotal, gradeDone, gradePlan, weekPlanFull } = week;
  const barCls = overallPct == null ? '' : overallPct >= 100 ? ' good' : overallPct >= 60 ? ' mid' : ' bad';
  // Same IDEA as the day race (RaceHeader), but YOU can never draw PAST the avatar's bar — the
  // surplus eats inward instead of sticking out. Track = the whole WEEK plan (weekPlan); JEK fills
  // only its WEEK progress so far (partial mid-week; the empty tail = days still to come). When
  // you pull ahead, your bar CAPS at JEK's length and a purple "overcharge" eats the amber from
  // the right, sized to how much of your effort is beyond the avatar (aheadMin / youMin). Behind →
  // your bar is naturally shorter than JEK. (When the week is fully banked, JEK = 100% and this
  // reduces to the day race's both-bars-full look.)
  const jekName = (avatar && avatar.name) || 'JEK';
  const avatarMin = gradePlan, youMin = gradeDone;
  const weekPlan = weekPlanFull > 0 ? weekPlanFull : (gradePlan || 1); // avatar's whole WEEK plan = the track
  const raceDenom = weekPlan;                                          // shown as the caption target
  const aheadMin = Math.max(0, youMin - avatarMin);
  const ahead = aheadMin >= 1;
  const jekPct = Math.min(100, (avatarMin / weekPlan) * 100);         // JEK's WEEK progress so far (partial mid-week)
  const mePct = ahead ? jekPct : Math.min(100, (youMin / weekPlan) * 100); // capped at JEK once you've matched it
  const overPct = (ahead && youMin > 0) ? jekPct * (aheadMin / youMin) : 0; // purple eats the amber from the right
  const headline = finishedPlanned === 0
    ? tr('week.startsHere')
    : tr('week.daysKept', { k: keptCount, n: finishedPlanned });
  const sub = week.totalPlan <= 0
    ? tr('week.checkOff')
    : totalGap >= 1
      ? tr('week.lostToSkips', { t: formatHM(Math.round(totalGap) * 60) })
      : tr('week.inStepNothing');
  return (
    <div className="week-card">
      <div className="week-card-top">
        <span className="week-card-label">{label || tr('wk.thisWeek')}</span>
        {streak > 0 && <span className="week-streak">{tr('week.streak', { n: streak })}</span>}
      </div>
      <div>
        <div className="week-headline">{headline}</div>
        <div className="week-sub">{sub}</div>
      </div>
      {/* noRace (dashboard hero): hide the weekly pace bars — they pressure the user about
          falling behind for the WHOLE week; the hero should focus on today only. The day strip,
          streak and goals below stay as a gentle weekly summary. */}
      {noRace ? null : gradePlan > 0 ? (
        /* Two-bar WEEK race: track = whole-week plan; JEK fills its progress so far (partial
           mid-week). YOU never draw past JEK — once matched, your bar caps at JEK's length and
           the lead shows as a purple overcharge eating the amber from the right. */
        <div className="dayp-race">
          <div className="dayp-race-row">
            <span className="dayp-race-face">{renderFace(avatar && avatar.emoji, 16)}</span>
            <div className="dayp-race-track"><div className="dayp-race-fill av" style={{ width: jekPct + '%' }} /></div>
            <span className="dayp-race-val">{gradePlan > 0 ? formatHM(Math.round(gradePlan) * 60) : '0m'}</span>
          </div>
          <div className="dayp-race-row">
            <span className="dayp-race-tag">{tr('race.you')}</span>
            <div className="dayp-race-track">
              <div className="dayp-race-fill me" style={{ width: mePct + '%' }} />
              {overPct > 0.5 && <div className="dayp-race-over" style={{ right: (100 - mePct) + '%', width: overPct + '%' }} />}
            </div>
            <span className="dayp-race-val">{gradeDone > 0 ? formatHM(Math.round(gradeDone) * 60) : '0m'}</span>
          </div>
          {ahead && (
            <div className="dayp-race-note" style={{ color: '#a855f7', fontWeight: 800 }}>
              {'⚡ ' + (getLang() === 'th' ? 'นำ ' + jekName + ' อยู่ ' + formatHM(Math.round(aheadMin) * 60) : formatHM(Math.round(aheadMin) * 60) + ' ahead of ' + jekName)}
            </div>
          )}
          <div className="dayp-race-note">{(getLang() === 'th' ? 'แผนทั้งสัปดาห์ ' : 'Full week plan ') + formatHM(Math.round(raceDenom) * 60)}</div>
        </div>
      ) : overallPct != null && (
        <div className={'week-bar' + barCls}><div className="week-fill" style={{ width: Math.min(100, overallPct) + '%' }} /></div>
      )}
      {goalsTotal > 0 && (
        <div className="week-goals" title={tr('week.goalsTip')}>
          {tr('week.goalsHit', { h: goalsHit, t: goalsTotal })}
        </div>
      )}
      <div className="week-strip">
        {days.map(d => {
          const am = d.away ? awayReasonMeta(d.away) : null;
          return (
            <div key={d.dow} className={'week-day ' + d.status + (d.isToday ? ' today' : '')}>
              <span className="week-day-lbl">{wd(d.dow)}</span>
              <span className="week-day-glyph">{am ? <ActionEmoji code={am.code} size={15} fallback={am.glyph} label="" /> : WEEK_GLYPH[d.status]}</span>
            </div>
          );
        })}
      </div>
      {week.awayCounts && Object.keys(week.awayCounts).length > 0 && (
        <div className="wrec-away">
          {AWAY_REASONS.filter(r => week.awayCounts[r.id]).map(r => (
            <span key={r.id} className="wrec-away-item"><ActionEmoji code={r.code} size={14} fallback={r.glyph} label="" /> {week.awayCounts[r.id]}</span>
          ))}
          <span className="wrec-away-lbl">{getLang() === 'th' ? 'ลาสัปดาห์นี้' : 'off this week'}</span>
        </div>
      )}
    </div>
  );
}

// Achievements card (FREE): current / best / lifetime-kept streak stats + a milestone
// badge ladder. Badges light up once your TOTAL kept days reach their threshold — cumulative
// & forgiving (a missed day never un-earns one), and these SAME badges are wearable accessories
// on your avatar (one unified reward system). A gentle retention ladder, never a paywall.
function AchievementsCard({ stats }) {
  const { current, best, totalKept } = stats;
  const next = STREAK_MILESTONES.find(m => totalKept < m.days) || null; // first not-yet-earned
  // The highest earned badge is your RANK — shown automatically on your avatar. This card is the
  // progress ladder for it (display-only); stickers (the free wearables) live on the Avatar tab.
  return (
    <div className="ach-card">
      <div className="week-card-top"><span className="week-card-label">{tr('ach.title')}</span></div>
      <div className="ach-stats">
        <div className="ach-stat cur"><div className="ach-stat-num">{current}</div><div className="ach-stat-lbl">{tr('ach.current')}</div></div>
        <div className="ach-stat"><div className="ach-stat-num">{best}</div><div className="ach-stat-lbl">{tr('ach.best')}</div></div>
        <div className="ach-stat"><div className="ach-stat-num">{totalKept}</div><div className="ach-stat-lbl">{tr('ach.total')}</div></div>
      </div>
      <div className="ach-badges">
        {STREAK_MILESTONES.map(m => {
          const earned = totalKept >= m.days;
          const isNext = next && m.days === next.days;
          return (
            <div key={m.days} className={'ach-badge' + (earned ? ' on' : '') + (isNext ? ' next' : '')}
              title={earned ? tr('ach.badgeTip', { n: m.days }) : tr('ach.badgeLocked', { n: m.days })}>
              <span className="ach-badge-emoji">{m.emoji}</span>
              <span className="ach-badge-days">{m.days}{tr('ach.dayUnit')}</span>
            </div>
          );
        })}
      </div>
      {next && (
        <div className="week-sub" style={{ marginTop: -2 }}>
          {tr('ach.nextHint', { n: next.days - totalKept, d: tr('ach.dayUnit'), emoji: next.emoji })}
        </div>
      )}
    </div>
  );
}

// Compact dashboard strip: your highest-earned badge + a progress bar toward the next
// milestone (totalKept/next, matching the unlock semantics). Taps through to Progress.
function DashBadgeStrip({ stats, onOpen }) {
  const kept = stats.totalKept;
  let earnedM = null;
  for (const m of STREAK_MILESTONES) { if (kept >= m.days) earnedM = m; }
  const next = STREAK_MILESTONES.find(m => kept < m.days) || null;
  const pct = next ? Math.min(100, Math.round((kept / next.days) * 100)) : 100;
  return (
    <button className="dash-badge" onClick={onOpen}>
      <span className="dash-badge-fill" style={{ width: pct + '%' }} />
      <span className="dash-badge-face">{earnedM ? earnedM.emoji : '🌱'}</span>
      <span className="dash-badge-name">{tr('recap.streakStat')}</span>
      <span className="dash-badge-text">
        <span className="dash-badge-lbl">{tr('ach.dashNext')}</span>
        {next
          ? <span className="dash-badge-goal">{next.emoji} {tr('ach.badgeTip', { n: next.days })}</span>
          : <span className="dash-badge-goal">{tr('ach.dashMaxed')}</span>}
      </span>
      <span className="dash-badge-count">{next ? kept + '/' + next.days : '🏆'}</span>
    </button>
  );
}

// One-time party when the streak crosses a milestone (fired from Root). Deterministic
// confetti — variety comes from the piece index, so no Math.random needed.
function MilestoneCelebration({ milestone, name, onClose }) {
  useEscClose(onClose);
  const trapRef = React.useRef(null);
  useFocusTrap(trapRef);
  const COLORS = ['#a3e635', '#fbbf24', '#38bdf8', '#f472b6', '#c084fc', '#34d399'];
  const pieces = Array.from({ length: 24 }, (_, i) => ({
    left: ((i * 4.17) % 100).toFixed(1),
    delay: ((i % 8) * 0.12).toFixed(2),
    dur: (1.6 + (i % 5) * 0.25).toFixed(2),
    color: COLORS[i % COLORS.length],
  }));
  return (
    <div className="cele-backdrop" onClick={onClose}>
      <div className="cele-card" onClick={e => e.stopPropagation()} ref={trapRef}>
        <div className="cele-confetti" aria-hidden="true">
          {pieces.map((p, i) => (
            <span key={i} className="cele-piece" style={{ left: p.left + '%', background: p.color, animationDuration: p.dur + 's', animationDelay: p.delay + 's' }} />
          ))}
        </div>
        <div className="cele-emoji">{milestone.emoji}</div>
        <div className="cele-title">{tr('cele.title', { n: milestone.days })}</div>
        <div className="cele-sub">{tr('cele.sub', { n: milestone.days, name })}</div>
        <div className="cele-wear">{tr('cele.wearable', { emoji: milestone.emoji })}</div>
        <button className="btn-primary cele-btn" onClick={onClose}>{tr('cele.cta')}</button>
      </div>
    </div>
  );
}

// Monday recap: a once-a-week moment that closes the loop on the weekly contract. Pops on
// the first open of a new week, summarising LAST week (reuses WeekCard + coachInsights so
// the numbers match the Progress tab). The recap itself is FREE (retention); the one shown
// insight is a TASTE — Free can read it, but acting on it / the full review is Pro.
function WeeklyRecapModal({ recap, avatar, plan, onPlan, onUpgrade, onClose }) {
  useEscClose(onClose);
  const trapRef = React.useRef(null);
  useFocusTrap(trapRef);
  const { week, streak, review } = recap;
  const canCoach = planAllows(plan, 'coach');
  const top = review && review.ok && review.insights[0];
  // Spoken in JEK's persona voice (same fusion as the dashboard hero) so the recap reads
  // like a note FROM JEK, not a neutral stat line.
  const quote = top ? coachVoiceQuote(avatar, top.key, top.params) : null;
  // Richer recap: a week with graded days shows a stat strip (kept% / days / streak) + a
  // meta line (time invested · lost · goals). A brand-new week (nothing tracked) instead gets
  // an encouraging note + a quick legend of how each day is scored, so it never looks empty.
  const { overallPct, keptCount, finishedPlanned, totalGap, gradeDone, goalsHit, goalsTotal } = week;
  // Slice 6 (weekly): if Pro, fetch an AI-written letter body in the background and swap it
  // into the .recap-letter-body when it arrives. The deterministic weeklyLetter() body renders
  // first; this only ever REPLACES it, never blocks. No-ops for Free.
  const [aiBody, setAiBody] = React.useState(null);
  React.useEffect(() => {
    let alive = true;
    if (!planAllows(plan, 'checkin')) return;
    const persona = resolveBehavior(avatar, 'letter');
    const star = review && review.ok && review.insights && review.insights.find(i => (i.key === 'consistent' || i.key === 'earlyStar') && i.params && i.params.name);
    aiWeeklyLetter(plan, getLang() === 'th' ? 'th' : 'en', persona, {
      week: String(startOfWeek(Date.now())), name: avatar.name,
      kept: keptCount, total: finishedPlanned, pct: overallPct, streak,
      highlight: star ? star.params.name : '',
    }).then((t) => { if (alive && t) setAiBody(t); });
    return () => { alive = false; };
  }, []);
  const hasData = finishedPlanned > 0;
  return (
    <div className="modal-backdrop recap-backdrop" onClick={onClose}>
      <div className="recap-card" onClick={e => e.stopPropagation()} ref={trapRef}>
        <button className="recap-close" onClick={onClose} aria-label={tr('common.close')}>✕</button>
        <div className="recap-glyph">{renderFace(avatar.emoji, 50)}</div>
        <div className="recap-title">{tr('recap.title')}</div>
        <div className="recap-sub">{tr('recap.sub', { name: avatar.name })}</div>
        {/* Slice 4 — a note FROM JEK in the chosen persona's voice: greeting → a data-aware
            recap line → one warm highlight (kept-every-time activity or live streak) → a
            forward nudge → sign-off. Composed by weeklyLetter() from the same week/streak/
            review the recap already loaded; FREE (relationship, not analysis). */}
        {(() => {
          const letter = weeklyLetter(avatar, week, streak, review);
          return (
            <div className="recap-letter">
              <p className="recap-letter-greet">{letter.greet}</p>
              <p className="recap-letter-body">{aiBody || (letter.recap + (letter.highlight ? ' ' + letter.highlight : '') + ' ' + letter.nudge)}</p>
              <p className="recap-letter-sign">{letter.sign}</p>
            </div>
          );
        })()}
        {hasData && (
          <div className="recap-stats">
            <div className="recap-stat"><span className="recap-stat-num">{overallPct != null ? overallPct + '%' : '—'}</span><span className="recap-stat-lbl">{tr('recap.kept')}</span></div>
            <div className="recap-stat"><span className="recap-stat-num">{keptCount}/{finishedPlanned}</span><span className="recap-stat-lbl">{tr('recap.daysKept')}</span></div>
            <div className="recap-stat cur"><span className="recap-stat-num">🔥 {streak}</span><span className="recap-stat-lbl">{tr('recap.streakStat')}</span></div>
          </div>
        )}
        <WeekCard week={week} streak={streak} label={tr('recap.lastWeek')} avatar={avatar} />
        {hasData ? (
          <div className="recap-meta">
            <span>⏱ {tr('recap.invested', { t: formatHM(Math.round(gradeDone) * 60) })}</span>
            {totalGap >= 1 && <span>{tr('recap.lost', { t: formatHM(Math.round(totalGap) * 60) })}</span>}
            {goalsTotal > 0 && <span>🎯 {tr('recap.goalsStat', { h: goalsHit, t: goalsTotal })}</span>}
          </div>
        ) : (
          <div className="recap-legend">
            <div className="recap-legend-note">{tr('recap.firstWeek')}</div>
            <div className="recap-legend-row">
              <span className="recap-legend-item"><b>⭐</b> {tr('recap.legDone')}</span>
              <span className="recap-legend-item"><b>◑</b> {tr('recap.legPartial')}</span>
              <span className="recap-legend-item"><b>○</b> {tr('recap.legMiss')}</span>
              <span className="recap-legend-item"><b>💤</b> {tr('recap.legRest')}</span>
            </div>
          </div>
        )}
        {quote && (
          <div className="recap-insight">
            <span className="recap-insight-ico">🧐</span>
            <div className="recap-insight-body">
              <div className="recap-insight-quote">{'“' + quote.replace(/[.,]+$/, '') + '”'}</div>
              {canCoach
                ? <button className="recap-insight-cta" onClick={() => onPlan('history')}>{tr('recap.seeReview')}</button>
                : <button className="recap-insight-cta lock" onClick={onUpgrade}>🔒 {tr('recap.unlock')}</button>}
            </div>
          </div>
        )}
        {/* CTA closes the recap and drops you on the dashboard. Wording reacts to last week:
            a behind week → "I'll try harder"; a solid week / first week → "OK, let's go!". */}
        <button className="btn-primary recap-plan" onClick={() => onPlan('main')}>
          {tr(hasData && overallPct != null && overallPct < 60 ? 'recap.ctaTry' : 'recap.ctaGo')}
        </button>
      </div>
    </div>
  );
}

// Multi-week trend below the week card: a kept% bar per week (oldest → newest, the
// current week last) plus a Mon-Sun heatmap so a slip shows up as a pattern, not a
// one-off. Both read straight off weeklyTrend → same scoring as "This week".
function mdLabel(ts) { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate(); }
function TrendCard({ trend }) {
  return (
    <div className="trend-card">
      <div className="trend-card-top">
        <span className="week-card-label">{tr('trend.lastWeeks', { n: trend.length })}</span>
      </div>
      <div className="trend-bars">
        {trend.map((wk, i) => {
          const pct = wk.overallPct;
          const cls = pct == null ? 'empty' : pct >= 100 ? 'good' : pct >= 60 ? 'mid' : 'bad';
          const isCur = i === trend.length - 1;
          return (
            <div key={wk.weekStart} className={'trend-col' + (isCur ? ' cur' : '')}>
              <span className="trend-col-pct">{pct == null ? '–' : pct + '%'}</span>
              <div className="trend-track">
                <div className={'trend-fill ' + cls} style={{ height: (pct == null ? 0 : Math.max(4, Math.min(100, pct))) + '%' }} />
              </div>
              <span className="trend-col-lbl">{isCur ? tr('trend.now') : mdLabel(wk.weekStart)}</span>
            </div>
          );
        })}
      </div>
      <div className="trend-heat">
        <div className="trend-heat-row trend-heat-head">
          <span className="trend-heat-wk" />
          {wdArr().map((w, i) => <span key={i} className="trend-heat-dow">{w}</span>)}
        </div>
        {trend.map(wk => (
          <div key={wk.weekStart} className="trend-heat-row">
            <span className="trend-heat-wk">{mdLabel(wk.weekStart)}</span>
            {wk.days.map(d => (
              <span key={d.dow}
                className={'trend-cell ' + d.status + (d.isToday ? ' today' : '')}
                title={d.pct != null ? tr('trend.cellTip', { day: wd(d.dow), pct: d.pct }) : wd(d.dow)} />
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// The Coach card (Pro) — your committed self reviews the week from real data and
// names one thing to fix. `bucket` keys resolve to localized time-of-day words.
//  • `embed` (dashboard hero) = no header, just the action buttons under JEK's quote.
//  • default (Progress tab) = header + all insights, static card.
function CoachCard({ review, avatar, embed, onApply, onDrop, tease, onOpenBilling }) {
  // `applied`/`dropped` show a one-shot confirmation after a move/drop, so the card
  // gives feedback even though the schedule change lands on the Schedule tab. `dropArm`
  // is the first tap of the two-tap drop confirm (auto-disarms after 3s).
  const [applied, setApplied] = React.useState(false);
  const [dropArm, setDropArm] = React.useState(false);
  const [dropped, setDropped] = React.useState(false);
  const [undoFn, setUndoFn] = React.useState(null); // one-tap revert for the last move/drop
  const armRef = React.useRef(null);
  React.useEffect(() => () => clearTimeout(armRef.current), []);
  const revert = () => { if (undoFn) undoFn(); setUndoFn(null); setApplied(false); setDropped(false); };
  const name = (avatar && avatar.name) || 'JEK';
  // The review card's face is a fixed "insight" emoji (🧐 face-with-monocle), not the
  // avatar — it reads as JEK analyzing your weeks. Animated Noto, static-glyph fallback.
  const face = <span className="coach-face"><ActionEmoji code="1f9d0" size={30} fallback="🧐" label="" eager /></span>;
  const param = (p) => {
    const o = { ...p };
    for (const k of ['best', 'worst', 'bucket']) if (o[k]) o[k] = tr('coach.' + o[k]); // localize bucket words
    return o;
  };
  // Free "taste": when teasing, show ONLY the first insight (same as the hero embed) and
  // wall the rest + the actionable fix behind a Pro CTA — let them FEEL the locked value.
  const items = (embed || tease) ? review.insights.slice(0, 1) : review.insights;
  const sug = review.suggestion;
  const lockedCount = Math.max(0, review.insights.length - 1) + (review.suggestion ? 1 : 0);
  // Second tap of the drop confirm carries it out (capturing its undo); first tap arms.
  const armDrop = () => {
    if (dropArm) { const u = onDrop(sug.params.actId); setUndoFn(() => u); setDropped(true); setDropArm(false); clearTimeout(armRef.current); }
    else { setDropArm(true); armRef.current = setTimeout(() => setDropArm(false), 3000); }
  };
  // The action(s) for the current suggestion: a move button, a reschedule+drop pair, or
  // the post-action confirmation WITH a one-tap Undo. Null when nothing to do (keepGoing).
  const actionsNode = !sug ? null
    : (applied || dropped) ? (
        <span className="coach-applied">
          {tr(dropped ? 'coach.dropped' : 'coach.applied')}
          {undoFn && <button className="coach-undo" onClick={revert}>{tr('coach.undo')}</button>}
        </span>
      )
    : (sug.key === 'moveToBest' && onApply) ? (
        <button className="coach-act" onClick={() => { const u = onApply(sug); if (u) { setUndoFn(() => u); setApplied(true); } }}>
          {tr('coach.moveBtn', { bucket: tr('coach.' + sug.params.bucket) })}
        </button>
      )
    : (sug.key === 'dropOrMove' && (onApply || onDrop)) ? (
        <div className="coach-acts">
          {onApply && <button className="coach-act-ghost" onClick={() => onApply(sug)}>{tr('coach.openSchedule')}</button>}
          {onDrop && <button className={'coach-drop' + (dropArm ? ' arm' : '')} onClick={armDrop}>{tr(dropArm ? 'coach.dropArm' : 'coach.dropBtn')}</button>}
        </div>
      )
    : null;
  // Full-card suggestion block (label + text + actions).
  const suggestionNode = sug && (
    <div className="coach-sugg">
      <span className="coach-sugg-lbl">{tr('coach.tryThis')}</span>
      {tr('coach.' + sug.key, param(sug.params))}
      {actionsNode}
    </div>
  );
  // Free taste: under the single shown insight, a locked row that opens billing. Counts the
  // hidden insights + the fix so the CTA carries real FOMO ("+2 more") when there's more.
  const teaseNode = tease && (
    <button type="button" className="coach-tease" onClick={onOpenBilling}>
      <span className="coach-tease-txt">
        <span className="coach-tease-lock">🔒</span>
        {tr('coach.teaseFull')}{lockedCount > 0 ? ' ' + tr('coach.teaseMore', { n: lockedCount }) : ''}
      </span>
      <span className="coach-tease-btn">{tr('coach.teaseCta')}</span>
    </button>
  );
  // Embedded in the hero card: the insight is now JEK's spoken quote (rendered by the
  // hero), so here we show ONLY the action buttons beneath it. Nothing to act on → null.
  if (embed) return actionsNode ? <div className="hero-coach">{actionsNode}</div> : null;
  return (
    <div className="coach-card">
      <div className="coach-head">
        {face}
        <div className="coach-head-txt">
          <div className="coach-title">{tr('coach.title', { name })}</div>
          <div className="coach-sub">{tr('coach.sub')}</div>
        </div>
        {tease && <span className="coach-pro">PRO</span>}
      </div>
      {!review.ok ? (
        <div className="coach-empty">{tr('coach.needData')}</div>
      ) : (
        <React.Fragment>
          <ul className="coach-list">
            {items.map((it, i) => (
              /* Top insight speaks in JEK's persona voice (matches the hero); the rest stay
                 neutral so the card is still scannable. */
              <li key={i} className="coach-item"><span className="coach-dot">›</span>{i === 0 ? coachVoiceQuote(avatar, it.key, it.params) : tr('coach.' + it.key, param(it.params))}</li>
            ))}
          </ul>
          {tease ? teaseNode : suggestionNode}
        </React.Fragment>
      )}
    </div>
  );
}

// History = your accountability record: each planned day, how you did vs the
// committed self. Reconstructed from `done` + the current recurring schedule.
// Per-activity totals for the CURRENT week: full weekly plan vs done-so-far
// minutes (rest days excluded; free sessions credited to their activity). Drives
// the Progress page's "this week by task" bars.
// Total WORK amount you've logged for one activity across the Mon-week containing
// weekStartTs — summed over every block of that activity, every day. The weekly
// goal (Activity.weeklyAmount) is what this counts toward.
function weekAmountLogged(activityId, schedule, done, weekStartTs, activity) {
  let sum = 0;
  for (let i = 0; i < 7; i++) {
    const dmap = done[dayKey(addDays(weekStartTs, i))] || {};
    for (const b of blocksForDate(schedule, done, addDays(weekStartTs, i))) {
      if (b.activityId !== activityId) continue;
      const e = dmap[b.id];
      if (e && typeof e === 'object' && typeof e.amount === 'number') sum += e.amount;
      else if (e === true && activity) sum += actAmtTarget(activity, b.dow); // legacy "done"=true ⇒ goal fully met
    }
  }
  return sum;
}

function weekByActivity(activities, schedule, done, now, restDays, tickets) {
  const rest = restDays || [];
  const ws = startOfWeek(now);
  const todayStart = startOfDay(now);
  const nowMin = nowMinutes(now);
  const acc = {};
  const bump = (id) => (acc[id] || (acc[id] = { planMin: 0, doneMin: 0, amount: 0, avatarMin: 0, sessions: 0, amtGoal: 0 }));
  for (let i = 0; i < 7; i++) {
    if (rest.indexOf(i) !== -1) continue;
    const ts = addDays(ws, i);
    if (isTicketed(tickets, ts)) continue; // whole-day excuse — leave it out of the weekly task totals
    const dStart = startOfDay(ts);
    const doneCap = dStart > todayStart ? 0 : (dStart === todayStart ? nowMin : 1440);
    const dmap = done[dayKey(ts)] || {};
    for (const b of gradedBlocks(blocksForDate(schedule, done, ts), tickets, ts, activities)) { // task-excused + hobby blocks drop out
      const a = bump(b.activityId);
      a.sessions += 1; // each scheduled block = one session (drives the per-session amount goal)
      a.amtGoal += actAmtTarget(findActivity(activities, b.activityId), b.dow); // sum each session's own (maybe per-day) goal
      const fullDur = Math.max(0, b.end - b.start);
      a.planMin += fullDur; // the whole week's plan for this task
      a.avatarMin += Math.max(0, Math.min(doneCap, b.end) - b.start); // committed self banks settled-so-far
      let s = 0;
      for (const g of blockSegs(dmap, b)) s += Math.max(0, Math.min(doneCap, g.end) - g.start);
      a.doneMin += s; // over-block time counts (no cap) — matches the race's "lead" rule
      const e = dmap[b.id]; // logged work amount toward the weekly goal
      if (e && typeof e === 'object' && typeof e.amount === 'number') a.amount += e.amount;
      else if (e === true) a.amount += actAmtTarget(findActivity(activities, b.activityId), b.dow); // legacy "done"=true ⇒ goal fully met (matches blockEarnedMin/daySuccess)
    }
    for (const f of (dmap._free || [])) bump(f.activityId).doneMin += Math.max(0, Math.min(doneCap, f.end) - f.start);
  }
  return activities
    .map(act => {
      const t = acc[act.id] || { planMin: 0, doneMin: 0, amount: 0, avatarMin: 0, sessions: 0, amtGoal: 0 };
      const pct = t.planMin > 0 ? Math.round((t.doneMin / t.planMin) * 100) : (t.doneMin > 0 ? 100 : 0);
      // Per-session goal rolled up: week target = goal-per-session × sessions this week.
      // Percent-mode tasks treat each session as a 100% target, so the weekly roll-up reads
      // as the AVERAGE completion across the week's sessions; amount-mode uses its unit goal.
      const isPct = act.goalMode === 'percent';
      const perSession = isPct ? 100 : actAmtTarget(act);
      // Per-day amounts make sessions differ, so the week target is the SUM of each
      // session's own goal (t.amtGoal); percent still rolls up as 100 × sessions.
      const weeklyAmount = isPct ? (perSession > 0 ? perSession * t.sessions : 0) : (t.amtGoal > 0 ? t.amtGoal : 0);
      const amountPct = weeklyAmount > 0 ? Math.round((t.amount / weeklyAmount) * 100) : null;
      return { activity: act, planMin: t.planMin, doneMin: t.doneMin, avatarMin: t.avatarMin, pct, weeklyAmount, perSession, amountDone: t.amount, amountPct, isPct, sessions: t.sessions };
    })
    .filter(r => r.planMin > 0 || r.doneMin > 0 || r.weeklyAmount > 0 || r.amountDone > 0);
    // Order follows the `activities` array (same as the Main page list) — no re-sort.
}

// Progress page (formerly History): this week's overview + each task's progress.
// Single-day accountability detail for the Progress tab's Day mode: that day's
// % kept + each scheduled block's status (Done / In progress / Upcoming / Missed),
// navigable to any day. Mirrors the Schedule tab's Day/Week split.
function DayProgress({ activities, schedule, done, rest, tickets, now, dayOffset, setDayOffset, avatar }) {
  const todayStart = startOfDay(now);
  const minDayOffset = Math.min(-365, Math.round((earliestTrackedDay(done, now) - todayStart) / 86400000));
  React.useEffect(() => { if (dayOffset < minDayOffset) setDayOffset(minDayOffset); }, [minDayOffset, dayOffset]);
  const ts = addDays(todayStart, dayOffset);
  const idx = dayIndexMon(ts);
  const isToday = dayOffset === 0, isFuture = dayOffset > 0;
  const dmap = done[dayKey(ts)] || {};
  const blocks = blocksForDate(schedule, done, ts);
  // A weekday rest OR a rest-ticket on this date excuses it from grading.
  const isTicketDay = isTicketed(tickets, ts);
  const isRest = rest.indexOf(idx) !== -1 || isTicketDay;
  const nowMin = nowMinutes(now);
  const cap = isFuture ? 0 : (isToday ? nowMin : 1440);
  const gradeB = gradedBlocks(blocks, tickets, ts, activities); // task-excused + hobby blocks don't count toward the day's grade
  const sc = dayScore(gradeB, dmap, cap, activities);
  const cr = dayCredit(gradeB, dmap, cap, activities);
  const dateLabel = new Date(ts).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const pillPct = (!isRest && !isFuture && cr.pct != null) ? cr.pct : null;
  // Day-total race summary (same RaceHeader as the Schedule day view): the committed self's
  // banked plan vs how far YOU've kept up, so the Day view leads with the whole day's progress.
  let dayTotal = 0; for (const b of gradeB) dayTotal += Math.max(0, b.end - b.start);
  const showDayRace = gradeB.length > 0 && dayTotal > 0 && !isFuture && !isRest;

  return (
    <React.Fragment>
      <div className="cal-head">
        <button className="cal-nav" disabled={dayOffset <= minDayOffset} onClick={() => setDayOffset(d => Math.max(minDayOffset, d - 1))} aria-label={tr('wk.prevDay')}>‹</button>
        <div className="cal-date">
          <span className="cal-date-main">{isToday ? 'Today' : dateLabel}</span>
        </div>
        <button className="cal-nav" onClick={() => setDayOffset(d => d + 1)} aria-label={tr('wk.nextDay')}>›</button>
        {pillPct !== null
          ? <span className={'cal-pill' + (pillPct >= 100 ? ' good' : pillPct >= 60 ? ' mid' : ' bad')}>{pillPct}% · {formatHM(Math.round(sc.doneMin) * 60)}</span>
          : <span className="cal-pill plan">{sc.planMin > 0 ? formatHM(Math.round(sc.planMin) * 60) : '—'}</span>}
      </div>

      {showDayRace && (
        <RaceHeader avatar={avatar} youMin={cr.done} avatarMin={cr.plan} dayTotal={dayTotal}
          gapMin={Math.max(0, cr.plan - cr.done)} period={isToday ? tr('common.today') : dateLabel} />
      )}

      <div className="section-label">{isToday ? tr('dayp.todayByTask') : tr('dayp.byTask')}</div>
      {isTicketDay ? (
        <p className="hist-note" style={{ textAlign: 'left' }}>{tr('dayp.restTicketNote')}</p>
      ) : isRest ? (
        <p className="hist-note" style={{ textAlign: 'left' }}>{tr('dayp.restDayNote')}</p>
      ) : blocks.length === 0 ? (
        <p className="hist-note" style={{ textAlign: 'left' }}>{isFuture ? tr('dayp.nothingPlanned') : tr('dayp.noBlocks')}</p>
      ) : (
        <div className="dayp-list">
          {blocks.map(b => {
            const a = findActivity(activities, b.activityId);
            const segs = blockSegs(dmap, b);
            const doneMin = segs.reduce((s, x) => s + Math.max(0, x.end - x.start), 0);
            const planMin = Math.max(0, b.end - b.start);
            const p = planMin > 0 ? Math.min(100, Math.round(doneMin / planMin * 100)) : 0;
            const started = !isFuture && (!isToday || nowMin >= b.start);
            const ended = !isFuture && (!isToday || nowMin >= b.end);
            const excused = blockTicketed(tickets, ts, b.id); // rest-ticket spent on just this task
            let vcls, verdict;
            if (excused) { vcls = 'muted'; verdict = <React.Fragment><span className="tix-tilt">🎟️</span> {tr('verdict.excused')}</React.Fragment>; }
            else if (segs.length) { vcls = 'good'; verdict = tr('verdict.done'); }
            else if (!started) { vcls = 'muted'; verdict = tr('verdict.upcoming'); }
            else if (ended) { vcls = 'bad'; verdict = tr('verdict.missed'); }
            else { vcls = 'mid'; verdict = tr('verdict.inProgress'); }
            const name = a ? a.name : tr('fallback.deleted');
            const col = a ? a.color : '#64748b';
            return (
              <div key={b.id} className={'dayp-row' + (excused ? ' excused' : '')} style={{ borderLeft: '3px solid ' + col }}>
                <span className="dayp-glyph">
                  <TaskEmoji act={a} size={18} label={name} />
                </span>
                <div className="dayp-main">
                  <div className="dayp-top">
                    <span className="dayp-date">{name}</span>
                    <span className={'dayp-verdict ' + vcls}>{verdict}{segs.length ? ' · ' + p + '%' : ''}</span>
                  </div>
                  {started ? (
                    <div className="dayp-race">
                      <div className="dayp-race-row">
                        <span className="dayp-race-face">{renderFace(avatar.emoji, 16)}</span>
                        <div className="dayp-race-track"><div className="dayp-race-fill av" style={{ width: '100%' }} /></div>
                        <span className="dayp-race-val">{formatHM(Math.round(planMin) * 60)}</span>
                      </div>
                      <div className="dayp-race-row">
                        <span className="dayp-race-tag">{tr('race.you')}</span>
                        <div className="dayp-race-track"><div className="dayp-race-fill me" style={{ width: p + '%' }} /></div>
                        <span className="dayp-race-val">{formatHM(Math.round(doneMin) * 60)}</span>
                      </div>
                      <div className="dayp-race-note">{fmtClock(b.start)}–{fmtClock(b.end)} · {planMin - doneMin >= 1 ? tr('race.behindName', { t: formatHM(Math.round(planMin - doneMin) * 60), name: avatar.name }) : tr('race.inStepName', { name: avatar.name })}</div>
                    </div>
                  ) : (
                    <div className="dayp-sub">{tr('dayp.willRunIt', { clock: fmtClock(b.start) + '–' + fmtClock(b.end), dur: fmtDur(planMin), name: avatar.name })}</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
      <p className="hist-note">{tr('dayp.reviewAnyDay')}</p>
    </React.Fragment>
  );
}

// Weekly Recap (PRO) — the recurring "your week in review" payoff in Progress, shown
// directly below JEK's review (CoachCard). Absorbs WeekCard: headline + three stat cells
// (days kept / time invested / best day, with a vs-last-week delta on the kept-of-plan %)
// + the progress bar + the Mon–Sun day strip. All from the same deterministic helpers
// Progress already uses, so it can never disagree with the cards around it. Display only.
// Inline L() bilingual to avoid touching shared STRINGS.
function WeeklyRecapCard({ week, lastWeek, streak, avatar, youMin, planMin }) {
  const L = (en, th) => (getLang() === 'th' ? th : en);
  const graded = (week.days || []).filter(d => d.hasPlan && !d.isFuture && d.pct != null && d.status !== 'rest' && d.status !== 'none');
  let doneMin = 0; for (const d of graded) doneMin += d.doneMin || 0;
  let best = null; for (const d of graded) if (!best || (d.pct || 0) > (best.pct || 0)) best = d;
  const pct = week.overallPct;
  // Week summary race: the avatar (committed self) finishes the WHOLE week's plan, so its
  // bar is the full week target (always 100%). Your bar is how much of that week plan you've
  // actually done so far — you fill up toward the avatar as the week goes on.
  const totalPlan = planMin || 0;
  const youPct = totalPlan > 0 ? Math.min(100, Math.round(((youMin || 0) / totalPlan) * 100)) : 0;
  const lastPct = lastWeek ? lastWeek.overallPct : null;
  const delta = (pct != null && lastPct != null) ? (pct - lastPct) : null;
  const deltaCls = delta == null ? 'flat' : delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
  const deltaTxt = delta == null ? '' : delta > 0 ? '▲' + delta : delta < 0 ? '▼' + (-delta) : '—0';
  const kept = week.keptCount, fin = week.finishedPlanned;
  const headline = fin === 0
    ? L('Your week starts here.', 'สัปดาห์ของคุณเริ่มที่นี่')
    : L(<span>You kept up <b>{kept}/{fin}</b> {fin === 1 ? 'day' : 'days'} this week.</span>,
        <span>สัปดาห์นี้คุณตามทัน <b>{kept}/{fin}</b> วัน</span>);
  return (
    <div className="wrec-card">
      <div className="wrec-top">
        <span className="wrec-label">{L('Weekly Recap', 'สรุปสัปดาห์')}</span>
        {streak > 0 && <span className="week-streak">{tr('week.streak', { n: streak })}</span>}
      </div>
      <div className="wrec-head">{headline}</div>
      <div className="wrec-stats">
        <div className="wrec-stat">
          <div className="wrec-stat-num">{pct == null ? '—' : pct + '%'}{delta != null ? <span className={'wrec-delta ' + deltaCls}> {deltaTxt}</span> : null}</div>
          <div className="wrec-stat-lbl">{L('Kept of plan', 'ทำได้ของแผน')}</div>
        </div>
        <div className="wrec-stat">
          <div className="wrec-stat-num">{doneMin > 0 ? formatHM(Math.round(doneMin) * 60) : '0m'}</div>
          <div className="wrec-stat-lbl">{L('Time invested', 'เวลาที่ลงไป')}</div>
        </div>
        <div className="wrec-stat">
          <div className="wrec-stat-num">{best && (best.pct || 0) > 0 ? wd(best.dow) : '—'}</div>
          <div className="wrec-stat-lbl">{L('Best day', 'วันที่ดีสุด')}</div>
        </div>
      </div>
      {totalPlan > 0 && (
        /* Same race-bar style as the Day view (.dayp-race): avatar face + full lime target,
           YOU + amber done-so-far. */
        <div className="dayp-race">
          <div className="dayp-race-row">
            <span className="dayp-race-face">{renderFace(avatar && avatar.emoji, 16)}</span>
            <div className="dayp-race-track"><div className="dayp-race-fill av" style={{ width: '100%' }} /></div>
            <span className="dayp-race-val">{formatHM(Math.round(totalPlan) * 60)}</span>
          </div>
          <div className="dayp-race-row">
            <span className="dayp-race-tag">{tr('race.you')}</span>
            <div className="dayp-race-track"><div className="dayp-race-fill me" style={{ width: youPct + '%' }} /></div>
            <span className="dayp-race-val">{youMin > 0 ? formatHM(Math.round(youMin) * 60) : '0m'}</span>
          </div>
        </div>
      )}
      {/* The Mon–Sun day strip, folded in from WeekCard so the whole week lives in one card. */}
      <div className="week-strip">
        {(week.days || []).map(d => {
          const am = d.away ? awayReasonMeta(d.away) : null; // Away days show their reason, not a generic rest glyph
          return (
            <div key={d.dow} className={'week-day ' + d.status + (d.isToday ? ' today' : '')}>
              <span className="week-day-lbl">{wd(d.dow)}</span>
              <span className="week-day-glyph">{am ? <ActionEmoji code={am.code} size={15} fallback={am.glyph} label="" /> : WEEK_GLYPH[d.status]}</span>
            </div>
          );
        })}
      </div>
      {week.awayCounts && Object.keys(week.awayCounts).length > 0 && (
        <div className="wrec-away">
          {AWAY_REASONS.filter(r => week.awayCounts[r.id]).map(r => (
            <span key={r.id} className="wrec-away-item"><ActionEmoji code={r.code} size={14} fallback={r.glyph} label="" /> {week.awayCounts[r.id]}</span>
          ))}
          <span className="wrec-away-lbl">{L('off this week', 'ลาสัปดาห์นี้')}</span>
        </div>
      )}
    </div>
  );
}

// Set by the dashboard's Friends quick-card so a fresh HistoryScreen mount opens straight
// into Friends mode (HistoryScreen remounts on every tab switch, so this one-shot flag is read
// in its `mode` initializer below, then cleared). Same effect as the ?add= invite-link deep link.
let _openFriendsMode = false;

// ===== To-Do =====
// The action-based counterpart to the schedule. The schedule answers "am I keeping my
// weekly contract?" (time-bound, graded, raced). A to-do answers "what still needs doing?"
// Items can be ONE-OFF or RECURRING (every day / chosen weekdays), and scored three ways like
// a Routine task: a single ✓ check, a COUNT of reps (3/8), or a PERCENT (0–100). To-Dos stay
// orthogonal to the race — never graded against the avatar. Stored under K.todos (backed up /
// cloud-synced). FREE: core utility, not analysis.
//
// Shape: { id, text, createdAt,
//          repeat: null | number[](Mon0..Sun6),   // null = one-off
//          goalMode: 'check' | 'count' | 'percent', target: number,
//          prog: { [dayKey]: number },            // recurring → per-day progress (auto-resets)
//          cur?, done?, doneAt? }                  // one-off → top-level (legacy items use done)
function todoRecurring(t) { return Array.isArray(t.repeat) && t.repeat.length > 0; }
function todoTarget(t) { return t.goalMode === 'count' ? Math.max(1, t.target || 1) : t.goalMode === 'percent' ? 100 : 1; }
function todoCur(t, dk) {
  if (todoRecurring(t)) return (t.prog && t.prog[dk]) || 0;
  if (typeof t.cur === 'number') return t.cur;
  return t.done ? todoTarget(t) : 0; // legacy one-off check
}
function todoDoneOn(t, dk) { return todoCur(t, dk) >= todoTarget(t); }
function todoScheduledOn(t, dow) { return !todoRecurring(t) || t.repeat.indexOf(dow) !== -1; }
function todoRepeatLabel(t) {
  if (!todoRecurring(t)) return '';
  if (t.repeat.length === 7) return tr('todo.cfg.daily');
  return t.repeat.slice().sort((a, b) => a - b).map(d => wdShort(d)).join(' ');
}
// Consecutive met-the-goal streak for a recurring to-do, counting only its SCHEDULED weekdays.
// Today still in progress never breaks it: if today isn't met yet, we count back from yesterday.
function todoStreak(t, ts) {
  if (!todoRecurring(t)) return 0;
  const tgt = todoTarget(t), prog = t.prog || {};
  let d = startOfDay(ts);
  if ((prog[dayKey(d)] || 0) < tgt) d = addDays(d, -1); // today not done yet → don't penalize
  let streak = 0;
  for (let guard = 0; guard < 400; guard++) {
    if (t.repeat.indexOf(dayIndexMon(d)) !== -1) {
      if ((prog[dayKey(d)] || 0) >= tgt) streak++; else break;
    }
    d = addDays(d, -1);
  }
  return streak;
}
// Keep a recurring item's per-day progress bounded (~400 days) so the map can't grow forever.
function prunedProg(prog, ts) {
  const cutoff = startOfDay(addDays(ts, -400));
  const out = {};
  for (const k in prog) {
    const p = k.split('-');
    if (new Date(+p[0], +p[1] - 1, +p[2]).getTime() >= cutoff) out[k] = prog[k];
  }
  return out;
}
// Due-date info for a one-off to-do (recurring uses repeat days instead). null when no due.
function todoDueInfo(t, ts) {
  if (!t.due || todoRecurring(t)) return null;
  const p = t.due.split('-');
  const dueTs = new Date(+p[0], +p[1] - 1, +p[2]).getTime();
  const diff = Math.round((startOfDay(dueTs) - startOfDay(ts)) / 86400000);
  const label = diff === 0 ? tr('todo.due.today')
    : new Date(dueTs).toLocaleDateString(getLang() === 'th' ? 'th-TH' : 'en-US', { day: 'numeric', month: 'short' });
  return { diff, overdue: diff < 0, today: diff === 0, label };
}

function TodoRow({ todo, dk, dow, now, scheduled, dragId, onDragStart, onSetCur, onRemove, onUpdate }) {
  const [cfg, setCfg] = React.useState(false);
  const [name, setName] = React.useState(todo.text);
  const mode = todo.goalMode || 'check';
  const tgt = todoTarget(todo);
  const cur = todoCur(todo, dk);
  const done = cur >= tgt;
  const recurring = todoRecurring(todo);
  const step = mode === 'percent' ? 10 : 1;
  const streak = recurring ? todoStreak(todo, now || Date.now()) : 0;
  const due = scheduled ? todoDueInfo(todo, now || Date.now()) : null;
  const draggable = !!onDragStart;
  const saveName = () => { const t = name.trim(); if (t && t !== todo.text) onUpdate(todo.id, { text: t }); };
  // Changing the goal mode would leave today's progress in the OLD unit (60% reading as 60 reps,
  // or a count of 3 instantly "completing" a percent goal) — so reset today's value on switch.
  const setMode = (gm, patch) => {
    const np = { goalMode: gm, cur: 0, done: false, doneAt: null, ...(patch || {}) };
    if (recurring) { const prog = { ...(todo.prog || {}) }; delete prog[dk]; np.prog = prog; }
    onUpdate(todo.id, np);
  };
  // Setting a reminder time asks for notification permission once (To-Do reminders are free).
  const setRemind = (v) => {
    onUpdate(todo.id, { remind: v || null });
    if (v && typeof Notification !== 'undefined' && Notification.permission === 'default') {
      try { Notification.requestPermission(); } catch (_) {}
    }
  };

  // Leading element: a tap-to-check button (check mode) or a progress pill (count/percent).
  const lead = mode === 'check' ? (
    <button className="todo-tap" onClick={() => scheduled && onSetCur(todo.id, done ? 0 : tgt)} disabled={!scheduled}
      aria-pressed={done} aria-label={tr(done ? 'todo.uncheck' : 'todo.check')}>
      <span className="todo-check"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5" /></svg></span>
      <span className="todo-text">{todo.text}</span>
    </button>
  ) : (
    <div className="todo-tap todo-tap-prog">
      {/* Tap the pill to jump to fully-done / reset; the −/＋ steppers do fine increments. */}
      <button className={'todo-prog' + (done ? ' is-done' : '')} onClick={() => scheduled && onSetCur(todo.id, done ? 0 : tgt)}
        disabled={!scheduled} aria-label={tr(done ? 'todo.uncheck' : 'todo.check')}>{mode === 'percent' ? cur + '%' : cur + '/' + tgt}</button>
      <span className="todo-text">{todo.text}</span>
    </div>
  );

  return (
    <React.Fragment>
      <div className={'todo-row' + (done ? ' is-done' : '') + (!scheduled ? ' is-offday' : '') + (dragId === todo.id ? ' is-dragging' : '')}
        data-todo-active={draggable ? todo.id : undefined}>
        {draggable && (
          <button className="todo-drag" onPointerDown={(e) => onDragStart(e, todo.id)} aria-label={tr('todo.drag')}>⠿</button>
        )}
        {lead}
        {due && <span className={'todo-due' + (due.overdue ? ' overdue' : '') + (due.today ? ' today' : '')}>📅 {due.label}</span>}
        {!scheduled ? (
          <span className="todo-offtag">{todoRepeatLabel(todo)}</span>
        ) : mode !== 'check' ? (
          <div className="todo-step">
            <button onClick={() => onSetCur(todo.id, Math.max(0, cur - step))} disabled={cur <= 0} aria-label="−">−</button>
            <button onClick={() => onSetCur(todo.id, Math.min(tgt, cur + step))} disabled={cur >= tgt} aria-label="+">＋</button>
          </div>
        ) : null}
        {streak > 0 && <span className="todo-streak" title={tr('todo.streak')}>🔥{streak}</span>}
        {todo.remind && <span className="todo-remind" title={tr('todo.cfg.remind')}>🔔{todo.remind}</span>}
        <button className={'todo-edit' + (cfg ? ' on' : '')} onClick={() => { setName(todo.text); setCfg(v => !v); }} aria-label={tr('todo.cfg.settings')}>⚙</button>
        <button className="todo-del" onClick={() => onRemove(todo.id)} aria-label={tr('todo.delete')}>✕</button>
      </div>

      {cfg && (
        <div className="todo-cfg">
          <input className="todo-cfg-name" value={name} maxLength={200} placeholder={tr('todo.placeholder')}
            onChange={(e) => setName(e.target.value)} onBlur={saveName}
            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); saveName(); e.currentTarget.blur(); } }} />

          <div className="todo-cfg-label"><span>🔁</span>{tr('todo.cfg.repeat')}</div>
          <div className="todo-cfg-seg">
            <button className={!recurring ? 'on' : ''} onClick={() => onUpdate(todo.id, { repeat: null })}>{tr('todo.cfg.oneoff')}</button>
            <button className={recurring && todo.repeat.length === 7 ? 'on' : ''} onClick={() => onUpdate(todo.id, { repeat: [0, 1, 2, 3, 4, 5, 6] })}>{tr('todo.cfg.daily')}</button>
            <button className={recurring && todo.repeat.length < 7 ? 'on' : ''} onClick={() => onUpdate(todo.id, { repeat: (recurring && todo.repeat.length < 7) ? todo.repeat : [dow] })}>{tr('todo.cfg.custom')}</button>
          </div>
          {recurring && (
            <div className="todo-cfg-days">
              {ALL_DAYS.map(d => (
                <button key={d} className={'todo-day' + (todo.repeat.indexOf(d) !== -1 ? ' on' : '')}
                  onClick={() => {
                    const has = todo.repeat.indexOf(d) !== -1;
                    const nr = has ? todo.repeat.filter(x => x !== d) : [...todo.repeat, d];
                    onUpdate(todo.id, { repeat: nr.length ? nr : null });
                  }}>{wdShort(d)}</button>
              ))}
            </div>
          )}

          <div className="todo-cfg-label"><span>🎯</span>{tr('todo.cfg.goal')}</div>
          <div className="todo-cfg-seg">
            <button className={mode === 'check' ? 'on' : ''} onClick={() => setMode('check')}>{tr('todo.goal.check')}</button>
            <button className={mode === 'count' ? 'on' : ''} onClick={() => setMode('count', { target: todo.target || 3 })}>{tr('todo.goal.count')}</button>
