<!-- Pre-mount theme paint: applyTheme() only runs in a React useEffect (after Babel
     compiles + mounts), so until then :root carries the lime DEFAULT accent. That made
     every accent-tinted element — notably the avatar's day-view blocks (.tl2.av) — FLASH
     green on each reload before the saved theme snapped in. Set the CSS vars here,
     synchronously during head parse, so the right accent is painted from the first frame.
     Mirror the React clamp (train.html ~4659): themes are a Pro perk, so a Free plan must
     stay on the lime default (else a downgraded user would flash violet→lime instead). -->
<script>
(function(){
  try {
    var plan = localStorage.getItem('tm_plan');
    if (plan !== 'pro' && plan !== 'proplus') return; // Free: keep lime default
    var THEMES = {
      cyan:   { a:'#22d3ee', h:'#67e8f9', rgb:'34,211,238',  y:'#fbbf24', yr:'251,191,36' },
      sky:    { a:'#38bdf8', h:'#7dd3fc', rgb:'56,189,248',  y:'#fbbf24', yr:'251,191,36' },
      violet: { a:'#a78bfa', h:'#c4b5fd', rgb:'167,139,250', y:'#fbbf24', yr:'251,191,36' },
      pink:   { a:'#f472b6', h:'#f9a8d4', rgb:'244,114,182', y:'#fbbf24', yr:'251,191,36' },
      orange: { a:'#fb923c', h:'#fdba74', rgb:'251,146,60',  y:'#38bdf8', yr:'56,189,248' },
      amber:  { a:'#fbbf24', h:'#fcd34d', rgb:'251,191,36',  y:'#38bdf8', yr:'56,189,248' },
      mint:   { a:'#34d399', h:'#6ee7b7', rgb:'52,211,153',  y:'#fbbf24', yr:'251,191,36' }
    };
    var t = THEMES[localStorage.getItem('tm_theme')]; // 'lime'/unknown → keep default
    if (!t) return;
    var r = document.documentElement.style;
    r.setProperty('--accent', t.a); r.setProperty('--accent-hover', t.h);
    r.setProperty('--accent-rgb', t.rgb); r.setProperty('--you', t.y); r.setProperty('--you-rgb', t.yr);
  } catch (e) {}
})();
</script>

<script type="text/babel">
const SCHEMA_VERSION = 8;

  plan: 'tm_plan',              // 'free' | 'pro' | 'proplus' (mock unlock; device-local)
  clickSound: 'tm_click_sound', // '0' = off; anything else (incl. absent) = on. Crispy click on every tap.
  heroInsights: 'tm_hero_insights', // '1' = hero opens in Insights mode (remembered toggle)
  lang: 'tm_lang',              // 'en' | 'th' — UI language (device-local)
  clock24: 'tm_clock24',       // '1' = show 24-hour time everywhere (default 12h AM/PM)
  askOpen: 'tm_askopen',        // dayKey of the last day JEK's "what happened?" auto-opened the chat (once/day)
  theme: 'tm_theme',            // accent-color theme id (Pro cosmetic; device-local but backed up)
  adult: 'tm_adult',            // '1' once the 18+ persona age-confirm has been accepted (device-local)
  personaCleanup: 'tm_persona_cleanup', // '1' once the one-time "broken-window persona" reset has run
  noSway: 'tm_no_sway',         // '1' = user turned OFF the gentle sway on emojis that have no animated gif (device-local)
  recentEmoji: 'tm_recent_emoji', // rolling list of CUSTOM emoji codes picked for activities (device-local convenience strip)
  avatarLooks: 'tm_avatar_looks', // saved avatar "looks" — full avatar snapshots {emoji,faceCrop,aura,stickers,…} the user can re-apply
  chat: 'tm_chat',              // [{role:'user'|'jek', text, ts}] — persistent JEK conversation thread (device-local; capped CHAT_MAX). Re-read anytime; last ~10 turns feed the model.
  schemaVersion: 'tm_schema_version',
};
const CHAT_MAX = 100; // keep the JEK thread bounded (localStorage quota — only the last N messages persist)
// LINE-style chat timestamps: a centered day separator (Today / Yesterday / weekday-date) and a
// small HH:MM clock beside each bubble. Both read the message's stored `ts` (older pre-ts messages
// just render without a stamp).
function chatDayLabel(ts) {
  const d = startOfDay(ts), today = startOfDay(Date.now());
  if (d === today) return tr('common.today');
  if (d === addDays(today, -1)) return tr('common.yesterday');
  return new Date(ts).toLocaleDateString(_lang === 'th' ? 'th-TH' : 'en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function chatClock(ts) {
  const t = new Date(ts);
  return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
}

// ── Heavy image HISTORY store (IndexedDB) ────────────────────────────────────────────────────
// The two rolling "recently used" photo lists — the avatar's saved-photo history and the custom
// task-emoji history — are the biggest space hogs in localStorage (each entry is a base64 photo or
// GIF). They're pure CONVENIENCE history: losing one never breaks core data (the CURRENT face/emoji
// lives elsewhere in localStorage). So we keep them in IndexedDB (hundreds of MB quota) instead,
// freeing localStorage for the small, render-at-boot-critical state. Hydrated into a module cache at
// boot; the synchronous UI reads the cache. If IDB is unavailable (private mode, ancient browser)
// we transparently fall back to the old localStorage path — nothing is ever lost. Migration is
// verify-before-delete: copy → read back → only then strip the source (a past migration that deleted
// first destroyed user data — never again).
let _idbDB = null;          // open IDBDatabase, or null
let _idbReady = false;      // hydration finished (cache populated OR fallback decided)
let _idbActive = false;     // IDB usable → the cache is the source of truth for histories
const _histCache = { avatarPhotos: { photos: [], photoCrops: {} }, recentEmoji: [] };
// Content-addressed image store: hash(dataURL) → dataURL. Task-emoji photos (and any other heavy
// image we offload) live here instead of inline in localStorage. Hydrated fully into this Map at
// boot so the SYNC unpack paths (loadActivities) can resolve a token → dataURL without async.
let _imgBlobCache = new Map();
const _imgStoreReadyCbs = [];
function onImgStoreReady(cb) { if (_idbReady) { try { cb(); } catch (_) {} } else _imgStoreReadyCbs.push(cb); }
function _idbOpen() {
  return new Promise((res) => {
    try {
      if (typeof indexedDB === 'undefined') return res(null);
      const req = indexedDB.open('train-imgstore', 2); // v2 adds the content-addressed `img` store
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('hist')) db.createObjectStore('hist');
        if (!db.objectStoreNames.contains('img')) db.createObjectStore('img'); // key = content hash, value = dataURL
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
    } catch (_) { res(null); }
  });
}
// cyrb53 — fast non-crypto hash; collision odds are negligible at our scale (a handful of images).
function _imgHash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
}
// Store an image's bytes once (by content hash) and return its id. Cache updates synchronously so the
// id resolves immediately; the IDB write is best-effort (idempotent — same bytes → same id).
function idbImgPut(dataURL) {
  const id = _imgHash(dataURL);
  if (!_imgBlobCache.has(id)) {
    _imgBlobCache.set(id, dataURL);
    if (_idbActive) { try { const tx = _idbDB.transaction('img', 'readwrite'); tx.objectStore('img').put(dataURL, id); } catch (_) {} }
  }
  return id;
}
function _idbGetAllImg() {
  return new Promise((res) => {
    try {
      const tx = _idbDB.transaction('img', 'readonly'), store = tx.objectStore('img');
      const rk = store.getAllKeys(), rv = store.getAll();
      let keys = null, vals = null;
      const done = () => { const m = new Map(); for (let i = 0; i < keys.length; i++) m.set(keys[i], vals[i]); res(m); };
      rk.onsuccess = () => { keys = rk.result; if (vals) done(); };
      rv.onsuccess = () => { vals = rv.result; if (keys) done(); };
      tx.onerror = () => res(new Map());
      tx.onabort = () => res(new Map());

}
// Encode a data: URL → "idbimg:<hash>[#frag]" token (bytes go to the content store); passthrough for
// non-images or when IDB is off (then bytes stay inline in localStorage — old behavior).
function _imgEnc(u) {
  if (typeof u !== 'string' || u.slice(0, 5) !== 'data:' || !_idbActive) return u;
  const h = u.indexOf('#'), base = h === -1 ? u : u.slice(0, h), frag = h === -1 ? '' : u.slice(h);
  return 'idbimg:' + idbImgPut(base) + frag;
}
// Decode an "idbimg:" token → its data: URL from the cache; unresolved (cache miss) → return the
// token unchanged (renderTaskFace then falls back to a default glyph, never a broken image).
function _imgDec(u) {
  if (typeof u !== 'string' || u.slice(0, 7) !== 'idbimg:') return u;
  const h = u.indexOf('#'), body = h === -1 ? u : u.slice(0, h), frag = h === -1 ? '' : u.slice(h);
  const base = _imgBlobCache.get(body.slice(7));

}
// Backup/cloud portability for the content-addressed task-emoji photos. The bytes live in the IDB
// `img` store (out of localStorage), so a backup/sync payload only carries dangling "idbimg:" tokens
// unless we ship the referenced blobs alongside it. collectImgBlobs walks a SERIALIZED (parsed) payload
// and returns { hash: dataURL } for every token it can resolve from the cache; restoreImgBlobs writes
// those back into the cache (sync, so a reload resolves them) + the IDB store (best-effort, awaitable).
function collectImgBlobs(data) {
  const out = {};
  const walk = (v) => {
    if (typeof v === 'string') {
      if (v.slice(0, 7) === 'idbimg:') {
        const h = v.indexOf('#'); const id = (h === -1 ? v : v.slice(0, h)).slice(7);
        if (id && !(id in out)) { const b = _imgBlobCache.get(id); if (typeof b === 'string') out[id] = b; }
      }
    } else if (Array.isArray(v)) { for (let i = 0; i < v.length; i++) walk(v[i]); }
    else if (v && typeof v === 'object') { for (const k in v) walk(v[k]); }
  };

  return out;
}
function restoreImgBlobs(imgMap) {
  if (!imgMap || typeof imgMap !== 'object') return Promise.resolve();
  const ids = Object.keys(imgMap);
  for (const id of ids) { const v = imgMap[id]; if (typeof v === 'string' && !_imgBlobCache.has(id)) _imgBlobCache.set(id, v); }
  if (!_idbActive || !_idbDB || !ids.length) return Promise.resolve();
  return new Promise((res) => {
    try {
      const tx = _idbDB.transaction('img', 'readwrite'), store = tx.objectStore('img');
      for (const id of ids) { if (typeof imgMap[id] === 'string') { try { store.put(imgMap[id], id); } catch (_) {} } }
      tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false);
    } catch (_) { res(false); }
  });
}
function _idbGet(key) {
  return new Promise((res) => { try { const tx = _idbDB.transaction('hist', 'readonly'); const r = tx.objectStore('hist').get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); } catch (_) { res(undefined); } });
}
function _idbPut(key, val) {
  return new Promise((res) => { try { const tx = _idbDB.transaction('hist', 'readwrite'); tx.objectStore('hist').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false); } catch (_) { res(false); } });

// Best-effort async write of a history record (cache is updated synchronously by the caller, so the
// UI is correct immediately even if this write resolves later or fails).
function _saveHist(key, val) { if (_idbActive) _idbPut(key, val); }
// Wipe the device-local image + history stores (avatar photos, recent hand-made emoji,

// reset left these in IDB, so wiped data reappeared on reload. Clears the in-memory
// caches first (so nothing repopulates before the reload) then the persisted stores;
// resolves when the stores are cleared, or immediately if IDB isn't open.
function _idbWipe() {
  _histCache.avatarPhotos = { photos: [], photoCrops: {} };
  _histCache.recentEmoji = [];
  _imgBlobCache = new Map();
  return new Promise((res) => {
    if (!_idbDB) return res(true);
    try {
      const tx = _idbDB.transaction(['hist', 'img'], 'readwrite');
      tx.objectStore('hist').clear();
      tx.objectStore('img').clear();
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
      tx.onabort = () => res(false);
    } catch (_) { res(false); }
  });

// Collect every idbimg: hash currently referenced anywhere in persisted state, by walking
// ALL app (tm_) localStorage values. Deliberately a SUPERSET — missing one reference would
// orphan-delete a live image (bytes are content-addressed, not re-derivable) — so we scan
// everything, not just K.activities.
function collectLiveImgIds() {
  const ids = new Set();
  const walk = (v) => {
    if (typeof v === 'string') {
      if (v.slice(0, 7) === 'idbimg:') { const h = v.indexOf('#'); const id = (h === -1 ? v : v.slice(0, h)).slice(7); if (id) ids.add(id); }
    } else if (Array.isArray(v)) { for (let i = 0; i < v.length; i++) walk(v[i]); }
    else if (v && typeof v === 'object') { for (const k in v) walk(v[k]); }
  };
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.indexOf('tm_') !== 0) continue;
      const raw = localStorage.getItem(k);
      if (!raw || raw.indexOf('idbimg:') === -1) continue; // cheap skip — tokens only live inside JSON values
      try { walk(JSON.parse(raw)); } catch (_) {}
    }
  } catch (_) {}
  return ids;
}
// Mark-and-sweep the content-addressed img store: drop any stored blob no longer referenced
// by persisted state. Orphans pile up when a task emoji is deleted or re-photographed
// (content-addressed put never deletes). Best-effort; runs once on boot AFTER hydrate — by
// then the live set is stable and any undo history is gone, so we never delete an undoable blob.
function sweepImgStore() {
  if (!_idbActive || !_idbDB) return Promise.resolve();
  const live = collectLiveImgIds();
  return new Promise((res) => {
    try {
      const tx = _idbDB.transaction('img', 'readwrite'), store = tx.objectStore('img');
      const rk = store.getAllKeys();
      rk.onsuccess = () => {
        for (const id of (rk.result || [])) {
          if (!live.has(id)) { try { store.delete(id); } catch (_) {} _imgBlobCache.delete(id); }
        }

      tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false);
    } catch (_) { res(false); }

}
async function hydrateImgStore() {

  try { db = await _idbOpen(); } catch (_) { db = null; }
  if (db) {
    _idbDB = db;
    try { _imgBlobCache = await _idbGetAllImg(); } catch (_) { _imgBlobCache = new Map(); } // content store → memory
    try {
      // STEP 1 — build the caches and write-through to IDB. Do NOT strip localStorage yet, and do NOT
      // flip _idbActive: until both are true, every read still uses the intact localStorage source.
      // recentEmoji (flat array of data: URLs)
      let re = await _idbGet('recentEmoji'), stripRecent = false;
      if (re == null) { // first run after the IDB upgrade → migrate from localStorage
        let legacy = [];
        try { const a = JSON.parse(localStorage.getItem(K.recentEmoji) || '[]'); if (Array.isArray(a)) legacy = a.filter(c => typeof c === 'string' && c.slice(0, 5) === 'data:'); } catch (_) {}
        if (await _idbPut('recentEmoji', legacy)) {
          const check = await _idbGet('recentEmoji');          // VERIFY destination before deleting source
          if (Array.isArray(check)) { re = check; stripRecent = true; } else re = legacy;
        } else re = legacy;
      }
      _histCache.recentEmoji = Array.isArray(re) ? re : [];
      // avatarPhotos ({photos:[], photoCrops:{}}) — embedded in K.avatar pre-migration
      let ap = await _idbGet('avatarPhotos'), stripAvatar = false;
      if (ap == null) {
        let seed = { photos: [], photoCrops: {} };
        try {
          const av = unpackAvatar(loadJSON(K.avatar, null) || {});
          seed = { photos: Array.isArray(av.photos) ? av.photos.filter(p => typeof p === 'string' && p.slice(0, 5) === 'data:') : [],
                   photoCrops: (av.photoCrops && typeof av.photoCrops === 'object') ? av.photoCrops : {} };
        } catch (_) {}
        if (await _idbPut('avatarPhotos', seed)) {
          const check = await _idbGet('avatarPhotos');         // VERIFY before stripping K.avatar
          if (check && typeof check === 'object') { ap = check; stripAvatar = true; } else ap = seed;
        } else ap = seed;
      }
      _histCache.avatarPhotos = (ap && typeof ap === 'object')
        ? { photos: Array.isArray(ap.photos) ? ap.photos : [], photoCrops: (ap.photoCrops && typeof ap.photoCrops === 'object') ? ap.photoCrops : {} }
        : { photos: [], photoCrops: {} };
      // STEP 2 — caches verified in IDB → make IDB the source of truth, THEN strip localStorage.
      _idbActive = true;
      if (stripRecent) { try { localStorage.removeItem(K.recentEmoji); } catch (_) {} }
      if (stripAvatar) { try { const full = unpackAvatar(loadJSON(K.avatar, null) || {}); localStorage.setItem(K.avatar, JSON.stringify(packAvatar({ ...full, photos: [], photoCrops: {} }))); } catch (_) {} }
    } catch (_) { /* partial hydration — _idbActive stays false, localStorage path used. No loss. */ }
  }
  _idbReady = true;
  const cbs = _imgStoreReadyCbs.splice(0);

    // whole render (white screen). Enforce the fallback's array-ness/object-ness.

    if (fallback && typeof fallback === 'object' && !Array.isArray(fallback) &&

function formatHM(sec) {

  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm';
