  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<ErrorBoundary><Root /></ErrorBoundary>);
  try { track('app_open'); } catch (_) {}
  // Reclaim orphaned task-emoji image blobs. Deferred so it never competes with first paint,
  // and late enough that any cloud-sync reconcile has landed in localStorage (so its tokens
  // count as live and aren't swept).
  setTimeout(() => { try { sweepImgStore(); } catch (_) {} }, 6000);
})();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const _devHost = ['localhost', '127.0.0.1', '0.0.0.0'].indexOf(location.hostname) !== -1;
  if (_devHost) {
    // DEV (localhost): the service worker only gets in the way — it caches the HTML so code edits
    // "don't show up" until a hard refresh. Kill it entirely here: unregister any existing SW and
    // wipe its caches so :8000 always serves the file straight off disk. If a stale SW is still
    // controlling THIS load, reload once (sessionStorage-guarded against a loop) to drop it.
    navigator.serviceWorker.getRegistrations().then((rs) => Promise.all(rs.map((r) => r.unregister()))).catch(() => {});
    if (window.caches && caches.keys) caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))).catch(() => {});
    try {
      if (navigator.serviceWorker.controller && !sessionStorage.getItem('_swkilled')) {
        sessionStorage.setItem('_swkilled', '1');
        location.reload();
      }
    } catch (e) {}
  } else {
    // PROD: Auto-update — when a freshly installed SW takes control, reload once so the newest UI
    // shows immediately (guarded so a first-ever install, which has no prior controller, doesn't reload).
    let _swReloading = false;
    const _hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!_hadController || _swReloading) return;
      _swReloading = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update();
        setInterval(() => reg.update(), 60 * 60 * 1000); // re-check hourly while open
      }).catch(() => {});
    });
  }
}
</script>
<script>
/* PWA install banner (vanilla, outside React) — makes it obvious Ijek can be INSTALLED as an app so
   it doesn't read as "just a website". Chrome/Edge (Android + desktop) fire beforeinstallprompt → a
   one-tap Install button calls the native dialog. iOS Safari has no such event → show the Share →
   Add-to-Home-Screen steps. Hidden when already running installed (standalone) or after install/dismiss. */
(function () {
  function standalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
  if (standalone()) return;
  var KEY = 'tm_install_dismissed';
  try { if (localStorage.getItem(KEY) === '1') return; } catch (e) {}
  var th = (navigator.language || '').slice(0, 2) === 'th';
  // Brand mark (the Ijek twin-triangle logo) instead of a clashing 📲 emoji — keeps the banner on-theme.
  var ICON = '<svg class="pib-ico" width="24" height="24" viewBox="92 158 368 252" aria-hidden="true"><path d="M200 202 L300 402 H100 Z" fill="#4f6e29"/><path d="M322 166 L452 402 H192 Z" fill="#a3e635"/></svg>';
  var deferred = null, banner = null;
  function close(remember) { if (banner) { banner.remove(); banner = null; } if (remember) { try { localStorage.setItem(KEY, '1'); } catch (e) {} } }
  function show(inner) {
    if (banner || standalone()) return;
    banner = document.createElement('div');
    banner.id = 'pwa-install-banner';
    banner.innerHTML = inner + '<button class="pib-x" aria-label="close">✕</button>';
    document.body.appendChild(banner);
    banner.querySelector('.pib-x').onclick = function () { close(true); };
    var ib = banner.querySelector('#pib-install');
    if (ib) ib.onclick = function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.finally(function () { deferred = null; close(false); });
    };
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    show(ICON + '<span class="pib-txt">' + (th ? 'ติดตั้ง Ijek เป็นแอปบนเครื่อง' : 'Install Ijek as an app') + '</span><button id="pib-install" class="pib-btn">' + (th ? 'ติดตั้ง' : 'Install') + '</button>');
  });
  window.addEventListener('appinstalled', function () { close(true); });
  var ua = navigator.userAgent || '';
  var iSafari = /iphone|ipad|ipod/i.test(ua) && /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
  if (iSafari) setTimeout(function () {
    show(ICON + '<span class="pib-txt">' + (th ? 'ติดตั้งเป็นแอป: แตะ ' : 'Install as an app: tap ') + '<b>⎦ Share</b>' + (th ? ' → "เพิ่มลงหน้าจอหลัก"' : ' → "Add to Home Screen"') + '</span>');
  }, 3000);
})();
</script>
