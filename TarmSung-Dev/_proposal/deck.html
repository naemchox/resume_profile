<!--
  เด็ค 33 หน้า สไตล์ Swiss/International Typographic (ทำใหม่จาก GIF ต้นฉบับ)

  โครงสร้าง
  • ข้อความทั้งเด็คอยู่ใน DECK ด้านล่าง (แก้ที่เดียว) · รูปอยู่ใน SRCN (คีย์ = ลำดับหน้า)
  • คลิกแก้ข้อความบนหน้าเว็บได้ตรงๆ (contenteditable ที่หัวข้อ/ย่อหน้าหลัก)
  • คีย์บอร์ด: ← → / Space เลื่อนหน้า · เลข 1-6 กระโดดตามบท
  • Cmd+P = PDF หน้าละสไลด์ (margin None)

  หน่วยขนาด
  • ทุกขนาดผูกกับตัวแปรเดียว --u = min(1cqw, 1.7778svh) → ไม่ล้นทั้งจอกว้างและจอเตี้ย
  • ห้ามใช้ container-type:size บน .s — Chrome จะไม่วาดรูปในคอนเทนเนอร์นั้น (เจอจริง 24 ส.ค. 2026)

  รูป
  • ที่มา: Lorem Picsum (คลังภาพ Unsplash) ใช้เชิงพาณิชย์ได้ ไม่ต้องให้เครดิต
  • ไฟล์ใน img/ ถูกอบ (bake) เป็นขาวดำ + ปรับความสว่างตามธีมของสไลด์ไว้แล้ว → ไม่ต้องใช้ CSS filter
    ต้นฉบับสียังอยู่ที่ img/_orig/ ถ้าจะปรับใหม่
  • สลับเป็นรูปตัวเอง: วางไฟล์ใน img/ แล้วแก้เลขใน SRCN (ลำดับ = ลำดับช่องรูปในสไลด์นั้น)
  • ยังไม่มีรูปหน้าคนสตูดิโอ (headshot) เพราะแหล่งฟรีที่ไม่ต้องมี API key ไม่มีให้ —
    หน้า 25-28 จึงใช้ภาพบรรยากาศแทน ถ้าจะใช้ headshot จริงต้องเอารูปทีมมาใส่เอง

  Motion (ตาม website_building.md Step 11)
  • transform/opacity เท่านั้น · 360ms ease-out · hover ที่รูป/แถวใหญ่ · แถบความคืบหน้าบนสุด
  • เคารพ prefers-reduced-motion (ปิดทุก transition)
  • มี failsafe: ถ้า IntersectionObserver ไม่ยิง สไลด์ที่อยู่ในจอจะถูกบังคับให้โชว์
-->
<style>
:root{
  --red:#ff3b21; --dark:#1b1b1b; --deep:#111; --paper:#efece4;
  --cream:#f1eee6; --grey:#8c8c8c; --ink:#141414;
  --line:rgba(0,0,0,.22); --lineL:rgba(255,255,255,.22);
  --sans:"Helvetica Neue",Helvetica,Inter,Arial,"Noto Sans Thai",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;background:#dcdcda}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--ink)}
li{list-style:none}

/* ---------- shell ---------- */
.stage{display:flex;flex-direction:column}
.s{
  container-type:inline-size;   /* size = Chrome ไม่วาดรูปในคอนเทนเนอร์นี้ (เจอจริง 24 ส.ค.) */
  --u:min(1cqw,1.7778svh);     /* หน่วยเดียว ผูกกับด้านที่แคบกว่า -> ไม่ล้นทั้งจอกว้างและจอเตี้ย */
  --pad:calc(3.2*var(--u));
  position:relative;
  width:100vw;
  height:100svh;
  overflow:hidden;
  scroll-snap-align:center;
  background:var(--paper);
  display:flex;flex-direction:column;
}
.s.dark{background:var(--dark);color:var(--cream)}
.s.deep{background:var(--deep);color:var(--cream)}
.s.red{background:var(--red);color:var(--cream)}
.s.grey{background:var(--grey);color:var(--cream)}
.s.white{background:#fff}
.s.dark,.s.deep,.s.red,.s.grey{--line:var(--lineL)}

/* ---------- chrome ---------- */
.chrome{
  display:grid;grid-template-columns:1fr 1fr 6fr auto;
  gap:calc(1*var(--u));padding:var(--pad) var(--pad) 0;
  font-size:calc(1.02*var(--u));line-height:1.45;letter-spacing:.01em;flex:0 0 auto;
}
.chrome b{font-weight:600}
.chrome .dot::before{content:"";display:inline-block;width:calc(.5*var(--u));height:calc(.5*var(--u));border-radius:50%;
  background:currentColor;margin-right:calc(.6*var(--u));vertical-align:calc(.1*var(--u))}
.chrome .globe{opacity:.75;font-size:calc(1.5*var(--u));justify-self:end}
.rule{height:1px;background:var(--line);margin:calc(1.6*var(--u)) var(--pad) 0}
.head{display:grid;grid-template-columns:calc(7*var(--u)) 1fr;gap:0 calc(2*var(--u));padding:calc(1.4*var(--u)) var(--pad) 0;align-items:start}
.head .no{font-size:calc(2.1*var(--u));letter-spacing:-.02em;opacity:.42}
.head h2{font-size:calc(2.1*var(--u));font-weight:500;letter-spacing:-.01em}
.head .sub{font-size:calc(2.1*var(--u));font-weight:500;letter-spacing:-.01em;opacity:.42;display:block}
.body{flex:1 1 auto;display:flex;min-height:0;padding:0 var(--pad) var(--pad)}
.grow{flex:1 1 auto}

/* ---------- type ---------- */
.word{font-size:calc(15*var(--u));line-height:.74;font-weight:500;letter-spacing:-.038em;white-space:nowrap}
.big{font-size:calc(6.6*var(--u));line-height:.92;font-weight:500;letter-spacing:-.028em}
.mid{font-size:calc(3.1*var(--u));line-height:1.12;font-weight:500;letter-spacing:-.018em}
.numeral{font-size:calc(34*var(--u));line-height:.72;font-weight:500;letter-spacing:-.04em}
.stmt{font-size:calc(2.55*var(--u));line-height:1.18;font-weight:500;letter-spacing:-.015em;opacity:.45;text-transform:uppercase}
.p{font-size:calc(1.12*var(--u));line-height:1.42}
.lede{font-size:calc(1.18*var(--u));line-height:1.4;max-width:calc(34*var(--u))}
.cap{font-size:calc(.92*var(--u));letter-spacing:.06em;text-transform:uppercase;opacity:.5}
.tiny{font-size:calc(.92*var(--u));line-height:1.6}
.lab{font-size:calc(.92*var(--u));letter-spacing:.02em;opacity:.55}
.ghost{color:color-mix(in srgb,currentColor 18%,transparent)}
.caret::before{content:"↓ ";opacity:.6}

/* ---------- placeholder image ---------- */
.ph{position:relative;background:#cfcdc7;overflow:hidden;flex:1 1 auto}
.dark .ph,.deep .ph{background:#2a2a2a}
.ph::before,.ph::after{content:"";position:absolute;background:rgba(0,0,0,.16)}
.ph::before{left:50%;top:44%;width:1px;height:6%}
.ph::after{left:47%;top:47%;width:6%;height:1px}
.dark .ph::before,.dark .ph::after,.deep .ph::before,.deep .ph::after{background:rgba(255,255,255,.18)}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph.has::before,.ph.has::after{content:none}
.ph.sil{background:#8c8c8c}
.ph.sil svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%}

/* ---------- reusable rows/cols ---------- */
.rows{display:flex;flex-direction:column;width:100%}
.row{display:grid;grid-template-columns:calc(4*var(--u)) 1fr calc(22*var(--u));gap:calc(2*var(--u));align-items:start;
  border-top:1px solid var(--line);padding:calc(1*var(--u)) 0}
.row .n{opacity:.35}
.rows.giant .row{align-items:center;padding:calc(.5*var(--u)) 0}
.rows.giant .n{font-size:calc(4.4*var(--u));line-height:1;opacity:.3}
.rows.giant .nm{font-size:calc(4.4*var(--u));line-height:1;font-weight:500;letter-spacing:-.025em}
.cols{display:grid;gap:calc(2*var(--u));width:100%}
.bullets li{padding-left:calc(1*var(--u));position:relative;font-size:calc(.92*var(--u));line-height:1.55}
.bullets li::before{content:"•";position:absolute;left:0;opacity:.6}
.kv{border-top:1px solid var(--line);padding:calc(.5*var(--u)) 0;display:flex;justify-content:space-between;
  font-size:calc(.92*var(--u));gap:calc(1*var(--u))}
.stat{font-size:calc(4.6*var(--u));line-height:1;font-weight:500;letter-spacing:-.025em}
.stat.g{font-size:calc(6.2*var(--u));color:color-mix(in srgb,currentColor 16%,transparent)}
.bar{height:calc(1.5*var(--u));background:currentColor;opacity:.9}
.pk .kv{padding:calc(.24*var(--u)) 0}
.qr{width:calc(5*var(--u));height:calc(5*var(--u));background:
  repeating-conic-gradient(currentColor 0 25%,transparent 0 50%) 0 0/calc(1*var(--u)) calc(1*var(--u));opacity:.9}

/* ---------- motion (Step 11: transform/opacity, <=400ms, ease-out, เคารพ reduced-motion) ----------
   กลไก: element ที่จะขยับติดคลาส .anim (+ ท่า) แล้ว JS เติม .on เมื่อสไลด์เข้าจอ
   คุมสถานะที่ตัวมันเอง ไม่พึ่งคลาสบน section -> ไม่มีปัญหา specificity กับ :hover */
:root{--ease:cubic-bezier(.16,1,.3,1)}
.bar-progress{position:fixed;left:0;top:0;height:2px;width:100%;background:currentColor;color:#111;
  transform:scaleX(0);transform-origin:0 50%;z-index:10;opacity:.35;transition:transform .18s linear}

.anim{opacity:0;transform:translateY(14px);
  transition:opacity .34s var(--ease) var(--d,0ms),transform .34s var(--ease) var(--d,0ms)}
.anim.right{transform:translateX(16px)}
.anim.zoom{transform:scale(1.06)}
.anim.rise{opacity:1;transform:translateY(102%);transition:transform .42s var(--ease) var(--d,0ms)}
.anim.on{opacity:1;transform:none}
.a-mask{overflow:hidden}
.barfill{transform:scaleX(0);transform-origin:0 50%;
  transition:transform .4s var(--ease) var(--d,0ms),opacity .2s ease-out}
.barfill.on{transform:scaleX(1)}

/* ---------- hover: ต้องอยู่หลัง .anim.on เพื่อให้ชนะ (specificity เท่ากัน ตัวหลังชนะ) ---------- */
.ph img{transition:transform .4s var(--ease)}
.ph:hover img{transform:scale(1.045)}
.stat,.qcell,.svccol,.tier,.cityrow,.chip,.qr,.tcell,.person,.field,.listcol,.gcell,
.idxline,.kv,.barrow,.contact,.word,.numeral,.rows .row{
  transition:transform .26s var(--ease),opacity .22s ease-out}
.svccol:hover{transform:translateY(calc(-.45*var(--u)))}
.svccol:hover .stat.ghost{opacity:.5}
.qcell:hover{transform:translateY(calc(-.35*var(--u)))}
.qcell:hover .stat{opacity:1}
.gcell:hover{transform:scale(1.035)}
.tier:hover{transform:translateX(calc(.5*var(--u)))}
.cityrow:hover{transform:translateX(calc(.6*var(--u)))}
.cityrow:hover .ghost{opacity:.85}
.chip:hover{transform:scale(1.07)}
.qr:hover{transform:scale(1.08)}
.tcell:hover,.person:hover{transform:translateY(calc(-.35*var(--u)))}
.field:hover .lab{opacity:1}
.listcol:hover{transform:translateY(calc(-.25*var(--u)))}
.stat:hover{transform:translateY(calc(-.2*var(--u)))}
.idxline:hover{transform:translateX(calc(.4*var(--u)));opacity:.65}
.kv:hover{opacity:.5}
.rows.giant .row:hover{transform:translateX(calc(.7*var(--u)))}
.barrow:hover{transform:translateX(calc(.5*var(--u)))}
.barrow:hover .barfill{opacity:1}
.contact:hover{opacity:1;transform:translateX(calc(.4*var(--u)))}
.word:hover{transform:translateY(calc(-.25*var(--u)))}
.s:hover .numeral{transform:translateY(calc(-.3*var(--u)))}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .anim{opacity:1!important;transform:none!important}
  .barfill{transform:scaleX(1)!important}
  .svccol,.qcell,.gcell,.tier,.cityrow,.chip,.qr,.tcell,.person,.listcol,.stat,
  .idxline,.barrow,.contact,.word,.numeral,.rows .row{transform:none!important}
  html{scroll-behavior:auto}
  .bar-progress{display:none}
}

/* ---------- fixed ui ---------- */
.hud{position:fixed;right:1.2vw;top:1.2vh;z-index:9;font-size:11px;letter-spacing:.08em;
  color:#5b5b58;mix-blend-mode:difference;font-variant-numeric:tabular-nums}
[contenteditable]:focus{outline:1px dashed rgba(128,128,128,.7);outline-offset:3px}
@media print{
  @page{size:landscape;margin:0}
  html{scroll-snap-type:none;background:#fff}
  .stage{gap:0;padding:0}.hud{display:none}
  .s{width:100%;height:100vh;aspect-ratio:auto;break-after:page}
}
</style>

let IMGQ=[];
const ph=(cls='',label='',src='')=>{
  const u=src||IMGQ.shift()||'';
  return `<div class="ph ${cls}${u?' has':''}">${u?`<img src="${u}" alt="" decoding="async">`:''}</div>`;};
const phBox=(label,cls='',flex='1')=>`<div style="display:flex;flex-direction:column;gap:calc(.6*var(--u));flex:${flex};min-width:0">
  ${label?`<div class="cap caret">${label}</div>`:''}${ph(cls)}</div>`;
const topbar=(d)=>`<div class="chrome">
  <div><b>${BRAND}</b><br>${DOC}<br>${YEAR}</div>

const head=(d)=>`<div class="head"><div class="no">${E(d.no)}</div>
  <div><h2>${E(d.title)}</h2>${d.year?`<span class="sub">${d.year}</span>`:''}

const heads=(hs)=>hs?`<div class="row" style="border:0;padding-bottom:calc(.2*var(--u))">
  ${hs.map(h=>`<div class="cap caret">${h}</div>`).join('').replace('<div class="cap caret">','<div class="cap caret" style="grid-column:1">')}</div>`:'';
const idx=(list)=>`<div style="display:flex;flex-direction:column;font-size:calc(.92*var(--u));line-height:1.6">

      <div class="field" style="display:grid;grid-template-columns:calc(8*var(--u)) 1fr;gap:calc(2*var(--u))">
        <div class="lab">(Credits)</div><div class="tiny"><b>${d.credits.join('<br>')}</b></div></div>
      <div class="grow"></div>
    </div>
    <div style="flex:0 0 calc(30*var(--u));display:flex">${ph()}</div>
  </div>`,

double:d=>`${topbar(d)}<div class="rule"></div>${head(d)}<div class="rule"></div>
  <div class="body" style="gap:calc(3*var(--u));padding-top:calc(1.2*var(--u))">
    ${d.people.map(p=>`<div class="person" style="flex:1 1 0;min-width:0;display:flex;gap:calc(1.4*var(--u))">
      <div style="flex:0 0 calc(13*var(--u));display:flex;flex-direction:column;gap:calc(.5*var(--u))">
        <div class="tiny dot"><b>${p.name}</b></div>${ph()}</div>
      <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
        <div class="cap">(${p.role})</div>
        <div class="tiny" style="margin-top:calc(.5*var(--u))"><b>${p.bio}</b></div>
        <div class="grow"></div>
        ${p.skills.map(s=>`<div class="kv"><span>+ ${s}</span></div>`).join('')}
      </div></div>`).join('')}

teamgrid:d=>`${topbar(d)}<div class="rule"></div>${head(d)}
  <div class="body" style="gap:calc(2.4*var(--u));padding-top:calc(1.2*var(--u))">
    <div style="flex:1 1 0"></div>
    <div style="flex:0 0 calc(46*var(--u));display:grid;grid-template-columns:repeat(3,1fr);gap:calc(1*var(--u))">
      ${d.people.map(([n,t])=>`<div class="tcell" style="display:flex;flex-direction:column;gap:calc(.4*var(--u))">

          <div class="tiny dot"><b>${n}</b></div><div class="cap">(${t})</div></div>
        <div style="aspect-ratio:1/1;display:flex">${ph()}</div></div>`).join('')}
    </div>
  </div>`,

packages:d=>`${topbar(d)}
  <div style="display:flex;justify-content:flex-end;padding:calc(1*var(--u)) var(--pad) 0">
    <div class="cap caret" style="flex:0 0 calc(30*var(--u))">Image description / credit</div></div>
  <div class="rule" style="margin-top:calc(.6*var(--u))"></div>${head(d)}<div class="rule"></div>
  <div class="body pk" style="gap:calc(2.4*var(--u));padding-top:calc(.8*var(--u))">
    <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:calc(.7*var(--u))">
      ${d.tiers.map(t=>`<div class="tier" style="display:grid;grid-template-columns:calc(10*var(--u)) calc(14*var(--u)) 1fr;gap:calc(2*var(--u))">
        <div><div class="cap caret">Starting at</div><div class="tiny"><b>${t.price}</b></div></div>
        <div><div class="cap caret">Package name</div><div class="tiny"><b>${t.name}</b></div></div>
        <div><div class="cap caret">Includes</div>
          ${t.inc.map((i,k)=>`<div class="kv"><span style="opacity:.5;width:calc(1.6*var(--u));display:inline-block">${'ABCDE'[k]}</span>
            <span style="flex:1">${i}</span></div>`).join('')}</div>
      </div>`).join('')}
      <div class="grow"></div>
    </div>
    <div style="flex:0 0 calc(30*var(--u));display:flex">${ph()}</div>
  </div>`,

quote:d=>`${topbar(d)}
  <div style="padding:calc(1.2*var(--u)) var(--pad) 0"><div class="cap caret">${d.label}</div></div>
  <div class="rule" style="margin-top:calc(.4*var(--u))"></div>
  <div style="display:grid;grid-template-columns:calc(7*var(--u)) 1fr;gap:0 calc(2*var(--u));padding:calc(1.2*var(--u)) var(--pad) 0">
    <div class="no" style="font-size:calc(2.1*var(--u));opacity:.42">${d.no}</div>
    <div class="big" contenteditable style="font-size:calc(3.4*var(--u))">${d.quote}</div></div>
  <div class="grow"></div>
  <div style="display:grid;grid-template-columns:calc(7*var(--u)) 1fr;gap:0 calc(2*var(--u));padding:0 var(--pad) calc(1.2*var(--u))">
    <div style="font-size:calc(1.6*var(--u))">→</div>
    <div class="mid ghost" style="opacity:.32">${d.attrib}</div></div>
  <div style="flex:0 0 34%;display:flex">${ph()}</div>`,

invest:d=>`${topbar(d)}
  <div style="display:flex;justify-content:flex-end;padding:calc(1*var(--u)) var(--pad) 0">
    <div class="cap caret" style="flex:0 0 calc(30*var(--u))">Image description / credit</div></div>
  <div class="rule" style="margin-top:calc(.6*var(--u))"></div>${head(d)}
  <div class="body" style="gap:calc(2.4*var(--u));padding-top:calc(1.4*var(--u))">
    <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
      <div class="cap caret">${d.label}</div>
      <div class="rule" style="margin:calc(.4*var(--u)) 0 calc(1*var(--u))"></div>
      <div class="stmt" style="opacity:1" contenteditable>${d.lead}</div>
      <div class="stmt" contenteditable>${d.rest}</div>
      <div class="grow"></div>
      <div class="qr"></div>
      <div class="tiny" style="margin-top:calc(.6*var(--u));opacity:.7">${d.note}</div>
    </div>

thanks:d=>`${topbar(d)}<div class="rule"></div>
  <div style="padding:calc(1.2*var(--u)) var(--pad) 0"><div class="contact tiny" style="opacity:.7">${d.contact}</div></div>
  <div class="grow"></div>
  <h1 class="word" contenteditable style="padding:0 0 0 calc(1.4*var(--u));margin-bottom:calc(-.35*var(--u))">${d.word}</h1>`
};

/* ============ รูปจริง: แผนที่ไฟล์ต่อสไลด์ (เลข = ลำดับหน้า) ============
   ที่มา: Lorem Picsum (คลังภาพ Unsplash) — ใช้ได้ฟรีเชิงพาณิชย์ ไม่ต้องให้เครดิต
   สลับเป็นรูปตัวเอง: วางไฟล์ใน img/ แล้วแก้ชื่อในลิสต์นี้ ลำดับ = ลำดับช่องรูปในสไลด์ */
const I=n=>`img/px${n}.jpg`;
const mapI=a=>a.map(I);
const SRCN={
  1:[331], 4:[525], 5:[508], 6:[348],
  8:[36], 9:[119],
  10:[26,60,48,180,403,435,366,527,370],
  14:[453], 15:[372], 16:[418,354,296,483], 17:[274,516,322],
  19:[494], 20:[317], 22:[487],
  25:[447], 26:[208], 27:[305,429],
  28:[152,401,439,164,251,253],
  30:[355], 31:[42], 32:[490]
};
const SRC=Object.fromEntries(Object.entries(SRCN).map(([k,v])=>[k,mapI(v)]));

/* ============ mount ============ */
const stage=document.getElementById('stage');
stage.innerHTML=DECK.map((d,i)=>{
  const fn=R[d.t]; if(!fn){console.warn('no renderer',d.t);return '';}
  IMGQ=(SRC[i+1]||[]).slice();
  const html=fn(d);
  if(IMGQ.length)console.warn('slide',i+1,'มีรูปเหลือไม่ได้ใช้',IMGQ.length);
  return `<section class="s ${d.theme}" data-i="${i+1}" data-t="${d.t}">${html}</section>`;
}).join('');

const secs=[...document.querySelectorAll('.s')], hud=document.getElementById('hud');
const pad=n=>String(n).padStart(2,'0');
hud.textContent=`01 / ${pad(secs.length)}`;
let cur=0;
new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
  cur=secs.indexOf(e.target); hud.textContent=`${pad(cur+1)} / ${pad(secs.length)}`;}})},
  {threshold:.55}).observe && secs.forEach(s=>{});
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
  cur=secs.indexOf(e.target); hud.textContent=`${pad(cur+1)} / ${pad(secs.length)}`;}})},{threshold:.55});
secs.forEach(s=>io.observe(s));
const go=i=>{i=Math.max(0,Math.min(secs.length-1,i));secs[i].scrollIntoView({block:'center'})};
const CH=[0,2,6,12,17,23,28];
addEventListener('keydown',e=>{
  if(e.target.isContentEditable)return;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(/^[1-6]$/.test(e.key)){e.preventDefault();go(CH[+e.key])}
});
/* ---------- choreography: แต่ละชนิดสไลด์มีท่าเข้าของตัวเอง ---------- */
const D=(el,ms)=>el.style.setProperty('--d',Math.min(ms,430)+'ms');
const maskRise=(el,delay)=>{                    // ตัวหนังสือเลื่อนขึ้นจากใต้กรอบบัง
  const w=document.createElement('div'); w.className='a-mask';
  el.parentNode.insertBefore(w,el); w.appendChild(el);
  el.classList.add('anim','rise'); D(el,delay);
};

secs.forEach(sec=>{
  const q=sel=>[...sec.querySelectorAll(sel)];

  /* 1) หัวเรื่องมาก่อน */
  q(':scope > .head').forEach(h=>{h.classList.add('anim'); D(h,0)});

  /* 2) ลูกของ .body ไล่ทีละชิ้น (ไม่ใช่เฟดทั้งก้อน) — ใช้ได้ทุกชนิดสไลด์ */
  const kids=q(':scope > .body > *');
  if(kids.length) kids.forEach((k,i)=>{k.classList.add('anim'); D(k,60+i*65)});

  /* 3) บล็อกอื่นที่ไม่ได้อยู่ใน .body (หน้าปก · หน้าคั่น · คำพูดลูกค้า) */
  q(':scope > div:not(.chrome):not(.rule):not(.grow):not(.body)')
    .forEach((b,i)=>{b.classList.add('anim'); D(b,i*55)});

  /* 4) คำใหญ่ / ตัวเลขบท */
  q(':scope > .word').forEach(w=>{w.classList.add('anim'); D(w,110)});
  const num=sec.querySelector('.numeral');
  if(num){num.classList.add('anim','zoom'); D(num,140)}

  /* 5) ประโยคใหญ่: เลื่อนขึ้นจากใต้กรอบบัง */
  q('.stmt, .big').forEach((el,i)=>maskRise(el,120+i*70));

  /* 6) รายการย่อยในแต่ละบล็อก */
  q('.idxline').forEach((el,i)=>{el.classList.add('anim','right'); D(el,140+i*22)});
  q('.rows .row, .tier, .field, .cityrow, .qcell, .svccol, .tcell, .person, .listcol, .barrow')
    .forEach((el,i)=>{el.classList.add('anim'); D(el,150+i*55)});
  q('.chip').forEach((el,i)=>{el.classList.add('anim','zoom'); D(el,220+i*45)});
  q('.body .ph, .gcell .ph').forEach((el,i)=>{el.classList.add('anim','zoom'); D(el,100+i*45)});
  q('.gcell').forEach((el,i)=>{const r=Math.floor(i/3),c=i%3; el.classList.add('anim'); D(el,120+(r+c)*60)});
  q('.barfill').forEach((el,i)=>D(el,220+i*80));
  q('.qr').forEach(el=>{el.classList.add('anim','zoom'); D(el,300)});
});

/* ตัวเลขนับขึ้น (เน้นข้อมูล ไม่ใช่ประดับ) */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const countUp=el=>{
  const raw=el.textContent.trim();
  const m=raw.match(/^([\d.]+)([A-Za-z%]*)$/); if(!m)return;      // ข้ามคำที่ไม่ใช่เลข เช่น MALE
  const end=parseFloat(m[1]), suf=m[2], dec=(m[1].split('.')[1]||'').length;
  const t0=performance.now(), dur=400;
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=(end*e).toFixed(dec)+suf;
    if(k<1)requestAnimationFrame(step); else el.textContent=raw;
  };
  el.textContent=(0).toFixed(dec)+suf; requestAnimationFrame(step);
};

const shown=new WeakSet();
const showSlide=sec=>{
  if(shown.has(sec))return; shown.add(sec);
  sec.classList.add('in');
  sec.querySelectorAll('.anim,.barfill').forEach(e=>e.classList.add('on'));
  if(!RM)setTimeout(()=>sec.querySelectorAll('.stat').forEach(countUp),160);
};

const revealIO=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting)showSlide(e.target);
}),{threshold:.05});
secs.forEach(s=>revealIO.observe(s));
showSlide(secs[0]);
/* กันเหนียว: ถ้า IntersectionObserver ไม่ยิง สไลด์ที่อยู่ในจอต้องโชว์อยู่ดี */
const ensureIn=()=>secs.forEach(s=>{const r=s.getBoundingClientRect();
  if(r.top<innerHeight*.92&&r.bottom>innerHeight*.08)showSlide(s)});
addEventListener('scroll',ensureIn,{passive:true});
addEventListener('resize',ensureIn);
setTimeout(ensureIn,400);
/* กันเหนียวชั้นสอง: 2.5 วิ ยังไม่โชว์ = โชว์เลย ยอมเสียอนิเมชันดีกว่าหน้าว่าง */
setTimeout(()=>secs.forEach(showSlide),2500);

/* แถบความคืบหน้า (transform เท่านั้น) */
const prog=document.createElement('div');prog.className='bar-progress';document.body.appendChild(prog);
const onScroll=()=>{
  const max=document.documentElement.scrollHeight-innerHeight;
  prog.style.transform=`scaleX(${max>0?scrollY/max:0})`;
};
addEventListener('scroll',onScroll,{passive:true});onScroll();

console.log('[deck] slides rendered:',secs.length);
</script>
</body>
</html>
