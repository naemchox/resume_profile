<!-- ===================== VARIANT B =====================
     Prompt (ตัวกลั่น): วิเคราะห์ก่อนว่าจืดเพราะอะไร → อย่าเพิ่งเติม animation
     → ดึงสี/element ที่ "งานจริงมีอยู่แล้วแต่เว็บไม่เคยใช้" จากรูปลูกค้า
     → สร้าง motif ของตัวเอง 1 อย่าง ใช้ซ้ำทั้งหน้า → จุดขายแรงสุดเป็นพระเอก
     → motion เป็นบรรยากาศ ไม่ใช่ fade เหมือนกันทุกอัน

     วินิจฉัย: (1) ครีมทั้งหน้า 7 section จังหวะเดียวกันหมด ไม่มีจุดพัก
               (2) motif ที่ใช้อยู่คือ "ใบไม้/เถาวัลย์" — ยกมาจากเว็บร้านกัญชา
                   ไม่ใช่ภาษาของงานก่อสร้าง
               (3) สีเหล็ก/สีน้ำเงินเมทัลชีท/ส้มงานช่าง มีอยู่ในรูปลูกค้าทุกใบ
                   แต่เว็บไม่เคยหยิบมาใช้
     ==================================================== -->
<style>
:root{
  --steel-950: oklch(.170 .030 250);
  --steel-900: oklch(.225 .040 250);
  --steel-700: oklch(.360 .055 248);
  --sheet-blue:oklch(.545 .105 248);   /* สีหลังคาเมทัลชีทในรูปลูกค้า */
  --safety:    oklch(.700 .175 55);    /* ส้มงานช่าง */
  --safety-hi: oklch(.790 .160 62);
}

/* ---------- B1 · MOTIF: เส้นวัดระยะ (ตลับเมตร) แทนใบไม้ ---------- */
.vine-rule{display:none!important}
.measure{display:block;width:min(360px,70%);margin-inline:auto;overflow:visible}
.measure .m-base,.measure .m-tick{
  fill:none;stroke:var(--safety);stroke-width:2;stroke-linecap:round;
  stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400);
  animation:draw 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.measure .m-tick{animation-delay:.35s;stroke-width:1.6;opacity:.75}
/* หมุดกึ่งกลาง: สามเหลี่ยมชี้ลงมาที่เส้น (อ่านว่า "จุดที่วัดได้") */
.measure .m-pin{fill:var(--safety);stroke:none;opacity:0;transform-origin:160px 16px;
  animation:pinDrop .5s .75s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pinDrop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}

/* ---------- B2 · HERO: หยุดครีม เอาสนามงานจริงขึ้นมา ---------- */
.hero{background:
   radial-gradient(120% 100% at 78% 8%, oklch(.30 .05 250) 0%, transparent 60%),
   linear-gradient(180deg, var(--steel-950), var(--steel-900));
   color:oklch(.97 .01 250)}
.hero::before{opacity:.18!important}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(to right,  oklch(.72 .10 250 / .16) 1px, transparent 1px) 0 0/64px 64px,
    linear-gradient(to bottom, oklch(.72 .10 250 / .16) 1px, transparent 1px) 0 0/64px 64px;
  -webkit-mask-image:radial-gradient(115% 90% at 15% 6%, #000 20%, transparent 74%);
          mask-image:radial-gradient(115% 90% at 15% 6%, #000 20%, transparent 74%)}
.hero > .wrap{position:relative;z-index:2}
.hero h1{color:oklch(.98 .008 250)}
.hero h1 .hl,.hero h1 .accent{color:var(--safety-hi)!important}
.hero p,.hero-note{color:oklch(.84 .02 250)!important}
.hero .eyebrow,.hero .pill,.hero [class*="badge"]:not(.hero-badge){
  color:oklch(.95 .01 250);border-color:oklch(.45 .06 250);background:oklch(.26 .04 250 / .7)}
.hero .hero-media{box-shadow:0 30px 70px oklch(.12 .03 250 / .6)}
.hero-badge{background:var(--safety)!important;color:oklch(.16 .04 60)!important;border:0!important}
/* จุดขายแรงสุด = โทรเลย → ทำให้เป็นพระเอกจริง */
.hero .btn-primary{background:var(--safety)!important;color:oklch(.18 .05 60)!important;
  border-color:transparent!important;box-shadow:0 10px 30px oklch(.70 .175 55 / .38)}
.hero .btn-primary:hover{background:var(--safety-hi)!important}
/* ghost motif ยักษ์: โครงถักเหล็ก วิ่งหลังฮีโร่ */
.truss{position:absolute;right:-4%;bottom:-8%;width:52%;max-width:760px;opacity:.13;z-index:1;
  pointer-events:none;stroke:var(--safety-hi);fill:none;stroke-width:1.5}

/* ---------- B3 · จังหวะหน้า: แทรกแถบเหล็กเข้ม ไม่ให้ครีมรวด 7 ตอน ---------- */
.process{background:linear-gradient(180deg,var(--steel-900),var(--steel-950))!important;
  color:oklch(.96 .01 250);position:relative;overflow:hidden}
.process::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to right,  oklch(.72 .10 250 / .13) 1px, transparent 1px) 0 0/64px 64px,
    linear-gradient(to bottom, oklch(.72 .10 250 / .13) 1px, transparent 1px) 0 0/64px 64px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);
          mask-image:linear-gradient(180deg,#000,transparent 85%)}
.process .wrap{position:relative;z-index:1}
.process h2{color:oklch(.98 .008 250)}
.process .kicker{color:var(--safety-hi)!important}
.process .kicker::before{background:var(--safety)!important}
.process .sec-head p{color:oklch(.82 .02 250)}
.process .step{background:oklch(.26 .04 250 / .55);border:1px solid oklch(.40 .05 250);
  position:relative;overflow:hidden}
.process .step h3{color:oklch(.97 .01 250)}
.process .step p{color:oklch(.80 .02 250)}
.process .step::before{display:none}
/* เลขงานยักษ์แทน bullet — ตัวเลขที่ "มา" ไม่ใช่ตัวเลขที่นั่งอยู่ */
.process .step .num{position:absolute;right:.4rem;top:-.9rem;font-family:var(--font-display);
  font-weight:700;font-size:5.2rem;line-height:1;color:var(--safety);opacity:.16;
  transform:translateY(14px);transition:transform .7s cubic-bezier(.2,.7,.3,1),opacity .7s ease}
.process .step.on .num{transform:none;opacity:.22}

/* ---------- B4 · หัวข้อ section: ป้ายวัดระยะ ไม่ใช่ขีดเดียว ---------- */
.sec-head .kicker::before{background:var(--safety)!important;width:34px;height:2px}
.sec-head .kicker::after{content:"";display:inline-block;width:34px;height:8px;margin-left:.5rem;
  border-left:2px solid var(--safety);border-right:2px solid var(--safety);
  border-bottom:2px solid var(--safety);opacity:.55}

/* ---------- B5 · การ์ดบริการ: ใช้ของ A (สปอตไลต์ตามเมาส์) ตามที่ jek เลือก ---------- */
.svc{position:relative;overflow:hidden}
.svc::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .35s ease;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),
    oklch(.82 .13 75 / .28), transparent 62%)}
.svc:hover::after{opacity:1}
.svc:hover{transform:translateY(-6px)}

/* ---------- B6 · ผลงาน: กรอบวัดงาน ---------- */
.gal-grid > *{position:relative;overflow:hidden}
.gal-grid img{transition:transform .8s cubic-bezier(.2,.7,.3,1)}
.gal-grid > *:hover img{transform:scale(1.06)}
.gal-grid > *::after{content:"";position:absolute;inset:10px;border:1px solid oklch(1 0 0 / .5);
  opacity:0;transition:opacity .35s ease;pointer-events:none}
.gal-grid > *:hover::after{opacity:1}

/* ---------- B6.5 · แก้กล่องทองบนหัวข้อ CTA ----------
   ของเดิม .shimmer-once::after คือแถบไล่สีที่กวาดทับ "กล่อง" ของ h2 ทั้งใบ
   พื้นสว่างมองไม่ออก แต่พอพื้นเป็นสีเหล็กเข้ม มันอ่านเป็นสี่เหลี่ยมทองลอยมา
   (ขอบแข็งเพราะ overflow:hidden ตัดตามกรอบ h2)
   jek ชอบตัวประกาย ไม่เอาขอบเหลี่ยม → เก็บไล่สีเดิมไว้ทั้งดุ้น เติมแค่ "จางก่อนถึงขอบ"
   (เคยลอง blur + mix-blend-mode:screen แล้ว — กลายเป็นก้อนหมอกเบลอ jek บอกห่วย ถอยออก
    เคยลอง background-clip:text ให้วิ่งบนตัวอักษร — หัวข้อหายทั้งบรรทัด ไม่เอาเหมือนกัน) */
/* กล่อง h2 กว้างกว่าตัวหนังสือ ประกายเลยไปโผล่บนพื้นว่างข้างๆ
   → หดกล่องให้เท่าข้อความ + ใช้ blend overlay ให้ติดเฉพาะตรงที่มีตัวอักษรสว่าง */
.finalcta .shimmer-once{overflow:visible;width:fit-content;margin-inline:auto}
.finalcta .shimmer-once::after{
  inset:-8% -3%;
  mix-blend-mode:overlay;
  /* mask 2 ชั้นตัดกัน: กลางคมเหมือนเดิม จางหายก่อนถึงขอบทั้ง 4 ด้าน */
  -webkit-mask-image:
    linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),
    linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),
    linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent 100%);
  mask-composite:intersect}

/* ---------- B7 · CTA ปิดท้าย: ส้มเดียวกับฮีโร่ ---------- */
.finalcta{background:linear-gradient(140deg,var(--steel-950),oklch(.26 .05 250))!important}
.finalcta .btn-primary{background:var(--safety)!important;color:oklch(.18 .05 60)!important;
  border-color:transparent!important}

@media (prefers-reduced-motion:reduce){
  .measure .m-base,.measure .m-tick{animation:none;stroke-dashoffset:0}
  .measure .m-pin{animation:none;opacity:1;transform:none}
  .process .step .num{transform:none;opacity:.22;transition:none}
}
</style>
<script>
(function(){
  /* B1 — สลับ motif: ใบไม้ออก เส้นวัดระยะเข้า (ทุกที่ที่เคยมีใบไม้) */
  document.querySelectorAll('.vine-rule').forEach(function(v){
    var ns='http://www.w3.org/2000/svg';
    var s=document.createElementNS(ns,'svg');
    s.setAttribute('class','measure'); s.setAttribute('viewBox','0 0 320 30');
    s.setAttribute('role','presentation'); s.setAttribute('focusable','false');
    var h='<path class="m-base" style="--len:300" d="M10 20 H310"/>';
    for(var x=10;x<=310;x+=25){
      var big=(x-10)%50===0;
      h+='<path class="m-tick" style="--len:14" d="M'+x+' 20 V'+(big?7:13)+'"/>';
    }
    h+='<path class="m-pin" d="M153 5 H167 L160 16 Z"/>';
    s.innerHTML=h;
    v.replaceWith(s);
  });

  /* B2 — โครงถักเหล็กยักษ์หลังฮีโร่ (motif เดียวกัน ใช้ใหญ่) */
  var hero=document.querySelector('.hero');
  if(hero){
    var t=document.createElementNS('http://www.w3.org/2000/svg','svg');
    t.setAttribute('class','truss'); t.setAttribute('viewBox','0 0 600 220');
    t.setAttribute('aria-hidden','true');
    var p='<path d="M0 200 H600 M0 40 H600"/>';
    for(var i=0;i<600;i+=100){
      p+='<path d="M'+i+' 200 L'+(i+50)+' 40 L'+(i+100)+' 200"/>';
      p+='<path d="M'+(i+50)+' 40 V200"/>';
    }
    t.innerHTML=p;
    hero.insertBefore(t,hero.firstChild);
  }

  /* B5 — สปอตไลต์ตามเมาส์บนการ์ดบริการ (ยกมาจากเวอร์ชัน A) */
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('.svc').forEach(function(c){
      c.addEventListener('pointermove',function(e){
        var r=c.getBoundingClientRect();
        c.style.setProperty('--mx',(e.clientX-r.left)+'px');
        c.style.setProperty('--my',(e.clientY-r.top)+'px');
      });
    });
  }

  /* B3 — เลขขั้นตอน 01–04 + ให้มัน "มาถึง" ตอนเลื่อนเห็น */
  var steps=document.querySelectorAll('.process .step');
  steps.forEach(function(s,i){
    var n=document.createElement('span');
    n.className='num'; n.setAttribute('aria-hidden','true');
    n.textContent='0'+(i+1);
    s.appendChild(n);
  });
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target);} });
    },{threshold:.25});
    steps.forEach(function(s){io.observe(s)});
  } else steps.forEach(function(s){s.classList.add('on')});
})();
</script>
