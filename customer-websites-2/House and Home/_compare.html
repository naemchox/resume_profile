<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House and Home — เทียบ 2 prompt</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 "IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:#0f1115;color:#e8eaee;height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding:.6rem 1rem;
         background:#171a21;border-bottom:1px solid #262b36;flex:0 0 auto}
  header b{font-size:.95rem}
  .sel{display:flex;gap:.35rem}
  button{background:#222735;color:#cfd4de;border:1px solid #333a4a;border-radius:6px;
         padding:.35rem .7rem;cursor:pointer;font:inherit}
  button.on{background:#e8cf6e;border-color:#e8cf6e;color:#1a1206;font-weight:600}
  label{display:flex;align-items:center;gap:.35rem;color:#9aa3b2}
  .panes{flex:1;display:flex;min-height:0}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid #262b36}
  .pane:last-child{border-right:0}
  .cap{padding:.4rem .8rem;background:#12151b;border-bottom:1px solid #262b36;
       font-size:.8rem;letter-spacing:.02em;color:#9aa3b2}
  .cap b{color:#fff}
  .cap.l b{color:#7fb3ff}.cap.r b{color:#ffd479}
  iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body>
<header>
  <b>House and Home — เทียบ prompt</b>
  <div class="sel" id="left"></div>
  <span style="color:#4a5263">|</span>
  <div class="sel" id="right"></div>
  <label><input type="checkbox" id="sync" checked> เลื่อนพร้อมกัน</label>
  <span style="color:#6b7280;font-size:.78rem">
    ปัจจุบัน = ของที่ ship อยู่ · A = เติม motion อย่างเดียว · B = แก้สี/จังหวะ/ลำดับความสำคัญ
  </span>
</header>
<div class="panes">
  <div class="pane"><div class="cap l">ซ้าย: <b id="lname">ปัจจุบัน</b></div><iframe id="lf" src="index.html"></iframe></div>
  <div class="pane"><div class="cap r">ขวา: <b id="rname">B — แก้ต้นเหตุ</b></div><iframe id="rf" src="index-B.html"></iframe></div>
</div>
<script>
var FILES = [
  { n: 'ปัจจุบัน',        f: 'index.html'   },
  { n: 'A — เติม motion', f: 'index-A.html' },
  { n: 'B — แก้ต้นเหตุ',  f: 'index-B.html' }
];
function build(hostId, frameId, nameId, active) {
  var host = document.getElementById(hostId);
  FILES.forEach(function (o) {
    var b = document.createElement('button');
    b.textContent = o.n;
    if (o.f === active) b.className = 'on';
    b.onclick = function () {
      host.querySelectorAll('button').forEach(function (x) { x.className = ''; });
      b.className = 'on';
      document.getElementById(frameId).src = o.f;
      document.getElementById(nameId).textContent = o.n;
    };
    host.appendChild(b);
  });
}
build('left',  'lf', 'lname', 'index.html');
build('right', 'rf', 'rname', 'index-B.html');

/* เลื่อนพร้อมกัน — same-origin เท่านั้น (เปิดผ่าน http:// ไม่ใช่ double-click) */
var lock = false;
function link(a, b) {
  try {
    a.contentWindow.addEventListener('scroll', function () {
      if (lock || !document.getElementById('sync').checked) return;
      lock = true;
      b.contentWindow.scrollTo(0, a.contentWindow.scrollY);
      setTimeout(function () { lock = false; }, 16);
    });
  } catch (e) { /* cross-origin: ปล่อยให้เลื่อนแยกกัน */ }
}
function wire() {
  var l = document.getElementById('lf'), r = document.getElementById('rf');
  link(l, r); link(r, l);
}
document.getElementById('lf').addEventListener('load', wire);
document.getElementById('rf').addEventListener('load', wire);
</script>
</body>
</html>
