<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>og-image source — House and Home</title>
<!--
  แหล่งที่มาของ og-image.jpg (1200×630) — ภาพที่ขึ้นตอนแชร์ลิงก์ใน LINE / Facebook

  วิธีสร้างใหม่ถ้าแบรนด์เปลี่ยน:
    1. เปิดไฟล์นี้ในเบราว์เซอร์
    2. จับภาพเฉพาะกล่อง .og (1200×630)
    3. เซฟทับเป็น og-image.jpg ไว้ข้างๆ index.html

  ตั้งใจแยกออกมาเป็นไฟล์ต่างหาก ไม่รวมใน index.html เพราะเป็นเครื่องมือ
  ไม่ใช่หน้าเว็บ — และ index.html ต้องเป็นไฟล์เดียวจบ
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #333; }
  .og {
    position: absolute; top: 0; left: 0;
    width: 1200px; height: 630px; overflow: hidden;
    background: #0A1520;
    font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
    color: #F5F2EC;
    display: grid; grid-template-columns: 1.08fr .92fr;
    align-items: center; gap: 40px; padding: 64px 68px;
  }
  /* the gold blueprint grid, same motif as the site's deep bands */
  .og::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background-image:
      linear-gradient(to right, rgba(232,207,110,.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(232,207,110,.09) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  /* warm dusk bloom */
  .og::after {
    content: ""; position: absolute; top: -30%; right: -18%;
    width: 70%; height: 160%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(240,224,150,.16), transparent);
  }
  .col { position: relative; z-index: 1; }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .brand svg { width: 52px; height: 52px; flex: none; }
  .brand-name { font-family: "Noto Serif Thai", Georgia, serif; font-weight: 700; font-size: 27px; line-height: 1.1; }
  .brand-tag { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #E8CF6E; margin-top: 3px; }

  h1 {
    font-family: "Noto Serif Thai", Georgia, serif; font-weight: 700;
    font-size: 62px; line-height: 1.22; margin: 0 0 22px;
  }
  h1 .gold {
    background: linear-gradient(96deg, #B98F3C 0%, #F7E9A6 38%, #E8CF6E 58%, #C9A94E 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .svc { font-size: 21px; color: #CFC8BC; line-height: 1.6; margin: 0 0 30px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    border: 1px solid #E8CF6E; border-radius: 10px;
    padding: 9px 17px; font-weight: 600; font-size: 19px; color: #E8CF6E;
  }
  .tel {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(160deg, #F2DE8B, #C9A94E);
    color: #0A1520; font-weight: 600; font-size: 21px;
    border-radius: 10px; padding: 11px 21px;
  }
  .slash {
    width: 13px; height: 13px; flex: none;
    background: linear-gradient(to top right,
      transparent calc(50% - .8px), currentColor calc(50% - .8px),
      currentColor calc(50% + .8px), transparent calc(50% + .8px));
  }
  .bp { position: relative; z-index: 1; }
  .bp svg { width: 100%; height: auto; display: block; overflow: visible;
            filter: drop-shadow(0 0 9px rgba(232,207,110,.42)); }
  .l  { fill: none; stroke: #E8CF6E; stroke-width: 2.1; stroke-linecap: square; }
  .t  { fill: none; stroke: rgba(232,207,110,.42); stroke-width: 1.2; stroke-linecap: square; }
  .f  { fill: rgba(232,207,110,.10); }
  .lb { font-family: "IBM Plex Sans Thai", sans-serif; font-size: 11px;
        letter-spacing: .14em; fill: rgba(232,207,110,.7); text-transform: uppercase; }
</style>
</head>
<body>
<div class="og">
  <div class="col">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="none" stroke="#F5F2EC" stroke-width="1" opacity=".3"/>
        <path d="M7 19 L20 8 L33 19" fill="none" stroke="#E8CF6E" stroke-width="2" stroke-linecap="square"/>
        <path d="M10.5 19 V28 M29.5 19 V28" fill="none" stroke="#E8CF6E" stroke-width="2" stroke-linecap="square"/>
        <path d="M20 5.6 L22.1 8 L20 10.4 L17.9 8 Z" fill="#E8CF6E"/>
        <path d="M7 28.5 V33.5 M33 28.5 V33.5" fill="none" stroke="#F5F2EC" stroke-width=".8" opacity=".5"/>
        <path d="M7 31.5 H33" fill="none" stroke="#F5F2EC" stroke-width=".9" opacity=".65"/>
        <path d="M4.4 34.1 L9.6 28.9 M30.4 34.1 L35.6 28.9" fill="none" stroke="#E8CF6E" stroke-width="1.3" stroke-linecap="square"/>
      </svg>
      <div>
        <div class="brand-name">House and Home</div>
        <div class="brand-tag">Build Your Dream</div>
      </div>
    </div>

    <!-- explicit break: left to wrap, "โดย" orphans onto the first line and
         splits the gold phrase across two lines mid-word -->
    <h1>ควบคุมงาน<br><span class="gold">โดยวิศวกร</span></h1>
    <p class="svc">ออกแบบ · ก่อสร้าง · ต่อเติม · รีโนเวท · ตกแต่งภายใน<br>ครบวงจรตั้งแต่แบบถึงส่งมอบ · ทั่วประเทศไทย</p>

    <div class="row">
      <span class="tel">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        097-936-4619
      </span>
      <span class="pill"><i class="slash"></i>สำรวจหน้างาน + ประเมินราคา ฟรี</span>
    </div>
  </div>

  <div class="bp">
    <svg viewBox="0 0 400 300">
      <g><path class="f" d="M52 136 L200 52 L348 136 Z"/><path class="f" d="M78 136 H322 V232 H78 Z"/></g>
      <path class="t" d="M20 232 H380"/><path class="t" d="M200 20 V60"/><path class="t" d="M40 136 H360"/>
      <path class="l" d="M52 136 L200 52 L348 136"/>
      <path class="l" d="M78 136 V232"/><path class="l" d="M322 136 V232"/><path class="l" d="M78 232 H322"/>
      <path class="t" d="M78 182 H322"/>
      <path class="l" d="M182 232 V186 H218 V232"/>
      <path class="l" d="M100 148 H146 V176 H100 V148"/><path class="l" d="M254 148 H300 V176 H254 V148"/>
      <path class="t" d="M123 148 V176"/><path class="t" d="M277 148 V176"/>
      <path class="l" d="M100 196 H146 V224 H100 V196"/><path class="l" d="M254 196 H300 V224 H254 V196"/>
      <path class="l" d="M280 92 V66 H300 V103"/>
      <path class="t" d="M60 258 H340 M60 252 V264 M340 252 V264"/>
      <text class="lb" x="200" y="279" text-anchor="middle">แบบก่อสร้าง + 3D</text>
      <path class="t" d="M366 52 V232 M360 52 H372 M360 232 H372"/>
      <circle cx="200" cy="52" r="3.4" fill="#E8CF6E"/>
    </svg>
  </div>
</div>
</body>
</html>
