<!-- ===================== VARIANT A =====================
     Prompt: "มันโคตรดู AI เลย" — ตีความตรงตัวแบบเดียวกับ A ของช่างเจมส์
     = เติมชั้นตกแต่ง + motion ให้หน้ามีชีวิต
       **ไม่แตะ palette · ไม่แตะ motif · ไม่แตะโครงหน้า**
     ครีม/ทอง/navy เดิม · บลูพรินต์ลายเส้นเดิม · การ์ด 9 ใบเท่าเดิม
     ==================================================== -->
<style>
/* ---------- A1 · HERO: บ่อแสงอุ่นลอยช้าๆ หลังลายเส้น ----------
   .hero::before ถูกใช้เป็นกริดกระดาษอยู่แล้ว (index.html:1252) เลยใช้ ::after */
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.pool{position:absolute;border-radius:50%;filter:blur(72px);pointer-events:none;z-index:0;
  opacity:.5;will-change:transform}
.pool.p1{width:420px;height:420px;left:-6%;top:-14%;
  background:radial-gradient(circle,oklch(.86 .12 95/.34),transparent 66%);
  animation:drift1 22s ease-in-out infinite alternate}
.pool.p2{width:340px;height:340px;right:4%;bottom:-16%;
  background:radial-gradient(circle,oklch(.55 .07 250/.22),transparent 66%);
  animation:drift2 27s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(70px,44px,0) scale(1.12)}}
@keyframes drift2{to{transform:translate3d(-56px,-38px,0) scale(1.08)}}
.hero > .wrap{position:relative;z-index:2}

/* ---------- A2 · เม็ดฝุ่นในแสง: มีอยู่แล้วในหัว แต่มองไม่เห็น ----------
   ลายเส้นบลูพรินต์วาดเสร็จแล้วหน้าก็นิ่งสนิท ใส่เม็ดลอยช้าๆ ให้มีลมหายใจ */
.mote{position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--c-action);opacity:.22;pointer-events:none;z-index:1;
  animation:rise var(--t,17s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes rise{
  0%{transform:translateY(0) translateX(0);opacity:0}
  12%{opacity:.28}
  88%{opacity:.28}
  100%{transform:translateY(-190px) translateX(var(--dx,18px));opacity:0}}

/* ---------- A3 · การ์ดบริการ: สปอตไลต์ตามเมาส์ ----------
   การ์ด 9 ใบเหมือนกันหมด — สปอตไลต์ทำให้ "ใบที่กำลังอ่าน" ต่างจากอีก 8 ใบ */
.card{position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .35s ease;
  background:radial-gradient(230px circle at var(--mx,50%) var(--my,50%),
    oklch(.86 .12 95/.20),transparent 62%)}
.card:hover::after{opacity:1}
.card:hover{transform:translateY(-5px)}

/* ---------- A4 · ICO-TILE: ทองกวาดผ่านตอน hover ---------- */
.ico-tile{position:relative;overflow:hidden}
.ico-tile::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,oklch(1 0 0/.42) 50%,transparent 62%);
  transform:translateX(-130%);transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.card:hover .ico-tile::after{transform:translateX(130%)}

/* ---------- A5 · STAT: เส้นทองวาดตัวเองใต้ตัวเลข ---------- */
.stat{position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:50%;bottom:0;height:3px;width:0;
  background:var(--c-action);transform:translateX(-50%);
  transition:width .9s cubic-bezier(.2,.7,.3,1) var(--sd,0s)}
.stats.in .stat::after{width:46%}
.stats .stat:nth-child(2){--sd:.10s}
.stats .stat:nth-child(3){--sd:.20s}
.stats .stat:nth-child(4){--sd:.30s}

/* ---------- A6 · ปุ่มหลัก: ประกายกวาดรอบละครั้ง ---------- */
.btn-primary{position:relative;overflow:hidden}
.btn-primary::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,oklch(1 0 0/.30) 50%,transparent 60%);
  transform:translateX(-130%);animation:sweep 5.5s ease-in-out 1.4s infinite}
@keyframes sweep{0%{transform:translateX(-130%)}18%,100%{transform:translateX(130%)}}

/* ---------- A7 · รูป: กรอบวัดงาน + ซูมช้า ---------- */
.shot-frame,.type-shot{position:relative;overflow:hidden}
.shot img,.type-shot img{transition:transform .85s cubic-bezier(.2,.7,.3,1)}
.shot:hover img,.type-card:hover .type-shot img{transform:scale(1.055)}
.shot-frame::after,.type-shot::after{content:"";position:absolute;inset:10px;
  border:1px solid oklch(1 0 0/.55);opacity:0;transition:opacity .35s ease;pointer-events:none}
.shot:hover .shot-frame::after,.type-card:hover .type-shot::after{opacity:1}

/* ---------- A8 · หัวข้อ section: ทองกวาดครั้งเดียวตอนเลื่อนถึง ---------- */
.sec-title{position:relative}
.sec-title.lit{
  background-image:linear-gradient(100deg,
    currentColor 0 42%, var(--c-action) 50%, currentColor 58% 100%);
  background-size:280% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:titleSweep 1.15s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes titleSweep{to{background-position:0 0}}

/* ---------- A9 · เคารพ reduced-motion ---------- */
@media (prefers-reduced-motion: reduce){
  .pool,.mote,.btn-primary::after{animation:none!important}
  .mote{display:none}
  .sec-title.lit{animation:none;-webkit-text-fill-color:currentColor;background:none}
  .stats.in .stat::after{transition:none;width:46%}
}
</style>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* A1/A2 — บ่อแสง + เม็ดฝุ่นในฮีโร่ (สร้างด้วย JS จะได้ไม่ต้องแตะ markup เดิม) */
  var hero = document.querySelector('.hero');
  if (hero) {
    ['p1','p2'].forEach(function(c){
      var d = document.createElement('div'); d.className = 'pool ' + c; hero.appendChild(d);
    });
    if (!reduce) for (var i = 0; i < 9; i++) {
      var m = document.createElement('div'); m.className = 'mote';
      m.style.left = (8 + Math.round((i * 97) % 84)) + '%';
      m.style.top  = (55 + (i % 4) * 11) + '%';
      m.style.setProperty('--t',  (14 + (i % 5) * 2.6) + 's');
      m.style.setProperty('--dl', (i * 1.7) + 's');
      m.style.setProperty('--dx', ((i % 2 ? 1 : -1) * (10 + i * 3)) + 'px');
      hero.appendChild(m);
    }
  }

  /* A3 — สปอตไลต์ตามเมาส์ (pointer, ไม่ใช้ mousemove ทั้งหน้า) */
  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('pointermove', function(e){
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', ((e.clientX - r.left) / r.width  * 100) + '%');
      card.style.setProperty('--my', ((e.clientY - r.top ) / r.height * 100) + '%');
    });
  });

  /* A5/A8 — ติดคลาสตอนเลื่อนถึง ครั้งเดียว */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){
      es.forEach(function(en){
        if (!en.isIntersecting) return;
        en.target.classList.add(en.target.classList.contains('stats') ? 'in' : 'lit');
        io.unobserve(en.target);
      });
    }, { threshold: .35 });
    document.querySelectorAll('.stats, .sec-title').forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll('.stats').forEach(function(el){ el.classList.add('in'); });
  }
})();
</script>
