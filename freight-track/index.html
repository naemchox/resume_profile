<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script src="js/theme-init.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ · FreightTrack</title>
<meta name="description" content="เลือกสิ่งที่ต้องการทำ — พนักงานออฟฟิศ คนขับรถ ผู้ช่วยคนขับ หรือติดตามการจัดส่ง">
<meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1c1b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<style>
/* ============================================================
   หน้าแรก — เลือกสิ่งที่ต้องการทำ · จัดวางแบบหน้า Apple Store (apple.com/th/store)
   หัวเรื่องใหญ่ชิดซ้าย + คำโปรยชิดขวา · หัวข้อกลุ่มตัวหนา · การ์ดสูงแบบการ์ดสินค้า · การ์ดกว้างแบบแบนเนอร์
   ทั้งการ์ดคือปุ่มเดียว · ไอคอนสีบอกบทบาท · ลูกศรบอกว่ากดได้
   สีพื้น/ตัวหนังสือมาจาก --lx-* (ตั้งใน css/apple.css) · สีด้านล่างเป็นของหน้านี้เท่านั้น
   ============================================================ */
:root{
  --ix-card:#ffffff;
  --ix-shadow:2px 4px 12px rgba(0,0,0,.08);
  --ix-shadow-hover:2px 4px 16px rgba(0,0,0,.16);
  --ix-sub:#6f6964;
  --ix-chev-bg:#f4f3f1;
  --ix-chev:#2b2725;
  --ix-accent:#E8781A;
  --ix-wrap:1200px;
  --ix-gut:clamp(16px,4vw,40px);
}
:root[data-theme="dark"]{
  --ix-card:#2b2725;
  --ix-shadow:0 0 0 1px rgba(255,255,255,.07);
  --ix-shadow-hover:0 0 0 1px rgba(255,255,255,.16), 0 8px 28px rgba(0,0,0,.6);
  --ix-sub:#aba49e;
  --ix-chev-bg:#37332f;
  --ix-chev:#f4f3f1;
  --ix-accent:#E8781A;
}

body.lx{background:var(--lx-bg);color:var(--lx-ink);min-height:100vh;overflow-x:hidden;
  transition:background-color .25s,color .25s}
/* ซ่อนไว้จนรู้ว่าไม่ได้ล็อกอินค้าง (ล็อกอินค้าง = พาไปหน้าของตัวเองเลย ไม่ต้องเห็นหน้านี้) */
body.checking .ix-page{visibility:hidden}

/* ---------- แถบหัว (บาง แก้วโปร่ง ติดด้านบน แบบ apple.com) ---------- */
.lx-bar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--lx-rule)}
.lx-bar-in{max-width:var(--ix-wrap);margin:0 auto;padding:8px var(--ix-gut);display:flex;align-items:center;gap:18px}
.lx-brand{display:flex;align-items:center;gap:12px;color:var(--lx-ink);text-decoration:none}
/* โลโก้แบบมินิมอล: ตัวอักษร FT สีขาวบนกล่องสีส้มมุมมน */
.lx-logo{display:grid;place-items:center;height:34px;padding:0 10px;border-radius:9px;flex:none;
  background:#E8781A;color:#fff;font-size:15px;font-weight:700;letter-spacing:.06em;line-height:1}
.lx-name{font-size:15px;font-weight:500}
.lx-switch{margin-left:auto;position:relative;width:52px;height:30px;border-radius:99px;border:0;padding:0;cursor:pointer;
  transition:background .25s;flex:none}
.lx-switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .25s cubic-bezier(.3,.7,.2,1)}
.lx-switch svg{position:absolute;top:7px;width:16px;height:16px;z-index:1;opacity:0;transition:opacity .2s}
.lx-switch .moon{left:7px}
:root[data-theme="dark"] .lx-switch::after{background:transparent;box-shadow:none}
:root[data-theme="dark"] .lx-switch .moon{opacity:1}

/* ---------- หัวเรื่อง: ซ้ายชื่อหน้าใหญ่ · ขวาคำโปรย (แบบ "Store / The best way to buy…") ---------- */
.ix-page{max-width:var(--ix-wrap);margin:0 auto;padding:clamp(40px,8vh,88px) var(--ix-gut) 96px}
.ix-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 48px;flex-wrap:wrap}
.ix-eyebrow{margin:0 0 6px;font-size:17px;font-weight:600;color:var(--ix-accent)}
.ix-title{margin:0;font-size:clamp(40px,6vw,72px);font-weight:700;line-height:1.15;letter-spacing:-.025em;color:var(--lx-ink)}
.ix-sub{margin:0 0 .45em;max-width:14em;font-size:clamp(21px,2.4vw,28px);font-weight:600;line-height:1.3;
  letter-spacing:-.01em;color:var(--ix-sub);text-align:right}

/* ---------- หัวข้อกลุ่ม (แบบ "The latest.") ---------- */
.ix-sec{margin-top:clamp(44px,7vh,72px);padding:0}  /* padding:0 — กัน section{padding} จาก base.css */
.ix-sec-t{margin:0 0 22px;font-size:clamp(24px,2.6vw,32px);font-weight:700;line-height:1.25;letter-spacing:-.015em;color:var(--lx-ink)}

/* ---------- การ์ด: ทั้งใบกดได้ ---------- */
.ix-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0;padding:0;list-style:none}
.ix-choice{position:relative;display:grid;width:100%;height:100%;
  grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;
  grid-template-areas:"tx tx" ". ." "ic go";
  gap:0 16px;min-height:clamp(270px,28vw,340px);padding:30px 30px 28px;
  border:0;border-radius:18px;background:var(--ix-card);box-shadow:var(--ix-shadow);color:var(--lx-ink);
  font:inherit;text-align:left;text-decoration:none;cursor:pointer;
  transition:transform .3s cubic-bezier(0,0,.5,1), box-shadow .3s cubic-bezier(0,0,.5,1)}
.ix-choice:hover{transform:scale(1.015);box-shadow:var(--ix-shadow-hover);color:var(--lx-ink)}
.ix-choice:active{transform:scale(.99)}
.ix-choice:disabled{cursor:progress;opacity:.7;transform:none}
.ix-choice:focus-visible{outline:3px solid var(--ix-accent);outline-offset:4px}

.ix-tx{grid-area:tx;display:flex;flex-direction:column;gap:8px;min-width:0}
.ix-t{font-size:clamp(24px,2.4vw,30px);font-weight:700;line-height:1.25;letter-spacing:-.015em}
.ix-d{font-size:17px;line-height:1.5;color:var(--ix-sub)}

/* ไอคอนใหญ่แทนรูปสินค้า */
.ix-ic{grid-area:ic;align-self:end;display:grid;place-items:center;width:clamp(84px,9vw,112px);aspect-ratio:1;
  border-radius:26%;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 70%);
  box-shadow:0 10px 24px -12px var(--c)}
.ix-ic svg{width:52%;height:52%}

.ix-go{grid-area:go;align-self:end;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;
  background:var(--ix-chev-bg);color:var(--ix-chev);transition:background-color .2s,color .2s}
.ix-go svg{width:18px;height:18px}
.ix-choice:hover .ix-go{background:var(--ix-accent);color:#fff}

/* การ์ดกว้างแบบแบนเนอร์ (ลูกค้า) — ข้อความซ้าย ไอคอนขวา */
.ix-wide{min-height:0;grid-template-columns:1fr auto auto;grid-template-rows:auto;grid-template-areas:"tx ic go";
  align-items:center;gap:0 28px;padding:36px 40px}
.ix-wide .ix-ic,.ix-wide .ix-go{align-self:center}

/* สถานะกำลังเข้าสู่ระบบ */
.ix-spin{display:none;width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;
  animation:ix-spin .8s linear infinite}
.ix-choice[aria-busy="true"] .ix-spin{display:block}
.ix-choice[aria-busy="true"] .ix-go svg{display:none}
@keyframes ix-spin{to{transform:rotate(360deg)}}

/* ลิงก์เชิญ / ข้อความผิดพลาด */
.lx-note{margin:32px 0 0;padding:18px 22px;border-radius:18px;text-align:left;font-size:17px;line-height:1.6;
  background:var(--ix-card);box-shadow:var(--ix-shadow);color:var(--lx-ink)}
.lx-note[data-tone="bad"]{box-shadow:inset 4px 0 0 #E8781A, var(--ix-shadow)}
.lx-note[hidden],.lx-msg:empty{display:none}
body.has-invite [data-side="office"]{box-shadow:0 0 0 3px var(--ix-accent), var(--ix-shadow-hover)}

/* แท็บเล็ต: การ์ดพนักงานเรียงลงเป็นแถวแนวนอน */
@media (max-width:900px){
  .ix-grid{grid-template-columns:1fr;gap:14px}
  .ix-choice,.ix-wide{min-height:0;grid-template-columns:auto 1fr auto;grid-template-rows:auto;grid-template-areas:"ic tx go";
    align-items:center;gap:0 20px;padding:24px}
  .ix-choice .ix-ic,.ix-choice .ix-go{align-self:center}
  .ix-ic{width:72px;border-radius:22%}
}
/* มือถือ: หัวเรื่องซ้อนกัน คำโปรยชิดซ้าย */
@media (max-width:640px){
  .ix-head{display:block}
  .ix-sub{margin:12px 0 0;text-align:left;max-width:none;font-size:20px}
  .ix-choice,.ix-wide{gap:0 16px;padding:18px 16px 18px 18px;border-radius:18px}
  .ix-ic{width:58px}
  .ix-t{font-size:21px}
  .ix-d{font-size:16px}
  .ix-go{width:36px;height:36px}
  .ix-sec-t{margin-bottom:14px}
}
@media (max-width:380px){ .lx-name{display:none} }
@media (prefers-reduced-motion:reduce){ .ix-choice,.lx-switch::after{transition:none} .ix-spin{animation-duration:2s} }
</style>
<link rel="stylesheet" href="css/apple.css">
</head>
<body class="lx">

<header class="lx-bar">
  <div class="lx-bar-in">
    <a class="lx-brand" href="index.html" aria-label="FT ขนส่งตัวอย่าง — หน้าแรก">
      <span class="lx-logo" aria-hidden="true">FT</span>
      <span class="lx-name">ขนส่งตัวอย่าง</span>
    </a>
    <button class="lx-switch" type="button" data-theme-toggle title="สลับโหมดสว่าง / มืด" aria-label="สลับโหมดสว่าง / มืด">
      <svg class="moon" viewBox="0 0 24 24" fill="#f3ead8" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
    </button>
  </div>
</header>

<main class="ix-page">
  <div class="ix-head">
    <div>
      <p class="ix-eyebrow">FreightTrack</p>
      <h1 class="ix-title">ยินดีต้อนรับ</h1>
    </div>
    <p class="ix-sub">เลือกเมนูที่ต้องการใช้งาน</p>
  </div>

  <section class="ix-sec" aria-labelledby="ix-customer">
    <h2 class="ix-sec-t" id="ix-customer">สำหรับลูกค้า</h2>
    <a class="ix-choice ix-wide" href="track.html">
      <span class="ix-ic" style="--c:#C76E00" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
      </span>
      <span class="ix-tx">
        <span class="ix-t">ติดตามการจัดส่ง</span>
        <span class="ix-d">ค้นหาด้วยเลข Invoice หรือเลข Delivery</span>
      </span>
      <span class="ix-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></span>
    </a>
  </section>

</main>

</body>
</html>
