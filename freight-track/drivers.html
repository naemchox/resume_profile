<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<script src="js/theme-init.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ข้อมูลคนขับ · FreightTrack</title>
<meta name="description" content="ทะเบียนคนขับและรถของ FT เพิ่ม แก้ไข ปิดใช้งาน และดูภาระงานของคนขับแต่ละคน">
<meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1c1b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/apple.css">
<!-- office.css โหลดหลัง apple.css — โทนเดียวกับหน้าแรก (index.html) และหน้าคนขับ -->
<link rel="stylesheet" href="css/office.css">
</head>
<body class="ofc ofc-drivers">
<!-- โครงหน้ารอโหลด — ขึ้นทันทีจาก HTML/CSS ก่อน JavaScript ทำงาน แล้วสลับเป็นหน้าจริงตอนวาดเสร็จ (ui.js → shell) -->
<div class="skel" aria-hidden="true">
  <div class="skel-bar"></div>
  <div class="skel-page">
    <i class="sk sk-eyebrow"></i>
    <i class="sk sk-title"></i>
    <i class="sk sk-line"></i>
    <div class="skel-kpis"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></div>
    <div class="skel-card">
      <i class="sk sk-h"></i>
      <i class="sk sk-row"></i><i class="sk sk-row"></i><i class="sk sk-row"></i><i class="sk sk-row"></i><i class="sk sk-row"></i>
    </div>
  </div>
</div>
<main class="page">
<div class="wrap-wide">

  <div class="page-head">
    <div>
      <p class="eyebrow eyebrow-accent">ข้อมูลหลัก · ทีมคลัง</p>
      <h1 class="page-title" style="margin-top:6px">ทะเบียนคนขับและรถ</h1>
      <p class="muted small" style="margin-top:4px">เพิ่มคนขับ · แก้เบอร์โทร / ทะเบียน · ปิดคนที่ลาออก</p>
    </div>
    <div class="row gap-10 no-print">
      <a class="btn btn-ghost btn-sm" href="ops.html">← กลับกระดานงาน</a>
      <button class="btn btn-quiet btn-sm" id="sheetSetup" title="ตั้งลิงก์สำหรับเขียนข้อมูลกลับขึ้น Google Sheet">เชื่อม Google Sheet</button>
      <button class="btn btn-ghost btn-sm" id="refreshSheet" title="ดึงชื่อ ทะเบียน และเบอร์โทรล่าสุดจาก Google Sheet">↻ รีเฟรชจากชีต</button>
      <button class="btn btn-accent btn-sm" id="addDriver">+ เพิ่มคนขับ</button>
    </div>
  </div>

  <div id="demoBarSlot" style="margin-bottom:18px"></div>
  <div id="sheetBar" class="panel no-print" style="margin-bottom:18px;display:none"></div>

  <div class="grid g4" id="kpis" style="margin-bottom:20px"></div>

  <div class="card" style="padding:14px 16px;margin-bottom:16px">
    <div class="row between wraps gap-12" style="align-items:flex-end">
      <div class="tabs grow" id="tabs" role="tablist"></div>
      <div class="row gap-8">
        <input class="input" id="q" placeholder="🔍 ค้นหา ชื่อ · ทะเบียน · เบอร์โทร" style="width:min(340px,60vw)" autocomplete="off">
      </div>
    </div>
  </div>
  <!-- แยกสองกล่อง: รถประจำ ข้างบน · รถนอก (รวมคนขับภายนอกแบบลิงก์) ข้างล่าง เว้นช่องให้ดูง่าย — js/drivers.js paint() -->
  <div id="fleetTables"></div>

  <p class="of-hint">
    ปิดใช้งาน = จ่ายงาน/ล็อกอินไม่ได้ แต่ประวัติยังอยู่ครบ · ลบถาวรได้เฉพาะคนที่ไม่เคยมีใบงาน
  </p>
</div>
</main>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/drivers.js"></script>
</body>
</html>
