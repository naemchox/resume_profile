<!doctype html>
<!-- Source for og.png. The share image is regenerated from this file rather than edited by hand:
     scripts/make-og.js loads it at 1200x630 and captures it. Keep them in step — an og.png that
     disagrees with the site is the version most people see, because it is what a link preview shows. -->
<html lang="en"><head><meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{display:flex;font-family:-apple-system,BlinkMacSystemFont,"Sarabun",system-ui,sans-serif;
    color:#eef0f3;background:#0b0d11;-webkit-font-smoothing:antialiased}
  .left{width:470px;padding:74px 0 0 74px;background:#0b0d11}
  .logo{width:88px;height:88px;border-radius:22px;background:linear-gradient(#232833,#0e1015);
    border:1px solid rgba(255,255,255,.08);position:relative;margin-bottom:34px}
  .logo svg{position:absolute;inset:0}
  h1{font-size:66px;line-height:1;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-size:27px;line-height:1.3;letter-spacing:-.01em;margin-bottom:14px}
  p{font-size:17px;line-height:1.6;color:#a4abb6;max-width:330px}
  .chips{display:flex;gap:8px;margin-top:30px}
  .chip{font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;
    border:1px solid #242832;color:#a4abb6}
  .chip.cy{border-color:rgba(82,196,236,.5);color:#8fd8f4}
  .right{flex:1;position:relative;background:
    radial-gradient(600px 380px at 30% 25%, rgba(224,160,90,.30), transparent 65%),
    radial-gradient(520px 420px at 85% 30%, rgba(70,110,220,.34), transparent 62%),
    radial-gradient(700px 500px at 60% 100%, rgba(150,80,190,.30), transparent 60%),
    #1a1d26}
  .boxed{position:absolute;top:88px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:25px;font-weight:600;padding:9px 16px;border:2px dashed rgba(140,215,245,.85);
    border-radius:10px;background:rgba(10,12,16,.30)}
  .stack{position:absolute;left:198px;bottom:150px;width:340px}
  .card{background:rgba(20,23,29,.94);border:1px solid rgba(255,255,255,.10);border-radius:14px;
    padding:16px 18px;margin-bottom:12px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .card .th{font-family:"Sarabun",system-ui,sans-serif;font-size:20px;font-weight:600;margin-bottom:5px}
  .card .en{font-size:14px;color:#8b919c}
  .pill{display:flex;align-items:center;gap:10px;background:rgba(20,23,29,.94);
    border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:11px 18px;
    box-shadow:0 14px 32px rgba(0,0,0,.4);font-size:15px;font-weight:650}
  .dot{width:9px;height:9px;border-radius:50%;background:#6b7280}
  .key{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#8b919c}
</style></head>
<body>
  <div class="left">
    <div class="logo">
      <svg viewBox="0 0 512 512">
        <text x="256" y="330" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="230" font-weight="800" fill="#dfe6ee">ก</text>
        <g fill="none" stroke="#8fd8f4" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M118 178 L118 118 L178 118"/><path d="M334 118 L394 118 L394 178"/>
          <path d="M394 334 L394 394 L334 394"/><path d="M178 394 L118 394 L118 334"/></g>
      </svg>
    </div>
    <h1>Gloss</h1>
    <h2>Read any English<br />on your screen, in Thai.</h2>
    <p>Hold two keys, sweep over the words, and the Thai appears where they sit.</p>
    <div class="chips"><span class="chip cy">฿149 once</span><span class="chip">Windows</span></div>
  </div>
  <div class="right">
    <div class="boxed">Something is behind that door.</div>
    <div class="stack">
      <div class="card">
        <p class="th">มีบางอย่างอยู่หลังประตูบานนั้น</p>
        <p class="en">Something is behind that door.</p>
      </div>
      <div class="pill"><span class="dot"></span><span>EN → TH</span><span class="key">⌃⌥</span></div>
    </div>
  </div>
</body></html>
