function renderTour(){
  const steps=tourSteps(), s=steps[_tourI];
  /* give the fade-out one frame to paint before rebuilding the screen underneath it */
  if(s.view && s.view!==_tourView){
    const root0=document.getElementById('tourRoot');
    if(root0 && !root0.classList.contains('tour-swap')){
      root0.classList.add('tour-swap');
      requestAnimationFrame(()=>{ if(_tourOn) renderTour(); });
      return;
    }
  }
  if(s.view) _tourGo(s.view);                    // walk to the right screen first (Ijek-style multi-page tour)
  // Build the overlay ONCE and mutate it per step. Re-creating it every step killed the hole's CSS glide,
  // replayed the card's pop animation and re-decoded the emoji → that's what read as stutter.
  let root=document.getElementById('tourRoot');
  if(!root){ root=document.createElement('div'); root.id='tourRoot';
    // dim the screen in THIS frame — otherwise it sits undimmed through the scroll + 2 rAFs below and reads as lag
    root.innerHTML='<div class="tour-catch" onclick="tourNav(1)"></div>'
      +'<div class="tour-hole full" id="tourHole" style="top:0;left:0;width:0;height:0"></div>'
      +'<div class="tour-card centered" id="tourCard" style="visibility:hidden"><div class="tour-arrow" id="tourArrow" style="display:none"></div><div class="tour-in" id="tourIn"></div></div>';
    document.body.appendChild(root);
    steps.forEach(x=>{ if(x.img){ const im=new Image(); im.src=x.img; } });   // warm the glyphs so later steps don't pop in
  }
  const el=s.anchor?document.querySelector('[data-tour="'+s.anchor+'"]'):null;
  const paint=()=>{
    if(!_tourOn) return;
    const el2=s.anchor?document.querySelector('[data-tour="'+s.anchor+'"]'):null;   // re-query after nav/scroll
    const r0=el2?el2.getBoundingClientRect():null;
    const r=(r0 && r0.width>0 && r0.height>0)?r0:null;   // hidden/zero-size anchor → centered card, no broken hole
    const PAD=8, vw=innerWidth, vh=innerHeight, cw=Math.min(340,vw-24), chEst=s.workflow?340:210;
    const hole=r?`top:${(r.top-PAD).toFixed(0)}px;left:${(r.left-PAD).toFixed(0)}px;width:${(r.width+PAD*2).toFixed(0)}px;height:${(r.height+PAD*2).toFixed(0)}px`:`top:${(vh/2).toFixed(0)}px;left:${(vw/2).toFixed(0)}px;width:0;height:0`;
    // coach-mark card: float right next to the spotlighted element (below if room, else above); centered if no anchor
    let cl, ct, arrow='';
    if(!r){ cl=(vw-cw)/2; ct=Math.max(16,(vh-chEst)/2); }
    else {
      cl=Math.max(12, Math.min(vw-cw-12, r.left+r.width/2 - cw/2));
      if(r.bottom+16+chEst < vh-8){ ct=r.bottom+16; arrow='up'; } else { ct=Math.max(12, r.top-16-chEst); arrow='down'; }
    }
    const ax=r?Math.max(18,Math.min(cw-18, r.left+r.width/2 - cl)).toFixed(0):0;
    const dots=steps.map((_,k)=>'<span class="'+(k===_tourI?'on':'')+'"></span>').join('');
    const last=_tourI>=steps.length-1;
    const holeEl=document.getElementById('tourHole'), card=document.getElementById('tourCard'),
          arw=document.getElementById('tourArrow'), inner=document.getElementById('tourIn');
    if(!holeEl||!card||!arw||!inner) return;
    // gliding across a SCREEN change looks wrong (the backdrop under it changed too) → snap for those steps
    const jump=(s.view!==_tourView); _tourView=s.view;
    holeEl.className='tour-hole'+(r?'':' full'); holeEl.style.cssText=hole;   // position only → the CSS transition glides it
    // across a screen change position must not glide (the backdrop changed) but opacity still should,
    // so kill the positional transitions only and leave the fade alone
    if(jump){ holeEl.style.transition='opacity .18s ease'; card.style.transition='opacity .18s ease';
      requestAnimationFrame(()=>{ holeEl.style.transition=''; card.style.transition=''; }); }
    const rootEl=document.getElementById('tourRoot'); if(rootEl) rootEl.classList.remove('tour-swap');
    card.className='tour-card'+(r?'':' centered');
    card.style.visibility=''; card.style.left=cl.toFixed(0)+'px'; card.style.top=ct.toFixed(0)+'px'; card.style.width=cw+'px';
    if(arrow){ arw.className='tour-arrow '+arrow; arw.style.left=ax+'px'; arw.style.display=''; } else arw.style.display='none';
    inner.innerHTML='<div class="tour-glyph">'+(s.img?'<img src="'+s.img+'" alt="'+s.glyph+'">':s.glyph)+'</div><h2>'+s.title+'</h2><p>'+s.body+'</p>'+(s.workflow?tourWorkflowHTML():'')
      +'<div class="tour-dots">'+dots+'</div><div class="tour-nav">'
      +(_tourI>0?'<button onclick="event.stopPropagation();tourNav(-1)">← '+L('ย้อน','Back')+'</button>':'<button onclick="event.stopPropagation();endTour()">'+L('ข้าม','Skip')+'</button>')
      +'<button class="prim" onclick="event.stopPropagation();tourNav(1)">'+(last?L('เริ่มเลย!','Start!'):L('ถัดไป','Next')+' →')+'</button></div>';
    inner.style.animation='none'; void inner.offsetWidth; inner.style.animation='';   // restart the content fade per step
  };
  if(!s.anchor){ paint(); return; }        // nothing to measure → draw now instead of waiting two frames
  // only scroll when the anchor isn't already comfortably in view — a needless jump is the jerk you see on the mock screen
  if(el){ const b=el.getBoundingClientRect();
    if(b.top<64 || b.bottom>innerHeight-64) el.scrollIntoView({block:'center'}); }
  requestAnimationFrame(()=>requestAnimationFrame(paint));
}
function vocabLearned(){
  const total=(window.VOCAB_BANK&&window.VOCAB_BANK.meta&&window.VOCAB_BANK.meta.total)||1000;
  let known=0;
  try{
    const p=JSON.parse(localStorage.getItem('toeic-vocab-srs-v2')||'null');
    if(p) known=Object.values(p).filter(c=>c&&(c.reps||0)>=1).length;   // graduated at least once = learned
    else { const old=JSON.parse(localStorage.getItem('toeic-vocab-progress-v1')||'{}'); known=Object.values(old).filter(v=>v==='known').length; }
  }catch(e){}
  return {known,total};
}
function wordOfDay(){
  const words=(window.VOCAB_BANK&&window.VOCAB_BANK.words)||[];
  if(!words.length) return null;
  const seed=Math.floor(Date.now()/86400000);
  return words[seed%words.length];
}

function weakestCat(){

/* One-line pace verdict at the top of the dashboard: turns "goal − estimate" into the weekly rate
   the exam date actually demands — an honest on-pace read, not a vague "keep going". Reuses the same
   prediction + ±band the rest of the app trusts; stays silent until there's enough data to predict. */
function paceLineHTML(){
  const pred=predictedScore(); if(pred==null) return "";            // welcome-stats already prompts "do 8+ Q"
  const goal=goalScore(), band=predConf()[2], gap=goal-pred, d=examDaysLeft();
  const head=`🎯 ${L("เป้า","Goal")} <b>${goal}</b> · ${L("ตอนนี้","Now")} <b>~${pred}</b> <span class="pl-band">±${band}</span>`;
  let verdict, cls;
  if(gap<=0){ cls='ok'; verdict=`✅ ${L("ถึงเป้าแล้ว — รักษาฟอร์มไว้จนวันสอบ","On target — hold your form to test day")}`; }
  else if(d===null){ cls=''; verdict=`${L("ยังขาด","Short by")} <b>${gap}</b> · ${L("ตั้งวันสอบเพื่อดู pace ที่ต้องทำ","set a test date to see the pace you need")}`; }
  else if(d<=0){ cls=''; verdict=`${L("เลยวันสอบแล้ว — ตั้งวันใหม่","Test date passed — set a new date")}`; }
  else {
    const perWeek=Math.max(1,Math.ceil(gap/Math.max(1,d/7)));
    cls = perWeek<=25?'ok':perWeek<=50?'warn':'bad';
    const tag = perWeek<=25?L("ทันสบายถ้าฝึกสม่ำเสมอ","comfortable if you stay consistent")
              : perWeek<=50?L("ต้องขยันหน่อย","need to push")
              : L("หนัก — เพิ่มความถี่ หรือเลื่อนวันสอบ","tough — ramp up or move the date");
    /* "per week" only means something with ≥2 weeks to spread the load over. Inside one week the
       weekly rate just equals the whole gap ("595 pts/wk" with 7 days left = redundant + implies a
       sustainable cadence that doesn't exist). ≥14d → real weekly pace; <14d → state the raw gap. */
    verdict = d>=14
      ? `${L("เหลือ","Left")} <b>${d}</b> ${L("วัน","d")} · ${L("ต้องเก็บ","Need")} ~<b>${perWeek}</b> ${L("คะแนน/สัปดาห์","pts/wk")} — <span class="pl-tag">${tag}</span>`
      : `${L("เหลือ","Left")} <b>${d}</b> ${L("วัน","d")} · ${L("ยังขาด","short by")} <b>${gap}</b> ${L("คะแนน","pts")} — <span class="pl-tag">${tag}</span>`;
  }
  return `<div class="pace-line ${cls}">${head}<span class="pl-v">${verdict}</span></div>`;
}

  if(days<=0) return L("วันนี้","Today"); if(days===1) return L("เมื่อวาน","Yesterday"); return days+L(" วันก่อน"," days ago");
}

/* Lesson XP is deliberately NOT a history record. History rows are ROUNDS — the trend chart plots
   every one of them as an accuracy point, so a lesson (no questions, no score) would land on the
   graph as a 0% round and drag the line down for reading. It is stamped on the lesson instead and
   added back here, so "XP today" stays the true total without lying to the chart. */
function xpToday(){
  const t=todayStr();
  const fromRounds=(S.history||[]).filter(h=>h.d===t).reduce((s,h)=>s+(h.x||0),0);
  let fromLessons=0;
  const lr=S.lessonRead||{};
  for(const id in lr){ if(lr[id]&&lr[id].xpDay===t) fromLessons+=LESSON_XP; }
  return fromRounds+fromLessons;
}
function sessionsToday(){ const t=todayStr(); return (S.history||[]).filter(h=>h.d===t).length; }
/* Daily goals are TARGETS, not caps — nothing is ever withheld once you pass them (awardXP has no
   ceiling, so every point still counts toward XP/level/league). Rendering an exceeded target as a raw
   fraction made that look broken: "240/50" reads as a cap you blew past with the extra thrown away.
   Past target we show the total with a ✓ and the surplus as a bonus. Same fix covers ฝึกวันนี้/Streak. */
function goalRow(label, val, target, unit, note){
  val=Math.max(0,val||0); unit=unit||'';
  const done=val>=target;
  const right=done
    ? `<span style="color:var(--ok);font-weight:700">✓ ${val}${unit}</span>${val>target?` <span class="mut">+${val-target}</span>`:''}`
    : `${val}/${target}${unit}`;
  return `<div class="goal-row"><div class="gt"><b>${label}</b><span>${right}</span></div>
    <div class="gb"><i style="width:${target?Math.min(100,val/target*100):0}%"></i></div>
    ${note?`<div class="goal-why">${note}</div>`:''}</div>`;
}
/* Daily practice target. The old fixed 3 was cleared in a single sitting on day one — a goal that
   can't be missed stops directing anything, and the card went decorative for the rest of every day.
   This ramps with exam proximity, plus one extra round while most of the material is still unread.
   Deliberately a RAMP, not a derived formula: a practice round doesn't map onto lesson coverage, so
   "rounds needed to finish the syllabus" would be false precision dressed up as maths. */
function practiceGoal(){
  const d=examDaysLeft();
  let n = (d==null||d<=0) ? 5 : d<7 ? 8 : d<=14 ? 6 : d<=30 ? 5 : 4;
  const cov=lnDisciplineAxes(null).filter(v=>v!=null);
  const avg=cov.length?cov.reduce((a,b)=>a+b,0)/cov.length:0;
  if(avg<50) n+=1;
  const why = (d!=null&&d>0)
    ? L(`ให้ทันสอบ · เหลือ ${d} วัน`,`to be ready · ${d} days left`)
    : L('ตั้งวันสอบเพื่อให้เป้าปรับตามเวลาที่เหลือ','Set your exam date and this target adapts');
  return {n, why};
}

/* Whole days from today to the saved exam date (negative once it has passed) */
function examDaysLeft(){
  if(!S.examDate) return null;
  return Math.round((new Date(S.examDate+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
}

/* ---------- Quiz engine ---------- */
let game=null;
function quiz(cat){
  if(cat==="part6"){  // passage mode: show each passage once with ALL its blanks/questions together
    const groups={};
    ALL.filter(x=>x.cat===cat).forEach(x=>{(groups[x.pid]=groups[x.pid]||[]).push(x);});
    const chosen=[]; let count=0;
    for(const g of shuffle(Object.values(groups))){
      chosen.push(g.slice().sort((a,b)=>a.bidx-b.bidx));
      count+=g.length;
      if(count>=10) break;             // ~3 passages per round
    }
    const pool=chosen.flat();
    if(!pool.length){toast(L("ยังไม่มีโจทย์","No questions yet"));return;}
    const pages=[]; let gi=0;
    for(const grp of chosen){ pages.push(grp.map(()=>gi++)); }   // pages = arrays of global indices into pool
    pushView('play');

const TRICK_BY_PART={1:'p1',2:'p2',3:'p34',4:'p34',5:'p5',6:'p6',7:'p7'};
const TRICK_BY_CAT={listening:'p34',part5:'p5',grammar:'p5',part6:'p6',text:'p6',part7:'p7',reading:'p7',vocab:'gen'};
const _tipSeen={};   // rotate within a group so the same miss twice doesn't quote the same tip twice
function trickTipHTML(item){
  if(!item) return "";

  const gi=grps.findIndex(g=>g.id===gid); if(gi<0) return "";
  const items=grps[gi].items||[];
  const order=items.map((t,oi)=>({t,oi})).sort((a,b)=>(b.t.top?1:0)-(a.t.top?1:0));   // ⭐ first — best tip for a first-time reader
  if(!order.length) return "";
  const pick=order[(_tipSeen[gid]=(_tipSeen[gid]||0)+1)%order.length];
  return `<button class="tip-lnk" onclick="trickPop(${gi},${pick.oi})">💡
    <span>${L("เทคนิค","Tactic")} ${LT(grps[gi].nm)} · <b>${LT(pick.t.t)}</b></span>${CHEV}</button>`;
}
function pageExpl(gi){

  const correct=g.picks[gi]===item.a, el=$(`expl-${gi}`); if(!el) return;

function pageTick(){

function pageAnswer(gi,k){
  const g=game; if(g.picks[gi]!=null) return;
  const item=g.pool[gi], correct=k===item.a;
  g.picks[gi]=k;
  const secs=(performance.now()-g.pageT0)/1000;
  document.querySelectorAll(`#opts-${gi} .opt`).forEach((b,idx)=>{b.disabled=true;
    if(idx===item.a) b.classList.add("ok");
    if(idx===k && !correct) b.classList.add("bad");});
  let gained=0;
  if(correct){
    g.score++; g.combo++; if(g.combo>g.maxCombo) g.maxCombo=g.combo;
    const speed=secs<8?5:secs<15?3:1, mult=g.combo>=5?2:g.combo>=3?1.5:1;
    gained=Math.round((10+speed)*mult);

    const pre=item.id?peekCard(item.id):null, mastered=pre&&(pre.box||1)>=4&&(pre.correct||0)>0;
    if(mastered) gained=Math.max(1,Math.round(gained*0.2));

    g.wrongRun=0;
  } else { g.combo=0; toast("❌ "+L("สู้ต่อ!","Keep going!"));
    g.wrongRun=(g.wrongRun||0)+1; }
  g.xp+=gained;
  if(item.id) recordAnswer(item.id,correct);
  // drills use synthetic ids (not in the ALL catalog) so recordAnswer can't tag them — track category here
  if(item.id && !byId[item.id]){ const pc = g.mode.indexOf('drill')===0 ? partToCat(g.mode.slice(5)) : (item.cat||null); if(pc){ bumpCat(pc,correct); const c2=S.cards[item.id]; if(c2) c2.cat=pc; } }
  if(!correct){ addMistake(item, modeLabel(g.mode,item)); }
  save();   // persist SRS/catStats even if the user exits before finish() — correct answers used to be lost
  pageExpl(gi);
  if(++g.pageDone>=g.pageCount){
    const nx=$("next"); nx.style.display="block";
    const label = g.page+1<g.pages.length ? L("ถัดไป","Next")+" →" : L("ดูผล","See results")+" →";
    const anyWrong = g.pages[g.page].some(x=>g.picks[x]!==g.pool[x].a);

    } else { nx.textContent=label; }
  }
}

/* A round used to reach S.history only via finish(). Quit at question 8 of 10 and all 8 answers
   vanished from the weak-spot radar (SRS + mistake bank already saved per answer, so the data was
   there — the radar just never saw it), and the user reads that as "practising did nothing".
   Log what was actually answered instead. No XP: XP is the reward for completing a round. */
function commitPartial(){
  const g=game; if(!g||g._logged||!g.pool||!g.picks) return;
  const done=g.pool.map((_,i)=>i).filter(i=>g.picks[i]!=null);
  if(!done.length) return;
  const cats={};
  done.forEach(i=>{ const item=g.pool[i];
    const ck=item.cat||(g.mode.indexOf('drill')===0?partToCat(g.mode.slice(5)):null); if(!ck) return;
    const b=cats[ck]||(cats[ck]={c:0,t:0}); b.t++; if(g.picks[i]===item.a) b.c++; });
  g._logged=true;   // finish() sets this too, so a completed round can never be logged twice
  pushHist({d:todayStr(),m:g.mode,s:done.filter(i=>g.picks[i]===g.pool[i].a).length,n:done.length,x:0,dur:0,cats,partial:true});
  save();
}
function startGame(mode,pool){
  if(!pool.length){toast(L("ยังไม่มีโจทย์","No questions yet"));return;}
  commitPartial();    // starting a new round abandons the old one
  pushView('play');   // own history entry so Back leaves the game instead of skipping to whatever came before it
  game={mode,pool,i:0,score:0,xp:0,combo:0,maxCombo:0,picks:[],startedAt:performance.now()};

}

function mistakeDrill(){

  if(!all.length){toast(L("ยังไม่มีข้อผิด — เก่งมาก! 🎉","No mistakes yet — great job! 🎉"));return;}
  const t=todayStr();
  // SRS order: due errors first (most overdue), then not-yet-due to fill the round
  const due=all.filter(m=>!m.due||m.due<=t).sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')));
  const rest=shuffle(all.filter(m=>m.due&&m.due>t));
  const pool=due.concat(rest).slice(0,15).map(m=>{const s=m.hideText?{...m}:shuffleOpts(m); s.id=m.mkey; return s;});

function partDrill(part){
  if(part===3||part===4){ listenDrill(part); return; }   // Part 3/4: one recording → all its questions shown together
  const src=examPartItems(part);
  if(!src.length){toast(L("ไม่มีข้อในพาร์ทนี้","No questions in this part"));return;}
  /* Part 1's bank is 12 photos. A round of 10 hands out 83% of it, so the SECOND drill was almost
     entirely repeats no matter how we order it — 6 keeps two clean rounds in the bank. */
  const want=(part===1)?6:10;
  const chosenSrc=pickFresh(src,want); markServed(chosenSrc); save();
  const pool=chosenSrc.map(it=>{
    // Listening parts (1-4) play real recordings that read options in fixed order — don't shuffle, or audio desyncs from the printed choices.
    const s=((part>=1&&part<=4)?{...it}:shuffleOpts(it));
    if(part===1){ s.audio=letterize(s.o); s.hideText=true; }
    else if(part===2){ s.audio=(s.audio?s.audio+"   ":"")+letterize(s.o); s.hideText=true; }
    s.id=mistakeKey(it); return s;
  });
  startGame("drill"+part,pool);

/* Part 3 (conversations) & Part 4 (talks): each recording carries several questions. Present one
   audio group per page with ALL its questions, playing the recording once — like the real TOEIC. */
function listenDrill(part){

  if(!groups.length){toast(L("ไม่มีข้อในพาร์ทนี้","No questions in this part"));return;}

  markServed(chosen); save();
  const pool=[], pages=[];
  chosen.forEach(g=>{
    const idxs=[];
    (g.qs||[]).forEach(q=>{ idxs.push(pool.length);
      pool.push({q:q.q,o:q.o,a:q.a,e:q.e,t:q.t,audio:g.audio,qid:g.id,part,cat:"listening",id:mistakeKey({q:q.q,o:q.o,passage:null})}); });

/* ---------- Practice-Hub radar date filter ---------- */
/* The radar can be scoped to a time window or a single day, computed live from S.history

let _radarRange='all';   // 'all' | look-back window in days (as string): '365' | '30' | '7' | '1'

function radarHistKeep(h){

/* How many recent answers per skill the radar scores you on.
   A number the app can say out loud beats a more accurate one it can't: "your last 30 answers" is
   something a learner can predict and verify, so they trust the shape and go drill. The old
   recency-weighted average was better maths and unexplainable — you could finish 9/10 and watch the
   axis read 52% with no way to work out why. 30 ≈ 3 rounds: long enough not to swing on one bad
   round, short enough that a good session visibly moves it. Tune freely; it's just this constant. */
const ACC_WINDOW=30;
/* 5-skill accuracy array from history. keep() picks which rounds count (date scope); omit for all. */
function skillAccuracyRange(keep){
  const agg={listening:{c:0,t:0,r:[]},grammar:{c:0,t:0,r:[]},text:{c:0,t:0,r:[]},reading:{c:0,t:0,r:[]},vocab:{c:0,t:0,r:[]}};
  const add=(sk,c,t)=>{ if(!t) return; agg[sk].c+=c; agg[sk].t+=t; agg[sk].r.push([c,t]); };
  /* catStats keys → radar axes. One table, used for both the per-round `cats` breakdown and the
     legacy mode-name guess, so the two paths can't drift apart. */
  const catAxis={listening:'listening',part5:'grammar',part6:'text',part7:'reading',vocab:'vocab'};
  const modeSkill=m=>{
    if(m==='listening') return 'listening';
    if(m==='part5') return 'grammar';
    if(m==='part6') return 'text';
    if(m==='part7') return 'reading';                     // was missing: every Part-7 round vanished from the ranged radar
    if(m==='vocab'||m==='vocabtest') return 'vocab';
    if(m&&m.indexOf('drill')===0){ const p=+m.slice(5); if(p>=1&&p<=4) return 'listening'; if(p===5) return 'grammar'; if(p===6) return 'text'; if(p===7) return 'reading'; }
    return null;   // mixed pools (review/mistakes) — only the per-round `cats` breakdown can place those
  };
  const partSkill=p=>{ p=+p; return p<=4?'listening':p===5?'grammar':p===6?'text':'reading'; };
  const pass=keep||(()=>true);
  (S.history||[]).forEach(h=>{
    if(!pass(h)) return;
    if(h.m==='exam'&&h.parts){ for(const p in h.parts){ const pr=h.parts[p]; if(!pr) continue; add(partSkill(p), pr.c||0, pr.t||0); } return; }
    if(h.cats){ for(const ck in h.cats){ const b=h.cats[ck], sk=catAxis[ck]; if(b&&sk) add(sk, b.c||0, b.t||0); } return; }
    const sk=modeSkill(h.m); if(sk && h.n) add(sk, h.s||0, h.n||0);   // rounds recorded before `cats` existed
  });
  /* Newest round first, take answers until the window is full. History stores a round's total
     (7 of 10) and not which 7 were right, so a round straddling the edge contributes its share
     pro-rata — the only guess in here, and it touches at most one round. */
  const acc=o=>{
    if(!o.t) return null;
    let c=0,t=0;
    for(let i=o.r.length-1;i>=0 && t<ACC_WINDOW;i--){
      const [rc,rt]=o.r[i], take=Math.min(rt,ACC_WINDOW-t);

    }

  };

  // n is the window actually scored, not the lifetime tally — it's what the "~" provisional mark
  // reads, and claiming 400 answers behind a number computed from 30 would be a lie.
  const sn=o=>Math.min(o.t,ACC_WINDOW);
  return [
    {ic:'👂',img:'emoji/anim-listening.webp',nm:L('การฟัง','Listening'), v:acc(agg.listening), n:sn(agg.listening), on:"listenChoose()"},
    {ic:'✏️',img:'emoji/anim-grammar.webp',  nm:L('ไวยากรณ์','Grammar'), v:acc(agg.grammar),   n:sn(agg.grammar),   on:"quiz('part5')"},
    {ic:'✍️',img:'emoji/anim-text.webp',     nm:L('พารากราฟ','Paragraph'), v:acc(agg.text),      n:sn(agg.text),      on:"quiz('part6')"},
    {ic:'👀',img:'emoji/anim-1f440.webp',    nm:L('การอ่าน','Reading'),  v:acc(agg.reading),   n:sn(agg.reading),   on:rd},
    {ic:'📚',img:'emoji/anim-vocab.webp',    nm:L('คำศัพท์','Vocab'),    v:acc(agg.vocab),     n:sn(agg.vocab),     on:"flash()"},
  ];
}

   not activity-in-window, and the legend says so. */
function lnDisciplineAxes(cutoff){
  const ls=(typeof LN==='function'&&LN().lessons)||[];
  return LESSON_CATS().map(c=>{
    const items=ls.filter(l=>lnCatOf(l)===c.id);
    const lesson=items.length?Math.round(items.filter(l=>lnDoneBy(l.id,cutoff)).length/items.length*100):null;
    if(c.id!=='vocab') return lesson;
    /* The deck cannot be rewound: its store keeps only each word's LATEST grade date, so "words known
       as of 3 weeks ago" is not reconstructable — counting at<=cutoff would undercount every word
       reviewed since. With a cutoff asked for, the vocab axis is lessons only. Blending today's live
       deck into a rewound chart was the silent lie: four axes in the past, one in the present. */
    const deck=cutoff?null:vocabDisciplinePct();
    if(lesson==null) return deck;                       // no vocab lessons authored → deck alone carries the axis
    if(deck==null) return lesson;
    return Math.round((lesson+deck)/2);
  });
}
/* series: 'acc' | 'disc' | 'both' (default). Overlaying both on one pentagon was unreadable whenever
   only a couple of axes had data — the two shapes collapsed onto the same spoke and read as one bent
   line. The dashboard now asks for one series per tab; 'both' stays for the Stats page. */
function weakRadarHTML(ranged,series){
  const SER=series||'both', showAcc=SER!=='disc', showDisc=SER!=='acc';
  // unscoped default keeps the original all-time source (matches the skill tiles); only a real
  // time-window / specific-day switches to the history-derived accuracy.
  const axes=(ranged&&radarScoped())?skillAccuracyRange(radarHistKeep):skillAccuracy();
  const N=5,cx=150,cy=150,R=86,LR=122;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const X=(r,i)=>cx+r*Math.cos(ang(i)), Y=(r,i)=>cy+r*Math.sin(ang(i));
  const poly=r=>Array.from({length:N},(_,i)=>X(r,i).toFixed(1)+','+Y(r,i).toFixed(1)).join(' ');
  const rings=[0.25,0.5,0.75].map(s=>'<polygon points="'+poly(R*s)+'" fill="none" stroke="var(--line)" stroke-width=".7"/>').join('')
    +'<polygon points="'+poly(R)+'" fill="none" stroke="var(--line)" stroke-width="1.2"/>';
  const spokes=Array.from({length:N},(_,i)=>'<line x1="'+cx+'" y1="'+cy+'" x2="'+X(R,i).toFixed(1)+'" y2="'+Y(R,i).toFixed(1)+'" stroke="var(--line)" stroke-width=".7"/>').join('');
  const anyData=axes.some(a=>a.v!=null);
  const FL=0;   // no floor — 0/no-data sit at the true center (honest); markers keep the vertices readable (dots + % labels stay truthful)
  /* Connect ONLY the axes that have data. Including the untouched ones pinned every missing vertex to
     the centre, so two scored skills drew a hairline slice instead of a line between two points — the
     shape was reporting three 0% scores that were never measured. Scored-only means 3+ axes make a real
     polygon, 2 make a line, 1 makes a spoke, and nothing on screen claims an unmeasured skill is zero. */
  const XY=(v,i)=>{const r=Math.max(v,FL);return X(R*r/100,i).toFixed(1)+','+Y(R*r/100,i).toFixed(1);};
  const accIdx=axes.map((a,i)=>a.v!=null?i:-1).filter(i=>i>=0);
  const donePts=accIdx.map(i=>XY(axes[i].v,i)).join(' ');
  // Every no-data axis sits at the exact centre, so five hollow rings would stack into one smudge.
  // Draw a single ring there instead — same meaning, one clean mark.
  const allNull=axes.every(a=>a.v==null), axesScored=axes.filter(a=>a.v!=null).length;
  const dots=!showAcc ? ''
    : allNull
    ? '<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="none" stroke="var(--mut)" stroke-width="1.4" opacity=".55"/>'
    // Partial data: draw NOTHING for a no-data axis. Its vertex sits on the centre, so a marker there
    // reads as "you scored 0%" — a lie about a skill never practised, and with 4 of them stacked the
    // blob + axis spoke looks like a line drawn from the one real dot into the middle. The greyed "—"
    // on the label already says "no data"; the chart shouldn't say it a second time, wrongly.
    : axes.map((a,i)=>{ if(a.v==null) return '';
      const dx=X(R*Math.max(a.v,FL)/100,i).toFixed(1), dy=Y(R*Math.max(a.v,FL)/100,i).toFixed(1);
      return '<circle cx="'+dx+'" cy="'+dy+'" r="4" fill="'+accColor(a.v,a.n)+'" stroke="var(--card)" stroke-width="1.6"/>'; }).join('');
  const discCut=(ranged&&_radarDate)?_radarDate:null;
  const disc=lnDisciplineAxes(discCut), discHas=disc.some(v=>v);
  const discXY=disc.map((v,i)=>[X(R*(v||0)/100,i),Y(R*(v||0)/100,i)]);
  const discIdx=disc.map((v,i)=>v>0?i:-1).filter(i=>i>=0);   // same scored-only rule as accuracy above
  const discPts=discIdx.map(i=>discXY[i][0].toFixed(1)+','+discXY[i][1].toFixed(1)).join(' ');
  /* The dash is gone: colour alone separates the two series now (blue = accuracy, gold = coverage), the
     same way every other pair of numbers in this app is told apart. On a pentagon this small the dash
     pattern never closed on a whole cycle, so the last segment ran long and the outline read as sloppy
     rather than as a deliberate second series. Solid strokes overlay cleanly, and the GAP between the two
     shapes — which is the actual insight — is easier to see when both edges are continuous. */
  /* ONE shared rule for BOTH series (accuracy + discipline), so the chart never changes its own
     grammar: a vertex dot marks every scored axis, always; the connecting polygon only appears once
     there are 2+ scored axes (with one, the other vertices collapse on the centre and the shape
     degenerates into a spike — geometry noise, not data). */
  const discAxesScored=disc.filter(v=>v>0).length;
  /* Discipline draws ONE mark and one only: the dashed outline, and only once 2+ axes are scored.
     No vertex dots — near-zero values all sit on the centre and stack into a gold smudge there. */
  /* Coverage FIRST, accuracy on top. SVG paints in document order, so whatever comes last wins the
     overlap — and accuracy is the number that decides what to do next, so it must never be the one
     partly hidden. Coverage is context behind it. */
  const svg='<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+rings+spokes
    /* Coverage keeps the dashed hollow outline — that stroke IS its identity, and when it is overlaid on
       the filled accuracy shape the difference in TREATMENT (not just hue) is what stops the two from
       reading as one bent line. The gap between them is the insight: gold outside blue = "studied it, not
       accurate yet"; blue outside gold = "sharp here without much study". */
    +((showDisc&&discHas&&discAxesScored>=3)?'<polygon points="'+discPts+'" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-dasharray="6 4" stroke-linejoin="round"/>':'')
    // two studied skills → the same centre-closed wedge accuracy uses at two
    +((showDisc&&discHas&&discAxesScored===2)?'<polygon points="'+cx+','+cy+' '+discPts+'" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-dasharray="6 4" stroke-linejoin="round"/>':'')
    /* One scored axis can't make an outline, and drawing nothing made the series look broken — "I finished
       2 lessons, the legend says 3%, and there is no gold anywhere." A spoke from the centre out to the
       value says "this far along", which is what the polygon says once enough axes exist to close it. */
    +((showDisc&&discHas&&discAxesScored===1)?(function(){const i=disc.findIndex(v=>v>0);
        return '<line x1="'+cx+'" y1="'+cy+'" x2="'+discXY[i][0].toFixed(1)+'" y2="'+discXY[i][1].toFixed(1)
          +'" stroke="var(--gold)" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="butt"/>';})():'')
    // with no data at all every vertex collapses onto the centre — that "polygon" is just a 2px
    // blob, so skip it and let the single hollow ring carry the empty state
    +((!showAcc||axesScored<3)?'':'<polygon points="'+donePts+'" fill="rgba(var(--acc-rgb),'+(anyData?'.20':'.05')+')" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>')
    // exactly two: close the wedge through the centre, the way a radar reads when the remaining axes
    // have nothing — the shape starts at the origin, reaches each measured value, and comes back
    +((showAcc&&axesScored===2)?'<polygon points="'+cx+','+cy+' '+donePts+'" fill="rgba(var(--acc-rgb),.20)" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>':'')
    /* Exactly one scored axis: an accent spoke from the centre out to that value, the same mark coverage
       makes in gold. A lone dot floating on a grid line doesn't read as a measurement; anchoring it to the
       centre shows how far along the axis it sits. Only the SCORED axis gets a line — the untouched skills
       stay empty, so nothing here claims they scored 0. */
    +((showAcc&&axesScored===1)?(function(){const i=axes.findIndex(a=>a.v!=null), r=Math.max(axes[i].v,FL);
        return '<line x1="'+cx+'" y1="'+cy+'" x2="'+X(R*r/100,i).toFixed(1)+'" y2="'+Y(R*r/100,i).toFixed(1)
          +'" stroke="var(--acc)" stroke-width="2" stroke-linecap="butt"/>';})():'')
    // coverage-only tab with nothing studied yet: same hollow centre ring the accuracy tab uses,
    // so an empty chart never looks like a rendering failure
    +dots+((!showAcc&&showDisc&&!discHas)?'<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="none" stroke="var(--mut)" stroke-width="1.4" opacity=".55"/>':'')+'</svg>';
  const labels=axes.map((a,i)=>{
    const lx=(X(LR,i)/300*100).toFixed(2), ly=(Y(LR,i)/300*100).toFixed(2);
    // A coverage-only chart must not label its vertices with accuracy — the number has to be the
    // series the shape is drawing, or the two contradict each other on the same axis.
    const isDisc=!showAcc&&showDisc;
    const val=isDisc?(disc[i]?disc[i]+'%':'—'):accText(a.v,a.n);
    const rc=isDisc?'var(--gold)':accColor(a.v,a.n);
    return '<button class="rlabel" style="left:'+lx+'%;top:'+ly+'%" onclick="'+a.on+'" aria-label="'+a.nm+' '+val+'">'
      +'<img class="ri" src="'+a.img+'" alt="" width="26" height="26">'
      +'<span class="rn">'+a.nm+'</span><span class="rv" style="color:'+rc+'">'+val+'</span></button>';
  }).join('');
  /* Legend average must agree with the axis labels it summarises. Two rules:
     - weight by answers, not by axis: 500 listening answers at 60% and 5 vocab answers at 100%
       is 60-something percent of real performance, not "80%".
     - carry the same provisional mark: if the pooled sample is under MIN_RELIABLE the number
       gets the axis "~" treatment instead of reading as settled. */
  const seen=axes.filter(a=>a.v!=null);
  const wN=seen.reduce((s,a)=>s+(a.n||0),0);
  const avg=seen.length
    ? (wN?Math.round(seen.reduce((s,a)=>s+a.v*(a.n||0),0)/wN)
        : Math.round(seen.reduce((s,a)=>s+a.v,0)/seen.length))   // counts missing → fall back to plain mean
    : null;
  const scope=(ranged&&radarScoped())?' <span class="mut">· '+radarScopeLabel()+'</span>':'';
  // legend = mean of the drawn axes, so it matches the gold shape (a raw lesson count would ignore the deck)
  const dv=disc.filter(v=>v!=null);
  const discAll=dv.length?Math.round(dv.reduce((s,x)=>s+x,0)/dv.length):null;
  const discScope=(ranged&&radarScoped())?(discCut?L('ถึง '+discCut,'as of '+discCut):L('สะสมถึงวันนี้','cumulative')):'';
  // the two series don't share a clock: accuracy is windowed, discipline is coverage-to-date. Say which.
  const lgAcc='<span><i class="lg-done"></i>'+L('ความแม่นยำเฉลี่ย','Avg accuracy')+' '+accText(avg,wN)+scope+'</span>';
  const lgDisc='<span><i class="lg-disc"></i>'+L('เรียนไปแล้ว','Covered')+' '+(discAll!=null?discAll+'%':'—')
    +(discScope?' <span class="mut">· '+discScope+'</span>':'')+'</span>';
  /* The hidden series appears in the legend as a dimmed entry you can tap to add — chart legends have
     worked as series switches for decades, so it needs no button of its own. That also puts the control
     where the thing it controls is named, instead of a gold pill floating between the chart and the
     cards below it. */
  const canMerge=ranged&&(typeof radarMergeReady==='function')&&radarMergeReady();
  const offEntry=(ic,label)=>'<button class="lg-off" onclick="toggleRadarMerge()" title="'+L('เพิ่มลงกราฟ','Add to chart')+'"><i class="'+ic+'"></i>'+label+' <b>+</b></button>';
  /* Merged ON had no way back: with both series live neither entry was a control, so the overlay could be
     switched on and never off. The ADDED series (the one that isn't this tab's own) now carries a ✕. */
  const wrapOff=html=>'<button class="lg-off on" onclick="toggleRadarMerge()" title="'+L('เอาออกจากกราฟ','Remove from chart')+'">'+html.replace(/^<span>|<\/span>$/g,'')+' <b>✕</b></button>';
  const merged=canMerge&&showAcc&&showDisc;
  const primaryIsDisc=(typeof S!=='undefined')&&S.radarMode==='disc';
  const accPart=showAcc?((merged&&primaryIsDisc)?wrapOff(lgAcc):lgAcc):'';
  const discPart=showDisc?((merged&&!primaryIsDisc)?wrapOff(lgDisc):lgDisc):'';
  const extra=(!canMerge||merged)?''
    : (showAcc&&!showDisc)?offEntry('lg-disc',L('เรียนไปแล้ว','Covered'))
    : (showDisc&&!showAcc)?offEntry('lg-done',L('ความแม่นยำ','Accuracy')) : '';
  return '<div class="hubradar"><div class="hubradar-inner">'+svg+labels+'</div>'
    +'<div class="radar-legend">'+accPart+discPart+extra+'</div></div>';
}

/* ---------- Text-to-speech ---------- */
/* ---------- Multi-voice TTS engine ---------- */
let VOICES={loaded:false,male:null,female:null,def:null,accents:[]};
function loadVoices(){
  let vs=[]; try{vs=speechSynthesis.getVoices();}catch(e){return;}
  vs=vs.filter(v=>/en[-_]/i.test(v.lang)||/english/i.test(v.name));
  if(!vs.length) return;
  const femN=/(samantha|victoria|karen|moira|tessa|fiona|female|zira|susan|allison|ava|serena|kate|stephanie|nicky|joelle)/i;
  const malN=/(daniel|alex|fred|aaron|male|rishi|gordon|oliver|arthur|tom|david|mark|lee|reed|albert)/i;
  const isF=v=>femN.test(v.name), isM=v=>malN.test(v.name);
  VOICES.def=vs.find(v=>v.default)||vs[0];
  /* group voices by accent locale → TOEIC uses US/UK/Canada/Australia speakers */
  const locales=[["US",/en[-_]US/i],["UK",/en[-_]GB/i],["AU",/en[-_]AU/i],["CA",/en[-_]CA/i],["IN",/en[-_]IN/i]];
  const accents=[];
  for(const [key,re] of locales){
    const grp=vs.filter(v=>re.test(v.lang)); if(!grp.length) continue;
    const female=grp.find(isF)||grp.find(v=>!isM(v))||grp[0];
    const male=grp.find(isM)||grp.find(v=>v!==female)||grp[0];
    accents.push({key,male,female});
  }
  if(!accents.length){ // voices have no locale tag → single bucket, distinguish by name only
    const female=vs.find(isF)||VOICES.def, male=vs.find(isM)||vs.find(v=>v!==female)||VOICES.def;
    accents.push({key:"EN",male,female});
  }
  VOICES.accents=accents;
  VOICES.female=accents[0].female; VOICES.male=accents[0].male; // legacy fallback
  VOICES.loaded=true;
}
/* pick a stable accent per script so different questions get different accents (no RNG) */
function accentFor(text){
  if(!VOICES.accents.length) return {male:VOICES.male,female:VOICES.female};
  let h=0; for(let i=0;i<text.length;i++) h=(h*31+text.charCodeAt(i))>>>0;
  return VOICES.accents[h%VOICES.accents.length];
}
try{ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
/* split a listening script into spoken segments (strip speaker labels / option letters) */
function parseSegments(text){
  text=(text||"").trim(); if(!text) return [];
  if(/\([ABCD]\)/.test(text)){
    const i0=text.search(/\([ABCD]\)/), segs=[];
    const pre=text.slice(0,i0).trim();            // question stem (Part 2) → narrator voice
    if(pre) segs.push({who:"narrator",content:pre});
    // split on the (A)/(B)/(C)/(D) markers but KEEP the letter so it is spoken before each choice
    const parts=text.slice(i0).split(/\s*\(([ABCD])\)\s*/);  // ["", "A", "...", "B", "...", ...]
    for(let k=1;k<parts.length;k+=2){
      const content=(parts[k+1]||"").trim();
      if(content) segs.push({who:"option",content:`${parts[k]}. ${content}`});
    }
    return segs;
  }
  const matches=[...text.matchAll(/([A-Z][a-z]+(?: \d)?)\s*:\s*/g)];
  if(matches.length>=2){
    const segs=[];
    if(matches[0].index>0){const pre=text.slice(0,matches[0].index).trim(); if(pre)segs.push({who:"narrator",content:pre});}
    for(let i=0;i<matches.length;i++){
      const start=matches[i].index+matches[i][0].length;
      const end=i+1<matches.length?matches[i+1].index:text.length;
      const content=text.slice(start,end).trim();
      if(content) segs.push({who:matches[i][1],content});
    }
    return segs;
  }
  return [{who:"narrator",content:text}];
}
/* Scroll the whole page back to the top (used on every question change). */
function goTop(){ try{ window.scrollTo(0,0); }catch(e){} const se=document.scrollingElement; if(se) se.scrollTop=0; }
/* For listening questions: make sure the page is actually back at the top, THEN play the audio. */
/* A short beat before the recording starts — a breath, not study time. At 350ms the voice began while the
   screen was still settling, which felt like being cut off mid-sentence. This is NOT a preview window: the
   real test doesn't pause for you, so nothing here is announced or counted down, and it stays under the
   threshold where a delay registers as waiting. Cancellable, because a queued play that fires after the
   reader has left would start a recording over whatever they opened next. */
let _leadT=null;
function clearLeadIn(){ if(_leadT){ clearTimeout(_leadT); _leadT=null; } }
function audioLeadIn(ms, ok){
  clearLeadIn();
  _leadT=setTimeout(()=>{ _leadT=null; if(ok()) playAudio(); }, ms);
}
function playWhenAtTop(playFn){
  let tries=0;
  const step=()=>{
    goTop();
    if(window.scrollY<=2 || tries++>20){ playFn(); }   // confirmed at top (or gave up after ~20 frames)
    else requestAnimationFrame(step);
  };

}
let _audioGen=0, _audioEl=null, _audioUnlocked=false;
/* Browsers (esp. Safari) block audio/speech unless first triggered inside a user gesture.
   Call this synchronously from the "Start" click to prime <audio> + speechSynthesis so the
   exam can autoplay each clip afterwards (even from a deferred handler). */
function unlockAudio(){
  if(_audioUnlocked) return; _audioUnlocked=true;
  try{ const a=new Audio(); a.muted=true; const p=a.play(); if(p&&p.then) p.then(()=>{try{a.pause();}catch(e){}}).catch(()=>{}); }catch(e){}
  try{ if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
}
/* Part 1 photos have a real recorded mp3 named after the image (images/261013.jpg -> audio/Part 1/261013.mp3).
   Play the file when it exists; fall back to browser text-to-speech (ttsText) if it's missing/unsupported. */
function imgToAudioFile(img){
  if(!img) return null;
  const base=img.split("/").pop().replace(/\.[^.]+$/,"");
  return base?("audio/Part 1/"+base+".mp3"):null;
}
/* Parts 2-4 have real recorded mp3s named by each item's unique id
   (p2-001 -> audio/Part 2/p2-001.mp3, p3-g01 -> audio/Part 3/p3-g01.mp3, p4-g01 -> audio/Part 4/p4-g01.mp3).
   Play the file when it exists; fall back to browser text-to-speech if it's missing/unsupported. */
function idAudioFile(qid){
  if(!qid) return null;
  const m=/^p(\d+)-/.exec(qid);
  return m?("audio/Part "+m[1]+"/"+qid+".mp3"):null;
}
function playFileOrSpeak(fileUrl, ttsText, onEnd){
  stopAudio();
  const gen=++_audioGen;
  const setWave=t=>{const w=$("wave"); if(w)w.textContent=t;};
  if(!fileUrl){ if(ttsText) speakScript(ttsText, onEnd); else if(onEnd) onEnd(); return; }
  let settled=false;
  const fallback=()=>{ if(settled||gen!==_audioGen) return; settled=true; if(ttsText) speakScript(ttsText, onEnd); else { setWave("🔊"); if(onEnd) onEnd(); } };
  const el=new Audio(fileUrl); _audioEl=el;
  el.onplaying=()=>{ if(gen===_audioGen){ settled=true; setWave("🔈"); } };
  el.onended  =()=>{ if(gen===_audioGen){ setWave("🔊"); if(onEnd) onEnd(); } };   // onEnd → drives realistic auto-advance
  el.onerror  =fallback;                                   // missing/404 -> speak instead
  el.play().then(()=>{ if(gen===_audioGen) settled=true; }).catch(fallback);
}
/* Chrome/Edge return an EMPTY getVoices() until the async voiceschanged event fires, so on a cold load
   the first listening item used to speak in the browser default voice — no accent, no male/female split.
   Wait briefly for the real list, then go ahead regardless so playback can never be blocked by it. */
function whenVoicesReady(cb){
  if(VOICES.loaded) return cb();
  loadVoices(); if(VOICES.loaded) return cb();
  let done=false;
  const finish=()=>{ if(done) return; done=true; clearTimeout(timer);
    try{ speechSynthesis.removeEventListener('voiceschanged',onVoices); }catch(e){} cb(); };
  const onVoices=()=>{ loadVoices(); if(VOICES.loaded) finish(); };
  try{ speechSynthesis.addEventListener('voiceschanged',onVoices); }catch(e){}
  const timer=setTimeout(finish,1200);
}
function speakScript(text, onEnd){
  stopAudio();
  const segs=parseSegments(text);
  if(!segs.length){ if(onEnd) onEnd(); return; }   // empty script must still fire onEnd — exam auto-advance depends on it
  const gen=++_audioGen;
  // gen is claimed BEFORE the wait, so navigating away mid-wait (which bumps _audioGen) cancels this speak
  whenVoicesReady(()=>{ if(gen===_audioGen) _speakSegs(segs,text,onEnd,gen); });
}
function _speakSegs(segs,text,onEnd,gen){
  const seen={}; let nextG=0;
  const acc=accentFor(text);
  segs.forEach(s=>{
    if(s.who==="narrator"){ s.g="n"; }
    else if(s.who==="option"){ s.g="o"; }
    else if(/woman/i.test(s.who)){ s.g="f"; }
    else if(/man/i.test(s.who)){ s.g="m"; }
    else { if(!(s.who in seen)){ seen[s.who]=(nextG++%2===0)?"m":"f"; } s.g=seen[s.who]; }
  });
  const setWave=t=>{const w=$("wave"); if(w)w.textContent=t;};
  setWave("🔈");
  let i=0;
  const next=()=>{
    if(gen!==_audioGen) return;
    if(i>=segs.length){ setWave("🔊"); if(onEnd) onEnd(); return; }
    const s=segs[i++];
    let u; try{ u=new SpeechSynthesisUtterance(s.content); }catch(e){ return; }
    // only pitch-shift when we lack two distinct voices (shifting compact voices muddies them)
    const oneVoice = !acc.male || !acc.female || acc.male===acc.female;
    if(s.g==="m"){ u.voice=acc.male||null;   u.pitch=oneVoice?.85:1; u.rate=.95; }
    else if(s.g==="f"){ u.voice=acc.female||null; u.pitch=oneVoice?1.15:1; u.rate=.96; }
    else if(s.g==="o"){ u.voice=acc.female||acc.male||VOICES.def; u.pitch=1; u.rate=.95; }
    else { u.voice=VOICES.def||null; u.pitch=1; u.rate=.95; }
    u.lang = (u.voice && u.voice.lang) ? u.voice.lang : "en-US";  // match voice's own locale, no en-US/en-GB clash
    u.onend =()=>{ if(gen===_audioGen) setTimeout(next, s.who==="option"?650:480); };
    u.onerror=()=>{ if(gen===_audioGen) setTimeout(next,200); };
    _utts.push(u);                                  // hold a reference: Chrome GCs live utterances, killing onend mid-script
    try{ speechSynthesis.speak(u); }catch(e){ setWave("🔊"); }
  };

}
let _utts=[];   // live utterance refs (see speakScript) — cleared whenever audio stops
function playAudio(){
  // page mode (Part 3/4 groups) plays the recording tied to the page's first item; single mode uses the current item
  const item = (game&&game.pageMode) ? (game.pool[game.pages[game.page][0]]) : (game&&game.pool[game.i]);
  if(!item||!item.audio) return;
  const fileUrl = item.img ? imgToAudioFile(item.img) : idAudioFile(item.qid);
  try{ playFileOrSpeak(fileUrl, item.audio); }catch(e){ toast(L("ไม่รองรับเสียงที่นี่","Audio not supported here")); }
}
// clearLeadIn: a pending countdown is queued audio too — leaving the screen must cancel it, or the
// recording starts playing over whatever the user opened next
function stopAudio(){ _audioGen++; _utts.length=0; try{clearLeadIn();}catch(e){} try{speechSynthesis.cancel();}catch(e){} if(_audioEl){ try{_audioEl.pause();}catch(e){} _audioEl=null; } const w=$("wave"); if(w) w.textContent="🔊"; }

/* ---------- Vocabulary Test (multiple-choice quiz drawn from vocab-bank.js) ---------- */
function vocabWords(){ return (window.VOCAB_BANK&&window.VOCAB_BANK.words)||[]; }
function escapeReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
/* Build a single multiple-choice question from a word. Rotates between three formats:
   word→meaning, meaning→word, and cloze (fill the word into its example sentence). */
function makeVocabQ(w, all, seed){
  const others=shuffle(all.filter(x=>x.id!==w.id));
  const wordRe=w.example?new RegExp('\\b'+escapeReg(w.word)+'\\b','i'):null;
  let type=['w2m','w2m','m2w','cloze'][((w.id||0)+(seed||0))%4];
  if(type==='cloze' && !(wordRe && wordRe.test(w.example))) type='w2m';
  let q,opts,a;
  if(type==='m2w' || type==='cloze'){
    const distract=[], seen=new Set([w.word.toLowerCase()]);
    for(const o of others){ const lw=o.word.toLowerCase(); if(seen.has(lw))continue; seen.add(lw); distract.push(o.word); if(distract.length>=3)break; }
    opts=shuffle([w.word,...distract]); a=opts.indexOf(w.word);
    q = type==='cloze'
      ? `${L("เติมคำในช่องว่าง","Fill in the blank")}:<br><span style="font-weight:600">${safeHTML(w.example.replace(wordRe,'_____'))}</span>`
      : `${L("คำใดมีความหมายว่า","Which word means")} “${safeHTML(w.meaningTh)}”?`;
  } else {
    const distract=[], seen=new Set([w.meaningTh]);
    for(const o of others){ if(seen.has(o.meaningTh))continue; seen.add(o.meaningTh); distract.push(o.meaningTh); if(distract.length>=3)break; }
    opts=shuffle([w.meaningTh,...distract]); a=opts.indexOf(w.meaningTh);
    q=`<span style="font-size:26px;font-weight:800">${safeHTML(w.word)}</span> <span style="color:var(--gold);font-weight:600">(${safeHTML(w.pos)})</span><br>${L("แปลว่าอะไร?","What does it mean?")}`;
  }
  return { q, qRaw:true, o:opts, a,
    e:`${w.word} (${w.pos}) = ${w.meaningTh} — e.g. ${w.example}`,
    t:`${w.word} (${w.pos}) แปลว่า “${w.meaningTh}” — ตัวอย่าง: ${w.example}`,
    cat:"vocab", id:"vb"+w.id };
}
function buildVocabPool(tier, count){
  const all=vocabWords();
  let words=tier?all.filter(w=>w.tier===tier):all;
  if(!words.length) words=all;
  return shuffle(words).slice(0,Math.min(count||10,words.length)).map((w,i)=>makeVocabQ(w,all,i));
}
function startVocabTest(tier){
  const pool=buildVocabPool(tier||null,10);
  if(!pool.length){ toast(L("ยังไม่มีคำศัพท์","No words yet")); return; }
  startGame("vocabtest",pool);

  stopAudio(); stopExam(); game=null; setActiveNav("practice"); window._rerender=vocabTest;   // "vocabtab" isn't a nav id — highlight Practice, where this screen lives
  const tiers=(window.VOCAB_BANK&&window.VOCAB_BANK.tiers)||[];
  const total=vocabWords().length;
  const tierIc=['','🐢','🐇','🦊','🐺','🦁'];  // animal ramp per tier: turtle→rabbit→fox→wolf→lion (beginner→apex)
  $("view").innerHTML=`
  <div class="card">
    <div class="top"><h2>📚 ${L("แบบทดสอบคำศัพท์","Vocabulary Test")}</h2><button class="pill" style="cursor:pointer" onclick="home()">${L("ปิด","Close")}</button></div>
    <p class="mut">${L(`ทดสอบคำศัพท์ TOEIC จากคลัง ${total} คำ — 10 ข้อต่อรอบ พร้อมเฉลยและตัวอย่างประโยคทันที`,`Test your TOEIC vocabulary from ${total} words — 10 questions per round with instant answers and example sentences`)}</p>
    <div class="grid" style="margin-top:14px">
      <div class="mode wide" role="button" tabindex="0" onclick="startVocabTest(0)"><div class="ic">🎲</div><div><div class="nm">${L("รวมทุกระดับ","All Levels")}</div><div class="ds">${L("สุ่มจากคำศัพท์ทั้งหมด","Random words from every tier")}</div></div></div>
      ${tiers.map(t=>`<div class="mode" role="button" tabindex="0" onclick="startVocabTest(${t.tier})"><div class="ic">${tierIc[t.tier]||'📚'}</div><div class="nm">${L("ระดับ","Tier")} ${t.tier}</div><div class="ds">${t.label} · ${t.range}</div></div>`).join("")}
    </div>
  </div>`;
  goTop();
}

/* ---------- Flashcards (TOEIC Vocab 1000, embedded from practice-bank/flashcards.html) ---------- */
/* `restore` is passed only by the language switch: the whole shell below is built from L() once,
   so it has to be re-rendered wholesale — the session (queue, position, mode) is carried across. */
function flash(restore){
  if(!restore) pushView('vocab');   // language-switch rebuild passes `restore` — don't add a history entry for it
  stopExam(); setActiveNav("vocab");
  stopAudio();
  const vocabBank = window.VOCAB_BANK;
  if(!vocabBank || !vocabBank.words || !vocabBank.words.length){ toast(L("ยังไม่มีคำศัพท์","No vocabulary yet")); return; }

  $("view").innerHTML = `
  <div id="flashApp">
    <h1><img class="emo emo-auto" src="emoji/anim-1f4da.webp" alt="📚" aria-hidden="true"> ${L("TOEIC Vocab 1000 — แฟลชการ์ด","TOEIC Vocab 1000 — Flashcards")}</h1>
    <div class="sub" id="subtitle">${L("คลังคำศัพท์ที่พบบ่อย","High-Frequency Master List")}</div>

    <div class="fc-mode">
      <button id="mStudy" class="on">🔄 ${L("ท่อง","Study")}</button>
      <button id="mTest">✍️ ${L("ทดสอบ","Test")}</button>
      <button id="mHist">🗂️ ${L("ประวัติ","History")}</button>
    </div>

    <div class="toolbar">
      <select id="tier"></select>
      <label class="pill"><input type="checkbox" id="thaiFirst" style="vertical-align:-1px"> ${L("ไทย → อังกฤษ","Thai → English")}</label>
      <label class="pill"><input type="checkbox" id="onlyReview" style="vertical-align:-1px"> ${L("เฉพาะที่ถึงกำหนด (ไม่รวมใหม่)","Due only (no new)")}</label>
      <button id="shuffle">${L("🔀 สลับ","🔀 Shuffle")}</button>
      <button id="reset">${L("↺ รีเซต","↺ Reset")}</button>
    </div>

    <div class="stats">
      <span>${L("การ์ด","Card")} <b id="pos">0</b> / <b id="total">0</b></span>
      <span class="w">${L("ถึงกำหนด","Due")} <b id="due">0</b></span>
      <span class="n">${L("ใหม่","New")} <b id="newc">0</b></span>
      <span class="g">${L("XP วันนี้","XP today")} <b id="fcxp">0</b></span>
    </div>

    <div class="fc-src" id="fcSrc" hidden></div>

    <div class="scene" data-tour="flashcard">
      <div class="card" id="card">
        <div class="face front">
          <span class="tier-tag" id="ftier"></span>
          <span class="idx" id="fidx"></span>
          <div class="word" id="word">—</div>
          <div class="pos" id="pos2"></div>
          <div class="hint">click or press <kbd>Space</kbd> to flip</div>
        </div>
        <div class="face back">
          <span class="tier-tag" id="btier"></span>
          <span class="idx" id="bidx"></span>
          <div class="word" id="bword" style="font-size:30px"></div>
          <div class="thai" id="thai"></div>
          <div class="ex" id="ex"></div>
        </div>
      </div>
    </div>

    <div class="nav">
      <button id="prev" title="Previous (←)">←</button>
      <span class="flip-hint">${L("แตะการ์ดเพื่อพลิกดูคำตอบ","tap card to flip")}</span>
      <button id="next" title="Next (→)">→</button>
    </div>
    <div class="grades" id="grades" hidden>
      <button class="gbtn again" id="g0" title="1"><span>✕ ${L("ลืม","Again")}</span><small id="i0"></small></button>
      <button class="gbtn hard" id="g1" title="2"><span>△ ${L("ยาก","Hard")}</span><small id="i1"></small></button>
      <button class="gbtn good" id="g2" title="3"><span>✓ ${L("ดี","Good")}</span><small id="i2"></small></button>
      <button class="gbtn easy" id="g3" title="4"><span>✓✓ ${L("ง่าย","Easy")}</span><small id="i3"></small></button>
    </div>
    <div class="fc-quiz" id="fcQuiz"></div>
    <div class="fc-hist" id="fcHist"></div>
    <div class="done" id="doneMsg"></div>

    <div class="fc-bar"><i id="barfill"></i></div>

    <div class="foot">
      ${L("คีย์ลัด","Shortcuts")}: <kbd>Space</kbd> ${L("พลิกดูคำตอบ","flip")} · <kbd>←</kbd>/<kbd>→</kbd> ${L("ก่อน/ถัดไป","prev/next")} ·
      <kbd>1</kbd> ${L("ลืม","again")} <kbd>2</kbd> ${L("ยาก","hard")} <kbd>3</kbd> ${L("ดี","good")} <kbd>4</kbd> ${L("ง่าย","easy")}.
      ${L("โหมดทดสอบ","Test mode")}: <kbd>1</kbd>–<kbd>4</kbd> ${L("เลือกคำตอบ","pick")} · <kbd>Space</kbd> ${L("ข้อถัดไป","next card")}.
      ${L("ใช้ Spaced Repetition (SM-2) แบบ Anki","Anki-style spaced repetition (SM-2)")}
    </div>

    <button id="fcHome" style="margin-top:14px;width:min(460px,92vw)">${L("หน้าหลัก","Home")}</button>
  </div>`;

  // ---- Anki-style SM-2 spaced repetition ----
  const OLD_KEY='toeic-vocab-progress-v1', LS_KEY='toeic-vocab-srs-v2';
  let prog = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  if(!prog){                                   // migrate old known/review flags → SM-2 cards
    prog={}; const old=JSON.parse(localStorage.getItem(OLD_KEY)||'{}');
    for(const id in old){
      prog[id]= old[id]==='known'
        ? {ef:2.5, ivl:4, due:dateStrPlus(4), reps:2, lapses:0}
        : {ef:2.3, ivl:0, due:todayStr(),     reps:0, lapses:1};
    }
    localStorage.setItem(LS_KEY, JSON.stringify(prog));
  }
  const saveP = () => localStorage.setItem(LS_KEY, JSON.stringify(prog));
  const TODAY = todayStr();
  // Grade history lives in its OWN key, not on the SM-2 card — "Reset" wipes prog, and the history
  // of what you graded is a record of your past, not scheduling state, so it must survive that.
  const HIST_KEY='toeic-vocab-hist-v1';
  let hist = JSON.parse(localStorage.getItem(HIST_KEY) || 'null');
  if(!hist){                                   // migrate the first cut, which stored the grade on prog as c.g
    hist={};
    for(const id in prog){ const c=prog[id]; if(c && c.g!=null) hist[id]={g:c.g, at:c.gAt||TODAY}; }
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  }
  const saveH = () => localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  // XP/accuracy credit ledger — persists independently of prog, so "Reset" can't refill a fresh farm.
  // Each card can bank XP + accuracy at most ONCE per day (re-grades / post-reset regrades give nothing).
  const CREDIT_KEY='toeic-vocab-credit';
  let credit = JSON.parse(localStorage.getItem(CREDIT_KEY)||'null');
  if(!credit || credit.d!==TODAY) credit={d:TODAY, ids:{}};
  if(!credit.tids) credit.tids={};        // test-only credit (accuracy). ids = XP credit, shared by Study+Test
  const saveCredit = () => localStorage.setItem(CREDIT_KEY, JSON.stringify(credit));
  const isDueC = c => !!(c && c.due && c.due <= TODAY);
  const isNewC = id => !prog[id];
  // next-interval (days) the four grades would produce — day-based SM-2
  function preview(c){
    const e=(c&&c.ef)||2.5, r=(c&&c.reps)||0, iv=(c&&c.ivl)||0;
    return { 0:0,
      1: r===0?1:Math.max(1,Math.round(iv*1.2)),
      2: r===0?1:Math.max(1,Math.round(iv*e)),
      3: r===0?4:Math.max(1,Math.round(iv*e*1.3)) };
  }
  const ivlTxt = d => d<=0?L('10 นาที','10m') : d===1?L('1 วัน','1d') : d<30?d+L(' วัน','d') : d<365?(Math.round(d/30)+L(' เดือน','mo')) : (Math.round(d/365)+L(' ปี','y'));
  function applyGrade(c,q){
    c.ef=c.ef||2.5;
    if(q===0){ c.reps=0; c.ivl=0; c.lapses=(c.lapses||0)+1; c.ef=Math.max(1.3,c.ef-0.2); }
    else { c.ivl=preview(c)[q]; c.reps=(c.reps||0)+1;
      if(q===1) c.ef=Math.max(1.3,c.ef-0.15); else if(q===3) c.ef=Math.min(2.8,c.ef+0.15); }
    c.due=dateStrPlus(c.ivl); return c;
  }

  $('subtitle').textContent = vocabBank.meta.subtitle || vocabBank.meta.title || L("คลังคำศัพท์ที่พบบ่อย","High-Frequency Master List");

  // ---- tier dropdown ----
  const tierSel = $('tier');
  tierSel.add(new Option(`${L("ทุกระดับ","All tiers")} (${vocabBank.meta.total})`, 'all'));
  vocabBank.tiers.forEach(t =>
    tierSel.add(new Option(`${L("ระดับ","Tier")} ${t.tier} · ${t.label} · ${t.range} (${t.count})`, String(t.tier))));

  let deck = [];      // today's study queue (word objects)
  let i = 0;          // index in deck
  let flipped = false;
  let qmode = 'study';  // 'study' = flip+grade · 'test' = multiple-choice quiz (same SRS queue) · 'hist' = graded-card browser
  let histCat = 0;      // which History bucket is open (0=Again 1=Hard 2=Good 3=Easy)
  let deckSrc = null;   // non-null when the deck came from a History bucket → show the "back to full deck" bar
  const GRADES = [
    {k:'again', ic:'✕',  th:'ลืม',  en:'Again'},
    {k:'hard',  ic:'△',  th:'ยาก',  en:'Hard'},
    {k:'good',  ic:'✓',  th:'ดี',   en:'Good'},
    {k:'easy',  ic:'✓✓', th:'ง่าย', en:'Easy'},
  ];

  function tierSet(){ const tv=tierSel.value; return vocabBank.words.filter(w=>tv==='all'||w.tier===Number(tv)); }
  // Anki study queue: due reviews (most overdue first) then new cards (unless "due only")
  function buildQueue(shuffleNew){
    const base=tierSet();
    const dueCards=base.filter(w=>isDueC(prog[w.id])).sort((a,b)=>prog[a.id].due<prog[b.id].due?-1:prog[a.id].due>prog[b.id].due?1:0);
    let newCards=$('onlyReview').checked?[]:base.filter(w=>isNewC(w.id));
    if(shuffleNew) for(let k=newCards.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[newCards[k],newCards[j]]=[newCards[j],newCards[k]];}
    return dueCards.concat(newCards);
  }
  function rebuild(shuffleIt){ deckSrc=null; deck=buildQueue(shuffleIt); i=0; render(); }   // any normal rebuild leaves a bucket deck
  function highlight(example, word){
    const re = new RegExp(`\\b(${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\w*)\\b`, 'ig');
    return example.replace(re, '<span class="hl">$1</span>');
  }
  function setFlip(state){
    flipped = state;
    $('card').classList.toggle('flipped', flipped);
  }
  function render(){
    const base=tierSet();
    $('due').textContent  = base.filter(w=>isDueC(prog[w.id])).length;
    $('newc').textContent = base.filter(w=>isNewC(w.id)).length;
    // this tile counts the WHOLE day's XP (not just flashcards), so show the daily goal honestly:
    // "30/50" while short of it, "240 ✓" once passed — never "240/50", which read as a broken cap
    { const x=xpToday(); $('fcxp').textContent = x>=50 ? `${x} ✓` : `${x}/50`; }
    const total = deck.length;
    $('total').textContent = total;
    $('pos').textContent = total ? i + 1 : 0;
    $('barfill').style.width = total ? `${(i/total)*100}%` : '100%';
    const fa=document.getElementById('flashApp');
    if(fa){ fa.classList.toggle('testmode', qmode==='test'); fa.classList.toggle('histmode', qmode==='hist'); }

    // studying a History bucket → say so, and always offer the way back to the full queue
    const src=$('fcSrc');
    if(src){
      const on = deckSrc!=null && qmode!=='hist';
      src.hidden = !on;
      if(on){ const g=GRADES[deckSrc];
        src.innerHTML = `<span class="fs-t">${L('กำลังท่องหมวด','Studying')} <b class="${g.k}">${g.ic} ${L(g.th,g.en)}</b></span>`
                      + `<button onclick="window.__fcFullDeck()">${L('← คลังคำศัพท์ทั้งหมด','← Full deck')}</button>`;
      }
    }
    if(qmode==='hist'){ renderHist(); return; }   // before the empty-deck branch: History reads its own store, not the queue

    if (!total){
      const newAvail = base.filter(w=>isNewC(w.id)).length;
      $('pos2').textContent = '';
      if($('onlyReview').checked && newAvail>0){
        // due queue is clear but new words remain — don't dead-end a first-time user on a 🎉; invite them in
        $('word').textContent = '📚';
        $('doneMsg').innerHTML = L('ทบทวนที่ถึงกำหนดครบแล้ว 🎉 ยังมีคำใหม่ '+newAvail+' คำรออยู่','All due reviews done 🎉 '+newAvail+' new words waiting')
          +'<br><button class="btn" style="margin-top:12px" onclick="window.__fcStartNew()">'+L('เริ่มเรียนคำใหม่ →','Start new words →')+'</button>';
      } else {
        $('word').textContent = '🎉';
        $('doneMsg').textContent = $('onlyReview').checked
          ? L('ทบทวนที่ถึงกำหนดครบแล้ว — เยี่ยม!','All due reviews done — nice!')
          : L('ทบทวนครบวันนี้ 🎉 กลับมาพรุ่งนี้เพื่อจำได้แม่นขึ้น','Done for today 🎉 Come back tomorrow to lock it in');
      }
      $('grades').hidden=true; $('fcQuiz').innerHTML=''; setFlip(false); return;
    }
    $('doneMsg').textContent = '';
    const w = deck[i];
    if(qmode==='test'){ $('grades').hidden=true; renderQuiz(w); return; }
    $('grades').hidden=false;
    const thaiFirst = $('thaiFirst').checked;
    const c = prog[w.id];
    const stTxt = isNewC(w.id)?L('ใหม่','New'):(c&&(c.reps||0)===0?L('กำลังเรียนรู้','Learning'):L('ทบทวน','Review'));
    $('ftier').textContent = $('btier').textContent = `${L("ระดับ","Tier")} ${w.tier} · ${stTxt}`;
    $('fidx').textContent  = $('bidx').textContent  = `#${w.id}`;

    if (thaiFirst){
      $('word').textContent = w.meaningTh;
      $('word').style.fontFamily = '"Thonburi","Sukhumvit Set",sans-serif';
      $('pos2').textContent = '';
      $('bword').textContent = w.word;
      $('thai').textContent = `(${w.pos})`;
    } else {
      $('word').textContent = w.word;
      $('word').style.fontFamily = '';
      $('pos2').textContent = `(${w.pos})`;
      $('bword').textContent = w.word + `  (${w.pos})`;
      $('thai').textContent = w.meaningTh;
    }
    $('ex').innerHTML = highlight(w.example || '', w.word);

    // interval preview on each grade button
    const p = preview(c||{ef:2.5,ivl:0,reps:0});
    $('i0').textContent=ivlTxt(0); $('i1').textContent=ivlTxt(p[1]); $('i2').textContent=ivlTxt(p[2]); $('i3').textContent=ivlTxt(p[3]);

    // edge tint by card state
    const col = isNewC(w.id)?'#3a63c0':(isDueC(c)?'#d99a2b':'#2f9e63');
    document.querySelectorAll('#flashApp .face').forEach(f => f.style.boxShadow = `0 0 0 3px ${col}, 0 8px 28px rgba(0,0,0,.28)`);
    setFlip(false);
  }
  function move(d){ if (!deck.length) return; i = (i + d + deck.length) % deck.length; render(); }
  // shared SRS commit (grade a card + XP/accuracy once per day) — used by both Study grades and Test answers
  /* isTest=true only from Quiz mode. Study grades are SELF-reported ("I remember this"), so they
     move SRS/XP/streak but must NOT feed the vocab accuracy stat — otherwise the radar reads ~100%
     just for tapping "Good". Only a real quiz answer counts as accuracy. */
  function commitSRS(w,q,isTest){
    const c = prog[w.id] || (prog[w.id]={ef:2.5,ivl:0,due:TODAY,reps:0,lapses:0});
    applyGrade(c,q); saveP();
    hist[w.id]={g:q, at:TODAY}; saveH();     // History buckets on this — kept out of prog so Reset can't erase it
    bumpStreak();
    const correct = q>=1, gained = q===0?0 : q===1?1 : q===2?2 : 3;
    /* No daily XP cap any more: every grade pays, however many times you review a word today.
       Effort always shows on the XP ladder — that is the deal now that the rank IS the achievement.
       ACCURACY keeps its once-per-word-per-day credit below, and that is not the same limit: letting
       one word be re-answered all day would rewrite the accuracy radar and the trend chart with
       repeats of the easiest card, which is a data-integrity problem, not a reward one. */
    const xpNew = true;
    const accNew = isTest && !credit.tids[w.id];           // accuracy only on FIRST quiz answer today, per word
    if(xpNew || accNew){
      if(xpNew){ credit.ids[w.id]=1; if(gained>0) awardXP('vocabtest', gained); }
      if(accNew){ credit.tids[w.id]=1; bumpCat('vocab', correct); }
      saveCredit();
      const rec=S.history.find(h=>h&&h._fc&&h.d===TODAY);   // s = correct answers, n = total answers → s/n is the day's accuracy (must stay ≤ n)
      const dx = xpNew?gained:0, dn = accNew?1:0, ds = (accNew&&correct)?1:0;
      if(rec){ rec.x=(rec.x||0)+dx; rec.n=(rec.n||0)+dn; if(ds) rec.s=(rec.s||0)+ds; }
      else pushHist({d:TODAY,m:'vocabtest',s:ds,n:dn,x:dx,_fc:true});
    }
    save(); syncHUD();
    return c;
  }
  function advanceQueue(w,c){
    deck.splice(i,1);
    const requeued = c.due <= TODAY;
    if (requeued) deck.push(w);
    if (i >= deck.length) i = 0;
    else if (requeued && i === deck.length-1 && deck.length>1) i = 0;
    render();
  }
  function grade(q){ if(!deck.length) return; const w=deck[i]; advanceQueue(w, commitSRS(w,q)); }
  // ---- Test mode: multiple-choice quiz on the same SRS queue ----
  let quizAnswer=-1, quizAnswered=false, quizOpts=[], quizPending=null;
  function renderQuiz(w){
    quizAnswered=false; quizPending=null;
    const thaiFirst=$('thaiFirst').checked;
    const correctVal = thaiFirst ? w.word : w.meaningTh;
    /* each option carries its counterpart translation so we can reveal every choice's meaning after answering, not just the right one */
    const seen=new Set([correctVal]), distract=[];
    const pool=shuffle(vocabBank.words.slice());
    const tryAdd=(o)=>{ if(o.id===w.id||distract.length>=3)return; const v=thaiFirst?o.word:o.meaningTh; if(seen.has(v))return; seen.add(v); distract.push({val:v, tr:thaiFirst?o.meaningTh:o.word}); };
    pool.forEach(o=>{ if(o.pos===w.pos && Math.abs((o.tier||1)-(w.tier||1))<=1) tryAdd(o); });   // prefer same part-of-speech + near tier → distractors that actually test knowledge, not obvious odd-ones-out
    if(distract.length<3) pool.forEach(tryAdd);                                                  // fallback: top up from the whole bank if the narrow pool was too thin
    const correctOpt={val:correctVal, tr:thaiFirst?w.meaningTh:w.word};
    quizOpts=shuffle([correctOpt,...distract]); quizAnswer=quizOpts.findIndex(o=>o.val===correctVal);
    const q = thaiFirst ? w.meaningTh : (w.word+' <span style="color:var(--gold);font-weight:600">('+w.pos+')</span>');
    const sub = thaiFirst ? L('เลือกคำศัพท์ที่ถูก','Pick the correct word') : L('เลือกความหมายที่ถูก','Pick the correct meaning');   // options are words in Thai→Eng mode, meanings in Eng→Thai mode
    $('fcQuiz').innerHTML='<div class="q-word">'+q+'</div><div class="q-sub">'+sub+'</div>'
      +'<div class="q-opts">'+quizOpts.map((o,idx)=>'<button class="qopt" onclick="window.__fcQuiz('+idx+')">'+o.val+'</button>').join('')+'</div>'
      +'<div class="q-ex" id="qEx"></div>';
  }
  function answerQuiz(k){
    if(quizAnswered||!deck.length) return; quizAnswered=true;
    const w=deck[i], correct = k===quizAnswer;
    document.querySelectorAll('#fcQuiz .qopt').forEach((b,idx)=>{ b.disabled=true; const o=quizOpts[idx]||{val:b.textContent,tr:''};
      if(idx===quizAnswer) b.classList.add('correct'); else if(idx===k) b.classList.add('wrong');
      const mark = idx===quizAnswer?'✓ ':(idx===k?'✗ ':'');   // shape cue, not just colour
      b.innerHTML = mark + o.val + (o.tr?'<span class="qopt-tr">→ '+o.tr+'</span>':'');   // reveal every choice's translation so wrong picks still teach
    });

  $('card').addEventListener('click', () => setFlip(!flipped));

  function setMode(m){

  $('mStudy').onclick=()=>setMode('study'); $('mTest').onclick=()=>setMode('test'); $('mHist').onclick=()=>setMode('hist');
  $('shuffle').onclick = () => rebuild(true);

  // to clear that, use "Clear history" inside History mode.
  $('reset').onclick = () => {

      } else if(e.key>='1' && e.key<='4'){ window.__fcQuiz(Number(e.key)-1); }

  window._rerender = () => {

    histCat = restore.histCat;
    deckSrc = restore.deckSrc;
    deck = restore.deck;                                       // keep the exact queue — a shuffled order can't be rebuilt
    i    = Math.min(restore.i, Math.max(0, deck.length - 1));
    setMode(restore.qmode);                                    // repaints the mode buttons and renders
    if (restore.flipped && qmode === 'study') setFlip(true);   // render() lands face-up; put the card back as it was
  } else {
    rebuild(false);
  }
}

/* ============ FULL MOCK EXAM (ตะลุยโจทย์) ============ */
function examReady(){ return !!(window.EXAM_BANK); }
/* sample n random items; shuffle answer options each attempt */
function pick(arr,n){ return shuffle(arr||[]).slice(0,Math.min(n,(arr||[]).length)); }
/* ---------- Anti-repeat ----------
   pick() re-rolled the dice on every attempt with no memory, so Mock #2 already repeated ~1/3 of the
   Listening bank and a Part 1 drill (bank of 12, round of 10) repeated 83% on its SECOND run. That is
   worse than dull: a score built on questions you have already seen measures memory, not ability — and
   the /990, the weak-spot radar, the "vs previous" delta and the leaderboard all read from that score.
   S.served counts how many times each bank item has been handed out. We serve least-served first and
   shuffle within a tier, so the whole bank cycles before anything comes back, and a bank too small to
   fill the round degrades to "oldest first" instead of failing. Drills and mocks share the ledger on
   purpose: meeting an item in a drill makes it less likely to turn up in your next mock. */
function servedKey(x){
  if(!x) return "";
  if(x.id||x.qid) return String(x.id||x.qid);              // parts 2/3/4 carry a recording id
  if(x.img) return String(x.img);                          // part 1 is keyed by its photo
  return mistakeKey(x.qs ? {...x.qs[0], passage:x.passage} : x);   // parts 5/6/7
}
function servedCount(k){ return ((S&&S.served)||{})[k]||0; }
/* least-served first, random within a tier. Does NOT mark — examCount() builds a throwaway exam just to
   label the dashboard, and that must not burn the bank. Callers mark what they actually show. */
function freshOrder(arr){ return (arr||[]).map(x=>[servedCount(servedKey(x)),Math.random(),x]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(t=>t[2]); }
function pickFresh(arr,n){ const a=freshOrder(arr); return a.slice(0,Math.min(n,(arr||[]).length)); }
function markServed(list){ if(!S.served) S.served={}; (list||[]).forEach(x=>{ const k=servedKey(x); if(k) S.served[k]=(S.served[k]||0)+1; }); }
function shuffleOpts(q){
  if(!Array.isArray(q.o)) return {...q};
  const order=shuffle(q.o.map((_,i)=>i));
  const na=order.indexOf(q.a);
  if(na<0) return {...q};   // malformed answer index — keep original order & answer rather than emit a broken a=-1
  return {...q, o:order.map(i=>q.o[i]), a:na};
}
/* Listening authenticity: Part 1 & 2 are spoken-only (no printed choices). */
function letterize(o){ return o.map((x,i)=>`(${"ABCD"[i]}) ${x}`).join("   "); }
function normListen(it){
  const p=(""+(it.part||"")).replace("part","");
  if(p==="2") return {...it, audio:(it.audio?it.audio+"   ":"")+letterize(it.o), hideText:true};
  if(p==="1") return {...it, audio:letterize(it.o), hideText:true};
  return {...it, hideText:false};
}
/* per-attempt structure targets (mirrors the real test) */
const EXAM_TARGETS={p1:6,p2:25,p3:13,p4:10,p5:30,p6:4,p7q:54};
/* track=true only when a real attempt is starting — see markServed's note about examCount(). */
function buildExam(scale,track){
  const B=window.EXAM_BANK; if(!B) return null;
  scale=scale||1; const T=k=>Math.max(1,Math.round(EXAM_TARGETS[k]*scale));
  const groups=[], used=[];
  const take=(arr,n)=>{ const got=pickFresh(arr,n); used.push(...got); return got; };
  take(B.part1,T("p1")).forEach(it=>groups.push({part:1,sec:"Listening",type:"photo",text:null,img:it.img,audio:it.audio,qs:[{q:L("ฟังเสียง แล้วเลือกประโยคที่อธิบายภาพได้ดีที่สุด","Listen and choose the sentence that best describes the picture"),o:it.o,a:it.a,e:it.e,t:it.t}]}));
  take(B.part2,T("p2")).forEach(it=>groups.push({part:2,sec:"Listening",type:"audio",text:null,audio:it.audio,id:it.id,qs:[{q:it.q||L("เลือกคำตอบที่ดีที่สุด","Choose the best response."),o:it.o,a:it.a,e:it.e,t:it.t}]}));  // no shuffle: recording reads options in fixed order
  take(B.part3,T("p3")).forEach(g=>groups.push({part:3,sec:"Listening",type:"audio",text:null,audio:g.audio,id:g.id,qs:g.qs.map(q=>({...q}))}));  // no shuffle: recording reads options in fixed order
  take(B.part4,T("p4")).forEach(g=>groups.push({part:4,sec:"Listening",type:"audio",text:null,audio:g.audio,id:g.id,qs:g.qs.map(q=>({...q}))}));  // no shuffle: recording reads options in fixed order
  take(B.part5,T("p5")).forEach(it=>groups.push({part:5,sec:"Reading",type:null,text:null,audio:null,qs:[shuffleOpts({q:it.q,o:it.o,a:it.a,e:it.e,t:it.t})]}));
  take(B.part6,T("p6")).forEach(g=>groups.push({part:6,sec:"Reading",type:"passage",text:g.passage,audio:null,qs:g.qs.map(shuffleOpts)}));
  const q7max=Math.max(3,Math.round(EXAM_TARGETS.p7q*scale)); let q7=0;
  for(const g of freshOrder(B.part7||[])){ if(q7>=q7max) break; groups.push({part:7,sec:"Reading",type:"passage",text:g.passage,audio:null,qs:g.qs.map(shuffleOpts)}); used.push(g); q7+=g.qs.length; }
  const flat=[];
  groups.forEach((g,gi)=>g.qs.forEach((qq,qi)=>{
    let speak=g.audio||null, hide=false;
    if(g.part===1){ speak=letterize(qq.o); hide=true; }
    else if(g.part===2){ speak=(g.audio?g.audio+"   ":"")+letterize(qq.o); hide=true; }
    flat.push({...qq,part:g.part,sec:g.sec,gType:g.type,gText:g.text,gAudio:speak,gImg:g.img||null,gId:g.id||null,gHide:hide,gi,qi,qcount:g.qs.length});
  }));
  // Part 7 passages come in 3- or 5-question sets and the loop above adds WHOLE
  // passages, so the running total can overshoot the target (e.g. 56 instead of 54,
  // making Reading 102 instead of 100). Trim the trailing Part 7 questions back to
  // the exact target so the Reading section always lands on 100 (Part5 30 + Part6 16 + Part7 54).
  let p7seen=0;
  const out=flat.filter(f=> f.part!==7 || (++p7seen)<=q7max);
  out.forEach((f,i)=>f.n=i+1);
  if(track){ markServed(used); save(); }   // persist now: quitting mid-exam still counts as "you saw these"
  return {groups,flat:out};
}

const EXKEY="scoreup.exResume";
function saveExamProgress(){
  if(!EX || EX.perPart) return;   // prep test is a one-shot real exam — not resumable
  const now=performance.now();
  const lcElapsed=EX.realistic?(EX.rcStart!=null?(EX.rcStart-EX.lcStart):(now-EX.lcStart))/1000:0;
  const rcElapsed=(EX.realistic&&EX.rcStart!=null)?(now-EX.rcStart)/1000:0;
  try{ localStorage.setItem(EXKEY,JSON.stringify({v:1,flat:EX.flat,groups:EX.groups,ans:EX.ans,spent:EX.spent,idx:EX.idx,
    realistic:EX.realistic,firstR:EX.firstR,lcLimit:EX.lcLimit,rcLimit:EX.rcLimit,rcStarted:EX.rcStart!=null,
    dirSeen:[...(EX.dirSeen||[])],

/* Validate the SHAPE, not just that it parsed. `load()` has salvage + backup for the main save; this
   record had nothing, so a half-written one reached the renderer and took the whole boot down with it.
   A resume banner is a convenience — if the record is malformed the right answer is to drop it and let
   the user carry on, never to block the app on it. */
function getExamProgress(){
  try{
    const r=localStorage.getItem(EXKEY); if(!r) return null;
    const p=JSON.parse(r);
    if(!p||typeof p!=='object'||!Array.isArray(p.flat)||!p.flat.length) return null;
    if(!Array.isArray(p.ans)) p.ans=new Array(p.flat.length).fill(null);   // rebuildable: nothing else depends on it
    if(!Array.isArray(p.spent)) p.spent=new Array(p.flat.length).fill(0);
    if(typeof p.idx!=='number'||p.idx<0||p.idx>=p.flat.length) p.idx=0;
    return p;
  }catch(e){ return null; }
}
function resumeExam(){
  const p=getExamProgress(); if(!p||!p.flat){ home(); return; }
  pushView('exam');
  if(EX&&EX.timer) clearInterval(EX.timer);
  const now=performance.now();
  EX={flat:p.flat,groups:p.groups,ans:p.ans,spent:p.spent||new Array(p.flat.length).fill(0),shownAt:null,
      idx:Math.min(p.idx||0,p.flat.length-1),showGrid:false,realistic:!!p.realistic,
      dirSeen:new Set(p.dirSeen||[]),
      firstR:p.firstR,lcLimit:p.lcLimit,rcLimit:p.rcLimit,t0:now-(p.elapsed||0)*1000,
      lcStart:now-(p.lcElapsed||0)*1000,rcStart:p.rcStarted?now-(p.rcElapsed||0)*1000:null};
  EX.playedG=new Set(); for(let i=0;i<EX.idx;i++){ const fi=EX.flat[i]; if(fi) EX.playedG.add(fi.gi); } // ชุดที่ผ่านไปแล้วไม่ auto-เล่นซ้ำ
  EX.timer=setInterval(examTick,1000);
  renderExam(); examTick();
}
