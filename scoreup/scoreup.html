   render. Scrolling to a still-folded heading showed a closed row with the answer inside it; leaving the
   previous sections open buried the target under dozens of unrelated lessons. Whatever was expanded came
   from an earlier visit, not from anything being read right now. */
function lessonGo(cat){
  LN_OPEN=new Set(cat?[cat]:[]);
  lessonView();
  const el=document.querySelector('.ln-cat[data-cat="'+cat+'"]');
  if(el) el.scrollIntoView({block:'start'});
}
function skillChoose(cat){
  const c=LESSON_CATS().find(x=>x.id===cat)||{};
  const nLes=(LN().lessons||[]).filter(l=>lnCatOf(l)===cat).length;
  const quizAct={listening:"listenChoose()",grammar:"quiz('part5')",paragraph:"quiz('part6')",
    reading:(examReady()?"partDrill(7)":"smartReview()"),vocab:"flash()"}[cat]||"practiceMenu()";
  // Vocab's "practice" IS the flashcard deck — label it so, or nobody guesses that
  // the generic 🎯 button is where the vocab stat actually comes from
  const isVocab=cat==='vocab';
  const quizIc=isVocab?'📚':'🎯';
  const quizNm=isVocab?L('แฟลชการ์ด','Flashcards'):L('ทำโจทย์','Go to quiz');
  // Noto icons via their -s.webp still frame: same artwork as the animated set,
  // frozen — the modal shouldn't have three things wiggling at once
  const row=(act,kind,ic,title,desc)=>
    '<button class="lc-row" onclick="closeModal();'+act+'">'
      +'<span class="lc-tile '+kind+'"><img src="'+ic+'" alt="" aria-hidden="true"></span>'
      +'<span class="lc-body"><b class="lc-t">'+title+'</b>'
      +'<span class="lc-d"><i class="lc-mk'+(kind==='disc'?' disc':'')+'"></i>'
      +(kind==='disc'?L('เรียนไปแล้ว','Covered'):L('ความแม่นยำ','Accuracy'))
      +(desc?' · '+desc:'')+'</span></span>'
      +'<span class="lc-go">›</span></button>';
  const catImg=c.img||'emoji/anim-1f4da-s.webp';
  openModal('<h3><img src="'+catImg+'" alt="" aria-hidden="true" style="width:22px;height:22px;object-fit:contain;vertical-align:-4px;margin-right:6px">'+(c.nm||'')+'</h3>'
    +'<p class="mut small" style="margin:-4px 0 14px">'+L('เลือกทางที่จะไปต่อ — เส้นเล็กบอกว่าเพิ่มค่าไหนในกราฟ','Pick your route — the small stroke shows which radar value it feeds')+'</p>'
    +row('lessonGo(\''+cat+'\')','disc','emoji/anim-1f393-s.webp',L('บทเรียน','Lessons'),
        nLes?nLes+' '+L('บท','lessons'):L('ยังไม่มีบท','none yet'))
    // flashcards are a discipline route, not an accuracy one — self-grading measures showing up
    +row(quizAct,isVocab?'disc':'acc',catImg,quizNm,
        isVocab?L('ท่องคำศัพท์ 1000 คำ','Master the 1000-word list'):L('ลงมือทำโจทย์จริง','Real questions'))
    +(isVocab?row('_fcRoute(\'vocab-test\')','acc','emoji/anim-1f4af-s.webp',L('แบบทดสอบคำศัพท์','Vocab quiz'),
        L('วัดคำที่ท่องแล้ว','Test the words you learned')):'')
    +'<button class="dbtn ghost sm" style="width:100%;margin-top:4px" onclick="closeModal()">'+L('ปิด','Close')+'</button>');
}
/* Tests now live on the combined Practice page — examIntro just opens it. */
function examIntro(){ stopExam(); stopAudio(); practiceMenu(); }
function startExam(scale){
  unlockAudio();   // prime audio inside the Start-click gesture so listening clips can autoplay
  const d=buildExam(scale||1,true); if(!d||!d.flat.length){toast(L("ยังไม่พร้อม","Not ready yet"));return;}
  pushView('exam');
  if(EX&&EX.timer) clearInterval(EX.timer);
  const now=performance.now();
  EX={flat:d.flat,groups:d.groups,ans:new Array(d.flat.length).fill(null),spent:new Array(d.flat.length).fill(0),shownAt:null,idx:0,t0:now,showGrid:false,
      realistic:EX_REALISTIC,dirSeen:new Set(),lcStart:now,rcStart:null};
  EX.firstR=EX.flat.findIndex(f=>f.sec==="Reading"); if(EX.firstR<0) EX.firstR=EX.flat.length;
  const lcCount=EX.firstR, rcCount=EX.flat.length-EX.firstR;
  EX.lcLimit=Math.round(lcCount*27); EX.rcLimit=Math.round(rcCount*45); // 45min/100 LC, 75min/100 RC
  EX.timer=setInterval(examTick,1000);
  saveExamProgress();
  renderExam(); examTick();
}
function examTick(){
  if(!EX) return; const el=$("extimer"); if(!el) return;
  // Prep test & realistic full-mock share ONE section-wide countdown: a single
  // Listening clock covering all of Parts 1–4, then a single Reading clock for
  // Parts 5–7. The test-taker manages their own pace within each section.
  if(EX.realistic || EX.perPart){
    const inReading=EX.idx>=EX.firstR;
    if(!inReading){
      const rem=EX.lcLimit-Math.floor((performance.now()-EX.lcStart)/1000);
      if(rem<=0){ EX.rcStart=performance.now(); EX.idx=EX.firstR; saveExamProgress(); toast(L("⏰ หมดเวลา Listening — ไปต่อ Reading","⏰ Listening time's up — on to Reading")); renderExam(); return; }
      el.textContent="🎧 "+fmtT(rem); el.style.color=rem<=60?"var(--bad)":"";
    } else {
      if(EX.rcStart==null) EX.rcStart=performance.now();
      const rem=EX.rcLimit-Math.floor((performance.now()-EX.rcStart)/1000);
      if(rem<=0){ el.textContent="👀 00:00"; clearInterval(EX.timer); toast(L("⏰ หมดเวลา — ส่งคำตอบอัตโนมัติ","⏰ Time's up — auto-submitting")); submitExam(true); return; }
      el.textContent="👀 "+fmtT(rem); el.style.color=rem<=60?"var(--bad)":"";
    }
    return;
  }
  el.textContent=fmtT((performance.now()-EX.t0)/1000);
}
function examPlay(){ const f=EX.flat[EX.idx]; if(!f||!f.gAudio) return; clearAA(); const fileUrl=(f.gType==="photo"&&f.gImg)?imgToAudioFile(f.gImg):idAudioFile(f.gId); playFileOrSpeak(fileUrl, f.gAudio, scheduleAA); }
/* Realistic auto-advance: like the real TOEIC, Listening paces you — after the clip ends you get a
   fixed answer window, then it moves on by itself. Only in realistic mode, Listening only; Reading is self-paced. */
function aaWindow(part){ return part<=2 ? 5 : 8; }   // Part 1/2 ~5s per Q, Part 3/4 ~8s per Q (matches ETS answer gaps)
// AA timers live at module level (NOT on EX) so they can always be cleared even after EX is gone / view changed
let _aaT=null, _aaI=null, _aaEnds=null;
const examOnScreen=()=>!!document.getElementById("extimer");   // exam view still mounted?
function clearAA(){ if(_aaT){ clearTimeout(_aaT); _aaT=null; } if(_aaI){ clearInterval(_aaI); _aaI=null; } _aaEnds=null; const h=$("aaHint"); if(h) h.textContent=""; }
function scheduleAA(){
  if(!EX||!EX.realistic||EX.perPart) return;               // realistic mock only; prep test starts audio by hand
  const f=EX.flat[EX.idx]; if(!f||f.sec!=="Listening") return;   // Reading is self-paced — never auto-advance
  clearAA();
  const sec=aaWindow(f.part);
  _aaEnds=performance.now()+sec*1000;
  _aaT=setTimeout(autoAdvance, sec*1000);
  _aaI=setInterval(updateAAHint,250);
  updateAAHint();
}
function updateAAHint(){ if(!examOnScreen()){ clearAA(); return; }   // navigated away → stop the interval, no hijack
  const h=$("aaHint"); if(!h||!_aaEnds) return; const left=Math.max(0,Math.ceil((_aaEnds-performance.now())/1000)); h.textContent=L("➡️ ไปข้อถัดไปใน "+left+" วินาที","➡️ Next question in "+left+"s"); }
function autoAdvance(){
  clearAA();
  if(!EX||!EX.realistic||!examOnScreen()) return;          // left the exam view → don't render over what the user is now looking at
  if(EX.idx>=EX.flat.length-1) return;                     // last question: stop, let the test-taker submit
  examNav(1);                                              // advances within Listening; stops once it reaches Reading
}
/* Prep test: the audio for each group plays exactly ONCE. After the test-taker starts it,
   lock it so it can't be replayed (don't re-render — that would call stopAudio() and cut it off). */
function examPlayManual(){
  if(!EX) return;
  const f=EX.flat[EX.idx]; if(!f||!f.gAudio) return;
  EX.playedG=EX.playedG||new Set();
  if(EX.playedG.has(f.gi)) return;                 // already used up — can't replay
  EX.playedG.add(f.gi);
  const btn=$("exPlayBtn"); if(btn){ btn.disabled=true; btn.textContent="🔒 "+L("เล่นแล้ว","Played"); btn.onclick=null; }
  examPlay();
}

/* TOEIC raw-%→scaled conversion per section (/495), piecewise-linear from
   published ETS conversion ranges. Non-linear: generous near the top, steeper
   mid-range. Listening scores higher than Reading at the same % correct. */
const SCALE_L=[[0,5],[5,35],[10,55],[15,75],[20,95],[25,125],[30,150],[35,180],[40,210],[45,230],[50,255],[55,280],[60,305],[65,335],[70,365],[75,395],[80,420],[85,445],[90,470],[95,490],[100,495]];
const SCALE_R=[[0,5],[5,25],[10,45],[15,60],[20,80],[25,100],[30,125],[35,150],[40,175],[45,200],[50,230],[55,255],[60,280],[65,305],[70,335],[75,365],[80,395],[85,425],[90,455],[95,470],[100,495]];
function interpScale(pct,tbl){
  pct=Math.max(0,Math.min(100,pct));
  for(let i=1;i<tbl.length;i++){ if(pct<=tbl[i][0]){ const [x0,y0]=tbl[i-1],[x1,y1]=tbl[i]; return Math.round((y0+(y1-y0)*(pct-x0)/(x1-x0))/5)*5; } }
  return 495;
}
function scaled(c,t,sec){ if(!t) return 0; return interpScale(c/t*100, sec==="R"?SCALE_R:SCALE_L); }
/* accrue time spent on the current question before leaving it */
function accrue(){ if(EX&&EX.shownAt!=null){ EX.spent[EX.idx]=(EX.spent[EX.idx]||0)+(performance.now()-EX.shownAt)/1000; EX.shownAt=null; } }
/* ---------- Skill analysis ---------- */
function pctOf(c,t){ return t?Math.round(c/t*100):0; }
function skillRow(label,pct,sub){

  // split the leading emoji off for the icon column. `sub` (Speed's s/Q · rate) rides beside the name as a
  // muted chip, the same slot the Stats card uses for its "· 8 ข้อ" sample note.
  const sp=label.indexOf(' '), ic=label.slice(0,sp), nm=label.slice(sp+1), col=radarRank(pct)[1];
  return `<div class="skrow"><span class="sk-ic">${ic}</span><div class="sk-main"><div class="sk-top"><span class="sk-nm">${nm}${sub?` <span class="sk-smp">${sub}</span>`:''}</span><span class="sk-acc" style="color:${col}">${pct}%</span></div><div class="sk-bar"><i style="width:${pct}%;background:${col}"></i></div></div></div>`;
}
function skillBlock(sk){
  if(!sk) return "";

  const speedBar=!sk.readSpeed?0:Math.round(Math.max(0,Math.min(100,Math.round((90-sk.readSpeed)/(90-30)*100)))*Math.min(1,(sk.read||0)/50));

  return skillRow('🎧 '+L('การฟัง','Listening'),sk.listen)+skillRow('👀 '+L('การอ่าน','Reading'),sk.read)+skillRow('✏️ '+L('ไวยากรณ์','Grammar'),sk.grammar)+skillRow('🧩 '+L('จับใจความ','Comp.'),sk.comp)+skillRow('⚡ '+L('ความเร็ว','Speed'),speedBar, (sk.readSpeed||0)+L(' วิ/ข้อ · ',' s/Q · ')+rate);
}

  6:L('ใช้บริบทประโยครอบๆ ช่องว่าง ไม่ใช่แค่ประโยคเดียว · ดูตัวเชื่อมและกาลของทั้งย่อหน้า','Use the surrounding sentences, not just one · mind connectors and the paragraph tense'),
  7:L('อ่านคำถามก่อน → สแกนหาคีย์เวิร์ดในบทความ · จัดเวลา ~45 วิ/ข้อ อย่าติดข้อเดียว','Read the questions first → scan for keywords · budget ~45s/question, don\'t get stuck'),
})[n]||''; }
function partBreakdownHTML(parts){

/* ---------- Skill Radar (pentagon) ---------- */
/* TOEIC-band rank labels — 4 tiers.
   Returns theme TOKENS, not hex. The old literals (#2e9e5b, #64748b, #d99a2b) were the LIGHT theme's
   --ok / --mut / gold copied by hand, so in dark mode — the app's default — this function painted a
   duller green than the --ok used by the ▲ delta arrow sitting right beside it in the same card: two
   greens, one meaning, side by side. A token can only ever be one colour per theme. */
function radarRank(v){
  if(v>=90) return [L('ผู้เชี่ยวชาญ','Expert'),'var(--acc)'];
  if(v>=70) return [L('เก่งแล้ว','Proficient'),'var(--ok)'];
  if(v>=40) return [L('กำลังพัฒนา','Developing'),'var(--gold)'];
  return [L('มือใหม่','Beginner'),'var(--mut)'];
}
function histLabel(m){
  if(m==="exam") return L("ข้อสอบ","Test");
  if(m==="review") return L("ทบทวน","Review");
  if(m==="mistakes") return L("คลังข้อผิด","Mistakes");
  if(m==="vocabtest") return L("คำศัพท์","Vocabulary");
  if(m&&m.indexOf("drill")===0) return "Part "+m.slice(5);
  if(m&&m.indexOf("lesson:")===0) return L("บทเรียน","Lesson");   // lesson drills — don't leak the raw "lesson:xxx" id
  return (CATS[m]&&catName(m))||m;
}
function avgSkills(n,scoped){
  /* เฉลี่ยทักษะจากสอบ n ครั้งล่าสุด (รวม readSpeed วินาที — radarChartHTML แปลงเป็น Speed เอง) */
  const ex=(S.history||[]).filter(x=>x.m==="exam"&&x.skills&&(!scoped||radarHistKeep(x)));
  if(!ex.length) return null;
  const last=ex.slice(-n), keys=["listen","read","grammar","comp","readSpeed"], o={};
  keys.forEach(k=>{ o[k]=Math.round(last.reduce((s,x)=>s+(x.skills[k]||0),0)/last.length); });
  return o;
}
function radarChartHTML(sk, legendHTML){
  /* Speed = "do you finish Reading in time?" anchored to the real TOEIC pace (100 Q / 75 min ≈ 45 s/q),
     then GATED by Reading accuracy — fast-but-wrong is guessing, not skill, so it must not read as a strength.
     30 s/q→100 · 45→75 · 90→0 · reading acc <50% discounts the score · null when no reading answered. */
  const spd=(()=>{
    if(!sk||!sk.readSpeed) return null;
    const pace=Math.max(0,Math.min(100,Math.round((90-sk.readSpeed)/(90-30)*100)));
    const gate=Math.min(1,(sk.read||0)/50);
    return Math.round(pace*gate);
  })();
  const A=[
    {ic:'🎧',img:'emoji/anim-listening.webp',nm:L('การฟัง','Listening'), v:sk?(sk.listen||0):null},
    {ic:'✏️',img:'emoji/anim-grammar.webp',  nm:L('ไวยากรณ์','Grammar'), v:sk?(sk.grammar||0):null},
    {ic:'⚡',img:'emoji/anim-26a1.webp',      nm:L('ความเร็ว','Speed'),   v:spd},
    {ic:'🧩',img:'emoji/anim-1f9e0.webp',     nm:L('จับใจความ','Comp.'),  v:sk?(sk.comp||0):null},
    {ic:'👀',img:'emoji/anim-1f440.webp',     nm:L('การอ่าน','Reading'),  v:sk?(sk.read||0):null},
  ];
  const N=5,cx=150,cy=150,R=86,LR=122;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const X=(r,i)=>cx+r*Math.cos(ang(i)), Y=(r,i)=>cy+r*Math.sin(ang(i));
  const poly=r=>Array.from({length:N},(_,i)=>X(r,i).toFixed(1)+','+Y(r,i).toFixed(1)).join(' ');
  const rings=[0.25,0.5,0.75].map(s=>'<polygon points="'+poly(R*s)+'" fill="none" stroke="var(--line)" stroke-width=".7"/>').join('')
    +'<polygon points="'+poly(R)+'" fill="none" stroke="var(--line)" stroke-width="1.2"/>';
  const spokes=Array.from({length:N},(_,i)=>'<line x1="'+cx+'" y1="'+cy+'" x2="'+X(R,i).toFixed(1)+'" y2="'+Y(R,i).toFixed(1)+'" stroke="var(--line)" stroke-width=".7"/>').join('');
  const has=sk&&A.some(a=>a.v!=null), scored=A.filter(a=>a.v!=null).length;   // same rule as the Stats pentagon
  const FL=0;   // no floor — 0/no-data sit at the true center (honest)
  const donePts=A.map((a,i)=>{const r=Math.max(a.v||0,FL);return X(R*r/100,i).toFixed(1)+','+Y(R*r/100,i).toFixed(1);}).join(' ');
  const dots=!has?'':A.map((a,i)=>{ const nd=a.v==null, rr=Math.max(a.v||0,FL), cx=X(R*rr/100,i).toFixed(1), cy=Y(R*rr/100,i).toFixed(1);
    return nd ? '<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="none" stroke="var(--mut)" stroke-width="1.4" opacity=".55"/>'
              : '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+radarRank(a.v)[1]+'" stroke="var(--card)" stroke-width="1.6"/>'; }).join('');
  const svg='<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+rings+spokes
    +(scored>=2?'<polygon points="'+donePts+'" fill="rgba(var(--acc-rgb),.2)" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>':'')+dots+'</svg>';
  const labels=A.map((a,i)=>{
    const lx=(X(LR,i)/300*100).toFixed(2), ly=(Y(LR,i)/300*100).toFixed(2);
    const rc=a.v!=null?radarRank(a.v)[1]:'var(--mut)';
    const icon=a.img?'<img class="ri" src="'+a.img+'" alt="" width="26" height="26">':'<span class="ri ri-e">'+a.ic+'</span>';
    return '<div class="rlabel" style="left:'+lx+'%;top:'+ly+'%;cursor:default">'+icon+'<span class="rn">'+a.nm+'</span><span class="rv" style="color:'+rc+'">'+(a.v!=null?a.v+'%':'—')+'</span></div>';
  }).join('');
  const legend=legendHTML?'<div class="radar-legend">'+legendHTML+'</div>':'';
  const body='<div class="hubradar"><div class="hubradar-inner">'+svg+labels+'</div>'+legend+'</div>';
  if(!sk) return body+'<p class="mut" style="text-align:center;margin-top:8px;font-size:12px">'+L('ทำ Full Mock Exam เพื่อปลดล็อก Skill Radar','Take a Full Mock Exam to unlock the Skill Radar')+'</p>';
  return body;
}
/* Main-page radar in "Mock" toggle mode: latest mock's /990 score + delta above the 5-skill radar. */
function mockRadarHTML(){
  const scoped=radarScoped();
  const ex=(S.history||[]).filter(x=>x.m==='exam'&&x.score990&&(!scoped||radarHistKeep(x)));
  if(!ex.length){
    // scoped range with no mock in it → clear note (there are mocks, just not here); else first-time unlock CTA
    if(scoped&&(S.history||[]).some(x=>x.m==='exam'&&x.score990)) return radarChartHTML(null)
      +`<p class="center mut" style="margin-top:12px;font-size:12.5px">${L('ไม่มีสอบเสมือนในช่วงนี้','No mock in this range')} · ${radarScopeLabel()}</p>`;

  const legend=`<span><i class="lg-done"></i>${L('คะแนนล่าสุด','Latest')} ${last.score990}/990${prev?` ${dh}`:''}${avgNote}</span>`;
  const detail=last.parts?`<div class="mock-detail"><div class="md-h">📋 ${L('คะแนนรายพาร์ท (รอบล่าสุด)','Score by part (latest)')}</div>${partBreakdownHTML(last.parts)}<p class="small mut" style="margin-top:10px;text-align:center"><span class="pill" style="cursor:pointer" onclick="statsView()">${L('ดูสถิติเต็ม','Full stats')} →</span></p></div>`:'';

/* Overall "charge-through-problems" stat: recent mock scores if any, else avg of the four skill accuracies */
function challengeStat(){
  const ex=(S.history||[]).filter(x=>x.m==='exam'&&x.score990);
  if(ex.length){ const last=ex.slice(-3); return Math.round(last.reduce((s,x)=>s+x.score990/990*100,0)/last.length); }
  /* No mock taken → no mock score. This used to average the practice skills and print the result on the
     "Mock" row, so a user who had never sat one still read "Mock · 0 Q · ~37%" — a number invented by the
     app, shown where a real result belongs, on the one page whose entire job is being trustworthy.
     `null` renders as "New", which is what is actually true. */
  return null;
}
/* Interactive pentagon stat diagram — each corner is a button into that practice.
   5 axes clockwise from top: Listening, Grammar, Mock (ตะลุยโจทย์), Vocabulary, Paragraphs Completion. */
/* Cumulative "mastery toward a goal" per skill — suits a study app better than raw
   accuracy %: it only ever climbs as you practise. Each skill fills toward its own cap. */
/* Progress = MASTERY (retained), not raw correct: a catalog item counts once it reaches SRS box≥4
   (answered right ~4× across spaced sessions). Realistic per-skill caps + an RPG level per skill. */
/* Mastered = answered correctly ≥2 times cumulative (a later wrong doesn't erase it).
   Counts every UNIQUE card tagged with this skill — catalog quiz AND part drills — so real practice moves it. */
function catMasteredCount(cat){ let c=0; for(const id in S.cards){ const k=S.cards[id]; if(k && k.cat===cat && (k.correct||0)>=2) c++; } return c; }
/* vocab "retained" = flashcard SM-2 cards passed ≥2 times (survived at least one spaced review) */
/* Count a word toward progress once it's been recalled correctly at least ONCE (reps>=1).
   The old reps>=2 bar could never move on the first day — SRS defers the 2nd review to a later date,
   so a whole first session showed 0/50 and felt like nothing happened. reps>=1 = "learned", matches load(). */
function vocabMastered(){ try{ const p=JSON.parse(localStorage.getItem('toeic-vocab-srs-v2')||'{}'); return Object.values(p).filter(c=>c&&(c.reps||0)>=1).length; }catch(e){ return 0; } }
function skillMastery(){
  // Reading (Part 7) mastery: SAME rule as the other question skills — unique Part-7 items answered right ≥2×
  // (practise via partDrill(7)). Not raw mock tallies, so it can't be farmed and stays consistent with the others.
  const readCorrect=catMasteredCount('part7');
  const items=[
    {ic:'👂',img:'emoji/anim-listening.webp',nm:L('การฟัง','Listening'), cur:catMasteredCount('listening'), cap:20, unit:L('ข้อ','Q'), on:'listenChoose()'},

    {ic:'✍️',img:'emoji/anim-text.webp',     nm:L('พารากราฟ','Paragraph'),  cur:catMasteredCount('part6'),     cap:30, unit:L('ข้อ','Q'), on:"quiz('part6')"},
    {ic:'👀',img:'emoji/anim-1f440.webp',    nm:L('การอ่าน','Reading'),   cur:readCorrect,                   cap:20, unit:L('ข้อ','Q'), on:examReady()?"partDrill(7)":"smartReview()"},
    {ic:'📚',img:'emoji/anim-vocab.webp',    nm:L('คำศัพท์','Vocab'),     cur:vocabMastered(),               cap:200, unit:L('คำ','words'), on:'flash()'},   /* target = a usable TOEIC core-vocab set; 50 was too low → bar maxed in a few sessions then stopped moving */
  ];

/* Radar view: fill each spoke toward full mastery (outer ring = 100% of that skill's cap).

   browsers, so we absolutely-position real DOM nodes around the chart instead. */
function hubRadarHTML(){
  const items=skillMastery();
  const N=5,cx=150,cy=150,R=86,LR=122;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const X=(r,i)=>cx+r*Math.cos(ang(i));
  const Y=(r,i)=>cy+r*Math.sin(ang(i));
  const poly=r=>Array.from({length:N},(_,i)=>X(r,i).toFixed(1)+','+Y(r,i).toFixed(1)).join(' ');
  const rings=[0.25,0.5,0.75].map(s=>'<polygon points="'+poly(R*s)+'" fill="none" stroke="var(--line)" stroke-width=".7"/>').join('')
    +'<polygon points="'+poly(R)+'" fill="none" stroke="var(--acc2)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".8"/>';
  const spokes=Array.from({length:N},(_,i)=>'<line x1="'+cx+'" y1="'+cy+'" x2="'+X(R,i).toFixed(1)+'" y2="'+Y(R,i).toFixed(1)+'" stroke="var(--line)" stroke-width=".7"/>').join('');
  const anyData=items.some(n=>n.cur>0);
  const FL=0;   // no floor — 0/no-data sit at the true center (honest); markers keep the vertices readable
  const donePts=items.map((n,i)=>{const r=Math.max(n.pct,FL);return X(R*r/100,i).toFixed(1)+','+Y(R*r/100,i).toFixed(1);}).join(' ');
  const dots=items.map((n,i)=>{ const nd=n.cur===0, r=Math.max(n.pct,FL), cx=X(R*r/100,i).toFixed(1), cy=Y(R*r/100,i).toFixed(1);
    return nd ? '<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="none" stroke="var(--mut)" stroke-width="1.4" opacity=".55"/>'
              : '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="var(--acc)" stroke="var(--card)" stroke-width="1.6"/>'; }).join('');
  const svg='<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'
    +rings+spokes
    +'<polygon points="'+donePts+'" fill="rgba(var(--acc-rgb),'+(anyData?'.22':'.05')+')" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>'
    +dots+'</svg>';
  const labels=items.map((n,i)=>{
    const lx=(X(LR,i)/300*100).toFixed(2), ly=(Y(LR,i)/300*100).toFixed(2);
    return '<button class="rlabel" style="left:'+lx+'%;top:'+ly+'%" onclick="'+n.on+'" aria-label="'+n.nm+' — '+n.cur+'/'+n.cap+' '+L('จำแม่น','mastered')+'">'
      +'<img class="ri" src="'+n.img+'" alt="" width="26" height="26">'
      +'<span class="rn">'+n.nm+'</span>'
      +'<span class="rv" style="color:var(--acc)">'+n.cur+'/'+n.cap+'</span></button>';
  }).join('');
  return '<div class="hubradar"><div class="hubradar-inner">'+svg+labels+'</div>'
    +'<div class="radar-legend"><span><i class="lg-goal"></i>'+L('ขอบ = ครบเป้าทักษะ','Edge = skill goal')+'</span><span><i class="lg-done"></i>'+L('ถึงเป้าแล้ว','At goal')+' '+items.filter(function(s){return s.pct>=100;}).length+'/5</span></div></div>';
}

     recording by hand — the real exam plays once and moves on — so a prep score is easier than a mock
     score and the two must not be read as one trend or compete on one board. */
  pushHist({d:t,m:"exam",s:lc.c+rc.c,n:EX.flat.length,x:(lc.c+rc.c)*2,score990:tot,skills,parts,prep:!!EX.perPart}); save(); clearExamProgress(); syncHUD();
  EX.result={L:lc,R:rc,sL,sR,tot,parts,tstr,skills};
  if(EX.perPart) sendPrepResult(parts,sL,sR);   // log prep-test results to the Google Sheet
  $("view").innerHTML=examResultHTML();
  window._rerender=()=>{ if(EX&&EX.result) $("view").innerHTML=examResultHTML(); };  // stay on results (not the question view) when language switches
}
/* Append a prep-test result row to the Google Sheet via the Apps Script Web App.
   Columns: Firstname, Lastname, Student ID, Part 1..7 (raw correct), Listening (/495), Reading (/495). */
function sendPrepResult(parts,sL,sR){
  const c=(EX.candidate||{}), pc=p=>((parts[p]||{}).c||0);
  const payload={ secret:PREP_SECRET, firstname:c.first||"", lastname:c.last||"", studentId:c.sid||"",
    part1:pc(1), part2:pc(2), part3:pc(3), part4:pc(4), part5:pc(5), part6:pc(6), part7:pc(7),
    listening:sL, reading:sR };
  if(!PREP_SHEET_URL || PREP_SHEET_URL.indexOf("PASTE_YOUR")===0){
    console.warn("[prep] PREP_SHEET_URL not configured — result not sent:", payload); return;
  }
  /* no-cors makes the response opaque: we learn that the request left the browser and nothing more.
     A rejected secret or a script error looks identical to success from here, so the message says
     "sent", not "saved" — claiming a row landed in the sheet when we cannot see the sheet is the kind
     of small lie that costs a teacher an evening hunting for results that were never written. */
  fetch(PREP_SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
    .then(()=>toast(L("ส่งผลไปที่ Google Sheet แล้ว ✅","Result sent to Google Sheet ✅")))
    .catch(()=>toast(L("ส่งผลไม่สำเร็จ — ตรวจอินเทอร์เน็ต","Couldn't send the result — check your connection")));
}
function reviewExam(onlyWrong){
  window._rerender=()=>reviewExam(onlyWrong);
  const items=EX.flat.map((f,i)=>({f,i})).filter(x=>!onlyWrong || EX.ans[x.i]!==x.f.a);
  let lastG=null;   // a Part 3/4 recording feeds 3 questions — print its photo/passage/script once per group, not three times
  const rows=items.map(({f,i})=>{
    const your=EX.ans[i], correct=f.a;
    const ctx=(f.gi!==lastG)?revContextHTML({img:f.gImg,passage:f.gType==="passage"?f.gText:null,audio:f.gAudio,part:f.part}):"";
    lastG=f.gi;

      ${ctx}
      ${f.q?`<div style="margin-bottom:8px">${qHTML(f)}</div>`:""}
      ${opts}
      <div class="expl show" style="margin-top:10px">${explText(f)}</div></div>`;
  }).join("");
  $("view").innerHTML=`
  <div class="card">
    <div class="top"><h2>💡 ${L("เฉลย","Answers")} ${onlyWrong?L("(เฉพาะข้อผิด)","(wrong only)"):""}</h2>${langToggle()}</div>
    <p class="small mut">${items.length} ${L("ข้อ","Q")}</p>
  </div>
  <div class="card">${rows||'<p class="mut center">🎉 '+L("ไม่มีข้อผิด!","No mistakes!")+'</p>'}</div>
  <button class="btn" onclick="$('view').innerHTML=examResultHTML()">◀ ${L("กลับไปหน้าคะแนน","Back to score")}</button>
  <button class="btn ghost" style="margin-top:10px" onclick="home()">${L("หน้าหลัก","Home")}</button>`;
}

     and each group's audio plays exactly ONCE (locked via EX.playedG after use — see examPlayManual)
   • ONE section-wide countdown: Listening 45 min (Parts 1–4) then Reading 75 min (Parts 5–7);
     the test-taker paces themselves across the parts. Listening timeout jumps to Reading;

/* localStorage, not sessionStorage: this code is SOLD. On sessionStorage the unlock died the moment

   the one user who has given money got the worst experience in the product. Persistence costs nothing
   in secrecy either: the code is a plaintext constant in this file, readable via view-source by
   anyone who cares, so the gate was never a security boundary — it's a receipt. */
function prepUnlocked(){
  try{ if(localStorage.getItem("scoreup.prepOK")==="1") return true;
       if(sessionStorage.getItem("scoreup.prepOK")==="1"){ localStorage.setItem("scoreup.prepOK","1"); return true; }   // carry over anyone unlocked under the old rule

}

/* ============================================================================

   card-everything convention: an editorial header, a bounded measure, and
   hierarchy carried by type and hairlines instead of nested boxes.
   ========================================================================== */
const LN=()=>window.LEARN||{lessons:[],tricks:[],myths:[],how:{},why:{}};
/* every content string in learn.js is {th,en} — LT unwraps it through the app's L() */
function LT(o){ return (o&&typeof o==="object") ? L(o.th,o.en) : (o||""); }
/* chevron — a real icon, because an emoji arrow would sit on the text baseline and wobble */
const CHEV='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';

const ARROWR=ARROWL.replace('M15 18l-6-6 6-6','M9 18l6-6-6-6');

/* eyebrow is optional: since the four learn pages sit under a tab bar that already names each one,
   printing the same word again directly under it was the third time the reader saw it before any content. */
function lnHero(eyebrow,title,lead,stats){

/* segmented sub-nav for the two combined study sections:
   "บทเรียน & เทคนิค" = Lessons + Tricks · "รู้จัก TOEIC" = How it works + Why it matters.
   Each sub-page keeps its own view name (pushView/routing unchanged) — the tabs just

function lnTabs(tabs,cur){

/* One segmented control for everything you READ. "รู้จัก TOEIC" used to be a 7th top-nav item, but the
   other nav links are all "go do something" while this one is "go read a reference you'll open once" —
   sitting among them it read as a category error, and it pushed the bar past what fitNav can hold.
   Its two pages are folded in here as peers of บทเรียน/เทคนิค, so there is ONE tab row, not a nested pair. */
const LEARN_TABS=()=>[

/* ---------- 1. LESSON ---------- */
/* The index groups lessons by the same five skills as the mastery radar. Order
   matches the radar: Listening → Grammar → Paragraph → Reading → Vocab. */
/* icons point straight at the static -s poster frames: animateEmoji() skips those,
   so the images never get src-swapped (and reloaded) after render */
const LESSON_CATS=()=>[
  {id:'listening', img:'emoji/anim-listening-s.webp', ic:'👂', nm:L('การฟัง','Listening'),   ds:L('การฟัง พาร์ท 1–4','Listening Part 1–4')},
  {id:'grammar',   img:'emoji/anim-grammar-s.webp',   ic:'✏️', nm:L('ไวยากรณ์','Grammar'),   ds:L('การอ่าน พาร์ท 1','Reading Part 1')},
  {id:'paragraph', img:'emoji/anim-text-s.webp',      ic:'✍️', nm:L('พารากราฟ','Paragraph'), ds:L('การอ่าน พาร์ท 2','Reading Part 2')},
  {id:'reading',   img:'emoji/anim-1f440-s.webp',     ic:'👀', nm:L('การอ่าน','Reading'),    ds:L('การอ่าน พาร์ท 3','Reading Part 3')},
  {id:'vocab',     img:'emoji/anim-vocab-s.webp',     ic:'📚', nm:L('คำศัพท์','Vocabulary'), ds:L('ใช้ได้ทุกพาร์ท','Every part of the test')},
];
/* A MISSING cat means grammar on purpose — most grammar lessons are authored without one. An
   UNRECOGNISED cat is a typo, and it used to land in grammar just as quietly: the lesson vanished
   from its own axis and inflated grammar's denominator, so two coverage numbers drifted and nothing
   said why. Same safe fallback, but it now says so once, at authoring time. */
const _lnCatWarned=new Set();
const lnCatOf=l=>{
  const c=l&&l.cat;
  if(!c) return 'grammar';

/* Lessons never say "Part 5/6/7" — the exam's official numbering is confusing next

function lnPartLabel(parts){

/* The index's only job is to get the reader INTO a lesson, so the page opens with one row that has
   already made the choice for them. Before this, 46 equally-weighted rows asked the reader to decide,
   and the lead line literally told them to go work out their own weakest skill — which the radar knows.
   Order: a lesson left half-read → the first unread lesson of the weakest skill → the very first lesson.
   `lessonRead` has no timestamp, so "half-read" resolves to the most-progressed one (closest to done).
   Returns null once every lesson is finished, and the row disappears with it. */
function lnNextUp(){
  const ls=LN().lessons||[]; if(!ls.length) return null;

     that promises reading with nothing left to read. Those fall through to the weakest-skill pick instead. */
  const started=ls.filter(l=>!lnDone(l.id)&&lnReadPct(l.id)>0&&lnReadPct(l.id)<95)
                  .sort((a,b)=>lnReadPct(b.id)-lnReadPct(a.id))[0];
  if(started) return {l:started,pct:lnReadPct(started.id),why:"resume"};

  const ORD=LESSON_CATS().map(c=>c.id);

  if(!unread.length) return null;

  const touched=ls.some(l=>lnDone(l.id)||lnReadPct(l.id)>0);

/* Every weak skill, not just the one the bar picked. The bar answers "what do I do next"; this answers

              :`<button class="btn ghost" onclick="practiceMenu()">${L("ไปฝึกทำโจทย์","Go practise")} ${CHEV}</button>`}
      </nav>
    </article>`;
  lnBalanceSheet();
  goTop();
  lnTrackStart(id);
}
/* Re-deal the cheat-sheet cards by measured height: each card (in numeric order) drops
   into whichever column is currently shorter, so neither column trails a big empty gap.
   Ties go left, so 01 always leads the left column; mobile ignores columns entirely
   (display:contents + inline order restores the 1,2,3 sequence). */
function lnBalanceSheet(){
  const sheet=document.querySelector(".ln-sheet");
  if(!sheet||sheet.classList.contains("one")) return;
  const cols=[...sheet.querySelectorAll(".ln-col")]; if(cols.length!==2) return;
  const blks=[...sheet.querySelectorAll(".ln-blk")].sort((a,b)=>(+a.style.order)-(+b.style.order));
  const gap=10, h=[0,0];
  blks.forEach(b=>{
    const t=h[1]<h[0]?1:0;
    cols[t].appendChild(b);
    h[t]+=b.offsetHeight+gap;
  });
}

/* ---------- Lesson reading checkpoint ----------
   Tracks how far down the lesson article you've scrolled (as a max %), keeps it in
   S.lessonRead[id]={p,y}, paints the thin bar over the topnav live, and lets the
   resume banner jump back to that exact spot on the next visit. */
function lnReadPct(id){ const r=(S.lessonRead||{})[id]; return r?Math.max(0,Math.min(100,r.p||0)):0; }
/* "Finished" is the reader's own call (the button at the end of each lesson) — scroll % only shows partial progress. */
function lnDone(id){ const r=(S.lessonRead||{})[id]; return !!(r&&r.done); }
/* Same question, asked as of a date: was this lesson already finished by then?
   Records written before doneAt existed have no date, so they count as "finished long ago" —
   that keeps existing users' discipline line where it was instead of collapsing it to 0. */
function lnDoneBy(id,cutoff){
  const r=(S.lessonRead||{})[id];
  if(!(r&&r.done)) return false;
  if(!cutoff||!r.doneAt) return true;
  return r.doneAt<=cutoff;
}
function lnToggleDone(id){
  const rec=S.lessonRead[id]||(S.lessonRead[id]={p:0,y:0});
  rec.done=!rec.done;
  if(rec.done) rec.doneAt=todayStr(); else delete rec.doneAt;
  save();
  toast(rec.done?L("เยี่ยม! บันทึกว่าอ่านจบแล้ว ✅","Nice! Marked as finished ✅"):L("เปลี่ยนเป็นยังอ่านไม่จบแล้ว","Marked as not finished yet"));
  const y=window.scrollY; lessonDetail(id); window.scrollTo(0,y);   // repaint badge + button without losing the reading spot
  if(rec.done){
    const card=document.querySelector('.ln-done.on');
    if(card){ card.classList.add('pop'); const r=card.getBoundingClientRect(); lnCelebrate(r.left+r.width/2, r.top+r.height/2); }
  }
}
/* Confetti burst for the finished-reading moment — pure DOM particles, removes itself, skipped for reduced-motion users. */
function lnCelebrate(x,y){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors=['#4f46e5','#8b5cf6','#2e9e5b','#d99a2b','#e05252','#3b82f6'];
  const root=document.createElement('div');
  root.style.cssText='position:fixed;left:0;top:0;width:0;height:0;z-index:6000;pointer-events:none';
  document.body.appendChild(root);
  for(let i=0;i<32;i++){
    const p=document.createElement('i');
    const sz=6+Math.random()*6;
    p.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:${sz}px;height:${sz*(Math.random()<.3?1:.55)}px;background:${colors[i%colors.length]};border-radius:${Math.random()<.25?'50%':'2px'};pointer-events:none`;
    const ang=Math.random()*Math.PI*2, v=90+Math.random()*160;
    const dx=Math.cos(ang)*v, dy=Math.sin(ang)*v-120-Math.random()*60;   // fling outward with an upward bias, then fall
    const rot=Math.random()*720-360, dur=900+Math.random()*500;
    root.appendChild(p);
    p.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:`translate(${dx*.6}px,${dy*.6}px) rotate(${rot*.6}deg)`,opacity:1,offset:.55},
      {transform:`translate(${dx}px,${dy+260}px) rotate(${rot}deg)`,opacity:0}
    ],{duration:dur,easing:'cubic-bezier(.16,.6,.4,1)',fill:'forwards'});
  }
  setTimeout(()=>root.remove(),1600);
}
let _lnTrack=null,_lnSaveT=null;
/* Reading pays XP — otherwise every XP in the app comes from answering questions, and the ladder
   quietly tells you to skip the lessons the hub just sent you to. It pays on the TRACKED scroll
   position (rec.p), not on the "mark as finished" toggle: the toggle is a self-report on a button you
   can press without reading, and it flips back and forth. rec.p only ever increases, so the award
   can't be re-triggered — no farm rule needed, the data shape enforces it. */
const LESSON_XP=10, LESSON_XP_AT=90, LESSON_XP_DWELL=20000;   // ms: a short article can hit 90% the instant it opens
function lnTrackStart(id){
  const art=document.getElementById("lnArticle"); if(!art) return;
  _lnTrack={id,art,t0:performance.now()};
  lnTrackTick();
}
function lnTrackTick(){
  const t=_lnTrack; if(!t) return;
  if(!t.art.isConnected){ _lnTrack=null; return; }   // navigated away — the article left the DOM
  const r=t.art.getBoundingClientRect(); if(!r.height) return;
  const pct=Math.max(0,Math.min(100,Math.round((window.innerHeight-r.top)/r.height*100)));
  const bar=document.getElementById("lnScrollBar"); if(bar) bar.style.width=pct+"%";
  const rec=S.lessonRead[t.id]||(S.lessonRead[t.id]={p:0,y:0});
  if(pct>rec.p){
    rec.p=pct; rec.y=Math.round(window.scrollY||document.documentElement.scrollTop||0);
    if(_lnSaveT) clearTimeout(_lnSaveT);
    _lnSaveT=setTimeout(save,800);   // scroll fires fast — don't hit localStorage on every event
  }
  /* Paid once per lesson, on real read-through: far enough down AND long enough to have read it.
     Marking it done here is not a bonus — it is the whole point. "Read" has to mean ONE thing: paying
     XP for a scroll-through while lnDoneBy() still wanted the manual toggle made the app say
     "lesson read +10 XP" and count that same lesson as 0% in Covered, seconds apart. The toggle stays
     for anyone who wants to mark a lesson done before reaching the end. */
  if(!rec.xpPaid && rec.p>=LESSON_XP_AT && (performance.now()-(t.t0||0))>=LESSON_XP_DWELL){
    rec.xpPaid=1; rec.xpDay=todayStr();   // stamped so xpToday() can see it — see the note there
    if(!rec.done){ rec.done=true; rec.doneAt=todayStr(); }
    awardXP('lesson',LESSON_XP); save(); syncHUD();
    toast(`🎓 ${L("อ่านจบบทเรียน","Lesson read")} +${LESSON_XP} XP`);
  }
}
window.addEventListener("scroll",()=>{ if(_lnTrack) requestAnimationFrame(lnTrackTick); },{passive:true});
function lnResume(id){
  const rec=(S.lessonRead||{})[id]; if(!rec) return;
  try{ window.scrollTo({top:rec.y,behavior:"smooth"}); }catch(e){ window.scrollTo(0,rec.y); }
}

/* ---------- Lesson → practice drill ----------
   Each skill category routes to its own question pool:
     grammar   → keyword-matched Part 5 items (the original behaviour, below)
     listening → the lesson's real-recording part drill (dp = 1..4), TTS fallback
     paragraph → the Part 6 passage quiz
     reading   → the exam-bank Part 7 drill
     vocab     → the vocabulary quiz
   Grammar keyword matching: the bank has no topic tags, so each lesson maps to a
   regex matched against the English explanation (e). Matched items come first in
   the same SRS order the category quiz uses; short pools fill up from random
   Part 5 so a round always reaches 10 questions. */
function lnDrillCopy(cat){
  return cat==='listening' ? L("ฝึกฟังจากไฟล์เสียงจริงของพาร์ทนี้ พร้อมเฉลยทันที","Practise with this part's real recordings, with instant answers")
    : cat==='paragraph' ? L("เติมพารากราฟจริงทีละบทความ พร้อมเฉลยทันที","Real passages, one paragraph at a time, with instant answers")
    : cat==='reading'   ? L("โจทย์การอ่านจากคลังข้อสอบเสมือน พร้อมเฉลยทันที","Reading questions from the mock-exam bank, with instant answers")
    : cat==='vocab'     ? L("แบบทดสอบคำศัพท์ 10 ข้อ พร้อมเฉลยทันที","A 10-word vocabulary quiz with instant answers")
    : L("โจทย์ไวยากรณ์ที่คัดมาให้ตรงกับบทนี้ 10 ข้อ พร้อมเฉลยทันที","10 grammar questions picked for this topic, with instant answers");
}
const LESSON_KW={
  wordform:/word form|part of speech|(?:noun|verb|adjective|adverb) form|adverb\b.*modif|modif\w+ (?:the )?(?:verb|adjective|clause)/i,
  sva:/agree|singular (?:verb|subject|noun)|plural (?:verb|subject)/i,
  tense:/\btense\b|past simple|present simple|simple past|future|time marker/i,
  perfect:/perfect\b/i,
  voice:/\bpassive\b|\bactive\b/i,
  modal:/\bmodal\b|obligation|necessity|possibility|\bmust\b|\bshould\b|\bcould\b|\bmight\b/i,
  gerinf:/gerund|infinitive/i,
  relative:/relative|\bwho(?:m|se)?\b|\bwhich\b/i,
  conj:/conjunction|concessive|subordinat|coordinat|connector/i,
  prep:/preposition/i,
  participle:/participl/i,
  pronoun:/pronoun|possessive|reflexive/i,
  comparative:/comparative|superlative/i,
  conditional:/conditional|subjunctive|if-clause|unreal/i,
  causative:/causative/i,
  quantifier:/quantifier|countable|uncountable|\bmuch\b|\bmany\b|\bfew\b|\blittle\b/i,
  article:/\barticles?\b|a\/an|definite|indefinite/i,
  confuse:/confus|commonly mixed|\baffect\b|\beffect\b|\braise[sd]?\b|\brise[sn]?\b|\blie\b|\blay\b|\blends?\b|\bborrow/i,
};
function lessonDrill(id){
  const l=(LN().lessons||[]).find(x=>x.id===id)||{}, cat=lnCatOf(l);
  if(cat==='listening'){
    if(examReady()&&l.dp){ partDrill(l.dp); return; }                 // real recordings for this part
    const pool=shuffle(ALL.filter(x=>x.cat==="listening")).slice(0,10).map(normListen);   // TTS fallback
    if(!pool.length){ toast(L("ยังไม่มีโจทย์","No questions yet")); return; }
    startGame("lesson:"+id,pool); return;
  }
  if(cat==='paragraph'){ quiz('part6'); return; }
  if(cat==='reading'){
    if(examReady()){ partDrill(7); return; }
    toast(L("คลังข้อสอบยังโหลดไม่เสร็จ","Question bank not loaded yet")); return;
  }
  if(cat==='vocab'){ quiz('vocab'); return; }
  const re=LESSON_KW[id]||null;
  const rank=x=>{ const k=peekCard(x.id), cor=k.correct||0, seen=k.seen||0; return (seen>0&&cor<3)?0:(seen===0?1:2); };
  const srs=arr=>arr.map(x=>[rank(x),Math.random(),x]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(a=>a[2]);
  const p5=ALL.filter(x=>x.cat==="part5");
  const hit=re?srs(p5.filter(x=>re.test(x.e||""))):[];
  const pool=hit.slice(0,10);
  if(pool.length<10){
    const hitSet=new Set(pool.concat(hit));
    pool.push(...srs(p5.filter(x=>!hitSet.has(x))).slice(0,10-pool.length));
  }
  if(!pool.length){ toast(L("ยังไม่มีโจทย์","No questions yet")); return; }
  startGame("lesson:"+id,pool);
}

/* ---------- 2. TRICKS ----------
   68 tactics is far too much to face at once, so the page opens folded, not spread:
     · groups are accordions — only the first is open on arrival
     · a tactic is one title row; the body opens in the reader popup on tap
     · the ⭐ filter starts ON, so a first-time reader meets ~33 rows, not 68
   All three are sticky preferences — "full text" restores the old expanded cards. */
let TRK_ONLY_TOP=(function(){ try{ const v=localStorage.getItem('scoreup.trkTop'); return v===null?true:v==='1'; }catch(e){ return true; } })();
function setTrickFilter(v){ TRK_ONLY_TOP=v; try{ localStorage.setItem('scoreup.trkTop',v?'1':'0'); }catch(e){} tricksView(); }

}
function trkAllGroups(open){

/* gi = index into LN().tricks (or -1 for the myths list) · ti = the item's ORIGINAL index in that
   group (not its filtered position), so the popup opens the right trick even in "Top only" mode */
function trickPop(gi,ti){
  const myth=gi<0, src=myth?null:(LN().tricks||[])[gi];

        <span class="tp-zl" id="tpZoomLv" aria-live="polite">${Math.round(_trkZoom*100)}%</span>
        <button class="gm-btn sm" onclick="trkSetZoom(0.1)" aria-label="${L('เพิ่มขนาดตัวอักษร','Zoom in')}" title="${L('ขยาย','Larger')}">+</button>
        <button class="gm-btn sm tp-x" onclick="closeModal()" aria-label="${L('ปิด','Close')}">✕</button>
      </span>

      <div class="tp-h${myth?' myth':''}">${LT(t.t)}${!myth&&t.top?` <span class="trk-star">⭐ ${L("คุ้มสุด","Top")}</span>`:""}</div>
      <div class="tp-b">${LT(t.b)}</div>

}
function tricksView(keepScroll){
  pushView('tricks'); game=null; stopExam(); stopAudio(); setActiveNav("lesson"); window._rerender=tricksView;   // tricks lives under the combined "บทเรียน & เทคนิค" nav entry

  if(!keepScroll) goTop();
}

/* ---------- 3. HOW TOEIC WORKS ---------- */
function howView(){
  pushView('how'); game=null; stopExam(); stopAudio(); setActiveNav("lesson"); window._rerender=howView;
  const H=LN().how||{};
  const parts=(H.parts||[]);
  /* One row per part, detail on tap. As full cards these seven were 2001px — 62% of the whole page, 286px
     each — because every card carried all six fields at once. A first read of "how the exam works" wants the
     SHAPE of it (seven parts, what each is called, how many questions); timing, what it really tests and
     what to do are per-part questions you ask when you get to that part. Nothing is cut, just folded. */
  const card=p=>{
    const open=HOW_PART.has(String(p.n));
    return `<section class="pfold${open?" open":""}">
      <button class="pfold-h" aria-expanded="${open}" onclick="howTogglePart('${p.n}')">
        <span class="pn"><span class="lab">Part</span><span class="no">${p.n}</span></span>
        <span class="em" aria-hidden="true">${p.ic}</span>
        <span class="nm">${LT(p.nm)}</span>

        <span class="cv" aria-hidden="true">${CHEV}</span>
      </button>
      <div class="pfold-b">
        <p class="wh">${LT(p.what)}</p>
        <div class="pspec">
          <div><span class="k">${L("เวลาที่ควรใช้","Time")}</span><span class="v">${LT(p.time)}</span></div>
          <div><span class="k">${L("วัดอะไรจริง ๆ","Really tests")}</span><span class="v">${LT(p.tests)}</span></div>
          <div><span class="k">${L("ตัวเลือก","Options")}</span><span class="v">${LT(p.opts)}</span></div>
        </div>
        <div class="ptodo"><span class="pl">${L("ต้องทำ","Do this")}</span><span>${LT(p.todo)}</span></div>
      </div>
    </section>`;
  };
  const L4=parts.filter(p=>p.sec==="L"), R3=parts.filter(p=>p.sec==="R");
  /* The page is 740 words across ~5 screens, and it used to open with all of it flat. The problem was
     never the volume — it was that three different moments were stacked into one scroll:
       · rules you need INSIDE the exam room  (question count, timing, no guessing penalty, double marks)
       · admin you need when you go BOOK a test (fee, when results land, retake window, 2-year validity)

/* ---------- Backup: export / import progress ---------- */
/* The flashcard deck lives in its own localStorage keys, OUTSIDE S — so a backup of S alone restored
   every lesson and silently dropped every word ever learned, halving the vocab coverage axis with no
   warning. The backup carries them alongside S under a namespaced key; older backups simply lack it. */
const VOCAB_KEYS=['toeic-vocab-srs-v2','toeic-vocab-hist-v1','toeic-vocab-progress-v1'];
function vocabSideCar(){
  const o={};
  VOCAB_KEYS.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!=null) o[k]=v; }catch(e){} });
  return o;
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify({...S,_vocabStore:vocabSideCar()})],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="scoreup-backup.json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(L("ดาวน์โหลดไฟล์สำรองแล้ว ✓","Backup file downloaded ✓"));
  }catch(e){ toast(L("ส่งออกไม่สำเร็จ","Export failed")); }
}
function importData(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=="object") throw 0;
      if(typeof d.xp!=="number") throw 0;                        // reject: xp must be a number (keeps current state)
      if(!Array.isArray(d.history)) d.history=[];                // repair the rest in place
      if(typeof d.streak!=="number") d.streak=0;
      if(!d.cards||typeof d.cards!=="object") d.cards={};
      if(!d.mistakes||typeof d.mistakes!=="object") d.mistakes={};
      /* MUST run before badges is defaulted. load() detects a pre-badges save by `!s.badges` and rescales
         `best` from a raw 8/10 count to 80% — defaulting badges first makes that test false forever, and
         since import writes straight to localStorage the migration then never gets another chance: the
         goal bar reads 8% instead of 80% for good. Same rule as load(), kept in the same order. */
      if(d.best>0 && d.best<=15 && !d.badges) d.best=Math.min(95, d.best*10);
      if(!d.badges||typeof d.badges!=="object") d.badges={};
      if(!d.catStats||typeof d.catStats!=="object") d.catStats={};
      if(!d.lessonRead||typeof d.lessonRead!=="object") d.lessonRead={};   // pre-lessons backups would crash the reading tracker
      if(!d.xpByType||typeof d.xpByType!=="object"){ const bt={practice:0,drill:0,mistakes:0,vocab:0,exam:0}; (d.history||[]).forEach(h=>{bt[xpBucket(h.m)]+=(h.x||0);}); const rem=(d.xp||0)-(bt.practice+bt.drill+bt.mistakes+bt.vocab+bt.exam); if(rem>0) bt.practice+=rem; d.xpByType=bt; }
      if(!d.timeAgg||typeof d.timeAgg!=="object"){ let sum=0,n=0; (d.history||[]).forEach(h=>{if(h.m!=="exam"&&typeof h.dur==="number"){sum+=h.dur;n++;}}); d.timeAgg={sum,n}; }
      /* Restore the flashcard deck before S, and keep it OUT of S — it is a sidecar of foreign
         localStorage keys, not app state, and leaving it on S would re-serialise a stale copy on
         every save. A pre-fix backup has no _vocabStore: leave whatever deck is on this device
         alone rather than wiping it to empty. */
      let deckRestored=0;
      if(d._vocabStore&&typeof d._vocabStore==='object'){
        VOCAB_KEYS.forEach(k=>{ const v=d._vocabStore[k];
          if(typeof v==='string'){ try{ JSON.parse(v); localStorage.setItem(k,v); deckRestored++; }catch(e){} } });
      }
      delete d._vocabStore;
      S=d; if(!S.lang)S.lang="th";
      save(); syncHUD(); home();
      toast(L("นำเข้าข้อมูลสำเร็จ ✓","Data imported ✓")+(deckRestored?"":L(" (ไฟล์เก่า: ไม่มีคลังคำศัพท์)"," (old backup: no flashcard deck)")));
    }catch(e){ toast(L("ไฟล์ไม่ถูกต้อง","Invalid file")); } };
  r.readAsText(f); input.value="";
}

/* ---------- PWA: offline + installable (only over http/https) ---------- */
/* True while the student has work that a reload would destroy.
   A PREP TEST is the critical case: it is deliberately one-shot — saveExamProgress() refuses to
   checkpoint it — so reloading mid-prep wipes a graded test with no way to resume. A practice round
   likewise has no saved state. A mock does checkpoint, but a surprise reload still yanks the student
   out mid-question. So a deploy must never reload any of them out from under the student. */
function workInProgress(){
  if(EX && EX.flat && !EX.result) return true;   // mock or prep test still being taken
  if(game) return true;                          // practice / drill / vocab round in flight
  return false;
}
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  // Only auto-refresh when a NEW sw takes over a page that was ALREADY controlled at load —
  // i.e. a genuine update. On first install controller is null, so we don't reload (which would
  // otherwise fire mid-session via clients.claim() and reset the current view).
  const wasControlled = !!navigator.serviceWorker.controller;
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  if(wasControlled){
    let reloaded=false, pending=false;
    // Deferred until the student is idle. _swApplyUpdate is re-run on every view change (see pushView),
    // so the new build lands the moment they leave the test — not in the middle of it.
    window._swApplyUpdate=()=>{
      if(!pending || reloaded || workInProgress()) return;
      reloaded=true; location.reload();
    };
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ pending=true; window._swApplyUpdate(); });
  }
}

/* Keyboard activation for non-native controls (nav tabs + logo): Enter/Space fires their click,
   so they work like real links/buttons for keyboard and screen-reader users. */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter" && e.key!==" " && e.code!=="Space") return;
  const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT")) return;
  const el=t&&t.closest&&t.closest('[role="button"],[role="link"]');
  if(!el) return;
  e.preventDefault(); el.click();
});

function animateEmoji(root){
  if(!root) return;
  const skip={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,IMG:1};
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(!n.nodeValue) return NodeFilter.FILTER_REJECT;
    const p=n.parentNode; if(!p||skip[p.nodeName]||p.classList&&p.classList.contains('no-emo')) return NodeFilter.FILTER_REJECT;
    EMOJI_RE.lastIndex=0; return EMOJI_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const nodes=[]; let nd; while(nd=w.nextNode()) nodes.push(nd);
  nodes.forEach(function(node){
    const s=node.nodeValue, frag=document.createDocumentFragment(); let last=0,m; EMOJI_RE.lastIndex=0;
    while(m=EMOJI_RE.exec(s)){
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const anim=EMOJI_GIF[m[1]], pe=node.parentNode;
      /* .ic animates only where it's a feature icon. In a long list of headings (tricks/lessons rows)
         a dozen looping emoji read as flicker — those stay on their static poster. */
      const at=sel=>!!(pe&&pe.closest&&pe.closest(sel));
      /* .rb-ic (the unfinished-mock bar) counts as a feature icon: it appears alone, at most once, and the
         motion is the point — a test left running should look like it is still running. It still has to pass
         the smoothness rule below, so ⚡ (18 frames at 80ms) stays on its poster rather than stepping. */
      const bigIcon=((pe&&pe.classList&&pe.classList.contains('ic')&&!at('.trk-grp-h,.trk-row,.ln-row,.ln-sec'))
        ||at('.rb-ic'));
      /* Three rules, in order, because "crucial" alone gave the wrong answer twice:
         · a tab is a label — one looping icon in a row of four static ones is just a distraction, and
           EMOJI_CRUCIAL was quietly overriding that (👑 in a tab animated while its neighbours sat still).
         · a page title animates only if the artwork is smooth. Noto's loops all run ~1.2s but range from
           15 to 123 frames; 💬 (15) stutters at title size where 🎓 (42) glides. Being "crucial" doesn't
           make a 15-frame loop look better, so the frame count wins here too.
         · everywhere else, crucial emoji and feature icons animate as before. */
      const smooth=EMOJI_SMOOTH.has((anim||'').replace(/^emoji\/|\.webp$/g,''));
      /* A feature icon is decorative furniture, so the same frame-rate rule that governs page titles
         governs it: 💬 (15 frames at 80ms) reads as a fast twitch at .ic size, not as motion. Reward
         emoji (EMOJI_CRUCIAL) are exempt — they mark a moment, and a stuttery 🎉 still beats a frozen one. */
      /* The unfinished-mock bar always plays, smooth or not. Its whole job is to look like something is
         still running, and there is exactly one icon on screen with nothing beside it to compare against —
         the frame-rate rule exists to stop a stuttery loop from competing with its neighbours, and here it
         has none. (⚡, 18 frames at 80ms, is the case this exception was written for.) */
      const play=at('.rb-ic') ? true
        : at('.ptab') ? false
        : at('.ln-hero h1') ? (smooth||EMOJI_TITLE_FORCE.has(m[1]))
        : (EMOJI_CRUCIAL.has(m[1])||(bigIcon&&smooth));
      const src=play?anim:anim.replace(/\.webp$/,'-s.webp');
      const img=document.createElement('img'); img.className='emo'; img.decoding='sync'; img.src=src; img.alt=m[1]; img.setAttribute('aria-hidden','true');   // sync: paint from the warm decoded cache instead of popping in async
      frag.appendChild(img); last=EMOJI_RE.lastIndex;

     skip .emo (handled above) and .emo-auto (intentional always-on, e.g. flashcard header book) */
  if(root.querySelectorAll) root.querySelectorAll('img[src*="anim-"]').forEach(function(im){
    const src=im.getAttribute('src')||'';
    im.decoding='sync';   // paint from the warm decoded cache on navigation instead of popping in late
    if(im.classList.contains('emo')||im.classList.contains('emo-auto')||im.classList.contains('ri')
      ||im.classList.contains('fc-mascot')||im.classList.contains('fc-mascot-lg')   // reactive mascot: stays animated, and its expression frames have no -s poster on disk
      ||!/anim-[\w-]*\.webp$/.test(src)||/-s\.webp$/.test(src)) return;
    im.src=src.replace(/\.webp$/,'-s.webp');
  });
}

/* Two tabs open = silent data loss. save() serialises whatever S this tab holds in memory, so an idle
   tab that has been sitting on a stale S overwrites everything the active tab earned the moment it
   saves anything at all — no merge, no warning, no way to notice. The `storage` event fires only in
   the OTHER tabs, so this is where a stale tab finds out it is stale, and adopts the newer save
   instead of clobbering it. Mid-round we do NOT swap state under the user's feet — the round's own
   result would be lost; we warn and let commitPartial()/finish() land first. */

(function(){
