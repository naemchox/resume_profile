  .tip-lnk span{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tip-lnk b{color:var(--txt)}
  .tip-lnk svg{width:14px;height:14px;flex:none}
  .tip-lnk:hover span,.tip-lnk:hover b{color:var(--acc)}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold)}
  .pill{font-size:12px;background:var(--card2);border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--mut)}
  .pill[onclick]{padding:10px 15px;font-size:13px;cursor:pointer;color:var(--txt)}
  .pill[onclick]:active{filter:brightness(.97)}
  .center{text-align:center}
  .big{font-size:42px;font-weight:800;margin:6px 0}
  .flash{min-height:120px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;text-align:center;padding:14px}
  .small{font-size:12px;color:var(--mut)}
  .lvlrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px}
  /* ============================================================================
     STUDY SECTIONS — Lesson / Tricks / How TOEIC works / Why TOEIC
     These four pages are long-form reading, not dashboard chrome, so they get an
     editorial treatment: a bounded measure (~68ch), a generous 1.8 line-height,
     and hierarchy carried by type + hairlines rather than by stacking more boxes.
     The old version put everything in a bordered card, which flattened the
     hierarchy and turned the Tricks page into a wall of gold.
     ========================================================================== */
  .ln-wrap{max-width:none}
  /* --- page header: eyebrow / serif title / lead --- */
  .ln-hero{margin:2px 0 22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .ln-eyebrow{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--acc);margin-bottom:10px}
  .ln-eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .ln-hero h1{font-family:var(--serif);font-size:31px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin-bottom:10px}
  .ln-lead{font-size:15.5px;line-height:1.75;color:var(--mut);max-width:64ch}
  .ln-lead b{color:var(--txt);font-weight:600}
  .ln-metarow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .ln-stat{display:inline-flex;align-items:baseline;gap:5px;font-size:12px;color:var(--mut);
    background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .ln-stat b{font-family:var(--serif);font-size:14px;font-weight:800;color:var(--txt)}
  .ln-stat.as-link{cursor:pointer;font:inherit;font-size:12px;color:var(--mut);gap:6px;
    transition:border-color .15s,color .15s}
  .ln-stat.as-link:hover{border-color:var(--acc)}
  .ln-stat.as-link .to{display:inline-flex;align-items:center;gap:1px;color:var(--acc);font-weight:700;
    padding-left:6px;border-left:1px solid var(--line)}   /* a divider, so the destination isn't mistaken for more of the label */
  .ln-stat.as-link svg{width:13px;height:13px;opacity:.8}
  @media(max-width:520px){ .ln-hero h1{font-size:25px} .ln-lead{font-size:14.5px} }

  /* --- combined-section tabs (Lessons|Tricks · How|Why) — reuses the .trk-f pill look --- */
  /* segmented control — same look as the Stats|Rank switcher (.ptabs) */
  /* sized to its two labels, not to the column: a full-bleed 760px purple bar was the
     heaviest block on every learn page */
  /* 4 tabs since the about-pages moved in here: sized to content (was a flat 400px, which wrapped
     "รู้จักข้อสอบ" and "ทำไมต้อง TOEIC" onto two lines and made the control ragged) */
  /* 4 tabs since the about-pages moved in here: sized to content (a flat 400px wrapped "รู้จักข้อสอบ" and
     "ทำไมต้อง TOEIC" onto two lines). Below ~430px the row is wider than the screen, so it scrolls sideways
     instead of spilling — the 4th tab used to sit past the viewport edge, unreachable. It stays half-visible
     at rest, which is the cue that the row swipes. Scrollbar hidden: 4 tabs don't need a track. */
  .ln-tabs{flex-wrap:nowrap;margin:2px 0 18px;width:max-content;max-width:100%;
    overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .ln-tabs::-webkit-scrollbar{display:none}
  .ln-tabs .ptab{padding:8px 12px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}
  .ln-tabrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 18px}   /* the row now carries the spacing the pill used to */
  .ln-tabrow .ln-tabs{margin-bottom:0}
  .ln-tabs-aside{margin-left:auto}   /* identical control, parked at the far end of the row */
  @media(max-width:520px){ .ln-tabs-aside{margin-left:0} }   /* wrapped to its own line — indenting it there would just look broken */

  /* --- lesson index: a numbered contents list, not a grid of identical cards --- */
  .ln-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .ln-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:0;border-radius:9px;
    padding:9px 8px;min-height:40px;color:var(--txt);
    transition:background .18s ease,padding-left .18s ease}
  /* no rule under each row: 46 hairlines turned the contents into graph paper. The
     number column and the spacing separate the rows on their own. */
  /* :active matters more than :hover here — this page is 46 tap targets and on iOS :hover is unreliable
     on touch, so without it a tap read as "nothing happened" until the next screen painted. */
  .ln-item:hover,.ln-item:active{background:var(--card2);padding-left:14px}
  .ln-item:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:8px}
  .ln-item .ic{font-family:var(--serif);font-size:12px;font-weight:800;line-height:1;flex-shrink:0;
    width:24px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
  .ln-item.done .ic{color:var(--ok)}
  .ln-item .nm{min-width:0;flex:1;font-weight:600;font-size:14.5px;line-height:1.45}
  .ln-item.done .nm{color:var(--mut);font-weight:500}
  .ln-item .go{flex-shrink:0;color:transparent;transition:transform .18s ease,color .18s ease}
  .ln-item:hover .go{transform:translateX(3px);color:var(--acc)}
  /* read-progress as bare text — the pill was a third shape competing on every row */
  .ln-badge{flex-shrink:0;font-size:11px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;
    background:none;padding:0}
  .ln-badge.done{color:var(--ok)}
  /* weak-skill list: a row per failing skill, worst first. The % is the whole point, so it sits in its
     own column and stays tabular — the eye compares numbers down the column instead of reading prose. */
  .wk{margin:0 0 16px}
  .wk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:13px;font-weight:700;
    color:var(--txt);margin-bottom:8px}
  .wk-sub{font-size:11.5px;font-weight:600;color:var(--mut)}
  .wk-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;
    margin-bottom:6px;color:var(--txt);font:inherit;font-size:13.5px;transition:border-color .15s}
  .wk-row:hover{border-color:var(--acc)}
  .wk-ic{flex:none;object-fit:contain}
  .wk-nm{flex:1;font-weight:600}
  .wk-v{font-variant-numeric:tabular-nums;font-weight:800;color:var(--bad);font-size:14px}
  .wk-go{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--acc);
    flex:0 1 auto;min-width:0}
  .wk-go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}   /* a long lesson title truncates instead of wrapping the row to two lines */
  .wk-go svg{width:14px;height:14px;flex:none}
  @media(max-width:520px){ .wk-go{max-width:46%} }
  /* The row the recommendation bar points at, marked where it actually lives. It borrows the bar's own
     dashed accent border on purpose: the repeated treatment is what says "this row IS that bar" without
     drawing a literal line between them. */
  .ln-item.pick{border:1px dashed rgba(var(--acc-rgb),.55);border-radius:10px;
    background:rgba(var(--acc-rgb),.05)}
  /* the same lesson the "start with your weakest skill" bar points at, marked where it actually lives —
     the bar is the shortcut, this is the answer to "why this one, and what's around it" */
  /* derived from --bad rather than a hardcoded red: the token differs between light and dark themes */
  .ln-badge.weak{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--bad) 38%,transparent);
    border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}

  /* --- lesson categories: the index is grouped by the same five skills as the
     radar. Deliberately plain — a heading, a muted part label, a read count.
     The list rows underneath carry everything else, indented so lessons read
     as children of the skill heading rather than siblings of it. --- */
  .ln-catbar{display:flex;justify-content:flex-end;margin:-6px 0 2px}
  .ln-cat{border-bottom:1px solid var(--line)}
  .ln-cat:first-of-type{border-top:1px solid var(--line)}
  .ln-cat .ln-list{margin-left:28px;padding-bottom:14px;border-top:0}
  .ln-cat:not(.open) .ln-list{display:none}
  @media(max-width:520px){ .ln-cat .ln-list{margin-left:0} }
  .ln-sec{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
    background:none;border:0;border-radius:9px;padding:15px 6px;min-height:58px;color:var(--txt);
    transition:background .15s ease}
  .ln-sec:hover,.ln-sec:active{background:var(--card2)}
  .ln-sec:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:8px}
  .ln-sec .ic{font-size:19px;line-height:1;flex-shrink:0}
  .ln-sec .ic img{width:22px;height:22px;vertical-align:-4px}
  .ln-sec h2{font-family:var(--serif);font-size:18px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.3;flex-shrink:0}
  .ln-sec .pl{font-size:12.5px;color:var(--mut);min-width:0;flex:1}
  /* Accent purple means ONE thing on this page: you can tap it. Severity is red. The heading used to go
     purple for "weak", which put the two meanings on the same colour and left the eye with nothing to
     rank. A red dot before the part label carries it instead — cheap, and it never competes with a title. */
  .wk-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);
    margin-right:7px;vertical-align:1px}
  .ln-sec .ct{flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
  .ln-sec .cv{flex-shrink:0;display:grid;place-items:center;color:var(--mut);
    transform:rotate(90deg);transition:transform .2s ease}
  .ln-cat.open .ln-sec .cv{transform:rotate(-90deg)}
  @media(max-width:520px){ .ln-sec .pl{display:none} .ln-sec h2{flex:1;min-width:0} }

  /* --- lesson sheet: ONE linear column.
     This was `columns:2` — a 2-up cheat-sheet grid, so the whole explanation fit on one screen. But the
     blocks are NUMBERED 01/02/03, and a sequence laid out sideways leaves the eye unsure whether to read
     down or across; that ambiguity, not the amount of text, is what made the lesson feel overwhelming.
     Density is the right trade for REVIEW, reading order is the right trade for a first read. --- */
  .ln-sheet{margin-top:4px}
  /* and no panel around each block: a numbered heading over a hairline, identical to .ln-h in the body
     below, so the sheet and the long-form section under it stop speaking two visual languages per page */
  .ln-blk{background:none;border:0;border-radius:0;padding:0;min-width:0;margin:0}
  .ln-blk+.ln-blk{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
  .ln-blk h3{display:flex;gap:9px;align-items:baseline;font-size:15px;font-weight:700;color:var(--txt);margin:0 0 10px;line-height:1.45}
  .ln-blk h3 .hn{font-family:var(--serif);font-size:12px;font-weight:800;color:var(--acc);flex-shrink:0}
  /* type sizes lifted with the column width — 13px was sized for a half-width panel and reads cramped full-bleed */
  .ln-blk p{font-size:14.5px;line-height:1.75;color:var(--mut);margin:0 0 10px;max-width:68ch}
  .ln-blk p b{color:var(--txt);font-weight:600}
  .ln-blk-rule{display:flex;flex-direction:column;gap:2px;padding:9px 0;font-size:13.5px;line-height:1.6;
    overflow-wrap:anywhere;border-top:1px solid var(--line);max-width:68ch}
  .ln-blk-rule:first-of-type{border-top:0;padding-top:2px}
  .ln-blk-rule .k{color:var(--txt);font-weight:600}
  .ln-blk-rule .v{color:var(--mut)}
  .ln-sheet+.ln-trap{margin-top:26px}

  /* --- long-form body: the measure is the whole point --- */
  .ln-body{font-size:15.5px;line-height:1.8;color:var(--txt);max-width:68ch}
  .ln-body p{margin:0 0 14px;color:var(--mut);line-height:1.8}
  .ln-body b{color:var(--txt);font-weight:600}
  /* section heading: numbered, hairline above — gives the page rhythm */
  .ln-h{display:flex;align-items:baseline;gap:9px;font-weight:700;font-size:15px;color:var(--txt);
    margin:30px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
  .ln-h:first-child{margin-top:6px;padding-top:0;border-top:0}
  .ln-h .hn{font-family:var(--serif);font-size:12px;font-weight:800;color:var(--acc);flex-shrink:0}

  /* --- rule rows: definition pairs, hairline-separated (was a heavy table) --- */
  .ln-rules{display:flex;flex-direction:column;margin:10px 0 4px}
  .ln-rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;
    padding:12px 2px;line-height:1.65;font-size:14px;border-top:1px solid var(--line)}
  .ln-rule:first-child{border-top:0;padding-top:2px}
  .ln-rule .k{color:var(--txt);min-width:0;overflow-wrap:anywhere}
  .ln-rule .v{color:var(--mut);min-width:0;overflow-wrap:anywhere}
  @media(max-width:640px){ .ln-rule{grid-template-columns:1fr;gap:4px} }

  /* --- examples: a ✓/✗ badge + the sentence. Colour is never the only signal. --- */
  .ln-ex{display:flex;gap:10px;align-items:flex-start;padding:9px 0 9px 13px;margin:6px 0;
    font-size:14.5px;line-height:1.65;background:none;border-left:2px solid var(--ok)}
  .ln-ex.no{border-left-color:var(--bad)}
  .ln-ex .mk{flex-shrink:0;width:auto;height:auto;background:none;
    font-size:12px;font-weight:800;color:var(--ok);margin-top:3px}
  .ln-ex.no .mk{color:var(--bad)}
  .ln-ex .t{display:block;font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.55}
  /* --- "ลองตัดสิน": the same examples, asked before they are answered.
     Unanswered rows are deliberately colourless — a green or red edge before you have chosen would
     give the answer away, which is exactly what the old always-revealed list did. --- */
  .ln-try{padding:9px 0 9px 13px;margin:6px 0;font-size:14.5px;line-height:1.65;border-left:2px solid var(--line)}
  .ln-try .q{display:block;color:var(--txt)}
  .ln-try .btns{display:flex;gap:8px;margin-top:9px}
  .ln-tryb{font:inherit;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;
    background:none;border:1px solid var(--line);border-radius:9px;padding:7px 15px;min-height:44px;
    transition:color .15s,border-color .15s,background .15s}
  .ln-tryb:hover,.ln-tryb:active{color:var(--txt);border-color:var(--mut);background:var(--card2)}
  .ln-tryb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .ln-vd{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.02em;margin-top:6px}
  .ln-vd.hit{color:var(--ok)} .ln-vd.miss{color:var(--bad)}
  .ln-score{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 4px;
    padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mut)}
  .ln-score b{color:var(--txt);font-size:15px}

  /* --- the trap callout: one per lesson, so it can afford to be loud --- */
  .ln-trap{margin-top:26px;padding:4px 0 4px 15px;font-size:14px;line-height:1.72;
    color:var(--txt);background:none;border:0;border-left:2px solid var(--gold)}
  .ln-trap .lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.09em;
    text-transform:uppercase;color:var(--gold);margin-bottom:7px}

  /* --- prev/next --- */
  .ln-nav{display:flex;gap:10px;margin-top:16px}
  .ln-nav .btn{flex:1;min-height:44px}
  .ln-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 4px;margin-bottom:6px;
    background:none;border:0;cursor:pointer;color:var(--mut);font-size:13px;font-weight:600;
    transition:color .18s ease}
  .ln-back:hover{color:var(--acc)}
  .ln-back:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}

  /* --- reading checkpoint: progress per lesson in the index, a resume banner in the
     detail page, and a live thin bar over the topnav while reading --- */
  .ln-prog{display:flex;align-items:center;gap:8px;margin-top:7px}
  .ln-prog .tr{width:92px;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
  .ln-prog .tr i{display:block;height:100%;border-radius:99px;background:var(--acc)}
  .ln-prog .pc{font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap}
  .ln-prog.done .tr i{background:var(--ok)}
  .ln-prog.done .pc{color:var(--ok)}
  .ln-resume{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    margin:0 0 16px;padding:12px 14px;min-height:44px;border-radius:11px;font-size:13.5px;font-weight:600;
    color:var(--txt);background:var(--card2);border:1px dashed var(--acc);transition:background .18s ease}
  .ln-resume:hover{background:var(--card)}
  .ln-resume:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .ln-resume .go{margin-left:auto;color:var(--acc);flex-shrink:0}
  /* the finished-everything variant states a fact rather than offering an action — green edge, no chevron */
  .ln-resume.done{border-style:solid;border-color:var(--ok);cursor:default;background:none}
  .ln-scrollbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:31;pointer-events:none}
  .ln-scrollbar i{display:block;height:100%;width:0;background:var(--acc)}

  /* --- lesson → practice: the 10-question drill callout at the end of a lesson --- */
  /* one calm footer row: the practice CTA is the only filled button on the page,
     "mark as read" sits beside it as a quiet ghost — three stacked purple bars in
     three grey boxes was the single loudest thing in the lesson */
  .ln-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
  .ln-end .btn{width:auto;min-height:44px;flex-shrink:0;padding:12px 18px}
  @media(max-width:560px){ .ln-end{gap:10px} .ln-end .btn,.ln-done{width:100%} .ln-done .btn{width:100%} }
  .ln-drill{flex:1;min-width:200px;margin:0;padding:0;background:none;border:0;text-align:left}
  .ln-drill .t{font-weight:700;font-size:15px;margin-bottom:2px}
  .ln-drill .s{font-size:13px;color:var(--mut);line-height:1.6}
  .ln-done{margin:0;padding:0;background:none;border:0;text-align:left}
  .ln-done.on .btn{color:var(--ok);border-color:rgba(46,158,91,.45)}
  .ln-done.pop{animation:lnDonePop .55s cubic-bezier(.34,1.56,.64,1)}
  @keyframes lnDonePop{0%{transform:scale(.9)}55%{transform:scale(1.04)}100%{transform:scale(1)}}

  /* ---- TRICKS ----
     68 tactics is a long read, so each trick is one calm card: neutral surface, a clear
     title, the instruction body, and the "why" tucked into a quiet inset. Every card
     carries one crisp indigo outline (red for myths); the ⭐ badge marks starred. */
  /* parks below the navbar (61px + whatever the notch adds), not at 0. It was written for a page where
     nothing stuck, so top:0 was harmless; once sticky started working it would have sat underneath the
     navbar's z-index 30 and become unclickable. */
  .trk-bar{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:9;display:flex;gap:7px;flex-wrap:wrap;padding:11px 0;margin-bottom:4px;
    background:var(--bg);border-bottom:1px solid var(--line)}
  .trk-f{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:7px 15px;border-radius:999px;
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--mut);
    background:var(--card);border:1px solid var(--line);transition:all .18s ease}
  .trk-f:hover{border-color:var(--acc);color:var(--txt)}
  .trk-f:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  /* the active filter is tinted, not filled: a solid chip fought the segmented tab
     bar directly above it for "the one purple thing on the page" */
  .trk-f.on{background:rgba(var(--acc-rgb),.14);border-color:rgba(var(--acc-rgb),.45);color:var(--acc)}
  /* quiet text actions at the right of the filter bar (expand all / full text) */
  .trk-lnk{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:7px 10px;
    background:none;border:0;cursor:pointer;color:var(--mut);font-size:12.5px;font-weight:700;
    transition:color .15s ease}
  .trk-lnk:hover{color:var(--acc)}
  .trk-lnk:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
  /* groups are accordions: closed by default (one open on arrival) so the page
     arrives as ~9 headings instead of 68 open cards */
  /* groups are accordions: closed by default (one open on arrival) so the page
     arrives as ~9 headings instead of 68 open cards */
  .trk-grp{margin-top:0;border-bottom:1px solid var(--line)}
  .trk-grp:first-of-type{border-top:1px solid var(--line)}
  .trk-grp-h{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
    background:none;border:0;border-radius:9px;padding:15px 6px;min-height:56px;color:var(--txt);
    transition:background .15s ease}
  .trk-grp-h:hover{background:var(--card2)}
  .trk-grp-h:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:8px}
  .trk-grp-h .ic{font-size:20px;line-height:1;flex-shrink:0}
  .trk-grp-h h3{flex:1;min-width:0;font-size:15.5px;font-weight:800;margin:0;line-height:1.35}
  .trk-grp-h .ct{flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
  .trk-grp-h .cv{flex-shrink:0;display:grid;place-items:center;color:var(--mut);
    transform:rotate(90deg);transition:transform .2s ease}
  .trk-grp.open .trk-grp-h .cv{transform:rotate(-90deg)}
  .trk-grp.open .trk-grp-h{background:transparent}
  .trk-grp:not(.open) .trk-grp-body{display:none}
  .trk-grp-body{padding-bottom:16px}
  /* subtitle + trick rows indent under the group heading (same nesting as the
     lessons index) so only the category name holds the left margin */
  .trk-grp-s{font-size:13.5px;line-height:1.65;color:var(--mut);margin:0 0 12px 31px;max-width:64ch}
  /* default view: one calm row per tactic — title only, body opens in the reader popup */
  .trk-rows{display:flex;flex-direction:column;margin-left:31px;border-top:1px solid var(--line)}
  .trk-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:0;border-radius:9px;
    padding:10px 8px;min-height:42px;color:var(--txt);
    transition:background .16s ease,padding-left .16s ease}
  .trk-row:hover{background:var(--card2);padding-left:14px}
  .trk-row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:8px}
  .trk-row .n{flex-shrink:0;min-width:18px;font-family:var(--serif);font-size:12px;font-weight:800;
    color:var(--mut);font-variant-numeric:tabular-nums}
  .trk-row .t{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.5}
  .trk-row .st{flex-shrink:0;font-size:11px;line-height:1}
  .trk-row .go{flex-shrink:0;color:transparent;transition:transform .16s ease,color .16s ease}
  .trk-row:hover .go{transform:translateX(3px);color:var(--acc)}
  .trk-row.myth .t{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(240,82,44,.5)}
  @media(max-width:520px){ .trk-grp-s{margin-left:0} .trk-rows{margin-left:0} }
  .trk-star{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
    background:rgba(202,138,4,.13);border-radius:999px;padding:3px 8px;white-space:nowrap}
  .trk.myth:hover{border-color:var(--bad)}
  .trk.myth .trk-h{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(240,82,44,.5)}

  /* ---- single-trick reader popup: one trick per screen, text zoomable via A−/A+ ----
     All type inside .tp-body is em-based, so changing the wrapper's font-size zooms
     title, body and the why-inset together. */
  .modal.trk-modal{width:min(680px,94vw);max-height:min(84vh,760px);overflow:auto;padding:0;overscroll-behavior:contain}
  .tp-top{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);padding:13px 18px;border-bottom:1px solid var(--line)}
  .tp-grp{font-size:12.5px;font-weight:700;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tp-ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .tp-zl{min-width:42px;text-align:center;font-size:12px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
  .tp-x{margin-left:6px}
  .tp-body{padding:18px 22px 24px;font-size:16px}
  .tp-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:1.25em;font-weight:800;line-height:1.5;margin-bottom:.6em}
  .tp-h.myth{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(240,82,44,.5)}
  .tp-b{font-size:1em;line-height:1.85;color:var(--txt)}
  .tp-w{display:flex;gap:.55em;margin-top:1em;padding:.7em .85em;border-radius:9px;background:var(--card2);
    color:var(--mut);font-size:.9em;line-height:1.7}
  .tp-w .wl{flex-shrink:0;font-weight:700;color:var(--acc)}

  /* ---- HOW TOEIC WORKS: part cards as a Listening/Reading timeline ---- */
  .sec-rule{display:flex;align-items:center;gap:11px;margin:30px 0 14px}
  .sec-rule .lb{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:var(--txt);white-space:nowrap}
  .sec-rule .mt{font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
  .sec-rule::after{content:"";flex:1;height:1px;background:var(--line)}
  .pcard{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;
    padding:17px;margin-bottom:11px;border-radius:14px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--sh1);transition:border-color .18s ease,box-shadow .18s ease}
  .pcard:hover{border-color:var(--acc);box-shadow:var(--sh2)}
  .pcard .pn{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px;flex-shrink:0}
  .pcard .pn .lab{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  .pcard .pn .no{font-family:var(--serif);font-size:29px;font-weight:800;line-height:1;color:var(--acc)}
  .pcard .pn .em{font-size:17px;margin-top:3px}
  .pcard h3{font-size:16px;margin:0 0 3px}
  .pcard .q{font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:9px}
  .pcard .wh{font-size:14px;line-height:1.7;color:var(--mut);margin-bottom:12px}
  .pspec{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .pspec div{background:var(--card);padding:9px 11px}
  .pspec .k{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
  .pspec .v{font-size:13px;line-height:1.5;color:var(--txt);font-weight:600}
  .ptodo{display:flex;gap:9px;font-size:13.5px;line-height:1.7;padding:11px 13px;border-radius:10px;
    background:rgba(var(--acc-rgb),.07);color:var(--txt)}
  .ptodo .pl{flex-shrink:0;font-weight:800;color:var(--acc)}
  @media(max-width:520px){ .pcard{grid-template-columns:1fr;gap:10px}
    .pcard .pn{flex-direction:row;align-items:baseline;gap:8px;width:auto}
    .pcard .pn .no{font-size:24px} }

  /* ---- the seven parts as a foldable list ----
     A hairline row, not a card: seven bordered panels stacked was 62% of the page's height, and a
     panel per row is the box-per-item look the flat language drops in favour of rules between rows. */
  .pfold{border-bottom:1px solid var(--line)}
  .pfold:first-of-type{border-top:1px solid var(--line)}
  .pfold-h{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font:inherit;cursor:pointer;
    background:none;border:0;padding:13px 6px;min-height:52px;color:var(--txt);transition:background .16s ease}
  .pfold-h:hover,.pfold-h:active{background:var(--card2)}
  .pfold-h:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:8px}
  .pfold-h .pn{display:flex;align-items:baseline;gap:5px;flex-shrink:0;width:54px}
  .pfold-h .pn .lab{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
  .pfold-h .pn .no{font-family:var(--serif);font-size:19px;font-weight:800;line-height:1;color:var(--acc)}
  .pfold-h .em{font-size:15px;flex-shrink:0}
  .pfold-h .nm{font-size:14.5px;font-weight:700;flex:1;min-width:0}
  .pfold-h .q{font-size:12px;color:var(--mut);font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
  .pfold-h .cv{color:var(--mut);flex-shrink:0;transition:transform .2s ease}
  .pfold.open .pfold-h .cv{transform:rotate(90deg)}
  .pfold:not(.open) .pfold-b{display:none}
  .pfold-b{padding:2px 6px 16px}
  .pfold-b .wh{font-size:14px;line-height:1.7;color:var(--mut);margin:0 0 12px;max-width:68ch}
  @media(max-width:520px){ .pfold-h{gap:8px} .pfold-h .nm{font-size:13.5px} .pfold-h .em{display:none} }

  /* ---- WHY TOEIC: the score ladder ---- */
  .ladder{position:relative;padding-left:26px}
  .ladder::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;border-radius:2px;
    background:linear-gradient(180deg,var(--line),var(--acc))}
  .band{position:relative;padding:16px 0 20px;border-bottom:1px solid var(--line)}
  .band:last-child{border-bottom:0;padding-bottom:4px}
  .band::before{content:"";position:absolute;left:-24px;top:24px;width:10px;height:10px;border-radius:50%;
    background:var(--card);border:2px solid var(--line)}
  .band.here::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px rgba(202,138,4,.2)}
  .band-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .band-sc{font-family:var(--serif);font-size:25px;font-weight:800;line-height:1;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}
  .band.here .band-sc{color:var(--gold)}
  .band-cefr{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:999px;
    background:var(--card2);border:1px solid var(--line);color:var(--mut)}
  .band-you{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;
    border-radius:999px;background:var(--gold);color:#2a2205}   /* dark ink — white-on-gold fails contrast, badly so on the bright dark-mode gold */
  .band-can{font-size:14.5px;line-height:1.75;color:var(--txt);margin-bottom:10px;max-width:66ch}
  .band-use{display:flex;gap:8px;font-size:13px;line-height:1.7;color:var(--mut);max-width:66ch}
  .band-use .ul{flex-shrink:0;font-weight:700;color:var(--txt)}
  .band-use b{color:var(--txt)}
  /* requirements: a source-caveat list, deliberately sober */
  /* Each entry is a stack of separate facts, not a paragraph: an org line, the number that matters,
     then the caveats. Written as one run-on sentence it read as a wall — you had to parse prose to
     find "650", which is the only thing anyone opens this section for. */
  .req{padding:15px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.7}
  .req:last-child{border-bottom:0}
  .req .k{display:flex;gap:8px;align-items:baseline;font-weight:700;color:var(--txt);margin-bottom:7px}
  .req .v{color:var(--mut)}
  .req .v b{color:var(--txt)}
  .req-lead{color:var(--txt);margin-bottom:4px}      /* the headline fact — usually the score itself */
  .req-lead b{font-size:15.5px}
  .req-li{display:flex;gap:9px;color:var(--mut);font-size:13.5px;padding:1px 0}
  .req-li::before{content:"";flex:none;width:4px;height:4px;border-radius:50%;background:var(--acc);
    opacity:.5;margin-top:9px}
  .req.warn{background:rgba(202,138,4,.07);border:1px solid rgba(202,138,4,.3);border-radius:11px;
    padding:13px 15px;margin-bottom:6px}

  /* visually hidden, still read aloud — the ✓/✗ badge is decorative, so the
     correct/incorrect meaning has to reach a screen reader some other way */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* honour motion preferences across all four pages */
  @media(prefers-reduced-motion:reduce){
    .ln-item,.ln-item .go,.trk-f,.pcard,.ln-back{transition:none!important}
    .ln-item:hover{padding-left:8px}
    .ln-item:hover .go{transform:none}
  }
  /* bottom-centred: the top bar is sticky, and a toast up there covered (and blocked clicks on) the nav */
  .toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%) translateY(80px);background:var(--card);
    border:1px solid var(--acc);color:var(--txt);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:40;box-shadow:var(--sh2);
    pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-weight:600}
  .tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--mut)}
  .speaker{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card2);border:1px dashed var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
  .speaker .wave{font-size:40px}
  .audiobtns{display:flex;gap:10px}
  .mini{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;box-shadow:var(--sh1)}
  .mini:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .weaklist{border-top:1px solid var(--line);padding-top:7px;margin-top:3px}
  .acc-split{display:flex;gap:10px;margin:2px 0 2px}
  .acc-split .as{flex:1 1 0;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 4px}
  .acc-split .asv{font-size:20px;font-weight:800;color:var(--txt);line-height:1.1}
  .acc-split .asl{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px}
  .pbreak{margin-top:4px}
  .p-sec{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;margin:14px 0 6px}
  .p-sec:first-child{margin-top:2px}
  .prow{display:flex;align-items:center;gap:11px;margin:9px 0}
  .prow.weak{background:rgba(240,82,44,.06);border-radius:11px;margin:9px -8px;padding:8px}
  .p-tag{flex:0 0 auto;width:27px;height:27px;border-radius:8px;border:1px solid;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
  .p-mid{flex:1;min-width:0}
  .p-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
  .p-nm{font-size:12.5px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv{flex:0 0 auto;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
  .pv small{color:var(--mut);font-weight:600;font-size:10.5px;margin-left:5px}
  .p-bar{height:7px;background:var(--track);border-radius:99px;overflow:hidden}
  .p-bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
  .p-weak{font-size:9px;font-weight:800;color:var(--bad);background:rgba(240,82,44,.14);padding:2px 6px;border-radius:99px;margin-left:7px;letter-spacing:.3px;vertical-align:1px}
  .p-tip{margin-top:14px;background:rgba(var(--acc-rgb),.08);border:1px solid rgba(var(--acc-rgb),.25);border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--txt)}
  .p-tip b{color:var(--acc)}
  .weakrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
  .weakrow .lbl{width:108px;flex:0 0 auto;color:var(--mut);white-space:nowrap}
  .weakrow .bar{flex:1;margin:0;min-width:20px}
  .weakrow .bar.na{background:transparent;border:1px dashed var(--line)}
  .weakrow .pct{flex:0 0 auto;width:46px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .weakrow-sub{font-size:11px;color:var(--mut);margin:-3px 0 7px 116px}
  .weakrow .pct.na{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.1px}
  /* unified skill row: icon + name + level + accuracy bar (colour = rank) in ONE line */
  .skrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .skrow:first-child{border-top:0}
  .sk-ic{font-size:22px;width:26px;text-align:center;flex:none;line-height:1}
  .sk-main{flex:1;min-width:0}
  .sk-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .sk-nm{font-weight:700;font-size:14px}
  .sk-lv{font-size:11.5px;font-weight:800;color:var(--acc);flex:none}
  .sk-lv.zero{color:var(--mut)}
  .sk-bar{height:9px;background:var(--track);border-radius:9px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.04)}
  .sk-bar>i{display:block;height:100%;border-radius:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:width .5s}
  .sk-acc{flex:none;width:46px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
  .sk-acc.na{font-size:11px;font-weight:600;color:var(--mut)}
  .sk-smp{font-size:10px;font-weight:600;color:var(--mut)}
  .empty-stats{text-align:center;padding:38px 22px}
  .empty-stats .es-ic{font-size:44px;line-height:1;margin-bottom:6px}
  /* XP-by-type breakdown rows */
  .xprow{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:13px}
  .xprow .xl{width:118px;display:flex;align-items:center;gap:6px;font-weight:600}
  .xprow .xl img.ae{width:1.15em;height:1.15em}
  .xprow .bar{flex:1;margin:0;height:8px}
  .xprow .xv{width:74px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .xprow .xv small{color:var(--mut);font-weight:600}
  /* "XP added" banner on the round-complete screen */
  .xp-added{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 12px;margin-top:12px}
  .xp-added .xa-pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;
    font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(var(--acc-rgb),.25)}
  .xp-added .xa-total{font-size:13px;color:var(--mut);font-weight:600}
  .xp-added .xa-total b{color:var(--txt);font-weight:800}
  .set-lbl{font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:6px}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .set-row .set-lbl{margin-bottom:0}
  .set-div{height:1px;background:var(--line);margin:16px 0}
  /* Settings page: header and card share ONE 560px column so the title/close align with the card edges */
  .set-wrap{max-width:560px;margin:0 auto}
  .set-wrap .top{margin-bottom:12px}
  .set-sec+.set-sec{margin-top:16px}
  .set-help{font-size:12px;color:var(--mut);margin:8px 0 0;line-height:1.5}
  /* low-weight rows for one-off destinations — they shouldn't compete with real settings controls */
  .set-link{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    font:inherit;font-weight:600;font-size:14px;text-align:left;color:var(--txt);background:none;
    border:0;border-radius:10px;padding:11px 10px;margin:0 -10px;cursor:pointer;transition:background .15s}
  .set-link+.set-link{box-shadow:inset 0 1px 0 var(--line)}
  .set-link:hover{background:var(--card2)}
  .set-link>span{color:var(--mut);font-size:17px;line-height:1}
  .set-link.danger{color:var(--bad)}
  .set-link.danger:hover{background:rgba(239,68,68,.08)}
  .dbtn.danger{color:var(--bad);border-color:var(--bad)}
  .dbtn.danger:hover{background:rgba(240,82,44,.08)}
  .langtog{display:flex;gap:6px;margin-bottom:9px}
  .langtog .lt{flex:1 1 0}
  .lt{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;min-height:40px;min-width:72px;text-align:center;line-height:1.2}
  .lt.on{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.08)}
  .opt.sel{border-color:var(--acc);background:rgba(var(--acc-rgb),.10)}
  .opt.yours{border-color:var(--bad);background:rgba(var(--bad-rgb),.08)}
  .passage{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;max-height:300px;overflow:auto}
  .pq{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .pq:first-of-type{border-top:none;padding-top:0}
  .photo{width:100%;border-radius:12px;margin-bottom:14px;display:block;border:1px solid var(--line)}
  /* Part 1 only: picture on the left, choices on the right */
  .p1row{display:flex;gap:18px;align-items:flex-start}
  .p1row .p1pic{flex:1 1 50%;min-width:0}
  .p1row .p1side{flex:1 1 50%;min-width:0}
  .p1row .p1pic .photo{margin-bottom:10px}
  @media (max-width:640px){.p1row{flex-direction:column}.p1row .p1pic,.p1row .p1side{flex:1 1 auto;width:100%}}
  /* Part 6 Text Completion: passage on the left, questions on the right */
  .p6row{display:flex;gap:18px;align-items:flex-start}
  .p6row .p6pass{flex:1 1 46%;min-width:0;position:sticky;top:76px}
  .p6row .p6pass .passage{max-height:calc(100dvh - 100px);margin-bottom:0}
  .p6row .p6side{flex:1 1 54%;min-width:0}
  .p6row .p6side .pq:first-of-type{margin-top:0;padding-top:0;border-top:none}
  @media (max-width:640px){.p6row{flex-direction:column}.p6row .p6pass,.p6row .p6side{flex:1 1 auto;width:100%}.p6row .p6pass{position:static}.p6row .p6pass .passage{max-height:300px;margin-bottom:14px}}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:6px}
  .qcell{min-height:34px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-radius:6px;background:var(--card2);border:1px solid var(--line);cursor:pointer;color:var(--mut)}
  .qcell.done{background:rgba(var(--acc-rgb),.14);color:var(--acc);border-color:var(--acc)}
  .qcell.cur{outline:2px solid var(--gold)}
  .qcell.ok{background:rgba(var(--ok-rgb),.14);border-color:var(--ok);color:var(--ok)}
  .qcell.no{background:rgba(var(--bad-rgb),.12);border-color:var(--bad);color:var(--bad)}
  .examhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .rev{border-bottom:1px solid var(--line);padding:14px 0}
  .rev:last-child{border:none}
  .scoreboard{display:flex;gap:12px;justify-content:center;margin:10px 0}
  .sb{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:center;min-width:96px}
  .sb .n{font-size:24px;font-weight:800;color:var(--gold)}
  .sb .l{font-size:12px;color:var(--mut)}
  .bdg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
  .bdg-card{border-radius:14px;padding:14px 10px;text-align:center;border:1px solid var(--line);background:var(--card2);transition:.15s;position:relative}
  .bdg-card.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(var(--acc-rgb),.09),rgba(var(--acc-rgb),.06));box-shadow:0 2px 12px rgba(var(--acc-rgb),.12)}
  .bdg-card.off{opacity:.5;filter:grayscale(1)}
  .bdg-ic{font-size:32px;line-height:1;margin-bottom:7px}
  .bdg-nm{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:4px}
  .bdg-ds{font-size:11px;color:var(--mut);line-height:1.4}
  .bdg-card.on .bdg-ds{color:var(--ok)}

  /* Skill level tiles (replaces achievements) */
  .lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
  .lvl-card{border-radius:14px;padding:16px 10px 13px;text-align:center;border:1px solid var(--line);background:var(--card2);position:relative}
  .lvl-card.started{border-color:var(--acc);background:linear-gradient(135deg,rgba(var(--acc-rgb),.08),rgba(var(--acc-rgb),.05))}
  .lvl-card.new{opacity:.65}
  .lvl-ic{font-size:32px;line-height:1;margin-bottom:6px}
  .lvl-nm{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:4px}
  .lvl-badge{display:inline-flex;align-items:baseline;gap:4px;color:var(--acc);font-weight:800}
  .lvl-badge .lb-t{font-size:12px}
  .lvl-badge .lb-n{font-size:24px;line-height:1}
  .lvl-bar{height:5px;background:var(--track);border-radius:5px;overflow:hidden;margin:8px 6px 6px}
  .lvl-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:5px;transition:.4s}
  .lvl-ds{font-size:11px;color:var(--mut);line-height:1.4}

  /* Animated Noto emoji (googlefonts.github.io/noto-emoji-animation) — local assets in emoji/ */
  .ae{height:1em;width:1em;vertical-align:-.15em;object-fit:contain;display:inline-block;margin:0 .02em}

  /* Accessibility: visible keyboard focus */
  .opt:focus-visible,.btn:focus-visible,.mini:focus-visible,.mode:focus-visible,.lt:focus-visible,.pill[onclick]:focus-visible,.qcell:focus-visible,.logo:focus-visible,
  .dbtn:focus-visible,.qchip:focus-visible,.rt-btn:focus-visible,.ptab:focus-visible,.rbtn:focus-visible,.rank-cta:focus-visible,.est-btn:focus-visible,
  .nav-profile:focus-visible,.rank-card:focus-visible,.rm-card:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}

  /* ===== Embedded TOEIC Vocab 1000 flashcards (scoped, light) ===== */
  #flashApp{
    --fc-card:#ffffff; --fc-ink:#0f172a; --fc-muted:#64748b; --fc-accent:#4f46e5;
    --fc-gold:#4f46e5;
    display:flex; flex-direction:column; align-items:center; color:var(--txt);
    background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:18px 14px 16px; margin-bottom:14px; box-shadow:var(--sh2);
  }
  #flashApp *{box-sizing:border-box}
  #flashApp h1{font-size:18px; margin:0 0 2px; letter-spacing:.3px; color:var(--txt)}
  #flashApp .sub{color:var(--mut); font-size:13px; margin-bottom:16px}
  #flashApp .toolbar{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin-bottom:14px; max-width:760px}
  #flashApp select,#flashApp button{font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); padding:8px 12px; cursor:pointer; transition:.15s; width:auto}
  #flashApp button:hover,#flashApp select:hover{border-color:var(--fc-accent)}
  #flashApp button:active{transform:translateY(1px)}
  #flashApp .pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--mut); padding:6px 10px; border:1px solid var(--line); border-radius:999px; cursor:default; background:transparent}
  #flashApp .stats{display:flex; gap:14px; font-size:13px; color:var(--mut); margin-bottom:14px}
  #flashApp .stats b{color:var(--txt)}
  #flashApp .stats .g{color:var(--ok)} #flashApp .stats .w{color:var(--bad)}
  #flashApp .scene{width:min(460px,92vw); height:300px; perspective:1400px; margin-bottom:8px}
  #flashApp .card{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.7,.2,1); cursor:pointer; background:transparent; border:none; border-radius:0; padding:0; margin:0; box-shadow:none}
  #flashApp .card.flipped{transform:rotateY(180deg)}
  #flashApp .face{position:absolute; inset:0; backface-visibility:hidden; background:var(--fc-card); color:var(--fc-ink); border:1px solid var(--line); border-radius:18px; box-shadow:0 8px 28px rgba(0,0,0,.28); display:flex; flex-direction:column; justify-content:center; align-items:center; padding:28px; text-align:center}
  #flashApp .face.back{transform:rotateY(180deg)}
  #flashApp .tier-tag{position:absolute; top:14px; left:16px; font-size:11px; font-weight:600; letter-spacing:.4px; color:var(--fc-accent); background:rgba(var(--acc-rgb),.08); padding:4px 10px; border-radius:999px}
  #flashApp .idx{position:absolute; top:14px; right:16px; font-size:12px; color:var(--fc-muted)}
  #flashApp .word{font-size:40px; font-weight:800; line-height:1.05; margin:6px 0; color:var(--fc-ink)}
  #flashApp .pos{font-size:15px; color:var(--fc-gold); font-weight:600}
  #flashApp .hint{position:absolute; bottom:14px; font-size:11px; color:var(--fc-muted)}
  #flashApp .thai{font-size:28px; font-weight:700; margin:2px 0 14px; color:var(--fc-ink); font-family:"Thonburi","Sukhumvit Set",-apple-system,sans-serif}
  #flashApp .ex{font-size:16px; color:var(--fc-muted); font-style:italic; max-width:90%}
  #flashApp .ex .hl{background:rgba(var(--acc-rgb),.12); border-radius:4px; padding:0 2px; font-style:normal; font-weight:600; color:var(--fc-accent)}
  #flashApp .nav{display:flex; gap:10px; align-items:center; margin-top:14px}
  #flashApp .nav button{min-width:46px}
  #flashApp .big{padding:10px 18px; font-weight:600}
  #flashApp .know{border-color:#a7dcbd; background:#eef6ef; color:#2f7d55}
  #flashApp .know:hover{border-color:#2f9e63}
  #flashApp .relearn{border-color:#e6a89f; background:#f7ece9; color:#c0392b}
  #flashApp .relearn:hover{border-color:#d0463a}
  #flashApp .grades{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(460px,92vw); margin-top:12px}
  #flashApp .grades[hidden]{display:none}   /* class display:grid would otherwise override the hidden attribute */
  #flashApp .flip-hint{color:var(--mut); font-size:12.5px; font-weight:600}
  /* Study / Test mode toggle + quiz */
  #flashApp .fc-mode{display:inline-flex; gap:4px; background:var(--card2); border:1px solid var(--line); border-radius:99px; padding:4px; margin-bottom:14px}
  #flashApp .fc-mode button{border:0; background:transparent; color:var(--mut); font-weight:800; font-size:13.5px; padding:8px 20px; border-radius:99px; cursor:pointer}
  #flashApp .fc-mode button.on{background:var(--acc); color:#fff}
  #flashApp.testmode .scene, #flashApp.testmode .nav, #flashApp.testmode .grades{display:none}
  #flashApp:not(.testmode) .fc-quiz{display:none}
  #flashApp .fc-quiz{width:min(460px,92vw); margin:6px auto 0}
  #flashApp .q-word{font-size:30px; font-weight:900; font-family:var(--serif); margin-bottom:2px}
  #flashApp .q-sub{color:var(--mut); font-size:12.5px; margin-bottom:16px}
  #flashApp .q-opts{display:flex; flex-direction:column; gap:9px}
  #flashApp .qopt{padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--txt); font-weight:700; font-size:15px; cursor:pointer; text-align:left; transition:.12s}
  #flashApp .qopt:hover:not(:disabled){border-color:var(--acc)}
  #flashApp .qopt.correct{border-color:#2f9e63; background:rgba(var(--ok-rgb),.14); color:#2f9e63}
  #flashApp .qopt.wrong{border-color:#e0554a; background:rgba(var(--bad-rgb),.13); color:#e0554a}
  #flashApp .qopt-tr{display:block; margin-top:3px; font-size:12.5px; font-weight:600; color:var(--mut); opacity:.9}
  #flashApp .q-next{display:block; width:100%; margin-top:14px; padding:13px 16px; border:0; border-radius:12px;
    background:var(--ink1); color:var(--onink); font-weight:800; font-size:15px; cursor:pointer;
    animation:qNextIn .22s ease both}
  #flashApp .q-next:hover{background:var(--ink2)}
  #flashApp .q-next:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45); outline-offset:2px}
  @keyframes qNextIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ #flashApp .q-next{animation:none} }
  #flashApp .q-ex{min-height:20px; margin-top:14px; font-size:14px; font-weight:700; line-height:1.5}
  #flashApp .gbtn{display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px; border-radius:12px; border:1px solid var(--line); cursor:pointer; font-weight:800; font-size:14px; line-height:1.1}
  #flashApp .gbtn small{font-size:11px; font-weight:600; opacity:.85}
  #flashApp .gbtn.again{border-color:#e6a89f; background:#f7ece9; color:#c0392b}
  #flashApp .gbtn.hard{border-color:#e6cfa0; background:#f7f1e4; color:#a5762a}
  #flashApp .gbtn.good{border-color:#a7dcbd; background:#eef6ef; color:#2f7d55}
  #flashApp .gbtn.easy{border-color:#a9c4ea; background:#e9f0fb; color:#3a63c0}
  #flashApp .gbtn:hover{filter:brightness(.97); transform:translateY(-1px)}
  :root[data-theme="dark"] #flashApp .qopt.correct{border-color:#2e6b48; background:rgba(87,207,144,.13); color:#57cf90}
  :root[data-theme="dark"] #flashApp .qopt.wrong{border-color:#6f3b3b; background:rgba(239,106,90,.14); color:#ef6a5a}
  :root[data-theme="dark"] #flashApp .gbtn.again{border-color:#6f3b3b; background:rgba(239,106,90,.14); color:#ef6a5a}
  :root[data-theme="dark"] #flashApp .gbtn.hard{border-color:#6b5a30; background:rgba(217,154,43,.14); color:#e0a63a}
  :root[data-theme="dark"] #flashApp .gbtn.good{border-color:#2e6b48; background:rgba(87,207,144,.13); color:#57cf90}
  :root[data-theme="dark"] #flashApp .gbtn.easy{border-color:#324e7a; background:rgba(96,140,230,.15); color:#7aa0ee}

  /* ---- History mode: cards bucketed by the grade you last gave them ---- */
  #flashApp.histmode .scene, #flashApp.histmode .nav, #flashApp.histmode .grades,
  #flashApp.histmode .fc-quiz, #flashApp.histmode .fc-bar, #flashApp.histmode .toolbar,
  #flashApp.histmode .stats, #flashApp.histmode .done{display:none}
  #flashApp:not(.histmode) .fc-hist{display:none}
  #flashApp .fc-hist{width:min(620px,94vw); margin:2px auto 0; text-align:left}
  #flashApp .hb{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px}
  #flashApp .hb .gbtn{opacity:.5; transition:opacity .15s, box-shadow .15s}
  #flashApp .hb .gbtn.sel{opacity:1; box-shadow:inset 0 0 0 2px currentColor}
  #flashApp .hact{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px}
  #flashApp .hact .cnt{font-size:13px; color:var(--mut)}
  #flashApp .hact-r{display:flex; align-items:center; gap:10px}
  #flashApp .hact .btn{width:auto; padding:8px 14px; font-size:13px}
  #flashApp .hact .lnk{border:0; background:none; padding:4px; cursor:pointer;
    font-size:12.5px; font-weight:700; color:var(--mut); text-decoration:underline; text-underline-offset:3px}
  #flashApp .hact .lnk:hover{color:var(--bad)}

  /* "you're studying a History bucket" bar — the way back to the full 1000-word queue */
  #flashApp .fc-src{display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:min(460px,92vw); margin:0 auto 12px; padding:9px 10px 9px 13px;
    border:1px dashed var(--line); border-radius:12px; background:var(--card2)}
  #flashApp .fc-src[hidden]{display:none}
  #flashApp .fc-src .fs-t{font-size:13px; color:var(--mut); font-weight:600}
  #flashApp .fc-src .fs-t b{font-weight:800}
  #flashApp .fc-src .fs-t b.again{color:#c0392b} #flashApp .fc-src .fs-t b.hard{color:#a5762a}
  #flashApp .fc-src .fs-t b.good{color:#2f7d55}  #flashApp .fc-src .fs-t b.easy{color:#3a63c0}
  #flashApp .fc-src button{flex:none; border:1px solid var(--line); background:var(--card); color:var(--txt);
    font-weight:700; font-size:12.5px; padding:7px 12px; border-radius:99px; cursor:pointer}
  #flashApp .fc-src button:hover{border-color:var(--acc); color:var(--acc)}
  :root[data-theme="dark"] #flashApp .fc-src .fs-t b.again{color:#ef6a5a}
  :root[data-theme="dark"] #flashApp .fc-src .fs-t b.hard{color:#e0a63a}
  :root[data-theme="dark"] #flashApp .fc-src .fs-t b.good{color:#57cf90}
  :root[data-theme="dark"] #flashApp .fc-src .fs-t b.easy{color:#7aa0ee}
  #flashApp .hrow{display:flex; align-items:center; gap:9px; padding:11px 13px; margin-bottom:7px;
    border:1px solid var(--line); border-radius:12px; background:var(--card)}
  #flashApp .hrow .hw{font-weight:800; font-size:15px; flex:none}
  #flashApp .hrow .hp{font-size:12px; font-weight:700; color:var(--gold); flex:none}
  #flashApp .hrow .hm{flex:1; min-width:0; font-size:13.5px; color:var(--mut);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #flashApp .hrow .hd{flex:none; font-size:12px; color:var(--mut)}
  #flashApp .hempty{padding:28px 10px; text-align:center; font-size:14px; color:var(--mut)}
  @media (max-width:560px){
    #flashApp .hb{grid-template-columns:repeat(2,1fr)}
    #flashApp .hrow .hm{flex-basis:100%; order:3; white-space:normal}
  }
  #flashApp .stats .n{color:var(--acc)}
  #flashApp .fc-bar{width:min(460px,92vw); height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:16px}
  #flashApp .fc-bar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .3s}
  #flashApp .foot{color:var(--mut); font-size:11px; margin-top:16px; text-align:center; max-width:600px; line-height:1.7}
  #flashApp kbd{background:var(--card2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:11px; color:var(--txt)}
  #flashApp .done{font-size:14px; color:var(--ok); margin-top:10px; min-height:18px}

  /* Navbar language switch */
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .lang-switch button{border:none;background:var(--card);color:var(--mut);font-weight:700;font-size:12px;
    padding:7px 10px;cursor:pointer;transition:.15s;min-width:44px;text-align:center}
  .lang-switch button+button{border-left:1px solid var(--line)}
  .lang-switch button.on{background:var(--acc);color:var(--onink)}
  .lang-switch button:not(.on):hover{background:var(--card2);color:var(--txt)}

  /* Theme wipe — the new theme sweeps over the old as a circle growing out of the toggle button.
     NB: do NOT crossfade light↔dark. Fading text and background at once drags both to the same mid-grey
     halfway through (measured: contrast 16.8 → 1.1 → 16.8), which reads as the text flickering out.
     A wipe never blends the two themes, so every pixel stays at full contrast on both sides of the edge. */
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  :root.theme-wipe::view-transition-new(root){animation:suThemeWipe .42s cubic-bezier(.22,.61,.36,1)}
  @keyframes suThemeWipe{
    from{clip-path:circle(0 at var(--wx) var(--wy))}
    to{clip-path:circle(var(--wr) at var(--wx) var(--wy))}
  }

  /* ===== Dark theme (token swap + hardcoded-tint overrides) ===== */
  :root[data-theme="dark"]{
    /* dark theme — indigo accent on cool graphite/midnight */
    --bg:#0b1017; --card:#141821; --card2:#1c212c; --line:#2a3140; --track:#232936;
    --txt:#eef1f6; --mut:#98a2b4; --acc:#4f46e5; --acc2:#6366f1;
    --ok:#34d399; --bad:#ef6a5a; --gold:#fbbf24; --acc-rgb:79,70,229;
    --ok-rgb:52,211,153; --bad-rgb:239,106,90;
    /* In dark, primary buttons are a vivid blue bar on graphite */
    --ink1:#4f46e5; --ink2:#4338ca; --onink:#ffffff;
    --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 2px 10px rgba(0,0,0,.55),0 26px 70px -10px rgba(0,0,0,.66);
    color-scheme:dark;
  }
  :root[data-theme="dark"] .topnav{background:rgba(10,13,18,.82)}
  :root[data-theme="dark"] .qchip:hover,
  :root[data-theme="dark"] .dbtn.ghost:hover,
  :root[data-theme="dark"] .opt:hover:not(:disabled){background:rgba(var(--acc-rgb),.12)}
  :root[data-theme="dark"] .lt.on,
  :root[data-theme="dark"] .expl{background:rgba(var(--acc-rgb),.10)}
  :root[data-theme="dark"] .opt.sel{background:rgba(var(--acc-rgb),.16)}
  :root[data-theme="dark"] .opt .k,
  :root[data-theme="dark"] .tag,
  :root[data-theme="dark"] #flashApp kbd{background:#242b39}
  :root[data-theme="dark"] .bar,
  :root[data-theme="dark"] .wstat .wbar,
  :root[data-theme="dark"] .goal-row .gb,
  :root[data-theme="dark"] #flashApp .fc-bar{background:#232936}
  /* Scoped flashcard app tokens + its hardcoded ink/tints */
  :root[data-theme="dark"] #flashApp{--fc-card:#141821; --fc-ink:#eef1f6; --fc-muted:#98a2b4; --fc-gold:#4f46e5}
  :root[data-theme="dark"] #flashApp .face{box-shadow:0 8px 28px rgba(0,0,0,.55)}
  :root[data-theme="dark"] #flashApp .tier-tag{background:rgba(var(--acc-rgb),.16)}
  :root[data-theme="dark"] #flashApp .ex{color:#aab4c6}
  :root[data-theme="dark"] #flashApp .hint{color:#8792a6}

<script>
/* ---- Stuck-on-splash self-heal ----
   A service worker from an older build can keep serving a stale shell, and the app then sits on this
   splash forever. The end of the main script has a 6s "never trap the user" timeout, but a throw
   anywhere above it stops that timeout from ever being registered — which is exactly the case this
   has to cover. So it is registered HERE, in its own tag before any app code, where nothing the app
   does can prevent it: if the splash is still up at 9s, tear out every service worker and cache and
   reload once. sessionStorage guards it so a genuinely broken build can't loop. */
(function(){
  var KEY='scoreup.selfheal';
  try{ if(sessionStorage.getItem(KEY)==='1'){ sessionStorage.removeItem(KEY); return; } }catch(e){}
  setTimeout(function(){
    var b=document.getElementById('boot');
    if(!b || b.classList.contains('done')) return;      // app painted — nothing to fix
    try{ sessionStorage.setItem(KEY,'1'); }catch(e){}
    var tip=document.querySelector('.bl-tip');
    if(tip) tip.textContent=(navigator.language||'').indexOf('th')===0?'กำลังล้างแคชและโหลดใหม่…':'Clearing cache and reloading…';
    var jobs=[];
    try{ if(navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(e){}
    try{ if(window.caches) jobs.push(caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
    Promise.all(jobs).catch(function(){}).then(function(){ location.reload(); });
  }, 9000);
})();
</script>

<script>
/* ---------- Build flat catalog from window.QUESTIONS ---------- */
const Q = window.QUESTIONS || {};
const CATS = {
  part5:    {name:"ไวยากรณ์",     nameEn:"Grammar",          sub:"Part 5",       subEn:"Part 5",         ic:"📝"},
  part6:    {name:"เติมข้อความ",  nameEn:"Text Completion",  sub:"Part 6",       subEn:"Part 6",         ic:"📄"},
  part7:    {name:"การอ่าน",      nameEn:"Reading",          sub:"Part 7",       subEn:"Part 7",         ic:"👀"},
  vocab:    {name:"คำศัพท์",      nameEn:"Vocabulary",       sub:"พัฒนาคำศัพท์", subEn:"Build vocab",    ic:"📚"},
  listening:{name:"การฟัง",       nameEn:"Listening",        sub:"Parts 1–4",    subEn:"Parts 1–4",      ic:"🎧"},
};
function catName(c){ return CATS[c]?(S.lang==='en'?(CATS[c].nameEn||CATS[c].name):CATS[c].name):c; }
function catSub(c){ return CATS[c]?(S.lang==='en'?(CATS[c].subEn||CATS[c].sub):CATS[c].sub):""; }
const ALL = [];
for(const cat in CATS){
  let gidx=0;
  (Q[cat]||[]).forEach(it=>{
    if(it.qs){  // grouped passage (Part 6): expand to one item per blank, tagged with its passage
      const pid=cat+"#"+(gidx++);   // unique per passage group (even if two passages share text)
      it.qs.forEach((q,bi)=>{ if(!Array.isArray(q.o)) return; ALL.push({...q, cat, passage:it.passage, pid, bidx:bi, id:hashId(it.passage+"|"+pid+"|"+q.q+"|"+q.o.join("|"))}); });
    } else {
      if(!Array.isArray(it.o)) return;
      ALL.push({...it, cat, id:hashId((it.audio||"")+"|"+it.q+"|"+it.o.join("|"))});
    }
  });
}
function hashId(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return "q"+h.toString(36);}
const byId = Object.fromEntries(ALL.map(x=>[x.id,x]));

/* ---------- State / persistence ---------- */
const KEY="toeicSprint.v2";
const todayStr=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
/* local date-string N days from today (YYYY-MM-DD) */
function dateStrPlus(days){ const d=new Date(); d.setDate(d.getDate()+(days||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function bumpStreak(){
  const t=todayStr(); if(S.lastDay===t) return;
  const diff=S.lastDay?Math.round((new Date(t)-new Date(S.lastDay))/86400000):1;
  S.streak=diff===1?S.streak+1:1; S.lastDay=t;
}
/* Keep a lifetime history so the Stats page can filter by 1d/7d/30d/1y/all.
   Records are tiny (~80 bytes); 5000 rounds ≈ 400KB — years of daily practice, still safe for localStorage.
   The prune fallback in save() only kicks in on an actual storage-full error. */
function pushHist(rec){ S.history.push(rec); if(S.history.length>5000) S.history=S.history.slice(-5000); }
/* Best-effort rescue from a save that no longer parses. The old code kept the broken string under
   `.corrupt` and nothing ever read it back, so a single bad write silently reset a user to zero — this
   has already happened to this app once, and the only way anyone got the data back was a developer
   opening devtools. Corruption is nearly always truncation, so the front of the string is usually
   intact: pull the scalars by pattern, then brace-match every history record that still parses on its
   own. Partial history beats no history, and the user is told what happened. */
function salvageState(raw){
  if(!raw||typeof raw!=='string') return null;
  const out={}, num=k=>{const m=raw.match(new RegExp('"'+k+'":\\s*(\\d+)'));return m?+m[1]:null;};
  ['xp','streak','best','bestCombo'].forEach(k=>{const v=num(k); if(v!=null) out[k]=v;});
  const lang=(raw.match(/"lang":"(th|en)"/)||[])[1];        if(lang) out.lang=lang;
  const day=(raw.match(/"lastDay":"(\d{4}-\d{2}-\d{2})"/)||[])[1]; if(day) out.lastDay=day;
  const hist=[];
  for(let i=raw.indexOf('{"d":"'); i>=0; i=raw.indexOf('{"d":"',i+1)){
    let depth=0,end=-1;
    for(let j=i;j<raw.length;j++){ const c=raw[j];
      if(c==='{')depth++; else if(c==='}'){ depth--; if(!depth){ end=j; break; } } }
    if(end<0) break;                                        // truncated mid-record — nothing usable past here
    try{ const r=JSON.parse(raw.slice(i,end+1)); if(r&&r.d) hist.push(r); }catch(_){}
  }
  if(hist.length) out.history=hist;
  if(!Object.keys(out).length) return null;
  out._salvaged=hist.length;
  return out;
}
let _salvagedN=null;   // surfaced as a toast once the UI exists — load() runs before there is anything to draw on
function load(){
  let s=null;
  const raw=localStorage.getItem(KEY);
  try{ s=JSON.parse(raw||"null"); }
  catch(e){
    try{ localStorage.setItem(KEY+'.corrupt', raw); }catch(_){}
    s=salvageState(raw);
    if(s){ _salvagedN=s._salvaged; delete s._salvaged; }
  }
  if(!s || typeof s!=='object') s={xp:0,streak:0,lastDay:null,history:[],best:0,cards:{},lang:'th',mistakes:{}};
  if(!Array.isArray(s.history)) s.history=[];   // partial/imported saves may lack it — pushHist/home() dereference it bare
  s.xp=+s.xp||0; s.streak=+s.streak||0; s.best=+s.best||0;
  if(!s.cards) s.cards={};
  if(!s.lang) s.lang='th';
  if(!s.mistakes) s.mistakes={};
  if(!s.served) s.served={};   // anti-repeat ledger: how many times each bank item has been handed out
  if(!s.catStats) s.catStats={};
  if(!s.lessonRead) s.lessonRead={};   // reading checkpoint per lesson: {p:max %, y:scrollY at that point, done:reader confirmed finished}
  Object.values(s.lessonRead).forEach(r=>{ if(r&&r.done===undefined) r.done=(r.p||0)>=97; });   // legacy records: scroll-complete used to count as finished
  if(typeof s._sess!=='number') s._sess=0;
  // repair old flashcard day-records that stored s:100 placeholder (made accuracy read >100%)
  (s.history||[]).forEach(h=>{ if(h && h.n>0 && h.s>h.n) h.s=h.n; });
  // backfill skill tag on existing CATALOG cards (drill cards aren't in byId — they re-tag on next answer)
  if(s.cards){ for(const id in s.cards){ const it=byId[id]; if(it&&it.cat&&s.cards[id]&&!s.cards[id].cat) s.cards[id].cat=it.cat; } }
  // migrate old S.best (raw correct-count) → accuracy %; no badges key = pre-% format.
  // Cap at 95: the denominator is lost, so a raw 10 might be 10/15 — never fabricate a "perfect" 100.
  if(s.best>0 && s.best<=15 && !s.badges) s.best=Math.min(95, s.best*10);
  if(!s.badges) s.badges={};
  // XP-by-type: seed from history for existing users, then reconcile any pruned remainder into Practice
  if(!s.xpByType||typeof s.xpByType!=='object'){
    const bt={practice:0,drill:0,mistakes:0,vocab:0,exam:0};
    (s.history||[]).forEach(h=>{ bt[xpBucket(h.m)]+=(h.x||0); });
    const summed=bt.practice+bt.drill+bt.mistakes+bt.vocab+bt.exam;
    const rem=(s.xp||0)-summed; if(rem>0) bt.practice+=rem;   // history is capped (see pushHist) → dump any pruned remainder into Practice
    s.xpByType=bt;
  }
  /* One-time purge of vocab accuracy polluted by Study-mode self-grading.
     Until this build, tapping "Good" on a flashcard called bumpCat('vocab') — so the radar read the
     learner's own "I remember this", not a graded answer (it sat near 100% for everyone).
     Accuracy now comes from Vocab Quiz only, so the old numbers are unrecoverable noise: drop the

/* s.c/s.s = lifetime tally (kept for sample-count + low-data fallback); s.ema = recency-weighted accuracy

function bumpCat(cat,correct){ if(!cat)return; const s=S.catStats[cat]||(S.catStats[cat]={c:0,s:0}); s.s++; if(correct)s.c++;

function partToCat(p){ p=+p; if(p>=1&&p<=4)return 'listening'; if(p===5)return 'part5'; if(p===6)return 'part6'; if(p===7)return 'part7'; return null; }

function isDue(c){ return (c.seen||0)===0 || !c.due || c.due<=todayStr(); }
function srsQueue(){

    const da=isDue(ca), db=isDue(cb);
    if(da!==db) return da?-1:1;                        // due items first
    if(ca.box!==cb.box) return ca.box-cb.box;          // weakest first

/* ---------- Ranking (local, no backend) ---------- */
/* XP leagues — Duolingo-style tiers that only climb as you practise. */
const LEAGUES=[
  {ic:'🥉',th:'บรอนซ์',en:'Bronze',   min:0,     c:'#c08457'},
  {ic:'🥈',th:'ซิลเวอร์',en:'Silver',  min:500,   c:'#9aa7b4'},
  {ic:'🥇',th:'โกลด์',  en:'Gold',    min:1500,  c:'#e0a500'},
  {ic:'🏆',th:'แพลตินัม',en:'Platinum',min:3500,  c:'#37bfae'},
  {ic:'💎',th:'ไดมอนด์', en:'Diamond', min:7000,  c:'#5b9dff'},
  {ic:'👑',th:'มาสเตอร์', en:'Master',  min:15000, c:'#a06bff'},
];
/* Master is not a ceiling. Past it the ladder keeps going as Master 2, 3, 4 … every MASTER_STEP XP,
   so the rank never freezes at "100%, nothing left to climb" — the whole point of tying achievement
   to XP is that there is always a next rung. */
const MASTER_STEP=10000;
function leagueOf(xp){
  xp=Math.max(0,xp||0);
  const top=LEAGUES[LEAGUES.length-1];
  if(xp>=top.min){
    const n=Math.floor((xp-top.min)/MASTER_STEP);          // 0 = plain Master, 1 = Master 2, …
    const base=top.min+n*MASTER_STEP, nextMin=base+MASTER_STEP;
    const nm=L(top.th,top.en)+(n?' '+(n+1):'');
    return {ic:top.ic,c:top.c,name:nm,next:L(top.th,top.en)+' '+(n+2),nextMin:nextMin,
            into:Math.max(0,Math.min(100,Math.round((xp-base)/MASTER_STEP*100))),tier:LEAGUES.length+n};
  }
  let i=0; for(let k=0;k<LEAGUES.length;k++){ if(xp>=LEAGUES[k].min) i=k; }
  const cur=LEAGUES[i], nxt=LEAGUES[i+1]||null;
  const into=nxt?Math.max(0,Math.min(100,Math.round((xp-cur.min)/(nxt.min-cur.min)*100))):100;
  return {ic:cur.ic,c:cur.c,name:L(cur.th,cur.en),next:nxt?L(nxt.th,nxt.en):null,nextMin:nxt?nxt.min:null,into:into,tier:i+1};
}
/* Approx TOEIC L&R percentile from published ETS score distribution → "top X% of test-takers". */
function toeicPercentile(score){
  const P=[[10,0],[300,3],[400,8],[500,18],[600,33],[700,52],[800,73],[900,89],[990,97]];
  if(score<=P[0][0]) return 0;
  for(let i=1;i<P.length;i++){ if(score<=P[i][0]){ const a=P[i-1],b=P[i]; return Math.round(a[1]+(b[1]-a[1])*(score-a[0])/(b[0]-a[0])); } }
  return 97;
}

const THEME_KEY="scoreup.theme";

function applyTheme(t,persist){
  const dark=t==="dark";
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  const mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.setAttribute("content",dark?"#0b1017":"#f6f8fc");   // status bar matches the page background, not the accent
  const btn=document.getElementById("themeToggle"); if(btn){ btn.setAttribute("aria-checked",dark?"true":"false"); btn.title=dark?"Light mode":"Dark mode"; }

/* Single entry point for EVERY theme switch — navbar toggle and the Settings สว่าง/มืด pair — so they
   wipe identically. `origin` is the element the wipe grows from (the control the user actually pressed);
   `after` re-renders the current view inside the transition, so the sweep reveals the redrawn page in one pass. */
function switchTheme(next,origin,after){
  const run=()=>{ applyTheme(next,true); if(after) after(); };
  // no View Transitions (older Firefox) or reduced motion → swap instantly. A hard cut beats a flickering fade.
  if(!document.startViewTransition||matchMedia("(prefers-reduced-motion: reduce)").matches){ run(); return; }
  const rt=document.documentElement, r=origin&&origin.getBoundingClientRect&&origin.getBoundingClientRect();
  const x=r?r.left+r.width/2:innerWidth-40, y=r?r.top+r.height/2:40;
  rt.style.setProperty("--wx",x+"px"); rt.style.setProperty("--wy",y+"px");
  rt.style.setProperty("--wr",Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+"px");  // reach the farthest corner
  rt.classList.add("theme-wipe");
  document.startViewTransition(run).finished.finally(()=>rt.classList.remove("theme-wipe"));
}

/* ---------- Accuracy per category (for weak-spot view) ---------- */
/* seen count for a category from the ALL catalog (non-mutating) */
function catSeenAll(cat){ let s=0; ALL.forEach(x=>{ if(x.cat===cat) s+=peekCard(x.id).seen; }); return s; }
/* total observed answers for a category: ALL-catalog when it has data, else the catStats fallback
   (drills/exams don't map to real catalog ids, so their answers live only in catStats) */
function catSeen(cat){ const a=catSeenAll(cat); if(a>0) return a; return (S.catStats&&S.catStats[cat]&&S.catStats[cat].s)||0; }
/* catAccuracy() lived here: an EMA-over-catStats accuracy with a lifetime-average fallback. Removed —
   nothing called it any more, and it answered "how accurate is this skill" with a DIFFERENT formula from
   skillAccuracyRange() (rolling last-30), which is the one every screen now shows. Leaving it in place
   was an invitation to wire it up somewhere and print a second, contradictory number for the same skill.
   If a recency-weighted accuracy is ever wanted, add it as an option on the one source, not as a rival. */
/* An accuracy % is only statistically trustworthy once enough answers back it.
   Below MIN_RELIABLE we mark it provisional (~, muted) so a lucky 9/10 doesn't read as "90% mastered". */
const MIN_RELIABLE=20;
function accReliable(n){ return (n||0)>=MIN_RELIABLE; }
function accColor(v,n){ return v==null?'var(--mut)':(accReliable(n)?radarRank(v)[1]:'var(--mut)'); }
function accText(v,n){ return v==null?'—':(accReliable(n)?v+'%':'~'+v+'%'); }
/* total mock questions answered — a mock is 100–200 Q so any real mock is instantly reliable */
function mockSampleN(){ return (S.history||[]).filter(x=>x.m==='exam').reduce((s,x)=>s+(x.n||0),0); }
/* ---------- Per-skill levels (drive the Skill Levels panel) ---------- */
/* total correct answers observed for a category: ALL-catalog when it has data, else catStats fallback
   (mirrors catAccuracy's source choice so drills/exams aren't double-counted) */
/* Progress counts UNIQUE questions answered right (each card = 1), not total correct —
   so re-grinding the same items can't inflate the bar. Drill-only cats fall back to catStats. */
function catCorrectCount(cat){
  let c=0;   // unique catalog questions answered right (each card once) — kills redo-the-same-card farming for quiz cats
  ALL.filter(x=>x.cat===cat).forEach(x=>{const k=peekCard(x.id);c+=(k.correct>0?1:0);});
  const cs=S.catStats&&S.catStats[cat], csc=cs?(cs.c||0):0;  // drill-only cats (e.g. listening: 24 catalog) live here; drills randomise so far less farmable
  return Math.max(c,csc);
}
/* the ตะลุยโจทย์ / Mock skill levels up on total correct answers across all mock exams */
function mockCorrectCount(){ return (S.history||[]).filter(h=>h.m==='exam').reduce((a,h)=>a+(h.s||0),0); }
/* RPG-style level curve from a correct-answer count: Lv1@0, Lv2@3, Lv3@12, Lv4@27, Lv5@48…
   returns {level, pct(→next), have} */
function statLevel(n){
  n=n||0;
  const level=Math.floor(Math.sqrt(n/3))+1;
  const cur=3*(level-1)*(level-1), next=3*level*level;
  const pct=next>cur?Math.max(0,Math.min(100,Math.round((n-cur)/(next-cur)*100))):0;
  return {level,pct,have:n};
}
/* predicted TOEIC score: blend of listening vs reading accuracy → /990.
   Requires a minimum sample in BOTH sections; never cross-fills one section from the other. */
function predictedScore(){
  const MIN_SAMPLE=8;
  /* Same last-ACC_WINDOW source as the radar/tiles (skillWindow) so the /990 estimate can't
     disagree with the accuracy the user sees a scroll away. `.n` is the window actually scored. */
  const w=skillWindow();
  const lPct=w.listening.v, lSeen=w.listening.n;
  const rParts=[w.grammar,w.text,w.vocab];
  const rAccs=rParts.map(o=>o.v).filter(v=>v!=null);
  const rPct=rAccs.length? Math.round(rAccs.reduce((a,b)=>a+b,0)/rAccs.length) : null;
  const rSeen=rParts.reduce((a,o)=>a+(o.n||0),0);
  if(lPct==null || rPct==null) return null;
  if(lSeen<MIN_SAMPLE || rSeen<MIN_SAMPLE) return null;
  return interpScale(lPct,SCALE_L)+interpScale(rPct,SCALE_R);
}
/* How many answers back the prediction — more answers = tighter, more trustworthy estimate */
function predSample(){ return catSeen('listening') + ['part5','part6','vocab'].reduce((a,c)=>a+catSeen(c),0); }
/* Confidence tracks the WEAKER section, not the total: 200 reading answers can't make up for 8 listening ones,
   so we tier on the balanced sample (2×min) — a lopsided history stays "Provisional" until both sides fill in. */
function predBalanced(){ const l=catSeen('listening'), r=['part5','part6','vocab'].reduce((a,c)=>a+catSeen(c),0); return 2*Math.min(l,r); }
function predConf(n){ n=(n==null)?predBalanced():n; return n>=120?[L('เชื่อมั่นสูง','High confidence'),'#2e9e5b',20] : n>=40?[L('เชื่อมั่นปานกลาง','Medium confidence'),'#d99a2b',40] : [L('ยังเบื้องต้น','Provisional'),'#64748b',70]; }

function gmEdit(which,val){
  val=Math.round((+val||0)/5)*5;
  let g=goalScore(), l=goalSplitL(g);
  if(which==='g'){ const ratio=l/g; g=Math.max(10,Math.min(990,val||g)); l=Math.round(g*ratio/5)*5; }
  else if(which==='l') l=val;
  else l=g-val;
  l=Math.max(Math.max(5,g-495), Math.min(Math.min(495,g-5), l));
  S.goal=g; S.goalL=l; S.goalR=g-l; save();
  const set=(id,v)=>{ const e=$(id); if(e) e.value=v; };
  set('gmG',g); set('gmL',l); set('gmR',g-l);
  const leg=(id,side,v)=>{ const e=$(id); if(e) e.innerHTML=gmCefrHTML(side,v); };
  leg('gmLcefr','l',l); leg('gmRcefr','r',g-l);
  home();   // refresh the dashboard behind the popup — the modal lives on <body> so it stays open
}
function gmBump(which,d){ const e=$(which==='g'?'gmG':which==='l'?'gmL':'gmR'); gmEdit(which,(+e.value||0)+d); }
