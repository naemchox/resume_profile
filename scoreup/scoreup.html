<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoreUp — TOEIC Practice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='82' font-size='64' text-anchor='middle'>%F0%9F%98%BA</text><text x='53' y='40' font-size='40' text-anchor='middle'>%F0%9F%8E%93</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f8fc">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ScoreUp">
<link rel="preload" href="questions.js" as="script">   <!-- 3MB bank: start the fetch during head parse instead of at the bottom of body -->
<link rel="preload" href="exam.js" as="script">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Apply saved/system theme before first paint to avoid a flash of the wrong theme */
(function(){try{
  var t=localStorage.getItem('scoreup.theme');
  if(t!=='dark'&&t!=='light') t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var qt=new URLSearchParams(location.search).get('theme');
  if(qt==='dark'||qt==='light') t=qt;
  document.documentElement.setAttribute('data-theme',t);
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt&&t==='dark') mt.setAttribute('content','#0b1017');   // browser chrome matches dark bg from the first frame
}catch(e){}})();
</script>
<style>
  :root{
    /* light theme — indigo accent on cool porcelain */
    --bg:#f6f8fc; --card:#ffffff; --card2:#eef2f8; --line:#cbd5e3; --track:#c2cddd;
    --txt:#0f172a; --mut:#64748b; --acc:#4f46e5; --acc2:#6366f1;
    /* Light-theme status colours are DARKER than their dark-theme twins on purpose — they sit on
       white/near-white, not on near-black. The old #ca8a04 gold measured 2.94:1 on white and 2.61:1
       on --card2, and #2e9e5b green 3.41:1 — both under the 4.5:1 needed for the small bold numbers
       they colour (skill %, "best", part scores). Measured, not eyeballed: gold 5.14/4.58, green
       5.68/5.05. Dark theme keeps the bright twins, which already measure 9–10:1 on #141821. */
    --ok:#237544; --bad:#d63d16; --gold:#946400; --acc-rgb:79,70,229;
    /* RGB twins of the status colours so tints can be written rgba(var(--ok-rgb),.10) and follow
       the theme. Previously tints were hardcoded to three different greens/reds that never swapped. */
    --ok-rgb:35,117,68; --bad-rgb:214,61,22;   /* must track --ok / --bad above, or every tint drifts off its border colour */
    /* primary buttons: solid indigo with white ink */
    --ink1:#4f46e5; --ink2:#4338ca; --onink:#ffffff;
    --serif:'Fraunces',ui-serif,Georgia,'Times New Roman',serif;
    --sh1:0 1px 2px rgba(58,44,18,.06);
    --sh2:0 1px 3px rgba(58,44,18,.05),0 14px 36px -8px rgba(58,44,18,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  ::selection{background:rgba(99,102,241,.35)}   /* no forced text colour — keeps selected text readable in both themes */
  .logo,.wstat .v,.sb .n,.big,#flashApp .word,#welcome .w-brand,#welcome .w-quote{font-family:var(--serif)}
  html{scrollbar-gutter:stable}
/* clip, NOT hidden: `overflow-x:hidden` makes html/body a scroll container, which silently kills
   position:sticky on every descendant. The topnav is written as sticky with z-index 30 and a backdrop
   blur, and it had never once stuck — measured at scrollY 600 it sat at top:-314. `clip` gives the same
   protection against sideways scroll without creating the scroll container. */
html,body{overflow-x:clip}
  img.emo{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em;display:inline-block;margin:0 .02em}
  body{font-family:'Inter','Noto Sans Thai',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:
      radial-gradient(120% 70% at 50% -12%, rgba(var(--acc-rgb),.06), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--txt);min-height:100vh;min-height:100dvh;display:block;
    padding-top:calc(61px + env(safe-area-inset-top));   /* clears the fixed .topnav (60px bar + 1px border + safe-area) */
    -webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:560px;margin:0 auto;min-width:0;
    padding:14px 20px max(24px,env(safe-area-inset-bottom))}
  /* subpages (stats/rank/practice/quiz…) breathe on desktop instead of staying 560px */
  @media (min-width:900px){ .app{max-width:760px} }
  body.is-home .app{max-width:1180px}
  body.is-textcol .app{max-width:900px}   /* Part 6 text-completion: room for passage + questions side by side */
  .logo{font-weight:800;font-size:20px;letter-spacing:.2px;cursor:pointer;display:flex;align-items:center;gap:8px;flex:none}
  .logo span{color:var(--acc)}
  .logo svg{width:30px;height:30px;flex:none;overflow:visible}

  /* ===== Top navigation bar ===== */
  /* position:fixed (not sticky) — sticky broke on Chromium/Windows because the root's overflow:clip
     is treated differently there than in WebKit; fixed is relative to the viewport regardless of any
     ancestor overflow/clip, so the bar pins identically on every browser. body gets matching top padding. */
  .topnav{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
  .topnav-in{width:100%;max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;
    padding:12px 24px;height:60px}
  .topnav-in>.logo{flex:none}
  /* padding+negative margin keeps the active underline (bottom:-13px) inside the clip box, so
     `overflow:hidden` can act as a hard guard: links can never spill over the right-hand controls. */
  .nav-links{display:flex;gap:2px;margin:0 auto -13px;min-width:0;padding-bottom:13px;overflow:hidden}
  .nav-links a{color:var(--mut);font-weight:600;font-size:14px;text-decoration:none;
    padding:8px 11px;border-radius:9px;cursor:pointer;transition:color .15s,background .15s;position:relative;white-space:nowrap}
  /* TH and EN labels are stacked in the same grid cell, so every link is as wide as its LONGER
     language and the whole bar keeps an identical footprint when the language is switched. */
  .nav-links a{display:inline-grid;justify-items:center;align-items:center}
  .nav-links a>span{grid-area:1/1;white-space:nowrap}
  html[lang="en"] .nav-links a>.nl-th,
  html:not([lang="en"]) .nav-links a>.nl-en{visibility:hidden}
  .nav-links a:hover{color:var(--txt);background:var(--card2)}
  .nav-links a.on{color:var(--acc)}
  .nav-links a.on::after{content:"";position:absolute;left:11px;right:11px;bottom:-13px;height:2px;background:var(--acc);border-radius:2px}
  .nav-right{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:none}
  .nav-burger{display:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);align-items:center;justify-content:center;cursor:pointer;color:var(--txt);
    padding:0;transition:.15s}
  .nav-burger:hover{border-color:var(--acc);color:var(--acc)}
  .goalsel{font:inherit;font-weight:800;color:var(--acc);background:transparent;border:0;
    border-bottom:2px dashed var(--line);cursor:pointer;padding:0 2px 1px;border-radius:0}
  .goalsel:hover{border-bottom-color:var(--acc)}
  .goalsel:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:2px}
  .goalsel option{color:var(--txt);background:var(--card)}
  .nav-chips{display:flex;gap:6px}
  .nav-profile{display:flex;align-items:center;gap:9px;cursor:pointer}
  .nav-profile .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));
    color:var(--onink);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .nav-profile .pn{line-height:1.2}
  .nav-profile .pn b{font-size:13px;font-weight:700;display:block}
  .nav-profile .pn span{font-size:11px;color:var(--mut)}
  .nav-gear{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;transition:.15s}
  .nav-gear:hover{border-color:var(--acc)}
  .nav-gear img{width:22px;height:22px;display:block}

  /* ===== Dashboard layout ===== */
  .welcome{text-align:center;margin:8px 0 12px;position:relative}
  .welcome h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px}
  /* Graduate-cat mascot: smiley cat with a graduation cap sitting on its head */
  .gradcat{position:relative;width:50px;height:50px;margin:0 auto 3px;pointer-events:none}
  .gradcat .gc-cat{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .gradcat .gc-cap{position:absolute;top:-26%;left:52%;transform:translateX(-50%) rotate(-8deg);width:70%;height:auto}
  /* Reactive mascot: cat swaps expression on correct / wrong-streak / session-end (moment-to-moment feedback) */
  .fc-mascot{width:40px;height:40px;object-fit:contain;flex:none}
  .fc-mascot.pop{animation:mascotPop .42s ease}
  .fc-mascot-lg{width:66px;height:66px;object-fit:contain;margin:0 auto 4px;display:block;animation:mascotPop .5s ease}
  @keyframes mascotPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.fc-mascot.pop,.fc-mascot-lg{animation:none}}
  .welcome-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:14px 26px;align-items:flex-start}
  .wstat{flex:1 1 0;min-width:130px;max-width:190px;text-align:center}
  .wstat .k{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:3px}
  .wstat .v{font-size:20px;font-weight:800;color:var(--txt)}
  .wstat.goal .v{color:var(--acc)}
  .est-hint{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:5px;line-height:1.5;max-width:100%;margin-left:auto;margin-right:auto}
  .est-hint b{color:var(--acc);font-weight:800}
  .est-hint.ok{color:var(--acc)}
  /* top-of-dashboard pace verdict — one glanceable line: goal · now · the weekly rate the date demands */
  .pace-line{margin:14px auto 0;max-width:520px;padding:9px 15px;border-radius:13px;
    background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--mut);
    font-size:12.5px;line-height:1.5;color:var(--fg);
    display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 12px}
  .pace-line b{font-weight:800}
  .pace-line .pl-band{color:var(--mut);font-weight:600;font-size:11px}
  .pace-line .pl-v{color:var(--mut)}
  .pace-line .pl-tag{font-weight:700}
  .pace-line.ok{border-left-color:var(--ok)} .pace-line.ok .pl-tag{color:var(--ok)}
  .pace-line.warn{border-left-color:var(--gold)} .pace-line.warn .pl-tag{color:var(--gold)}
  .pace-line.bad{border-left-color:var(--bad)} .pace-line.bad .pl-tag{color:var(--bad)}
  .est-btn{margin-top:6px;background:var(--card2);border:1px solid var(--line);color:var(--acc);
    font:inherit;font-weight:800;font-size:11.5px;padding:5px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .est-btn:hover{border-color:var(--acc)}
  .radar-toggle{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--card2)}
  /* three tabs now, so the pills shrink instead of pushing the row past the card on narrow screens */
  .rt-btn{background:none;border:0;font:inherit;font-weight:700;font-size:12.5px;color:var(--mut);padding:5px clamp(8px,2.6vw,15px);border-radius:99px;cursor:pointer;transition:.15s;white-space:nowrap}
  .rt-btn.on{background:var(--acc);color:var(--onink)}
  .radar-daterow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:8px 0 2px}
  .radar-rangesel{font:inherit;font-weight:700;font-size:12.5px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
  .radar-rangesel:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:2px}
  .radar-rangesel option{color:var(--txt);background:var(--card)}
  .radar-date{font:inherit;font-size:12.5px;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer;color-scheme:dark light}
  .radar-date:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:2px}
  .radar-or{font:inherit;font-weight:800;font-size:11.5px;letter-spacing:.5px;color:var(--mut);opacity:.75;padding:0 1px}
  .wstat .wbar{height:6px;background:var(--track);border-radius:6px;overflow:hidden;margin:6px auto 0;width:100%;max-width:160px}
  .wstat .wbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:.5s}

  .dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  .dash-main{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;min-width:0}
  .dash-main .span2{grid-column:1 / -1}
  /* No sticky: this column is now taller than the viewport, so pinning its top made the
     bottom cards unreachable — it scrolls with the page. */
  .dash-side{display:flex;flex-direction:column;gap:16px}
  .rm-card{cursor:pointer}
  .rm-top{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
  .rm-score{font-size:28px;font-weight:800;color:var(--gold);line-height:1}
  .rm-score small{font-size:13px;color:var(--mut);font-weight:600}
  .rm-delta{font-size:11px;color:var(--mut);font-weight:600}
  .rm-bars{display:flex;align-items:flex-end;gap:12px;height:58px;margin-top:12px}
  .rm-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .rm-bar>i{width:100%;max-width:38px;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:5px 5px 0 0;min-height:4px}
  .rm-bar>span{font-size:10.5px;font-weight:800;color:var(--txt);margin-top:4px}
  /* prep test = easier rules (self-paced audio) → hollow bar, so it never reads as a mock score */
  .rm-bar.prep>i{background:none;border:2px solid var(--acc);border-bottom:none;opacity:.75}
  .rm-bar.prep>span{color:var(--mut)}
  .rlabel .ri-e{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;margin-bottom:2px}
  .mock-detail{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .md-h{font-size:13.5px;font-weight:800;margin-bottom:12px;color:var(--txt)}

  /* Dashboard card polish */
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh2)}
  /* unfinished test: one tappable line, not a card. It is a detour back to something already started,
     so it should be findable in a glance and cost nothing when ignored. */
  .resume-bar{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;font:inherit;
    color:var(--txt);background:linear-gradient(135deg,rgba(var(--acc-rgb),.10),rgba(var(--acc-rgb),.05));
    border:1px solid rgba(var(--acc-rgb),.35);border-radius:13px;padding:11px 14px;margin-bottom:6px;
    transition:border-color .15s}
  .resume-bar:hover{border-color:var(--acc)}
  .resume-bar .rb-ic{font-size:17px;line-height:1;flex:none;display:inline-flex}
  .resume-bar .rb-ic img{width:22px;height:22px}   /* the animated webp needs a size of its own — inherited font-size only sets the text fallback */
  .resume-bar .rb-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .resume-bar .rb-tx b{font-size:14.5px}
  .resume-bar .rb-tx span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .resume-bar .rb-go{color:var(--acc);display:flex;flex:none}
  /* discarding is rare and irreversible — a quiet text link, never a button beside the primary action */
  .resume-drop{display:block;margin:0 0 18px auto;background:none;border:0;cursor:pointer;font:inherit;
    font-size:11.5px;color:var(--mut);padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
  .resume-drop:hover{color:var(--bad)}

  /* ---- Exam-day countdown: the home page's job is to push you into practice or a
     mock, not to be somewhere you linger — this card is urgency, not content ---- */
  .xd-big{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
  .xd-n{font-size:38px;font-weight:800;color:var(--acc);line-height:1;font-family:var(--serif)}
  .xd-u{font-size:13px;font-weight:700;color:var(--mut)}
  .xd-date{font-size:12.5px;color:var(--mut);font-weight:600}
  .xd-gap{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55}
  .xd-gap b{color:var(--txt);font-weight:800}
  .xd-gap .warn{color:var(--bad);font-weight:800}
  .xd-gap .good{color:var(--ok);font-weight:800}
  .xd-set{font:inherit;font-size:13px;color:var(--txt);background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;
    width:100%;margin-top:10px;color-scheme:dark light}
  .xd-set:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:2px}
  .dcard-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .wf-card{background:linear-gradient(135deg,rgba(var(--acc-rgb),.09),transparent);border-color:rgba(var(--acc-rgb),.3)}
  .wf-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .wf-head h3{margin:0}
  .wf-x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
  .wf-track{position:relative;display:flex;align-items:flex-start}
  .wf-rail{position:absolute;top:15px;left:12.5%;right:12.5%;height:2px;background:var(--line);z-index:0}
  .wf-node{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:0;cursor:pointer;padding:0 4px;text-align:center}
  .wf-num{width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;transition:.15s}
  .wf-node.done .wf-num{background:var(--ok);border-color:var(--ok);color:#fff}
  .wf-node.now .wf-num{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 4px rgba(var(--acc-rgb),.18)}
  .wf-node:hover .wf-num{border-color:var(--acc);transform:translateY(-2px)}
  .wf-ic{font-size:17px;margin-top:5px;line-height:1}
  .wf-t{font-size:12.5px;font-weight:800;color:var(--txt);white-space:nowrap}
  .wf-node.now .wf-t{color:var(--acc)}
  .wf-s{font-size:10px;color:var(--mut);line-height:1.2}
  .wf-tag{font-size:9px;font-weight:800;color:var(--acc);background:rgba(var(--acc-rgb),.12);padding:1px 7px;border-radius:999px;margin-top:3px;white-space:nowrap}
  @media(max-width:600px){.wf-rail{display:none}.wf-track{flex-wrap:wrap;gap:16px 0}.wf-node{flex:1 1 46%}.wf-t{white-space:normal}}
  /* ---- Spotlight tutorial (Ijek-style coach-mark tour) ---- */
  #tourRoot{position:fixed;inset:0;z-index:9999}
  .tour-catch{position:fixed;inset:0;cursor:pointer;touch-action:none;background:transparent}
  /* the dim normally lives in the hole's box-shadow; during a screen swap the hole fades to 0 and would take
     the dimming with it (screen flashes bright over the rebuild). So carry a matching-.74 dim on the catch layer
     ONLY while swapping — same value → seamless handoff back to the hole's shadow when the new screen paints. */
  #tourRoot.tour-swap .tour-catch{background:rgba(6,9,14,.74)}
  .tour-hole{position:fixed;border-radius:14px;
    box-shadow:0 0 0 9999px rgba(6,9,14,.74);   /* dim cutout only — the outline lives on the tour card, not the spotlighted content */
    transition:top .35s cubic-bezier(.4,0,.2,1),left .35s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1),height .35s cubic-bezier(.4,0,.2,1);pointer-events:none}
  .tour-hole.full{border-radius:0;box-shadow:0 0 0 9999px rgba(6,9,14,.74)}
  /* Steps that change screen rebuild the whole view synchronously — measured 22ms for Practice and 37ms
     for Flashcards, i.e. a dropped frame right under the card. Position can't glide across a screen
     change anyway (the backdrop is different), so instead of snapping mid-hitch the overlay fades out,
     the rebuild happens while it is invisible, and it fades back onto the new screen. */
  /* out instantly (a transitioned fade-out would still be half-visible when the rebuild runs one
     frame later, which defeats the point); back in over .18s, set inline by the jump branch */
  #tourRoot.tour-swap .tour-hole,#tourRoot.tour-swap .tour-card{opacity:0;transition:none}
  #tourRoot .tour-hole,#tourRoot .tour-card{opacity:1}
  /* the coach-mark card: gradient accent border + a breathing halo, so the outline reads
     clearly on both the cream (light) and graphite (dark) backdrops */
  .tour-card{position:fixed;z-index:2;border:2px solid transparent;border-radius:18px;padding:22px 20px;
    background:linear-gradient(var(--card),var(--card)) padding-box,
               linear-gradient(135deg,var(--acc2),#a78bfa 45%,var(--gold)) border-box;
    box-shadow:0 0 0 5px rgba(var(--acc-rgb),.16),0 24px 70px rgba(0,0,0,.45);
    text-align:center;
    transition:left .35s cubic-bezier(.4,0,.2,1),top .35s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1);
    animation:tourPop .3s cubic-bezier(.34,1.3,.5,1),tourHalo 2.4s ease-in-out .3s infinite}
  @keyframes tourPop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes tourHalo{0%,100%{box-shadow:0 0 0 5px rgba(var(--acc-rgb),.16),0 24px 70px rgba(0,0,0,.45)}
    50%{box-shadow:0 0 0 9px rgba(var(--acc-rgb),.30),0 24px 70px rgba(0,0,0,.45)}}
  /* tail = a 45°-rotated square filled with the card background, bordered on its two outer edges only —
     so it reads as part of the bubble. Border colour matches the spot the card's gradient reaches there:
     top edge = --acc2 (gradient start), bottom edge = --gold (gradient end). */
  .tour-arrow{position:absolute;width:14px;height:14px;background:var(--card);border-radius:2px;transform:translateX(-50%) rotate(45deg)}
  .tour-arrow.up{top:-8px;border-left:2px solid var(--acc2);border-top:2px solid var(--acc2)}
  .tour-arrow.down{bottom:-8px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold)}
  .tour-glyph{font-size:50px;line-height:1;margin-bottom:8px}
  .tour-glyph img{width:56px;height:56px;object-fit:contain;display:inline-block;vertical-align:middle}
  .tour-card h2{font-size:19px;margin:0 0 6px;font-weight:800}
  .tour-in>p{font-size:14px;color:var(--mut);margin:0 0 14px;line-height:1.5}   /* body text moved one level in (.tour-in); keep it a direct-child rule so the workflow footnote keeps .small styling */
  .tour-in{animation:tourIn .2s ease-out}
  @keyframes tourIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .tour-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .tour-dots span{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
  .tour-dots span.on{background:var(--acc);width:20px;border-radius:4px}
  .tour-nav{display:flex;gap:10px}
  .tour-nav button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:800;cursor:pointer;font-size:14px}
  .tour-nav button.prim{background:var(--acc);color:#fff;border-color:var(--acc)}
  .tour-wf{text-align:left;margin:0 0 14px}
  .tour-wf-step{display:flex;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
  .tour-wf-step .n{width:22px;height:22px;flex:none;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .dcard-h h3{font-size:16px;font-weight:800}
  .dcard-h .hi{width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--acc);
    display:flex;align-items:center;justify-content:center;flex:none}
  .grp-lbl{font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 7px;text-transform:uppercase;letter-spacing:.4px}
  .grp-lbl:first-of-type{margin-top:0}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px}
  .qchip{background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600;
    padding:7px 13px;border-radius:9px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:40px;line-height:1.2}
  .qchip:hover{border-color:var(--acc);color:var(--acc);background:rgba(var(--acc-rgb),.08)}
  /* Equal-size tiles so button/chip rows render identically in Thai and English (language-independent sizing) */
  .eqrow{display:flex;flex-wrap:wrap;gap:8px}
  .eqrow>*{flex:1 1 0;min-width:0}
  /* Action-button rows: 2 per line with room for the longer English label, kept to one line so height matches Thai */
  .acts>*{flex:1 1 calc(50% - 4px);white-space:nowrap}
  .dbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink1);color:var(--onink);border:1px solid transparent;
    font-weight:600;font-size:13px;padding:9px 16px;border-radius:9px;cursor:pointer;transition:opacity .16s,background .18s,border-color .15s;
    box-shadow:none;min-height:42px;text-align:center;line-height:1.2}
  .dbtn:hover{opacity:.88}
  .dbtn:active{opacity:.8}
  .dbtn.sm{padding:7px 12px;font-size:12px;min-height:36px}
  .dbtn.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);box-shadow:none}
  .dbtn.ghost:hover{border-color:var(--acc);background:transparent;opacity:1}

  /* Test rows */
  /* Sidebar widgets */
  .side-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh2)}
  .rank-card{cursor:pointer;transition:border-color .15s}
  .rank-card:hover{border-color:var(--acc)}
  .rank-card h4{display:flex;align-items:center;justify-content:space-between}
  .rk-more{color:var(--mut);font-weight:800;font-size:18px}
  .rank-badge{display:flex;align-items:center;gap:12px}
  .rk-ic{width:46px;height:46px;border-radius:12px;border:1px solid;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
  .rk-info{display:flex;flex-direction:column;gap:1px;min-width:0}
  .rk-info b{font-size:15px}
  .rk-pct{margin-top:11px;font-size:12px;color:var(--txt);background:var(--card2);border-radius:9px;padding:8px 10px;line-height:1.45}
  .rk-pct.mut{color:var(--mut)}
  .rk-hero{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
  .rk-hero.empty{display:block}
  .rk-score{font-size:38px;font-weight:900;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
  .rk-score.mut{color:var(--mut)}
  .rk-score small{font-size:15px;color:var(--mut);font-weight:700;margin-left:2px}
  .rk-side{display:flex;flex-direction:column;gap:5px;min-width:0}
  .rk-band{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap;align-self:flex-start}
  .rk-top{font-size:11.5px;color:var(--mut)}
  .rk-league{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
  .rk-ic.sm{width:34px;height:34px;font-size:18px;border-radius:9px}
  .rk-lg-mid{flex:1;min-width:0}
  .rk-lg-mid b{font-size:13.5px}
  .pf-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .pf-av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;flex:none}
  .pf-name b{font-size:19px;font-weight:800;display:block;margin-bottom:4px}
  .pf-name .rk-league{display:inline-flex;align-items:center}
  .pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0}
  .pf-tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
  .pf-tile .v{font-size:19px;font-weight:900;color:var(--acc);line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:4px;min-height:21px}
  .pf-tile .v .sfx{font-size:13px}                    /* 🔥 etc — never scales the number itself */
  .pf-tile .v.zero{color:var(--mut)}                  /* an empty stat must not read as loud as a real one */
  .pf-tile .k{font-size:10px;color:var(--mut);font-weight:700;margin-top:4px}
  /* rank block: the profile's achievement is the league ladder, so it gets one progress bar, not a wall */
  /* folded reference card: the summary is the whole tap target, caret turns to say which way it goes */
  .xp-how{padding-top:16px;padding-bottom:16px}
  .xp-how-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
    list-style:none;font-size:15px;font-weight:800;color:var(--txt)}
  .xp-how-sum::-webkit-details-marker{display:none}
  .xp-how-sum:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:3px;border-radius:6px}
  .xp-how .xh-caret{flex:none;color:var(--mut);font-size:19px;font-weight:700;transition:transform .18s;transform:rotate(90deg)}
  .xp-how[open] .xh-caret{transform:rotate(-90deg)}
  @media(prefers-reduced-motion:reduce){ .xp-how .xh-caret{transition:none} }
  /* "how XP works" rows: label left, the number right, so the earners can be scanned as a column */
  .xp-how-list{display:flex;flex-direction:column;gap:1px}
  .xh{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
  .xh:last-child{border-bottom:0}
  .xh .xh-ic{flex:none;width:22px;text-align:center;font-size:15px}
  .xh .xh-t{flex:1;min-width:0;color:var(--txt)}
  .xh b{flex:none;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
  .xh.dim .xh-t{color:var(--mut)} .xh.dim b{color:var(--mut)}
  .rank-prog{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
  .rank-prog .rp-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:8px}
  .rank-prog .rp-top span{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
  .rank-prog .rp-note{font-size:11.5px;color:var(--mut);margin-top:7px;line-height:1.5}
  .pf-edit{background:none;border:0;cursor:pointer;color:var(--mut);font-size:13px;padding:2px 5px;border-radius:6px;vertical-align:middle}
  .pf-edit:hover{color:var(--acc);background:var(--card2)}
  .pf-rows{display:flex;flex-direction:column}
  .pf-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);position:relative}
  .pf-row:last-child{border-bottom:0}
  .pf-row .k{font-size:13px;color:var(--mut);font-weight:700;flex:none;min-width:120px}
  .pf-row b{flex:1;min-width:0;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .pf-row b.mut{color:var(--mut);font-weight:600}
  .pf-go{flex:none;background:none;border:0;cursor:pointer;color:var(--acc);font-size:12.5px;font-weight:800;padding:6px 2px}
  .pf-date{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:0}   /* whole row opens the picker */
  .pf-name-in{width:100%;padding:11px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);font:inherit;font-size:15px;font-weight:700}
  .pf-name-in:focus{outline:none;border-color:var(--acc)}
  .wod-word{font-size:23px;font-weight:900;color:var(--txt);font-family:var(--serif);margin:2px 0 4px;line-height:1.15}
  .wod-pos{font-size:13px;color:var(--gold);font-weight:600;font-family:Inter,sans-serif}
  .wod-th{font-size:14px;color:var(--acc);font-weight:700;margin-bottom:8px}
  .wod-ex{font-size:12px;color:var(--mut);font-style:italic;line-height:1.5;margin:0}
  @keyframes modalFade{from{opacity:0}to{opacity:1}}
  .modal-back{position:fixed;inset:0;background:rgba(6,9,14,.62);z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;animation:modalFade .18s ease}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;width:min(400px,92vw);box-shadow:0 24px 70px rgba(0,0,0,.45);animation:tourPop .24s cubic-bezier(.34,1.3,.5,1)}
  .modal h3{margin:0 0 14px;font-size:17px;font-weight:800}
  /* goal modal — big total on top, Listening/Reading split beneath (always sums to the total) */
  .gm-total{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 10px}
  .gm-in{font:inherit;font-family:var(--serif);font-size:19px;font-weight:800;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;text-align:center;padding:7px 4px;width:84px;-moz-appearance:textfield;appearance:textfield}
  .gm-in::-webkit-inner-spin-button,.gm-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .gm-in:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:1px;border-color:var(--acc)}
  .gm-big{font-size:32px;width:132px;color:var(--acc)}
  .gm-hint{font-size:12px;color:var(--mut);text-align:center;margin:0 0 12px;line-height:1.5}
  .gm-split{display:flex;align-items:flex-end;justify-content:center;gap:10px}
  .gm-part{flex:1;text-align:center}
  .gm-lbl{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
  .gm-ctl{display:flex;align-items:center;justify-content:center;gap:6px}
  .gm-plussign{font-size:18px;font-weight:800;color:var(--mut);padding-bottom:10px}
  .gm-btn{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .gm-btn:hover{border-color:var(--acc);color:var(--acc)}
  .gm-btn.sm{width:28px;height:28px;font-size:15px}
  .gm-cefr{margin:9px auto 0;max-width:128px;font-size:11px;color:var(--mut)}
  .gm-cefr-row{display:flex;justify-content:space-between;gap:8px;padding:1px 7px;border-radius:6px}
  .gm-cefr-row b{font-weight:700}
  .gm-cefr-row.on{color:var(--acc);background:rgba(var(--acc-rgb),.12);font-weight:700}
  /* score→CEFR reference table on the Tricks page */
  .cefr-tbl{display:flex;flex-direction:column;gap:8px}
  .cefr-row{display:grid;grid-template-columns:48px 100px 100px 1fr;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
  .cefr-lv{font-weight:800;font-size:17px;color:var(--acc)}
  .cefr-rng{font-size:13px;font-weight:700}
  .cefr-rng b{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-bottom:1px}
  .cefr-can{font-size:12.5px;color:var(--mut);line-height:1.55}
  @media(max-width:600px){.cefr-row{grid-template-columns:44px 1fr 1fr;row-gap:6px}.cefr-can{grid-column:1/-1}}
  .lc-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:8px}
  .lc-opt>.ic{font-size:18px;line-height:1;width:22px;text-align:center;flex:none}
  .lc-opt.rec{border-color:var(--acc);background:rgba(var(--acc-rgb),.08)}
  .lc-rec{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--acc);background:rgba(var(--acc-rgb),.14);padding:2px 8px;border-radius:99px}
  /* Skill-chooser rows: icon tile + title + a line that names the radar value this
     path feeds. The marker is the SAME stroke the radar legend uses — solid indigo
     for the filled accuracy area, dashed gold for the hollow discipline outline. */
  .lc-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card2);
    color:var(--txt);cursor:pointer;margin-bottom:9px;transition:border-color .15s,background .15s,transform .15s}
  .lc-row:hover{border-color:var(--acc);background:rgba(var(--acc-rgb),.07);transform:translateY(-1px)}
  .lc-row:active{transform:translateY(0);opacity:.9}
  .lc-row:focus-visible{outline:3px solid rgba(var(--acc-rgb),.45);outline-offset:2px}
  /* outline only: the tinted fill dulled the art, but the frame still has a job —
     its colour says which metric the row feeds (gold = discipline, indigo = accuracy) */
  .lc-tile{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:21px;line-height:1;background:none;border:1.5px solid var(--line)}

    filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))}

  .lc-body{flex:1;min-width:0}

    background:var(--acc);border-radius:2px}

  .lc-mk.disc{height:2px;border-radius:0;

  .tch-best{flex:none;font-size:20px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
  .tch-best small{font-size:11px;color:var(--mut);font-weight:700}

  .rank-hero{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh2);position:relative;overflow:hidden}

       wordmark truncates instead of shoving the gear off-screen, and the gaps/toggle tighten. */
    .topnav-in{padding:12px 14px;gap:8px;min-width:0}

    .nav-burger,.nav-profile .av,.nav-gear{width:34px;height:34px}

  .stats{display:flex;gap:8px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center;box-shadow:var(--sh1)}
  /* value + unit, not one flat string: the number is what changes and what you look at, so it carries
     the weight and the accent; "XP" is a label and steps back. Replaces the 💎 that used to do this job. */
  /* Negative margins cancel TRAILING letter-spacing. CSS adds the tracking after every character
     including the last one, so `.chip-u`'s .6px left dead air baked into the right edge of the pill
     while `margin-left:-1px` pulled the pair leftwards — the content sat ~1.6px off-centre inside a
     pill with only 11px of padding, which is plainly visible at this size. */
  .chip b{font-size:14.5px;font-weight:800;color:var(--acc);letter-spacing:-.2px;margin-right:.2px}
  /* 12px, not 10.5: on a shared baseline a very small label reads as bottom-anchored debris rather
     than part of the phrase. Big enough to sit as a word next to the figure, still clearly secondary. */
  .chip .chip-u{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.5px;margin-left:-1px;margin-right:-.5px}
  /* the XP chip is a button; it must not inherit the UA button font, and it should say it's tappable */
  /* Baseline, paired with the 12px label above — the two go together. Centring the boxes left the

  .chip-btn{font:inherit;font-weight:600;cursor:pointer;color:inherit;transition:.15s;

  .rlabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.15;
    background:none;border:0;cursor:pointer;font:inherit;padding:5px 7px;border-radius:12px;transition:background .15s,transform .15s}
  .rlabel:hover{background:var(--card2);transform:translate(-50%,-50%) scale(1.07)}

  .rlabel .ri{width:26px;height:26px;object-fit:contain;margin-bottom:2px}
  .rlabel .rn{font-size:10.5px;font-weight:700;color:var(--txt)}
  .rlabel .rv{font-size:10.5px;font-weight:800;color:var(--acc)}
  .radar-legend{display:flex;justify-content:center;gap:22px;margin-top:-4px;font-size:12px;color:var(--mut);font-weight:600}
  @media(max-width:560px){.radar-legend{margin-top:4px}}
  .radar-legend span{display:inline-flex;align-items:center;gap:6px}
  .radar-legend i{width:18px;height:2px;display:inline-block;border-radius:2px}
  /* round swatch: the trend chart's identity lives in its dots, so its legend shows dots, not bars */
  .radar-legend .lg-dot{width:9px;height:9px;border-radius:50%}

  .radar-legend .lg-disc{height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 4px,transparent 4px 7px)}

  .radar-legend .lg-off{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;
