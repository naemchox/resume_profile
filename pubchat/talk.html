        <span class="small muted">${T('Tap the map to drop your pin','แตะแผนที่เพื่อปักหมุดของคุณ')}</span>
      </div>
    </div>
    <div class="meet-stage"><div id="meetmap"></div>
      <div class="meet-hud">
        <div class="meet-hint" id="meetHint">${T('Tap anywhere on the map to suggest where to meet.','แตะที่ใดก็ได้บนแผนที่เพื่อเสนอจุดนัดพบ')}</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-rose" id="meetSend" style="flex:1" disabled>${icon('send',18)} ${T('Share this spot','แชร์จุดนี้')}</button>
          <button class="btn btn-cta" id="meetNav" style="flex:1" disabled>${icon('compass',18)} ${T('Navigate','นำทาง')}</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  $('#meetBack',ov).onclick=()=>closeMeetPoint(ov);
  $('#meetNav',ov).onclick=()=>meetNavChoice();

  const d=_room.data||{};
  const myLive=(_room.meIsA?d.locA:d.locB), otherLive=(_room.meIsA?d.locB:d.locA);
  let center=[100.5018,13.7563];           // Bangkok fallback
  if(myLive?.lat!=null && otherLive?.lat!=null) center=[(myLive.lng+otherLive.lng)/2,(myLive.lat+otherLive.lat)/2];
  else if(myPos()) center=[myPos().lng,myPos().lat];

  _meetMyChoice=null; _meetMyMarker=_meetOtherMarker=null;
  _meetMap=new maplibregl.Map({ container:'meetmap', style:nearbyMapStyle(),
    center, zoom:16, attributionControl:true });
  _meetMap.on('load',()=>{
    _meetMap.resize();
    _meetMap.on('click', e=> placeMyMeet({lat:e.lngLat.lat,lng:e.lngLat.lng}, false));
    paintMeetMarkers(_room.data||{});
  });

  $('#meetSend',ov).onclick=async()=>{
    if(!_meetMyChoice) return;
    const side=_room.meIsA?'meetA':'meetB';
    try{
      await updateDoc(doc(db,'chats',cid),{[side]:{lat:_meetMyChoice.lat,lng:_meetMyChoice.lng,at:Date.now()}});
      await addDoc(collection(db,'chats',cid,'messages'),{type:'sys',
        text:T(`📍 ${S.profile?.displayName||'Someone'} suggested a meeting point`,`📍 ${S.profile?.displayName||'ใครบางคน'} เสนอจุดนัดพบ`),createdAt:Date.now()});
      toast(T('Meeting point shared','แชร์จุดนัดพบแล้ว'));
    }catch(_){ toast(T('Couldn’t share — try again','แชร์ไม่สำเร็จ — ลองอีกครั้ง')); }
  };

  // live-reflect the other person's pin (and restore mine on reopen)
  _meetUnsub=onSnapshot(doc(db,'chats',cid), s=>{ if(s.exists()){ _room.data=s.data(); paintMeetMarkers(_room.data); } });
}

// drop / move MY suggested pin (avatar marker, amber ring)
function placeMyMeet(pos, fromDoc){
  if(!_meetMap) return;
  _meetMyChoice=pos;
  if(_meetMyMarker) _meetMyMarker.setLngLat([pos.lng,pos.lat]);
  else _meetMyMarker=new maplibregl.Marker({element:meetTokenEl(S.profile,true),anchor:'bottom'})
    .setLngLat([pos.lng,pos.lat]).addTo(_meetMap);
  const sb=$('#meetSend'); if(sb) sb.disabled=false;
  const nb=$('#meetNav'); if(nb) nb.disabled=false;   // my point now exists → navigable
  const h=$('#meetHint'); if(h) h.textContent = fromDoc
    ? T('Tap the map to move your pin, or share it again.','แตะแผนที่เพื่อย้ายหมุด หรือแชร์อีกครั้ง')
    : T('Tap “Share this spot” to send it to the chat.','แตะ “แชร์จุดนี้” เพื่อส่งไปที่แชท');
}

function paintMeetMarkers(d){
  if(!_meetMap) return;
  const mySide=_room.meIsA?'meetA':'meetB', otherSide=_room.meIsA?'meetB':'meetA';
  const o=d[otherSide];
  if(o?.lat!=null){
    if(_meetOtherMarker) _meetOtherMarker.setLngLat([o.lng,o.lat]);
    else _meetOtherMarker=new maplibregl.Marker(
      {element:meetTokenEl({displayName:_room.otherName,photoURL:_room.otherPhoto},false),anchor:'bottom'})
      .setLngLat([o.lng,o.lat]).addTo(_meetMap);
    const nb=$('#meetNav'); if(nb) nb.disabled=false;   // their point exists → navigable
  }
  // restore my previously-shared pin if I haven't placed one this session
  const me=d[mySide];
  if(me?.lat!=null && !_meetMyChoice) placeMyMeet({lat:me.lat,lng:me.lng}, true);
}

function closeMeetPoint(ov){
  _meetUnsub?.(); _meetUnsub=null;
  if(_meetMap){ try{ _meetMap.remove(); }catch(_){} _meetMap=null; }
  _meetMyMarker=_meetOtherMarker=null; _meetMyChoice=null;
  ov.remove();
}

// Ask which meeting point to walk to, then launch the live navigator toward it.
function meetNavChoice(){
  if(!_room) return;
  const d=_room.data||{};
  const mySide=_room.meIsA?'meetA':'meetB', otherSide=_room.meIsA?'meetB':'meetA';
  const mine=_meetMyChoice || d[mySide];      // my own pick (local pick counts even before sharing)
  const other=d[otherSide];                   // the other person's shared pick
  if(mine?.lat==null && other?.lat==null) return toast(T('No meeting point yet','ยังไม่มีจุดนัดพบ'));
  const sc=el('div','modal-scrim');
  sc.innerHTML=`<div class="sheet"><div class="list">
    <div class="small muted" style="text-align:center;margin-bottom:2px">${T('Navigate to which point?','นำทางไปจุดไหน?')}</div>
    ${mine?.lat!=null?`<button class="btn btn-rose btn-block" id="navMine">${icon('pin',18)} ${T('The point I chose','จุดที่ฉันเลือก')}</button>`:''}
    ${other?.lat!=null?`<button class="btn btn-cta btn-block" id="navOther">${icon('pin',18)} ${T(`${esc(_room.otherName)}’s point`,`จุดที่ ${esc(_room.otherName)} เลือก`)}</button>`:''}
    <button class="btn btn-block" id="navCancel">${T('Cancel','ยกเลิก')}</button>
  </div></div>`;
  document.body.appendChild(sc);
  sc.onclick=e=>{ if(e.target===sc) sc.remove(); };
  $('#navCancel',sc).onclick=()=>sc.remove();
  if(mine?.lat!=null) $('#navMine',sc).onclick=()=>{ sc.remove();
    openCompass(_room.other,{lat:mine.lat,lng:mine.lng,who:S.profile,title:T('My meeting point','จุดนัดพบของฉัน')}); };
  if(other?.lat!=null) $('#navOther',sc).onclick=()=>{ sc.remove();
    openCompass(_room.other,{lat:other.lat,lng:other.lng,who:{displayName:_room.otherName,photoURL:_room.otherPhoto},
      title:T(`${_room.otherName}’s point`,`จุดนัดพบของ ${_room.otherName}`)}); };
}

/* ----- full-screen Pokémon-GO-style live navigator ----------------------- *
 * A tilted 3-D map (CARTO dark, same look as the Nearby map) that follows YOU  *
 * like a Pokémon GO trainer: your avatar token stays centred, the world spins  *
 * to your phone's heading, a glowing "ant-march" trail and beacon lead to the  *
 * stranger's live spot, and the distance ticks down until you're on top of it. */
let _navMap=null,_navMeMarker=null,_navTgtMarker=null,_navRAF=null,_navTick=null,
    _navFollow=true,_navCenter=null,_navBearing=0,_navDashI=0,_navArrived=false;
// ant-march dash frames — animated to make the trail "flow" toward the target
const NAV_DASH=[[0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,.5],
  [3,4,0],[0,.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,.5]];
const lerp=(a,b,t)=>a+(b-a)*t;
// shortest-path angular lerp (handles the 359°→0° wrap so the map never spins the long way)
function lerpAngle(a,b,t){ let d=((b-a+540)%360)-180; return (a+d*t+360)%360; }

function navTokenEl(kind, who){
  // OUTER div is what MapLibre positions — keep it unstyled so its absolute,
  // GPS-locked placement isn't overridden (otherwise the pin drifts on zoom).
  // All visuals (incl. the position:relative needed by the cone/beam/halo) live
  // on the inner .nav-tok.
  const e=el('div');
  const inner=el('div','nav-tok '+kind);
  who = who || (kind==='me' ? S.profile : {displayName:_room.otherName, photoURL:_room.otherPhoto});
  inner.innerHTML = (kind==='me'
      ? `<div class="nav-cone"></div>`
      : `<div class="nav-beam"></div><div class="nav-halo"></div>`)
    + `<div class="ava">${avatar(who,'sm')}</div><div class="stem"></div><div class="dot"></div>`;
  e.appendChild(inner);
  return e;
}

// targetUid → live navigation to that person's shared location.
// Pass `dest` ({lat,lng,title,who}) to instead navigate to a fixed point
// (e.g. a chosen meeting point) — no live subscription, destination never moves.
function openCompass(targetUid, dest){
  const isStatic = !!dest;
  const ov=el('div','overlay'); ov.id='compassOv';
  ov.innerHTML=`
    <style>
      #compassOv{background:#0A0A0A}
      .nav-stage{flex:1;position:relative;overflow:hidden}
      #navmap{position:absolute;inset:0}
      .maplibregl-ctrl-attrib{font-size:9px;background:rgba(0,0,0,.4)!important}
      .nav-vignette{position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 170px 36px rgba(0,0,0,.72)}
      .nav-hud{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;
        padding:22px 18px calc(20px + var(--sa-b));background:linear-gradient(to top,rgba(10,10,10,.94),rgba(10,10,10,.55) 62%,transparent)}
      .nav-dist{font-family:var(--serif);font-weight:600;font-size:36px;letter-spacing:-.01em;line-height:1}
      .nav-stat{font-size:13px;color:var(--muted);text-align:center;max-width:300px}
      .nav-actions{display:flex;gap:10px;margin-top:4px}
      .nav-recenter{position:absolute;right:14px;bottom:150px;z-index:6;width:46px;height:46px;border-radius:50%;
        background:rgba(20,20,20,.85);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;
        color:var(--text);backdrop-filter:blur(8px);transition:color .2s,border-color .2s}
      .nav-recenter.off{color:var(--amber);border-color:var(--amber)}
      /* trainer / target ground tokens (avatar floats over a stem whose dot marks the real GPS spot) */
      .nav-tok{position:relative;display:flex;flex-direction:column;align-items:center;pointer-events:none}
      .nav-tok .ava{width:54px;height:54px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:var(--bg-2);box-shadow:0 7px 18px rgba(0,0,0,.7)}
      .nav-tok .ava .avatar{width:100%;height:100%}
      .nav-tok .stem{width:2px;height:14px;background:#fff;box-shadow:0 0 5px rgba(0,0,0,.6)}
      .nav-tok .dot{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.7)}
      .nav-tok.me .ava{border-color:var(--amber);box-shadow:0 7px 18px rgba(0,0,0,.7),0 0 16px rgba(240,82,44,.6)}
      .nav-tok.me .dot{background:var(--amber);box-shadow:0 0 11px rgba(240,82,44,.85)}
      /* facing view-cone — always points up on screen = the direction you're walking */
      .nav-cone{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:0;height:0;
        border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:52px solid rgba(240,82,44,.26);filter:blur(1.5px)}
      /* destination beacon: a Pokémon-GO-style beam of light + a pulsing catch halo */
      .nav-beam{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:16px;height:150px;border-radius:9px;z-index:-1;
        background:linear-gradient(to top,rgba(240,82,44,0),rgba(240,82,44,.5) 38%,rgba(255,107,71,0));animation:navBeam 1.8s ease-in-out infinite}
      .nav-halo{position:absolute;bottom:-6px;left:50%;width:64px;height:64px;border-radius:50%;transform:translate(-50%,0);z-index:-1;
        border:2px solid rgba(240,82,44,.55);box-shadow:0 0 18px rgba(240,82,44,.45) inset;animation:navHalo 1.9s ease-out infinite}
      @keyframes navBeam{0%,100%{opacity:.4}50%{opacity:.95}}
      @keyframes navHalo{0%{transform:translate(-50%,0) scale(.7);opacity:.9}100%{transform:translate(-50%,0) scale(1.35);opacity:0}}
    </style>
    <div class="overlay-header"><button class="icon-btn" id="cback">${icon('back')}</button><b class="ellipsis">${isStatic?esc(dest.title||T('Meeting point','จุดนัดพบ')):T(`Guide to ${esc(_room.otherName)}`,`นำทางไปหา ${esc(_room.otherName)}`)}</b></div>
    <div class="nav-stage">
      <div id="navmap"></div>
      <div class="nav-vignette"></div>
      <button class="nav-recenter" id="navRecenter" aria-label="${T('Re-center on me','กลับมาที่ตำแหน่งฉัน')}">${icon('pin',20)}</button>
      <div class="nav-hud">
        <div class="nav-dist" id="cdist">…</div>
        <div class="nav-stat" id="cstat">${T('Locating…','กำลังหาตำแหน่ง…')}</div>
        <div class="nav-actions"><button class="btn btn-ghost btn-sm" id="enableC">${icon('compass',16)} ${T('Enable phone compass','เปิดเข็มทิศของโทรศัพท์')}</button></div>
      </div>
    </div>`;
  document.body.appendChild(ov);

  let targetPos = isStatic ? {lat:dest.lat,lng:dest.lng} : null, sharing=true;
  const close=()=>{
    S.unsub.compassTarget?.(); S.unsub.compassTarget=null;
    if(_navRAF){ cancelAnimationFrame(_navRAF); _navRAF=null; }
    clearInterval(_navTick); _navTick=null;
    if(_navMap){ try{ _navMap.remove(); }catch(_){} _navMap=null; }
    _navMeMarker=_navTgtMarker=_navCenter=null; _navArrived=false;
    ov.remove();
  };
  $('#cback',ov).onclick=close;
  $('#enableC',ov).onclick=async()=>{ const ok=await enableHeading(); if(ok) toast(T('Compass on — turn your phone to spin the map','เปิดเข็มทิศแล้ว — หมุนโทรศัพท์เพื่อหมุนแผนที่')); };

  // live target location from the chat doc (only while BOTH still share).
  // Skipped for a static destination — the meeting point never moves.
  if(!isStatic) S.unsub.compassTarget = onSnapshot(doc(db,'chats',_room.cid), s=>{
    const d=s.data(); if(!d) return;
    const side = d.members[0]===targetUid ? d.locA : d.locB;
    if(!d.compassActive || !side?.on){ sharing=false; targetPos=null; }
    else { sharing=true; targetPos={lat:side.lat,lng:side.lng}; }
  });

  if(!window.maplibregl){ $('#cstat',ov).textContent=T('Map unavailable on this device.','ไม่สามารถแสดงแผนที่บนอุปกรณ์นี้'); return; }
  const me0=myPos();
  _navFollow=true; _navArrived=false;
  _navCenter=me0 ? {lat:me0.lat,lng:me0.lng} : {lat:13.7563,lng:100.5018};
  _navBearing=0;
  _navMap=new maplibregl.Map({
    container:'navmap', style:nearbyMapStyle(),
    center:[_navCenter.lng,_navCenter.lat], zoom:18, pitch:62, bearing:0,
    attributionControl:true, dragRotate:true, pitchWithRotate:false
  });
  // any manual pan drops "follow"; the recenter button (or arriving) snaps back
  _navMap.on('dragstart',()=>{ _navFollow=false; $('#navRecenter',ov)?.classList.add('off'); });
  $('#navRecenter',ov).onclick=()=>{ _navFollow=true; $('#navRecenter',ov).classList.remove('off'); };

  _navMap.on('load',()=>{
    _navMap.resize();
    _navMap.addSource('navroute',{type:'geojson',data:_emptyFC});
    _navMap.addLayer({id:'navroute-glow',type:'line',source:'navroute',
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':'#FF6B47','line-width':13,'line-opacity':0.16,'line-blur':7}});
    _navMap.addLayer({id:'navroute-line',type:'line',source:'navroute',
      layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-color':'#F0522C','line-width':5,'line-opacity':0.95,'line-dasharray':NAV_DASH[0]}});
    _navMeMarker=new maplibregl.Marker({element:navTokenEl('me'),anchor:'bottom'})
      .setLngLat([_navCenter.lng,_navCenter.lat]).addTo(_navMap);

    // smooth camera follow + heading spin + flowing trail — one rAF, ~unthrottled
    let frame=0;
    const navFrame=()=>{
      if(!_navMap){ return; }
      const me=myPos();
      if(me && _navFollow){
        _navCenter.lat=lerp(_navCenter.lat,me.lat,0.18);
        _navCenter.lng=lerp(_navCenter.lng,me.lng,0.18);
        _navMap.setCenter([_navCenter.lng,_navCenter.lat]);
        if(S.heading!=null){ _navBearing=lerpAngle(_navBearing,S.heading,0.15); _navMap.setBearing(_navBearing); }
      }
      if(++frame%5===0 && _navMap.getLayer('navroute-line')){
        _navDashI=(_navDashI+1)%NAV_DASH.length;
        _navMap.setPaintProperty('navroute-line','line-dasharray',NAV_DASH[_navDashI]);
      }
      _navRAF=requestAnimationFrame(navFrame);
    };
    _navRAF=requestAnimationFrame(navFrame);

    // slower loop: marker positions, trail geometry, distance read-out & status copy
    const update=()=>{
      const me=myPos();
      if(me && _navMeMarker) _navMeMarker.setLngLat([me.lng,me.lat]);
      const dEl=$('#cdist',ov), sEl=$('#cstat',ov);
      if(!me){ if(sEl) sEl.textContent=T('Waiting for your location…','กำลังรอตำแหน่งของคุณ…'); return; }
      if(!sharing || !targetPos){
        if(_navTgtMarker){ _navTgtMarker.remove(); _navTgtMarker=null; }
        _navMap.getSource('navroute')?.setData(_emptyFC);
        if(dEl) dEl.textContent='–';
        if(sEl) sEl.textContent=T('Location sharing paused — ask them to keep it on.','หยุดแชร์ตำแหน่งชั่วคราว — ขอให้อีกฝ่ายเปิดไว้');
        return;
      }
      if(!_navTgtMarker) _navTgtMarker=new maplibregl.Marker({element:navTokenEl('target', isStatic?dest.who:null),anchor:'bottom'}).setLngLat([targetPos.lng,targetPos.lat]).addTo(_navMap);
      else _navTgtMarker.setLngLat([targetPos.lng,targetPos.lat]);
      _navMap.getSource('navroute')?.setData({type:'Feature',geometry:{type:'LineString',
        coordinates:[[me.lng,me.lat],[targetPos.lng,targetPos.lat]]}});
      const dist=haversine(me,targetPos);
      if(dEl) dEl.textContent=distLabel(dist);
      if(dist<15){
        if(sEl) sEl.textContent=T("You're basically there! 🎉",'เกือบถึงแล้ว! 🎉');
        if(!_navArrived){ _navArrived=true; _navFollow=true; _navMap.easeTo({zoom:19,duration:600}); }
      } else {
        _navArrived=false;
        if(sEl) sEl.textContent = S.heading==null
          ? T('Walk along the glowing trail to reach them','เดินตามเส้นทางเรืองแสงเพื่อไปหาอีกฝ่าย')
          : T('Map turns with you — follow the trail of light','แผนที่หมุนตามคุณ — เดินตามแสงนำทาง');
      }
    };
    update(); _navTick=setInterval(update,400);
  });
}

/* ========================= room menu (block/report) ========================= */
function roomMenu(){
  const sc=el('div','modal-scrim');
  sc.innerHTML=`<div class="sheet"><div class="list">
    <button class="btn btn-ghost btn-block" id="peek">${icon('user',18)} ${T('View profile','ดูโปรไฟล์')}</button>
    <button class="btn btn-cta btn-block" id="meetup">${icon('compass',18)} ${T('Meet up','นัดเจอ')}</button>
    <button class="btn btn-rose btn-block" id="befriend">${icon('scan',18)} ${T('Become friends (scan QR)','เป็นเพื่อนกัน (สแกน QR)')}</button>
    <button class="btn btn-ghost btn-block" id="delchat" style="color:#fca5a5">${icon('trash',18)} ${T('Delete chat (for me)','ลบแชท (สำหรับฉัน)')}</button>
    <button class="btn btn-ghost btn-block" id="report">${icon('spark',18)} ${T('Report','รายงาน')}</button>
    <button class="btn btn-block" id="block" style="background:rgba(239,68,68,.15);color:#fca5a5">🚫 ${T(`Block ${esc(_room.otherName)}`,`บล็อก ${esc(_room.otherName)}`)}</button>
    <button class="btn btn-block" id="cancel">${T('Cancel','ยกเลิก')}</button>
  </div></div>`;
  document.body.appendChild(sc);
  sc.onclick=e=>{ if(e.target===sc) sc.remove(); };
  $('#cancel',sc).onclick=()=>sc.remove();
  $('#peek',sc).onclick=()=>{ sc.remove(); toast(_room.otherName); };
  $('#meetup',sc).onclick=()=>{ sc.remove(); openMeetSheet(_room.other, _room.otherName); };
  $('#befriend',sc).onclick=()=>{ sc.remove(); openFriendSheet(_room.other, _room.otherName); };
  $('#delchat',sc).onclick=async()=>{
    const cid=_room.cid; sc.remove();
    await hideChat(cid);
    closeRoomCleanup(); $('#roomOv')?.remove();
    switchTab('chats');
    toast(T('Chat deleted from your list','ลบแชทออกจากรายการของคุณแล้ว'));
  };
  // A report used to arrive as two uids and a timestamp, which is useless when something serious
  // happened — ask for the reason while the person is still angry enough to type it.
  $('#report',sc).onclick=async()=>{
    sc.remove();
    const why = prompt(T('What happened? This goes to us, not to them.','เกิดอะไรขึ้น? ข้อความนี้ส่งถึงเราเท่านั้น ไม่ถึงอีกฝ่าย'));
    if(why===null) return;                       // cancelled — do not block silently
    await blockUser(_room.other, true, (why||'').slice(0,500));
    $('#roomOv')?.remove();
    toast(T('Reported & blocked','รายงานและบล็อกแล้ว'));
  };
  $('#block',sc).onclick=async()=>{ await blockUser(_room.other,false); sc.remove(); $('#roomOv')?.remove(); toast(T('Blocked','บล็อกแล้ว')); };
}
async function blockUser(uid,reported,reason){
  // A report has to leave the reporter's own subtree to mean anything: blocks/{me}/blocked/*
  // is readable only by me, so a `reported` flag in there is a report nobody can ever act on.
  // File it in the top-level moderation queue first, then block locally.
  if(reported){
    try{
      await addDoc(collection(db,'reports'),{
        reporter:S.user.uid, reportedUid:uid, cid:_room?.cid||null,
        reason: reason||'', at:Date.now(), status:'open'
      });
    }catch(e){ console.warn('report failed',e); }
  }
  await setDoc(doc(db,'blocks',S.user.uid,'blocked',uid),{at:Date.now(),reported:!!reported});
  S.blocked.add(uid);
  closeRoomCleanup();
  renderChats();
}
function closeRoomCleanup(){ S.unsub.room?.(); S.unsub.roomDoc?.(); clearInterval(S.chatLocTimer); _room=null; }

/* ========================= friendship · QR · XP · rewards ========================= *
 * A chat dies after 24h unless both people become friends. Friendship requires meeting
 * in person: one shows a QR (encodes their uid) and the other scans it. Scanning adds the
 * friend, sets chats/{cid}.friends=true (so the room never expires for either of them),
 * and grants +EXP_PER_FRIEND XP/points. Firestore rules only let me write my own user doc,
 * so the person who was scanned self-credits via reconcileFriendChats() on their next sync. */
const QR_PREFIX = 'PUBCHATFRIEND:';

async function becomeFriends(otherUid, otherName){
  if(!otherUid || otherUid===S.user.uid){ toast(T("That's your own code 🙂","นี่โค้ดของคุณเอง 🙂")); return; }
  const friends = S.profile.friends || [];
  const newFriend = !friends.includes(otherUid);
  const before = levelOf(S.profile.exp||0);
  // Credit locally BEFORE the awaits below. The chats-doc write fires our own onSnapshot →
  // reconcileFriendChats(); if our friends list weren't already updated, that handler would
  // double-grant the XP for this same friend. Marking up-front makes it a no-op there.
  if(newFriend){
    S.profile.friends=[...friends,otherUid];
    S.profile.exp=(S.profile.exp||0)+EXP_PER_FRIEND;
    S.profile.points=(S.profile.points||0)+EXP_PER_FRIEND;
  }
  // Persist any existing chat with this person, no matter what (so the room stops expiring).
  const cid = chatIdOf(S.user.uid, otherUid);
  try{
    const cs = await getDoc(doc(db,'chats',cid));
    if(cs.exists() && !cs.data().friends){
      await updateDoc(doc(db,'chats',cid),{friends:true});
      await addDoc(collection(db,'chats',cid,'messages'),{type:'sys',
        text:T('🤝 You met in person & became friends — this chat will stay open.','🤝 คุณเจอกันตัวจริงและเป็นเพื่อนกันแล้ว — แชทนี้จะเปิดค้างไว้'),createdAt:Date.now()});
      if(_room && _room.cid===cid){ _room.data={..._room.data,friends:true}; updateRoomCountdown(); }
    }
  }catch(_){ toast(T('Could not update the chat — check your connection','อัปเดตแชทไม่ได้ — ตรวจสอบการเชื่อมต่อ')); }

  if(!newFriend){ toast(T('Already friends 🤝','เป็นเพื่อนกันอยู่แล้ว 🤝')); return; }
  try{
    await updateDoc(doc(db,'users',S.user.uid),{friends:arrayUnion(otherUid)});   // no XP: see reconcileFriendChats
  }catch(e){
    // roll back the optimistic local credit
    S.profile.friends=S.profile.friends.filter(x=>x!==otherUid);
    S.profile.exp=(S.profile.exp||0)-EXP_PER_FRIEND; S.profile.points=(S.profile.points||0)-EXP_PER_FRIEND;
    toast(T('Could not save the friend — try again','บันทึกเพื่อนไม่ได้ ลองใหม่')); return;
  }
  const after = levelOf(S.profile.exp);
  toast(T(`Friend added! +${EXP_PER_FRIEND} XP 🎉`,`เพิ่มเพื่อนแล้ว! +${EXP_PER_FRIEND} XP 🎉`));
  if(after>before) setTimeout(()=>toast(T(`Level up — you're now level ${after}! 🏆`,`เลเวลอัป — ตอนนี้คุณเลเวล ${after}! 🏆`)),1300);
  refreshWalletPill();
  if(currentTab==='profile') renderProfile();
}

// Scan a friend's QR with the camera.
async function scanFriendQR(){
  if(!window.Html5Qrcode){ toast(T('Scanner not ready — check your connection','สแกนเนอร์ยังไม่พร้อม — ตรวจสอบการเชื่อมต่อ')); return; }
  const ov=el('div','overlay'); ov.id='scanOv';
  ov.innerHTML=`<div class="overlay-header"><button class="icon-btn" id="sback">${icon('back')}</button><b class="row" style="gap:8px">${icon('scan',18)} ${T('Scan a friend code','สแกนโค้ดเพื่อน')}</b></div>
    <div class="content col" style="align-items:center;gap:14px;padding:18px">
      <p class="small muted" style="text-align:center;max-width:300px">${T('Point your camera at your friend’s code on their phone. You must be together in person.','เล็งกล้องไปที่โค้ดบนโทรศัพท์ของเพื่อน คุณต้องอยู่ด้วยกันตัวจริง')}</p>
      <div id="reader" style="width:100%;max-width:340px;border-radius:16px;overflow:hidden;background:#000"></div>
      <span class="small muted" id="scanStat">${T('Starting camera…','กำลังเปิดกล้อง…')}</span>
    </div>`;
  document.body.appendChild(ov);
  const qr=new Html5Qrcode('reader'); let done=false;
  const stop=async()=>{ try{ if(qr.isScanning) await qr.stop(); await qr.clear(); }catch(_){} };
  $('#sback',ov).onclick=async()=>{ await stop(); ov.remove(); };
  const onScan=async(text)=>{
    if(done) return;
    const t=(text||'').trim();
    if(!t.startsWith(QR_PREFIX)){ const st=$('#scanStat',ov); if(st) st.textContent=T('That’s not a PubChat code — try again','นี่ไม่ใช่โค้ด PubChat ลองใหม่'); return; }
    done=true; await stop();
    const uid=t.slice(QR_PREFIX.length);
    let name=''; try{ const us=await getDoc(doc(db,'users',uid)); if(us.exists()) name=us.data().displayName||''; }catch(_){}
    await becomeFriends(uid,name);
    ov.remove();
    if(currentTab==='profile') renderProfile();
  };
  try{
    await qr.start({facingMode:'environment'},{fps:10,qrbox:230},onScan,()=>{});
    const st=$('#scanStat',ov); if(st) st.textContent=T('Point at the QR code','เล็งไปที่ QR โค้ด');
  }catch(e){
    const st=$('#scanStat',ov); if(st) st.textContent=T('Couldn’t open the camera — allow camera access and retry','เปิดกล้องไม่ได้ — อนุญาตกล้องแล้วลองใหม่');
  }
}

/* ========================= booked meet-ups + two-sided confirm =========================
 * The club sells one promise: the people you meet actually turn up. That promise needs a
 * measurement, and this is it — a booked meet-up that both people confirm in person by
 * scanning each other. Each side writes only its own field (firestore.rules enforces it), so
 * a no-show cannot mark itself present and a pair cannot farm credit one-sidedly.
 * Scoring is deliberately NOT here: phase P2 only records the events (RANKING-SPEC.md §5). */
const MEET_QR_PREFIX = 'PUBCHATMEET:';
const MEET_MIN_LEAD_MS = 2*60*60*1000;   // must match the 2h floor in firestore.rules

const meetMembers = (a,b)=> [a,b].sort();
// Which confirm field is mine on this doc — sorted members decide, same convention as chatIdOf.
const myMeetField = (m)=> m.members[0]===S.user.uid ? 'confA' : 'confB';
const theirMeetField = (m)=> m.members[0]===S.user.uid ? 'confB' : 'confA';
const meetBothConfirmed = (m)=> !!(m.confA && m.confB);
function meetWhen(ms){
  try{ return new Date(ms).toLocaleString(S.lang==='th'?'th-TH':'en-GB',
    {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(_){ return new Date(ms).toISOString().slice(0,16).replace('T',' '); }
}
function meetStatusLabel(m){
  if(meetBothConfirmed(m)) return T('Met ✓','เจอกันแล้ว ✓');
  if(m[myMeetField(m)])    return T('You confirmed — waiting for them','คุณยืนยันแล้ว — รออีกฝ่าย');
  if(m[theirMeetField(m)]) return T('They confirmed — scan to finish','อีกฝ่ายยืนยันแล้ว — สแกนเพื่อปิด');
  if(m.status==='declined')  return T('Declined','ปฏิเสธแล้ว');
  if(m.status==='cancelled') return T('Cancelled','ยกเลิกแล้ว');
  if(m.status==='accepted')  return T('Confirmed date','นัดแล้ว');
  return T('Waiting for a reply','รอการตอบรับ');
}

/* One ticket renderer for both the Meets tab and the in-chat sheet: the same object should not
 * be drawn twice in two slightly different ways. `who` is the other person's name. */
function meetTicketHTML(m, who){
  const mine=m[myMeetField(m)], theirs=m[theirMeetField(m)];
  const both=meetBothConfirmed(m), past=m.at < Date.now();
  const dead = m.status==='declined'||m.status==='cancelled';
  // If they stamped more than 15 minutes ago and you did not, the rules will refuse your write
  // forever. Say so and offer the way out, instead of leaving a Scan button that can only fail.
  const windowGone = !!theirs && !mine && (Date.now()-theirs) > 15*60*1000;
  const tick=`<span class="seal">${icon('check',13)}</span>`;
  const stamp=(label,at)=> at
    ? `<div class="stamp done">${tick} ${new Date(at).toLocaleTimeString(S.lang==='th'?'th-TH':'en-GB',{hour:'2-digit',minute:'2-digit'})}</div>`
    : `<div class="stamp"><span class="seal"></span> ${label}</div>`;
  return `<div class="ticket ${both||past?'past':''}">
    <div class="ticket-top">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
        <div class="col" style="min-width:0">
          <div class="ticket-when ${both||past?'sm':''}">${esc(meetWhen(m.at))}</div>
          ${m.place?`<div class="ticket-where">${esc(m.place)}</div>`:''}
        </div>
        <span class="small muted" style="text-align:right;flex:0 0 auto">${esc(meetStatusLabel(m))}</span>
      </div>
    </div>
    ${dead?'':`<div class="perf"></div>
    <div class="stubs">
      <div class="stub"><span class="stub-who">${T('You','คุณ')}</span>${stamp(T('Not yet','ยังไม่ยืนยัน'),mine)}</div>
      <div class="stub"><span class="stub-who">${esc(who||T('Them','อีกฝ่าย'))}</span>${stamp(T('Waiting','รอสแกน'),theirs)}</div>
    </div>`}
    ${(both||dead)?'':(windowGone
      ? `<div class="ticket-act col" style="gap:8px;align-items:stretch">
           <span class="small" style="color:var(--ember)">${T('The 15-minute confirm window has closed. This meet-up will not count — book another one.','หน้าต่างยืนยัน 15 นาทีปิดแล้ว นัดนี้จะไม่ถูกนับ — จองใหม่ได้เลย')}</span>
           <button class="btn btn-ghost btn-sm" data-cancel="${m.id}">${T('Cancel this meet-up','ยกเลิกนัดนี้')}</button>
         </div>`
      : `<div class="ticket-act">
      ${m.status==='proposed' && m.by!==S.user.uid
        ? `<button class="btn btn-rose btn-sm" data-acc="${m.id}" style="flex:1">${T('Accept','รับนัด')}</button>
           <button class="btn btn-ghost btn-sm" data-dec="${m.id}" style="flex:1">${T('Decline','ปฏิเสธ')}</button>`
        : `<button class="btn btn-rose btn-sm" data-qr="${m.id}" style="flex:1">${icon('qr',15)} ${T('Show code','โชว์โค้ด')}</button>
           <button class="btn btn-ghost btn-sm" data-scan="${m.id}" style="flex:1">${icon('scan',15)} ${T('Scan theirs','สแกนของเขา')}</button>`}
    </div>
    ${mine||past?'':`<div class="ticket-act" style="border-top:none;padding-top:0">
       <button class="btn btn-ghost btn-sm" data-cancel="${m.id}" style="flex:1">${T('Cancel','ยกเลิกนัด')}</button>
     </div>`}`)}
  </div>`;
}

async function loadPairMeets(otherUid){
  const qs = await getDocs(query(collection(db,'meets'), where('members','array-contains',S.user.uid)));
  return qs.docs.map(d=>({id:d.id, ...d.data()}))
    .filter(m=>m.members.includes(otherUid))
    .sort((x,y)=>y.at-x.at);
}

function proposeMeet(otherUid, otherName){
  const sc=el('div','modal-scrim');
  const soon = new Date(Date.now() + 26*60*60*1000);           // default: tomorrow-ish
  const pad = n=>String(n).padStart(2,'0');
  const localValue = `${soon.getFullYear()}-${pad(soon.getMonth()+1)}-${pad(soon.getDate())}T${pad(soon.getHours())}:00`;
  sc.innerHTML=`<div class="sheet">
    <h3 style="font-size:22px;margin-bottom:4px">${T('Book a meet-up','นัดเจอ')}</h3>
    <p class="small muted" style="margin:0 0 14px">${T('At least 2 hours from now, in a public place. Both of you confirm on the spot.','ต้องล่วงหน้าอย่างน้อย 2 ชั่วโมง และเป็นที่สาธารณะ ทั้งคู่ยืนยันตอนอยู่ที่นั่น')}</p>
    <div class="field"><label for="mkWhen">${T('When','เมื่อไหร่')}</label><input id="mkWhen" type="datetime-local" value="${localValue}"></div>
    <div class="field"><label for="mkPlace">${T('Where (public place)','ที่ไหน (ที่สาธารณะ)')}</label><input id="mkPlace" maxlength="80" placeholder="${T('Cafe, mall, hotel lobby…','ร้านกาแฟ ห้าง ล็อบบี้โรงแรม…')}"></div>
    <div class="list">
      <button class="btn btn-cta btn-block" id="mkSend">${T('Send invite','ส่งคำเชิญ')}</button>
      <button class="btn btn-block" id="mkCancel">${T('Cancel','ยกเลิก')}</button>
    </div></div>`;
  document.body.appendChild(sc);
  sc.onclick=e=>{ if(e.target===sc) sc.remove(); };
  $('#mkCancel',sc).onclick=()=>sc.remove();
  $('#mkSend',sc).onclick=async()=>{
    const at = new Date($('#mkWhen',sc).value).getTime();
    const place = $('#mkPlace',sc).value.trim();
    if(!at || isNaN(at)) return toast(T('Pick a date and time.','เลือกวันและเวลาด้วย'));
    if(at < Date.now() + MEET_MIN_LEAD_MS) return toast(T('Book at least 2 hours ahead.','ต้องนัดล่วงหน้าอย่างน้อย 2 ชั่วโมง'));
    if(!place) return toast(T('Add a public place.','ใส่สถานที่สาธารณะด้วย'));
    try{
      await addDoc(collection(db,'meets'), {
        members: meetMembers(S.user.uid, otherUid), by:S.user.uid,
        at, place, status:'proposed', createdAt:Date.now()
      });
      sc.remove();
      // Tell them in the chat too — a meet invite nobody notices is a meet that never happens.
      const cid = chatIdOf(S.user.uid, otherUid);
      // …and hold the chat open until after the meeting (see chatExpiresAt).
      try{ await updateDoc(doc(db,'chats',cid), {meetAt:at}); }catch(_){}
      try{
        await addDoc(collection(db,'chats',cid,'messages'), { type:'sys',
          text:T(`📅 Meet-up proposed: ${meetWhen(at)} · ${place}`,`📅 นัดเจอ: ${meetWhen(at)} · ${place}`),
          createdAt:Date.now() });
      }catch(_){ /* no chat room yet — the invite still exists in Meet up */ }
      toast(T('Invite sent','ส่งคำเชิญแล้ว'));
    }catch(e){ console.warn(e); toast(T('Could not send — try again.','ส่งไม่สำเร็จ — ลองอีกครั้ง')); }
  };
}

// Scan their meet code, then write MY side of the confirmation.
async function scanMeetQR(otherUid, otherName){
  if(!window.Html5Qrcode){ toast(T('Scanner not ready — check your connection','สแกนเนอร์ยังไม่พร้อม — ตรวจสอบการเชื่อมต่อ')); return; }
  const ov=el('div','overlay'); ov.id='scanOv';
  ov.innerHTML=`<div class="overlay-header"><button class="icon-btn" id="mback">${icon('back')}</button><b class="row" style="gap:8px">${icon('scan',18)} ${T('Confirm the meet-up','ยืนยันการเจอ')}</b></div>
    <div class="content col" style="align-items:center;gap:14px;padding:18px">
      <p class="small muted" style="text-align:center;max-width:300px">${T('Point your camera at their meet-up code. You have to be together for this to work.','เล็งกล้องไปที่โค้ดนัดของอีกฝ่าย ต้องอยู่ด้วยกันจริงจึงจะสำเร็จ')}</p>
      <div id="mreader" style="width:100%;max-width:340px;border-radius:16px;overflow:hidden;background:#000"></div>
      <span class="small muted" id="mscanStat">${T('Starting camera…','กำลังเปิดกล้อง…')}</span>
    </div>`;
  document.body.appendChild(ov);
  const qr=new Html5Qrcode('mreader'); let done=false;
  const stop=async()=>{ try{ if(qr.isScanning) await qr.stop(); await qr.clear(); }catch(_){} };
  $('#mback',ov).onclick=async()=>{ await stop(); ov.remove(); };
  const onScan=async(text)=>{
    if(done) return;
    const t=(text||'').trim(), st=$('#mscanStat',ov);
    if(!t.startsWith(MEET_QR_PREFIX)){ if(st) st.textContent=T('That’s not a meet-up code','นี่ไม่ใช่โค้ดนัด'); return; }
    done=true; await stop();
    const mid=t.slice(MEET_QR_PREFIX.length);
    try{
      const snap=await getDoc(doc(db,'meets',mid));
      // Rules would refuse this anyway; failing here just gives a readable message.
      if(!snap.exists() || !snap.data().members?.includes(S.user.uid)) throw new Error('not my meet');
      const field = myMeetField(snap.data());
      // Record where I was when I confirmed. Rules don't enforce distance (indoor GPS fails
      // too often to block on it) — scoring judges it later, so a faked pair leaves a trail.
      const p = myPos();
      await updateDoc(doc(db,'meets',mid), {
        [field]: Date.now(),
        [field+'Loc']: p ? {lat:p.lat, lng:p.lng} : null,
        status:'met'
      });
      ov.remove();
      toast(T('Confirmed — they confirm on their phone too','ยืนยันแล้ว — ให้อีกฝ่ายยืนยันในเครื่องเขาด้วย'));
      openMeetSheet(otherUid, otherName);
    }catch(e){
      console.warn(e); ov.remove();
      toast(T('Could not confirm that code.','ยืนยันโค้ดนี้ไม่ได้'));
    }
  };
  try{
    await qr.start({facingMode:'environment'},{fps:10,qrbox:230},onScan,()=>{});
    const st=$('#mscanStat',ov); if(st) st.textContent=T('Point at the QR code','เล็งไปที่ QR โค้ด');
  }catch(e){
    const st=$('#mscanStat',ov); if(st) st.textContent=T('Couldn’t open the camera — allow camera access and retry','เปิดกล้องไม่ได้ — อนุญาตกล้องแล้วลองใหม่');
  }
}

// Stranger Mode is an append-only QUEUE. _strangerSeen guarantees nobody you've already
// passed (or that's already queued) is ever re-added, so skipped people never come back.
let _strangerQueue=[], _strangerIdx=0, _strangerSeen=new Set(), _strangerWaiting=false;
let _lastSkipped=null;   // index of the most recently skipped stranger (one-level undo only)
function renderStranger(){
  const v=$('#view');
  if(!S.inStrangerMode){
    v.innerHTML=`<div class="pad">
      <div class="card col" style="gap:10px;align-items:center;text-align:center;padding:28px 18px">

        <p class="muted small">${T('Meet other members one at a time, outside the map. Everyone here is a paying member, and an invite is still an invite.','เจอสมาชิกคนอื่นทีละคนโดยไม่ต้องดูแผนที่ ทุกคนที่นี่เป็นสมาชิกที่จ่ายแล้ว และการทักยังนับเป็นคำเชิญเหมือนกัน')}</p>
        <button class="btn btn-cta btn-block" id="enter">${icon('shuffle',18)} ${T('Start mingling','เริ่มทำความรู้จัก')}</button>
      </div>

        <div class="col"><b class="row" style="gap:7px">${icon('shuffle',16)} ${T('Findable to mingle','ให้คนอื่นเจอได้')}</b><span class="small muted">${T('Let searchers match with you (separate from Nearby visibility)','ให้คนที่กำลังค้นหาจับคู่กับคุณได้ (แยกจากการมองเห็นแบบใกล้ฉัน)')}</span></div>
        ${switchEl('strToggle', S.strangerVisible)}
      </div>
    </div>`;
    $('#enter').onclick=async()=>{ S.inStrangerMode=true; await writePresence(); await initStrangerQueue(); renderStranger(); };
    bindSwitch('strToggle', async on=>{ S.strangerVisible=on; await writePresence(); });
    return;
  }
  v.innerHTML=`<div class="stranger-stage" id="strStage"></div>
    <div class="pad col" style="gap:10px">
      <button class="btn btn-ghost btn-block hidden" id="undoSkip">${icon('back')} ${T('Bring back last skip','เรียกคนที่เพิ่งข้ามกลับมา')}</button>
      <button class="btn btn-ghost btn-block" id="leave">${T('Stop mingling','หยุดทำความรู้จัก')}</button>
    </div>`;
  $('#leave').onclick=async()=>{ stopStrangerShuffle(); S.inStrangerMode=false; await writePresence(); switchTab('nearby'); };
  $('#undoSkip').onclick=()=>{
    if(_lastSkipped==null) return;
    _strangerIdx=_lastSkipped; _lastSkipped=null;   // restore only the latest skip, then it's spent
    showStrangerCard();
  };
  showStrangerCard();
  startStrangerShuffle();
}

// Every 3s, quietly look for people who joined AFTER you and add them to the BACK of the
// queue. It never reorders the line and never touches the card you're on — so skipped
// strangers don't come back, and you keep moving through the list at your own pace.
const STRANGER_REFRESH_MS = 3000;
function startStrangerShuffle(){
  stopStrangerShuffle();
  S.strangerTimer = setInterval(()=>{
    if(currentTab!=='stranger' || !S.inStrangerMode) return;
    pollStrangers();
  }, STRANGER_REFRESH_MS);
}
function stopStrangerShuffle(){
  if(S.strangerTimer){ clearInterval(S.strangerTimer); S.strangerTimer=null; }
}
// fetch everyone currently discoverable in Stranger Mode — bounded to my geohash neighbourhood
// when my location is known, with a graceful fallback to the global query.
async function fetchStrangerDocs(){
  const me=myPos();
  const cells = me ? geohashNeighbors(geohashEncode(me.lat,me.lng)) : null;
  const q1 = flag => cells
    ? query(collection(db,'presence'), where(flag,'==',true), where('geohash','in',cells))
    : query(collection(db,'presence'), where(flag,'==',true));
  // Mingle honours the same mutual filter as the radar — a second pool with different rules
  // would be a hole in the first one.
  const keep = docs => docs.filter(d=>{ const x=d.data(); return x.uid===S.user?.uid || mutualMatch(x); });
  try{
    const [visSnap, modeSnap] = await Promise.all([ getDocs(q1('strangerVisible')), getDocs(q1('inStrangerMode')) ]);
    return [...keep(visSnap.docs), ...keep(modeSnap.docs)];
  }catch(err){
    console.warn('[stranger] geohash query failed, falling back to global', err);
    const [visSnap, modeSnap] = await Promise.all([
      getDocs(query(collection(db,'presence'), where('strangerVisible','==',true))),
      getDocs(query(collection(db,'presence'), where('inStrangerMode','==',true))),
    ]);
    return [...keep(visSnap.docs), ...keep(modeSnap.docs)];   // same filter on the fallback path
  }
}
function validStranger(x, now){
  return x.uid!==S.user.uid && !S.blocked.has(x.uid) && !_strangerSeen.has(x.uid)
    && (now-(x.lastSeen||0)) < PRESENCE_FRESH_MS*4;
}
// (re)build the queue from scratch — used when you enter Stranger Mode
async function initStrangerQueue(){
  _strangerQueue=[]; _strangerIdx=0; _strangerSeen=new Set(); _strangerWaiting=false; _lastSkipped=null;
  const me=myPos(), now=Date.now();
  const batch=[];
  (await fetchStrangerDocs()).forEach(d=>{ const x=d.data();
    if(!validStranger(x,now)) return;
    _strangerSeen.add(x.uid);
    batch.push({...x, dist:haversine(me,{lat:x.lat,lng:x.lng})});
  });
  for(let i=batch.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [batch[i],batch[j]]=[batch[j],batch[i]]; } // shuffle the first batch only
  _strangerQueue=batch;
}
// append newcomers to the end of the line (no reorder, no position change)
async function pollStrangers(){
  const me=myPos(), now=Date.now();
  let added=0;
  (await fetchStrangerDocs()).forEach(d=>{ const x=d.data();
    if(!validStranger(x,now)) return;
    _strangerSeen.add(x.uid);
    _strangerQueue.push({...x, dist:haversine(me,{lat:x.lat,lng:x.lng})});
    added++;
  });
  // only auto-show if you're parked at the end of the line waiting for new people
  if(added>0 && _strangerWaiting && _strangerIdx<_strangerQueue.length) showStrangerCard();
  return added;
}
function showStrangerCard(){
  const st=$('#strStage'); if(!st) return;
  $('#undoSkip')?.classList.toggle('hidden', _lastSkipped==null);   // show only when there's a skip to undo
  if(_strangerIdx>=_strangerQueue.length){
    _strangerWaiting=true;
    st.innerHTML=`<div class="empty">${icon('shuffle',40)}<b>${T("You're all caught up",'คุณดูครบทุกคนแล้ว')}</b>
      <span class="small">${T("You've gone through everyone in line. New strangers join the back of the queue automatically.",'คุณดูทุกคนในคิวครบแล้ว สมาชิกใหม่จะเข้าคิวต่อท้ายให้อัตโนมัติ')}</span>
      <button class="btn btn-cta btn-sm" id="reshuffle">${icon('shuffle',16)} ${T('Reshuffle from the start','สับใหม่ตั้งแต่ต้น')}</button>
      <button class="btn btn-ghost btn-sm" id="checkNow">${T('Check for new people','ตรวจหาคนใหม่')}</button></div>`;
    $('#reshuffle').onclick=async()=>{ await initStrangerQueue(); showStrangerCard(); };   // rebuild the whole line (skipped people included) and start over
    $('#checkNow').onclick=async()=>{ await pollStrangers(); showStrangerCard(); };
    return;
  }
  _strangerWaiting=false;
  const p=_strangerQueue[_strangerIdx];
  const remaining=_strangerQueue.length-_strangerIdx-1;
  st.innerHTML=`<div class="tcard">
      <div class="photo" style="background:${p.photoURL?'#000':colorFor(p.displayName)}">${p.photoURL?avatarImg(p.photoURL,p.displayName):esc(initials(p.displayName))}</div>
      <div class="info"><div class="row"><b style="font-size:20px;flex:1" class="ellipsis">${esc(p.displayName)}</b><span class="pill">${icon('pin')} ${distLabel(p.dist)}</span></div>
      <p class="muted small" style="margin-top:6px">${esc(p.bio||T('Up for a chat.','พร้อมคุย'))}</p></div>
    </div>
    <div class="small muted" style="text-align:center">${remaining>0?T(`${remaining} more in line`,`อีก ${remaining} คนในคิว`):T('Last one in line','คนสุดท้ายในคิว')}</div>
    <div class="row" style="gap:14px"><button class="btn btn-ghost" id="skip" style="flex:1">${icon('close')} ${T('Next','ถัดไป')}</button>
    <button class="btn btn-cta" id="chat" style="flex:1">${icon('chat')} ${T('Chat','แชท')}</button></div>`;
  $('#skip').onclick=()=>{ _lastSkipped=_strangerIdx; _strangerIdx++; showStrangerCard(); };   // remember this skip so it can be undone
  // Mingle used to open a chat without touching the allowance, which made the quota — the only
  // concrete difference between a ฿2,900 and a ฿9,900 membership — bypassable by switching tabs,
  // and left those conversations out of the reciprocity log entirely.
  $('#chat').onclick=async()=>{
    try{
      const cid = await startChatWith(p,'stranger');
      toast(T(`Chat started with ${p.displayName}`,`เริ่มแชทกับ ${p.displayName} แล้ว`));
      switchTab('chats'); openRoom(cid);
    }catch(e){
      // the offer belongs at the moment they want one more, not in a toast
      if(isCapError(e)) return openInviteCapSheet();
      toast(T('Could not start the chat — check your connection','เริ่มแชทไม่ได้ — ตรวจสอบการเชื่อมต่อ'));
    }
  };
}

function pickImage(){

// Center-crop to a square and downscale to a small JPEG data URL (keeps Firestore writes light).
function fileToSquareDataURL(file, size=256, quality=0.72){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const s=Math.min(img.width,img.height);
      const sx=(img.width-s)/2, sy=(img.height-s)/2;
      const c=document.createElement('canvas'); c.width=size; c.height=size;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src=url;
  });
}

/* Turn-up rate straight from the meets themselves: a meeting whose time has passed counts as
 * kept only if BOTH stamps are on it. No stored score, nothing a client could inflate — and
 * no extra field for no-shows either, since a passed meet without both stamps IS the no-show. */
async function fillStanding(){
  let meets=[];
  try{
    const qs=await getDocs(query(collection(db,'meets'), where('members','array-contains',S.user.uid)));
    meets=qs.docs.map(d=>d.data());
  }catch(_){ return; }
  const now=Date.now();
  // Only meet-ups BOTH people agreed to count against you. Counting every passed booking meant
  // anyone could damage your turn-up rate for free by throwing invitations you never answered —
  // and the spec says "confirmed ÷ accepted" anyway. The spec's 3-meet floor is honoured too:
  // one missed coffee should not brand a new member with 0%.
  const due=meets.filter(m=>m.at<now && (m.status==='accepted' || m.status==='met'));
  const kept=due.filter(m=>meetBothConfirmed(m));
  const show=$('#stShow'), met=$('#stMet');
  if(show) show.textContent = due.length>=3 ? Math.round(kept.length/due.length*100)+'%' : '—';
  if(met)  met.textContent  = String(new Set(kept.map(m=>m.members.find(u=>u!==S.user.uid))).size);
}

async function buyBalls(n){
  const cost=PAID_BALL_COST*n;
  if(S.profile.coins<cost) return toast(T('Not enough coins — “Get more coins” (Phase 2)','เหรียญไม่พอ — “รับเหรียญเพิ่ม” (เฟส 2)'));
  await updateDoc(doc(db,'users',S.user.uid),{coins:increment(-cost),paidBalls:increment(n)});
  S.profile.coins-=cost; S.profile.paidBalls+=n;
  toast(T(`+${n} premium ball${n>1?'s':''}`,`+${n} ลูกบอลพรีเมียม`)); renderProfile(); refreshWalletPill();
}
function refreshWalletPill(){
  const p=S.profile;
  // The header pill counts invites now, not coins (the coin economy is dead — see top of file).
  const iv=$('#inviteN'); if(iv){ const l=invitesLeft(p); iv.textContent = l===Infinity?'∞':l; }
  const tk=$('#inviteTicks'); if(tk) tk.innerHTML = inviteTicksHTML(p);
  // An empty pill is the second place someone asks "so when do I get more?" — answer it there too.
  const wp=$('#walletPill');
  if(wp){ const spent = invitesLeft(p)<=0; wp.style.cursor = spent?'pointer':''; wp.onclick = spent?openInviteCapSheet:null; }
  const c=$('#coinN'); if(c) c.textContent=p.coins;
  const fl=$('#freeLeftPill'); if(fl) fl.textContent=p.freeBalls;
  const pl=$('#paidLeftPill'); if(pl) pl.textContent=p.paidBalls;
  const fn=$('#freeN'); if(fn) fn.textContent=p.freeBalls;
  const pn=$('#paidN'); if(pn) pn.textContent=p.paidBalls;
  updateFreeBallCountdownUI();
}

// Open the pack's Stripe Payment Link, tagging it with the buyer so the payment can be
// matched back to this account (for crediting via webhook / dashboard).
function startCheckout(pack){
  if(!pack.url){ toast(T('This pack isn’t set up yet — add its Stripe Payment Link in the code.','แพ็กนี้ยังไม่ถูกตั้งค่า — เพิ่มลิงก์ Stripe ในโค้ด'),3000); return; }
  const u=new URL(pack.url);
  u.searchParams.set('client_reference_id', S.user.uid);
  if(S.user.email) u.searchParams.set('prefilled_email', S.user.email);
  window.location.href = u.toString();
}

function teardown(){
  Object.values(S.unsub).forEach(u=>u&&u());
  clearTimeout(S.presenceTimer); clearInterval(S.presenceTimer); clearInterval(S.chatLocTimer); clearInterval(_freeBallTimer); clearInterval(_chatTtlTimer);
  stopStrangerShuffle();                  // stop the 3s stranger poll — otherwise it keeps firing getDocs with a signed-out session
  if(_geoWatch!=null){ navigator.geolocation.clearWatch(_geoWatch); _geoWatch=null; }
}

function ballSVG(kind){
  // Coral, not the old cinematic peach: this is the last object in the app still painted in a
  // colour the palette dropped. Tones come from tokens (--accent-2 / --gold-deep) so a future
  // theme change moves the ball with everything else.
  const grad = kind==='paid'
    ? `<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-2,#FF7355)"/><stop offset="1" stop-color="var(--accent,#FF4E2E)"/></linearGradient></defs>`
    : `<defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent,#FF4E2E)"/><stop offset="1" stop-color="var(--gold-deep,#C93A1E)"/></linearGradient></defs>`;
  if(kind==='broken') return `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="38" fill="#26262e" stroke="#3a3a45" stroke-width="3"/><path d="M30 35 45 50 30 60M70 35 55 50 70 62" stroke="#6e6e7a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
  const fill = kind==='paid'?'url(#bg2)':'url(#bg1)';
  return `<svg viewBox="0 0 100 100" width="100%" height="100%">${grad}
    <circle cx="50" cy="50" r="40" fill="${fill}"/>
    <path d="M10 50a40 40 0 0 1 80 0z" fill="var(--text,#F3F1EC)" opacity=".95"/>
    <rect x="10" y="46" width="80" height="8" fill="var(--bg,#0B0B0C)"/>
    <circle cx="50" cy="50" r="11" fill="var(--bg,#0B0B0C)"/><circle cx="50" cy="50" r="6" fill="var(--text,#F3F1EC)"/>
    ${kind==='paid'?'<circle cx="50" cy="50" r="40" fill="none" stroke="var(--text,#F3F1EC)" stroke-width="2" opacity=".5"/>':''}</svg>`;
}
// Classic red/white Poké Ball — used for the free chat-ball icon.
function pokeballSVG(size=26){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block">
    <circle cx="50" cy="50" r="46" fill="#fff" stroke="#15110E" stroke-width="5"/>
    <path d="M5 50a45 45 0 0 1 90 0z" fill="#F0522C"/>
    <rect x="4" y="45.5" width="92" height="9" fill="#15110E"/>
    <circle cx="50" cy="50" r="15" fill="#fff" stroke="#15110E" stroke-width="6"/>
    <circle cx="50" cy="50" r="6" fill="#fff" stroke="#15110E" stroke-width="3"/>
  </svg>`;
}
