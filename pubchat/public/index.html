// matched back to this account (for crediting via webhook / dashboard).
function startCheckout(pack){
  if(!pack.url){ toast(T('This pack isn’t set up yet — add its Stripe Payment Link in the code.','แพ็กนี้ยังไม่ถูกตั้งค่า — เพิ่มลิงก์ Stripe ในโค้ด'),3000); return; }
  const u=new URL(pack.url);
  u.searchParams.set('client_reference_id', S.user.uid);
  if(S.user.email) u.searchParams.set('prefilled_email', S.user.email);
  window.location.href = u.toString();
}

function teardown(){
  Object.values(S.unsub).forEach(u=>u&&u());
  clearInterval(S.presenceTimer); clearInterval(S.chatLocTimer); clearInterval(_freeBallTimer); clearInterval(_chatTtlTimer);
}

/* ========================= tiny UI utils ========================= */
function el(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function switchEl(id,checked){ return `<label class="switch"><input type="checkbox" id="${id}" ${checked?'checked':''}><span class="track"></span><span class="thumb"></span></label>`; }
function bindSwitch(id,fn){ const i=$('#'+id); if(i) i.onchange=e=>fn(e.target.checked); }
function emptyState(ic,title,sub){ return `<div class="empty">${icon(ic,48)}<b style="color:var(--text);font-size:17px">${title}</b><span class="small">${sub}</span></div>`; }
function errBox(msg){ return `<div class="card" style="border-color:var(--danger)"><span class="small" style="color:#fca5a5">${msg}</span></div>`; }

/* ===== inline SVG icons (no emoji as icons) ===== */

    radar:`<path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 12 19 5"/><circle cx="12" cy="12" r="5"/>`,
    shuffle:`<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/>`,
    chat:`<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>`,
    user:`<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>`,
    pin:`<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>`,
    coin:`<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3H15"/>`,
    compass:`<circle cx="12" cy="12" r="10"/><path d="m16 8-2 6-6 2 2-6 6-2z"/>`,
    arrow:`<path d="M12 2 4 21l8-5 8 5z" fill="#E7B580" stroke="#1A130C"/>`,
    back:`<path d="m15 18-6-6 6-6"/>`, send:`<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>`,
    more:`<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>`,
    close:`<path d="M18 6 6 18M6 6l12 12"/>`,
    spark:`<path d="M12 2.2V21.8M19.9 7 4.1 17M4.1 7 19.9 17" stroke-width="2.4"/>`,
    check:`<path d="M20 6 9 17l-5-5"/>`,
    globe:`<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>`,
    trash:`<path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/><path d="M10 11v6M14 11v6"/>`,
    clock:`<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>`,
    qr:`<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7M17 21h.01"/>`,
    scan:`<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/>`,
    gift:`<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/><path d="M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5zM12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5z"/>`,
    star:`<path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.7L12 18.7 5.9 21.8l1.2-6.7L2.3 9.5l6.6-.9z"/>`,
    google:`<path d="M21 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.1a4.4 4.4 0 0 1-1.9 2.9v2.4h3.1c1.8-1.7 2.7-4.1 2.7-7.1z" fill="#4285F4" stroke="none"/><path d="M12 21c2.4 0 4.5-.8 6-2.2l-3.1-2.4c-.8.6-1.9.9-2.9.9-2.3 0-4.2-1.5-4.9-3.6H3.9v2.5A9 9 0 0 0 12 21z" fill="#34A853" stroke="none"/><path d="M7.1 13.7a5.4 5.4 0 0 1 0-3.4V7.8H3.9a9 9 0 0 0 0 8.4z" fill="#FBBC05" stroke="none"/><path d="M12 6.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 3.9 7.8l3.2 2.5C7.8 8.1 9.7 6.6 12 6.6z" fill="#EA4335" stroke="none"/>`,

  return `<svg ${s}>${P[name]||''}</svg>`;
}
function ballSVG(kind){
  const grad = kind==='paid'
    ? `<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4D1A1"/><stop offset="1" stop-color="#CE6A44"/></linearGradient></defs>`
    : `<defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7B580"/><stop offset="1" stop-color="#D98A4E"/></linearGradient></defs>`;
  if(kind==='broken') return `<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="38" fill="#26262e" stroke="#3a3a45" stroke-width="3"/><path d="M30 35 45 50 30 60M70 35 55 50 70 62" stroke="#6e6e7a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
  const fill = kind==='paid'?'url(#bg2)':'url(#bg1)';
  return `<svg viewBox="0 0 100 100" width="100%" height="100%">${grad}
    <circle cx="50" cy="50" r="40" fill="${fill}"/>
    <path d="M10 50a40 40 0 0 1 80 0z" fill="#fff" opacity=".92"/>
    <rect x="10" y="46" width="80" height="8" fill="#1A130C"/>
    <circle cx="50" cy="50" r="11" fill="#1A130C"/><circle cx="50" cy="50" r="6" fill="#fff"/>
    ${kind==='paid'?'<circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>':''}</svg>`;
}
// Classic red/white Poké Ball — used for the free chat-ball icon.
function pokeballSVG(size=26){
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block">
    <circle cx="50" cy="50" r="46" fill="#fff" stroke="#15110E" stroke-width="5"/>
    <path d="M5 50a45 45 0 0 1 90 0z" fill="#F0522C"/>
    <rect x="4" y="45.5" width="92" height="9" fill="#15110E"/>
    <circle cx="50" cy="50" r="15" fill="#fff" stroke="#15110E" stroke-width="6"/>
    <circle cx="50" cy="50" r="6" fill="#fff" stroke="#15110E" stroke-width="3"/>
  </svg>`;
}

window.addEventListener('beforeunload', teardown);
</script>
