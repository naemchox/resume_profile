<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Arthid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Firebase SDK — initializes app/auth/db and exposes them on window.firebase -->
    <script type="module" src="./firebase.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        :root {
            /* Wooden palette */
            --wood-grain: url("rail spacer_horizontal.png");
            --wood-deep: #2a1605;
            --wood-frame: #3a2410;
            --wood-ink: #2a1a0a;
            --wood-ink-sub: #6b4520;
            --wood-ink-mute: #a08769;
            --parchment: #f5e6c4;

            /* Brass / gold accents */
            --gold: #d4a043;
            --gold-light: #f5d586;
            --gold-dark: #8a6520;

            --green: #2dc26b;
            --text: #f4f5f7;
            --text-sub: #a4a8b0;
            --text-mute: #74787f;
            --border: #2c2f36;
        }

        html, body { height: 100%; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--wood-ink);
            padding: 32px 24px;
            display: flex;
            align-items: center;
            justify-content: center;

            background-color: var(--wood-deep);
            background-image:
                radial-gradient(ellipse at 50% 35%, rgba(120, 75, 35, 0.45), transparent 55%),
                radial-gradient(ellipse at 50% 65%, rgba(60, 30, 10, 0.55), transparent 60%),
                linear-gradient(180deg, rgba(28, 14, 4, 0.55), rgba(10, 4, 0, 0.85)),
                var(--wood-grain);
            background-size: 100% 100%, 100% 100%, 100% 100%, 360px 270px;
            background-repeat: no-repeat, no-repeat, no-repeat, repeat;
        }

        /* ====================================
           LUXURY WOODEN PLAQUE CARD
        ==================================== */
        .card {
            width: 100%;
            max-width: 440px;
            position: relative;
            padding: 0;
            border-radius: 16px;
            background-color: #4a2e18;
            background-image:
                linear-gradient(180deg, rgba(120, 75, 30, 0.45), rgba(40, 20, 6, 0.55)),
                var(--wood-grain);
            background-size: 100% 100%, 320px 240px;
            background-repeat: no-repeat, repeat;
            box-shadow:
                0 0 0 1px var(--gold-dark) inset,
                0 0 0 3px var(--wood-frame) inset,
                0 0 0 4px var(--gold) inset,
                0 30px 90px rgba(0, 0, 0, 0.75),
                0 12px 40px rgba(212, 160, 67, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: var(--wood-ink);
        }

        /* Inner parchment panel sits on the wooden frame */
        .card-inner {
            margin: 18px;
            padding: 38px 36px 30px;
            border-radius: 10px;
            position: relative;
            width: calc(100% - 36px);
            background-color: var(--parchment);
            background-image:
                linear-gradient(180deg, rgba(255, 250, 230, 0.55), rgba(232, 205, 162, 0.30)),
                var(--wood-grain);
            background-size: 100% 100%, 320px 240px;
            background-repeat: no-repeat, repeat;
            box-shadow:
                0 0 0 1px rgba(212, 160, 67, 0.55) inset,
                0 2px 6px rgba(74, 46, 24, 0.2) inset,
                0 6px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Gold filigree corners on the parchment */
        .card-inner::before, .card-inner::after,
        .card-inner > .corner-tl, .card-inner > .corner-br {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 1.5px solid var(--gold);
            pointer-events: none;
        }
        .card-inner::before {
            top: 8px; left: 8px;
            border-right: none; border-bottom: none;
            border-top-left-radius: 6px;
        }
        .card-inner::after {
            top: 8px; right: 8px;
            border-left: none; border-bottom: none;
            border-top-right-radius: 6px;
        }
        .card-inner > .corner-tl {
            bottom: 8px; left: 8px; top: auto;
            border-right: none; border-top: none;
            border-bottom-left-radius: 6px;
        }
        .card-inner > .corner-br {
            bottom: 8px; right: 8px; top: auto;
            border-left: none; border-top: none;
            border-bottom-right-radius: 6px;
        }

        /* Gold flourish above logo */
        .flourish {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: var(--gold-dark);
            font-size: 11px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .flourish::before, .flourish::after {
            content: '';
            width: 36px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        /* Brass plaque holding the logo */
        .logo {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(255, 215, 130, 0.55), transparent 60%),
                linear-gradient(160deg, #5a3818 0%, #3a2410 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            position: relative;
            box-shadow:
                0 0 0 1.5px var(--gold) inset,
                0 0 0 3px rgba(245, 213, 134, 0.15) inset,
                0 8px 22px rgba(0, 0, 0, 0.55),
                0 0 24px rgba(212, 160, 67, 0.18);
        }
        .logo svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45)); }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: var(--wood-ink);
            margin-bottom: 4px;
            line-height: 1.15;
        }
        h1 em {
            font-style: italic;
            color: var(--gold-dark);
            font-weight: 600;
        }
        .subtitle {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 15px;
            color: var(--wood-ink-sub);
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }

        /* Decorative divider with center diamond */
        .divider {
            width: 100%;
            margin: 4px 0 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gold-dark);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .divider .diamond {
            width: 8px; height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
            box-shadow: 0 0 0 1.5px var(--gold-dark);
        }

        /* ====================================
           LUXURY GOOGLE BUTTON (brass on dark wood)
        ==================================== */
        .google-btn {
            width: 100%;
            background:
                linear-gradient(180deg, rgba(255, 215, 130, 0.05), rgba(0, 0, 0, 0.15)),
                linear-gradient(180deg, #4a2e18, #2a1605);
            border: 1.5px solid var(--gold);
            color: var(--gold-light);
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(245, 213, 134, 0.18) inset,
                0 4px 14px rgba(0, 0, 0, 0.35),
                0 0 22px rgba(212, 160, 67, 0.10);
            transition: transform 0.06s, box-shadow 0.18s, border-color 0.18s, color 0.18s;
        }
        .google-btn:hover {
            border-color: var(--gold-light);
            color: #fff;
            box-shadow:
                0 0 0 1px rgba(245, 213, 134, 0.4) inset,
                0 6px 22px rgba(212, 160, 67, 0.35),
                0 0 36px rgba(212, 160, 67, 0.18);
        }
        .google-btn:active { transform: translateY(1px); }
        .google-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        /* Subtle highlight sweep on hover */
        .google-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 35%, rgba(245, 213, 134, 0.22) 50%, transparent 65%);
            transform: translateX(-110%);
            transition: transform 0.7s ease;
        }
        .google-btn:hover::before { transform: translateX(110%); }

        /* Hidden GSI registration target */
        #g_id_onload { display: none; }
        .g_id_signin { display: none !important; }

        .foot {
            margin-top: 22px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 13px;
            color: var(--wood-ink-mute);
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        .foot strong {
            font-style: normal;
            color: var(--wood-ink-sub);
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .form-error {
            margin-top: 16px;
            font-size: 12.5px;
            color: #6e1e1e;
            background: rgba(180, 60, 60, 0.12);
            border: 1px solid rgba(180, 60, 60, 0.4);
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
            display: none;
            text-align: left;
            font-weight: 500;
        }
        .form-error.show { display: block; }

        /* Shared input (used by the admin overlay) */
        .demo-input {
            background: rgba(255, 248, 220, 0.85);
            border: 1px solid rgba(120, 80, 40, 0.35);
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 13.5px;
            color: var(--wood-ink);
            outline: none;
            font-family: inherit;
            transition: border-color 0.12s, box-shadow 0.12s;
        }
        .demo-input::placeholder { color: var(--wood-ink-mute); }
        .demo-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 160, 67, 0.25);
        }

        /* ============ ADMIN OVERLAY (matches the wood theme) ============ */
        .admin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 8, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }
        .admin-overlay[hidden] { display: none !important; }
        .admin-overlay.open { display: flex; }

        .admin-card {
            width: 100%;
            max-width: 400px;
            position: relative;
            padding: 0;
            border-radius: 14px;
            background-color: #4a2e18;
            background-image:
                linear-gradient(180deg, rgba(120, 75, 30, 0.45), rgba(40, 20, 6, 0.55)),
                var(--wood-grain);
            background-size: 100% 100%, 320px 240px;
            background-repeat: no-repeat, repeat;
            box-shadow:
                0 0 0 1px var(--gold-dark) inset,
                0 0 0 3px var(--wood-frame) inset,
                0 0 0 4px var(--gold) inset,
                0 24px 70px rgba(0, 0, 0, 0.75);
        }
        .admin-card-inner {
            margin: 14px;
            padding: 22px 24px 20px;
            border-radius: 10px;
            background-color: var(--parchment);
            background-image:
                linear-gradient(180deg, rgba(255, 250, 230, 0.55), rgba(232, 205, 162, 0.30)),
                var(--wood-grain);
            background-size: 100% 100%, 320px 240px;
            background-repeat: no-repeat, repeat;
            box-shadow:
                0 0 0 1px rgba(212, 160, 67, 0.45) inset;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-badge {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: var(--wood-deep);
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 1.6px;
            padding: 3px 11px;
            border-radius: 999px;
            text-transform: uppercase;
            border: 1px solid var(--gold-dark);
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .admin-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--wood-ink);
            letter-spacing: 0.2px;
            margin-top: 4px;
        }
        .admin-sub {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 13.5px;
            color: var(--wood-ink-sub);
            margin-bottom: 8px;
        }
        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-submit {
            background: linear-gradient(180deg, #4a2e18, #2a1605);
            color: var(--gold-light);
            border: 1.5px solid var(--gold);
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            font-family: inherit;
            box-shadow:
                0 0 0 1px rgba(245, 213, 134, 0.18) inset,
                0 3px 10px rgba(0,0,0,0.3);
            transition: border-color 0.12s, color 0.12s, transform 0.05s;
        }
        .admin-submit:hover { border-color: var(--gold-light); color: #fff; }
        .admin-submit:active { transform: translateY(1px); }
        .admin-cancel {
            background: none;
            border: none;
            color: var(--wood-ink-mute);
            font-size: 12px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            cursor: pointer;
            padding: 6px;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
        .admin-cancel:hover { color: var(--wood-ink-sub); }
        .admin-error {
            margin-top: 4px;
            font-size: 12px;
            color: #6e1e1e;
            background: rgba(180, 60, 60, 0.12);
            border: 1px solid rgba(180, 60, 60, 0.4);
            border-radius: 8px;
            padding: 8px 12px;
            display: none;
        }
        .admin-error.show { display: block; }

        @media (max-width: 480px) {
            body { padding: 18px; }
            .card-inner { padding: 30px 24px 24px; margin: 14px; width: calc(100% - 28px); }
            .admin-card-inner { padding: 18px 18px 18px; }
            h1 { font-size: 26px; }
            .subtitle { font-size: 13.5px; }
            .logo { width: 64px; height: 64px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="card-inner">
            <span class="corner-tl" aria-hidden="true"></span>
            <span class="corner-br" aria-hidden="true"></span>

            <div class="flourish">Est.&nbsp;MMXXVI</div>

            <div class="logo" aria-hidden="true">
                <!-- Tally-mark style mark in green, with a yellow strike-through. -->
                <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
                    <line x1="6"  y1="6" x2="6"  y2="26" stroke="#2dc26b" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="11" y1="6" x2="11" y2="26" stroke="#2dc26b" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="16" y1="6" x2="16" y2="26" stroke="#2dc26b" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="21" y1="6" x2="21" y2="26" stroke="#2dc26b" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="3"  y1="22" x2="25" y2="9" stroke="#f5d586" stroke-width="2.6" stroke-linecap="round"/>
                </svg>
            </div>

            <h1>Welcome to <em>Arthid</em></h1>
            <div class="subtitle">Sign in — or we&rsquo;ll create your account</div>

            <div class="divider" aria-hidden="true"><span class="diamond"></span></div>

            <!-- Hidden GSI element registers the callback for the credential. -->
            <div id="g_id_onload"
                 data-callback="handleGoogleCredential"
                 data-auto_prompt="false"
                 data-context="signin"
                 data-ux_mode="popup"></div>
            <div class="g_id_signin" data-type="standard"></div>

            <button type="button" class="google-btn" id="google-btn" aria-label="Continue with Google">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <div class="form-error" id="form-error"></div>

            <div class="foot">
                <strong>A private parlour for your conversations.</strong><br>
                Sign in with your Google account &mdash; your data stays on this device.
            </div>
        </div>
    </main>

    <!-- ============ ADMIN (developer) login overlay ============
         Hidden by default. Triggered by the secret chord
         Ctrl+Shift+,  then  Ctrl+Shift+.  on the auth page.
    ===================================================== -->
    <div class="admin-overlay" id="admin-overlay" hidden>
        <div class="admin-card">
            <div class="admin-card-inner">
                <div class="admin-badge">Admin</div>
                <h2 class="admin-title">Developer Login</h2>
                <p class="admin-sub">Restricted &mdash; for build &amp; QA sessions only.</p>
                <form class="admin-form" id="admin-form" autocomplete="off">
                    <input class="demo-input admin-input" id="admin-user" type="text" placeholder="Username" autocomplete="off" autocapitalize="off" spellcheck="false">
                    <input class="demo-input admin-input" id="admin-pass" type="password" placeholder="Password" autocomplete="off">
                    <button class="admin-submit" type="submit">Sign in as admin</button>
                    <button class="admin-cancel" type="button" id="admin-cancel">Cancel</button>
                </form>
                <div class="admin-error" id="admin-error"></div>
            </div>
        </div>
    </div>

    <script>
    // ============================================================
    //  Sign-in flows are powered by Firebase Auth (see firebase.js).
    //  - Google: signInWithPopup(GoogleAuthProvider)
    //  - Admin:  email/password against patwan@arthid.dev (auto-created
    //            on first login if it doesn't exist)
    //  After a successful sign-in we mirror a small profile blob into
    //  localStorage so the legacy app code in index3.html keeps working
    //  unchanged. Firebase remains the source of truth.
    // ============================================================

    const STORAGE_KEY    = 'arthid-user';
    const ADMIN_USERNAME = 'patwan';
    const ADMIN_PASSWORD = 'patwan';
    const ADMIN_EMAIL    = 'patwan@arthid.dev';

    const errorEl = document.getElementById('form-error');
    function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('show'); }
    function clearError()   { errorEl.textContent = ''; errorEl.classList.remove('show'); }

    function initialsFor(name) {
        return (name || 'ME').trim().split(/\s+/).filter(Boolean)
            .slice(0, 2).map(p => p[0]).join('').toUpperCase() || 'ME';
    }

    function mirrorUserAndEnter(fbUser, extras = {}) {
        const isAdmin = fbUser.email === ADMIN_EMAIL || extras.isAdmin === true;
        const name = extras.name
            || fbUser.displayName
            || (isAdmin ? 'Patwan (admin)' : (fbUser.email || '').split('@')[0])
            || 'My Name';
        const user = {
            uid: fbUser.uid,
            email: fbUser.email,
            name,
            picture: fbUser.photoURL || null,
            sub: fbUser.uid,
            signedInAt: new Date().toISOString(),
            method: extras.method || (isAdmin ? 'admin' : 'google'),
            isAdmin,
        };
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
            const existingProfile = JSON.parse(localStorage.getItem('arthid-profile') || '{}');
            localStorage.setItem('arthid-profile', JSON.stringify(Object.assign({}, existingProfile, {
                name: user.name,
                email: user.email,
                initials: initialsFor(user.name),
            })));
        } catch {}
        window.location.replace('index3.html');
    }

    // Wait for the Firebase module (loaded as type="module") to expose its
    // SDK on window.firebase. The module dispatches a `firebase-ready` event;
    // we also handle the case where it's already ready by the time we run.
    function whenFirebaseReady() {
        return new Promise(resolve => {
            if (window.firebase) return resolve(window.firebase);
            window.addEventListener('firebase-ready', () => resolve(window.firebase), { once: true });
        });
    }

    // ============================================================
    //  GOOGLE SIGN-IN — Firebase popup flow
    // ============================================================
    const googleBtn = document.getElementById('google-btn');
    googleBtn.addEventListener('click', async () => {
        clearError();
        googleBtn.disabled = true;
        try {
            const fb = await whenFirebaseReady();
            const provider = new fb.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            const { user } = await fb.signInWithPopup(fb.auth, provider);
            mirrorUserAndEnter(user, { method: 'google' });
        } catch (err) {
            // popup-closed-by-user / cancelled-popup-request are normal user actions
            const code = err && err.code;
            if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
                // silent — the user backed out
            } else if (code === 'auth/popup-blocked') {
                showError('Your browser blocked the Google popup. Allow popups for this site and try again.');
            } else if (code === 'auth/unauthorized-domain') {
                showError('This origin is not in Firebase’s authorized domains list. Add it under Authentication → Settings.');
            } else {
                showError('Google sign-in failed: ' + (err && (err.message || err.code) || 'unknown error'));
                console.error('[auth] google sign-in failed', err);
            }
            googleBtn.disabled = false;
        }
    });

    // ============================================================
    //  ADMIN secret shortcut — for build/QA login during development
    //  Trigger: Ctrl+Shift+,  then  Ctrl+Shift+.  (within 1.5s)
    //  Uses event.code so it works on any keyboard layout.
    //  Credentials: patwan / patwan  (mapped to patwan@arthid.dev in Firebase)
    // ============================================================
    const adminOverlay = document.getElementById('admin-overlay');
    const adminForm    = document.getElementById('admin-form');
    const adminUserEl  = document.getElementById('admin-user');
    const adminPassEl  = document.getElementById('admin-pass');
    const adminErrEl   = document.getElementById('admin-error');
    const adminCancel  = document.getElementById('admin-cancel');

    function openAdminOverlay() {
        adminOverlay.hidden = false;
        adminOverlay.classList.add('open');
        adminErrEl.textContent = '';
        adminErrEl.classList.remove('show');
        adminUserEl.value = '';
        adminPassEl.value = '';
        setTimeout(() => adminUserEl.focus(), 0);
    }
    function closeAdminOverlay() {
        adminOverlay.classList.remove('open');
        adminOverlay.hidden = true;
    }

    let chordArmed = false;
    let chordTimer = null;
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && e.code === 'Comma') {
            chordArmed = true;
            clearTimeout(chordTimer);
            chordTimer = setTimeout(() => { chordArmed = false; }, 1500);
            e.preventDefault();
            return;
        }
        if (chordArmed && e.ctrlKey && e.shiftKey && e.code === 'Period') {
            chordArmed = false;
            clearTimeout(chordTimer);
            e.preventDefault();
            openAdminOverlay();
            return;
        }
        if (e.key === 'Escape' && !adminOverlay.hidden) {
            closeAdminOverlay();
        }
    });

    adminCancel.addEventListener('click', closeAdminOverlay);
    adminOverlay.addEventListener('click', (e) => {
        if (e.target === adminOverlay) closeAdminOverlay();
    });

    function showAdminError(msg) {
        adminErrEl.textContent = msg;
        adminErrEl.classList.add('show');
        adminPassEl.value = '';
        adminPassEl.focus();
    }

    adminForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        adminErrEl.textContent = '';
        adminErrEl.classList.remove('show');
        const u = adminUserEl.value.trim();
        const p = adminPassEl.value;
        if (u !== ADMIN_USERNAME || p !== ADMIN_PASSWORD) {
            showAdminError('Invalid username or password.');
            return;
        }
        const submitBtn = adminForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
            const fb = await whenFirebaseReady();
            let cred;
            try {
                cred = await fb.signInWithEmailAndPassword(fb.auth, ADMIN_EMAIL, ADMIN_PASSWORD);
            } catch (err) {
                // First time on this Firebase project — create the admin account.
                if (err && (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')) {
                    cred = await fb.createUserWithEmailAndPassword(fb.auth, ADMIN_EMAIL, ADMIN_PASSWORD);
                } else {
                    throw err;
                }
            }
            mirrorUserAndEnter(cred.user, { method: 'admin', name: 'Patwan (admin)', isAdmin: true });
        } catch (err) {
            console.error('[auth] admin sign-in failed', err);
            showAdminError('Admin sign-in failed: ' + (err && (err.message || err.code) || 'unknown error'));
            submitBtn.disabled = false;
        }
    });

    // ============================================================
    //  Already signed in? Skip straight to the app. Firebase auth
    //  state is the source of truth — but we also honour a stale
    //  localStorage entry for an instant redirect (no flash).
    // ============================================================
    try {
        const cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (cached && cached.email) window.location.replace('index3.html');
    } catch {}

    whenFirebaseReady().then(fb => {
        fb.onAuthStateChanged(fb.auth, user => {
            if (user) mirrorUserAndEnter(user);
        });
    });
    </script>
</body>
</html>
