<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>เข้าสู่ระบบ · Sample Sports Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="card login-card">
      <h1>Sample Sports</h1>
      <p class="sub">ระบบจัดการเว็บไซต์ สมาคมกีฬาตัวอย่าง</p>

      <div class="setup-banner" id="setup-banner" hidden><strong>ยังไม่ได้ตั้งค่า Firebase</strong>เข้าสู่ระบบไม่ได้จนกว่าจะใส่ค่าใน admin/js/firebase-config.js · <a href="index.html">ดูหน้าตาระบบ</a></div>
      <div class="form-error" id="form-error" role="alert" hidden></div>
      <div class="denied-info" id="denied-info" hidden>
        ถ้าต้องการสิทธิ์ ส่งรหัสนี้ให้ผู้ดูแลระบบเพิ่มใน <code>admins</code>
        <div class="uid-row">
          <code id="denied-uid"></code>
          <button type="button" class="btn btn-secondary btn-sm" id="copy-uid">คัดลอก</button>
        </div>
      </div>

      <button type="button" class="btn btn-google" id="login-btn" data-write>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span id="login-label">เข้าสู่ระบบด้วย Google</span>
      </button>
      <p class="login-note">เฉพาะบัญชี Gmail ที่ได้รับสิทธิ์จากสมาคมเท่านั้น</p>
    </div>
  </div>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
