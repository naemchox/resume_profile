<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ข่าว · Sample Sports Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="is-checking">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="backdrop" id="backdrop"></div>
    <div class="main">
      <main class="content">
        <div class="page-head">
          <div>
            <h1>ข่าว</h1>
            <p>Announcement · Press Release · Social &amp; Community · Competition</p>
          </div>
          <button class="btn btn-primary" id="add-btn" data-write>+ เพิ่มข่าว</button>
        </div>

        <div class="toolbar">
          <input type="search" class="search" id="search" placeholder="ค้นหาชื่อข่าว…">
          <select id="filter-category" style="width:auto">
            <option value="">ทุกหมวด</option>
          </select>
          <select id="filter-status" style="width:auto">
            <option value="">ทุกสถานะ</option>
            <option value="published">เผยแพร่</option>
            <option value="draft">ฉบับร่าง</option>
          </select>
        </div>

        <div class="table-wrap">
          <table class="list">
            <thead>
              <tr><th style="width:90px">รูป</th><th>ชื่อข่าว</th><th>หมวด</th><th>สถานะ</th><th>วันที่เผยแพร่</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty-state" id="empty">ยังไม่มีข้อมูล</div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="edit-dialog">
    <form class="dlg" id="edit-form" novalidate>
      <div class="dlg-head">
        <h2 id="dlg-title">เพิ่มข่าว</h2>
        <button type="button" class="dlg-close" data-close aria-label="ปิด">×</button>
      </div>
      <div class="dlg-body">
        <div class="field">
          <label for="f-title">ชื่อข่าว <span class="req">*</span></label>
          <input type="text" id="f-title" maxlength="200" required>
        </div>
        <div class="row">
          <div class="field">
            <label for="f-category">หมวด <span class="req">*</span></label>
            <select id="f-category" required></select>
          </div>
          <div class="field">
            <label for="f-date">วันที่เผยแพร่</label>
            <input type="date" id="f-date">
          </div>
        </div>
        <div class="field">
          <label for="f-excerpt">สรุปสั้น (แสดงในการ์ดข่าว) <span class="counter" id="excerpt-count">0/200</span></label>
          <textarea id="f-excerpt" rows="3" style="min-height:80px" maxlength="200"></textarea>
        </div>
        <div class="field">
          <label for="f-body">เนื้อหา</label>
          <textarea id="f-body" rows="10"></textarea>
          <div class="hint">เว้นบรรทัดว่าง 1 บรรทัดเพื่อขึ้นย่อหน้าใหม่</div>
        </div>
        <div class="field">
          <span class="label">รูปหน้าปก</span>
          <div class="image-field" id="cover-field">
            <img alt="" hidden>
            <div class="empty">ยังไม่มีรูป</div>
            <input type="file" accept="image/*">
            <button type="button" class="btn btn-secondary btn-sm" data-pick>เลือกรูป</button>
            <div class="hint">ระบบย่อรูปให้อัตโนมัติ (ด้านยาวสุด 1920px)</div>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="f-featured"> ข่าวเด่น (แสดงเป็นข่าวใหญ่บนหน้าแรก)</label>
      </div>
      <div class="dlg-foot">
        <button type="button" class="btn btn-secondary" data-close>ยกเลิก</button>
        <button type="button" class="btn btn-secondary" id="preview-btn">ดูตัวอย่าง</button>
        <span class="spacer"></span>
        <button type="submit" class="btn btn-secondary" value="draft" data-write>บันทึกร่าง</button>
        <button type="submit" class="btn btn-primary" value="published" data-write>เผยแพร่</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/pages/news.js"></script>
</body>
</html>
